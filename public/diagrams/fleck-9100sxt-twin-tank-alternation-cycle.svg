<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-labelledby="f91-title f91-desc">
<title id="f91-title">Fleck 9100SXT twin-tank alternation cycle</title>
<desc id="f91-desc">Three-step diagram of a Fleck 9100SXT twin-tank water softener: tank A softens while tank B stands by, the meter switches service to tank B when A's capacity is used and A regenerates with soft water and brine, then B softens while A stands by.</desc>
<defs><marker id="f91-ah-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="f91-ah-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="f91-ah-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="610" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Fleck 9100SXT: how the two tanks take turns</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">One valve, one meter, two resin tanks and one brine tank. Only one tank is ever in service.</text>
<rect x="30" y="84" width="224" height="432" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="42" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">1. Tank A in service</text>
<rect x="74" y="150" width="112" height="28" rx="5" fill="#ecfeff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="130" y="169" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">9100SXT valve</text>
<path class="ln" d="M36,164 L70,164" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#f91-ah-h)"/>
<path class="ln" d="M190,164 L244,164" fill="none" stroke="#0e7490" stroke-width="5" marker-end="url(#f91-ah-s)"/>
<text x="38" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c">Hard in</text><text x="246" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#0e7490">Soft out</text>
<rect x="64" y="200" width="52" height="170" rx="20" fill="#dbeafe" stroke="#0e7490" stroke-width="3" />
<text x="90" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">A</text>
<text x="90" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">In service</text>
<rect x="146" y="200" width="52" height="170" rx="20" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="172" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">B</text>
<text x="172" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Standby, full</text>
<rect x="210" y="300" width="36" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="228" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Brine</text>
<text x="42" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Tank A softens the house supply.</text>
<text x="42" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Tank B waits, already regenerated.</text>
<rect x="270" y="84" width="224" height="432" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="282" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2. Meter reaches A’s capacity</text>
<rect x="314" y="150" width="112" height="28" rx="5" fill="#ecfeff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="370" y="169" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">9100SXT valve</text>
<path class="ln" d="M276,164 L310,164" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#f91-ah-h)"/>
<path class="ln" d="M430,164 L484,164" fill="none" stroke="#0e7490" stroke-width="5" marker-end="url(#f91-ah-s)"/>
<text x="278" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c">Hard in</text><text x="486" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#0e7490">Soft out</text>
<rect x="304" y="200" width="52" height="170" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" />
<text x="330" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">A</text>
<text x="330" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">Regenerating</text>
<rect x="386" y="200" width="52" height="170" rx="20" fill="#dbeafe" stroke="#0e7490" stroke-width="3" />
<text x="412" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">B</text>
<text x="412" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">In service</text>
<rect x="450" y="300" width="36" height="70" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="468" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Brine</text>
<path class="ln" d="M468,300 L468,190 L340,190 L340,198" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#f91-ah-b)"/>
<path class="ln" d="M384,240 L360,240" fill="none" stroke="#0e7490" stroke-width="4" stroke-dasharray="6 3" marker-end="url(#f91-ah-s)"/>
<text x="282" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">The valve switches to B at once,</text>
<text x="282" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">then regenerates A using soft</text>
<text x="282" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">water from B and brine.</text>
<rect x="510" y="84" width="224" height="432" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="522" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">3. Tank B in service</text>
<rect x="554" y="150" width="112" height="28" rx="5" fill="#ecfeff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="610" y="169" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">9100SXT valve</text>
<path class="ln" d="M516,164 L550,164" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#f91-ah-h)"/>
<path class="ln" d="M670,164 L724,164" fill="none" stroke="#0e7490" stroke-width="5" marker-end="url(#f91-ah-s)"/>
<text x="518" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c">Hard in</text><text x="726" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#0e7490">Soft out</text>
<rect x="544" y="200" width="52" height="170" rx="20" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="570" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">A</text>
<text x="570" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Standby, full</text>
<rect x="626" y="200" width="52" height="170" rx="20" fill="#dbeafe" stroke="#0e7490" stroke-width="3" />
<text x="652" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">B</text>
<text x="652" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">In service</text>
<rect x="690" y="300" width="36" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="708" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Brine</text>
<text x="522" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">B softens; A waits, full.</text>
<text x="522" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Reserve covers only the</text>
<text x="522" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">regeneration water; no</text>
<text x="522" y="497" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">hard-water window at night.</text>
<rect x="30" y="536" width="18" height="14" fill="#dbeafe" stroke="#0e7490" stroke-width="2"/><text x="56" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Softening the supply</text>
<rect x="230" y="536" width="18" height="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="256" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Regenerating (brine, then soft-water rinse)</text>
<rect x="560" y="536" width="18" height="14" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="4 3"/><text x="586" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Standby</text>
<text x="30" y="588" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Simplified: internal ports not shown. The dashed arrow is soft water from the in-service tank used for regeneration.</text>
</svg>
