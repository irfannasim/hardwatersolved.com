<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="twg-title twg-desc">
<title id="twg-title">Temporary vs permanent hardness: calcium and magnesium paired with bicarbonate, sulfate and chloride</title>
<desc id="twg-desc">Grid of the six common hardness pairs. Calcium and magnesium bicarbonate are temporary hardness that heat can partly remove. Calcium and magnesium sulfate and chloride are permanent hardness that stays dissolved when boiled. An ion exchange softener removes the calcium and magnesium from all six pairs.</desc>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Which hardness is temporary and which is permanent</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">The metal makes the water hard. Its partner ion decides whether heat can remove it.</text>
<rect class="box" x="170" y="82" width="180" height="32" fill="#c2410c"/>
<text x="260" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">TEMPORARY</text>
<rect class="box" x="360" y="82" width="370" height="32" fill="#52697a"/>
<text x="545" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PERMANENT</text>
<text x="260" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Bicarbonate (HCO₃⁻)</text>
<text x="450" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Sulfate (SO₄²⁻)</text>
<text x="640" y="138" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Chloride (Cl⁻)</text>
<text x="30" y="192" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Calcium</text>
<text x="30" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Ca²⁺</text>
<text x="30" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Magnesium</text>
<text x="30" y="312" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Mg²⁺</text>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<rect class="box" x="170" y="155" width="180" height="80" fill="#fdeee6" stroke="#c2410c" stroke-width="2"/>
<text x="260" y="186" font-size="14" font-weight="bold" fill="#0b2f4a">Calcium bicarbonate</text>
<text x="260" y="206" font-size="13" fill="#c2410c">Heat turns it into</text>
<text x="260" y="222" font-size="13" fill="#c2410c">calcium carbonate scale</text>
<rect class="box" x="360" y="155" width="180" height="80" fill="#f1f5f9" stroke="#52697a" stroke-width="2"/>
<text x="450" y="186" font-size="14" font-weight="bold" fill="#0b2f4a">Calcium sulfate</text>
<text x="450" y="206" font-size="13" fill="#52697a">Stays dissolved when</text>
<text x="450" y="222" font-size="13" fill="#52697a">boiled; spots on drying</text>
<rect class="box" x="550" y="155" width="180" height="80" fill="#f1f5f9" stroke="#52697a" stroke-width="2"/>
<text x="640" y="186" font-size="14" font-weight="bold" fill="#0b2f4a">Calcium chloride</text>
<text x="640" y="206" font-size="13" fill="#52697a">Stays dissolved when</text>
<text x="640" y="222" font-size="13" fill="#52697a">boiled; spots on drying</text>
<rect class="box" x="170" y="255" width="180" height="80" fill="#fdeee6" stroke="#c2410c" stroke-width="2"/>
<text x="260" y="286" font-size="14" font-weight="bold" fill="#0b2f4a">Magnesium bicarbonate</text>
<text x="260" y="306" font-size="13" fill="#c2410c">Heat removes little;</text>
<text x="260" y="322" font-size="13" fill="#c2410c">MgCO₃ is more soluble</text>
<rect class="box" x="360" y="255" width="180" height="80" fill="#f1f5f9" stroke="#52697a" stroke-width="2"/>
<text x="450" y="286" font-size="14" font-weight="bold" fill="#0b2f4a">Magnesium sulfate</text>
<text x="450" y="306" font-size="13" fill="#52697a">Stays dissolved;</text>
<text x="450" y="322" font-size="13" fill="#52697a">bitter at high levels</text>
<rect class="box" x="550" y="255" width="180" height="80" fill="#f1f5f9" stroke="#52697a" stroke-width="2"/>
<text x="640" y="286" font-size="14" font-weight="bold" fill="#0b2f4a">Magnesium chloride</text>
<text x="640" y="306" font-size="13" fill="#52697a">Stays dissolved when</text>
<text x="640" y="322" font-size="13" fill="#52697a">boiled; spots on drying</text>
</g>
<rect class="box" x="170" y="365" width="560" height="70" fill="#e6f4f7" stroke="#0e7490" stroke-width="2"/>
<text x="450" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0e7490">Ion exchange softener: removes Ca²⁺ and Mg²⁺ from all six pairs</text>
<text x="450" y="417" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">The partner ions stay in the water, now paired with sodium, which forms no scale</text>
<text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Both types count in total hardness and both react with soap. Nitrate pairs behave like chloride.</text>
</svg>
