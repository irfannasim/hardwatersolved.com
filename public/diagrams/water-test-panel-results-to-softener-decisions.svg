<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="wtp-title wtp-desc">
<title id="wtp-title">Water test panel before a softener: which result changes which decision</title>
<desc id="wtp-desc">Eight water tests mapped to the equipment decision each one changes before buying a softener: hardness sets size, iron and manganese set the allowance or an iron filter, pH a neutralizer, chlorine the resin grade or carbon, turbidity a sediment prefilter, TDS a baseline, bacteria disinfection and nitrate an RO or anion unit. Chlorine and turbidity are the tests most often skipped.</desc>
<defs>
<marker id="wtp-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker>
</defs>
<rect width="760" height="590" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Each test on the panel changes one decision</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">The tag shows which panel carries the test: city water, a private well, or both.</text>
<text x="30" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">TEST</text>
<text x="390" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">WHAT THE RESULT DECIDES</text>
<rect class="box" x="30" y="108" width="270" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Hardness</text>
<text x="288" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">both</text>
<path class="ln" d="M302,130 L384,130" stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#wtp-ah)"/>
<rect class="box" x="390" y="108" width="340" height="44" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="404" y="135" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Softener size and hardness setting</text>
<rect class="box" x="30" y="162" width="270" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="189" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Iron and manganese</text>
<text x="288" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">well</text>
<path class="ln" d="M302,184 L384,184" stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#wtp-ah)"/>
<rect class="box" x="390" y="162" width="340" height="44" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="404" y="189" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Iron allowance, or an iron filter first</text>
<rect class="box" x="30" y="216" width="270" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="243" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">pH</text>
<text x="288" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">well</text>
<path class="ln" d="M302,238 L384,238" stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#wtp-ah)"/>
<rect class="box" x="390" y="216" width="340" height="44" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="404" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Neutralizer ahead of the softener</text>
<rect class="box" x="30" y="270" width="270" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="44" y="297" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Free and total chlorine</text>
<text x="288" y="297" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">city</text>
<path class="ln" d="M302,292 L384,292" stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#wtp-ah)"/>
<rect class="box" x="390" y="270" width="340" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="404" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Standard or 10% resin, or carbon first</text>
<rect class="box" x="30" y="324" width="270" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="44" y="351" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Turbidity</text>
<text x="288" y="351" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">well</text>
<path class="ln" d="M302,346 L384,346" stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#wtp-ah)"/>
<rect class="box" x="390" y="324" width="340" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="404" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Sediment prefilter and its micron rating</text>
<rect class="box" x="30" y="378" width="270" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="405" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">TDS</text>
<text x="288" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">both</text>
<path class="ln" d="M302,400 L384,400" stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#wtp-ah)"/>
<rect class="box" x="390" y="378" width="340" height="44" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="404" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Baseline only: a softener won't lower it</text>
<rect class="box" x="30" y="432" width="270" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="459" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Coliform bacteria</text>
<text x="288" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">well</text>
<path class="ln" d="M302,454 L384,454" stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#wtp-ah)"/>
<rect class="box" x="390" y="432" width="340" height="44" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="404" y="459" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Disinfection, with UV last in the line</text>
<rect class="box" x="30" y="486" width="270" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="513" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Nitrate</text>
<text x="288" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">well</text>
<path class="ln" d="M302,508 L384,508" stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#wtp-ah)"/>
<rect class="box" x="390" y="486" width="340" height="44" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="404" y="513" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">RO or anion unit: a softener does nothing</text>
<rect x="30" y="554" width="14" height="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="52" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">the two tests most often skipped</text>
<rect x="290" y="554" width="14" height="14" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="312" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">equipment decision the result settles</text>
</svg>
