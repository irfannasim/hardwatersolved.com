<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="wsr-title wsr-desc">
<title id="wsr-title">Water softener brine and wastewater treatment: what each stage removes</title>
<desc id="wsr-desc">Illustrative line chart. Suspended solids and organic load fall steeply through primary settling and biological treatment to a few percent in the final effluent, while chloride from water softener brine stays at 100 percent at every stage.</desc>
<defs></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">What is left after each wastewater treatment stage</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative typical values, as a share of what arrived in raw sewage</text><line x1="120" y1="390" x2="690" y2="390" stroke="#e2e8f0" stroke-width="1"/><text x="108" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0%</text><line x1="120" y1="320" x2="690" y2="320" stroke="#e2e8f0" stroke-width="1"/><text x="108" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">25%</text><line x1="120" y1="250" x2="690" y2="250" stroke="#e2e8f0" stroke-width="1"/><text x="108" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">50%</text><line x1="120" y1="180" x2="690" y2="180" stroke="#e2e8f0" stroke-width="1"/><text x="108" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">75%</text><line x1="120" y1="110" x2="690" y2="110" stroke="#e2e8f0" stroke-width="1"/><text x="108" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">100%</text><text x="120" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Raw</text><text x="120" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">sewage</text><text x="310" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">After primary</text><text x="310" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">settling</text><text x="500" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">After biological</text><text x="500" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">treatment</text><text x="690" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Final</text><text x="690" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">effluent</text><path class="ln" d="M120,110 L310,278 L500,373.2 L690,381.6" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="110" r="5" fill="#78716c"/><circle cx="310" cy="278" r="5" fill="#78716c"/><circle cx="500" cy="373.2" r="5" fill="#78716c"/><circle cx="690" cy="381.6" r="5" fill="#78716c"/><path class="ln" d="M120,110 L310,194 L500,350.8 L690,370.4" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="110" r="5" fill="#b45309"/><circle cx="310" cy="194" r="5" fill="#b45309"/><circle cx="500" cy="350.8" r="5" fill="#b45309"/><circle cx="690" cy="370.4" r="5" fill="#b45309"/><path class="ln" d="M120,110 L310,110 L500,110 L690,110" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="110" r="5" fill="#7c3aed"/><circle cx="310" cy="110" r="5" fill="#7c3aed"/><circle cx="500" cy="110" r="5" fill="#7c3aed"/><circle cx="690" cy="110" r="5" fill="#7c3aed"/><text x="500" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c3aed">Chloride: 100% at every stage</text><rect x="120" y="470" width="26" height="6" rx="3" fill="#78716c"/><text x="154" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Suspended solids</text><rect x="312" y="470" width="26" height="6" rx="3" fill="#b45309"/><text x="346" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Organic load (BOD)</text><rect x="518" y="470" width="26" height="6" rx="3" fill="#7c3aed"/><text x="552" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Chloride</text>
</svg>
