<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="gpp-title gpp-desc">
<title id="gpp-title">Water softener salt efficiency by salt dose: grains removed per pound of salt</title>
<desc id="gpp-desc">Line chart from Hellenbrand's published capacity table for one cubic foot of softener resin. Salt efficiency falls from 4,228 grains per pound at 3.3 lb to 3,822 at 6 lb, 2,806 at 10 lb and 2,154 at 15 lb, the dose behind the advertised grain rating. Only the two lower doses clear the NSF/ANSI 44 efficiency line of 3,350 grains per pound.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">More salt per cycle, less work from each pound</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Grains of hardness removed per pound of salt, 1 cu ft of resin, Hellenbrand's published table</text>
<path class="ln" d="M110,120 L110,380 L610,380" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="100" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">1,500</text>
<text x="100" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">2,500</text>
<text x="100" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">3,500</text>
<text x="100" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">4,500</text>
<path class="ln" d="M110,232 L610,232" stroke="#15803d" stroke-width="2" stroke-dasharray="8 5" fill="none"/>
<text x="618" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#15803d">NSF/ANSI 44</text>
<text x="618" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">3,350 grains/lb</text>
<path class="ln" d="M213,162 L297,194 L422,276 L579,328" stroke="#0e7490" stroke-width="5" fill="none" stroke-linejoin="round"/>
<circle cx="213" cy="162" r="7" fill="#0e7490"/>
<circle cx="297" cy="194" r="7" fill="#0e7490"/>
<circle cx="422" cy="276" r="7" fill="#0e7490"/>
<circle cx="579" cy="328" r="8" fill="#dc2626"/>
<text x="225" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Efficient: 4,228</text>
<text x="312" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Low (factory): 3,822</text>
<text x="438" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Medium: 2,806</text>
<text x="570" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#dc2626">High, the grain rating: 2,154</text>
<path class="ln" d="M110,380 L110,387" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M204,380 L204,387" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M298,380 L298,387" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M391,380 L391,387" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M485,380 L485,387" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M579,380 L579,387" stroke="#3a5a72" stroke-width="1.5"/>
<text x="110" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="204" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">3</text>
<text x="298" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">6</text>
<text x="391" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">9</text>
<text x="485" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">12</text>
<text x="579" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">15</text>
<text x="360" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#52697a">Salt dose (lb per cubic foot of resin)</text>
<text x="30" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Capacity per cu ft: 13,952 at 3.3 lb, 22,930 at 6 lb, 28,060 at 10 lb, 32,310 at 15 lb</text>
