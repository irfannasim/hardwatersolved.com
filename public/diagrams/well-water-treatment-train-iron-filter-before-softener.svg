<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" width="760" height="522" role="img" aria-labelledby="itt-title itt-desc">
<title id="itt-title">Well water treatment train: iron filter before the water softener</title>
<desc id="itt-desc">Well water treatment order: pressure tank, coarse sediment screen, pH neutralizer if needed, iron filter, water softener, then UV or polishing, with what each stage protects and why reversing the softener and iron filter fails.</desc>
<defs><marker id="itt-m" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="itt-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="itt-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="itt-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="522" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Well water treatment order: iron filter before the softener</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Each stage protects the one after it</text><text x="30" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from well pump</text><text x="730" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">to house</text><path class="ln" d="M136,95 L612,95" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#itt-m)"/><text x="30" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">PROTECTS</text><rect class="box" x="30" y="118" width="96" height="92" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><circle cx="78" cy="140" r="12" fill="#3a5a72"/><text x="78" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="78" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pressure</text><text x="78" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">tank</text><text x="78" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">pump surges</text><path class="ln" d="M128,164 L142,164" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#itt-h)"/><rect class="box" x="151" y="118" width="96" height="92" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><circle cx="199" cy="140" r="12" fill="#3a5a72"/><text x="199" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="199" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text><text x="199" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">screen</text><text x="199" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">valve seals,</text>
<text x="199" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">pistons: sand</text>
<text x="199" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">and grit</text><path class="ln" d="M249,164 L263,164" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#itt-h)"/><rect class="box" x="272" y="118" width="96" height="92" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2" stroke-dasharray="6 4"/><circle cx="320" cy="140" r="12" fill="#3a5a72"/><text x="320" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="320" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">pH</text><text x="320" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">neutralizer</text><text x="320" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">iron media</text>
<text x="320" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">need pH in</text>
<text x="320" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">working range</text><path class="ln" d="M370,164 L384,164" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#itt-h)"/><rect class="box" x="393" y="118" width="96" height="92" rx="8" fill="#f8fafc" stroke="#b45309" stroke-width="2"/><circle cx="441" cy="140" r="12" fill="#b45309"/><text x="441" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="441" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron</text><text x="441" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">filter</text><text x="441" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">resin: iron</text>
<text x="441" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">coating and</text>
<text x="441" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">clogging</text><path class="ln" d="M491,164 L505,164" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#itt-h)"/><rect class="box" x="514" y="118" width="96" height="92" rx="8" fill="#f8fafc" stroke="#0e7490" stroke-width="2"/><circle cx="562" cy="140" r="12" fill="#0e7490"/><text x="562" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">5</text><text x="562" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water</text><text x="562" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text><text x="562" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">house and</text>
<text x="562" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">water heater:</text>
<text x="562" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">hardness</text><path class="ln" d="M612,164 L626,164" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#itt-s)"/><rect class="box" x="635" y="118" width="96" height="92" rx="8" fill="#f8fafc" stroke="#0e7490" stroke-width="2"/><circle cx="683" cy="140" r="12" fill="#0e7490"/><text x="683" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">6</text><text x="683" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">UV /</text><text x="683" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">polishing</text><text x="683" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">drinking</text>
<text x="683" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">water</text><text x="320" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="middle" fill="#52697a">only if pH is low</text><rect class="box" x="30" y="364" width="700" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="50" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">REVERSED: softener before the iron filter</text><text x="50" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">• Oxidized iron clogs the resin; brine regeneration cannot wash it out.</text>
<text x="50" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">• Dissolved iron coats the beads; capacity drops cycle after cycle.</text>
<text x="50" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">• The iron filter downstream sees only what the fouled softener let through.</text><rect x="30" y="498" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated water</text>
<rect x="230" y="498" width="26" height="6" rx="3" fill="#0e7490"/><text x="264" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text>
</svg>
