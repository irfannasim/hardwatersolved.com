<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" width="760" height="680" role="img" aria-labelledby="wrp-title wrp-desc">
<title id="wrp-title">Water softener planning during a remodel: six-phase timeline</title>
<desc id="wrp-desc">Timeline for adding or protecting a water softener during a remodel: design decisions, bypassing before demolition, protection from dust and freezing, rough-in of loop, drain and outlet, pressure testing with the softener bypassed, and flushing before a slow return to service.</desc>
<defs></defs>
<rect width="760" height="680" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Remodel timeline: what to do about the softener at each phase</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Decisions belong before demolition. Protection runs until the fixtures are set.</text>
<line class="ln" x1="60" y1="128" x2="60" y2="180" stroke="#3a5a72" stroke-width="3"/>
<line class="ln" x1="60" y1="216" x2="60" y2="268" stroke="#3a5a72" stroke-width="3"/>
<line class="ln" x1="60" y1="304" x2="60" y2="356" stroke="#3a5a72" stroke-width="3"/>
<line class="ln" x1="60" y1="392" x2="60" y2="444" stroke="#3a5a72" stroke-width="3"/>
<line class="ln" x1="60" y1="480" x2="60" y2="532" stroke="#3a5a72" stroke-width="3"/>
<circle cx="60" cy="110" r="16" fill="#0e7490" stroke="#0e7490" stroke-width="3"/>
<text x="60" y="115" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="92" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Design</text>
<rect class="box" x="290" y="88" width="440" height="66" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="304" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Decide location, loop, drain and outlet. Recheck</text>
<text x="304" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">sizing if the remodel adds bathrooms or people.</text>
<circle cx="60" cy="198" r="16" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="60" y="203" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">2</text>
<text x="92" y="204" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Before demolition</text>
<rect class="box" x="290" y="176" width="440" height="66" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="304" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Record settings, put the softener in bypass or</text>
<text x="304" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">isolate it, and plan the water shutdowns.</text>
<circle cx="60" cy="286" r="16" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="60" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">3</text>
<text x="92" y="292" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Demolition</text>
<rect class="box" x="290" y="264" width="440" height="66" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="304" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Keep it bypassed, covered against dust, and</text>
<text x="304" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">above freezing if the heat goes off.</text>
<circle cx="60" cy="374" r="16" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="60" y="379" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">4</text>
<text x="92" y="380" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Rough-in</text>
<rect class="box" x="290" y="352" width="440" height="66" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="304" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Install loop with bypass, drain and air gap, and</text>
<text x="304" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">outlet. Solder before connecting to the valve.</text>
<circle cx="60" cy="462" r="16" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="60" y="467" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">5</text>
<text x="92" y="468" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inspection and close-up</text>
<rect class="box" x="290" y="440" width="440" height="66" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="304" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pressure test with the softener bypassed. Check</text>
<text x="304" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">loop and drain before the walls are closed.</text>
<circle cx="60" cy="550" r="16" fill="#ffffff" stroke="#0e7490" stroke-width="3"/>
<text x="60" y="555" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">6</text>
<text x="92" y="556" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Fixtures set, return</text>
<rect class="box" x="290" y="528" width="440" height="66" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="304" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flush lines in bypass, return slowly to service,</text>
<text x="304" y="574" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">purge air, regenerate once and test hardness.</text>
<rect class="box" x="30" y="612" width="700" height="50" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="44" y="643" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Walls are open only once. Drain, loop and outlet are cheapest to add in phase 4.</text>
</svg>
