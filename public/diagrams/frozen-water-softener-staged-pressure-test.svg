<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 664" width="760" height="664" role="img" aria-labelledby="st-title st-desc">
<title id="st-title">Frozen water softener: four-stage pressure test</title>
<desc id="st-desc">Four-stage diagram of pressure testing a thawed frozen water softener: bypass only, then the service position, then each regeneration step, then a week of daily leak checks and a hardness test.</desc>
<defs><pattern id="st-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="664" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Frozen water softener: the staged pressure test</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Pressurise one part at a time, so a crack weeps instead of bursting.</text><rect class="box" x="30" y="96" width="340" height="226" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="46" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Stage 1 · Bypass only</text><path class="ln" d="M42,164 L70,164" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M42,182 L70,182" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="154" width="30" height="38" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><rect x="100" y="150" width="56" height="44" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><rect x="116" y="194" width="24" height="12" fill="#cbd5e1"/><rect x="108" y="206" width="40" height="108" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><path class="ln" d="M156,160 L200,160" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M156,184 L190,184 L190,256" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="168" y="256" width="50" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="234" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Main on slowly.</text><text x="234" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Only the bypass</text><text x="234" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">takes pressure.</text><text x="234" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Wait 15 minutes,</text><text x="234" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">paper-towel it.</text><rect class="box" x="390" y="96" width="340" height="226" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="406" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Stage 2 · Service position</text><path class="ln" d="M402,164 L430,164" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M402,182 L430,182" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="430" y="154" width="30" height="38" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><rect x="460" y="150" width="56" height="44" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><rect x="476" y="194" width="24" height="12" fill="#c2410c"/><rect x="468" y="206" width="40" height="108" rx="14" fill="url(#st-beads)" stroke="#c2410c" stroke-width="2"/><path class="ln" d="M516,160 L560,160" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M516,184 L550,184 L550,256" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="528" y="256" width="50" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="594" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Bypass to service</text><text x="594" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">a little at a time,</text><text x="594" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">tap open nearby.</text><text x="594" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Then 30 minutes</text><text x="594" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">at full pressure.</text><rect class="box" x="30" y="336" width="340" height="226" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="46" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Stage 3 · Every regen step</text><path class="ln" d="M42,404 L70,404" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M42,422 L70,422" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="394" width="30" height="38" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><rect x="100" y="390" width="56" height="44" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><rect x="116" y="434" width="24" height="12" fill="#c2410c"/><rect x="108" y="446" width="40" height="108" rx="14" fill="url(#st-beads)" stroke="#c2410c" stroke-width="2"/><path class="ln" d="M156,400 L200,400" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M156,424 L190,424 L190,496" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="168" y="496" width="50" height="58" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/><text x="234" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Manual regen and</text><text x="234" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">stay with it:</text><text x="234" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">backwash, brine</text><text x="234" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">draw, rinse, refill.</text><text x="234" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Watch the drain.</text><rect class="box" x="390" y="336" width="340" height="226" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="406" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Stage 4 · A week of watching</text><path class="ln" d="M402,404 L430,404" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M402,422 L430,422" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="430" y="394" width="30" height="38" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><rect x="460" y="390" width="56" height="44" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><rect x="476" y="434" width="24" height="12" fill="#c2410c"/><rect x="468" y="446" width="40" height="108" rx="14" fill="url(#st-beads)" stroke="#c2410c" stroke-width="2"/><path class="ln" d="M516,400 L560,400" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M516,424 L550,424 L550,496" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="528" y="496" width="50" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="594" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Daily paper-towel</text><text x="594" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">check under the</text><text x="594" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">valve. Test the</text><text x="594" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">hardness after</text><text x="594" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">the 2nd regen.</text><rect class="box" x="30" y="576" width="700" height="42" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="380" y="602" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">A leak at any stage: back to bypass and stop. No epoxy or tape on pressurised plastic.</text><rect x="30" y="639" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="647" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">under pressure</text><rect x="180" y="639" width="26" height="6" rx="3" fill="#0e7490"/><text x="214" y="647" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened out</text><rect x="320" y="639" width="26" height="6" rx="3" fill="#78716c"/><text x="354" y="647" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><rect x="430" y="639" width="26" height="6" rx="3" fill="#7c3aed"/><text x="464" y="647" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine</text><rect x="520" y="639" width="26" height="6" rx="3" fill="#cbd5e1"/><text x="554" y="647" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">not pressurised</text>
</svg>
