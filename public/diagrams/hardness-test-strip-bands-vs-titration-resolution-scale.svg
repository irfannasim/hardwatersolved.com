<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="sbt-title sbt-desc">
<title id="sbt-title">Hardness test strip colour bands versus drop test kit resolution</title>
<desc id="sbt-desc">Scale comparing hardness test strip colour blocks at 0, 1.5, 3, 7, 15 and 25 gpg with a drop test kit that reads in 1 gpg steps, showing the 7 to 15 gpg strip band straddling the 10.5 gpg hard to very hard line.</desc>
<defs><marker id="sbt-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hardness test strip bands vs drop kit steps</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Both on one gpg scale. Strip gaps widen exactly where softener decisions are made.</text>
<text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Test strip: six colour blocks (Hach total hardness strips)</text>
