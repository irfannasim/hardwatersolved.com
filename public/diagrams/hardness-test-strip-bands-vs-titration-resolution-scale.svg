<text x="285.75" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">10.5 gpg: hard | very hard</text>
<text x="285.75" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">the 7–15 band straddles this line</text>
<text x="30" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">0–1.5 gap: a softener leaking a grain or two still reads as the 0 block</text>
<rect class="box" x="30" y="362" width="700" height="76" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
<text x="46" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Strips: fine steps near zero, coarse where you are sizing or programming a softener.</text>
<text x="46" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drop kit: one-grain steps across the whole range; errors do not grow with hardness.</text>
<text x="46" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Strips stop at 25 gpg. Past 30 gpg, titrate a 1:1 dilution with distilled water and double it.</text>
<text x="30" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">Block shading is schematic, not the real pad colours.</text>
</svg>
