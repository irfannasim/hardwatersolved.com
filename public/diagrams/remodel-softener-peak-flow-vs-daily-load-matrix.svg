<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 532" width="760" height="532" role="img" aria-labelledby="rpm-title rpm-desc">
<title id="rpm-title">Resize water softener after remodel: peak flow versus daily load decision matrix</title>
<desc id="rpm-desc">Two by two matrix for deciding whether to resize a water softener after a remodel. Adding a bathroom raises peak flow, while a change in occupants changes daily load. A bathroom with no new occupants needs a flow check, not more grain capacity; more people means reprogramming or resizing.</desc>
<defs></defs>
<rect width="760" height="532" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">What a remodel changed decides the fix</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Fixtures drive peak flow. People drive daily load. They move independently.</text>
<text x="320" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Same number of people</text>
<text x="600" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">More or fewer people</text>
<text x="600" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">daily load changes</text>
<text x="320" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">daily load about the same</text>
<text x="30" y="204" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Bathroom</text>
<text x="30" y="223" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">added</text>
<text x="30" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">peak flow</text>
<text x="30" y="263" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">rises</text>
<text x="30" y="382" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">No new</text>
<text x="30" y="401" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">fixtures</text>
<text x="30" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">peak flow</text>
<text x="30" y="441" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">unchanged</text>
<rect class="box" x="190" y="140" width="260" height="164" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2.5"/>
<text x="206" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">Check flow, not grains</text>
<text x="206" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Compare the new peak with the</text>
<text x="206" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">service flow rating. If it is over,</text>
<text x="206" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">the fix is a bigger valve or wider</text>
<text x="206" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">tank, or lower-flow fixtures.</text>
<rect class="box" x="470" y="140" width="260" height="164" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="486" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Recheck both</text>
<text x="486" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Peak flow rises and daily load</text>
<text x="486" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">moves. Recalculate capacity and</text>
<text x="486" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">check flow. More people often</text>
<text x="486" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">means a new valve and tank.</text>
<rect class="box" x="190" y="318" width="260" height="164" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/>
<text x="206" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">No action</text>
<text x="206" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Nothing the softener sees has</text>
<text x="206" y="396" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">changed. Keep the settings.</text>
<rect class="box" x="470" y="318" width="260" height="164" rx="6" fill="#f1f5f9" stroke="#0b2f4a" stroke-width="2.5"/>
<text x="486" y="348" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Reprogram first</text>
<text x="486" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Update people, reserve and salt</text>
<text x="486" y="396" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">dose. Replace the unit only if</text>
<text x="486" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">it now regenerates too often</text>
<text x="486" y="436" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">or sits idle for weeks.</text>
<text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">A remodel that adds fixtures without adding people rarely needs more grain capacity.</text>
</svg>
