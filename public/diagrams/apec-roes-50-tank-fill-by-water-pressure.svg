<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" width="760" height="496" role="img" aria-labelledby="aps-title aps-desc">
<title id="aps-title">APEC ROES-50 4 gallon tank: usable water at 40, 50, 60 and 70 psi</title>
<desc id="aps-desc">Four RO storage tanks show how full the APEC ROES-50 tank gets by inlet pressure: 1.9 gallons at 40 psi, 2.5 at 50 psi, 2.8 at 60 psi and 3.1 at 70 psi or more, against a family of four using about 3 gallons a day.</desc>
<defs></defs>
<rect width="760" height="496" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">APEC ROES-50: how much the "4 gallon" tank really holds</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Usable water in a full tank at each inlet pressure, from APEC's manual. Family of four: about 3 gal a day.</text><rect x="70" y="120" width="120" height="260" rx="16" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="76" y="256.5" width="108" height="117.5" rx="10" fill="#dbeafe"/><rect x="76" y="256.5" width="108" height="4" fill="#0e7490"/><text x="130" y="286.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0e7490">1.9 gal</text><text x="130" y="306.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">~50% full</text><text x="130" y="410" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">40 psi</text><rect x="242" y="120" width="120" height="260" rx="16" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="248" y="217.5" width="108" height="156.5" rx="10" fill="#dbeafe"/><rect x="248" y="217.5" width="108" height="4" fill="#0e7490"/><text x="302" y="247.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0e7490">2.5 gal</text><text x="302" y="267.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">~70% full</text><text x="302" y="410" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">50 psi</text><rect x="414" y="120" width="120" height="260" rx="16" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="420" y="198.0" width="108" height="176.0" rx="10" fill="#dbeafe"/><rect x="420" y="198.0" width="108" height="4" fill="#0e7490"/><text x="474" y="228" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0e7490">2.8 gal</text><text x="474" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">~88% full</text><text x="474" y="410" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">60 psi</text><rect x="586" y="120" width="120" height="260" rx="16" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="592" y="178.5" width="108" height="195.5" rx="10" fill="#dbeafe"/><rect x="592" y="178.5" width="108" height="4" fill="#0e7490"/><text x="646" y="208.5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0e7490">3.1 gal</text><text x="646" y="228.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">almost full</text><text x="646" y="410" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">70+ psi</text><path class="ln" d="M58,185 L718,185" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><path class="ln" d="M30,442 L70,442" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="80" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">3 gallons: about one day of drinking and cooking water for a family of four</text><text x="30" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Refill takes 2 to 3 hours, and flow at the faucet weakens as the tank empties.</text>
</svg>
