<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="nsm-title nsm-desc">
<title id="nsm-title">NSF certified water softeners: brand on the box vs who holds the listing</title>
<desc id="nsm-desc">Map of NSF certified water softeners checked on 2 October 2026: Whirlpool, EcoPure, Morton, Rheem, North Star and Kenmore are listed under Water Channel Partners, older GE models under GE Appliances, the 2025 GE range is certified by IAPMO R&amp;T, and SoftPro, SpringWell, Aquasure, Pelican and dealer brands have no NSF/ANSI 44 listing under their own names.</desc>
<defs>
<marker id="nsmg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
<marker id="nsmt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="nsmr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="nsmn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker>
</defs>
<rect width="760" height="640" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">The name on the box vs the name on the listing</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">NSF/ANSI 44 listings checked 2 October 2026</text>
<text x="155" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">Brand you shop for</text>
<text x="605" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">What the listing check found</text>
<rect class="box" x="30" y="110" width="250" height="62" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="155" y="137" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Whirlpool · EcoPure · Morton</text>
<text x="155" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Rheem · North Star · Kenmore</text>
<rect class="box" x="470" y="110" width="260" height="62" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="600" y="137" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water Channel Partners</text>
<text x="600" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Eagan, MN: on NSF's list</text>
<path class="ln" d="M280,141 L466,141" stroke="#15803d" stroke-width="5" fill="none" marker-end="url(#nsmg)"/>
<rect class="box" x="30" y="190" width="250" height="62" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="155" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">GE, older models</text>
<text x="155" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">GXSH40V, GXSH45V, GXMH31H</text>
<rect class="box" x="470" y="190" width="260" height="62" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="600" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">GE Appliances</text>
<text x="600" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">on NSF's list; GE flags obsolete</text>
<path class="ln" d="M280,221 L466,221" stroke="#15803d" stroke-width="5" fill="none" marker-end="url(#nsmg)"/>
<rect class="box" x="30" y="270" width="250" height="62" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="155" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">GE 2025 Wi-Fi range</text>
<text x="155" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">GXSH35W, GXSH45W, GXMD30W</text>
<rect class="box" x="470" y="270" width="260" height="62" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="600" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">IAPMO R&T, per the manual</text>
<text x="600" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">not on NSF's list; a different certifier</text>
<path class="ln" d="M280,301 L466,301" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#nsmt)"/>
<rect class="box" x="30" y="350" width="250" height="62" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="155" y="377" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">SoftPro Elite</text>
<text x="155" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">box badge: NSF / WQA / ANSI</text>
<rect class="box" x="470" y="350" width="260" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="600" y="377" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Not listed under SoftPro</text>
<text x="600" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Canature listed; link not shown</text>
<path class="ln" d="M280,381 L466,381" stroke="#dc2626" stroke-width="5" fill="none" stroke-dasharray="10 7" marker-end="url(#nsmr)"/>
<rect class="box" x="30" y="430" width="250" height="62" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="155" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">SpringWell · Aquasure · Pelican</text>
<text x="155" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">sold online</text>
<rect class="box" x="470" y="430" width="260" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="600" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">No NSF/ANSI 44 listing</text>
<text x="600" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">found under these names</text>
<path class="ln" d="M280,461 L466,461" stroke="#dc2626" stroke-width="5" fill="none" stroke-dasharray="10 7" marker-end="url(#nsmr)"/>
<rect class="box" x="30" y="510" width="250" height="62" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="155" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Culligan · Kinetico · Hague</text>
<text x="155" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">dealer brands</text>
<rect class="box" x="470" y="510" width="260" height="62" rx="8" fill="#f1f5f9" stroke="#52697a" stroke-width="2"/>
<text x="600" y="537" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Not on NSF's 44 list</text>
<text x="600" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">search WQA's directory</text>
<path class="ln" d="M280,541 L466,541" stroke="#52697a" stroke-width="5" fill="none" marker-end="url(#nsmn)"/>
<rect x="30" y="598" width="16" height="16" rx="2" fill="#15803d"/>
<text x="54" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">NSF listing found</text>
<rect x="190" y="598" width="16" height="16" rx="2" fill="#0e7490"/>
<text x="214" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Other certifier, per the manual</text>
<rect x="420" y="598" width="16" height="16" rx="2" fill="#dc2626"/>
<text x="444" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">No listing under that name</text>
<rect x="640" y="598" width="16" height="16" rx="2" fill="#52697a"/>
<text x="664" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Check WQA</text>
</svg>
