<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 770" width="760" height="770" role="img" aria-labelledby="ijx-title ijx-desc">
<title id="ijx-title">Water softener injector exploded view: Clack WS1 and Fleck 5600SXT</title>
<desc id="ijx-desc">Schematic exploded view of water softener injector parts. Clack WS1: cap, cap O-ring, screen, colour-coded injector and plug over two holes marked DN and UP, with the injector in DN for downflow. Fleck 5600SXT: two screws, cap with oval O-ring, screen, injector body with separate nozzle and throat, and three boss O-rings.</desc>
<defs><pattern id="ijx-m" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#f1f5f9"/><path d="M0,0 L5,5 M5,0 L0,5" stroke="#64748b" stroke-width="0.8"/></pattern></defs>
<rect width="760" height="770" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water softener injector parts: note where each one came out</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Schematic, not to scale. Shapes vary by model; the order and the ports are what matter.</text><rect class="box" x="30" y="86" width="700" height="318" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">Clack WS1 / WS1.25: under a hand-tight cap on top of the valve</text><path class="ln" d="M120,152 L120,336 M200,152 L200,336" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><rect x="90" y="128" width="140" height="24" rx="6" fill="#0b2f4a"/><path class="ln" d="M236,140 L282,140" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Injector cap</text><text x="292" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hand-tight: plastic wrench or pliers, never a pipe wrench</text><ellipse cx="160" cy="186" rx="62" ry="7" fill="none" stroke="#0b2f4a" stroke-width="4"/><path class="ln" d="M228,186 L282,186" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="191" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold" font-size="14">Cap O-ring:</tspan><tspan fill="#52697a" font-size="13"> flattened or nicked = air leak</tspan></text><rect x="120" y="208" width="80" height="20" rx="3" fill="url(#ijx-m)" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M206,218 L282,218" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="223" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold" font-size="14">Screen:</tspan><tspan fill="#52697a" font-size="13"> attached under the cap: the part most people miss</tspan></text><rect x="104" y="242" width="32" height="40" rx="5" fill="#e0f2fe" stroke="#3a5a72" stroke-width="2"/><path d="M100,250 L140,250 M100,274 L140,274" stroke="#0b2f4a" stroke-width="3"/><path class="ln" d="M146,256 L282,256" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="261" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Injector: nozzle + throat, colour-coded by size</text><text x="292" y="279" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">lower and upper O-rings (011 and 013)</text><rect x="184" y="290" width="32" height="24" rx="5" fill="#cbd5e1" stroke="#3a5a72" stroke-width="2"/><path d="M180,296 L220,296 M180,309 L220,309" stroke="#0b2f4a" stroke-width="3"/><path class="ln" d="M226,302 L282,302" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold" font-size="14">Plug:</tspan><tspan fill="#52697a" font-size="13"> blanks the unused hole; same two O-rings</tspan></text><rect class="box" x="90" y="330" width="140" height="50" rx="6" fill="#3a5a72"/><ellipse cx="120" cy="340" rx="15" ry="5" fill="#0b2f4a"/><ellipse cx="200" cy="340" rx="15" ry="5" fill="#0b2f4a"/><text x="120" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">DN</text><text x="200" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">UP</text><path class="ln" d="M236,352 L282,352" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="357" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Downflow: injector in DN, plug in UP</text><text x="292" y="375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Swapped = no working brine path, so no brine draw</text><rect class="box" x="30" y="420" width="700" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="446" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">Fleck 5600 / 5600SXT: injector body on the side, held by two screws</text><text x="48" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Drawn as a stack; on the valve it mounts sideways.</text><rect x="111" y="482" width="18" height="7" rx="2" fill="#0b2f4a"/><rect x="117" y="489" width="6" height="16" fill="#0b2f4a"/><rect x="191" y="482" width="18" height="7" rx="2" fill="#0b2f4a"/><rect x="197" y="489" width="6" height="16" fill="#0b2f4a"/><path class="ln" d="M215,492 L282,492" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="497" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold" font-size="14">2 mounting screws:</tspan><tspan fill="#52697a" font-size="13"> hold the cap and injector body to the valve</tspan></text><path class="ln" d="M120,510 L120,696 M200,510 L200,696" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><rect x="90" y="514" width="140" height="22" rx="6" fill="#0b2f4a"/><path class="ln" d="M236,525 L282,525" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Injector cap</text><ellipse cx="160" cy="556" rx="42" ry="7" fill="#e2e8f0" stroke="#0b2f4a" stroke-width="4"/><path class="ln" d="M208,556 L282,556" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="561" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold" font-size="14">O-ring on the oval extension:</tspan><tspan fill="#52697a" font-size="13"> a common air leak</tspan></text><rect x="130" y="578" width="60" height="16" rx="3" fill="url(#ijx-m)" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M196,586 L282,586" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="591" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold" font-size="14">Injector screen (part 10227):</tspan><tspan fill="#52697a" font-size="13"> easy to leave behind</tspan></text><rect x="90" y="606" width="140" height="44" rx="6" fill="#94a3b8" stroke="#3a5a72" stroke-width="2"/><rect x="110" y="616" width="20" height="24" rx="3" fill="#ffffff" stroke="#0b2f4a" stroke-width="1.5"/><rect x="190" y="616" width="20" height="24" rx="3" fill="#ffffff" stroke="#0b2f4a" stroke-width="1.5"/><path class="ln" d="M236,624 L282,624" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="629" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Injector body: nozzle and throat screw in separately</text><text x="292" y="647" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">stamped and coloured by size (e.g. #1 white): same size number</text><text x="292" y="665" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Brine tube and drain line connect to this body.</text><circle cx="125" cy="688" r="8" fill="none" stroke="#0b2f4a" stroke-width="3.5"/><circle cx="160" cy="688" r="8" fill="none" stroke="#0b2f4a" stroke-width="3.5"/><circle cx="195" cy="688" r="8" fill="none" stroke="#0b2f4a" stroke-width="3.5"/><path class="ln" d="M209,688 L282,688" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292" y="693" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">3 boss O-rings: seal the module to the valve body</text><rect class="box" x="90" y="706" width="140" height="30" rx="6" fill="#3a5a72"/><text x="160" y="726" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE BODY</text>
</svg>
