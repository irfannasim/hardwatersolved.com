<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 552" width="760" height="552" role="img" aria-labelledby="otb-title otb-desc">
<title id="otb-title">Outdoor water softener installation: manufacturer temperature rating bands</title>
<desc id="otb-desc">Scale from 0 to 130 degrees Fahrenheit showing published water softener operating ranges, 35 to 100 degrees for Kinetico and WaterCare and 40 to 110 degrees for Watts PWSR, with the freezing zone below 32 degrees and the heat zone above the ratings that outdoor units face.</desc>
<defs></defs>
<rect width="760" height="552" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Outdoor water softener installation: the rated window</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Published operating ranges. Outdoors, the air leaves this window at both ends.</text><rect x="130" y="110" width="145.23076923076923" height="220" fill="#fef2f2"/><rect x="629.2307692307693" y="110" width="90.76923076923072" height="220" fill="#fff7ed"/><path class="ln" d="M275.2307692307692,110 L275.2307692307692,330" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="202.6153846153846" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">freezing</text><text x="674.6153846153846" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">heat</text><text x="30" y="175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Kinetico</text><rect x="288.8461538461538" y="158" width="295" height="24" rx="4" fill="#0e7490"/><text x="436.3461538461538" y="175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">35°F to 100°F</text><text x="30" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">WaterCare</text><rect x="288.8461538461538" y="218" width="295" height="24" rx="4" fill="#0e7490"/><text x="436.3461538461538" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">35°F to 100°F</text><text x="30" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Watts PWSR</text><rect x="311.53846153846155" y="278" width="317.69230769230774" height="24" rx="4" fill="#0e7490"/><text x="470.3846153846154" y="295" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">40°F to 110°F</text><path class="ln" d="M130,340 L720,340" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M130,340 L130,348" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0°F</text><path class="ln" d="M220.76923076923077,340 L220.76923076923077,348" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="220.76923076923077" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">20°F</text><path class="ln" d="M311.53846153846155,340 L311.53846153846155,348" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="311.53846153846155" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">40°F</text><path class="ln" d="M402.3076923076923,340 L402.3076923076923,348" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="402.3076923076923" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">60°F</text><path class="ln" d="M493.0769230769231,340 L493.0769230769231,348" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="493.0769230769231" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">80°F</text><path class="ln" d="M583.8461538461538,340 L583.8461538461538,348" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="583.8461538461538" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">100°F</text><path class="ln" d="M674.6153846153846,340 L674.6153846153846,348" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="674.6153846153846" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">120°F</text><text x="275.2307692307692" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">32°F: water freezes</text><rect class="box" x="30" y="430" width="340" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="46" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Below the window</text><text x="46" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">One freeze can crack the valve body,</text><text x="46" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">tank or distributor tube. Warranties</text><text x="46" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">from these makers exclude it.</text><rect class="box" x="390" y="430" width="340" height="92" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="406" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">Above the window</text><text x="406" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Direct sun heats and weakens plastic:</text><text x="406" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">brine tank, tubing, valve housing and</text><text x="406" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the electronics under the cover.</text>
</svg>
