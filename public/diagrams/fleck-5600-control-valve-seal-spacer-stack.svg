<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="g4fk-title g4fk-desc">
<title id="g4fk-title">Fleck 5600 control valve seal and spacer stack, exploded</title>
<desc id="g4fk-desc">Exploded diagram of a Fleck 5600 water softener control valve: five seals and four spacers alternate in the valve bore, followed by the piston, end plug, piston rod and yoke.</desc>
<defs></defs>
<rect width="760" height="440" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Fleck 5600: what comes out of the valve bore</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Seals and spacers come out in alternating order. Refit them in the order the kit shows.</text><rect x="30" y="150" width="100" height="100" rx="8" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><rect x="104" y="172" width="26" height="56" rx="0" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="80" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">valve body</text><text x="80" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">(bore)</text><rect x="160" y="165" width="10" height="70" rx="3" fill="#0b2f4a"/><rect x="180" y="170" width="26" height="60" rx="3" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><rect x="186" y="184" width="14" height="12" rx="0" fill="#ffffff"/><rect x="186" y="204" width="14" height="12" rx="0" fill="#ffffff"/><rect x="216" y="165" width="10" height="70" rx="3" fill="#0b2f4a"/><rect x="236" y="170" width="26" height="60" rx="3" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><rect x="242" y="184" width="14" height="12" rx="0" fill="#ffffff"/><rect x="242" y="204" width="14" height="12" rx="0" fill="#ffffff"/><rect x="272" y="165" width="10" height="70" rx="3" fill="#0b2f4a"/><rect x="292" y="170" width="26" height="60" rx="3" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><rect x="298" y="184" width="14" height="12" rx="0" fill="#ffffff"/><rect x="298" y="204" width="14" height="12" rx="0" fill="#ffffff"/><rect x="328" y="165" width="10" height="70" rx="3" fill="#0b2f4a"/><rect x="348" y="170" width="26" height="60" rx="3" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><rect x="354" y="184" width="14" height="12" rx="0" fill="#ffffff"/><rect x="354" y="204" width="14" height="12" rx="0" fill="#ffffff"/><rect x="384" y="165" width="10" height="70" rx="3" fill="#0b2f4a"/><text x="160" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Seal 13242 × 5</text><path class="ln" d="M165,130 L165,162" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Spacer 14241 × 4</text><path class="ln" d="M305,130 L305,166" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M160,250 L160,258 L394,258 L394,250" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="277" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Seal &amp; Spacer Kit 60125</text><text x="277" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">alternating: seal, spacer … seal</text><rect x="430" y="183" width="130" height="34" rx="6" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><rect x="560" y="170" width="18" height="60" rx="3" fill="#3a5a72"/><rect x="578" y="195" width="70" height="10" rx="0" fill="#94a3b8"/><path d="M648,175 L690,175 L690,225 L648,225" fill="none" stroke="#0b2f4a" stroke-width="6" stroke-linejoin="round"/><text x="495" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">piston</text><text x="569" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">end plug</text><path class="ln" d="M569,156 L569,168" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="672" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">yoke</text><text x="612" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">piston rod</text><path class="ln" d="M612,284 L612,208" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="30" y="330" width="340" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Refit the piston</text><text x="46" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Twist the yoke clockwise to meet the drive gear</text><rect class="box" x="390" y="330" width="340" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="406" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Refit the timer</text><text x="406" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Drive pin on the main gear engages the yoke slot</text><text x="30" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Clean the bore with dilute vinegar, never a wire brush. Silicone lubricant only.</text>
</svg>
