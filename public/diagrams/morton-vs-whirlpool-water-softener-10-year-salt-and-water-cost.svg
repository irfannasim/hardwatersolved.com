<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="mw-title mw-desc">
<title id="mw-title">Morton vs Whirlpool water softener: 10-year salt and water running cost</title>
<desc id="mw-desc">Illustrative 10-year running cost for a Morton M34 and a Whirlpool WHES33 water softener, family of four on 15 gpg water: about $1,029 and $951 at the lowest salt setting, about $1,440 and $1,447 at the highest, split into salt and regeneration water.</desc>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">10-year salt and water cost (illustrative)</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Family of four, 280 gal/day, 15 gpg; salt $0.20/lb, water and sewer $12 per 1,000 gal</text>
<rect x="30" y="78" width="16" height="14" fill="#7c3aed"/><text x="52" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Salt</text>
<rect x="100" y="78" width="16" height="14" fill="#78716c"/><text x="122" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Regeneration water</text>
<text x="30" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Lowest salt setting (best efficiency)</text>
<text x="218" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Morton M34</text>
<rect x="230" y="144" width="151.5" height="24" fill="#7c3aed"/>
<rect x="381.5" y="144" width="105.8" height="24" fill="#78716c"/>
<text x="497.3" y="161" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">$1,029</text>
<text x="230" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">salt $606 + water $423</text>
<text x="218" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Whirlpool WHES33</text>
<rect x="230" y="202" width="150.5" height="24" fill="#7c3aed"/>
<rect x="380.5" y="202" width="87.4" height="24" fill="#78716c"/>
<text x="477.9" y="219" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">$951</text>
<text x="230" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">salt $602 + water $350</text>
<text x="30" y="268" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Highest salt setting (full capacity)</text>
<text x="218" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Morton M34</text>
<rect x="230" y="288" width="318.5" height="24" fill="#7c3aed"/>
<rect x="548.5" y="288" width="41.6" height="24" fill="#78716c"/>
<text x="600.1" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">$1,440</text>
<text x="230" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">salt $1,274 + water $167</text>
<text x="218" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Whirlpool WHES33</text>
<rect x="230" y="346" width="316.9" height="24" fill="#7c3aed"/>
<rect x="546.9" y="346" width="44.9" height="24" fill="#78716c"/>
<text x="601.9" y="363" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">$1,447</text>
<text x="230" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">salt $1,268 + water $180</text>
<path class="ln" d="M230,404 L630,404" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<path class="ln" d="M230,404 L230,410" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="230" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$0</text>
<path class="ln" d="M330,404 L330,410" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="330" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$400</text>
<path class="ln" d="M430,404 L430,410" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="430" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$800</text>
<path class="ln" d="M530,404 L530,410" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="530" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$1,200</text>
<path class="ln" d="M630,404 L630,410" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="630" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$1,600</text>
<rect class="box" x="30" y="444" width="700" height="62" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="380" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Same setting, other brand: under $80 apart in 10 years</text>
<text x="380" y="492" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Same brand, other setting: about $410 to $500 apart</text>
</svg>
