<text x="610" y="194.39555555555552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#78716c">HALO high $3,946</text>
<text x="610" y="216.15555555555557" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">Softener pair $3,640</text>
<text x="610" y="282.2888888888889" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#3a5a72">Salt-free pair $2,710</text>
<text x="610" y="336.61777777777775" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#78716c">HALO low $1,946</text>
<text x="30" y="528" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Only the softener pair removes hardness. The other two lines buy filtration plus scale control.</text>
<text x="30" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Softener: salt at 2,890 grains per lb and $7 a bag, $36 a year of water. Carbon tanks replaced near</text>
<text x="30" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">end of rated life. Sediment cartridge $28 a year assumed. Prices checked 1 October 2026.</text>
