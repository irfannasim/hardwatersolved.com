<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="h5cost-title h5cost-desc">
<title id="h5cost-title">HALO 5 vs a salt softener and carbon filter: 10-year cost</title>
<desc id="h5cost-desc">Illustrative cumulative 10-year cost chart comparing a HALO 5 system, priced as an installer range, with an Aquasure Harmony softener plus Fortitude Pro carbon filter, and an Aquasure Serene salt-free bundle, for a family of four on 15 gpg city water.</desc>
<defs></defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">HALO 5 vs two Amazon pairings: 10-year cost</text>
<text x="30" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Cumulative dollars, family of four on 15 gpg city water, before installation. Illustrative.</text>
<rect x="30" y="82" width="22" height="10" fill="#78716c" stroke="none" stroke-width="1.5"/>
<text x="62" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">HALO 5, unit $1,500 to $3,500 (installer estimate), carbon re-bed year 8</text>
<rect x="30" y="102" width="22" height="10" fill="#0e7490" stroke="none" stroke-width="1.5"/>
<text x="62" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Salt softener + carbon filter: Harmony 48k + Fortitude Pro 1.5 cf</text>
<rect x="30" y="122" width="22" height="10" fill="#3a5a72" stroke="none" stroke-width="1.5"/>
<text x="62" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Salt-free + carbon bundle: Serene 10 GPM with Fortitude Pro</text>
<text x="90" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$0</text>
<path d="M100,398.8888888888889 L600,398.8888888888889" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="403.8888888888889" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$1,000</text>
<path d="M100,327.77777777777777 L600,327.77777777777777" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="332.77777777777777" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$2,000</text>
<path d="M100,256.6666666666667 L600,256.6666666666667" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="261.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$3,000</text>
<path d="M100,185.55555555555554 L600,185.55555555555554" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="190.55555555555554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$4,000</text>
<text x="100" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Yr 0</text>
<text x="200" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Yr 2</text>
