<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 526" width="760" height="526" role="img" aria-labelledby="rsq-title rsq-desc">
<title id="rsq-title">Softener resin bead squeeze test: chlorine oxidation vs fouling</title>
<desc id="rsq-desc">Three water softener resin beads compared under a finger-and-thumb squeeze: a healthy bead is firm and fractures cleanly, a chlorine-oxidised bead has broken cross-links, swells and squashes like gel while staying amber, and a fouled bead stays firm but is heavily discoloured.</desc>
<defs></defs>
<rect width="760" height="526" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Resin bead squeeze test: chlorine damage or fouling?</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Press one rinsed bead from the top of the bed between finger and thumb.</text><rect class="box" x="30" y="90" width="220" height="378" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="140" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803d">Healthy resin</text><circle cx="140" cy="172" r="34" fill="#e2b865" stroke="#a37a2c" stroke-width="2"/><path d="M116.44410901706327,155 L163.55589098293672,155 M123,148.44410901706328 L123,195.55589098293672" stroke="#8a6420" stroke-width="2"/><path d="M112.8,172 L167.2,172 M140,144.8 L140,199.2" stroke="#8a6420" stroke-width="2"/><path d="M116.44410901706327,189 L163.55589098293672,189 M157,148.44410901706328 L157,195.55589098293672" stroke="#8a6420" stroke-width="2"/><text x="140" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Cross-links intact</text><rect x="100" y="256" width="80" height="16" rx="8" fill="#f3dccb" stroke="#3a5a72" stroke-width="1.5"/><rect x="100" y="328" width="80" height="16" rx="8" fill="#f3dccb" stroke="#3a5a72" stroke-width="1.5"/><circle cx="140" cy="300" r="26" fill="#e2b865" stroke="#a37a2c" stroke-width="2"/><path d="M136,274 L145,292 L137,306 L144,326" fill="none" stroke="#0b2f4a" stroke-width="2"/><text x="140" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Firm: resists the squeeze</text><text x="140" y="383" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Fractures cleanly under</text><text x="140" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">real pressure</text><text x="140" y="421" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Colour: amber</text><rect class="box" x="46" y="432" width="188" height="26" rx="13" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="140" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Healthy bed</text><rect class="box" x="270" y="90" width="220" height="378" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">Oxidised by chlorine</text><circle cx="380" cy="172" r="46" fill="#ecc97f" stroke="#a37a2c" stroke-width="2"/><path d="M348.13026514073266,149 L372.0325662851832,149 M386.37394697185346,149 L411.86973485926734,149" stroke="#a07a2e" stroke-width="2" stroke-dasharray="0"/><path d="M357,140.13026514073266 L357,162.4390795422198 M357,183.15440720074358 L357,203.86973485926734" stroke="#a07a2e" stroke-width="2"/><path d="M343.2,172 L370.8,172 M387.36,172 L416.8,172" stroke="#a07a2e" stroke-width="2" stroke-dasharray="5 6"/><path d="M380,135.2 L380,160.96 M380,184.88 L380,208.8" stroke="#a07a2e" stroke-width="2"/><path d="M348.13026514073266,195 L372.0325662851832,195 M386.37394697185346,195 L411.86973485926734,195" stroke="#a07a2e" stroke-width="2" stroke-dasharray="0"/><path d="M403,140.13026514073266 L403,162.4390795422198 M403,183.15440720074358 L403,203.86973485926734" stroke="#a07a2e" stroke-width="2"/><path d="M322,135 q5,7 0,11 q-5,-4 0,-11z" fill="#60a5fa"/><path d="M436,143 q5,7 0,11 q-5,-4 0,-11z" fill="#60a5fa"/><path d="M432,201 q5,7 0,11 q-5,-4 0,-11z" fill="#60a5fa"/><path d="M326,195 q5,7 0,11 q-5,-4 0,-11z" fill="#60a5fa"/><text x="380" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Cross-links broken, bead swells</text><rect x="330" y="274" width="100" height="16" rx="8" fill="#f3dccb" stroke="#3a5a72" stroke-width="1.5"/><rect x="330" y="310" width="100" height="16" rx="8" fill="#f3dccb" stroke="#3a5a72" stroke-width="1.5"/><ellipse cx="380" cy="300" rx="62" ry="9" fill="#ecc97f" stroke="#a37a2c" stroke-width="2"/><text x="380" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Soft: squashes like a gel</text><text x="380" y="383" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">bead, may smear</text><text x="380" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Visibly larger than new resin</text><text x="380" y="421" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Colour: stays amber</text><rect class="box" x="286" y="432" width="188" height="26" rx="13" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="380" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Cleaner cannot help</text><rect class="box" x="510" y="90" width="220" height="378" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="620" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#b45309">Fouled</text><circle cx="620" cy="172" r="34" fill="#6f4e2e" stroke="#4a3320" stroke-width="2"/><text x="620" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Firm bead, heavy colour</text><rect x="580" y="256" width="80" height="16" rx="8" fill="#f3dccb" stroke="#3a5a72" stroke-width="1.5"/><rect x="580" y="328" width="80" height="16" rx="8" fill="#f3dccb" stroke="#3a5a72" stroke-width="1.5"/><circle cx="620" cy="300" r="26" fill="#6f4e2e" stroke="#4a3320" stroke-width="2"/><text x="620" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Firm: resists the squeeze</text><text x="620" y="383" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Strong discolouration</text><text x="620" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">points at fouling,</text><text x="620" y="421" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">not chlorine</text><rect class="box" x="526" y="432" width="188" height="26" rx="13" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="620" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">Cleaner sometimes can</text><text x="380" y="500" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0b2f4a"><tspan font-weight="bold">Soft + normal colour</tspan> = oxidation.   <tspan font-weight="bold">Firm + heavy colour</tspan> = fouling.</text>
</svg>
