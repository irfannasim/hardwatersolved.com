<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-labelledby="ori-title ori-desc">
<title id="ori-title">Water softener injector orifice inspection: clean, scaled, fouled and damaged bores</title>
<desc id="ori-desc">End-on views of a water softener injector nozzle bore held against a light: a clean round hole, a crescent of white scale, a brown iron film, a grain of sand, and a scored, chipped or enlarged bore that must be replaced.</desc>
<defs></defs>
<rect width="760" height="372" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Injector nozzle and throat: what you see against a light</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">End-on view of the bore. Soak and blow out with air; never push a pin or metal through it.</text><rect class="box" x="36" y="96" width="128" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="100" cy="160" r="44" fill="#cbd5e1" stroke="#3a5a72" stroke-width="3"/><circle cx="100" cy="160" r="18" fill="#fef9c3" stroke="#3a5a72" stroke-width="2"/><text x="100" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Clean round</text><text x="100" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">hole</text><text x="100" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">OK: refit it</text><rect class="box" x="176" y="96" width="128" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="240" cy="160" r="44" fill="#cbd5e1" stroke="#3a5a72" stroke-width="3"/><circle cx="240" cy="160" r="18" fill="#fef9c3" stroke="#3a5a72" stroke-width="2"/><path d="M223.6,162 A16.5,16.5 0 0 0 256.4,162 Q240,180 223.6,162 z" fill="#f5f5f4" stroke="#57534e" stroke-width="1.5"/><text x="240" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Crescent of</text><text x="240" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">white scale</text><text x="240" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Soak in white</text><text x="240" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">vinegar</text><rect class="box" x="316" y="96" width="128" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="380" cy="160" r="44" fill="#cbd5e1" stroke="#3a5a72" stroke-width="3"/><circle cx="380" cy="160" r="18" fill="#fef9c3" stroke="#3a5a72" stroke-width="2"/><circle cx="380" cy="160" r="14" fill="none" stroke="#b45309" stroke-width="7" opacity="0.85"/><text x="380" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Brown film</text><text x="380" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">(iron)</text><text x="380" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Soak longer</text><rect class="box" x="456" y="96" width="128" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="520" cy="160" r="44" fill="#cbd5e1" stroke="#3a5a72" stroke-width="3"/><circle cx="520" cy="160" r="18" fill="#fef9c3" stroke="#3a5a72" stroke-width="2"/><path d="M522,154 l7,2 l2,7 l-6,5 l-7,-3 l-1,-7 z" fill="#78716c" stroke="#44403c" stroke-width="1"/><text x="520" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Grain of sand</text><text x="520" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">in the bore</text><text x="520" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Rinse, blow out</text><text x="520" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">with air</text><rect class="box" x="596" y="96" width="128" height="206" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="660" cy="160" r="44" fill="#cbd5e1" stroke="#3a5a72" stroke-width="3"/><circle cx="660" cy="160" r="25" fill="#fef9c3" stroke="#3a5a72" stroke-width="2"/><path d="M642,154 L674,146 M640,166 L678,158 M648,176 L680,168" stroke="#dc2626" stroke-width="2"/><path d="M690,128 l12,-4 l-2,14 z" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="660" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Scored, chipped</text><text x="660" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">or enlarged</text><text x="660" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">Replace it</text><text x="380" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Replace any nozzle or throat with a chipped edge, a scratched bore, or scale that will not shift</text><text x="380" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">after a long soak. Buy the same size and colour that came out.</text>
</svg>
