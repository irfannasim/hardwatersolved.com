<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="g11db-title g11db-desc">
<title id="g11db-title">Water softener drain tubing connection: barb and clamp done right, done wrong, and the compression nut option</title>
<desc id="g11db-desc">Water softener drain tubing connection at the valve. Right: tubing pushed over every barb to the shoulder with the clamp over the barbs. Wrong: tubing only partly on and the clamp on plain tubing past the barbs. Alternative: a compression nut with a polytube insert inside the tubing end.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">The first connection: where the tubing meets the valve</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Valve drain fitting on the left, drain tubing running off to the right.</text>

<rect class="box" x="30" y="86" width="216" height="340" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="138" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">RIGHT: barb and clamp</text>
<rect x="44" y="186" width="36" height="68" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/>
<path d="M80,200 L102,208 L102,200 L124,208 L124,200 L146,208 L146,232 L124,240 L124,232 L102,240 L102,232 L80,240 Z" fill="#94a3b8" stroke="#3a5a72" stroke-width="1"/>
<rect x="80" y="194" width="150" height="52" fill="#cbd5e1" fill-opacity="0.55" stroke="#52697a" stroke-width="1.5"/>
<rect x="90" y="188" width="22" height="64" rx="3" fill="#78716c"/>
<text x="101" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">clamp</text>
<text x="62" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">shoulder</text>
<text x="190" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">tubing</text>
<text x="46" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Tubing over every barb, up</text>
<text x="46" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">to the shoulder. Clamp over</text>
<text x="46" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">the barbs, firm but not</text>
<text x="46" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">cutting into the tube.</text>

<rect class="box" x="272" y="86" width="216" height="340" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="380" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">WRONG: half on</text>
<rect x="286" y="186" width="36" height="68" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/>
<path d="M322,200 L344,208 L344,200 L366,208 L366,200 L388,208 L388,232 L366,240 L366,232 L344,240 L344,232 L322,240 Z" fill="#94a3b8" stroke="#3a5a72" stroke-width="1"/>
<rect x="358" y="194" width="114" height="52" fill="#cbd5e1" fill-opacity="0.55" stroke="#52697a" stroke-width="1.5"/>
<rect x="414" y="188" width="22" height="64" rx="3" fill="#78716c"/>
<text x="425" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#dc2626">clamp past barbs</text>
<text x="340" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#dc2626">gap</text>
<text x="288" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Only one barb holds, and</text>
<text x="288" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">the clamp squeezes plain</text>
<text x="288" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">tube. Backwash pressure</text>
<text x="288" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">pushes it off or it seeps.</text>

<rect class="box" x="514" y="86" width="216" height="340" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="622" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">ALSO RIGHT: nut</text>
<rect x="528" y="186" width="36" height="68" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="564" y="182" width="40" height="76" rx="4" fill="#94a3b8" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="590" y="200" width="124" height="40" fill="#cbd5e1" fill-opacity="0.55" stroke="#52697a" stroke-width="1.5"/>
<rect x="592" y="208" width="40" height="24" fill="#0b2f4a"/>
<text x="584" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">nut</text>
<text x="630" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">insert inside tube</text>
<path class="ln" d="M612,262 L612,238" stroke="#52697a" stroke-width="1.2" fill="none"/>
<text x="530" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Clack: slide the nut on,</text>
<text x="530" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">put the polytube insert</text>
<text x="530" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">in the tube end, tighten</text>
<text x="530" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">onto the drain fitting.</text>

<text x="30" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Threads into the valve: PTFE tape only, no pipe dope (Fleck, Clack). Never step down below the fitting size.</text>
</svg>
