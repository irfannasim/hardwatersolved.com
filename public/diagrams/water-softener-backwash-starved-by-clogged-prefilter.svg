<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" role="img" aria-labelledby="g4bw-title g4bw-desc">
<title id="g4bw-title">Water softener backwash starved by a clogged sediment prefilter</title>
<desc id="g4bw-desc">Softener backwash comparison: with a clean prefilter the upflow lifts and loosens the resin bed and flushes fines to the drain; with a half-blocked cartridge the flow drops, the bed stays packed and preferred paths form, so hardness leaks through early.</desc>
<defs><marker id="g4bw-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4bw-ad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="g4bw-bd" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="g4bw-dirt" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#d6c7a8"/><circle cx="3" cy="3" r="1.5" fill="#8a7a5c"/></pattern></defs>
<rect width="760" height="512" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why a clogged prefilter starves backwash</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Backwash has to lift the resin bed. Less water in means the bed never loosens.</text><text x="200" y="102" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">Clean prefilter</text><path class="ln" d="M32,140 L74,140" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/><rect x="74" y="126" width="40" height="12" rx="3" fill="#3a5a72"/><rect x="80" y="138" width="28" height="38" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="94" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">prefilter</text><path class="ln" d="M114,140 L148,140" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4bw-ah)"/><rect x="150" y="120" width="120" height="40" rx="6" fill="#0b2f4a"/><text x="210" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text><rect x="154" y="166" width="112" height="240" rx="22" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><rect x="160" y="196" width="100" height="130" rx="6" fill="url(#g4bw-bd)"/><circle cx="170" cy="350" r="3" fill="#e2b865"/><circle cx="200" cy="372" r="3" fill="#e2b865"/><circle cx="235" cy="346" r="3" fill="#e2b865"/><circle cx="245" cy="380" r="3" fill="#e2b865"/><circle cx="180" cy="386" r="3" fill="#e2b865"/><rect x="206" y="160" width="8" height="236" rx="0" fill="#94a3b8"/><path class="ln" d="M186,394 L186,214" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bw-ah)"/><path class="ln" d="M234,394 L234,214" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bw-ah)"/><path class="ln" d="M270,140 L330,140 L330,200" fill="none" stroke="#78716c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bw-ad)"/><text x="330" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">to drain</text><text x="284" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bed lifted</text><path class="ln" d="M280,296 L262,290" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="436" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Bed lifts and loosens</text><text x="200" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">fine debris is flushed to the drain</text><text x="560" y="102" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">Half-blocked cartridge</text><path class="ln" d="M392,140 L434,140" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/><rect x="434" y="126" width="40" height="12" rx="3" fill="#3a5a72"/><rect x="440" y="138" width="28" height="38" rx="6" fill="url(#g4bw-dirt)" stroke="#3a5a72" stroke-width="1.5"/><text x="454" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">prefilter</text><path class="ln" d="M474,140 L508,140" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4bw-ah)"/><rect x="510" y="120" width="120" height="40" rx="6" fill="#0b2f4a"/><text x="570" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text><rect x="514" y="166" width="112" height="240" rx="22" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><rect x="520" y="262" width="100" height="136" rx="6" fill="url(#g4bw-bd)"/><rect x="520" y="262" width="100" height="12" rx="0" fill="#a8a29e"/><path d="M536,396 C530,360 544,320 536,276" fill="none" stroke="#c2410c" stroke-width="2.5"/><path d="M604,396 C612,350 598,316 604,276" fill="none" stroke="#c2410c" stroke-width="2.5"/><rect x="566" y="160" width="8" height="236" rx="0" fill="#94a3b8"/><path class="ln" d="M546,394 L546,300" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bw-ah)"/><path class="ln" d="M594,394 L594,300" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bw-ah)"/><path class="ln" d="M630,140 L690,140 L690,200" fill="none" stroke="#78716c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bw-ad)"/><text x="690" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">to drain</text><text x="644" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">fines stay</text><path class="ln" d="M640,268 L622,268" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="644" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">channels</text><path class="ln" d="M640,336 L606,336" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="436" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Bed stays packed</text><text x="560" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">preferred paths form: hardness leaks early</text><path class="ln" d="M380,96 L380,460" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><rect x="30" y="487" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">backwash water</text><rect x="200" y="487" width="26" height="6" rx="3" fill="#78716c"/><text x="234" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><rect x="370" y="483" width="26" height="14" rx="3" fill="#e2b865" stroke="#3a5a72" stroke-width="1"/><text x="404" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin beads</text><rect x="540" y="483" width="26" height="14" rx="3" fill="#a8a29e" stroke="#3a5a72" stroke-width="1"/><text x="574" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">fines / crust</text>
</svg>
