<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 532" width="760" height="532" role="img" aria-labelledby="pdq-title pdq-desc">
<title id="pdq-title">Water softener pressure drop vs flow rate (square law)</title>
<desc id="pdq-desc">Chart of water softener pressure drop against flow: a system rated 12 gpm at 15 psi loses about 1 psi at 3 gpm, 3.75 psi at 6 gpm and about 8 psi at 9 gpm, with valve-only curves for the Fleck 5600SXT and 7000.</desc>
