<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" aria-labelledby="sfl-title sfl-desc">
<title id="sfl-title">SpringWell FutureSoft operating limits to check against a water test</title>
<desc id="sfl-desc">Range chart of the SpringWell FutureSoft salt-free conditioner's listed limits for hardness, pH, free chlorine, temperature and pressure, plus the five contaminants the specification sheet sets at zero: iron, manganese, copper, oil and hydrogen sulfide.</desc>
<rect width="760" height="650" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">SpringWell FutureSoft: the limits your water test must meet</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Values from SpringWell's FutureSoft specification table (FS1, FS4 and FS+ share the same limits)</text>
<rect x="30" y="80" width="18" height="14" fill="#0e7490"/>
<text x="56" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Within the listed limit</text>
<rect x="250" y="80" width="18" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="276" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Outside it: pretreat, or choose another system</text>
<text x="30" y="135" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Hardness</text>
<text x="30" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">grains per gallon</text>
<rect x="230" y="120" width="460" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<rect x="230" y="120" width="372.6" height="22" fill="#0e7490"/>
<text x="230" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="602.6" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">81 max</text>
<text x="690" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">100</text>
<text x="30" y="210" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">pH</text>
<text x="30" y="229" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">units</text>
<rect x="230" y="195" width="460" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<rect x="383.3" y="195" width="191.7" height="22" fill="#0e7490"/>
<text x="230" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">5</text>
<text x="383.3" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">7.0 min</text>
<text x="575" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">9.5 max</text>
<text x="690" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">11</text>
<text x="30" y="285" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Free chlorine</text>
<text x="30" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">ppm</text>
<rect x="230" y="270" width="460" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<rect x="230" y="270" width="276" height="22" fill="#0e7490"/>
<text x="230" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="506" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">3 max</text>
<text x="690" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">5</text>
<text x="30" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Water temperature</text>
<text x="30" y="379" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">°F</text>
<rect x="230" y="345" width="460" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<rect x="246.7" y="345" width="359.7" height="22" fill="#0e7490"/>
<text x="246.7" y="389" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">34 min</text>
<text x="606.4" y="389" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">120 max</text>
<text x="30" y="435" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Pressure</text>
<text x="30" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">psi</text>
<rect x="230" y="420" width="460" height="22" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<rect x="322" y="420" width="276" height="22" fill="#0e7490"/>
<text x="230" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="322" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">20 min</text>
<text x="598" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">80 max</text>
<text x="690" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">100</text>
<rect class="box" x="30" y="494" width="700" height="96" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="48" y="520" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Listed maximum: 0 ppm. Any detectable amount means pretreatment first</text>
<rect class="box" x="48" y="534" width="118" height="40" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="107" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron</text>
<rect class="box" x="184" y="534" width="130" height="40" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="249" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Manganese</text>
<rect class="box" x="332" y="534" width="110" height="40" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="387" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Copper</text>
<rect class="box" x="460" y="534" width="90" height="40" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="505" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Oil</text>
<rect class="box" x="568" y="534" width="146" height="40" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="641" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Hydrogen sulfide</text>
<text x="30" y="616" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">On a private well, the installation guide says to call SpringWell before installing.</text>
<text x="30" y="636" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Scales run past each limit only to show where it falls; they are not further ratings.</text>
</svg>
