<text x="160" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">midnight</text>
<path d="M300,479 L300,489" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="300" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">noon</text>
<path d="M440,479 L440,489" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="440" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">midnight</text>
<path d="M580,479 L580,489" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="580" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">noon</text>
<path d="M720,479 L720,489" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="720" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">midnight</text>
<rect x="30" y="532" width="16" height="16" fill="#0e7490"/>
<text x="54" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">soft water / in service</text>
<rect x="210" y="532" width="16" height="16" fill="#7c3aed"/>
<text x="234" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">regenerating</text>
<rect x="390" y="532" width="16" height="16" fill="#c2410c"/>
<text x="414" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water to house</text>
<rect x="570" y="532" width="16" height="16" fill="#cbd5e1"/>
<text x="594" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">standby</text>
</svg>
