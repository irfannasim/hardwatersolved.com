<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" role="img" aria-labelledby="g4bf-title g4bf-desc">
<title id="g4bf-title">Water softener brine float: dose setter vs safety backstop</title>
<desc id="g4bf-desc">Comparison of a float-controlled brine valve, where float height 13 to 31 inches above the brine check cage sets the refill and salt dose, and a timed-refill brine float that is only a safety backstop above the programmed refill level and below the overflow elbow.</desc>
<defs><marker id="g4bf-ai" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="556" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Dose setter or backstop: two kinds of brine float</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Same parts, different job. Watch one refill to tell which you have.</text><text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">A · Float-controlled refill</text><rect x="90" y="120" width="60" height="340" rx="0" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="92" y="262" width="56" height="196" rx="0" fill="#dbeafe"/><rect x="108" y="128" width="24" height="20" rx="3" fill="#0b2f4a"/><rect x="118" y="148" width="4" height="282" rx="0" fill="#64748b"/><rect x="102" y="430" width="36" height="28" rx="0" fill="none" stroke="#0b2f4a" stroke-width="2"/><rect x="99" y="248" width="42" height="24" rx="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="186" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">refill stops when</text><text x="186" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">the float closes</text><path class="ln" d="M182,260 L144,260" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M166,276 L166,426" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bf-ai)" marker-start="url(#g4bf-ai)"/><text x="186" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">13 to 31 in</text><text x="186" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">float to brine check</text><text x="186" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">cage (SWT valve)</text><text x="186" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine check cage</text><path class="ln" d="M182,442 L142,442" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="30" y="480" width="340" height="58" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="46" y="504" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Float height = refill = salt dose</text><text x="46" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">about 3 lb of salt per gallon of refill</text><path class="ln" d="M380,96 L380,540" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="400" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">B · Timed or metered refill</text><rect x="450" y="120" width="60" height="340" rx="0" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="452" y="318" width="56" height="140" rx="0" fill="#dbeafe"/><rect x="468" y="128" width="24" height="20" rx="3" fill="#0b2f4a"/><rect x="478" y="148" width="4" height="282" rx="0" fill="#64748b"/><rect x="462" y="430" width="36" height="28" rx="0" fill="none" stroke="#0b2f4a" stroke-width="2"/><rect x="459" y="206" width="42" height="24" rx="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><path class="ln" d="M440,154 L520,154" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="532" y="159" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">overflow elbow</text><path class="ln" d="M440,218 L520,218" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="532" y="223" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#3a5a72">safety float shutoff</text><text x="532" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">clearly above the refill</text><path class="ln" d="M440,318 L520,318" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="532" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">programmed refill level</text><text x="532" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the valve ends refill here</text><rect class="box" x="390" y="480" width="340" height="58" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="406" y="504" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Float is only the backstop</text><text x="406" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">moving it does not change salt use</text><text x="532" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">refill &lt; shutoff &lt; overflow</text>
</svg>
