<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="p32-title p32-desc">
<title id="p32-title">Which 32,000 grain water softener to pick for your water</title>
<desc id="p32-desc">Decision chart for choosing a 32,000 grain water softener: city water leads to Aquasure Harmony, AFW Fleck 5600SXT with 10% resin or SoftPro Elite by priority; well water without iron leads to DuraWater, and well water with iron needs treatment or fine-mesh resin first.</desc>
<defs><marker id="d32a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="580" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Which 32,000 grain water softener for which water?</text>
<text x="30" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Use after the days grid says 32k is the right size for your household</text>
<rect class="box" x="230" y="84" width="300" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="380" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Where does your water come from?</text>
<path class="ln" d="M300,130 L200,168" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d32a)"/>
<path class="ln" d="M460,130 L560,168" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d32a)"/>
<rect class="box" x="60" y="172" width="280" height="46" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="200" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">City water, chlorinated</text>
<rect class="box" x="420" y="172" width="280" height="46" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="560" y="200" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Private well</text>
<path class="ln" d="M80,218 L80,446" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M80,278 L102,278" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d32a)"/>
<rect class="box" x="106" y="250" width="274" height="56" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="118" y="273" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Lowest upfront price</text>
<text x="118" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Aquasure Harmony 32k</text>
<path class="ln" d="M80,362 L102,362" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d32a)"/>
<rect class="box" x="106" y="334" width="274" height="56" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="118" y="357" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Fleck valve, 10% resin for chlorine</text>
<text x="118" y="377" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">AFW Fleck 5600SXT 32k</text>
<path class="ln" d="M80,446 L102,446" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d32a)"/>
<rect class="box" x="106" y="418" width="274" height="56" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="118" y="441" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Lowest salt use, or a septic system</text>
<text x="118" y="461" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">SoftPro Elite 32k</text>
<path class="ln" d="M560,218 L560,246" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d32a)"/>
<rect class="box" x="420" y="250" width="280" height="56" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="560" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Any iron, manganese or</text>
<text x="560" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">sediment on the water test?</text>
<path class="ln" d="M440,306 L440,446" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M440,362 L462,362" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d32a)"/>
<rect class="box" x="466" y="334" width="234" height="56" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="478" y="357" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">No</text>
<text x="478" y="377" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">DuraWater 5600SXT 32k</text>
<path class="ln" d="M440,446 L462,446" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d32a)"/>
<rect class="box" x="466" y="418" width="234" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="478" y="441" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Yes</text>
<text x="478" y="461" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Treat it first, or go fine mesh</text>
<text x="30" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Under 3 days on the grid: buy a 48k instead. Over 14 days: set the day override, or size down.</text>
<text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Prices change often, so check the current price before buying.</text>
</svg>
