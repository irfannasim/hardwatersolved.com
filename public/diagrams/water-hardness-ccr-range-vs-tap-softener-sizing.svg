<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 492" width="760" height="492" role="img" aria-labelledby="ccr-title ccr-desc">
<title id="ccr-title">Water hardness report CCR range vs tap reading for softener sizing</title>
<desc id="ccr-desc">Number line of a utility water hardness report range from 10 to 17.6 gpg, showing grains per day and per week at the bottom, midpoint and top, and how a softener sized from the 13.8 gpg midpoint falls short of the 36,960 grains this home needs.</desc>
<defs></defs>
<rect width="760" height="492" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water hardness report range vs your own tap</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Where you pick inside the CCR range decides the softener size you buy.</text><text x="380" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">Phoenix 2025 CCR range: 172–302 ppm (10–17.6 gpg)</text><rect x="110" y="116" width="540" height="18" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/><path class="ln" d="M67,152 L707,152" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M110,152 L110,158" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10</text><path class="ln" d="M252,152 L252,158" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="252" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">12</text><path class="ln" d="M394,152 L394,158" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="394" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">14</text><path class="ln" d="M536,152 L536,158" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="536" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">16</text><path class="ln" d="M678,152 L678,158" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="678" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">18</text><text x="715" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">gpg</text><circle cx="110" cy="125" r="7" fill="#0b2f4a" stroke="#ffffff" stroke-width="2"/><path class="ln" d="M110,182 L140,200" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="30" y="202" width="220" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="140" y="226" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0b2f4a">10 gpg</text><text x="140" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">bottom of the range</text><text x="140" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">3,000 grains/day</text><text x="140" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">21,000 per 7 days</text><text x="140" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">~24,000-grain unit</text><circle cx="380" cy="125" r="7" fill="#0b2f4a" stroke="#ffffff" stroke-width="2"/><path class="ln" d="M380,182 L380,200" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="270" y="202" width="220" height="118" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380" y="226" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0b2f4a">13.8 gpg</text><text x="380" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">midpoint: "feels safe"</text><text x="380" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">4,140 grains/day</text><text x="380" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">28,980 per 7 days</text><text x="380" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">~32,000-grain unit</text><circle cx="650" cy="125" r="7" fill="#c2410c" stroke="#ffffff" stroke-width="2"/><path class="ln" d="M650,182 L620,200" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="510" y="202" width="220" height="118" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="620" y="226" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#c2410c">17.6 gpg</text><text x="620" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">top of range = this home's tap</text><text x="620" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">5,280 grains/day</text><text x="620" y="287" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">36,960 per 7 days</text><text x="620" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">~40,000–48,000-grain unit</text><text x="30" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Buy from the midpoint, live at the top:</text><text x="30" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">32,000-grain unit</text><rect x="250" y="372" width="352" height="18" rx="3" fill="#0e7490"/><text x="30" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">needed per 7 days</text><rect x="250" y="400" width="406.56" height="18" rx="3" fill="#c2410c"/><text x="610" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">32,000</text><text x="664.56" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">36,960</text><path class="ln" d="M602,366 L602,424" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="30" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Hard water breaks through a day or more before each regeneration.</text><text x="30" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative: 4 people, 300 gal/day, regenerating every 7 days, no iron. The CCR range is real.</text>
</svg>
