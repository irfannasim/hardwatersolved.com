<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="mgp-title mgp-desc">
<title id="mgp-title">Water softener salt efficiency: grains restored by each extra pound of salt</title>
<desc id="mgp-desc">Two stacked bars comparing salt dose and softener capacity. The first 7.5 lb of salt restores 34,600 grains (4,613 per pound); the next two 11.25 lb steps add 15,800 and 13,600 grains, about 1,400 and 1,200 per pound.</desc>
<defs></defs>
<rect width="760" height="440" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Each extra pound of salt buys fewer grains</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same 2.0 cu ft softener, highest dose of 30 lb split into the three rated steps.</text><rect x="170" y="100" width="135" height="40" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/><text x="237.5" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">7.5 lb</text><rect x="305" y="100" width="202.5" height="40" fill="#8b5cf6" stroke="#ffffff" stroke-width="2"/><text x="406.25" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">+11.25 lb</text><rect x="507.5" y="100" width="202.5" height="40" fill="#a78bfa" stroke="#ffffff" stroke-width="2"/><text x="608.75" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">+11.25 lb</text><rect x="170" y="228" width="291.9375" height="40" fill="#0e7490" stroke="#ffffff" stroke-width="2"/><text x="315.96875" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">34,600</text><rect x="461.9375" y="228" width="133.3125" height="40" fill="#0891b2" stroke="#ffffff" stroke-width="2"/><text x="528.59375" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">+15,800</text><rect x="595.25" y="228" width="114.75" height="40" fill="#22b8cf" stroke="#ffffff" stroke-width="2"/><text x="652.625" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">+13,600</text><path class="ln" d="M305.0,144 L461.9,224" stroke="#52697a" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><path class="ln" d="M507.5,144 L595.3,224" stroke="#52697a" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/><text x="30" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Salt dose</text><text x="30" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">30 lb total</text><text x="30" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Grains</text><text x="30" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">64,000 total</text><text x="30" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Per pound</text><text x="315.96875" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">4,613 per lb</text><text x="528.59375" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">1,404 per lb</text><text x="652.625" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">1,209 per lb</text><rect class="box" x="30" y="332" width="700" height="88" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">The first 7.5 lb restores 34,600 grains. The next 22.5 lb adds 29,400: about 1,300 grains a pound.</text><text x="46" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Capacity keeps rising with salt, but every added pound does less than a third of the work of the first ones.</text><text x="46" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Rated capacities from the Pentair spec sheet; the per-pound figures for each step are calculated.</text>
</svg>
