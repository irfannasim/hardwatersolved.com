<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="cfd-title cfd-desc">
<title id="cfd-title">Best water softener and filter combos: combo or separate units decision chart</title>
<desc id="cfd-desc">Decision chart: keep a working softener and add carbon alone; chloramine needs catalytic carbon; well water with sediment or iron suits the Aquasure fine mesh softener with sediment pre-filter; no spare drain suits an upflow carbon combo; otherwise the AFWFilters backwashing carbon combo.</desc>
<defs><marker id="cfd-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="580" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Combo system or separate units?</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Answer from the top. The first yes decides.</text>
<rect class="box" x="30" y="90" width="380" height="64" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Already own a softener that</text>
<text x="48" y="137" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">works and has 5+ years left?</text>
<rect class="box" x="480" y="90" width="250" height="64" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="498" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Buy the carbon tank alone</text>
<text x="498" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">plumbed ahead of the softener</text>
<path class="ln" d="M410,122 L472,122" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfd-a)"/>
<text x="441" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Yes</text>
<path class="ln" d="M220,154 L220,182" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfd-a)"/>
<text x="232" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text>
<rect class="box" x="30" y="190" width="380" height="64" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">City water treated with</text>
<text x="48" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">chloramine, not chlorine?</text>
<rect class="box" x="480" y="190" width="250" height="64" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="498" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Catalytic carbon combo</text>
<text x="498" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">or a separate catalytic tank</text>
<path class="ln" d="M410,222 L472,222" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfd-a)"/>
<text x="441" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Yes</text>
<path class="ln" d="M220,254 L220,282" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfd-a)"/>
<text x="232" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text>
<rect class="box" x="30" y="290" width="380" height="64" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="317" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Well water with sediment or</text>
<text x="48" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">iron up to 10 ppm, no chlorine?</text>
<rect class="box" x="480" y="290" width="250" height="64" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="498" y="317" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Aquasure 48k fine mesh</text>
<text x="498" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">+ pleated sediment pre-filter</text>
<path class="ln" d="M410,322 L472,322" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfd-a)"/>
<text x="441" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Yes</text>
<path class="ln" d="M220,354 L220,382" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfd-a)"/>
<text x="232" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text>
<rect class="box" x="30" y="390" width="380" height="64" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="417" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">No drain or outlet free for</text>
<text x="48" y="437" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">a second backwashing tank?</text>
<rect class="box" x="480" y="390" width="250" height="64" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="498" y="417" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Oceanic upflow carbon combo</text>
<text x="498" y="437" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">carbon tank needs no drain</text>
<path class="ln" d="M410,422 L472,422" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfd-a)"/>
<text x="441" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Yes</text>
<path class="ln" d="M220,454 L220,482" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfd-a)"/>
<text x="232" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text>
<rect class="box" x="30" y="490" width="380" height="64" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="48" y="517" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Chlorinated city water, room to spare:</text>
<text x="48" y="537" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">AFWFilters 48k + backwashing carbon</text>
</svg>
