<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" width="760" height="476" role="img" aria-labelledby="sce-title sce-desc">
<title id="sce-title">Water softener salt efficiency vs capacity on one spec sheet</title>
<desc id="sce-desc">Bar chart of one 2.0 cubic foot water softener at three salt doses: 34,600 grains at 7.5 lb (4,613 grains per pound), 50,400 at 18.75 lb (2,688) and 64,000 at 30 lb (2,133). The efficiency claim and the capacity claim come from opposite settings.</desc>
<defs></defs>
<rect width="760" height="476" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Two headline numbers, two different salt settings</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">One Pentair 2.0 cu ft softener (part 35922). Rated figures from its spec sheet.</text><text x="30" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">7.5 lb of salt</text><rect class="box" x="30" y="126" width="150" height="24" rx="12" fill="#15803d" stroke="#15803d" stroke-width="1"/><text x="105" y="143" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">EFFICIENCY CLAIM</text><rect x="200" y="96" width="216" height="26" rx="4" fill="#0e7490"/><text x="424" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">34,600 grains</text><text x="200" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">4,613 grains per lb of salt: above the 3,350 efficiency line</text><text x="30" y="194" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">18.75 lb of salt</text><rect x="200" y="176" width="315" height="26" rx="4" fill="#0e7490"/><text x="523" y="194" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">50,400 grains</text><text x="200" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">2,688 grains per lb of salt: below the 3,350 efficiency line</text><text x="30" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">30 lb of salt</text><rect class="box" x="30" y="286" width="150" height="24" rx="12" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><text x="105" y="303" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">CAPACITY CLAIM</text><rect x="200" y="256" width="400" height="26" rx="4" fill="#0e7490"/><text x="608" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">64,000 grains</text><text x="200" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">2,133 grains per lb of salt: below the 3,350 efficiency line</text><path class="ln" d="M200,330 L600,330" stroke="#3a5a72" stroke-width="1.5" fill="none"/><path class="ln" d="M200,330 L200,336" stroke="#3a5a72" stroke-width="1.5" fill="none"/><text x="200" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><path class="ln" d="M300,330 L300,336" stroke="#3a5a72" stroke-width="1.5" fill="none"/><text x="300" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">16,000</text><path class="ln" d="M400,330 L400,336" stroke="#3a5a72" stroke-width="1.5" fill="none"/><text x="400" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">32,000</text><path class="ln" d="M500,330 L500,336" stroke="#3a5a72" stroke-width="1.5" fill="none"/><text x="500" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">48,000</text><path class="ln" d="M600,330 L600,336" stroke="#3a5a72" stroke-width="1.5" fill="none"/><text x="600" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">64,000</text><text x="640" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">grains</text><rect class="box" x="30" y="372" width="700" height="84" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="396" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Both numbers are real. They are never true at the same time.</text><text x="46" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Grains per pound = rated capacity divided by salt dose. The 4,613 figure is printed on the sheet; the</text><text x="46" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">other two are calculated. NSF/ANSI 44 efficiency rating needs at least 3,350 grains per pound.</text>
</svg>
