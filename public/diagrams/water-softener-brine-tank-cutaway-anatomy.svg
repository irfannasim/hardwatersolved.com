<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="g4ba-title g4ba-desc">
<title id="g4ba-title">Water softener brine tank cutaway: brine well, float and air check</title>
<desc id="g4ba-desc">Cutaway of a water softener brine tank showing the brine line from the control valve, the brine well and cap, brine valve body, float rod, float stops, safety float, air check, grid plate, salt, water and the overflow elbow to a drain.</desc>
<defs><marker id="g4ba-ab" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="g4ba-ad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="g4ba-sa" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern></defs>
<rect width="760" height="590" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inside a water softener brine tank</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Almost everything that can go wrong in the tank sits in or around the brine well.</text><rect class="box" x="560" y="96" width="170" height="40" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="645" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text><path class="ln" d="M556,116 L320,116 L320,186" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4ba-ab)" marker-start="url(#g4ba-ab)"/><text x="440" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">brine line: refill in, brine out</text><rect x="280" y="150" width="260" height="390" rx="14" fill="#ffffff" stroke="#3a5a72" stroke-width="2.5"/><rect x="344" y="280" width="193" height="186" fill="url(#g4ba-sa)"/><rect x="283" y="420" width="254" height="117" rx="0" fill="#dbeafe" opacity="0.75"/><rect x="344" y="466" width="193" height="8" rx="0" fill="#3a5a72"/><rect x="360" y="474" width="6" height="60" rx="0" fill="#3a5a72"/><rect x="440" y="474" width="6" height="60" rx="0" fill="#3a5a72"/><rect x="515" y="474" width="6" height="60" rx="0" fill="#3a5a72"/><rect x="300" y="158" width="40" height="380" rx="0" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="296" y="150" width="48" height="10" rx="2" fill="#0b2f4a"/><rect x="308" y="186" width="24" height="24" rx="3" fill="#0b2f4a"/><rect x="318" y="210" width="4" height="256" rx="0" fill="#64748b"/><rect x="310" y="296" width="20" height="5" rx="0" fill="#dc2626"/><rect x="310" y="346" width="20" height="5" rx="0" fill="#dc2626"/><rect x="309" y="304" width="22" height="38" rx="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><rect x="306" y="466" width="28" height="66" rx="0" fill="none" stroke="#0b2f4a" stroke-width="2"/><circle cx="320" cy="512" r="8" fill="#0b2f4a"/><text x="270" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">brine well + cap</text><path class="ln" d="M274,162 L298,162" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">brine valve body</text><text x="270" y="221" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">shutoff seat</text><path class="ln" d="M274,200 L306,199" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="260" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">float rod</text><text x="270" y="277" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">Fleck: 30-inch rod</text><path class="ln" d="M274,256 L316,258" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">float stops / clips</text><path class="ln" d="M274,296 L308,298" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">safety float</text><path class="ln" d="M274,332 L307,326" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">air check</text><text x="270" y="517" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">cut level with grid plate</text><path class="ln" d="M274,496 L304,498" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M540,214 L590,214 L590,530" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4ba-ad)"/><text x="604" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">overflow elbow</text><text x="604" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">gravity escape</text><text x="604" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to a drain</text><text x="604" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">salt</text><path class="ln" d="M600,326 L520,326" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">water</text><path class="ln" d="M600,436 L520,436" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">grid plate</text><path class="ln" d="M600,476 L530,470" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="565" width="26" height="6" rx="3" fill="#7c3aed"/><text x="64" y="572" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine line (both ways)</text><rect x="250" y="565" width="26" height="6" rx="3" fill="#78716c"/><text x="284" y="572" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">overflow to drain</text><rect x="470" y="561" width="26" height="14" rx="3" fill="#dc2626" stroke="#3a5a72" stroke-width="1"/><text x="504" y="572" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">float stops</text>
</svg>
