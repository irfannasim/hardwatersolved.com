<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" width="760" height="544" role="img" aria-labelledby="wrl-title wrl-desc">
<title id="wrl-title">Water softener restrictions in the US: five kinds of rule from voluntary to removal</title>
<desc id="wrl-desc">Five kinds of water softener restrictions with real examples: voluntary salt reduction in Madison and Minnesota, California performance conditions, the Massachusetts septic backwash rule, California local bans on new units, and the Santa Clarita removal program.</desc>
<defs><marker id="wrl-m" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="544" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Five kinds of water softener restriction in the US</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Mildest at the top, strictest at the bottom. Examples verified against the rule text.</text><text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Type of rule</text><text x="260" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Example</text><text x="500" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">What it means for you</text><rect class="box" x="60" y="104" width="190" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2.5"/><text x="72" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Voluntary salt</text><text x="72" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">reduction</text><rect class="box" x="260" y="104" width="230" height="64" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="272" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Madison sewerage district (WI);</text><text x="272" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Minnesota Pollution Control</text><text x="272" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Agency</text><rect class="box" x="500" y="104" width="230" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="512" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Tune or upgrade your softener.</text><text x="512" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">No legal limit on owning one.</text><rect class="box" x="60" y="180" width="190" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2.5"/><text x="72" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Performance conditions</text><text x="72" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">on every new unit</text><rect class="box" x="260" y="180" width="230" height="64" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="272" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">California statewide:</text><text x="272" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Health and Safety Code</text><text x="272" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">section 116785</text><rect class="box" x="500" y="180" width="230" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="512" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Demand-initiated and certified</text><text x="512" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">at 4,000+ grains per lb of salt</text><text x="512" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">if it drains to a sewer.</text><rect class="box" x="60" y="256" width="190" height="64" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/><text x="72" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">No backwash into</text><text x="72" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">a septic system</text><rect class="box" x="260" y="256" width="230" height="64" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="272" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Massachusetts Title 5:</text><text x="272" y="299" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">310 CMR 15.004(8)</text><rect class="box" x="500" y="256" width="230" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="512" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The regeneration water needs</text><text x="512" y="299" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">a different, approved outlet.</text><rect class="box" x="60" y="332" width="190" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/><text x="72" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Ban on new</text><text x="72" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">self-regenerating units</text><rect class="box" x="260" y="332" width="230" height="64" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="272" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">California Water Code 13148</text><text x="272" y="369" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">(listed regions and counties)</text><text x="272" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">after a regional board finding</text><rect class="box" x="500" y="332" width="230" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="512" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A local ordinance can stop you</text><text x="512" y="375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">installing one at all.</text><rect class="box" x="60" y="408" width="190" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/><text x="72" y="434" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Removal of existing</text><text x="72" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">units</text><rect class="box" x="260" y="408" width="230" height="64" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="272" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Santa Clarita Valley</text><text x="272" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sanitation District:</text><text x="272" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Health and Safety Code 116787</text><rect class="box" x="500" y="408" width="230" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="512" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Removal after a public vote,</text><text x="512" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">with compensation offered for</text><text x="512" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the value of the unit.</text><path class="ln" d="M38,112 L38,466" fill="none" stroke="#52697a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrl-m)"/><text x="30" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Rules change and most are local. Ask your sewer or sanitation district, or your county health department if</text><text x="30" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">you are on septic, before you buy.</text>
</svg>
