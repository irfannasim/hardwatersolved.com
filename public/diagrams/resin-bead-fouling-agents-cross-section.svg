<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" width="760" height="548" role="img" aria-labelledby="g6rf-title g6rf-desc">
<title id="g6rf-title">Water softener resin fouling: what iron, manganese, sediment and organics do to a resin bead</title>
<desc id="g6rf-desc">Six resin bead cross-sections compare healthy water softener resin with beads fouled by an iron film, a darker manganese film, buried sediment and organic staining, and a chlorine-damaged bead that is broken rather than coated.</desc>
<defs></defs>
<rect width="760" height="548" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Resin fouling: what each agent does to a bead</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Coatings sit on the surface, organics bind to the sites themselves, and chlorine breaks the bead.</text>
