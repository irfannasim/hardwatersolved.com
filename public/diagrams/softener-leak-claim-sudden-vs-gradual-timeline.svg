<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" width="760" height="544" role="img" aria-labelledby="g18sg-title g18sg-desc">
<title id="g18sg-title">Homeowners insurance and a water softener leak: sudden versus gradual damage</title>
<desc id="g18sg-desc">Two timelines showing how homeowners insurance generally treats a water softener leak: a connector that bursts overnight is usually a covered sudden and accidental discharge, while a seep at the tank base for months is often excluded as gradual damage or neglect.</desc>
<defs></defs>
<rect width="760" height="544" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Same softener, two leaks, two very different claims</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">How insurers generally sort water damage. Your policy wording decides your case.</text>
<rect class="box" x="30" y="90" width="700" height="172" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Sudden: a supply connector bursts overnight</text>
<path class="ln" d="M50,160 L450,160" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90" cy="160" r="8" fill="#0e7490"/>
<text x="90" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Day 0</text>
<text x="90" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Log: floor dry,</text>
<text x="90" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">no drips</text>
<circle cx="250" cy="160" r="8" fill="#0e7490"/>
<text x="250" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2 a.m.</text>
<text x="250" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Connector</text>
<text x="250" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">bursts</text>
<circle cx="400" cy="160" r="8" fill="#0e7490"/>
<text x="400" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">7 a.m.</text>
<text x="400" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Found, water off,</text>
<text x="400" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">reported</text>
<rect class="box" x="480" y="134" width="234" height="104" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="494" y="162" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Usually a covered peril</text>
<text x="494" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">"Sudden and accidental"</text>
<text x="494" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">discharge, less deductible</text>
<rect class="box" x="30" y="282" width="700" height="172" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="310" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">Gradual: a seep at the tank base for months</text>
<path class="ln" d="M50,352 L450,352" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90" cy="352" r="8" fill="#dc2626"/>
<text x="90" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Start</text>
<text x="90" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Slow seep,</text>
<text x="90" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">no one looks</text>
<circle cx="250" cy="352" r="8" fill="#dc2626"/>
<text x="250" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Weeks on</text>
<text x="250" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Staining, rot,</text>
<text x="250" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">mold</text>
<circle cx="400" cy="352" r="8" fill="#dc2626"/>
<text x="400" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Months on</text>
<text x="400" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Found: subfloor</text>
<text x="400" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">and walls damaged</text>
<rect class="box" x="480" y="326" width="234" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="494" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Often excluded</text>
<text x="494" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Seepage, wear and tear,</text>
<text x="494" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">neglect or mold</text>
<rect class="box" x="30" y="472" width="700" height="50" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="46" y="503" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A dated maintenance log is the evidence of when the floor was last dry and the unit sound.</text>
</svg>
