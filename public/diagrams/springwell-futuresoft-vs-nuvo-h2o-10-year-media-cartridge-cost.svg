<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="sfc-title sfc-desc">
<title id="sfc-title">SpringWell FutureSoft vs Nuvo H2O: cartridges and media changes over 10 years</title>
<desc id="sfc-desc">Illustrative count of what SpringWell FutureSoft and Nuvo H2O need replaced over 10 years at 70 gallons per person a day: the NuvoH2O Manor needs about 20 cartridges for two or four people and about 31 for six, while FutureSoft needs about 20 sediment cartridges plus a media change rated at 5+ years.</desc>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">What each system needs replaced over 10 years</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative, at 70 gallons per person a day through the system</text>
<rect x="30" y="84" width="18" height="14" fill="#0b2f4a"/><text x="56" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">NuvoH2O Manor cartridges</text>
<rect x="260" y="84" width="18" height="14" fill="#0e7490"/><text x="286" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">FutureSoft sediment cartridges</text>
<rect x="510" y="84" width="18" height="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="536" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">FutureSoft media change</text>
<text x="30" y="147" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">2 people</text><text x="30" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">51,100 gal a year</text>
<rect x="210" y="130" width="240" height="24" fill="#0b2f4a"/><text x="460" y="147" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 20</text>
<rect x="210" y="164" width="240" height="24" fill="#0e7490"/><rect x="456" y="164" width="18" height="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="484" y="181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 20 + 1 media change</text>
<text x="30" y="251" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">4 people</text><text x="30" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">102,200 gal a year</text>
<rect x="210" y="234" width="240" height="24" fill="#0b2f4a"/><text x="460" y="251" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 20</text>
<rect x="210" y="268" width="240" height="24" fill="#0e7490"/><rect x="456" y="268" width="18" height="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="484" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 20 + 1 media change</text>
<text x="30" y="355" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">6 people</text><text x="30" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">153,300 gal a year</text>
<rect x="210" y="338" width="372" height="24" fill="#0b2f4a"/><text x="592" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 31</text>
<rect x="210" y="372" width="240" height="24" fill="#0e7490"/><rect x="456" y="372" width="18" height="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="484" y="389" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 20 + 1 media change</text>
<path class="ln" d="M210,120 L210,422" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<rect class="box" x="30" y="442" width="700" height="80" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="50" y="469" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">NuvoH2O cartridge: about 6 months or 50,000 gallons, so the count rises with water use.</text>
<text x="50" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">FutureSoft: two sediment cartridges a year assumed; TAC media rated "5+ years".</text>
<text x="50" y="511" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">SpringWell does not publish a media price: ask for it before comparing costs.</text>
</svg>
