<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="wsa-title wsa-desc">
<title id="wsa-title">Well water sampling points and treatment order</title>
<desc id="wsa-desc">Diagram of a private well system: the iron sample is drawn from a port near the wellhead ahead of the pressure tank, the hardness sample from a cold tap between the pressure tank and the first treatment, pretreatment such as a neutraliser, iron filter or tannin stage goes ahead of the softener, and the softener is installed last.</desc>
<defs><marker id="wsa-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Well water: where to sample, and where each unit goes</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Draw iron close to the wellhead. Hardness reads the same either side of the pressure tank.</text><path class="ln" d="M64,200 L356,200" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M594,200 L608,200" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M704,200 L730,200" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsa-s)"/><path class="ln" d="M120,200 L120,236" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M300,200 L300,236" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="108" y="236" width="24" height="14" rx="4" fill="#c2410c"/><rect x="124" y="248" width="8" height="12" rx="2" fill="#c2410c"/><rect x="288" y="236" width="24" height="14" rx="4" fill="#c2410c"/><rect x="304" y="248" width="8" height="12" rx="2" fill="#c2410c"/><rect x="36" y="160" width="28" height="90" rx="3" fill="#94a3b8" stroke="#3a5a72" stroke-width="2"/><text x="50" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">WELL</text><rect x="180" y="150" width="60" height="100" rx="22" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><path d="M184,190 Q210,178 236,190" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="4 3"/><text x="210" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">PRESSURE TANK</text><text x="210" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#b45309">air turns dissolved iron to particles</text><rect class="box" x="360" y="142" width="234" height="152" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/><text x="477" y="164" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#b45309">PRETREATMENT</text><text x="477" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">only what the tests call for</text><text x="372" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Neutraliser: pH below ~6.8</text><text x="372" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">(it also raises hardness)</text><text x="372" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Iron filter: iron above ~5 mg/L,</text><text x="372" y="263" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">oxidised iron, or Mn &gt; 0.05 mg/L</text><text x="372" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Tannin stage: tannins present</text><rect class="box" x="612" y="176" width="92" height="48" rx="6" fill="#0b2f4a"/><text x="658" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><text x="658" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">installed last</text><text x="742" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">house</text><path class="ln" d="M120,258 L120,318" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M300,258 L300,318" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="30" y="320" width="220" height="100" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="42" y="343" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#b45309">IRON SAMPLE</text><text x="42" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Port closest to the wellhead,</text><text x="42" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">ahead of the pressure tank.</text><text x="42" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fill to the brim, cap at once.</text><rect class="box" x="260" y="320" width="220" height="100" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="272" y="343" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">HARDNESS SAMPLE</text><text x="272" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Cold tap between the pressure</text><text x="272" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">tank and the first treatment.</text><text x="272" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Remove the aerator, flush.</text><rect class="box" x="490" y="320" width="240" height="100" rx="10" fill="#f8fafc" stroke="#52697a" stroke-width="1.5"/><text x="502" y="343" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#52697a">AFTER ANY TREATMENT</text><text x="502" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Not raw water. Put the unit in</text><text x="502" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">bypass and flush 2–3 minutes</text><text x="502" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">before you draw a sample.</text><rect x="30" y="442" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">raw well water</text><rect x="220" y="442" width="26" height="6" rx="3" fill="#0e7490"/><text x="254" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text>
</svg>
