<rect x="679.6666666666667" y="337.8454545454546" width="32" height="92.15454545454543" fill="#0e7490"/>
<text x="657.6666666666667" y="137.92727272727274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">100.8</text>
<text x="695.6666666666667" y="329.8454545454546" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">32.7</text>
<text x="676.6666666666667" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">8 units</text>
<rect x="100" y="126" width="16" height="16" fill="#cbd5e1"/>
<line class="ln" x1="90" y1="114" x2="90" y2="430" stroke="#3a5a72" stroke-width="1.5"/>
<text x="124" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">If every unit peaked at once (units x 12.6 gpm)</text>
<rect x="100" y="152" width="16" height="16" fill="#0e7490"/>
<text x="124" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Probable peak from IPC Table E103.3(3), flush tanks</text>
<text x="30" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Grain capacity still scales with people. Flow scales far more slowly, so four units need</text>
<text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">about twice the peak flow of one unit, not four times.</text>
</svg>
