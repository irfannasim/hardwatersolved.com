<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="mud-title mud-desc">
<title id="mud-title">Multi-unit water softener sizing: peak flow diversity chart</title>
<desc id="mud-desc">Bar chart comparing the sum of each unit's peak flow with the plumbing code probable demand for 1 to 8 identical dwelling units sharing one water softener. Eight units add to 100.8 gpm but the probable peak is 32.7 gpm.</desc>
<defs></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Peak flow does not add up unit by unit</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Each unit: 1 bathroom group, kitchen sink, dishwasher and washer = 7.8 fixture units.</text>
<line class="ln" x1="90" y1="430" x2="730" y2="430" stroke="#3a5a72" stroke-width="1.5"/>
<text x="80" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<line class="ln" x1="86" y1="373.6363636363636" x2="94" y2="373.6363636363636" stroke="#3a5a72" stroke-width="1.5"/>
<text x="80" y="378.6363636363636" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">20</text>
<line class="ln" x1="86" y1="317.27272727272725" x2="94" y2="317.27272727272725" stroke="#3a5a72" stroke-width="1.5"/>
<text x="80" y="322.27272727272725" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">40</text>
<line class="ln" x1="86" y1="260.90909090909093" x2="94" y2="260.90909090909093" stroke="#3a5a72" stroke-width="1.5"/>
<text x="80" y="265.90909090909093" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">60</text>
<line class="ln" x1="86" y1="204.54545454545453" x2="94" y2="204.54545454545453" stroke="#3a5a72" stroke-width="1.5"/>
<text x="80" y="209.54545454545453" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">80</text>
<line class="ln" x1="86" y1="148.1818181818182" x2="94" y2="148.1818181818182" stroke="#3a5a72" stroke-width="1.5"/>
<text x="80" y="153.1818181818182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">100</text>
<text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">gpm</text>
<rect x="108.33333333333334" y="394.4909090909091" width="32" height="35.5090909090909" fill="#cbd5e1"/>
<rect x="146.33333333333334" y="394.4909090909091" width="32" height="35.5090909090909" fill="#0e7490"/>
<text x="124.33333333333334" y="386.4909090909091" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">12.6</text>
<text x="162.33333333333334" y="386.4909090909091" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">12.6</text>
