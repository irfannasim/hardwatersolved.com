<text x="375.6666666666667" y="363.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">20.9</text>
<text x="356.6666666666667" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">3 units</text>
<rect x="428.3333333333333" y="287.9636363636364" width="32" height="142.0363636363636" fill="#cbd5e1"/>
<rect x="466.3333333333333" y="363.2090909090909" width="32" height="66.79090909090911" fill="#0e7490"/>
<text x="444.3333333333333" y="279.9636363636364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">50.4</text>
<text x="482.3333333333333" y="355.2090909090909" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">23.7</text>
<text x="463.3333333333333" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">4 units</text>
<rect x="535.0000000000001" y="216.94545454545454" width="32" height="213.05454545454546" fill="#cbd5e1"/>
<rect x="573.0000000000001" y="350.5272727272727" width="32" height="79.4727272727273" fill="#0e7490"/>
<text x="551.0000000000001" y="208.94545454545454" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">75.6</text>
<text x="589.0000000000001" y="342.5272727272727" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">28.2</text>
<text x="570.0000000000001" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">6 units</text>
