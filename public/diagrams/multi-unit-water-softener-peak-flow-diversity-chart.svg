<rect x="253.00000000000003" y="379.8363636363636" width="32" height="50.163636363636385" fill="#0e7490"/>
<text x="231.00000000000003" y="350.9818181818182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">25.2</text>
<text x="269" y="371.8363636363636" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">17.8</text>
