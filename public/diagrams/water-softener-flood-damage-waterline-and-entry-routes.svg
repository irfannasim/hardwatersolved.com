<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 646" width="760" height="646" role="img" aria-labelledby="g4fl-title g4fl-desc">
<title id="g4fl-title">Water softener after flooding: waterline, verdicts and entry routes</title>
<desc id="g4fl-desc">Diagram of a water softener after flooding: the high-water mark, a verdict for the control head, mineral tank and brine tank, and the three routes floodwater takes into the resin: the drain line, the well supply and the submerged valve.</desc>
<defs><marker id="g4fl-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><pattern id="g4fl-bd" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="g4fl-sa" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern></defs>
<rect width="760" height="646" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Flooded softener: which parts, which routes</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Where the water reached decides each part’s verdict. Check all three routes into the resin.</text><g transform="translate(0,-44)"><text x="30" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from the well</text><path class="ln" d="M30,184 L296,184" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4fl-ah)"/><circle cx="110" cy="206" r="12" fill="#dc2626"/><text x="110" y="210.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><rect class="box" x="300" y="160" width="140" height="50" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="370" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL HEAD</text><rect x="320" y="210" width="100" height="230" rx="20" fill="url(#g4fl-bd)" stroke="#3a5a72" stroke-width="2"/><rect class="box" x="326" y="238" width="88" height="42" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1"/><text x="370" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">MINERAL</text><text x="370" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">TANK</text><circle cx="456" cy="150" r="12" fill="#dc2626"/><text x="456" y="154.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><path class="ln" d="M440,196 L640,196 L640,296" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="520" y="300" width="160" height="140" rx="12" fill="url(#g4fl-sa)" stroke="#3a5a72" stroke-width="2"/><rect class="box" x="540" y="350" width="120" height="26" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1"/><text x="600" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">BRINE TANK</text><path class="ln" d="M300,200 L250,200 L250,420" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="232" y="436" width="36" height="6" rx="0" fill="#1f2937"/><text x="30" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">receptacle and</text><text x="30" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">plug-in transformer</text><rect x="70" y="386" width="22" height="30" rx="3" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="76" y="394" width="3" height="8" rx="0" fill="#0b2f4a"/><rect x="84" y="394" width="3" height="8" rx="0" fill="#0b2f4a"/><rect x="30" y="440" width="700" height="10" rx="0" fill="#cbd5e1"/><rect x="30" y="330" width="700" height="110" rx="0" fill="#60a5fa" opacity="0.22"/><path class="ln" d="M30,330 L730,330" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/><text x="30" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#2563eb">high-water mark (example)</text><circle cx="284" cy="420" r="12" fill="#dc2626"/><text x="284" y="424.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><rect class="box" x="30" y="470" width="226" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="44" y="493" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Control head, if reached</text><text x="44" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Replace powerhead,</text><text x="44" y="531" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">transformer, receptacle</text><rect class="box" x="267" y="470" width="226" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="281" y="493" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Mineral tank</text><text x="281" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Outside only: usually keep.</text><text x="281" y="531" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Inside: sanitize and test.</text><rect class="box" x="504" y="470" width="226" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="518" y="493" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Brine tank</text><text x="518" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Scrub and disinfect it.</text><text x="518" y="531" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">New salt, float, brine valve.</text><circle cx="42" cy="580" r="10" fill="#dc2626"/><text x="42" y="584.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="60" y="585" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drain line: its end was under water at the floor drain</text><circle cx="42" cy="606" r="10" fill="#dc2626"/><text x="42" y="610.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="60" y="611" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Supply: the well, wellhead or well pit flooded</text><circle cx="42" cy="632" r="10" fill="#dc2626"/><text x="42" y="636.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="60" y="637" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Valve: control head fully submerged, water past seals and caps</text><text x="30" y="668" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">No route open = the flood only touched the outside of the mineral tank.</text></g>
</svg>
