<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="g4wh-title g4wh-desc">
<title id="g4wh-title">Water hammer after a water softener: how the pressure wave forms</title>
<desc id="g4wh-desc">Water hammer diagram: water moving at over 4 feet per second is stopped by a fast-closing softener valve, a pressure spike forms on the upstream side and travels back up the pipe at about 4,000 feet per second, reflecting off the main.</desc>
<defs><marker id="g4wh-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4wh-af" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water hammer: moving water stopped fast</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The water’s momentum becomes a pressure spike that races back up the supply pipe.</text><text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">1 · Flowing: backwash at 7 gpm through ¾-inch copper = over 4 ft/s</text><rect class="box" x="30" y="130" width="70" height="40" rx="8" fill="#3a5a72" stroke="#3a5a72" stroke-width="2"/><text x="65" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">MAIN</text><rect x="100" y="137" width="510" height="26" rx="0" fill="#dbeafe" stroke="#3a5a72" stroke-width="2"/><rect class="box" x="610" y="130" width="120" height="40" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="670" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE OPEN</text><path class="ln" d="M150,150 L230,150" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4wh-ah)"/><path class="ln" d="M300,150 L380,150" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4wh-ah)"/><path class="ln" d="M450,150 L530,150" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4wh-ah)"/><text x="30" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">2 · The valve shuts fast: pressure spikes on its upstream side</text><rect class="box" x="30" y="252" width="70" height="40" rx="8" fill="#3a5a72" stroke="#3a5a72" stroke-width="2"/><text x="65" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">MAIN</text><rect x="100" y="259" width="510" height="26" rx="0" fill="#dbeafe" stroke="#3a5a72" stroke-width="2"/><rect class="box" x="610" y="252" width="120" height="40" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="670" y="277" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE SHUT</text><rect x="540" y="260" width="68" height="24" rx="0" fill="#dc2626" opacity="0.8"/><text x="574" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">pressure spike</text><text x="30" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">3 · The spike races back, reflects off the main, and returns</text><rect class="box" x="30" y="374" width="70" height="40" rx="8" fill="#3a5a72" stroke="#3a5a72" stroke-width="2"/><text x="65" y="399" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">MAIN</text><rect x="100" y="381" width="510" height="26" rx="0" fill="#dbeafe" stroke="#3a5a72" stroke-width="2"/><rect class="box" x="610" y="374" width="120" height="40" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="2"/><text x="670" y="399" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE SHUT</text><rect x="250" y="382" width="60" height="24" rx="0" fill="#dc2626" opacity="0.8"/><path class="ln" d="M250,422 L120,422" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4wh-af)"/><text x="320" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">~4,000 ft/s in copper; each pass shakes free pipe</text><rect class="box" x="30" y="456" width="700" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="46" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Rule of thumb: an instant stop adds about 50–60 psi per ft/s of velocity lost.</text><text x="46" y="501" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Over 4 ft/s stopped instantly: a theoretical spike well over 200 psi. Real valves close slower.</text>
</svg>
