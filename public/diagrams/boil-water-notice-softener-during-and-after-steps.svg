<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 624" width="760" height="624" role="img" aria-labelledby="bwn-title bwn-desc">
<title id="bwn-title">Boil water notice water softener steps: during the notice and after it is lifted</title>
<desc id="bwn-desc">Four stages for a water softener during a boil water notice: bypass the softener while boiling drinking water, flush the house once the notice is lifted, sanitize the softener with a manual regeneration, then return it to service and replace filters.</desc>
<defs></defs>
<rect width="760" height="624" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">A water softener through a boil-water notice</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">From CDC, EPA and Oklahoma DEQ guidance. The instructions in your own notice come first.</text><rect class="box" x="30" y="90" width="170" height="104" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="44" y="130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">1  Notice issued</text><rect class="box" x="214" y="90" width="346" height="104" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="226" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Boil water for drinking, cooking, ice and brushing</text><text x="226" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">teeth: rolling boil 1 minute (3 minutes above</text><text x="226" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">6,500 ft, per CDC). Bypass the softener and shut</text><text x="226" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">off fridge and under-sink filters.</text><rect class="box" x="578" y="126" width="152" height="32" rx="16" fill="#52697a" stroke="#52697a" stroke-width="1"/><text x="654" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">BYPASS</text><rect class="box" x="30" y="214" width="170" height="104" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="44" y="254" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">2  Notice lifted:</text><text x="66" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">flush the house</text><rect class="box" x="214" y="214" width="346" height="104" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="226" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flush cold taps 5 minutes each, top floor down.</text><text x="226" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flush showers, outdoor taps and the fridge</text><text x="226" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">dispenser. Dump ice for 24 hours. Run hot taps</text><text x="226" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">until cold, or drain the water heater.</text><rect class="box" x="578" y="250" width="152" height="32" rx="16" fill="#52697a" stroke="#52697a" stroke-width="1"/><text x="654" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">BYPASS</text><rect class="box" x="30" y="338" width="170" height="104" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="44" y="378" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">3  Sanitize the</text><text x="66" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">softener</text><rect class="box" x="214" y="338" width="346" height="104" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="226" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Put the bleach dose from your manual into the</text><text x="226" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">brine well. Run a full manual regeneration so it</text><text x="226" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">passes through the resin and out to the drain.</text><text x="226" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Rinse until no chlorine smell remains.</text><rect class="box" x="578" y="374" width="152" height="32" rx="16" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><text x="654" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">REGENERATE</text><rect class="box" x="30" y="462" width="170" height="104" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="44" y="502" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">4  Back in</text><text x="66" y="522" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">service</text><rect class="box" x="214" y="462" width="346" height="104" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="226" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Return the bypass to service. Replace cartridge</text><text x="226" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">filters. Test hardness at a tap. Discard formula</text><text x="226" y="528" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">or food made with unboiled water during the</text><text x="226" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">notice.</text><rect class="box" x="578" y="498" width="152" height="32" rx="16" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><text x="654" y="519" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">IN SERVICE</text><text x="30" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">The softener never makes the water safe. Bypassing it keeps suspect water out of the resin bed.</text>
</svg>
