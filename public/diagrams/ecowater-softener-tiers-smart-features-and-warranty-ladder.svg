<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="ewt-title ewt-desc">
<title id="ewt-title">EcoWater water softener tiers: smart features and valve warranty by series</title>
<desc id="ewt-desc">Chart of EcoWater water softener series from the 1100 timer model to the 3700 refiner, showing the valve body warranty in years and the features each tier adds; HydroLink Plus Wi-Fi and the 10-year valve warranty arrive together at the Compact and 3700 Series.</desc>
