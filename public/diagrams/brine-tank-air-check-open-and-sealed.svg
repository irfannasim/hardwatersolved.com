<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" width="760" height="544" role="img" aria-labelledby="g4bc-title g4bc-desc">
<title id="g4bc-title">Brine tank air check: open during brine draw, sealed when drawn down</title>
<desc id="g4bc-desc">Brine tank air check diagram: while brine remains the check ball floats and brine flows to the injector; once the brine is drawn down the ball drops and seals so no air reaches the resin tank.</desc>
<defs><marker id="g4bc-ab" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="544" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">How the brine tank air check works</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">It stops the injector pulling air into the resin tank once the brine is drawn down.</text><text x="200" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1 · Brine above the check</text><rect x="130" y="120" width="150" height="300" rx="0" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="132" y="170" width="146" height="248" rx="0" fill="#ede9fe"/><rect x="160" y="330" width="40" height="70" rx="3" fill="none" stroke="#0b2f4a" stroke-width="2"/><rect x="168" y="398" width="24" height="5" rx="0" fill="#0b2f4a"/><circle cx="180" cy="350" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><path class="ln" d="M180,404 L180,412 L240,412 L240,138" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bc-ab)"/><text x="288" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to</text><text x="288" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">injector</text><text x="60" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">air</text><text x="60" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">check</text><path class="ln" d="M104,372 L156,372" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#7c3aed">brine</text><path class="ln" d="M100,196 L134,196" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2 · Brine drawn down</text><rect x="490" y="120" width="150" height="300" rx="0" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="492" y="380" width="146" height="38" rx="0" fill="#ede9fe"/><rect x="520" y="330" width="40" height="70" rx="3" fill="none" stroke="#0b2f4a" stroke-width="2"/><rect x="528" y="398" width="24" height="5" rx="0" fill="#0b2f4a"/><circle cx="540" cy="386" r="11" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><path class="ln" d="M540,404 L540,412 L600,412 L600,138" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to</text><text x="648" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">injector</text><text x="420" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">air</text><text x="420" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">check</text><path class="ln" d="M464,372 L516,372" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#7c3aed">brine</text><path class="ln" d="M460,394 L494,394" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M380,96 L380,500" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="200" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Ball floats: check open</text><text x="200" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">brine flows up to the injector</text><text x="560" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Ball drops and seals</text><text x="560" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">no air is pulled into the resin tank</text><text x="560" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">SWT: draw stops ~1 inch above the fitting</text><text x="30" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Plugged brine-well slots starve the check, so it closes early.</text><rect x="470" y="517" width="26" height="6" rx="3" fill="#7c3aed"/><text x="504" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine flowing</text><rect x="600" y="517" width="26" height="6" rx="3" fill="#cbd5e1"/><text x="634" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">no flow</text>
</svg>
