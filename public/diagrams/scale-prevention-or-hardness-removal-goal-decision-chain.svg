<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 586" width="760" height="586" role="img" aria-labelledby="gdc-title gdc-desc">
<title id="gdc-title">Decision chain: scale prevention or hardness removal</title>
<desc id="gdc-desc">Four questions in order decide between scale prevention and hardness removal. A yes to spots, soap or laundry, the soft-water feel, or water outside conditioner limits points to hardness removal. If only heated equipment matters, scale prevention is enough.</desc>
<defs><marker id="gdc-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="gdc-t" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="586" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Which goal do you need? Answer in order</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">The first yes decides. Removal questions come first because prevention cannot fix them.</text><rect class="box" x="30" y="88" width="440" height="58" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="46" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Do spots, soap scum, stiff laundry</text><text x="46" y="131" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">or dishwasher film bother you?</text><path class="ln" d="M250,149 L250,168" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gdc-s)"/><text x="262" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text><path class="ln" d="M473,117 L548,117" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gdc-t)"/><text x="505" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text><rect class="box" x="30" y="176" width="440" height="58" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="46" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Does anyone want the soft-water</text><text x="46" y="219" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">feel in the shower?</text><path class="ln" d="M250,237 L250,256" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gdc-s)"/><text x="262" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text><path class="ln" d="M473,205 L548,205" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gdc-t)"/><text x="505" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text><rect class="box" x="30" y="264" width="440" height="58" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="46" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Is your water outside a conditioner's</text><text x="46" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">hardness, iron, manganese or chlorine limits?</text><path class="ln" d="M250,325 L250,344" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gdc-s)"/><text x="262" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text><path class="ln" d="M473,293 L548,293" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gdc-t)"/><text x="505" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text><rect class="box" x="30" y="352" width="440" height="58" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="46" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Do only the water heater, kettles,</text><text x="46" y="395" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">tankless unit and pipes matter?</text><path class="ln" d="M473,381 L548,381" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gdc-t)"/><text x="505" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text><rect class="box" x="560" y="88" width="170" height="234" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="645" y="180" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0e7490">Hardness</text><text x="645" y="202" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#0e7490">removal</text><text x="645" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">softener for the house,</text><text x="645" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">or RO at one tap</text><rect class="box" x="560" y="352" width="170" height="58" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="645" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Scale prevention</text><text x="645" y="395" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">is enough</text><path class="ln" d="M250,413 L250,432" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gdc-s)"/><text x="262" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text><rect class="box" x="30" y="440" width="440" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="46" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">No whole-house treatment needed on these answers</text><rect class="box" x="30" y="510" width="700" height="50" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Salt discharge restricted or no drain? Prevention for the house, RO at the kitchen tap.</text>
</svg>
