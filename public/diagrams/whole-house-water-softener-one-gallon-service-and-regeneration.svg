<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 694" width="760" height="694" role="img" aria-labelledby="wsgj-title wsgj-desc">
<title id="wsgj-title">How a whole-house water softener works: one gallon in service, then regeneration</title>
<desc id="wsgj-desc">Two views of the same downflow water softener. In service, hard water enters the control valve, flows down through the resin bed where calcium and magnesium are exchanged for sodium, rises through the distributor tube and leaves as soft water. In regeneration, brine from the brine tank is drawn down through the resin, reversing the exchange, and the calcium, magnesium and spent brine go to drain.</desc>
<defs><marker id="wsgj-mc2410c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="wsgj-m0e7490" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="wsgj-m7c3aed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="wsgj-m78716c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="wsgj-resin" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#f6ead2"/><circle cx="4" cy="4" r="3" fill="#e2b865"/><circle cx="10" cy="10" r="3" fill="#e2b865"/></pattern><pattern id="wsgj-salt" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#f8fafc"/><rect x="2" y="2" width="9" height="6" rx="2" fill="#e2e8f0"/></pattern></defs>
<rect width="760" height="694" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">How a water softener works: the gallon, then the regeneration</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same downflow softener in both views. Only the water and where it goes change.</text>
<rect class="box" x="30" y="84" width="345" height="580" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="202" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e7490">In service: one gallon</text>
<rect x="90" y="200" width="120" height="270" rx="34" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/>
<rect x="95" y="250" width="110" height="214" rx="28" fill="url(#wsgj-resin)"/>
<rect x="144" y="176" width="12" height="284" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="80" y="140" width="140" height="36" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="150" y="163" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Valve</text>
<rect x="260" y="300" width="95" height="170" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/>
<rect x="290" y="350" width="60" height="115" fill="url(#wsgj-salt)"/>
<rect x="264" y="420" width="87" height="46" fill="#dbeafe" opacity="0.7"/>
<rect x="268" y="290" width="18" height="176" fill="#f1ebfe" stroke="#3a5a72" stroke-width="1.5"/>
<text x="320" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">brine</text>
<text x="320" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tank</text>
<path class="ln" d="M42,158 L74,158" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsgj-mc2410c)"/>
<text x="38" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">hard in</text>
<path class="ln" d="M176,138 L176,122" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsgj-m0e7490)"/>
<text x="196" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">soft out</text>
<path class="ln" d="M112,258 L112,340" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M112,340 L112,440" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsgj-m0e7490)"/>
<path class="ln" d="M150,452 L150,190" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsgj-m0e7490)"/>
<circle cx="54" cy="128" r="12" fill="#0b2f4a"/>
<text x="54" y="133" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="64" cy="340" r="12" fill="#0b2f4a"/>
<text x="64" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="64" cy="455" r="12" fill="#0b2f4a"/>
<text x="64" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="46" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">1</text>
<text x="66" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Valve sends the gallon into the tank;</text>
<text x="66" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">a meter counts it on the way in</text>
<text x="46" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">2</text>
<text x="66" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Down through the resin: calcium and</text>
<text x="66" y="574" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">magnesium swapped for sodium</text>
<text x="46" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">3</text>
<text x="66" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Up the distributor tube, out to</text>
<text x="66" y="618" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the house as soft water</text>
<text x="46" y="642" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Brine tank: idle, refilled and waiting</text>
<rect class="box" x="385" y="84" width="345" height="580" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="557" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7c3aed">In regeneration: reversed</text>
<rect x="445" y="200" width="120" height="270" rx="34" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/>
<rect x="450" y="250" width="110" height="214" rx="28" fill="url(#wsgj-resin)"/>
<rect x="499" y="176" width="12" height="284" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="435" y="140" width="140" height="36" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="505" y="163" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Valve</text>
<rect x="615" y="300" width="95" height="170" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/>
<rect x="645" y="350" width="60" height="115" fill="url(#wsgj-salt)"/>
<rect x="619" y="420" width="87" height="46" fill="#dbeafe" opacity="0.7"/>
<rect x="623" y="290" width="18" height="176" fill="#f1ebfe" stroke="#3a5a72" stroke-width="1.5"/>
<text x="675" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">brine</text>
<text x="675" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tank</text>
<path class="ln" d="M632,456 L632,250 L605,250 L605,158 L581,158" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsgj-m7c3aed)"/>
<path class="ln" d="M467,258 L467,440" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsgj-m7c3aed)"/>
<path class="ln" d="M505,452 L505,190" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsgj-m78716c)"/>
<path class="ln" d="M431,158 L397,158 L397,186" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsgj-m78716c)"/>
<text x="392" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#78716c">to drain</text>
<circle cx="581" cy="230" r="12" fill="#7c3aed"/>
<text x="581" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">B</text>
<circle cx="419" cy="340" r="12" fill="#7c3aed"/>
<text x="419" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">C</text>
<circle cx="419" cy="455" r="12" fill="#78716c"/>
<text x="419" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">D</text>
<text x="401" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">A</text>
<text x="421" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Backwash first: water up through</text>
<text x="421" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the bed lifts and loosens it</text>
<text x="401" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">B</text>
<text x="421" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Brine draw: strong brine pulled</text>
<text x="421" y="574" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">from the tank into the valve</text>
<text x="401" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">C</text>
<text x="421" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Brine forces sodium back on,</text>
<text x="421" y="618" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">calcium and magnesium off</text>
<text x="401" y="642" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">D</text>
<text x="421" y="642" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Rinses to drain, then brine refill</text>
</svg>
