<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="lhpp-title lhpp-desc">
<title id="lhpp-title">Two water softeners in parallel for a large home</title>
<desc id="lhpp-desc">Plumbing layout for two identical water softeners in parallel in a large home: hard water from the main splits at a tee into two equal branches, each softener treats half the flow, and the soft outlets rejoin before the house supply.</desc>
<defs><marker id="lhpp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="lhpp-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="lhpp-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="lhpp-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="lhpp-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="lhpp-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="lhpp-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Two softeners in parallel: the layout</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Each unit carries about half the flow, so the pair handles about twice what one bed can</text>
<rect class="box" x="30" y="236" width="110" height="52" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="85" y="258.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">From main</text>
<text x="85" y="275.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">hard water</text>
<path class="ln" d="M140,262 L196,262" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lhpp-h)"/>
<path class="ln" d="M206,262 L206,150 L262,150" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lhpp-h)"/>
<path class="ln" d="M206,262 L206,374 L262,374" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lhpp-h)"/>
<rect class="box" x="270" y="104" width="190" height="92" rx="6" fill="#fff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="365" y="127.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener A</text>
<text x="365" y="145.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">80k, 13x54 tank</text>
<text x="365" y="163.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Fleck 2510SXT valve</text>
<text x="365" y="181.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">bed peak: about 13.9 gpm</text>
<rect class="box" x="270" y="328" width="190" height="92" rx="6" fill="#fff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="365" y="351.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener B</text>
<text x="365" y="369.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">80k, 13x54 tank</text>
<text x="365" y="387.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Fleck 2510SXT valve</text>
<text x="365" y="405.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">bed peak: about 13.9 gpm</text>
<path class="ln" d="M460,150 L530,150 L530,262" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M460,374 L530,374 L530,262" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M530,262 L592,262" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lhpp-s)"/>
<rect class="box" x="600" y="236" width="130" height="52" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="665" y="258.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">To house</text>
<text x="665" y="275.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">soft water</text>
<text x="194" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#c2410c">about half the flow</text>
<text x="194" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#c2410c">about half the flow</text>
<text x="554" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">together: about</text>
<text x="554" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">27.8 gpm at peak</text>
<rect class="box" x="30" y="452" width="700" height="88" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="380" y="478.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Keep the two branches the same pipe size and length, so the flow splits evenly.</text>
<text x="380" y="500.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Set the regeneration times so the two units never regenerate at the same time.</text>
<text x="380" y="522.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Each unit needs its own drain, brine tank and backwash flow, one at a time.</text>
</svg>
