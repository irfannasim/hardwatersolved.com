<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="tpb-title tpb-desc">
<title id="tpb-title">Softened water tankless water heater payback: ten-year cost, untreated versus softened (illustrative)</title>
<desc id="tpb-desc">Illustrative stacked bars of ten-year costs for a tankless water heater: untreated at 15 gpg $4,700 versus $5,055 softened, and at 25 gpg $6,450 versus $6,515 softened, counting flushes, an out-of-warranty heat exchanger and the softener.</desc>
<defs></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Does the tankless heater pay for the softener? Ten-year cost</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative. $175 per professional flush, $1,200 heat exchanger, softener cost from our ownership model.</text><path d="M100,420 L730,420" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$0</text><path d="M100,331.42857142857144 L730,331.42857142857144" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="336.42857142857144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$2,000</text><path d="M100,242.85714285714286 L730,242.85714285714286" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="247.85714285714286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$4,000</text><path d="M100,154.28571428571428 L730,154.28571428571428" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="159.28571428571428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$6,000</text><rect x="140" y="265" width="80" height="155" fill="#c2410c"/><rect x="140" y="211.85714285714286" width="80" height="53.14285714285714" fill="#dc2626"/><text x="180" y="203.85714285714286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$4,700</text><text x="180" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Untreated</text><rect x="260" y="234.88571428571427" width="80" height="185.11428571428573" fill="#0e7490"/><rect x="260" y="196.13571428571427" width="80" height="38.75" fill="#67b7c7"/><text x="300" y="188.13571428571427" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$5,055</text><text x="300" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Softened</text><text x="240" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">15 gpg</text><rect x="450" y="187.5" width="80" height="232.5" fill="#c2410c"/><rect x="450" y="134.3571428571429" width="80" height="53.14285714285711" fill="#dc2626"/><text x="490" y="126.35714285714289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$6,450</text><text x="490" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Untreated</text><rect x="570" y="170.22857142857143" width="80" height="249.77142857142857" fill="#0e7490"/><rect x="570" y="131.47857142857146" width="80" height="38.74999999999997" fill="#67b7c7"/><text x="610" y="123.47857142857146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$6,515</text><text x="610" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Softened</text><text x="550" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">25 gpg</text><path d="M100,420 L730,420" fill="none" stroke="#3a5a72" stroke-width="1.5"/><rect x="30" y="488" width="16" height="16" fill="#c2410c"/><text x="52" y="501" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flushes, untreated</text><rect x="200" y="488" width="16" height="16" fill="#dc2626"/><text x="222" y="501" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Exchanger, out of warranty</text><rect x="420" y="488" width="16" height="16" fill="#0e7490"/><text x="442" y="501" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softener, 10 years</text><rect x="590" y="488" width="16" height="16" fill="#67b7c7"/><text x="612" y="501" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flushes, softened</text><text x="30" y="528" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Result: the heater alone roughly covers the softener. Every other benefit comes on top.</text>
</svg>
