<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="ros-title ros-desc">
<title id="ros-title">Sodium added by a water softener and left after a reverse osmosis system, at 10, 20 and 30 gpg</title>
<desc id="ros-desc">Illustrative bar chart for pairing an RO system with a water softener: softening 10, 20 and 30 gpg water adds about 79, 158 and 237 mg/L of sodium, and an RO membrane removing 93.6 percent leaves about 5, 10 and 15 mg/L, under EPA's 20 mg/L guidance level.</desc>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Sodium a softener adds, and what the RO leaves</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Added sodium only, in mg/L. Illustrative: 7.9 mg/L per gpg removed, RO at 93.6% reduction.</text>

<rect x="250" y="84" width="16" height="16" fill="#7c3aed"/>
<text x="274" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Softened tap</text>
<rect x="390" y="84" width="16" height="16" fill="#0e7490"/>
<text x="414" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">RO faucet</text>
<line x1="510" y1="92" x2="540" y2="92" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="548" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">EPA guidance, 20 mg/L</text>

<line class="ln" x1="100" y1="420" x2="720" y2="420" stroke="#3a5a72" stroke-width="1.5"/>
<line class="ln" x1="100" y1="140" x2="100" y2="420" stroke="#3a5a72" stroke-width="1.5"/>
<line x1="100" y1="364" x2="720" y2="364" stroke="#e2e8f0" stroke-width="1"/>
<line x1="100" y1="308" x2="720" y2="308" stroke="#e2e8f0" stroke-width="1"/>
<line x1="100" y1="252" x2="720" y2="252" stroke="#e2e8f0" stroke-width="1"/>
<line x1="100" y1="196" x2="720" y2="196" stroke="#e2e8f0" stroke-width="1"/>
<line x1="100" y1="140" x2="720" y2="140" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">0</text>
<text x="90" y="369" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">50</text>
<text x="90" y="313" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">100</text>
<text x="90" y="257" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">150</text>
<text x="90" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">200</text>
<text x="90" y="145" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">250</text>

<!-- scale: 1 mg/L = 1.12 px; baseline 420 -->
<line class="ln" x1="100" y1="398" x2="720" y2="398" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>

<rect x="150" y="332" width="70" height="88" fill="#7c3aed"/>
<text x="185" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">79</text>
<rect x="228" y="414" width="70" height="6" fill="#0e7490"/>
<text x="263" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">5</text>

<rect x="350" y="243" width="70" height="177" fill="#7c3aed"/>
<text x="385" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">158</text>
<rect x="428" y="409" width="70" height="11" fill="#0e7490"/>
<text x="463" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">10</text>

<rect x="550" y="155" width="70" height="265" fill="#7c3aed"/>
<text x="585" y="147" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">237</text>
<rect x="628" y="403" width="70" height="17" fill="#0e7490"/>
<text x="663" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">15</text>

<text x="224" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">10 gpg</text>
<text x="424" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">20 gpg</text>
<text x="624" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">30 gpg</text>
<text x="410" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Hardness removed by the softener</text>
<text x="30" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Sodium already in the raw water is not included. 93.6% is the Waterdrop G3P600's NSF/ANSI 58 TDS figure.</text>
</svg>
