<text x="407.42857142857144" y="177" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Nuvo operating range</text>
<text x="608.5714285714286" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Above EPA</text>
<path class="ln" d="M151.42857142857142,128 L151.42857142857142,118 L517.1428571428571,118 L517.1428571428571,128" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="334.2857142857143" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">EPA secondary guidance: pH 6.5 to 8.5</text>
<path class="ln" d="M462.2857142857141,262 L343.4285714285714,262" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nph-brine)"/>
<text x="471.42857142857144" y="267" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#7c3aed">citric acid lowers pH toward 7</text>
<text x="63.65714285714278" y="267" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Size of the drop: not published</text>
<rect class="box" x="30" y="296" width="700" height="100" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="322" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Copper pipes: what to do</text>
<text x="48" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Raw water near 7.3? Ask before buying: NuvoH2O does not recommend it below that pH.</text>
<text x="48" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">After install, test pH at a cold tap downstream of the system, then again a month later.</text>
<text x="48" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Blue-green stains or a metallic taste: test first-draw copper against EPA's 1.3 mg/L level.</text>
</svg>
