<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="c64-title c64-desc">
<title id="c64-title">Three checks before buying a 64,000 grain water softener</title>
<desc id="c64-desc">Decision chart for a 64,000 grain water softener: check the daily hardness load, whether a well can sustain the 12-inch tank backwash flow, and whether iron or manganese is present, before choosing a standard or fine-mesh 64k.</desc>
<defs><marker id="d64a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Three checks before ordering a 64,000 grain softener</text>
<text x="30" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Each "no" or "yes" on the right sends you to a better fit than a standard 64k</text>
<rect class="box" x="40" y="88" width="380" height="64" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="56" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">1. Daily load of 4,400 grains or more?</text>
<text x="56" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">people x 75 gallons x gpg (iron-adjusted)</text>
<rect class="box" x="474" y="88" width="256" height="64" rx="8" fill="#f1f5f9" stroke="#52697a" stroke-width="1.5"/>
<text x="488" y="110" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text>
<text x="488" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">48k is the better size</text>
<text x="488" y="145" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">a 64k would sit 9 to 14+ days</text>
<path class="ln" d="M420,120 L470,120" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d64a)"/>
<path class="ln" d="M230,152 L230,192" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d64a)"/>
<text x="242" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">Yes</text>
<rect class="box" x="40" y="196" width="380" height="64" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="56" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">2. On a well: can it hold the backwash flow?</text>
<text x="56" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">about 3.5 gpm (12-inch tank) for 20+ minutes</text>
<rect class="box" x="474" y="196" width="256" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="488" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">No</text>
<text x="488" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Narrower tank or twin tank</text>
<text x="488" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">or a 10-inch 48k, regenerating more</text>
<path class="ln" d="M420,228 L470,228" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d64a)"/>
<path class="ln" d="M230,260 L230,300" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d64a)"/>
<text x="242" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">Yes, or city water</text>
<rect class="box" x="40" y="304" width="380" height="64" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="56" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">3. Iron or manganese on the water test?</text>
<text x="56" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">dissolved (clear-water) iron, not rust</text>
<rect class="box" x="474" y="304" width="256" height="64" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="488" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#b45309">Yes</text>
<text x="488" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Fine-mesh 64k: Iron Pro 2</text>
<text x="488" y="361" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">listing: iron and manganese to 6 ppm</text>
<path class="ln" d="M420,336 L470,336" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d64a)"/>
<path class="ln" d="M230,368 L230,408" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#d64a)"/>
<text x="242" y="393" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">No</text>
<rect class="box" x="40" y="412" width="690" height="64" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="56" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">A standard 64k fits</text>
<text x="56" y="460" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fleck 5600SXT 64k, Aquasure Harmony 64k, or SoftPro Elite 64k for lowest salt use</text>
<text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Backwash flow rises with tank diameter, not grain rating. A 13-inch tank asks for about 4 to 5 gpm.</text>
<text x="30" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Iron above the listing limit, or rust you can see, needs an iron filter ahead of any softener.</text>
</svg>
