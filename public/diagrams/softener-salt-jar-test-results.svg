<circle cx="501.5" cy="256" r="1.6" fill="#a8a29e"/>
<circle cx="431.5" cy="274" r="1.6" fill="#a8a29e"/>
<circle cx="445.5" cy="282" r="1.6" fill="#a8a29e"/>
<circle cx="459.5" cy="274" r="1.6" fill="#a8a29e"/>
<circle cx="473.5" cy="282" r="1.6" fill="#a8a29e"/>
<circle cx="487.5" cy="274" r="1.6" fill="#a8a29e"/>
<circle cx="501.5" cy="282" r="1.6" fill="#a8a29e"/>
<text x="467.5" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Rock salt or a</text>
<text x="467.5" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">low-grade pellet</text>
<text x="467.5" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">cloudy water, distinct</text>
<text x="467.5" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">grey-brown band</text>
<text x="467.5" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">this is your</text>
<text x="467.5" y="467" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">tank residue</text>
<rect x="602.5" y="172" width="80" height="14" rx="3" fill="#3a5a72"/>
<rect x="594.5" y="186" width="96" height="150" rx="12" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="597.5" y="206" width="90" height="127" rx="9" fill="#ffedd5"/>
<rect x="597.5" y="323" width="90" height="10" fill="#b45309"/>
<text x="642.5" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Orange tint or</text>
<text x="642.5" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">reddish sediment</text>
<text x="642.5" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">unusual in salt: check</text>
<text x="642.5" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">the jar and the water</text>
<text x="642.5" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">source first</text>
