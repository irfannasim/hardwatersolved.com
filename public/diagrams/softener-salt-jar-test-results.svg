<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" role="img" aria-labelledby="g6jt-title g6jt-desc">
<title id="g6jt-title">Water softener salt jar test results by salt grade</title>
<desc id="g6jt-desc">Four jars show the water softener salt jar test: evaporated pellets leave clear water with a trace of sediment, solar crystals a thin pale layer, rock salt cloudy water with a grey-brown band, and an orange result that points away from the salt.</desc>
<defs></defs>
<rect width="760" height="486" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">The salt jar test: four possible results</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Read the bottom of the jar and the water above it after twenty minutes.</text>
<rect class="box" x="30" y="90" width="700" height="58" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="380" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">1 cup of salt from the bag · about 4 times as much warm water · shake 30 s · wait 20 min</text>
<text x="380" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">On a well with visible iron, make it up with bottled or filtered water.</text>
<rect x="77.5" y="172" width="80" height="14" rx="3" fill="#3a5a72"/>
<rect x="69.5" y="186" width="96" height="150" rx="12" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="72.5" y="206" width="90" height="127" rx="9" fill="#f0f9ff"/>
<rect x="72.5" y="330" width="90" height="3" fill="#a8a29e"/>
<text x="117.5" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Evaporated pellets</text>
<text x="117.5" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">or cubes</text>
<text x="117.5" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">water clear, trace</text>
<text x="117.5" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">of fine sediment</text>
<text x="117.5" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">very low insolubles</text>
<rect x="252.5" y="172" width="80" height="14" rx="3" fill="#3a5a72"/>
<rect x="244.5" y="186" width="96" height="150" rx="12" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="247.5" y="206" width="90" height="127" rx="9" fill="#f0f9ff"/>
<rect x="247.5" y="324" width="90" height="9" fill="#d6d3d1"/>
<text x="292.5" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Solar crystals</text>
<text x="292.5" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">water mostly clear,</text>
<text x="292.5" y="407" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">thin pale layer</text>
<text x="292.5" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">normal</text>
<rect x="427.5" y="172" width="80" height="14" rx="3" fill="#3a5a72"/>
<rect x="419.5" y="186" width="96" height="150" rx="12" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="422.5" y="206" width="90" height="127" rx="9" fill="#e2e0dd"/>
<rect x="422.5" y="307" width="90" height="26" fill="#a8a29e"/>
<circle cx="431.5" cy="222" r="1.6" fill="#a8a29e"/>
<circle cx="445.5" cy="230" r="1.6" fill="#a8a29e"/>
<circle cx="459.5" cy="222" r="1.6" fill="#a8a29e"/>
<circle cx="473.5" cy="230" r="1.6" fill="#a8a29e"/>
<circle cx="487.5" cy="222" r="1.6" fill="#a8a29e"/>
<circle cx="501.5" cy="230" r="1.6" fill="#a8a29e"/>
