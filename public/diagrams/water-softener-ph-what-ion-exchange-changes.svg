<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="g26ix-title g26ix-desc">
<title id="g26ix-title">Does a water softener change pH? What ion exchange swaps and what passes through</title>
<desc id="g26ix-desc">Hard water enters a sodium-form resin tank. The resin holds calcium and magnesium and releases sodium, so hardness falls, while hydrogen ions, bicarbonate alkalinity and dissolved carbon dioxide pass through unchanged, which is why a water softener does not change pH.</desc>
<defs>
<marker id="g26ix-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="g26ix-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<pattern id="g26ix-rb" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f6ead2"/><circle cx="8" cy="8" r="5" fill="#e2b865"/></pattern>
</defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">A softener swaps metal ions, not the things that set pH</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Household resin is in the sodium form, so it releases sodium, not acid.</text>
<rect class="box" x="30" y="100" width="210" height="200" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="46" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#c2410c">Hard water in</text>
<text x="46" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">Calcium, magnesium</text>
<text x="46" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Bicarbonate (alkalinity)</text>
<text x="46" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Carbon dioxide</text>
<text x="46" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">pH of the raw water</text>
<path class="ln" d="M246,200 L292,200" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" marker-end="url(#g26ix-ah)"/>
<rect x="305" y="100" width="150" height="200" rx="14" fill="url(#g26ix-rb)" stroke="#3a5a72" stroke-width="3"/>
<rect class="box" x="317" y="150" width="126" height="100" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="380" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="middle">Resin beads</text>
<text x="380" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a" text-anchor="middle">hold Ca and Mg</text>
<text x="380" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a" text-anchor="middle">release 2 Na</text>
<text x="380" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a" text-anchor="middle">for each</text>
<path class="ln" d="M462,200 L508,200" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" marker-end="url(#g26ix-as)"/>
<rect class="box" x="520" y="100" width="210" height="200" rx="8" fill="#e0f2f1" stroke="#0e7490" stroke-width="2"/>
<text x="536" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0e7490">Softened water out</text>
<text x="536" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">Sodium replaces Ca, Mg</text>
<text x="536" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Bicarbonate: unchanged</text>
<text x="536" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Carbon dioxide: unchanged</text>
<text x="536" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">pH: unchanged</text>
<rect class="box" x="30" y="336" width="340" height="156" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="46" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">SWAPPED BY THE RESIN</text>
<text x="46" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Calcium and magnesium out</text>
<text x="46" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Sodium in</text>
<text x="46" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Hardness falls to near zero</text>
<text x="46" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Scale tendency falls with it</text>
<rect class="box" x="390" y="336" width="340" height="156" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="406" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">PASSES THROUGH UNCHANGED</text>
<text x="406" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Hydrogen ions, which set pH</text>
<text x="406" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Bicarbonate and carbonate</text>
<text x="406" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Dissolved carbon dioxide</text>
<text x="406" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">So pH and alkalinity hold</text>
</svg>
