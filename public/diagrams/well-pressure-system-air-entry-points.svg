<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="g7wae-title g7wae-desc">
<title id="g7wae-title">Well pressure system air entry points</title>
<desc id="g7wae-desc">Well pressure system showing where air enters and makes water cloudy: a waterlogged pressure tank, a leak on the suction side of a jet pump, a low water level in the well and a worn snifter valve, all upstream of the softener.</desc>
<defs><marker id="g7wae-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g7wae-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="g7wae-air" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="660" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where air gets into a well system</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Persistent milky water on a well starts at the pump and tank, upstream of the softener.</text>
<rect x="30" y="210" width="700" height="200" fill="#f3ede3" stroke="none" stroke-width="2"/>
<path d="M30,210 L730,210" stroke="#8b6b4a" stroke-width="3"/>
<rect x="52" y="198" width="60" height="196" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="54" y="330" width="56" height="52" fill="#dbeafe" stroke="none" stroke-width="2"/>
<path d="M54,330 L110,330" stroke="#0e7490" stroke-width="2" stroke-dasharray="5 3"/>
<text x="124" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#3a5a72">WELL</text>
<path class="ln" d="M152,176 L82,176 L82,360" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="74" y="360" width="16" height="12" rx="2" fill="#0b2f4a" stroke="none" stroke-width="2"/>
<text x="124" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">foot valve</text>
<text x="154" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water level</text>
<rect class="box" x="152" y="152" width="104" height="48" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="204" y="181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">JET PUMP</text>
<path class="ln" d="M258,176 L330,176" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g7wae-hard)"/>
<rect x="290" y="160" width="10" height="12" fill="#0b2f4a" stroke="none" stroke-width="2"/>
<rect x="340" y="100" width="92" height="104" rx="18" fill="#dbeafe" stroke="#3a5a72" stroke-width="2"/>
<rect x="342" y="102" width="88" height="40" rx="16" fill="#ffffff" stroke="none" stroke-width="2"/>
<path d="M342,142 L430,142" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="386" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">air</text>
<text x="386" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">water</text>
<text x="386" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">PRESSURE TANK</text>
<path class="ln" d="M434,186 L518,186" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g7wae-hard)"/>
<path d="M470,186 L470,168" stroke="#3a5a72" stroke-width="3"/><circle cx="470" cy="160" r="10" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M470,160 L476,154" stroke="#dc2626" stroke-width="2"/>
<text x="470" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">gauge</text>
<rect class="box" x="528" y="162" width="96" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="576" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">SOFTENER</text>
<text x="576" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">downstream:</text>
<text x="576" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">no influence</text>
<path class="ln" d="M626,186 L670,186" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g7wae-soft)"/>
<text x="684" y="191" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">HOUSE</text>
<path class="ln" d="M122,140 L122,166" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#g7wae-air)"/>
<path class="ln" d="M295,128 L295,154" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#g7wae-air)"/>
<circle cx="446" cy="112" r="12" fill="#dc2626"/><text x="446" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="122" cy="124" r="12" fill="#dc2626"/><text x="122" y="129" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="134" cy="330" r="12" fill="#dc2626"/><text x="134" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="295" cy="112" r="12" fill="#dc2626"/><text x="295" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="42" cy="442" r="12" fill="#dc2626"/><text x="42" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="64" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Waterlogged pressure tank</text>
<text x="64" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bladder failed or air charge gone</text>
<circle cx="402" cy="442" r="12" fill="#dc2626"/><text x="402" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="424" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Suction-side leak</text>
<text x="424" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">under vacuum, it draws air, not water</text>
<circle cx="42" cy="498" r="12" fill="#dc2626"/><text x="42" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="64" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Low water level in the well</text>
<text x="64" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">pump breaks suction after a heavy draw</text>
<circle cx="402" cy="498" r="12" fill="#dc2626"/><text x="402" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="424" y="503" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Worn snifter valve or bleeder</text>
<text x="424" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">older galvanised tanks: far too much air</text>
<rect class="box" x="30" y="560" width="700" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="46" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">The tell: milky water is worst right after the pump starts, the pump cycles more</text>
<text x="46" y="600" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">often, and the gauge swings wider than the cut-in and cut-out settings allow.</text>
<rect x="30" y="633" width="26" height="6" rx="3" fill="#c2410c"/>
<text x="64" y="640" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated water</text>
<path d="M200,636 L226,636" stroke="#52697a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="234" y="640" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">air drawn in</text>
<circle cx="362" cy="636" r="9" fill="#dc2626"/>
<text x="378" y="640" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">air entry point</text>
</svg>
