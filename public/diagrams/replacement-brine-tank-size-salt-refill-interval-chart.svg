<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="brt-title brt-desc">
<title id="brt-title">Replacement brine tank size vs months between salt top-ups</title>
<desc id="brt-desc">Illustrative bar chart of months from a full brine tank to one-third full for 11x36 and 14x36 square and 18x33 and 18x40 round replacement brine tanks at 20, 40 and 80 lb of salt a month. An 18x33 round tank lasts about 6 months for a typical family of four, a 14x36 square tank about 3.</desc>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Months between salt top-ups, by brine tank size</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">From full to one-third full. Illustrative, from sellers' salt capacities</text>
<rect x="210" y="75" width="14" height="14" fill="#c4b5fd"/>
<text x="232" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">20 lb a month: couple, moderate hardness</text>
<rect x="210" y="95" width="14" height="14" fill="#8b5cf6"/>
<text x="232" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">40 lb: family of four, about 15 gpg</text>
<rect x="210" y="115" width="14" height="14" fill="#5b21b6"/>
<text x="232" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">80 lb: large family or very hard water</text>
<line x1="210" y1="152" x2="210" y2="434" stroke="#e2e8f0" stroke-width="1"/>
<text x="210" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<line x1="300" y1="152" x2="300" y2="434" stroke="#e2e8f0" stroke-width="1"/>
<text x="300" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">3</text>
<line x1="390" y1="152" x2="390" y2="434" stroke="#e2e8f0" stroke-width="1"/>
<text x="390" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">6</text>
<line x1="480" y1="152" x2="480" y2="434" stroke="#e2e8f0" stroke-width="1"/>
<text x="480" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">9</text>
<line x1="570" y1="152" x2="570" y2="434" stroke="#e2e8f0" stroke-width="1"/>
<text x="570" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">12</text>
<line x1="660" y1="152" x2="660" y2="434" stroke="#e2e8f0" stroke-width="1"/>
<text x="660" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">15</text>
<text x="435" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">months</text>
<text x="30" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">11 x 36 square</text>
<text x="30" y="197" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">about 150 lb of salt</text>
<rect x="210" y="160" width="150.0" height="14" fill="#c4b5fd"/>
<text x="366.0" y="172" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">5.0</text>
<rect x="210" y="178" width="75.0" height="14" fill="#8b5cf6"/>
<text x="291.0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">2.5</text>
<rect x="210" y="196" width="37.5" height="14" fill="#5b21b6"/>
<text x="253.5" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">1.3</text>
<text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">14 x 36 square</text>
<text x="30" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">about 200 lb of salt</text>
<rect x="210" y="232" width="200.0" height="14" fill="#c4b5fd"/>
<text x="416.0" y="244" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">6.7</text>
<rect x="210" y="250" width="100.0" height="14" fill="#8b5cf6"/>
<text x="316.0" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">3.3</text>
<rect x="210" y="268" width="50.0" height="14" fill="#5b21b6"/>
<text x="266.0" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">1.7</text>
<text x="30" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">18 x 33 round</text>
<text x="30" y="341" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">about 375 lb of salt</text>
<rect x="210" y="304" width="375.0" height="14" fill="#c4b5fd"/>
<text x="591.0" y="316" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">12.5</text>
<rect x="210" y="322" width="187.5" height="14" fill="#8b5cf6"/>
<text x="403.5" y="334" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">6.3</text>
<rect x="210" y="340" width="93.8" height="14" fill="#5b21b6"/>
<text x="309.8" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">3.1</text>
<text x="30" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">18 x 40 round</text>
<text x="30" y="413" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">about 450 lb of salt</text>
<rect x="210" y="376" width="450.0" height="14" fill="#c4b5fd"/>
<text x="666.0" y="388" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">15.0</text>
<rect x="210" y="394" width="225.0" height="14" fill="#8b5cf6"/>
<text x="441.0" y="406" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">7.5</text>
<rect x="210" y="412" width="112.5" height="14" fill="#5b21b6"/>
<text x="328.5" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0b2f4a">3.8</text>
<line x1="210" y1="152" x2="210" y2="434" stroke="#3a5a72" stroke-width="1.5"/>
<text x="30" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Top up when the salt is down to about a third. Keep the salt level above the water line.</text>
</svg>
