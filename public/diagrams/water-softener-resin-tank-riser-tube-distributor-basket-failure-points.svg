<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" width="760" height="630" role="img" aria-labelledby="rtf-title rtf-desc">
<title id="rtf-title">Water softener resin tank: riser tube, distributor basket and top screen failure points</title>
<desc id="rtf-desc">Water softener mineral tank cutaway showing the control valve top screen, riser tube, resin bed, gravel underbed, bottom distributor basket and freeboard, with the three failure points that let resin beads into household plumbing.</desc>
<defs><marker id="rtf-k" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><pattern id="rtf-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="rtf-grav" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#e7e5e4"/><circle cx="4" cy="4" r="3" fill="#a8a29e"/><circle cx="11" cy="9" r="2.5" fill="#a8a29e"/></pattern></defs>
<rect width="760" height="630" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where resin beads escape a softener tank</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Beads reach the house only if one of three parts has failed</text><path class="ln" d="M190,122 L290,122" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M470,122 L570,122" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">inlet</text><text x="570" y="108" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">outlet: to taps</text><rect x="290" y="150" width="180" height="430" rx="30" fill="#f4f9fb" stroke="#3a5a72" stroke-width="3" /><rect x="296" y="340" width="168" height="178" rx="0" fill="url(#rtf-beads)" /><rect x="296" y="518" width="168" height="50" rx="0" fill="url(#rtf-grav)" /><rect x="376" y="150" width="8" height="390" rx="0" fill="#94a3b8" /><rect x="360" y="540" width="40" height="18" rx="4" fill="#64748b" /><rect x="366" y="544" width="5" height="10" rx="0" fill="#e2e8f0" /><rect x="376" y="544" width="5" height="10" rx="0" fill="#e2e8f0" /><rect x="386" y="544" width="5" height="10" rx="0" fill="#e2e8f0" /><rect x="290" y="98" width="180" height="52" rx="8" fill="#0b2f4a" /><text x="380" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">CONTROL VALVE</text><rect x="356" y="150" width="48" height="10" fill="#e2e8f0" stroke="#3a5a72" stroke-dasharray="3 2"/><path class="ln" d="M492,160 L492,334" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rtf-k)"/><path class="ln" d="M492,334 L492,160" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rtf-k)"/><text x="504" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">freeboard:</text>
<text x="504" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">35–50% of</text>
<text x="504" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">tank height</text><text x="504" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">measure top of tank</text>
<text x="504" y="309" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to resin surface</text><path class="ln" d="M500,404 L468,404" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">resin bed: 0.5–1 mm</text>
<text x="508" y="417" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">amber beads</text><path class="ln" d="M500,526 L468,526" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">gravel underbed</text>
<text x="508" y="539" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">(if the design uses one)</text><path class="ln" d="M500,560 L404,552" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="508" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">bottom distributor basket</text><circle cx="250" cy="170" r="12" fill="#dc2626"/><text x="250" y="175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><path class="ln" d="M262,164 L354,156" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">top screen damaged or</text>
<text x="30" y="207" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">backwash too high:</text>
<text x="30" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">beads in the drain line</text><circle cx="250" cy="400" r="12" fill="#dc2626"/><text x="250" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text><path class="ln" d="M262,400 L374,420" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">cracked riser tube</text>
<text x="30" y="397" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">or slipped O-ring:</text><text x="30" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">slow trickle over weeks</text><circle cx="250" cy="556" r="12" fill="#dc2626"/><text x="250" y="561" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text><path class="ln" d="M262,556 L358,552" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">collapsed bottom</text>
<text x="30" y="553" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">basket:</text><text x="30" y="574" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">beads arrive fast</text><text x="30" y="612" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">Escaped beads collect in aerators, showerheads and appliance inlet screens.</text>
</svg>
