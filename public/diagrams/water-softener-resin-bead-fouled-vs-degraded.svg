<text x="380" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Iron coats the surface</text>
<text x="380" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">and covers the sites.</text>
<text x="380" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Rust-orange, still firm.</text>
<path d="M280,384 L286,391 L299,376" fill="none" stroke="#15803d" stroke-width="4"/>
<text x="309" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Cleaner usually removes it</text>
