<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" role="img" aria-labelledby="rfd-title rfd-desc">
<title id="rfd-title">Water softener resin cleaner: fouled bead versus degraded bead</title>
<desc id="rfd-desc">Comparison of a healthy softener resin bead, an iron-fouled bead whose coating a water softener resin cleaner can remove, and a chlorine-degraded bead whose broken structure no cleaner can reverse.</desc>
<defs></defs>
<rect width="760" height="446" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">What a resin cleaner can and cannot reach</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Fouling covers the exchange sites. Degradation means the sites are gone.</text>
