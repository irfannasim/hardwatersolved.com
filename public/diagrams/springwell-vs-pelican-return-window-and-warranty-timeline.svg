<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="swp-title swp-desc">
<title id="swp-title">SpringWell vs Pelican: return windows and warranty terms on a timeline</title>
<desc id="swp-desc">Timeline comparing SpringWell's salt-based SS softener and FutureSoft conditioner with Pelican's salt-based softener and NaturSoft conditioner: SpringWell's six-month return window for uninstalled units, its lifetime defect warranty and 5 or 7 year electronics term, NaturSoft's 12-year limited warranty and 5-year media change, and the Pelican terms that could not be read.</desc>
<defs><pattern id="swp-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ccfbf1"/><line x1="0" y1="0" x2="0" y2="8" stroke="#0e7490" stroke-width="3"/></pattern></defs>
<rect width="760" height="590" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">SpringWell vs Pelican: what protects you, and for how long</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">From each brand’s warranty, returns policy and listings, read 2 October 2026.</text><rect x="30" y="84" width="26" height="14" rx="3" fill="#0e7490" stroke="#0e7490" stroke-width="1.5" /><text x="64" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Covered</text><rect x="130" y="84" width="26" height="14" rx="3" fill="url(#swp-hatch)" stroke="#0e7490" stroke-width="1.5" /><text x="164" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Two terms published</text><rect x="320" y="84" width="26" height="14" rx="3" fill="#ffffff" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="354" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Expected wear or media change</text><rect x="560" y="84" width="26" height="14" rx="3" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="1.5" /><text x="594" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Could not be read</text><line x1="30" y1="226" x2="730" y2="226" stroke="#e2e8f0" stroke-width="1"/><line x1="30" y1="330" x2="730" y2="330" stroke="#e2e8f0" stroke-width="1"/><line x1="30" y1="392" x2="730" y2="392" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">SpringWell SS</text><text x="30" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">salt-based, SS1 / SS4 / SS+</text><rect x="250" y="124" width="60" height="16" rx="3" fill="#0e7490" stroke="#0e7490" stroke-width="1.5" /><text x="318" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Return if uninstalled, less 10% and freight</text><rect x="250" y="152" width="215.71428571428572" height="16" rx="3" fill="#0e7490" stroke="#0e7490" stroke-width="1.5" /><rect x="465.7142857142857" y="152" width="42.85714285714283" height="16" rx="3" fill="url(#swp-hatch)" stroke="#0e7490" stroke-width="1.5" /><text x="516.5714285714286" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Electronic head: 5 or 7 yr</text><rect x="250" y="182" width="430" height="18" rx="3" fill="#0e7490"/><path d="M680,178 L710,191 L680,204 Z" fill="#0e7490"/><text x="258" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#ffffff">Tanks, valves, fittings: lifetime, defects only</text><text x="30" y="254" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">SpringWell FutureSoft</text><text x="30" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">salt-free TAC, FS1 / FS4 / FS+</text><rect x="250" y="242" width="60" height="16" rx="3" fill="#0e7490" stroke="#0e7490" stroke-width="1.5" /><text x="318" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Return if uninstalled, less 10% and freight</text><rect x="250" y="270" width="215.71428571428572" height="16" rx="3" fill="#ffffff" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="473.7142857142857" y="283" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Media: “5+ year lifespan”, wear</text><rect x="250" y="298" width="430" height="18" rx="3" fill="#0e7490"/><path d="M680,294 L710,307 L680,320 Z" fill="#0e7490"/><text x="258" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#ffffff">Media, tank, head: lifetime, defects only</text><text x="30" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Pelican salt-based</text><text x="30" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sold as Pentair 35921</text><rect x="250" y="346" width="430" height="18" rx="3" fill="#cbd5e1"/><text x="258" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">No warranty text on the listing; pelicanwater.com offline</text><text x="30" y="420" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Pelican NaturSoft</text><text x="30" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">salt-free, NS3-P / NS6-P</text><rect x="250" y="408" width="120" height="16" rx="3" fill="#cbd5e1"/><text x="384" y="421" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Return terms: could not be read</text><rect x="250" y="436" width="215.71428571428572" height="16" rx="3" fill="#ffffff" stroke="#78716c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="473.7142857142857" y="449" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">First-tank media: 5 yr or 600,000 gal</text><rect x="250" y="464" width="365.7142857142858" height="18" rx="3" fill="#0e7490" stroke="#0e7490" stroke-width="1.5" /><text x="258" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#ffffff">12-year limited: tanks, valves, heads</text><line x1="250" y1="512" x2="370" y2="512" stroke="#3a5a72" stroke-width="1.5"/><line x1="380.00214285714287" y1="512" x2="680" y2="512" stroke="#3a5a72" stroke-width="1.5"/><path d="M372,519 L376,505 M377,519 L381,505" stroke="#3a5a72" stroke-width="1.5" fill="none"/><line x1="250" y1="512" x2="250" y2="518" stroke="#3a5a72" stroke-width="1.5"/><text x="250" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><line x1="310" y1="512" x2="310" y2="518" stroke="#3a5a72" stroke-width="1.5"/><text x="310" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6 mo</text><line x1="370" y1="512" x2="370" y2="518" stroke="#3a5a72" stroke-width="1.5"/><text x="370" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1 yr</text><line x1="465.7142857142857" y1="512" x2="465.7142857142857" y2="518" stroke="#3a5a72" stroke-width="1.5"/><text x="465.7142857142857" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5</text><line x1="508.57142857142856" y1="512" x2="508.57142857142856" y2="518" stroke="#3a5a72" stroke-width="1.5"/><text x="508.57142857142856" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">7</text><line x1="572.8571428571429" y1="512" x2="572.8571428571429" y2="518" stroke="#3a5a72" stroke-width="1.5"/><text x="572.8571428571429" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10</text><line x1="615.7142857142858" y1="512" x2="615.7142857142858" y2="518" stroke="#3a5a72" stroke-width="1.5"/><text x="615.7142857142858" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">12</text><line x1="680" y1="512" x2="680" y2="518" stroke="#3a5a72" stroke-width="1.5"/><text x="680" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">15 yr</text><text x="714" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">life</text><text x="30" y="558" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">First year stretched. SpringWell’s lifetime terms cover defects, not wear, and stay at the first address.</text></svg>
