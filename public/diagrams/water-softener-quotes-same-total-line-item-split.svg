<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="wqs-title wqs-desc">
<title id="wqs-title">Water softener quotes: two $3,200 quotes split by line item</title>
<desc id="wqs-desc">Illustrative stacked bars. Quote A totals 3,200 dollars: 1,400 for a 1.5 cubic foot softener, 600 for a carbon prefilter, 800 for installation with a new loop and drain, and 400 for five years of service. Quote B also totals 3,200 dollars: 2,700 for a dealer softener package and 500 for basic installation. Comparable online 48,000 grain softeners sold for about 630 to 1,370 dollars before installation.</desc>
