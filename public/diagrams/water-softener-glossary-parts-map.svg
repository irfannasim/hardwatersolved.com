<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-labelledby="gpm-title gpm-desc">
<title id="gpm-title">Water softener parts map for the glossary</title>
<desc id="gpm-desc">Numbered map of a two-tank water softener showing where the glossary terms sit: control valve, bypass valve, injector, mineral tank, freeboard, resin bed, distributor tube, bottom basket, brine tank, brine well, safety float, brine line, drain line, air gap and overflow line.</desc>
<defs>
<pattern id="gpm-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3.2" fill="#e2b865"/></pattern>
<marker id="gpm-ah-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="gpm-ah-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="gpm-ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
</defs>
<rect width="760" height="610" fill="#ffffff"/>
<text x="30" y="34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Where the glossary terms sit on a softener</text>
<text x="30" y="56" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">A typical two-tank, downflow softener. Numbers match the key.</text>
<path class="ln" d="M30,200 L58,200" stroke="#c2410c" stroke-width="5" fill="none" marker-end="url(#gpm-ah-o)"/>
<path class="ln" d="M60,220 L32,220" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#gpm-ah-t)"/>
<text x="30" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Hard in</text>
<text x="30" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Soft out</text>
<rect x="60" y="188" width="60" height="44" rx="4" fill="#cbd5e1" stroke="#3a5a72" stroke-width="2"/>
<path class="ln" d="M120,200 L140,200" stroke="#c2410c" stroke-width="5" fill="none"/>
<path class="ln" d="M120,220 L140,220" stroke="#0e7490" stroke-width="5" fill="none"/>
<rect x="140" y="180" width="130" height="60" rx="6" fill="#0b2f4a"/>
<rect x="150" y="240" width="110" height="320" rx="24" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/>
<rect x="160" y="256" width="90" height="74" fill="#dbeafe"/>
<rect x="156" y="330" width="98" height="200" fill="url(#gpm-beads)"/>
<path class="ln" d="M205,246 L205,538" stroke="#3a5a72" stroke-width="4" fill="none"/>
<rect x="192" y="536" width="26" height="12" rx="2" fill="#3a5a72"/>
<path class="ln" d="M170,180 L170,110 L330,110 L330,138" stroke="#78716c" stroke-width="4" fill="none" marker-end="url(#gpm-ah-g)"/>
<rect x="312" y="150" width="36" height="26" fill="#cbd5e1" stroke="#78716c" stroke-width="2"/>
<path class="ln" d="M270,225 L333,225 L333,315" stroke="#7c3aed" stroke-width="4" fill="none"/>
<rect x="310" y="300" width="130" height="260" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/>
<rect x="352" y="400" width="84" height="110" fill="#e7e5e4"/>
<rect x="314" y="510" width="122" height="46" fill="#dbeafe"/>
<rect x="320" y="315" width="26" height="235" fill="#ffffff" fill-opacity="0.6" stroke="#3a5a72" stroke-width="2"/>
<rect x="324" y="470" width="18" height="12" rx="2" fill="#52697a"/>
<path class="ln" d="M440,380 L462,380 L462,448" stroke="#78716c" stroke-width="4" fill="none" marker-end="url(#gpm-ah-g)"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">
<circle cx="205" cy="200" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="205" y="205">1</text>
<circle cx="100" cy="164" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="100" y="169">2</text>
<circle cx="292" cy="198" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="292" y="203">3</text>
<circle cx="128" cy="400" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="128" y="405">4</text>
<circle cx="232" cy="292" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="232" y="297">5</text>
<circle cx="232" cy="430" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="232" y="435">6</text>
<circle cx="180" cy="292" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="180" y="297">7</text>
<circle cx="128" cy="542" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="128" y="547">8</text>
<circle cx="400" cy="282" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="400" y="287">9</text>
<circle cx="288" cy="380" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="288" y="385">10</text>
<circle cx="288" cy="476" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="288" y="481">11</text>
<circle cx="300" cy="260" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="300" y="265">12</text>
<circle cx="250" cy="86" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="250" y="91">13</text>
<circle cx="372" cy="146" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="372" y="151">14</text>
<circle cx="488" cy="414" r="11" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="488" y="419">15</text>
</g>
<text x="520" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Key</text>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">
<text x="520" y="118">1  Control valve</text>
<text x="520" y="146">2  Bypass valve</text>
<text x="520" y="174">3  Injector (inside valve)</text>
<text x="520" y="202">4  Mineral (resin) tank</text>
<text x="520" y="230">5  Freeboard</text>
<text x="520" y="258">6  Resin bed</text>
<text x="520" y="286">7  Distributor (riser) tube</text>
<text x="520" y="314">8  Bottom basket</text>
<text x="520" y="342">9  Brine tank</text>
<text x="520" y="370">10  Brine well</text>
<text x="520" y="398">11  Safety float</text>
<text x="520" y="426">12  Brine line</text>
<text x="520" y="454">13  Drain line</text>
<text x="520" y="482">14  Air gap</text>
<text x="520" y="510">15  Overflow line</text>
</g>
<path class="ln" d="M30,590 L56,590" stroke="#c2410c" stroke-width="4" fill="none"/>
<text x="64" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">hard water</text>
<path class="ln" d="M160,590 L186,590" stroke="#0e7490" stroke-width="4" fill="none"/>
<text x="194" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">soft water</text>
<path class="ln" d="M290,590 L316,590" stroke="#7c3aed" stroke-width="4" fill="none"/>
<text x="324" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">brine</text>
<path class="ln" d="M390,590 L416,590" stroke="#78716c" stroke-width="4" fill="none"/>
<text x="424" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">to drain</text>
</svg>
