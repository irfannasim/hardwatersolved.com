<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="g26an-title g26an-desc">
<title id="g26an-title">Anatomy of an NSF/ANSI 44 water softener listing entry</title>
<desc id="g26an-desc">Illustrative NSF/ANSI 44 listing entry for a water softener, annotated: the certified maker and plant, the exact model and rated flow in gpm, the claim codes Hardness Reduction HR and Efficiency Rated ER with barium and radium claims, a numbered state footnote, and the POE and Pb notes for NSF/ANSI 61 materials and lead content.</desc>
<rect width="760" height="450" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Reading one Standard 44 listing entry</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative entry; the codes and footnotes are the ones NSF uses</text>
<rect class="box" x="30" y="92" width="440" height="306" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Example Water Co.</text>
<text x="46" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Facility: Anytown, USA</text>
<text x="46" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">MODEL</text>
<text x="160" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">GPM</text>
<text x="230" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">CLAIMS</text>
<text x="46" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">EX-48A [1]</text>
<text x="160" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">8</text>
<text x="230" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0e7490" font-weight="bold">Hardness Reduction [HR]</text>
<text x="230" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0e7490" font-weight="bold">Efficiency Rated [ER]</text>
<text x="230" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Barium Reduction</text>
<text x="230" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Radium 226/228 Reduction</text>
<text x="46" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">[1] Meets California efficiency rating rules</text>
<text x="46" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">[HR] Published capacity ratings verified</text>
<text x="46" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">[ER] 3,350+ grains per lb salt, 5 gal per 1,000 max</text>
<text x="46" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">[POE] Conforms to NSF/ANSI/CAN 61 materials</text>
<text x="46" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">[Pb] Meets lead free content limits (372)</text>
<path class="ln" d="M476,113 L494,113" fill="none" stroke="#52697a" stroke-width="1.5"/>
<text x="502" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Certified maker and plant</text>
<text x="502" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">may not be the brand on the box</text>
<path class="ln" d="M476,197 L494,197" fill="none" stroke="#52697a" stroke-width="1.5"/>
<text x="502" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Model and rated flow</text>
<text x="502" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">exact match, suffix included</text>
<path class="ln" d="M476,247 L494,247" fill="none" stroke="#52697a" stroke-width="1.5"/>
<text x="502" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Claims for this model</text>
<text x="502" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">[HR] and [ER] carry the value</text>
<path class="ln" d="M476,297 L494,297" fill="none" stroke="#52697a" stroke-width="1.5"/>
<text x="502" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Numbered footnote</text>
<text x="502" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">often a state requirement</text>
<path class="ln" d="M476,367 L494,367" fill="none" stroke="#52697a" stroke-width="1.5"/>
<text x="502" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">[POE] and [Pb]</text>
<text x="502" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">materials and lead only</text>
<text x="30" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">A line reading "Claim: N/A" is a certified component, such as a tank or resin, not a softener.</text>
</svg>
