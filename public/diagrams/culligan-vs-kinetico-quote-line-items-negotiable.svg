<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" role="img" aria-labelledby="cvk-title cvk-desc">
<title id="cvk-title">Culligan vs Kinetico: two illustrative quotes for the same house, line by line</title>
<desc id="cvk-desc">Illustrative bar chart of two dealer quotes for one family of four on 15 gpg water. Culligan Aquasential Smart HE 10-inch: softener 2,600 dollars, installation 400, bypass and fittings 150, removal 100, total 3,250. Kinetico Premier 2030s: softener 3,700, installation 450, fittings 150, removal 100, drinking-water RO add-on 1,200, total 5,600. Negotiable lines are marked.</desc>
<defs></defs>
<rect width="760" height="550" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Two quotes for the same house, line by line</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative one-time line items for a family of four on 15 gpg water. Not a price survey.</text>
<text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Culligan Aquasential Smart HE, 10-inch</text>
<text x="30" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Softener (1.5 cu ft resin)</text>
<rect x="30" y="142" width="175.7" height="20" fill="#0e7490"/>
<text x="213.67567567567568" y="157" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$2,600</text>
<text x="30" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Installation labor</text>
<rect x="30" y="198" width="27.0" height="20" fill="#0e7490"/>
<text x="65.02702702702703" y="213" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$400</text>
<text x="30" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Bypass valve and fittings</text>
<rect x="30" y="254" width="10.1" height="20" fill="#3a5a72"/>
<text x="48.13513513513514" y="269" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$150</text>
<text x="30" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Remove old softener</text>
<rect x="30" y="310" width="6.8" height="20" fill="#0e7490"/>
<text x="44.75675675675676" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$100</text>
<text x="30" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Drinking-water RO add-on</text>
<text x="30" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">not quoted</text>
<path class="ln" d="M30,404 L360,404" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="30" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Total: $3,250 one-time</text>
<text x="400" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Kinetico Premier 2030s twin tank</text>
<text x="400" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Softener (2 x 0.47 cu ft resin)</text>
<rect x="400" y="142" width="250.0" height="20" fill="#0e7490"/>
<text x="658" y="157" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$3,700</text>
<text x="400" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Installation labor</text>
<rect x="400" y="198" width="30.4" height="20" fill="#0e7490"/>
<text x="438.4054054054054" y="213" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$450</text>
<text x="400" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Bypass valve and fittings</text>
<rect x="400" y="254" width="10.1" height="20" fill="#3a5a72"/>
<text x="418.13513513513516" y="269" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$150</text>
<text x="400" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Remove old softener</text>
<rect x="400" y="310" width="6.8" height="20" fill="#0e7490"/>
<text x="414.7567567567568" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$100</text>
<text x="400" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Drinking-water RO add-on</text>
<rect x="400" y="366" width="81.1" height="20" fill="#0e7490"/>
<text x="489.0810810810811" y="381" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$1,200</text>
<path class="ln" d="M400,404 L730,404" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="400" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Total: $5,600 one-time ($4,400 without RO)</text>
<rect x="30" y="458" width="14" height="14" fill="#0e7490"/>
<text x="52" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Usually negotiable: ask for it to be reduced, waived or removed</text>
<rect x="30" y="484" width="14" height="14" fill="#3a5a72"/>
<text x="52" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Mostly fixed: parts and site work that any installer would charge</text>
<text x="30" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Recurring lines (service plans, salt delivery, rental) sit outside these totals; see the table below.</text>
</svg>
