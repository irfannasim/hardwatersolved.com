<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="760" height="482" role="img" aria-labelledby="irt-title irt-desc">
<title id="irt-title">Iron water softener sizing: days of each cycle on exhausted resin</title>
<desc id="irt-desc">Timeline for a 1 cubic foot softener on a 15 gpg well with 0, 0.5, 2 and 4 ppm iron. Programmed at raw hardness the valve waits 5.1 days, but the resin is exhausted after 4.5, 3.3 or 2.5 days, so 12, 35 or 52 percent of each cycle delivers hard water.</desc>
<defs><pattern id="irt-h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff7ed"/><rect width="3" height="8" fill="#f5b08c"/></pattern></defs>
<rect width="760" height="482" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Iron left out of the setting: days on exhausted resin</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">1 cu ft at 6 lb salt (22,930 grains), 300 gal/day, multiplier 4, valve set to raw 15 gpg</text><text x="30" y="158" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">0 ppm iron</text><text x="30" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">15 gpg</text><rect x="200" y="146" width="408" height="30" fill="#0e7490"/><text x="210" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#ffffff">soft for 5.1 days</text><text x="620" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">no shortfall</text><text x="30" y="216" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">0.5 ppm iron</text><text x="30" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">17 gpg compensated</text><rect x="200" y="204" width="360" height="30" fill="#0e7490"/><rect x="560" y="204" width="47.99999999999997" height="30" fill="url(#irt-h)" stroke="#c2410c" stroke-width="1.5"/><text x="210" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#ffffff">soft for 4.5 days</text><text x="620" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">12% of cycle</text><text x="30" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">2 ppm iron</text><text x="30" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">23 gpg compensated</text><rect x="200" y="262" width="264" height="30" fill="#0e7490"/><rect x="464" y="262" width="144" height="30" fill="url(#irt-h)" stroke="#c2410c" stroke-width="1.5"/><text x="210" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#ffffff">soft for 3.3 days</text><text x="620" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">35% of cycle</text><text x="30" y="332" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">4 ppm iron</text><text x="30" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">31 gpg compensated</text><rect x="200" y="320" width="200" height="30" fill="#0e7490"/><rect x="400" y="320" width="207.99999999999997" height="30" fill="url(#irt-h)" stroke="#c2410c" stroke-width="1.5"/><text x="210" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#ffffff">soft for 2.5 days</text><text x="620" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">52% of cycle</text><path class="ln" d="M440,108 L440,372" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><text x="440" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3 days: sensible upper limit for iron</text><path class="ln" d="M608,130 L608,372" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="608" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Valve regenerates at 5.1 days</text><path class="ln" d="M200,380 L680,380" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M200,380 L200,387" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><path class="ln" d="M280,380 L280,387" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1</text><path class="ln" d="M360,380 L360,387" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2</text><path class="ln" d="M440,380 L440,387" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="440" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3</text><path class="ln" d="M520,380 L520,387" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4</text><path class="ln" d="M600,380 L600,387" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5</text><path class="ln" d="M680,380 L680,387" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6</text><text x="440" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">Days since last regeneration</text><rect x="30" y="450" width="26" height="12" fill="#0e7490"/><text x="64" y="461" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin working: soft water</text><rect x="270" y="450" width="26" height="12" fill="url(#irt-h)" stroke="#c2410c" stroke-width="1"/><text x="304" y="461" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin exhausted: hard water, iron on a spent bed</text>
</svg>
