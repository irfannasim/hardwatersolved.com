<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 682" width="760" height="682" role="img" aria-labelledby="slw-title slw-desc">
<title id="slw-title">Water softener installation location: basement, garage, crawl space and closet weak points and fixes</title>
<desc id="slw-desc">Four panels comparing water softener installation locations. The basement risks flooding and needs tanks on blocks, the garage risks freezing and sun and needs an insulated heated cabinet, the crawl space fails on salt access, and the closet needs a drain, a pan and noise control.</desc>
<defs></defs>
<rect width="760" height="682" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Four softener locations: the weak point and the fix</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Every room fails one requirement. Each fix targets that one requirement.</text><rect class="box" x="30" y="88" width="340" height="272" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="46" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">BASEMENT</text><rect x="50" y="216" width="300" height="4" fill="#3a5a72"/><rect x="90" y="202" width="84" height="14" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1"/><rect x="102" y="132" width="22" height="70" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="100" y="120" width="26" height="12" rx="2" fill="#0b2f4a"/><rect x="132" y="154" width="30" height="48" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><path d="M50,210 L86,210 M178,210 L350,210" stroke="#52697a" stroke-width="2" stroke-dasharray="6 4" fill="none"/><text x="200" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">flood line</text><text x="200" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">tanks on blocks</text><text x="46" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">Weak point: seepage or a flood reaches</text><text x="46" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">the valve; salt must be carried downstairs</text><text x="46" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">Fix: raise both tanks 4 to 6 in. on blocks,</text><text x="46" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">run a dehumidifier, keep a clear stair path</text><rect class="box" x="390" y="88" width="340" height="272" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="406" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">GARAGE</text><rect x="410" y="216" width="300" height="4" fill="#3a5a72"/><rect x="446" y="124" width="98" height="92" rx="4" fill="none" stroke="#15803d" stroke-width="3"/><rect x="466" y="146" width="22" height="70" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="464" y="134" width="26" height="12" rx="2" fill="#0b2f4a"/><rect x="496" y="168" width="30" height="48" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="566" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">insulated cabinet,</text><text x="566" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">thermostat heat</text><text x="566" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">inside wall, no sun</text><text x="406" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">Weak point: freezing in winter, direct sun</text><text x="406" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">through an open door in summer</text><text x="406" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">Fix: mount on the house wall, enclose and</text><text x="406" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">heat the unit and pipes, shade the valve</text><rect class="box" x="30" y="380" width="340" height="272" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="46" y="406" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">CRAWL SPACE</text><rect x="50" y="508" width="300" height="4" fill="#3a5a72"/><rect x="50" y="416" width="300" height="6" fill="#3a5a72"/><rect x="96" y="438" width="22" height="70" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="94" y="426" width="26" height="12" rx="2" fill="#0b2f4a"/><rect x="126" y="460" width="30" height="48" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="260" y="416" width="60" height="6" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="290" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">access hatch</text><text x="190" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">low headroom</text><text x="46" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">Weak point: nobody crawls in to add salt;</text><text x="46" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">freeze risk if vented; drain often too high</text><text x="46" y="602" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">Fix: put the softener where the main rises</text><text x="46" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">indoors; if it must stay, add a hatch above</text><rect class="box" x="390" y="380" width="340" height="272" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="406" y="406" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">CLOSET</text><rect x="410" y="508" width="300" height="4" fill="#3a5a72"/><rect x="444" y="500" width="100" height="8" fill="#cbd5e1" stroke="#15803d" stroke-width="2"/><rect x="466" y="430" width="22" height="70" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="464" y="418" width="26" height="12" rx="2" fill="#0b2f4a"/><rect x="496" y="452" width="30" height="48" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="652" y="404" width="12" height="104" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><text x="642" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">solid door</text><text x="552" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">drain pan</text><text x="406" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">Weak point: no drain nearby, regeneration</text><text x="406" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">noise and any leak land in living space</text><text x="406" y="602" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">Fix: standpipe with an air gap, a pan</text><text x="406" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">piped to drain, leak alarm, solid door</text>
</svg>
