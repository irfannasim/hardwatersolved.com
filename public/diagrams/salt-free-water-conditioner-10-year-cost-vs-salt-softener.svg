<rect class="box" x="322.0" y="410" width="272.0" height="38" fill="#7c3aed"/>
<text x="330.0" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">$2,380</text>
<text x="602.0" y="434" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">$3,010</text>
<text x="30" y="496" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52697a">Illustrative. Softener upkeep is $113 a year at 10 gpg and $238 at 25 gpg (salt, water, power, resin and service).</text>
<text x="30" y="514" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52697a">SpringWell media change shown at an assumed $450. A softener also needs a drain and outlet the conditioners do not.</text>
