<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="sfc-title sfc-desc">
<title id="sfc-title">Salt-free water conditioner cost over 10 years vs a salt softener, family of four</title>
<desc id="sfc-desc">Illustrative stacked bar chart of 10-year cost before installation for a family of four using about 102,000 gallons a year: Watts OneFlow Plus about $2,950, SpringWell FutureSoft FS1 about $2,835, NuvoH2O Manor about $3,430, and a salt softener about $1,760 at 10 gpg or $3,010 at 25 gpg.</desc>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">10-year cost: salt-free conditioner vs salt softener</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Family of four, about 102,000 gallons a year. Equipment plus upkeep, before installation.</text>
<rect x="30" y="84" width="16" height="16" fill="#3a5a72"/><text x="54" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Purchase</text>
