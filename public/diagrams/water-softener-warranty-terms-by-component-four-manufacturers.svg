<text x="46" y="606" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Freeze damage is excluded by A. O. Smith and Water-Right. A. O. Smith and Morton exclude labour.</text>
