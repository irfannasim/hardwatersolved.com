<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 676" width="760" height="676" role="img" aria-labelledby="g18wt-title g18wt-desc">
<title id="g18wt-title">Water softener warranty terms by component for four manufacturers</title>
<desc id="g18wt-desc">Comparison of water softener warranty terms from four published owner manuals: valves and controllers are covered for 1 to 5 years, mineral tanks for 10 years, brine cabinets for 5 to 10 years, with the longest terms on the tanks.</desc>
<defs></defs>
<rect width="760" height="676" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Four published softener warranties, part by part</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Years of parts coverage from each owner’s manual. The longest terms are on the tanks.</text>
