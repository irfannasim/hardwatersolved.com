<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 626" width="760" height="626" role="img" aria-labelledby="mbd-title mbd-desc">
<title id="mbd-title">Morton water softener no brine draw check order</title>
<desc id="mbd-desc">Flow chart of the Morton water softener manual check order when the softener does not draw brine: salt bridge, then nozzle and venturi, its seating and gasket, valve seals, drain hose restriction, and finally the brine valve and tubing.</desc>
<defs><marker id="mbd-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="mbd-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="mbd-hard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="mbd-fault" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="mbd-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="mbd-steel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="mbd-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="mbd-brine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="mbd-drain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="mbd-iron" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect width="760" height="626" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Morton softener not drawing brine: the manual's check order</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Most likely cause first. Stop at the first check that finds the fault.</text>
<rect class="box" x="30" y="88" width="400" height="58" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">1. Salt bridge</text>
<text x="48" y="133" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Check: crust separating salt from water</text>
<path class="ln" d="M436,117 L498,117" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-ok)"/>
<text x="467" y="109" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#15803d">found</text>
<rect class="box" x="504" y="94" width="226" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="617" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Break it up from above</text>
<path class="ln" d="M230,148 L230,164" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-steel)"/>
<text x="240" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">not it</text>
<rect class="box" x="30" y="168" width="400" height="58" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="193" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">2. Nozzle and venturi</text>
<text x="48" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Check: dirty or plugged</text>
<path class="ln" d="M436,197 L498,197" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-ok)"/>
<text x="467" y="189" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#15803d">found</text>
<rect class="box" x="504" y="174" width="226" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="617" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Remove and clean the disc</text>
<path class="ln" d="M230,228 L230,244" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-steel)"/>
<text x="240" y="242" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">not it</text>
<rect class="box" x="30" y="248" width="400" height="58" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="273" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">3. Nozzle and venturi seating</text>
<text x="48" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Check: not seated, or gasket deformed</text>
<path class="ln" d="M436,277 L498,277" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-ok)"/>
<text x="467" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#15803d">found</text>
<rect class="box" x="504" y="254" width="226" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="617" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Reseat; replace the gasket</text>
<path class="ln" d="M230,308 L230,324" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-steel)"/>
<text x="240" y="322" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">not it</text>
<rect class="box" x="30" y="328" width="400" height="58" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="353" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">4. Valve seals</text>
<text x="48" y="373" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Check: leaking</text>
<path class="ln" d="M436,357 L498,357" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-ok)"/>
<text x="467" y="349" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#15803d">found</text>
<rect class="box" x="504" y="334" width="226" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="617" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Replace the seal kit</text>
<path class="ln" d="M230,388 L230,404" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-steel)"/>
<text x="240" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">not it</text>
<rect class="box" x="30" y="408" width="400" height="58" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="433" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">5. Valve drain hose</text>
<text x="48" y="453" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Check: kinked, bent or raised too high</text>
<path class="ln" d="M436,437 L498,437" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-ok)"/>
<text x="467" y="429" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#15803d">found</text>
<rect class="box" x="504" y="414" width="226" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="617" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Re-route the hose</text>
<path class="ln" d="M230,468 L230,484" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-steel)"/>
<text x="240" y="482" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">not it</text>
<rect class="box" x="30" y="488" width="400" height="58" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="48" y="513" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">6. Brine valve and tubing</text>
<text x="48" y="533" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Check: obstructed</text>
<path class="ln" d="M436,517 L498,517" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mbd-ok)"/>
<text x="467" y="509" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#15803d">found</text>
<rect class="box" x="504" y="494" width="226" height="46" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="617" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Clear or replace them</text>
<text x="30" y="576" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Still no draw after all six? Run the Manual Advance diagnostics, or call support.</text>
<text x="30" y="596" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Non-tank parts carry a one-year warranty on the standard models.</text>
</svg>
