<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="pb-title pb-desc">
<title id="pb-title">Water softener payback chart: break-even at 8.7 years (illustrative)</title>
<desc id="pb-desc">Illustrative water softener payback chart for Household B: a $2,000 installed price recovered at a net $230 a year, breaking even at 8.7 years, with a marker showing a move after five years.</desc>
<defs></defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softener payback: Household B (illustrative)</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">$2,000 installed, then a net benefit of $230 a year. Break-even at 8.7 years.</text><rect x="110" y="213.33333333333334" width="590" height="186.66666666666666" fill="#fef2f2"/><rect x="110" y="120" width="590" height="93.33333333333334" fill="#f0fdf4"/><path d="M110,120.0 L700,120.0" stroke="#e2e8f0" stroke-width="1"/><text x="100" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">+$1,000</text><path d="M110,213.3 L700,213.3" stroke="#0b2f4a" stroke-width="1.5"/><text x="100" y="218.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$0</text><path d="M110,306.7 L700,306.7" stroke="#e2e8f0" stroke-width="1"/><text x="100" y="311.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">−$1,000</text><path d="M110,400.0 L700,400.0" stroke="#e2e8f0" stroke-width="1"/><text x="100" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">−$2,000</text><text x="110" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><text x="208.33333333333331" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2</text><text x="306.66666666666663" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4</text><text x="405" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6</text><text x="503.3333333333333" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">8</text><text x="601.6666666666666" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10</text><text x="700" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">12</text><text x="405" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">years in the home</text><text x="110" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">cumulative net savings</text><path class="ln" d="M355.8,120 L355.8,400" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="365.8333333333333" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Move after 5 years and the</text><text x="365.8333333333333" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">savings still to come go</text><text x="365.8333333333333" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">to the next owner</text><path class="ln" d="M110,400 L700.0,142.4" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="537.75" cy="213.33333333333334" r="7" fill="#15803d" stroke="#ffffff" stroke-width="2"/><text x="549.75" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">break-even at 8.7 years</text><text x="114" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">day one: −$2,000 installed</text><text x="628" y="164" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0e7490">Household B</text><text x="30" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative worksheet figures. Use your own bills, prices and a written quote.</text><text x="30" y="517" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">If payback is more than half the time you expect to stay, one bad year wipes out the margin.</text>
</svg>
