<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="tfi-title tfi-desc">
<title id="tfi-title">Softened water tankless water heater flush interval compared with untreated hard water</title>
<desc id="tfi-desc">Four-year timeline of descaling flushes for a tankless water heater: every 3 to 4 months on untreated water above 20 gpg, every 6 months at 12 to 20 gpg, and every 24 months on a softened feed, with an annual inspection in every case.</desc>
<defs></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softened water and a tankless water heater: flush visits</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Four years of service. Intervals follow the hardness bands in this article; check your own manual.</text><path d="M210,96 L210,350" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="210" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Install</text><path d="M337.5,96 L337.5,350" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="337.5" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Year 1</text><path d="M465,96 L465,350" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="465" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Year 2</text><path d="M592.5,96 L592.5,350" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="592.5" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Year 3</text><path d="M720,96 L720,350" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="720" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Year 4</text><text x="30" y="151" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">Untreated, 20+ gpg</text><text x="30" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">every 3 to 4 months</text><path d="M210,150 L720,150" fill="none" stroke="#cbd5e1" stroke-width="5"/><path d="M252.5,139 L261.5,150 L252.5,161 L243.5,150 z" fill="#c2410c"/><path d="M295,139 L304,150 L295,161 L286,150 z" fill="#c2410c"/><path d="M337.5,139 L346.5,150 L337.5,161 L328.5,150 z" fill="#c2410c"/><path d="M380,139 L389,150 L380,161 L371,150 z" fill="#c2410c"/><path d="M422.5,139 L431.5,150 L422.5,161 L413.5,150 z" fill="#c2410c"/><path d="M465,139 L474,150 L465,161 L456,150 z" fill="#c2410c"/><path d="M507.5,139 L516.5,150 L507.5,161 L498.5,150 z" fill="#c2410c"/><path d="M550,139 L559,150 L550,161 L541,150 z" fill="#c2410c"/><path d="M592.5,139 L601.5,150 L592.5,161 L583.5,150 z" fill="#c2410c"/><path d="M635,139 L644,150 L635,161 L626,150 z" fill="#c2410c"/><path d="M677.5,139 L686.5,150 L677.5,161 L668.5,150 z" fill="#c2410c"/><path d="M720,139 L729,150 L720,161 L711,150 z" fill="#c2410c"/><text x="30" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">Untreated, 12 to 20 gpg</text><text x="30" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">every 6 months</text><path d="M210,215 L720,215" fill="none" stroke="#cbd5e1" stroke-width="5"/><path d="M273.75,204 L282.75,215 L273.75,226 L264.75,215 z" fill="#c2410c"/><path d="M337.5,204 L346.5,215 L337.5,226 L328.5,215 z" fill="#c2410c"/><path d="M401.25,204 L410.25,215 L401.25,226 L392.25,215 z" fill="#c2410c"/><path d="M465,204 L474,215 L465,226 L456,215 z" fill="#c2410c"/><path d="M528.75,204 L537.75,215 L528.75,226 L519.75,215 z" fill="#c2410c"/><path d="M592.5,204 L601.5,215 L592.5,226 L583.5,215 z" fill="#c2410c"/><path d="M656.25,204 L665.25,215 L656.25,226 L647.25,215 z" fill="#c2410c"/><path d="M720,204 L729,215 L720,226 L711,215 z" fill="#c2410c"/><text x="30" y="281" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Softened feed</text><text x="30" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">every 24 months</text><path d="M210,280 L720,280" fill="none" stroke="#cbd5e1" stroke-width="5"/><path d="M465,269 L474,280 L465,291 L456,280 z" fill="#0e7490"/><path d="M720,269 L729,280 L720,291 L711,280 z" fill="#0e7490"/><text x="30" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Every feed</text><text x="30" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">annual inspection</text><path d="M210,330 L720,330" fill="none" stroke="#cbd5e1" stroke-width="5"/><circle cx="337.5" cy="330" r="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="3"/><circle cx="465" cy="330" r="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="3"/><circle cx="592.5" cy="330" r="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="3"/><circle cx="720" cy="330" r="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="3"/><rect class="box" x="30" y="380" width="700" height="70" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.2"/><path d="M54,396 L63,405 L54,414 L45,405 z" fill="#c2410c"/><text x="72" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">= descaling flush</text><circle cx="252" cy="405" r="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="3"/><text x="270" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">= annual inspection (Rinnai: by a licensed professional)</text><text x="46" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Softening removes most flushes. It does not remove the yearly inspection.</text>
</svg>
