<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" role="img" aria-labelledby="sc-title sc-desc">
<title id="sc-title">Hard water soap curd on skin vs soft water</title>
<desc id="sc-desc">Diagram of hard water and dry skin: calcium and magnesium bind soap into an insoluble curd that stays on the skin after rinsing, while in soft water the soap stays dissolved and rinses away.</desc>
<defs><marker id="sc-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="sc-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="sc-tink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="sc-tsoft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="484" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hard water, soap and skin</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Calcium turns soap into a curd that rinsing leaves behind. Soft water rinses clean.</text><path d="M380,96 L380,396" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#c2410c">Hard water</text><text x="30" y="146" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">soap  +  Ca²⁺ / Mg²⁺</text><path class="ln" d="M110,158 L110,206" fill="none" stroke="#0b2f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sc-ink)"/><text x="124" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">insoluble calcium-soap curd</text><rect x="30" y="250" width="330" height="24" fill="#f1bfa9"/><rect x="30" y="274" width="330" height="50" fill="#fbe4dc"/><path d="M49,250 q2.2,-16 11,-14 q8.8,-4 11,14 z" fill="#e5e7eb" stroke="#3a5a72" stroke-width="1.5"/><path d="M105,250 q3,-16 15,-14 q12,-4 15,14 z" fill="#e5e7eb" stroke="#3a5a72" stroke-width="1.5"/><path d="M183,250 q2.6,-16 13,-14 q10.4,-4 13,14 z" fill="#e5e7eb" stroke="#3a5a72" stroke-width="1.5"/><path d="M245,250 q3.4000000000000004,-16 17,-14 q13.600000000000001,-4 17,14 z" fill="#e5e7eb" stroke="#3a5a72" stroke-width="1.5"/><path d="M313,250 q1.8,-16 9,-14 q7.2,-4 9,14 z" fill="#e5e7eb" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M40,222 L300,222" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#sc-soft)"/><text x="306" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0e7490">rinse</text><text x="30" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Curd stays on the skin after rinsing:</text><text x="30" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">mildly irritating, and the familiar</text><text x="30" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">squeaky drag.</text><text x="410" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Soft water</text><text x="410" y="146" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">soap stays dissolved</text><rect x="410" y="250" width="330" height="24" fill="#f1bfa9"/><rect x="410" y="274" width="330" height="50" fill="#fbe4dc"/><circle cx="440" cy="196" r="4" fill="#0e7490"/><circle cx="480" cy="206" r="4" fill="#0e7490"/><circle cx="530" cy="192" r="4" fill="#0e7490"/><circle cx="590" cy="204" r="4" fill="#0e7490"/><circle cx="650" cy="196" r="4" fill="#0e7490"/><circle cx="700" cy="208" r="4" fill="#0e7490"/><path class="ln" d="M420,222 L710,222" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sc-soft)"/><text x="716" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0e7490">rinses away</text><text x="410" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Soap rinses off completely. The</text><text x="410" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">slippery feel is the absence of curd,</text><text x="410" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">not soap left behind.</text><text x="195" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">skin (outer layer)</text><text x="575" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">skin (outer layer)</text><rect class="box" x="30" y="420" width="700" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Hard water also suppresses lather, so people use more product and strip more skin lipid.</text>
</svg>
