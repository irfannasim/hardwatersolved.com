<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" width="760" height="576" role="img" aria-labelledby="lsp-title lsp-desc">
<title id="lsp-title">Where particles from lead service line work go in a softened house</title>
<desc id="lsp-desc">Diagram of the water path from the main through the new service line, meter and house shutoff to a sediment prefilter, bypass valve, water softener and taps. During lead service line replacement the softener is in bypass so loosened scale and lead particles skip the resin and control valve.</desc>
<defs><marker id="lsp-mc2410c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="lsp-mcbd5e1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect width="760" height="576" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where loosened particles go after service line work</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">During the work and the first flush, the softener sits in bypass.</text><rect class="box" x="30" y="96" width="150" height="60" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="105" y="121" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water main</text><text x="105" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">in the street</text><rect class="box" x="215" y="96" width="165" height="60" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="297.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Service line</text><text x="297.5" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">new copper</text><rect class="box" x="415" y="96" width="140" height="60" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="485" y="121" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Meter</text><text x="485" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">and curb stop</text><rect class="box" x="590" y="96" width="140" height="60" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="660" y="121" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House shutoff</text><text x="660" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">main valve</text><path class="ln" d="M180,126 L210,126" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsp-mc2410c)"/><path class="ln" d="M380,126 L410,126" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsp-mc2410c)"/><path class="ln" d="M555,126 L585,126" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsp-mc2410c)"/><path class="ln" d="M660,156 L660,196 L105,196 L105,258" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsp-mc2410c)"/><circle cx="600" cy="186" r="4" fill="#b45309"/><circle cx="614" cy="206" r="3" fill="#b45309"/><circle cx="520" cy="186" r="4" fill="#b45309"/><circle cx="534" cy="206" r="3" fill="#b45309"/><circle cx="440" cy="186" r="4" fill="#b45309"/><circle cx="454" cy="206" r="3" fill="#b45309"/><circle cx="360" cy="186" r="4" fill="#b45309"/><circle cx="374" cy="206" r="3" fill="#b45309"/><circle cx="280" cy="186" r="4" fill="#b45309"/><circle cx="294" cy="206" r="3" fill="#b45309"/><circle cx="200" cy="186" r="4" fill="#b45309"/><circle cx="214" cy="206" r="3" fill="#b45309"/><rect class="box" x="30" y="266" width="150" height="60" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="105" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text><text x="105" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">prefilter (if fitted)</text><rect class="box" x="225" y="266" width="130" height="60" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="290" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Bypass valve</text><text x="290" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">set to bypass</text><rect class="box" x="400" y="266" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="475" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#52697a">Water softener</text><text x="475" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">no flow in bypass</text><rect class="box" x="595" y="266" width="135" height="60" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="662.5" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Taps</text><text x="662.5" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">aerators removed</text><path class="ln" d="M180,296 L220,296" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsp-mc2410c)"/><path class="ln" d="M355,312 L398,312" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M550,312 L593,312" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M330,266 L330,240 L662,240 L662,260" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsp-mc2410c)"/><rect class="box" x="30" y="360" width="340" height="196" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#b45309">Where particles come from</text><text x="46" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Cutting and reconnecting the line</text><text x="46" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">breaks up old scale and lead-bearing</text><text x="46" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">particles.</text><text x="46" y="469" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Galvanized pipe that sat downstream</text><text x="46" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">of lead can shed lead in its scale.</text><text x="46" y="507" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Main, meter and connector work</text><text x="46" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">stirs up sediment too.</text><rect class="box" x="390" y="360" width="340" height="196" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="406" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where they land</text><text x="406" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Prefilter: takes the coarse debris.</text><text x="406" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fit a new cartridge afterwards.</text><text x="406" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softener valve and resin: seals,</text><text x="406" y="469" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">injector and the top of the bed.</text><text x="406" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Keep it in bypass.</text><text x="406" y="507" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Aerators: screens trap particles.</text><text x="406" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Clean them after each flush.</text>
</svg>
