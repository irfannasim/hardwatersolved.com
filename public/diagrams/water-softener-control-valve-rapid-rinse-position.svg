<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" width="760" height="544" role="img" aria-labelledby="cv4-title cv4-desc">
<title id="cv4-title">Water softener control valve, position 4: Rapid rinse</title>
<desc id="cv4-desc">Rapid rinse position of a water softener control valve: water runs fast down through the resin bed and up the distributor tube to the drain, flushing out remaining brine and repacking the bed. The brine line is closed and the house receives hard bypass water.</desc>
<defs><marker id="a-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="a-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="a-brine" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a-drain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
<pattern id="beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern>
<pattern id="salt" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern>
</defs>
<rect width="760" height="544" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Position 4 · Rapid rinse</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Fast flow down through the resin, in the service direction, flushes the last brine to the drain.</text>
<rect x="362" y="170" width="36" height="14" fill="#3a5a72"/>
<rect x="300" y="184" width="160" height="250" rx="28" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/>
<rect x="306" y="226" width="148" height="200" rx="22" fill="url(#beads)"/>
<rect x="375" y="170" width="10" height="240" fill="#94a3b8"/>
<rect x="366" y="404" width="28" height="14" rx="3" fill="#64748b"/>
<path class="ln" d="M478,411 L398,411" stroke="#52697a" stroke-width="1.2"/>
<text x="484" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">distributor tube</text>
<text x="290" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">resin bed</text>
<path class="ln" d="M294,258 L318,258" stroke="#52697a" stroke-width="1.2"/>
<text x="380" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"></text>
<path class="ln" d="M334,196 L334,392" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-hard)"/>
<path class="ln" d="M334,196 L334,300" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-hard)"/>
<path class="ln" d="M426,196 L426,392" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-hard)"/>
<path class="ln" d="M426,196 L426,300" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-hard)"/>
<path class="ln" d="M380,398 L380,182" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-drain)"/>
<rect x="40" y="300" width="160" height="134" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<rect x="42" y="392" width="156" height="40" rx="8" fill="#dbeafe"/>
<rect x="42" y="352" width="100" height="40" fill="url(#salt)"/>
<rect x="144" y="300" width="12" height="126" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="90" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">BRINE TANK</text>
<path class="ln" d="M150,300 L150,156 L286,156" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="140" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">brine line</text>
<path class="ln" d="M30,128 L286,128" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-hard)"/>
<text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">INLET</tspan> · hard water</text>
<path class="ln" d="M470,128 L726,128" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-hard)"/>
<text x="730" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#0b2f4a"><tspan font-weight="bold">TO HOUSE</tspan> · hard water (bypass)</text>
<path class="ln" d="M470,156 L600,156 L600,300" fill="none" stroke="#78716c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-drain)"/>
<rect x="590" y="206" width="20" height="10" rx="2" fill="#0b2f4a"/>
<text x="618" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#78716c">drain flow control</text>
<path d="M584,312 L616,312 L608,324 L592,324 z" fill="#78716c"/>
<text x="600" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">DRAIN</text>
<rect x="290" y="110" width="180" height="60" rx="8" fill="#0b2f4a"/>
<text x="380" y="145" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text>
<rect x="30" y="452" width="226" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1"/><text x="143" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Brine line: <tspan font-weight="bold">closed</tspan></text>
<rect x="268" y="452" width="226" height="34" rx="17" fill="#e0f2f1" stroke="#0e7490"/><text x="381" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Drain: <tspan font-weight="bold">OPEN</tspan></text>
<rect x="506" y="452" width="226" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1"/><text x="619" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">House gets: <tspan font-weight="bold">HARD (bypass)</tspan></text>
<rect x="30" y="514" width="26" height="6" rx="3" fill="#c2410c"/>
<text x="64" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water</text>
<rect x="176" y="514" width="26" height="6" rx="3" fill="#0e7490"/>
<text x="210" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">soft water</text>
<rect x="322" y="514" width="26" height="6" rx="3" fill="#7c3aed"/>
<text x="356" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine</text>
<rect x="468" y="514" width="26" height="6" rx="3" fill="#78716c"/>
<text x="502" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text>
<rect x="614" y="514" width="26" height="6" rx="3" fill="#cbd5e1"/>
<text x="648" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">not flowing</text>
</svg>
