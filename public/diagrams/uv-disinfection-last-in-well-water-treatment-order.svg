<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="uvl-title uvl-desc">
<title id="uvl-title">UV disinfection placement in the well water treatment order: early versus last</title>
<desc id="uvl-desc">Comparison of UV installed early in a well water treatment order, where iron, scale and turbidity shield microbes and media beds downstream can regrow bacteria, against UV installed last after the softener, with the manufacturer water quality limits for iron, hardness, manganese, turbidity, tannins and UV transmittance.</desc>
<defs><marker id="uvl-mc2410c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="uvl-m0e7490" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="uvl-m0b2f4a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="uvl-mdc2626" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="uvl-m15803d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="uvl-m52697a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="uvl-m78716c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="uvl-mb45309" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="uvl-m3a5a72" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why UV disinfection goes last in the well water treatment order</text>
<text x="30" y="58" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The lamp only works on clear water, and it leaves no disinfectant behind</text>
<text x="30" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Wrong: UV early</text>
<rect class="box" x="30" y="104" width="92" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="76" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Well</text>
<rect class="box" x="152" y="104" width="92" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="198" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">UV</text>
<rect class="box" x="274" y="104" width="92" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="320" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron</text>
<text x="320" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">filter</text>
<rect class="box" x="396" y="104" width="92" height="50" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="442" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text>
<rect class="box" x="640" y="104" width="92" height="50" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="686" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House</text>
<path class="ln" d="M125,129 L143,129" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-mc2410c)"/>
<path class="ln" d="M247,129 L265,129" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-mc2410c)"/>
<path class="ln" d="M369,129 L387,129" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-mc2410c)"/>
<path class="ln" d="M491,129 L631,129" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-m0e7490)"/>
<text x="198" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">Iron, scale, cloud</text>
<text x="198" y="195" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">coat the sleeve and</text>
<text x="198" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">shade microbes</text>
<path d="M274,162 L274,168 L488,168 L488,162" fill="none" stroke="#dc2626" stroke-width="1.5"/>
<text x="381" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">Bacteria can regrow in these</text>
<text x="381" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">media beds after the lamp</text>
<text x="30" y="268" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">Right: UV last</text>
<rect class="box" x="30" y="280" width="92" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="76" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Well</text>
<rect class="box" x="152" y="280" width="92" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="198" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text>
<rect class="box" x="274" y="280" width="92" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="320" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron</text>
<text x="320" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">filter</text>
<rect class="box" x="396" y="280" width="92" height="50" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="442" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text>
<rect class="box" x="518" y="280" width="92" height="50" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
<text x="564" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">UV</text>
<rect class="box" x="640" y="280" width="92" height="50" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="686" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House</text>
<path class="ln" d="M125,305 L143,305" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-mc2410c)"/>
<path class="ln" d="M247,305 L265,305" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-mc2410c)"/>
<path class="ln" d="M369,305 L387,305" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-mc2410c)"/>
<path class="ln" d="M491,305 L509,305" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-m0e7490)"/>
<path class="ln" d="M613,305 L631,305" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#uvl-m0e7490)"/>
<text x="564" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">Clear, soft,</text>
<text x="564" y="371" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">iron-free water</text>
<text x="564" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">reaches the lamp</text>
<text x="294" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Every stage ahead of UV</text>
<text x="294" y="371" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">removes something that</text>
<text x="294" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">would block the light</text>
<rect class="box" x="30" y="428" width="700" height="88" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="46" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water quality one UV manual asks for at the lamp (VIQUA VT1/VT4)</text>
<text x="46" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Iron &lt; 0.3 ppm</text>
<text x="274" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hardness &lt; 7 gpg</text>
<text x="502" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Manganese &lt; 0.05 ppm</text>
<text x="46" y="502" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Turbidity &lt; 1 NTU</text>
<text x="274" y="502" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Tannins &lt; 0.1 ppm</text>
<text x="502" y="502" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">UVT &gt; 75%</text>
</svg>
