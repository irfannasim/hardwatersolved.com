<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="wg-title wg-desc">
<title id="wg-title">Whirlpool vs GE water softener: which one to buy, decision chart</title>
<desc id="wg-desc">Decision chart for choosing between a Whirlpool and a GE water softener. Peak flow above 8 gpm points to the Whirlpool WHES48 or GE GXSH45W, clear-water iron above 5 ppm points to the Whirlpool WHES44 or WHES48, wanting Wi-Fi alerts or Amazon delivery points to the current GE range, and otherwise the cheaper unit at the same capacity tier wins.</desc>
<defs><marker id="wg-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Whirlpool vs GE: which cabinet softener to buy</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Work down the checks in order. Ratings from each maker’s manual and NSF or IAPMO listing.</text><rect class="box" x="60" y="86" width="280" height="52" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="200" y="107.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Start with a water test</text><text x="200" y="126.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">hardness, iron and your busiest moment</text><rect class="box" x="60" y="170" width="280" height="62" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="200" y="196.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Busiest moment above 8 gpm?</text><text x="200" y="215.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">two showers plus laundry or more</text><rect class="box" x="60" y="270" width="280" height="62" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="200" y="296.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Clear-water iron above 5 ppm?</text><text x="200" y="315.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">ferrous iron, from a lab test</text><rect class="box" x="60" y="370" width="280" height="62" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="200" y="396.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Want alerts, or Amazon delivery?</text><text x="200" y="415.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">leak, flow and low-salt alerts</text><rect class="box" x="420" y="164" width="310" height="74" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="575" y="187" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Whirlpool WHES48 or GE GXSH45W</text><text x="575" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">12 gpm and 9.6 gpm rated flow</text><text x="575" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">above about 10 gpm, go two-tank</text><rect class="box" x="420" y="264" width="310" height="74" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="575" y="287" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Whirlpool WHES44 or WHES48</text><text x="575" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">both rated to 12 ppm clear-water iron</text><text x="575" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2025 GE units are rated to 5 ppm</text><rect class="box" x="420" y="364" width="310" height="74" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="575" y="387" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">GE GXSH35W, or GXSH45W from GE</text><text x="575" y="406" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">built-in Wi-Fi; the 35W is on Amazon</text><text x="575" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">shut-off needs GE’s separate valve</text><rect class="box" x="60" y="474" width="670" height="74" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="395" y="497" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Either brand: buy the cheaper one at the same tier</text><text x="395" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">compare grains at about 10 lb of salt, not the number on the box</text><text x="395" y="535" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">then check who honours the warranty and where parts come from</text><path class="ln" d="M200,138 L200,164" fill="none" stroke="#0b2f4a" stroke-width="5" marker-end="url(#wg-arr)"/><path class="ln" d="M340,201 L412,201" fill="none" stroke="#0b2f4a" stroke-width="5" marker-end="url(#wg-arr)"/><text x="376" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Yes</text><path class="ln" d="M200,232 L200,264" fill="none" stroke="#0b2f4a" stroke-width="5" marker-end="url(#wg-arr)"/><text x="212" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">No</text><path class="ln" d="M340,301 L412,301" fill="none" stroke="#0b2f4a" stroke-width="5" marker-end="url(#wg-arr)"/><text x="376" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Yes</text><path class="ln" d="M200,332 L200,364" fill="none" stroke="#0b2f4a" stroke-width="5" marker-end="url(#wg-arr)"/><text x="212" y="353" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">No</text><path class="ln" d="M340,401 L412,401" fill="none" stroke="#0b2f4a" stroke-width="5" marker-end="url(#wg-arr)"/><text x="376" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Yes</text><path class="ln" d="M200,432 L200,466" fill="none" stroke="#0b2f4a" stroke-width="5" marker-end="url(#wg-arr)"/><text x="212" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">No</text><text x="30" y="580" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Iron above a model’s rating, or any iron with sulfur smell: filter first, then soften.</text></svg>
