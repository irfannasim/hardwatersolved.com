<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="cfm-title cfm-desc">
<title id="cfm-title">Culligan water softener franchise model: what Culligan sets and what the dealer sets</title>
<desc id="cfm-desc">Culligan International builds the softener, writes the warranty and holds the NSF/ANSI 44 certification; the independently operated Culligan dealer sets the price, rental and service terms, installation and labor charges, so those costs vary by region.</desc>
<defs><marker id="cfm-m3a5a72" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Who sets what in a Culligan purchase</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The hardware and warranty are national. The price and service are local.</text>
<rect class="box" x="30" y="92" width="200" height="50" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="130" y="123" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Culligan International</text>
<rect class="box" x="30" y="154" width="200" height="220" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="46" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Designs and builds</text>
<text x="46" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">the softener</text>
<text x="46" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Writes the warranty</text>
<text x="46" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Holds NSF/ANSI 44</text>
<text x="46" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">certification</text>
<text x="46" y="319" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Supplies parts</text>
<text x="46" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">to dealers</text>
<rect class="box" x="280" y="92" width="200" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="380" y="123" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Your local dealer</text>
<rect class="box" x="280" y="154" width="200" height="220" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
<text x="296" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Purchase price</text>
<text x="296" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Rental and service-</text>
<text x="296" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">plan terms</text>
<text x="296" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Installation scope</text>
<text x="296" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Labor and trip charges</text>
<text x="296" y="319" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Salt delivery</text>
<rect class="box" x="530" y="92" width="200" height="50" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="630" y="123" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">You</text>
<rect class="box" x="530" y="154" width="200" height="220" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="546" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pay the quoted price</text>
<text x="546" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pay freight on</text>
<text x="546" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">warranty parts</text>
<text x="546" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pay dealer charges</text>
<text x="546" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">on every visit</text>
<text x="546" y="319" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">after year one</text>
<path class="ln" d="M232,250 L272,250" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfm-m3a5a72)"/>
<path class="ln" d="M482,250 L522,250" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cfm-m3a5a72)"/>
<rect class="box" x="280" y="388" width="200" height="40" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="380" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">Varies by region</text>
<path class="ln" d="M380,374 L380,388" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="456" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">Source: Culligan HE owner's guide warranty: you pay freight and local dealer charges.</text>
</svg>
