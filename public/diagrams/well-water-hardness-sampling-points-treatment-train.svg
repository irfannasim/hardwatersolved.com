<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-labelledby="g4wt-title g4wt-desc">
<title id="g4wt-title">Well water hardness sampling points on a treatment train</title>
<desc id="g4wt-desc">Well water treatment train with three hardness sampling points: A, raw water after the pressure tank to diagnose the well; B, the softener inlet after the sediment filter, iron filter and neutralizer, used to size the softener; C, softened water to check it works.</desc>
<defs><marker id="g4wt-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4wt-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="356" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Well water: where to draw each hardness sample</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Sample B, at the softener inlet after every other stage, is the one that sizes the softener.</text><rect class="box" x="30" y="130" width="58" height="60" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="59" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">WELL</text><rect class="box" x="104" y="130" width="84" height="60" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="146" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">PRESSURE</text><text x="146" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">TANK</text><rect class="box" x="226" y="130" width="80" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="266" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">SEDIMENT</text><text x="266" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">FILTER</text><rect class="box" x="322" y="130" width="62" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="353" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">IRON</text><text x="353" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">FILTER</text><rect class="box" x="400" y="130" width="104" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="452" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">NEUTRALIZER</text><rect class="box" x="542" y="130" width="82" height="60" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="583" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><rect class="box" x="662" y="130" width="68" height="60" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="696" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">HOUSE</text><path class="ln" d="M88,160 L104,160" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M188,160 L226,160" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M306,160 L322,160" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M384,160 L400,160" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M504,160 L538,160" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4wt-ah)"/><path class="ln" d="M624,160 L658,160" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4wt-as)"/><path class="ln" d="M207,163 L207,200" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="207" cy="216" r="15" fill="#c2410c"/><text x="207" y="221.4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">A</text><path class="ln" d="M522,163 L522,200" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="522" cy="216" r="15" fill="#0e7490"/><text x="522" y="221.4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">B</text><path class="ln" d="M643,163 L643,200" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="643" cy="216" r="15" fill="#0e7490"/><text x="643" y="221.4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">C</text><text x="207" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">raw well water:</text><text x="207" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">diagnose the well</text><text x="207" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">run until the pump starts</text><text x="505" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">softener inlet:</text><text x="505" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">size the softener</text><text x="660" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">softened water:</text><text x="660" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">check it works</text><rect x="30" y="329" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated (hard) water</text><rect x="250" y="329" width="26" height="6" rx="3" fill="#0e7490"/><text x="284" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">after the softener</text>
</svg>
