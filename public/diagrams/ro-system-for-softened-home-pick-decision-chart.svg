<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="rsd-title rsd-desc">
<title id="rsd-title">Decision chart: which RO system to pair with a water softener</title>
<desc id="rsd-desc">Decision chart for the best RO systems to pair with a water softener: well water points to a tank system, a wish for minerals back to the iSpring RCC7AK, limited cabinet space or no patience for tank refills to the Waterdrop G3P600, and everyone else to the plain APEC ROES-50.</desc>
<defs><marker id="rsd-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="rsd-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Which RO to put after your softener</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">All three picks are certified to NSF/ANSI 58. Feed each one from a softened cold line.</text>

<rect class="box" x="30" y="95" width="330" height="70" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="195" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Is the house on a private well,</text>
<text x="195" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">even with the softener?</text>
<rect class="box" x="440" y="89" width="290" height="82" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="585" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">A tank system</text>
<text x="585" y="135" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">APEC ROES-50 or iSpring RCC7AK;</text>
<text x="585" y="153" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">G3P600 cover needs city water</text>
<path class="ln" d="M360,130 L436,130" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#rsd-ag)"/>
<text x="400" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text>
<path class="ln" d="M195,165 L195,201" stroke="#52697a" stroke-width="4" fill="none" marker-end="url(#rsd-an)"/>
<text x="207" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#52697a">No</text>

<rect class="box" x="30" y="205" width="330" height="70" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="195" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Do you want some calcium and</text>
<text x="195" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">magnesium back in the glass?</text>
<rect class="box" x="440" y="199" width="290" height="82" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="585" y="227" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">iSpring RCC7AK</text>
<text x="585" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Alkaline stage adds about 30</text>
<text x="585" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">to 60 mg/L and lifts pH</text>
<path class="ln" d="M360,240 L436,240" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#rsd-ag)"/>
<text x="400" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text>
<path class="ln" d="M195,275 L195,311" stroke="#52697a" stroke-width="4" fill="none" marker-end="url(#rsd-an)"/>
<text x="207" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#52697a">No</text>

<rect class="box" x="30" y="315" width="330" height="70" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="195" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Short on cabinet space, or tired</text>
<text x="195" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">of waiting for a tank to refill?</text>
<rect class="box" x="440" y="309" width="290" height="82" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="585" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Waterdrop G3P600</text>
<text x="585" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Tankless, 2:1 drain ratio;</text>
<text x="585" y="373" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">needs an outlet under the sink</text>
<path class="ln" d="M360,350 L436,350" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#rsd-ag)"/>
<text x="400" y="338" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text>
<path class="ln" d="M195,385 L195,421" stroke="#0e7490" stroke-width="4" fill="none" marker-end="url(#rsd-ag)"/>
<text x="207" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">No</text>

<rect class="box" x="30" y="425" width="700" height="82" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="380" y="455" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">APEC ROES-50</text>
<text x="380" y="477" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Plain five-stage tank RO, no mineral cartridge, lowest filter cost on softened feed</text>
</svg>
