<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="srv-title srv-desc">
<title id="srv-title">Water softener regeneration water sent to a septic system each week</title>
<desc id="srv-desc">Illustrative bar chart of weekly water reaching a septic system: a household's wastewater at 300 gallons a day, compared with the regeneration water from a nightly timer softener, EPA's 25 gallons a day figure, a timer regenerating every three days and a weekly demand-initiated softener, at about 50 gallons per regeneration.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Water sent to the septic tank in a week</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative, from published figures: 50 gal per regeneration, 300 gal a day per household</text>
<text x="30" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Household wastewater</text><text x="30" y="133" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">EPA: 300+ gal a day</text><rect x="240" y="100" width="400.0" height="34" fill="#52697a"/><text x="648.0" y="123" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2,100 gal</text>
<text x="30" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Timer softener, nightly</text><text x="30" y="195" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">7 × 50 gal</text><rect x="240" y="162" width="66.7" height="34" fill="#dc2626"/><text x="314.7" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">350 gal</text>
<text x="30" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">EPA: 25+ gal a day</text><text x="30" y="257" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">regeneration figure</text><rect x="240" y="224" width="33.3" height="34" fill="#78716c"/><text x="281.3" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">175 gal</text>
<text x="30" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Timer, every 3 days</text><text x="30" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">about 2.3 × 50 gal</text><rect x="240" y="286" width="22.3" height="34" fill="#78716c"/><text x="270.3" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">117 gal</text>
<text x="30" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Demand-initiated, weekly</text><text x="30" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">1 × 50 gal</text><rect x="240" y="348" width="9.5" height="34" fill="#15803d"/><text x="257.5" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">50 gal</text>
<line x1="240" y1="90" x2="240" y2="410" stroke="#3a5a72" stroke-width="1.5"/>
<text x="30" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Sources: 1978 WQRC septic study summary (about 50 gal per regeneration); EPA WaterSense.</text>
</svg>
