<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 624" width="760" height="624" role="img" aria-labelledby="ac-title ac-desc">
<title id="ac-title">Water softener brine draw: air check working vs failed</title>
<desc id="ac-desc">Diagram of a water softener brine draw. When the air check valve works it seats as the brine runs out; when it sticks open or a brine line fitting leaks, the injector draws air into the top of the resin tank.</desc>
<defs><marker id="ac-brine" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ac-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="ac-tbrine" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="ac-tmuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><pattern id="ac-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="624" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine draw: air check working vs failed</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The injector pulls until the air check seats. If it can't, air enters the resin tank.</text><text x="30" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">Working: the check seats</text><rect x="242" y="166" width="16" height="16" fill="#3a5a72"/><rect x="215" y="180" width="70" height="270" rx="22" fill="url(#ac-beads)" stroke="#3a5a72" stroke-width="2"/><text x="294" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin</text><text x="294" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">tank</text><rect x="180" y="128" width="140" height="40" rx="6" fill="#0b2f4a"/><text x="250" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text><text x="250" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#dbeafe">injector suction</text><rect x="50" y="280" width="120" height="170" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="52" y="436" width="116" height="12" fill="#ede9fe"/><rect x="130" y="250" width="24" height="198" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/><text x="90" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">brine tank</text><path class="ln" d="M142,424 L142,149 L176,149" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac-brine)"/><text x="132" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">brine line</text><rect x="133" y="424" width="18" height="24" rx="3" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="133" y="436" width="18" height="12" fill="#ede9fe"/><rect x="133" y="424" width="18" height="24" rx="3" fill="none" stroke="#3a5a72" stroke-width="1.5"/><circle cx="142" cy="441" r="6" fill="#15803d"/><text x="90" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">check</text><text x="90" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">seated</text><text x="142" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">air check (float/ball)</text><text x="30" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Brine is drawn up the pickup until the</text><text x="30" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">level reaches the air check. The check</text><text x="30" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">seats and the injector stops drawing.</text><text x="400" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Failed: stuck open, or a leak</text><rect x="612" y="166" width="16" height="16" fill="#3a5a72"/><rect x="585" y="180" width="70" height="270" rx="22" fill="url(#ac-beads)" stroke="#3a5a72" stroke-width="2"/><rect x="587" y="182" width="66" height="40" rx="20" fill="#ffffff"/><circle cx="600" cy="200" r="5" fill="#ffffff" stroke="#52697a" stroke-width="1.2"/><circle cx="618" cy="194" r="4" fill="#ffffff" stroke="#52697a" stroke-width="1.2"/><circle cx="636" cy="204" r="6" fill="#ffffff" stroke="#52697a" stroke-width="1.2"/><circle cx="626" cy="212" r="3" fill="#ffffff" stroke="#52697a" stroke-width="1.2"/><circle cx="607" cy="213" r="3" fill="#ffffff" stroke="#52697a" stroke-width="1.2"/><text x="664" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin</text><text x="664" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">tank</text><rect x="550" y="128" width="140" height="40" rx="6" fill="#0b2f4a"/><text x="620" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text><text x="620" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#dbeafe">injector suction</text><rect x="420" y="280" width="120" height="170" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="422" y="436" width="116" height="12" fill="#ede9fe"/><rect x="500" y="250" width="24" height="198" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/><text x="460" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">brine tank</text><path class="ln" d="M512,424 L512,149 L546,149" fill="none" stroke="#52697a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac-muted)"/><circle cx="512" cy="190" r="5" fill="#ffffff" stroke="#52697a" stroke-width="1.5"/><circle cx="512" cy="240" r="5" fill="#ffffff" stroke="#52697a" stroke-width="1.5"/><circle cx="512" cy="290" r="5" fill="#ffffff" stroke="#52697a" stroke-width="1.5"/><circle cx="512" cy="340" r="5" fill="#ffffff" stroke="#52697a" stroke-width="1.5"/><circle cx="512" cy="149" r="7" fill="#dc2626"/><text x="498" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#dc2626">leaking fitting</text><text x="502" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">brine line</text><rect x="503" y="424" width="18" height="24" rx="3" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="503" y="436" width="18" height="12" fill="#ede9fe"/><rect x="503" y="424" width="18" height="24" rx="3" fill="none" stroke="#3a5a72" stroke-width="1.5"/><circle cx="512" cy="430" r="6" fill="#dc2626"/><text x="460" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">check</text><text x="460" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">stuck open</text><text x="512" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">air check (float/ball)</text><text x="662" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">air pocket</text><text x="400" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">If the check can't seat, or a fitting leaks,</text><text x="400" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the injector keeps drawing air. It sits in</text><text x="400" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the top of the resin tank, then spits out</text><text x="400" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">at the faucets at the next water use.</text><path d="M380,100 L380,560" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Start-up (Fleck): fill the salt tank with water to the top of the air check.</text>
</svg>
