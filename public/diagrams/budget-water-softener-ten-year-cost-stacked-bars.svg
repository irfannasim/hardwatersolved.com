<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 545" width="760" height="545" role="img" aria-labelledby="btc-title btc-desc">
<title id="btc-title">Best budget water softeners: ten-year cost of ownership compared</title>
<desc id="btc-desc">Stacked bar chart of the ten-year cost of four budget water softeners for a family of four on 15 gpg water: Aquasure Harmony Lite about 3,122 dollars, Harmony 32k about 3,152, WaterBoss 22k about 2,745 plus unknown parts, and a Fleck 5600SXT 32k about 3,311.</desc>
<defs><pattern id="btc-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><path d="M0,0 L0,8" stroke="#94a3b8" stroke-width="3"/></pattern></defs>
<rect width="760" height="545" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Ten-year cost of four budget water softeners</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Family of four, 15 gpg city water. Illustrative: install, salt and water use the same inputs for all four.</text>
<rect x="30" y="84" width="16" height="16" fill="#0b2f4a"/>
<text x="52" y="97" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Purchase</text>
