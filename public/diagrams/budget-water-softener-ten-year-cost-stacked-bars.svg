<text x="162" y="97" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Install (pro, $400)</text>
<rect x="300" y="84" width="16" height="16" fill="#0e7490"/>
<text x="322" y="97" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Salt, water, power ($1,830)</text>
<rect x="525" y="84" width="16" height="16" fill="#94a3b8"/>
<text x="547" y="97" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Valve parts and resin</text>
