<text x="30" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hatched: WaterBoss publishes no parts price list we could find, so that line cannot be costed.</text>
<text x="30" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Parts and resin: Aquasure seal kit, circuit board and pre-filled resin tank; Fleck rebuild kit and 1 cu ft</text>
<text x="30" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">10% resin refill. Prices from aquasureusa.com and store.afwfilters.com, checked 1 October 2026.</text>
