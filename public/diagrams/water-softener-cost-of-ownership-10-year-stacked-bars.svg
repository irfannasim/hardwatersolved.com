<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="g17co-title g17co-desc">
<title id="g17co-title">Ten-year water softener cost of ownership at 7, 15 and 25 gpg</title>
<desc id="g17co-desc">Illustrative stacked bars of the ten-year water softener cost of ownership for a family of four: about $3,250 at 7 gpg, $4,180 at 15 gpg and $5,640 at 25 gpg, split into equipment and installation, salt, regeneration water, electricity, routine upkeep and one resin change.</desc>
