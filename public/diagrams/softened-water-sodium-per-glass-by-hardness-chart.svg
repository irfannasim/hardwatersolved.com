<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="g22s-title g22s-desc">
<title id="g22s-title">Sodium in softened water per 8 ounce glass by hardness removed</title>
<desc id="g22s-desc">Calculated line chart: a salt-regenerated softener adds about 1.9 mg of sodium per 8 ounce glass for each grain per gallon removed, reaching 56 mg at 30 gpg. Potassium chloride regeneration adds about 3.2 mg of potassium per glass per gpg instead. A dashed line marks the FDA very low sodium level of 35 mg per serving, and a band marks one slice of white bread at 123 to 142 mg.</desc>
<rect width="760" height="480" fill="#ffffff"/>
<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">What a softener adds to one 8 oz glass</text>
<text x="30" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Calculated: 7.9 mg/L sodium or 13.4 mg/L potassium per gpg removed; 237 mL glass</text>

<path class="ln" d="M40,84 L70,84" stroke="#7c3aed" stroke-width="4" fill="none"/>
<text x="78" y="89" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Sodium added (salt)</text>
<path class="ln" d="M230,84 L260,84" stroke="#3a5a72" stroke-width="4" fill="none"/>
<text x="268" y="89" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Potassium added (KCl), no sodium</text>
<path class="ln" d="M40,106 L70,106" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<text x="78" y="111" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">FDA "very low sodium": 35 mg per serving</text>
<rect x="380" y="99" width="30" height="14" fill="#f6ead2" stroke="#e2b865" stroke-width="1"/>
<text x="418" y="111" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">One slice of white bread, 123 to 142 mg</text>
<text x="100" y="134" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52697a">mg per glass</text>

<rect x="90" y="144" width="560" height="34" fill="#f6ead2"/>
<text x="658" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#b45309">bread</text>

<path class="ln" d="M90,337 L650,337" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<text x="658" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#15803d">35 mg</text>

<path class="ln" d="M90,400 L650,229" stroke="#3a5a72" stroke-width="4" fill="none"/>
<text x="658" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#3a5a72">95 mg K</text>
<path class="ln" d="M90,400 L650,299" stroke="#7c3aed" stroke-width="4" fill="none"/>
<text x="658" y="303" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#7c3aed">56 mg Na</text>

<path class="ln" d="M90,400 L650,400" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M90,130 L90,400" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="82" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" fill="#52697a">0</text>
<text x="82" y="314" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" fill="#52697a">50</text>
<text x="82" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" fill="#52697a">100</text>
<text x="82" y="140" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" fill="#52697a">150</text>
<text x="90" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">0</text>
<text x="183" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">5</text>
<text x="277" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">10</text>
<text x="370" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">15</text>
<text x="463" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">20</text>
<text x="557" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">25</text>
<text x="650" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">30</text>
<text x="370" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Hardness removed (grains per gallon)</text>
<text x="370" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">At 15 gpg a glass carries about 28 mg of sodium; the salt line never reaches the bread band.</text>
</svg>
