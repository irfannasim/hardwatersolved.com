<text x="288" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text>
<rect class="box" x="40" y="390" width="160" height="64" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="120" y="418.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">80k Fleck 2510SXT</text>
<text x="120" y="435.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">13 in tank, 1 in valve</text>
<rect class="box" x="216" y="390" width="144" height="64" rx="6" fill="#fff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="288" y="417.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">What matters</text>
<text x="288" y="435.9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">most?</text>
<path class="ln" d="M480,342 L480,386" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bwsd-a)"/>
<text x="488" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Yes</text>
<path class="ln" d="M640,342 L640,386" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bwsd-a)"/>
<text x="648" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text>
<rect class="box" x="400" y="390" width="160" height="64" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="480" y="418.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">Iron filter first</text>
<text x="480" y="435.05" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">no softener alone</text>
<rect class="box" x="576" y="390" width="154" height="64" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="653" y="410.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">AFW Iron Pro 2</text>
<text x="653" y="426.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">64k, fine mesh</text>
<text x="653" y="442.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">2.0 cu ft</text>
<path class="ln" d="M288,454 L288,496" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M140,496 L620,496" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M140,496 L140,524" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bwsd-a)"/>
<path class="ln" d="M380,496 L380,524" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bwsd-a)"/>
<path class="ln" d="M620,496 L620,524" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bwsd-a)"/>
<rect class="box" x="40" y="528" width="200" height="64" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="140" y="555.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Lowest upfront cost</text>
<text x="140" y="573.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Aquasure Harmony 48k</text>
<rect class="box" x="280" y="528" width="200" height="64" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="380" y="555.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">10% resin at the lower price</text>
<text x="380" y="573.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">AFW 48k, 10% resin</text>
<rect class="box" x="520" y="528" width="210" height="64" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="625" y="555.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Least salt per year</text>
<text x="625" y="573.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">SoftPro Elite 48k</text>
<text x="30" y="618" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Picks are the five in this guide. Red boxes mean none of them is the right next purchase.</text>
</svg>
