<text x="611.2" y="609" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Sediment / carbon</text>
<text x="30" y="638" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">Installation labour is charged per stage, so each added stage raises the fitted cost.</text>
