<rect x="440.4" y="596" width="16" height="16" rx="3" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="462.4" y="609" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Softening / UV</text>
