<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="apn-title apn-desc">
<title id="apn-title">APEC ROES-50 on softened water: hardness and sodium from tap to glass</title>
<desc id="apn-desc">Worked example for 15 gpg water: the softener takes hardness to about zero and adds about 119 mg/L of sodium, and the APEC ROES-50 reverse osmosis system, passing about 10 percent of dissolved solids, leaves about 12 mg/L in the glass.</desc>
<defs><marker id="apn-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="460" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softener first, ROES-50 second: what reaches the glass</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Worked example: 15 gpg water. Sodium added at 7.9 mg/L per grain; RO passing 10% of dissolved solids.</text><rect class="box" x="30" y="100" width="200" height="230" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="46" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Tap water</text><text x="46" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">before the softener</text><text x="46" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Hardness</text><text x="46" y="222" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#c2410c">15 gpg</text><text x="46" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Sodium added</text><text x="46" y="296" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#0e7490">+0 mg/L</text><path class="ln" d="M236,215 L268,215" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-a)"/><rect class="box" x="280" y="100" width="200" height="230" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="296" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softened water</text><text x="296" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">kitchen cold line</text><text x="296" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Hardness</text><text x="296" y="222" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#0e7490">~0 gpg</text><text x="296" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Sodium added</text><text x="296" y="296" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#0b2f4a">+119 mg/L</text><path class="ln" d="M486,215 L518,215" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apn-a)"/><rect class="box" x="530" y="100" width="200" height="230" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="546" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">ROES-50 glass</text><text x="546" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">after the membrane</text><text x="546" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Hardness</text><text x="546" y="222" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#0e7490">~0 gpg</text><text x="546" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Added sodium left</text><text x="546" y="296" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#0e7490">~12 mg/L</text><rect class="box" x="30" y="360" width="700" height="74" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">The membrane removes the sodium the softener added. No mineral stage is needed for that.</text><text x="46" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">A mineral stage only adds calcium and magnesium back, for taste and pH.</text>
</svg>
