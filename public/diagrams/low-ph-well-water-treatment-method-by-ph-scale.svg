<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="lps-title lps-desc">
<title id="lps-title">Low pH well water treatment method by pH: soda ash, calcite and magnesium oxide blend, or calcite</title>
<desc id="lps-desc">pH scale from 4.0 to 7.5 showing which low pH well water treatment fits: soda ash chemical feed below about pH 5.3, a calcite and magnesium oxide blend from 5.3 to 6.0, calcite alone above 6.0, with a target near 7, and the hardness or sodium each adds per mg/L of carbon dioxide neutralized.</desc>
<defs><marker id="lps-mc2410c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="lps-m0e7490" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="lps-m0b2f4a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="lps-mdc2626" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="lps-m15803d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="lps-m52697a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="lps-m78716c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="lps-mb45309" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="lps-m3a5a72" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Low pH well water treatment: match the method to the pH</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Raw pH before any treatment, from a lab or a calibrated meter</text>
<path class="ln" d="M279.42857142857144,96 L96.57142857142861,96" fill="none" stroke="#52697a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lps-m52697a)"/>
<text x="297.71428571428567" y="101" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">more acidic</text>
<rect x="60" y="116" width="237.71428571428567" height="54" fill="#fed7aa" stroke="#c2410c" stroke-width="1.5"/>
<text x="178.85714285714283" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Soda ash feed</text>
<rect x="297.71428571428567" y="116" width="128.00000000000006" height="54" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="361.71428571428567" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Calcite +</text>
<text x="361.71428571428567" y="157" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">MgO blend</text>
<rect x="425.7142857142857" y="116" width="182.85714285714283" height="54" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="517.1428571428571" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Calcite alone</text>
<rect x="608.5714285714286" y="116" width="91.42857142857144" height="54" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="654.2857142857142" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Target</text>
<line x1="60" y1="170" x2="60" y2="178" stroke="#3a5a72" stroke-width="1.5"/>
<text x="60" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4.0</text>
<line x1="151.42857142857144" y1="170" x2="151.42857142857144" y2="178" stroke="#3a5a72" stroke-width="1.5"/>
<text x="151.42857142857144" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4.5</text>
<line x1="242.85714285714286" y1="170" x2="242.85714285714286" y2="178" stroke="#3a5a72" stroke-width="1.5"/>
<text x="242.85714285714286" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5.0</text>
<line x1="334.2857142857143" y1="170" x2="334.2857142857143" y2="178" stroke="#3a5a72" stroke-width="1.5"/>
<text x="334.2857142857143" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5.5</text>
<line x1="425.7142857142857" y1="170" x2="425.7142857142857" y2="178" stroke="#3a5a72" stroke-width="1.5"/>
<text x="425.7142857142857" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6.0</text>
<line x1="517.1428571428571" y1="170" x2="517.1428571428571" y2="178" stroke="#3a5a72" stroke-width="1.5"/>
<text x="517.1428571428571" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6.5</text>
<line x1="608.5714285714286" y1="170" x2="608.5714285714286" y2="178" stroke="#3a5a72" stroke-width="1.5"/>
<text x="608.5714285714286" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">7.0</text>
<line x1="700" y1="170" x2="700" y2="178" stroke="#3a5a72" stroke-width="1.5"/>
<text x="700" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">7.5</text>
<text x="297.71428571428567" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">5.3</text>
<text x="425.7142857142857" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">6.0</text>
<text x="30" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Below about 5.3 neutralizing filters stop being enough (Virginia Cooperative Extension). EPA recommends 6.5 to 8.5.</text>
<rect class="box" x="30" y="262" width="210" height="158" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="44" y="288" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Soda ash feed</text>
<text x="44" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">No added hardness</text>
<text x="44" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Adds 1.05 mg/L sodium</text>
<text x="44" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">per mg/L of CO₂</text>
<text x="44" y="377" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pump-set dose: needs</text>
<text x="44" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">checking and tuning</text>
<rect class="box" x="275" y="262" width="210" height="158" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="289" y="288" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Calcite + MgO blend</text>
<text x="289" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">MgO adds 1.14 mg/L hardness</text>
<text x="289" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">per mg/L of CO₂ (0.07 gpg)</text>
<text x="289" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">More reactive: too strong</text>
<text x="289" y="377" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">a blend overshoots</text>
<text x="289" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">neutral</text>
<rect class="box" x="520" y="262" width="210" height="158" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="534" y="288" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Calcite alone</text>
<text x="534" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Adds 2.27 mg/L hardness</text>
<text x="534" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">per mg/L of CO₂ (0.13 gpg)</text>
<text x="534" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Self-limiting: slows as</text>
<text x="534" y="377" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">water nears neutral</text>
<text x="534" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Top up as it dissolves</text>
<text x="30" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hardness and sodium per mg/L of CO₂ neutralized come from the reaction chemistry. They are upper limits.</text>
</svg>
