<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img" aria-labelledby="wvtl-title wvtl-desc">
<title id="wvtl-title">Water softener vacation mode by trip length: two weeks, two months, a season</title>
<desc id="wvtl-desc">Decision scale for a water softener during an absence: up to two weeks leave it in service, from two weeks to two months bypass it and regenerate on return, and for a season follow the full seasonal shutdown; winterize at any length if the heat is off, and bypass whenever the main is shut.</desc>
<defs></defs>
<rect width="760" height="452" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water softener vacation mode: what to do by length of trip</text><rect x="30" y="70" width="220" height="40" rx="8" fill="#0e7490"/><text x="140" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">up to 2 weeks</text><rect class="box" x="38" y="124" width="204" height="186" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="140" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">Leave it in service</text><text x="140" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Top up the salt</text><text x="140" y="203" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Day override keeps</text><text x="140" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">it regenerating</text><text x="140" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">On return: run the</text><text x="140" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">cold tap, test later</text><rect x="252" y="70" width="238" height="40" rx="0" fill="#3a5a72"/><text x="370" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2 weeks to 2 months</text><rect class="box" x="258" y="124" width="224" height="186" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="370" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3a5a72">Bypass it</text><text x="370" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Bypass, shut the main</text><text x="370" y="203" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Leave the salt as is</text><text x="370" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">On return: flush,</text><text x="370" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">regenerate; sanitize</text><text x="370" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">if well water or odor</text><rect x="492" y="70" width="238" height="40" rx="8" fill="#0b2f4a"/><text x="610" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">a season or longer</text><rect class="box" x="498" y="124" width="224" height="186" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="610" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Close it down</text><text x="610" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Seasonal protocol:</text><text x="610" y="203" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">let salt run low,</text><text x="610" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">regenerate, bypass</text><text x="610" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">On return: sanitize</text><text x="610" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">and regenerate twice</text><rect class="box" x="30" y="330" width="700" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="380" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Heat off and any chance of freezing? Drain and winterize, whatever the length.</text><rect class="box" x="30" y="386" width="700" height="44" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="380" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Shutting off the main water supply? Put the softener in bypass, even for a week.</text>
</svg>
