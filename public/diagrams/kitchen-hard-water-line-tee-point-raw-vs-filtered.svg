<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" width="760" height="494" role="img" aria-labelledby="khtp-title khtp-desc">
<title id="khtp-title">Kitchen hard water line: tee point before or after the filters</title>
<desc id="khtp-desc">Treatment-train schematic showing three places to connect a kitchen drinking tap: teed before all treatment it delivers raw well water, teed after the iron and sediment filters but before the water softener it delivers filtered hard water, and a reverse osmosis unit after the softener reduces sodium.</desc>
<defs><marker id="ktH" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ktS" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ktI" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect width="760" height="494" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where the kitchen hard line tees off decides what it delivers</text><text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Example well-water treatment train with three possible drinking-tap connections</text><text x="30" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">well supply</text><path class="ln" d="M30,150 L160,150" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="160" y="122" width="110" height="56" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="215" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">sediment</text><text x="215" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">filter</text><path class="ln" d="M270,150 L310,150" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="310" y="122" width="120" height="56" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="370" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">iron / sulfur</text><text x="370" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">filter</text><path class="ln" d="M430,150 L490,150" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="490" y="122" width="110" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="545" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><path class="ln" d="M600,150 L720,150" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ktS)"/><text x="730" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">rest of house</text><path class="ln" d="M130,150 L130,246" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ktH)"/><rect class="box" x="30" y="256" width="200" height="46" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="130" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Tap A: raw water</text><text x="130" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">hard, plus iron, sulfur,</text><text x="130" y="349" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">sediment and anything</text><text x="130" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">else in the well</text><path class="ln" d="M460,150 L460,246" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ktH)"/><rect class="box" x="280" y="256" width="200" height="46" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="380" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Tap B: filtered, hard</text><text x="380" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">no added sodium;</text><text x="380" y="349" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">iron and odor</text><text x="380" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">already removed</text><path class="ln" d="M660,150 L660,246" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ktS)"/><rect class="box" x="530" y="256" width="200" height="46" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="630" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Tap C: through RO</text><text x="630" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">softened feed; RO</text><text x="630" y="349" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">reduces sodium and</text><text x="630" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">many dissolved solids</text><text x="130" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">the common shortcut</text><text x="380" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">better bypass point</text><text x="630" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">usually the best</text><text x="30" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">A hard line taken off the main before the treatment train skips every filter, not just the softener.</text><rect x="30" y="468" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">unsoftened</text><rect x="200" y="468" width="26" height="6" rx="3" fill="#0e7490"/><text x="234" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened</text>
</svg>
