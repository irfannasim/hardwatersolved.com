<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="sbc-title sbc-desc">
<title id="sbc-title">City water hardness by month as a utility switches source blend (illustrative)</title>
<desc id="sbc-desc">Illustrative bar chart of city water hardness rising from 9.2 gpg in winter to 15.2 gpg in summer as a utility draws more hard well water, with the 11.4 gpg annual average shown below the summer peak a water softener for city water should be sized for.</desc>
<defs></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">City hardness through one year of source switching</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative utility: river water at 8 gpg, well water at 20 gpg, more wells in summer.</text><path d="M90,430 L710,430" stroke="#0b2f4a" stroke-width="1.5"/><text x="80" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text><path d="M90,380 L710,380" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">3</text><path d="M90,330 L710,330" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">6</text><path d="M90,280 L710,280" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">9</text><path d="M90,230 L710,230" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">12</text><path d="M90,180 L710,180" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">15</text><path d="M90,130 L710,130" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">18</text><text x="90" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hardness at the tap (gpg)</text><rect x="100.8" y="276.7" width="30" height="153.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="115.8" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Jan</text><text x="115.8" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">10%</text><rect x="152.5" y="276.7" width="30" height="153.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="167.5" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Feb</text><text x="167.5" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">10%</text><rect x="204.2" y="276.7" width="30" height="153.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="219.2" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Mar</text><text x="219.2" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">10%</text><rect x="255.8" y="266.7" width="30" height="163.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="270.8" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Apr</text><text x="270.8" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">15%</text><rect x="307.5" y="236.7" width="30" height="193.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="322.5" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">May</text><text x="322.5" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">30%</text><rect x="359.2" y="196.7" width="30" height="233.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="374.2" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Jun</text><text x="374.2" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">50%</text><rect x="410.8" y="176.7" width="30" height="253.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="425.8" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Jul</text><text x="425.8" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">60%</text><rect x="462.5" y="176.7" width="30" height="253.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="477.5" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Aug</text><text x="477.5" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">60%</text><rect x="514.2" y="206.7" width="30" height="223.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="529.2" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Sep</text><text x="529.2" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">45%</text><rect x="565.8" y="246.7" width="30" height="183.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="580.8" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Oct</text><text x="580.8" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">25%</text><rect x="617.5" y="266.7" width="30" height="163.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="632.5" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Nov</text><text x="632.5" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">15%</text><rect x="669.2" y="276.7" width="30" height="153.3" fill="#fed7aa" stroke="#c2410c" stroke-width="1.2"/><text x="684.2" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Dec</text><text x="684.2" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">10%</text><text x="80" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">wells</text><path d="M90,240 L710,240" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M90,176.66666666666666 L710,176.66666666666666" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="166.7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Summer peak 15.2 gpg: size and set the softener here</text><text x="96" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Annual average 11.4 gpg:</text><text x="96" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the single number a report may print</text><text x="30" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">A softener set to the average runs out of capacity early in every summer month.</text><text x="30" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative figures. % = share of supply from wells. Ask your utility for its real range.</text>
</svg>
