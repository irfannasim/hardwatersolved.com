<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="g6sp-title g6sp-desc">
<title id="g6sp-title">Broom handle probe test for a water softener salt bridge</title>
<desc id="g6sp-desc">Side view of a bridged brine tank showing the broom handle test for a water softener salt bridge: the handle hits a hard stop at the crust, then cracks through and drops into the air void, with the void depth showing the bridge age. A top view shows where to probe.</desc>
<defs><pattern id="g6sp-s" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern><marker id="g6sp-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">The broom handle test for a salt bridge</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Resistance, a crack, then nothing: that is a bridge.</text>
<rect x="30" y="160" width="220" height="320" rx="10" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="32" y="210" width="216" height="52" fill="url(#g6sp-s)"/>
<path d="M32,284 Q140,236 248,284 L248,262 Q140,214 32,262 Z" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="162" y="226" width="12" height="40" fill="#ffffff"/>
<rect x="32" y="400" width="216" height="78" fill="#dbeafe"/>
<rect x="50" y="462" width="180" height="6" fill="#64748b"/>
<rect x="75" y="100" width="10" height="146" rx="3" fill="#d6a86a" stroke="#8a5a2b" stroke-width="1.5"/>
<text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1</text>
<rect x="163" y="246" width="10" height="152" rx="3" fill="#d6a86a" stroke="#8a5a2b" stroke-width="1.5"/>
<rect x="163" y="384" width="10" height="14" rx="3" fill="#60a5fa"/>
<text x="168" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2</text>
<path class="ln" d="M220,268 L220,394" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g6sp-m)" marker-start="url(#g6sp-m)"/>
<path class="ln" d="M88,244 L260,244" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="266" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">1 · hard stop</text>
<text x="266" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">at the crust</text>
<path class="ln" d="M176,330 L260,302" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="266" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">2 · a crack, then a</text>
<text x="266" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">sudden drop into air</text>
<path class="ln" d="M226,352 L260,352" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="266" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">void depth:</text>
<text x="266" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">2 in = a young bridge</text>
<text x="266" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">8 in = months old</text>
<path class="ln" d="M176,392 L260,412" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="266" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">handle dry above the</text>
<text x="266" y="433" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">break, damp at the tip</text>
<path class="ln" d="M226,466 L260,466" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="266" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">grid plate: a hard stop</text>
<text x="266" y="479" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">at the floor is normal</text>
<rect class="box" x="450" y="92" width="280" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="590" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Seen from above</text>
<circle cx="590" cy="250" r="104" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<circle cx="590" cy="250" r="80" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="522" cy="182" r="13" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
<circle cx="630" cy="250" r="7" fill="#0b2f4a"/>
<circle cx="590" cy="294" r="7" fill="#0b2f4a"/>
<circle cx="546" cy="250" r="7" fill="#0b2f4a"/>
<circle cx="598" cy="210" r="7" fill="#0b2f4a"/>
<circle cx="476" cy="386" r="7" fill="#0b2f4a"/>
<text x="492" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">probe in 3 or 4 places</text>
<path d="M468,414 L486,414" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5"/>
<text x="492" y="419" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">keep a hand's width off the wall</text>
<circle cx="476" cy="442" r="9" fill="#e2e8f0" stroke="#dc2626" stroke-width="2"/>
<text x="492" y="447" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">brine well in the corner: avoid</text>
</svg>
