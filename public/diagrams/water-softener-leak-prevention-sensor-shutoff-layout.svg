<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" width="760" height="604" role="img" aria-labelledby="g18pv-title g18pv-desc">
<title id="g18pv-title">Water softener leak prevention: sensors, automatic shut-off, PRV and drain safeguards</title>
<desc id="g18pv-desc">Layout of leak protection for a water softener that can support a homeowners insurance claim: a pressure-reducing valve and automatic shut-off valve on the supply, floor leak sensors by the tanks, and a drain line and overflow discharging through an air gap.</desc>
<defs><marker id="g18pvh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g18pvs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="g18pvd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="604" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Leak protection around a water softener</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Where the sensors, shut-off and drain safeguards sit</text>
<text x="30" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#c2410c">From main</text>
<path class="ln" d="M30,136 L80,136" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="80" y="118" width="70" height="36" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="115" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">PRV</text>
<path class="ln" d="M150,136 L186,136" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g18pvh)"/>
<rect class="box" x="190" y="112" width="116" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="248" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Auto shut-off</text>
<text x="248" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">valve</text>
<path class="ln" d="M306,136 L336,136" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g18pvh)"/>
<rect class="box" x="340" y="104" width="110" height="64" rx="8" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/>
<text x="395" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Valve and</text>
<text x="395" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">bypass</text>
<path class="ln" d="M450,126 L726,126" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g18pvs)"/>
<text x="726" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0e7490">To house</text>
<rect class="box" x="360" y="168" width="70" height="302" rx="28" fill="#f6ead2" stroke="#3a5a72" stroke-width="1.5"/>
<text x="395" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Mineral</text>
<text x="395" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">tank</text>
<rect class="box" x="484" y="300" width="110" height="170" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="539" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Brine tank</text>
<path class="ln" d="M520,300 L520,152 L450,152" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M430,104 L430,90 L660,90 L660,240" fill="none" stroke="#78716c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g18pvd)"/>
<rect x="644" y="262" width="32" height="208" rx="3" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5"/>
<text x="684" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#78716c">Air gap</text>
<text x="684" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#78716c">Stand-</text>
<text x="684" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#78716c">pipe</text>
<path class="ln" d="M594,330 L640,330" fill="none" stroke="#78716c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g18pvd)"/>
<text x="684" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#78716c">Overflow</text>
<text x="545" y="80" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#78716c">Drain line</text>
<path d="M30,470 L730,470" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="306" y="458" width="36" height="12" rx="3" fill="#dc2626"/>
<rect x="604" y="458" width="32" height="12" rx="3" fill="#dc2626"/>
<text x="324" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">Leak sensor</text>
<text x="620" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">Leak sensor</text>
<path class="ln" d="M320,456 L256,164" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/>
<text x="40" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">Sensor signal</text>
<text x="40" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">closes the valve</text>
<rect class="box" x="30" y="512" width="700" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sensors and an automatic shut-off limit how long a leak can run unnoticed.</text>
<text x="46" y="564" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The PRV keeps pressure under the tank rating; the air gap and overflow keep water off the floor.</text>
</svg>
