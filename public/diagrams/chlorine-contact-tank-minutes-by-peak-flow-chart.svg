<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="cct-title cct-desc">
<title id="cct-title">Chlorine contact tank sizing: minutes of contact by tank size and peak flow</title>
<desc id="cct-desc">Bar chart of nominal chlorine contact time for 40, 80 and 120 gallon contact tanks at 6, 8, 10 and 12 gallons per minute of peak flow, compared with the 20 to 30 minute contact a dealer recommends for iron bacteria. Only the 120 gallon tank at 6 gpm reaches 20 minutes.</desc>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Contact time by tank size and peak flow</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Nominal minutes = tank gallons ÷ peak gpm (illustrative; real time is shorter)</text>

<rect x="30" y="80" width="30" height="12" rx="2" fill="#b8c4ce"/>
<text x="68" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">40 gal</text>
<rect x="130" y="80" width="30" height="12" rx="2" fill="#3a5a72"/>
<text x="168" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">80 gal</text>
<rect x="230" y="80" width="30" height="12" rx="2" fill="#0e7490"/>
<text x="268" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">120 gal</text>
<rect x="350" y="80" width="30" height="12" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="388" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">20 to 30 min target for iron bacteria (dealer guidance)</text>

<rect x="90" y="120" width="640" height="106.7" fill="#dcfce7"/>

<path d="M90,226.7 L730,226.7" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<path d="M90,333.3 L730,333.3" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<path d="M90,280 L730,280" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<path d="M90,386.7 L730,386.7" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<path d="M90,173.3 L730,173.3" stroke="#e2e8f0" stroke-width="1" fill="none"/>

<text x="80" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">0</text>
<text x="80" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">5</text>
<text x="80" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">10</text>
<text x="80" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">15</text>
<text x="80" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">20</text>
<text x="80" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">25</text>
<text x="80" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">30</text>
<text x="40" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a" transform="rotate(-90 40 290)">Minutes of contact</text>

<!-- group 6 gpm: center 170 -->
<rect x="116" y="368.9" width="34" height="71.1" fill="#b8c4ce"/>
<rect x="154" y="298.1" width="34" height="141.9" fill="#3a5a72"/>
<rect x="192" y="226.7" width="34" height="213.3" fill="#0e7490"/>
<text x="133" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">6.7</text>
<text x="171" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">13</text>
<text x="209" y="218" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0b2f4a">20</text>
<!-- group 8 gpm: center 330 -->
<rect x="276" y="386.7" width="34" height="53.3" fill="#b8c4ce"/>
<rect x="314" y="333.3" width="34" height="106.7" fill="#3a5a72"/>
<rect x="352" y="280" width="34" height="160" fill="#0e7490"/>
<text x="293" y="379" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">5</text>
<text x="331" y="325" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">10</text>
<text x="369" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">15</text>
<!-- group 10 gpm: center 490 -->
<rect x="436" y="397.3" width="34" height="42.7" fill="#b8c4ce"/>
<rect x="474" y="354.7" width="34" height="85.3" fill="#3a5a72"/>
<rect x="512" y="312" width="34" height="128" fill="#0e7490"/>
<text x="453" y="389" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">4</text>
<text x="491" y="347" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">8</text>
<text x="529" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">12</text>
<!-- group 12 gpm: center 650 -->
<rect x="596" y="404.4" width="34" height="35.6" fill="#b8c4ce"/>
<rect x="634" y="368.9" width="34" height="71.1" fill="#3a5a72"/>
<rect x="672" y="333.3" width="34" height="106.7" fill="#0e7490"/>
<text x="613" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">3.3</text>
<text x="651" y="361" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">6.7</text>
<text x="689" y="325" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#0b2f4a">10</text>

<path class="ln" d="M90,440 L730,440" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="171" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">6 gpm</text>
<text x="331" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">8 gpm</text>
<text x="491" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">10 gpm</text>
<text x="651" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">12 gpm</text>
<text x="410" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#52697a">Peak flow through the contact tank</text>
<text x="30" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Size on the busiest moment of the day. Sulfur or iron alone at a higher dose can need less time.</text>
</svg>
