<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="ans-title ans-desc">
<title id="ans-title">Water heater anode rod inspection schedule on hard versus softened water</title>
<desc id="ans-desc">Timeline comparing anode rod checks over ten years: every two years on hard water per the Bradford White manual, and yearly on softened water until the wear rate is known, because a water softener speeds anode consumption.</desc>
<defs></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Anode rod checks: hard water vs softened water</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Bradford White: inspect every 2 years, and more often on softened (or phosphate-treated) water.</text><text x="170" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Install</text><text x="280" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Yr 2</text><text x="390" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Yr 4</text><text x="500" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Yr 6</text><text x="610" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Yr 8</text><text x="720" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Yr 10</text><text x="30" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">Hard or</text>
<text x="30" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">untreated</text><path d="M170,170 L720,170" fill="none" stroke="#cbd5e1" stroke-width="6"/><circle cx="280" cy="170" r="9" fill="#ffffff" stroke="#c2410c" stroke-width="3"/><circle cx="390" cy="170" r="9" fill="#ffffff" stroke="#c2410c" stroke-width="3"/><circle cx="500" cy="170" r="9" fill="#ffffff" stroke="#c2410c" stroke-width="3"/><circle cx="610" cy="170" r="9" fill="#ffffff" stroke="#c2410c" stroke-width="3"/><circle cx="720" cy="170" r="9" fill="#ffffff" stroke="#c2410c" stroke-width="3"/><text x="170" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#c2410c">Manual baseline: every 2 years</text><text x="30" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Softened</text>
<text x="30" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">water</text><path d="M170,290 L720,290" fill="none" stroke="#cbd5e1" stroke-width="6"/><circle cx="225" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="280" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="335" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="390" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="445" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="500" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="555" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="610" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="665" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><circle cx="720" cy="290" r="9" fill="#ffffff" stroke="#0e7490" stroke-width="3"/><text x="170" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0e7490">Our suggestion: yearly until you know the wear rate</text><rect class="box" x="30" y="364" width="700" height="86" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.2"/><circle cx="54" cy="390" r="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="3"/><text x="72" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">= pull and inspect the anode</text><text x="46" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Replace when the core wire shows over much of its length. Consumable anodes are excluded from the tank</text>
<text x="46" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">warranty, and removing one (except to inspect or replace it) voids it.</text>
</svg>
