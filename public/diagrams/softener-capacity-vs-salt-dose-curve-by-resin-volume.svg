<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 574" width="760" height="574" role="img" aria-labelledby="csd-title csd-desc">
<title id="csd-title">Softener capacity vs salt dose for 1.0, 1.5 and 2.0 cubic feet of resin</title>
<desc id="csd-desc">Chart of advertised vs usable softener capacity: capacity per regeneration rises steeply from 6 to 9 lb of salt per cubic foot and flattens by 15 lb, staying below the 32,000, 48,000 and 64,000 box ratings.</desc>
