<text x="30" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Per cubic foot: about 21,000 grains at 6 lb, 26,000 at 9 lb, 29,000 at 12 lb and 31,000 at 15 lb (WC&amp;P design</text>
