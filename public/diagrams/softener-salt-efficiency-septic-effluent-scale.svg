<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="sse-title sse-desc">
<title id="sse-title">Water softener salt efficiency and septic tank effluent</title>
<desc id="sse-desc">Scale of water softener salt efficiency in grains of hardness per pound of salt. The 2013 Virginia Tech study found septic tank effluent got worse at about 1,000 grains per pound, the harm was greatly lessened at about 2,000, and effluent improved at about 4,000. One softener's highest and lowest salt settings are marked for comparison.</desc>
<rect width="760" height="480" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Salt efficiency decided the septic result</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Novak and Hogan (2013), Virginia Tech, funded by the Water Quality Research Foundation</text>
<rect class="box" x="40" y="92" width="220" height="86" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/><text x="150" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">~1,000 gr/lb (M/D 11)</text><text x="150" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14"  text-anchor="middle" fill="#0b2f4a">Effluent solids, COD</text><text x="150" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14"  text-anchor="middle" fill="#0b2f4a">and BOD5 went up</text><line class="ln" x1="188" y1="182" x2="188" y2="240" stroke="#dc2626" stroke-width="1.5"/>
<rect class="box" x="265" y="92" width="220" height="86" rx="10" fill="#f8fafc" stroke="#52697a" stroke-width="2"/><text x="375" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#52697a">~2,000 gr/lb (M/D 5)</text><text x="375" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14"  text-anchor="middle" fill="#0b2f4a">Negative effect</text><text x="375" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14"  text-anchor="middle" fill="#0b2f4a">greatly lessened</text><line class="ln" x1="316" y1="182" x2="316" y2="240" stroke="#52697a" stroke-width="1.5"/>
<rect class="box" x="500" y="92" width="220" height="86" rx="10" fill="#f8fafc" stroke="#15803d" stroke-width="2"/><text x="610" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">~4,000 gr/lb (M/D 3)</text><text x="610" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14"  text-anchor="middle" fill="#0b2f4a">Effluent better than with</text><text x="610" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14"  text-anchor="middle" fill="#0b2f4a">regenerant diverted</text><line class="ln" x1="572" y1="182" x2="572" y2="240" stroke="#15803d" stroke-width="1.5"/>
<rect x="60" y="244" width="128" height="18" fill="#dc2626"/><rect x="188" y="244" width="256" height="18" fill="#cbd5e1"/><rect x="444" y="244" width="256" height="18" fill="#15803d"/>
<line x1="60" y1="262" x2="60" y2="270" stroke="#3a5a72" stroke-width="1.5"/><text x="60" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<line x1="188" y1="262" x2="188" y2="270" stroke="#3a5a72" stroke-width="1.5"/><text x="188" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1,000</text>
<line x1="316" y1="262" x2="316" y2="270" stroke="#3a5a72" stroke-width="1.5"/><text x="316" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">2,000</text>
<line x1="444" y1="262" x2="444" y2="270" stroke="#3a5a72" stroke-width="1.5"/><text x="444" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">3,000</text>
<line x1="572" y1="262" x2="572" y2="270" stroke="#3a5a72" stroke-width="1.5"/><text x="572" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">4,000</text>
<line x1="700" y1="262" x2="700" y2="270" stroke="#3a5a72" stroke-width="1.5"/><text x="700" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">5,000</text>
<text x="380" y="312" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Softener salt efficiency: grains of hardness removed per pound of salt</text>
<polygon points="325.856,340 317.856,354 333.856,354" fill="#0b2f4a"/><text x="325.856" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">23.4 lb salt: ~2,100</text>
<polygon points="658.144,340 650.144,354 666.144,354" fill="#0b2f4a"/><text x="658.144" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">5.2 lb salt: ~4,700</text>
<rect class="box" x="30" y="398" width="700" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Triangles: the same Pentair 1.5 cu ft softener at its highest and lowest salt</text>
<text x="46" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">settings, from its rated capacities. Real-world efficiency runs lower than rated.</text>
</svg>
