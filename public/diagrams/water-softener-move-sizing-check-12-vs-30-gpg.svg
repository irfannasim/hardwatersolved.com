<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 606" width="760" height="606" role="img" aria-labelledby="g18mv-title g18mv-desc">
<title id="g18mv-title">Moving a water softener to a new house: sizing check at 12 versus 30 gpg</title>
<desc id="g18mv-desc">Illustrative sizing check before you move a water softener to a new house: the same 1.0 cubic foot unit regenerates every 6.4 days on 12 gpg water but every 2.5 to 3.6 days on 30 gpg water, using up to four times the salt.</desc>
<defs></defs>
<rect width="760" height="606" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Same softener, new water: the sizing check</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">One 1.0 cu ft softener, family of four using 300 gallons a day. Illustrative, no reserve.</text>
<rect x="450" y="96" width="200" height="234" fill="#dcfce7"/>
<text x="550" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Target: 3 to 7 days</text>
<path d="M300,330 L300,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text>
<path d="M350,330 L350,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1</text>
<path d="M400,330 L400,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="400" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2</text>
<path d="M450,330 L450,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3</text>
<path d="M500,330 L500,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="500" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4</text>
<path d="M550,330 L550,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="550" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5</text>
<path d="M600,330 L600,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6</text>
<path d="M650,330 L650,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="650" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">7</text>
<path d="M700,330 L700,336" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">8</text>
<path d="M300,330 L700,330" fill="none" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="500" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Days between regenerations</text>
<text x="30" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Old house, 12 gpg</text>
<text x="30" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">efficient 6 lb dose</text>
<rect x="300" y="138" width="320" height="24" rx="4" fill="#0e7490"/>
<text x="30" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">New house, 30 gpg</text>
<text x="30" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">efficient 6 lb dose</text>
<rect x="300" y="208" width="125" height="24" rx="4" fill="#dc2626"/>
<text x="30" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">New house, 30 gpg</text>
<text x="30" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">maximum 15 lb dose</text>
<rect x="300" y="278" width="180" height="24" rx="4" fill="#c2410c"/>
<text x="630" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">6.4 days</text>
<text x="435" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">2.5 days</text>
<text x="490" y="295" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">3.6 days</text>
<rect class="box" x="30" y="406" width="700" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Per year</text>
<text x="300" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Old, 12 gpg</text>
<text x="450" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">New, 6 lb</text>
<text x="600" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">New, 15 lb</text>
<text x="46" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Regenerations</text>
<text x="300" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">57</text>
<text x="450" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">143</text>
<text x="600" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">103</text>
<text x="46" y="502" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Salt used</text>
<text x="300" y="502" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">about 345 lb</text>
<text x="450" y="502" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">about 860 lb</text>
<text x="600" y="502" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">about 1,540 lb</text>
<text x="46" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Valve wear vs old</text>
<text x="300" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">1×</text>
<text x="450" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">2.5×</text>
<text x="600" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">1.8×</text>
<text x="30" y="586" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Capacity per Hellenbrand 1.0 cu ft ratings: 22,930 grains at 6 lb, 31,995 at 15 lb.</text>
</svg>
