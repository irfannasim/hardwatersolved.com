<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" width="760" height="546" role="img" aria-labelledby="wsm-title wsm-desc">
<title id="wsm-title">Water softener myths grouped by source and verdict</title>
<desc id="wsm-desc">Fifteen water softener myths in three columns: six that flatter softeners, six that attack them and three from alternative products, each marked false, mostly false or partly true, with a box of critical claims that are true.</desc>
<defs></defs>
<rect width="760" height="546" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">15 water softener myths, by who they help sell</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Colour shows the verdict. Every column has false claims in it.</text><text x="140" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Flatter softeners</text><rect class="box" x="30" y="122" width="220" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="32" y="124" width="8" height="46" rx="2" fill="#dc2626"/><text x="50" y="143" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">1. Purifies your water</text><text x="50" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">False</text><rect class="box" x="30" y="182" width="220" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="32" y="184" width="8" height="46" rx="2" fill="#dc2626"/><text x="50" y="203" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">2. Protects from lead</text><text x="50" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">False</text><rect class="box" x="30" y="242" width="220" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="32" y="244" width="8" height="46" rx="2" fill="#dc2626"/><text x="50" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">3. Hardness harms health</text><text x="50" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">False</text><rect class="box" x="30" y="302" width="220" height="50" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><rect x="32" y="304" width="8" height="46" rx="2" fill="#c2410c"/><text x="50" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">4. Pays for itself</text><text x="50" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">Mostly false</text><rect class="box" x="30" y="362" width="220" height="50" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><rect x="32" y="364" width="8" height="46" rx="2" fill="#c2410c"/><text x="50" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">5. Bigger is better</text><text x="50" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">Mostly false</text><rect class="box" x="30" y="422" width="220" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="32" y="424" width="8" height="46" rx="2" fill="#dc2626"/><text x="50" y="443" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">6. Needs no maintenance</text><text x="50" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">False</text><text x="380" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Attack softeners</text><rect class="box" x="270" y="122" width="220" height="50" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><rect x="272" y="124" width="8" height="46" rx="2" fill="#c2410c"/><text x="290" y="143" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">7. Too salty to drink</text><text x="290" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">Mostly false</text><rect class="box" x="270" y="182" width="220" height="50" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><rect x="272" y="184" width="8" height="46" rx="2" fill="#c2410c"/><text x="290" y="203" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">8. Corrodes your pipes</text><text x="290" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">Mostly false</text><rect class="box" x="270" y="242" width="220" height="50" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><rect x="272" y="244" width="8" height="46" rx="2" fill="#3a5a72"/><text x="290" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">9. Ruins septic systems</text><text x="290" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#3a5a72">Partly true</text><rect class="box" x="270" y="302" width="220" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="272" y="304" width="8" height="46" rx="2" fill="#dc2626"/><text x="290" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">10. Slick = soap residue</text><text x="290" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">False</text><rect class="box" x="270" y="362" width="220" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="272" y="364" width="8" height="46" rx="2" fill="#dc2626"/><text x="290" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">11. Makes water acidic</text><text x="290" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">False</text><rect class="box" x="270" y="422" width="220" height="50" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><rect x="272" y="424" width="8" height="46" rx="2" fill="#c2410c"/><text x="290" y="443" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">12. Softeners are banned</text><text x="290" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">Mostly false</text><text x="620" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">From the alternatives</text><rect class="box" x="510" y="122" width="220" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="512" y="124" width="8" height="46" rx="2" fill="#dc2626"/><text x="530" y="143" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">13. Salt-free softens</text><text x="530" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">False</text><rect class="box" x="510" y="182" width="220" height="50" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="512" y="184" width="8" height="46" rx="2" fill="#dc2626"/><text x="530" y="203" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">14. Descalers match it</text><text x="530" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">False</text><rect class="box" x="510" y="242" width="220" height="50" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><rect x="512" y="244" width="8" height="46" rx="2" fill="#c2410c"/><text x="530" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">15. Potassium is green</text><text x="530" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">Mostly false</text><rect class="box" x="510" y="302" width="220" height="170" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="526" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Critical claims that are true</text><text x="526" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">All the salt reaches the</text><text x="526" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">environment. Regeneration</text><text x="526" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">uses water. Softened water</text><text x="526" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">is poor for lawns and gardens.</text><rect x="30" y="506" width="18" height="18" rx="3" fill="#dc2626"/><text x="56" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">False</text><rect x="125" y="506" width="18" height="18" rx="3" fill="#c2410c"/><text x="151" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Mostly false</text><rect x="269" y="506" width="18" height="18" rx="3" fill="#3a5a72"/><text x="295" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Partly true</text><rect x="406" y="506" width="18" height="18" rx="3" fill="#15803d"/><text x="432" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">True</text>
</svg>
