<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="edrw-title edrw-desc">
<title id="edrw-title">Electronic water descaler refund windows vs a kettle scale test</title>
<desc id="edrw-desc">Timeline comparing the money-back windows of the best electronic water descalers with a 42-day kettle scale test: ScaleBlaster's 90-day refund ends before its own 1 to 3+ month results timeline, Eddy listings offer 12 months, and HydroFLOW's user guide gives a warranty but no refund terms.</desc>
<defs><pattern id="edrw-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff7ed"/><line x1="0" y1="0" x2="0" y2="8" stroke="#fdba74" stroke-width="3"/></pattern></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Does the refund window outlast the test?</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Days from delivery. The kettle schedule is illustrative; the refund terms are the sellers' own.</text>
<text x="120" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Your kettle test</text>
<rect class="box" x="120" y="110" width="70" height="32" fill="#e2e8f0" stroke="#52697a" stroke-width="1"/>
<text x="155" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Baseline</text>
<rect class="box" x="190" y="110" width="70" height="32" fill="#dbeafe" stroke="#52697a" stroke-width="1"/>
<text x="225" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Settle</text>
<rect class="box" x="260" y="110" width="70" height="32" fill="#ecfeff" stroke="#0e7490" stroke-width="1"/>
<text x="295" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Treated</text>
<rect class="box" x="330" y="110" width="120" height="32" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="390" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Decide by day 42</text>
<text x="120" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">ScaleBlaster SB-75: 90-day money-back (maker's FAQ)</text>
<rect x="120" y="190" width="450" height="28" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="120" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">ScaleBlaster's own timeline for long-term results: 1 to 3+ months</text>
<rect x="270" y="260" width="450" height="28" fill="url(#edrw-hatch)" stroke="#c2410c" stroke-width="1.5"/>
<text x="120" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Eddy ED6002P-US: 12-month money-back (retail listing)</text>
<rect class="box" x="120" y="330" width="600" height="28" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="706" y="349" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#0b2f4a">continues to day 365</text>
<text x="120" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">HydroFLOW Pearl Plus: no refund terms in its user guide</text>
<rect class="box" x="120" y="400" width="600" height="28" fill="#f8fafc" stroke="#52697a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="134" y="419" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Warranty 1 + 4 years; a claim needs before-and-after proof</text>
<path class="ln" d="M120,465 L720,465" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<path class="ln" d="M120,459 L120,471 M190,459 L190,471 M260,459 L260,471 M330,459 L330,471 M420,459 L420,471 M570,459 L570,471 M720,459 L720,471" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="120" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="190" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">14</text>
<text x="260" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">28</text>
<text x="330" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">42</text>
<text x="420" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">60</text>
<text x="570" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">90</text>
<text x="720" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">120</text>
<text x="420" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Days from delivery (bars that reach the right edge continue beyond day 120)</text>
<text x="30" y="542" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Eddy terms as seen on retail listings in late September 2026. Confirm them on the listing you buy from.</text>
</svg>
