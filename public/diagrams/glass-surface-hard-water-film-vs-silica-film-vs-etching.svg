<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="gs-title gs-desc">
<title id="gs-title">Cloudy glasses: hard water film vs silica film vs etching</title>
<desc id="gs-desc">Cross-section diagram comparing cloudy glasses: hard water mineral film sits on the glass and comes off with vinegar, silica film is an iridescent warning stage, and etching is permanent roughening of the glass surface.</desc>
<defs><linearGradient id="gs-sil" x1="0" x2="1"><stop offset="0" stop-color="#d97706"/><stop offset="0.35" stop-color="#a855f7"/><stop offset="0.7" stop-color="#0ea5e9"/><stop offset="1" stop-color="#d97706"/></linearGradient><marker id="gs-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="gs-tmuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="440" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Cloudy glass: film on it, or damage to it?</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Three glass surfaces under magnification. Only the first comes off with acid.</text><text x="140" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803d">Hard water film</text><rect x="40" y="200" width="200" height="54" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><path d="M56,200 q17,-28 34,0 z" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/><path d="M104,200 q11,-20 22,0 z" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/><path d="M144,200 q20,-36 40,0 z" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/><path d="M198,200 q13,-24 26,0 z" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/><text x="140" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">glass</text><text x="140" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Mineral deposits sit on top,</text><text x="140" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">with visible edges</text><rect class="box" x="35" y="332" width="210" height="52" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="140" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Removable:</text><text x="140" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">vinegar clears it</text><text x="380" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">Silica film</text><rect x="280" y="200" width="200" height="54" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="280" y="193" width="200" height="7" fill="url(#gs-sil)"/><text x="380" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">glass</text><text x="380" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Thin amber, oil-slick</text><text x="380" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">sheen on the surface</text><rect class="box" x="275" y="332" width="210" height="52" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="380" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Warning stage:</text><text x="380" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">vinegar does nothing</text><text x="620" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">Etching</text><path d="M520,254 L520,200 L525,207 L530,200 L535,204 L540,200 L545,207 L550,200 L555,204 L560,200 L565,207 L570,200 L575,204 L580,200 L585,207 L590,200 L595,204 L600,200 L605,207 L610,200 L615,204 L620,200 L625,207 L630,200 L635,204 L640,200 L645,207 L650,200 L655,204 L660,200 L665,207 L670,200 L675,204 L680,200 L685,207 L690,200 L695,204 L700,200 L705,207 L710,200 L715,204 L720,200 L720,254 z" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M570,196 L570,176" fill="none" stroke="#52697a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gs-muted)"/><path class="ln" d="M620,196 L620,176" fill="none" stroke="#52697a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gs-muted)"/><path class="ln" d="M670,196 L670,176" fill="none" stroke="#52697a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gs-muted)"/><text x="620" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">metal ions leach out</text><text x="620" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">glass</text><text x="620" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">The surface itself is rough;</text><text x="620" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">metal ions stripped out</text><rect class="box" x="515" y="332" width="210" height="52" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="620" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Permanent:</text><text x="620" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">the damage is the glass</text><text x="380" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">The test: rub one patch with undiluted white vinegar for 30 seconds, rinse, dry, compare.</text>
</svg>
