<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="fvc-title fvc-desc">
<title id="fvc-title">Fleck vs Clack valve internals: seal and spacer stack vs one-piece spacer stack</title>
<desc id="fvc-desc">Side-by-side cutaway of the Fleck 5600SXT and Clack WS1 softener control valves. The Fleck uses a vertical piston running through five loose seals and four spacers, reached by lifting off the powerhead. The Clack uses a horizontal screw-driven piston in a one-piece spacer stack, reached by unscrewing the drive cap. Wear-part prices are shown for each.</desc>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Fleck vs Clack: what wears inside the valve</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Simplified cutaways. Part prices from the AFWFilters store, checked 2 October 2026.</text><rect x="30" y="84" width="340" height="490" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><rect x="390" y="84" width="340" height="490" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="50" y="114" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#0b2f4a">Fleck 5600SXT</text><text x="50" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Vertical piston, loose seals and spacers</text><text x="410" y="114" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#0b2f4a">Clack WS1</text><text x="410" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Horizontal piston, one-piece spacer stack</text><rect x="56" y="152" width="96" height="34" rx="5" fill="#0b2f4a"/><rect x="100" y="186" width="8" height="26" fill="#3a5a72"/><rect x="70" y="212" width="68" height="190" rx="4" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><rect x="84" y="222" width="40" height="8" rx="2" fill="#0b2f4a"/><rect x="86" y="230" width="36" height="30" rx="2" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1"/><rect x="84" y="260" width="40" height="8" rx="2" fill="#0b2f4a"/><rect x="86" y="268" width="36" height="30" rx="2" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1"/><rect x="84" y="298" width="40" height="8" rx="2" fill="#0b2f4a"/><rect x="86" y="306" width="36" height="30" rx="2" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1"/><rect x="84" y="336" width="40" height="8" rx="2" fill="#0b2f4a"/><rect x="86" y="344" width="36" height="30" rx="2" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1"/><rect x="84" y="374" width="40" height="8" rx="2" fill="#0b2f4a"/><rect x="100" y="212" width="8" height="170" fill="#52697a"/><path class="ln" d="M152,169 L176,169" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="184" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Powerhead lifts off</text><text x="184" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to reach the piston</text><path class="ln" d="M108,200 L176,214" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="184" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Piston, rod and yoke</text><text x="184" y="229" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">60102 piston about $89</text><path class="ln" d="M124,226 L176,262" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="184" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">5 seals (dark)</text><text x="184" y="279" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">4 spacers (grey), alternating</text><text x="184" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Kit 60125 about $49</text><path class="ln" d="M138,340 L176,340" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="184" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Valve body bore</text><text x="184" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">seals sit loose in the bore</text><text x="50" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Access: remove covers, lift off the</text><text x="50" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">powerhead, pull the piston up,</text><text x="50" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">then pull seals and spacers.</text><text x="50" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Full rebuild kit about $137</text><text x="50" y="531" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Brine piston 60032 about $22</text><text x="50" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Injector nozzle and throat about $19</text><rect x="408" y="200" width="44" height="64" rx="5" fill="#0b2f4a"/><rect x="452" y="192" width="262" height="80" rx="4" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><rect x="472" y="208" width="196" height="48" rx="6" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><rect x="490" y="214" width="14" height="36" rx="2" fill="#f8fafc" stroke="#3a5a72" stroke-width="1"/><rect x="522" y="214" width="14" height="36" rx="2" fill="#f8fafc" stroke="#3a5a72" stroke-width="1"/><rect x="554" y="214" width="14" height="36" rx="2" fill="#f8fafc" stroke="#3a5a72" stroke-width="1"/><rect x="586" y="214" width="14" height="36" rx="2" fill="#f8fafc" stroke="#3a5a72" stroke-width="1"/><rect x="618" y="214" width="14" height="36" rx="2" fill="#f8fafc" stroke="#3a5a72" stroke-width="1"/><rect x="650" y="214" width="14" height="36" rx="2" fill="#f8fafc" stroke="#3a5a72" stroke-width="1"/><rect x="452" y="228" width="226" height="8" fill="#52697a"/><rect x="678" y="222" width="24" height="20" rx="3" fill="#3a5a72"/><path class="ln" d="M430,200 L430,178" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="410" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Drive cap unscrews</text><text x="410" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hand or plastic wrench</text><path class="ln" d="M690,222 L690,178" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="712" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Main + brine</text><text x="712" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">pistons</text><path class="ln" d="M570,256 L570,292" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="570" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">One-piece spacer stack</text><text x="570" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">pulls out by hand</text><text x="570" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">V3005-02 about $39.99</text><text x="410" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Access: unplug, lift off the drive</text><text x="410" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bracket, unscrew the drive cap,</text><text x="410" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">pull pistons, then pull the stack.</text><text x="410" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Interior kit (stack + brine piston) $59</text><text x="410" y="531" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Circuit board V3108 about $139</text><text x="410" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Injector V3010 about $14</text><text x="30" y="592" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Fleck 5600SXT piston travels up and down; Clack WS1 piston is screw-driven sideways and counted optically.</text></svg>
