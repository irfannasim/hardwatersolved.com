<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="dod-title dod-desc">
<title id="dod-title">How much detergent with soft water: diagnosing overdose symptoms</title>
<desc id="dod-desc">Decision chain for soft water laundry, dishwasher and shower complaints: first confirm the water at the appliance is under 1 gpg, then halve the detergent dose for two weeks; if the symptom clears it was overdosing, otherwise check etching, iron, loading and old fabric residue.</desc>
<defs><marker id="dod-h" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="dod-s" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="dod-o" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="dod-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="640" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Soft water complaint? Check for detergent overdose first</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Most "soft water does not clean" symptoms trace back to a hard-water dose.</text><rect class="box" x="30" y="88" width="166" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="113" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Laundry dull or</text>
<text x="113" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">grey, feels coated</text><path class="ln" d="M113,162 L380,196" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="208" y="88" width="166" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="291" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Washer over-suds,</text>
<text x="291" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">extra rinses</text><path class="ln" d="M291,162 L380,196" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="386" y="88" width="166" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="469" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Film or cloudiness</text>
<text x="469" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">on glasses</text><path class="ln" d="M469,162 L380,196" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="564" y="88" width="166" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/><text x="647" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Skin or hair feels</text>
<text x="647" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">slick and coated</text><path class="ln" d="M647,162 L380,196" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="200" y="204" width="360" height="64" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.8"/><text x="380" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1. Is the water soft at that appliance?</text><text x="380" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Test the tap that feeds it: under 1 gpg?</text><path class="ln" d="M200,236 L120,236 L120,300" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dod-h)"/><text x="150" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">No</text><rect class="box" x="30" y="312" width="180" height="84" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/><text x="42" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hard water is still</text>
<text x="42" y="355" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">reaching it. Fix the</text>
<text x="42" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">softener, not the dose.</text><path class="ln" d="M380,268 L380,318" fill="none" stroke="#0e7490" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dod-s)"/><text x="396" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Yes</text><rect class="box" x="240" y="330" width="280" height="64" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.8"/><text x="380" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2. Halve the dose for two weeks</text><text x="380" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Change nothing else. Did it clear?</text><path class="ln" d="M520,362 L630,362 L630,418" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dod-o)"/><text x="572" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Yes</text><rect class="box" x="540" y="430" width="190" height="104" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.2"/><text x="552" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Overdose confirmed.</text>
<text x="552" y="473" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Keep the lower dose;</text>
<text x="552" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">try cutting a little</text>
<text x="552" y="511" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">further in a month.</text><path class="ln" d="M380,394 L380,444" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dod-m)"/><text x="396" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#52697a">No</text><rect class="box" x="200" y="456" width="320" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="214" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Look past the dose</text><text x="214" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Glass etching already done is permanent</text>
<text x="214" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Iron stains laundry; softening may not fix it</text>
<text x="214" y="542" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Overloaded drum or cold water too cold</text>
<text x="214" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Old residue in fabric: one strip wash</text>
<text x="214" y="582" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Film that vinegar removes is mineral</text><text x="30" y="628" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Order matters: confirm soft water first, then change one dose at a time.</text>
</svg>
