<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 672" width="760" height="672" role="img" aria-labelledby="wshf-title wshf-desc">
<title id="wshf-title">How to set hardness on a water softener: the number to enter</title>
<desc id="wshf-desc">Decision sequence for the water softener hardness setting: convert mg/L or ppm to grains per gallon, add the manual's iron allowance, use hardness after any neutralizer, take the highest known value, then enter it with the clock and regeneration time.</desc>
<defs><marker id="wshf-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="672" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Working out the hardness number to enter</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Five questions, in order. The answer to each changes the number you carry forward.</text><circle cx="50" cy="123" r="17" fill="#0e7490"/><text x="50" y="129" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><rect class="box" x="80" y="88" width="440" height="70" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="94" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Start with the raw hardness result</text><text x="94" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">From a lab report or a titration test</text><text x="94" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">of untreated water</text><rect class="box" x="536" y="100" width="194" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="633" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Example: 342 mg/L</text><path class="ln" d="M50,142 L50,180" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wshf-a)"/><circle cx="50" cy="219" r="17" fill="#0e7490"/><text x="50" y="225" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><rect class="box" x="80" y="184" width="440" height="70" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="94" y="206" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Is it in mg/L or ppm?</text><text x="94" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Divide by 17.1 to get grains per</text><text x="94" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">gallon (gpg)</text><rect class="box" x="536" y="196" width="194" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="633" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">342 / 17.1 = 20 gpg</text><path class="ln" d="M50,238 L50,276" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wshf-a)"/><circle cx="50" cy="315" r="17" fill="#0e7490"/><text x="50" y="321" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><rect class="box" x="80" y="280" width="440" height="70" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="94" y="302" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Is there dissolved (ferrous) iron?</text><text x="94" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Add the manual's allowance per ppm:</text><text x="94" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hellenbrand 3 gpg, A.O. Smith 5 gpg</text><rect class="box" x="536" y="292" width="194" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="633" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">20 + (1 ppm x 5) = 25</text><path class="ln" d="M50,334 L50,372" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wshf-a)"/><circle cx="50" cy="411" r="17" fill="#0e7490"/><text x="50" y="417" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><rect class="box" x="80" y="376" width="440" height="70" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="94" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Does an upstream stage add hardness?</text><text x="94" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">An acid neutralizer does. Use the</text><text x="94" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hardness measured after it</text><rect class="box" x="536" y="388" width="194" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="633" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Retest between stages</text><path class="ln" d="M50,430 L50,468" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wshf-a)"/><circle cx="50" cy="507" r="17" fill="#0e7490"/><text x="50" y="513" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><rect class="box" x="80" y="472" width="440" height="70" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="94" y="494" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Does the hardness vary?</text><text x="94" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Seasonal wells, blended city supply:</text><text x="94" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">use the highest result you have</text><rect class="box" x="536" y="484" width="194" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="633" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Highest known value</text><path class="ln" d="M50,526 L50,564" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wshf-a)"/><rect class="box" x="30" y="568" width="700" height="76" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="46" y="594" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">Enter the result as grains per gallon (compensated hardness)</text><text x="46" y="616" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Then check the clock and the regeneration time (often 2:00 a.m.), and the day override.</text><text x="46" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A wrong clock moves regeneration into the hours you are using water.</text>
</svg>
