<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="hsw-title hsw-desc">
<title id="hsw-title">Washing hair and skin with soft water: the first three weeks after installing a softener</title>
<desc id="hsw-desc">Timeline of the adjustment period after switching to soft water: days 1 to 3 while the water heater flushes, days 4 to 7 while old hard-water film clears from hair, week 2 when excess product is the problem, and week 3 onward once doses are settled.</desc>
<defs><marker id="hsw-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Washing hair and skin with soft water: the first three weeks</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same four stages for most households. Only the length of stage 1 depends on your tank.</text><path class="ln" d="M30,108 L730,108" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hsw-a)"/><circle cx="42" cy="108" r="8" fill="#c2410c"/><text x="30" y="138" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#c2410c">Days 1 to 3</text><text x="30" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">tank still flushing</text><circle cx="219" cy="108" r="8" fill="#c2410c"/><text x="207" y="138" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#c2410c">Days 4 to 7</text><text x="207" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">old coating on hair</text><circle cx="396" cy="108" r="8" fill="#0e7490"/><text x="384" y="138" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">Week 2</text><text x="384" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">film gone, dose too high</text><circle cx="573" cy="108" r="8" fill="#15803d"/><text x="561" y="138" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">Week 3 on</text><text x="561" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">settled</text><text x="30" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#3a5a72">What is happening</text><rect class="box" x="30" y="200" width="161" height="84" rx="10" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.2"/><text x="40" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hot water still part</text>
<text x="40" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">hard from the tank.</text>
<text x="40" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Cold tap already soft.</text><rect class="box" x="207" y="200" width="161" height="84" rx="10" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.2"/><text x="217" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hot water now soft.</text>
<text x="217" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hard-water film still</text>
<text x="217" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">on hair and scalp.</text><rect class="box" x="384" y="200" width="161" height="84" rx="10" fill="#ecfeff" stroke="#cbd5e1" stroke-width="1.2"/><text x="394" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Film washed off.</text>
<text x="394" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Now any extra</text>
<text x="394" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">product is the issue.</text><rect class="box" x="561" y="200" width="161" height="84" rx="10" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.2"/><text x="571" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water and hair both</text>
<text x="571" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">stable. Dose now</text>
<text x="571" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">matches soft water.</text><text x="30" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#3a5a72">What you notice</text><rect class="box" x="30" y="320" width="161" height="84" rx="10" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.2"/><text x="40" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lather varies</text>
<text x="40" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">shower to shower.</text>
<text x="40" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hair much the same.</text><rect class="box" x="207" y="320" width="161" height="84" rx="10" fill="#fff7ed" stroke="#cbd5e1" stroke-width="1.2"/><text x="217" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hair can feel waxy,</text>
<text x="217" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">heavy or odd. Skin</text>
<text x="217" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">feels slippery.</text><rect class="box" x="384" y="320" width="161" height="84" rx="10" fill="#ecfeff" stroke="#cbd5e1" stroke-width="1.2"/><text x="394" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hair limp, flat or</text>
<text x="394" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">greasy sooner. Too</text>
<text x="394" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">much lather to rinse.</text><rect class="box" x="561" y="320" width="161" height="84" rx="10" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.2"/><text x="571" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lighter hair, less</text>
<text x="571" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">residue, far less</text>
<text x="571" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">product used.</text><text x="30" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#3a5a72">What to do</text><rect class="box" x="30" y="440" width="161" height="84" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.2"/><text x="40" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Cut shampoo and</text>
<text x="40" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">body wash to half</text>
<text x="40" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">from the first shower.</text><rect class="box" x="207" y="440" width="161" height="84" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.2"/><text x="217" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Optional: one</text>
<text x="217" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">chelating wash to</text>
<text x="217" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">clear the old film.</text><rect class="box" x="384" y="440" width="161" height="84" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.2"/><text x="394" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Cut conditioner</text>
<text x="394" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">hardest. Keep it off</text>
<text x="394" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the roots.</text><rect class="box" x="561" y="440" width="161" height="84" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.2"/><text x="571" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Adjust in small</text>
<text x="571" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">steps. Retest if it</text>
<text x="571" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">changes suddenly.</text><text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Stage lengths are typical, not fixed. A large tank or low hot-water use stretches stage 1.</text>
</svg>
