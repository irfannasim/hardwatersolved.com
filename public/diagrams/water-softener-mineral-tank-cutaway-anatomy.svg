<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="mta-title mta-desc">
<title id="mta-title">Water softener mineral tank cutaway: parts from top to bottom</title>
<desc id="mta-desc">Cutaway of a water softener mineral tank showing the control valve on the neck, the top screen, the empty freeboard, the resin bed, the central distributor tube, the slotted bottom basket and an optional gravel underbed, with service flow down through the resin and up the tube.</desc>
<defs><pattern id="mta-b" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><marker id="mta-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="mta-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><pattern id="mta-g" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#e7e5e4"/><circle cx="4" cy="4" r="3" fill="#a8a29e"/><circle cx="10" cy="8" r="2.5" fill="#78716c"/></pattern></defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inside a water softener mineral tank, top to bottom</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Service flow shown: down through the resin, up the centre tube, out to the house.</text><rect x="280" y="156" width="160" height="404" rx="30" fill="#f4f9fb" stroke="#3a5a72" stroke-width="3"/><rect x="284" y="312" width="152" height="242" rx="24" fill="url(#mta-b)"/><rect x="320" y="512" width="80" height="42" rx="10" fill="url(#mta-g)" stroke="#52697a" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="354" y="140" width="12" height="380" fill="#94a3b8"/><rect x="338" y="516" width="44" height="28" rx="4" fill="#64748b"/><rect x="342" y="521" width="36" height="2.5" fill="#e2e8f0"/><rect x="342" y="527" width="36" height="2.5" fill="#e2e8f0"/><rect x="342" y="533" width="36" height="2.5" fill="#e2e8f0"/><rect x="342" y="539" width="36" height="2.5" fill="#e2e8f0"/><rect x="336" y="140" width="48" height="18" fill="#3a5a72"/><rect x="340" y="158" width="40" height="22" rx="3" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><rect x="344" y="162" width="3" height="14" fill="#3a5a72"/><rect x="351" y="162" width="3" height="14" fill="#3a5a72"/><rect x="358" y="162" width="3" height="14" fill="#3a5a72"/><rect x="365" y="162" width="3" height="14" fill="#3a5a72"/><rect x="372" y="162" width="3" height="14" fill="#3a5a72"/><rect class="box" x="250" y="90" width="220" height="50" rx="8" fill="#0b2f4a"/><text x="360" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE (not in tank)</text><path class="ln" d="M180,104 L244,104" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mta-h)"/><text x="180" y="94" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">IN</text><path class="ln" d="M476,104 L540,104" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mta-s)"/><text x="482" y="94" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">OUT to house</text><path class="ln" d="M306,322 L306,496" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mta-h)"/><path class="ln" d="M414,322 L414,496" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mta-h)"/><path class="ln" d="M360,510 L360,150" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mta-s)"/><path class="ln" d="M336,169 L262,169" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="254" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Top screen / upper basket</text><text x="254" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">last barrier before the drain</text><path class="ln" d="M296,236 L262,236" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="254" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Freeboard</text><text x="254" y="259" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">empty on purpose: room</text><text x="254" y="277" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">for the bed to lift in backwash</text><path class="ln" d="M296,400 L262,400" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="254" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Resin bed</text><text x="254" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">about 50–65% of the tank</text><path class="ln" d="M318,536 L262,536" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="254" y="541" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#52697a">Gravel underbed</text><text x="254" y="559" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">some tanks only</text><path class="ln" d="M386,149 L466,149" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="474" y="154" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Neck: 2-1/2 in, 8 threads per inch</text><path class="ln" d="M368,244 L466,244" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="474" y="249" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Distributor (riser) tube</text><text x="474" y="267" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sealed into the valve by an O-ring;</text><text x="474" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Clack: cut ½ in above to ½ in</text><text x="474" y="303" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">below the top of the tank thread</text><path class="ln" d="M384,530 L466,530" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="474" y="535" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Bottom basket</text><text x="474" y="553" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">slots pass water, hold</text><text x="474" y="571" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">back whole beads</text><text x="30" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Label size code = diameter x height in inches, e.g. 10 x 54.</text><rect x="470" y="592" width="26" height="6" rx="3" fill="#c2410c"/><text x="504" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard</text><rect x="560" y="592" width="26" height="6" rx="3" fill="#0e7490"/><text x="594" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened</text>
</svg>
