<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="760" height="446" role="img" aria-labelledby="bws-title bws-desc">
<title id="bws-title">Iron filter and water softener backwash schedule: clash vs staggered</title>
<desc id="bws-desc">Overnight backwash timeline: at the 2:00 a.m. factory default an iron filter and water softener regenerate together and can ask the well for 10 gpm or more; staggered, the iron filter runs at 1:00 and the softener at 3:00 on filtered water.</desc>
<defs></defs>
<rect width="760" height="446" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Backwash schedule: iron filter first, softener after</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Overnight timeline. Bar lengths are schematic; use each unit’s programmed cycle time.</text><text x="110" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">12 a.m.</text><path d="M110,106 L110,114" stroke="#94a3b8" stroke-width="1.5"/><text x="205" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1:00</text><path d="M205,106 L205,114" stroke="#94a3b8" stroke-width="1.5"/><text x="300" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2:00</text><path d="M300,106 L300,114" stroke="#94a3b8" stroke-width="1.5"/><text x="395" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3:00</text><path d="M395,106 L395,114" stroke="#94a3b8" stroke-width="1.5"/><text x="490" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4:00</text><path d="M490,106 L490,114" stroke="#94a3b8" stroke-width="1.5"/><text x="585" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5:00</text><path d="M585,106 L585,114" stroke="#94a3b8" stroke-width="1.5"/><text x="680" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6 a.m.</text><path d="M680,106 L680,114" stroke="#94a3b8" stroke-width="1.5"/><text x="30" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Factory defaults: both at 2:00 a.m.</text><rect class="box" x="300" y="146" width="85.5" height="26" rx="5" fill="#fde8d7" stroke="#dc2626" stroke-width="2"/><text x="342.75" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">iron filter</text><rect class="box" x="300" y="180" width="152" height="26" rx="5" fill="#dff3f6" stroke="#dc2626" stroke-width="2"/><text x="376" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text><rect class="box" x="478" y="124" width="252" height="92" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="492" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">12-inch Birm backwash: 7.9–9.4 gpm</text>
<text x="492" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">+ softener drain: ~2 gpm</text>
<text x="492" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">= 10 gpm or more from the well</text><text x="492" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Pump makes less? Both run weak.</text><text x="30" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Staggered: iron filter first</text><rect class="box" x="110" y="258" width="76" height="26" rx="5" fill="#f1f5f9" stroke="#52697a" stroke-width="2"/><text x="148" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">sediment</text><text x="194" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">(if a third unit)</text><rect class="box" x="205" y="292" width="85.5" height="26" rx="5" fill="#fde8d7" stroke="#b45309" stroke-width="2"/><text x="247.75" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">iron filter</text><rect class="box" x="395" y="326" width="152" height="26" rx="5" fill="#dff3f6" stroke="#0e7490" stroke-width="2"/><text x="471" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text><text x="555" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">on filtered water</text><path class="ln" d="M680,236 L680,356" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="30" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Start the softener after the iron filter has finished and the pressure tank has recovered.</text>
<text x="30" y="407" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Keep both clear of the first water use: a regeneration still running at 6:00 a.m. sends</text>
<text x="30" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">untreated water to the first shower.</text>
</svg>
