<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="dat-title dat-desc">
<title id="dat-title">Water softener drain air gap: three compliant and three non-compliant terminations</title>
<desc id="dat-desc">Water softener drain air gap terminations compared. Pass: tube clipped 2 inches above a standpipe, a listed air gap fitting on the standpipe, and a tube fixed above a laundry tub rim. Fail: tube pushed below the flood rim, tube clamped to a sink tailpiece, and tube lying at a floor drain grate.</desc>
