<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="dtf-title dtf-desc">
<title id="dtf-title">Water softener distributor tube flow: service, backwash and cracked tube</title>
<desc id="dtf-desc">Three water softener mineral tank panels: in service water flows down through the resin and up the distributor tube; in backwash it flows down the tube and up through the bed, which lifts into the freeboard; with a cracked tube water skips the resin and hard water and beads can reach the house.</desc>
<defs><pattern id="dtf-b" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><marker id="dtf-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="dtf-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="dtf-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="dtf-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Distributor tube flow: service, backwash and a cracked tube</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Same tank in each panel. Bed expansion is not drawn to scale.</text><rect class="box" x="30" y="84" width="220" height="486" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="140" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Service</text><rect x="85" y="160" width="110" height="280" rx="22" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2.5"/><rect x="88" y="300" width="104" height="136" rx="18" fill="url(#dtf-b)"/><rect x="135" y="146" width="10" height="270" fill="#94a3b8"/><rect x="124" y="410" width="32" height="18" rx="3" fill="#64748b"/><rect x="126" y="160" width="28" height="12" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.2"/><rect x="98" y="124" width="84" height="24" rx="5" fill="#0b2f4a"/><path class="ln" d="M108,310 L108,400" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-h)"/><path class="ln" d="M172,310 L172,400" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-h)"/><path class="ln" d="M140,404 L140,154" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-s)"/><path class="ln" d="M186,136 L232,136" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-s)"/><text x="240" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0e7490">house</text><text x="140" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Down through the resin,</text><text x="140" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">into the basket slots, up</text><text x="140" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">the tube to the house.</text><rect class="box" x="270" y="84" width="220" height="486" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Backwash</text><rect x="325" y="160" width="110" height="280" rx="22" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2.5"/><rect x="328" y="232" width="104" height="204" rx="18" fill="url(#dtf-b)"/><rect x="375" y="146" width="10" height="270" fill="#94a3b8"/><rect x="364" y="410" width="32" height="18" rx="3" fill="#64748b"/><rect x="366" y="160" width="28" height="12" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.2"/><rect x="338" y="124" width="84" height="24" rx="5" fill="#0b2f4a"/><path class="ln" d="M380,154 L380,400" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-h)"/><path class="ln" d="M348,412 L348,192" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-h)"/><path class="ln" d="M412,412 L412,192" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-h)"/><path class="ln" d="M334,136 L288,136" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-d)"/><text x="280" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#78716c">drain</text><path d="M320,300 L440,300" stroke="#52697a" stroke-width="1.5" stroke-dasharray="4 4"/><text x="480" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">settled</text><text x="380" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Down the tube, up through</text><text x="380" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">the bed: it lifts 50–70%</text><text x="380" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">into the freeboard. The top</text><text x="380" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">screen keeps beads in.</text><rect class="box" x="510" y="84" width="220" height="486" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="620" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">Cracked tube</text><rect x="565" y="160" width="110" height="280" rx="22" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2.5"/><rect x="568" y="300" width="104" height="136" rx="18" fill="url(#dtf-b)"/><rect x="615" y="146" width="10" height="270" fill="#94a3b8"/><rect x="604" y="410" width="32" height="18" rx="3" fill="#64748b"/><rect x="606" y="160" width="28" height="12" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.2"/><rect x="578" y="124" width="84" height="24" rx="5" fill="#0b2f4a"/><path d="M614,218 l12,6 l-12,6 l12,6" fill="none" stroke="#dc2626" stroke-width="3"/><path class="ln" d="M582,182 L608,222" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-f)"/><path class="ln" d="M620,214 L620,154" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-f)"/><path class="ln" d="M666,136 L712,136" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dtf-h)"/><text x="720" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#c2410c">hard</text><circle cx="620" cy="192" r="3.5" fill="#e2b865" stroke="#a37a2c"/><circle cx="620" cy="202" r="3.5" fill="#e2b865" stroke="#a37a2c"/><text x="636" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">crack</text><text x="620" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">A split tube or leaking</text><text x="620" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">O-ring lets water skip the</text><text x="620" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">resin: hard water. A bigger</text><text x="620" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">crack lets beads escape.</text><rect x="30" y="592" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water</text><rect x="180" y="592" width="26" height="6" rx="3" fill="#0e7490"/><text x="214" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened</text><rect x="320" y="592" width="26" height="6" rx="3" fill="#78716c"/><text x="354" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><rect x="460" y="592" width="26" height="6" rx="3" fill="#dc2626"/><text x="494" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bypass through a fault</text>
</svg>
