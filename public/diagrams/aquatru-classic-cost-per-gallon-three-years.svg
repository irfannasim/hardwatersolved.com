ze="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">2 gal a day</text><text x="30" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">family drinking water</text><rect x="230" y="324" width="98.7" height="28" fill="#0b2f4a"/><text x="338.6666666666667" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">$0.37</text><rect x="230" y="360" width="53.3" height="28" fill="#0e7490"/><text x="293.33333333333337" y="380" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">$0.20</text><path class="ln" d="M230,438 L630,438" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M230,438 L230,445" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="230" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">$0.00</text><path class="ln" d="M363.33333333333337,438 L363.33333333333337,445" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="363.33333333333337" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">$0.50</text><path class="ln" d="M496.6666666666667,438 L496.6666666666667,445" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="496.6666666666667" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">$1.00</text><path class="ln" d="M630,438 L630,445" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="630" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" 