<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="aqc-title aqc-desc">
<title id="aqc-title">AquaTru Classic cost per gallon over three years vs an under-sink RO</title>
<desc id="aqc-desc">Bar chart of three-year cost per gallon including purchase price: the AquaTru Classic costs about $1.40, $0.70 and $0.37 per gallon at 0.5, 1 and 2 gallons a day, against about $0.82, $0.41 and $0.20 for an under-sink tank RO priced like the iSpring RCC7AK.</desc>
<defs></defs>
<rect width="760" height="540" fill="#ffffff"/>
