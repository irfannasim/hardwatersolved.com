<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="wft-title wft-desc">
<title id="wft-title">Water softener financing: total paid for a $6,000 package by rate and term</title>
<desc id="wft-desc">Illustrative bar chart of the total paid for a $6,000 water softener package: $6,000 in cash, about $9,510 at 9.99% APR over 10 years, about $10,590 at 17.99% over 7 years, and about $11,610 at 14.99% over 10 years.</desc>
<defs></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Total paid for a $6,000 package (illustrative)</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Same equipment, four ways to pay. Monthly payment shown in each label.</text>
<text x="30" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Cash</text>
<rect x="220" y="108" width="210" height="36" rx="0" fill="#15803d"/>
<text x="440" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$6,000</text>
<text x="30" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">9.99% APR, 10 years</text>
<text x="30" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">about $79 a month</text>
<rect x="220" y="186" width="332.85" height="36" rx="0" fill="#3a5a72"/>
<text x="562.85" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$9,510</text>
<text x="30" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">17.99% APR, 7 years</text>
<text x="30" y="301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">about $126 a month</text>
<rect x="220" y="264" width="370.65" height="36" rx="0" fill="#3a5a72"/>
<text x="600.65" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$10,590</text>
<text x="30" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">14.99% APR, 10 years</text>
<text x="30" y="379" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">about $97 a month</text>
<rect x="220" y="342" width="406.35" height="36" rx="0" fill="#dc2626"/>
<text x="636.35" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">$11,610</text>
<path d="M430,96 L430,414" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
<text x="430" y="434" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">cash price</text>
<text x="30" y="458" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">Standard amortized loans; promotions, fees and deferred interest change the totals.</text>
</svg>
