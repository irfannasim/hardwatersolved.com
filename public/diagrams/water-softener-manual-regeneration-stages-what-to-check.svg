<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 644" width="760" height="644" role="img" aria-labelledby="mrg-title mrg-desc">
<title id="mrg-title">Water softener manual regeneration stages and what to check</title>
<desc id="mrg-desc">Four stages of a manual water softener regeneration drawn on the same softener: backwash with strong flow to the drain, brine draw with the brine tank level falling below a baseline mark, rinse with the drain water running clear, and refill with water flowing back into the brine tank.</desc>
<defs><pattern id="mrg-b" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><marker id="mrg-br" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="mrg-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="mrg-dr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="644" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Manual regeneration: what to watch at each stage</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Same softener in every row. Only the active line changes; the check is on the right.</text><rect class="box" x="30" y="86" width="700" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><rect x="110" y="120" width="50" height="72" rx="10" fill="url(#mrg-b)" stroke="#3a5a72" stroke-width="2"/><rect x="190" y="140" width="50" height="52" fill="#ffffff"/><rect x="190" y="158" width="50" height="34" fill="#dbeafe"/><rect x="190" y="140" width="50" height="52" rx="4" fill="none" stroke="#3a5a72" stroke-width="2"/><path class="ln" d="M215,140 L215,108 L172,108" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M98,108 L52,108 L52,170" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrg-dr)"/><path d="M42,180 L62,180 L57,188 L47,188 z" fill="#78716c"/><rect x="100" y="98" width="70" height="22" rx="5" fill="#0b2f4a"/><path class="ln" d="M135,182 L135,134" fill="none" stroke="#0b2f4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrg-ink)"/><circle cx="292" cy="112" r="13" fill="#0b2f4a"/><text x="292" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="314" y="117" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Backwash: read the drain</text><text x="280" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Strong, steady drain flow within a minute.</text><text x="280" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fleck: steady for 10 minutes or until it runs clear.</text><text x="280" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Nothing at all: valve did not move, or the drain is blocked.</text><rect class="box" x="30" y="210" width="700" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><rect x="110" y="244" width="50" height="72" rx="10" fill="url(#mrg-b)" stroke="#3a5a72" stroke-width="2"/><rect x="190" y="264" width="50" height="52" fill="#ffffff"/><rect x="190" y="304" width="50" height="12" fill="#dbeafe"/><rect x="190" y="264" width="50" height="52" rx="4" fill="none" stroke="#3a5a72" stroke-width="2"/><path class="ln" d="M215,300 L215,232 L172,232" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrg-br)"/><path class="ln" d="M98,232 L52,232 L52,294" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrg-dr)"/><path d="M42,304 L62,304 L57,312 L47,312 z" fill="#78716c"/><rect x="100" y="222" width="70" height="22" rx="5" fill="#0b2f4a"/><path d="M184,282 L246,282" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><circle cx="292" cy="236" r="13" fill="#0b2f4a"/><text x="292" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="314" y="241" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine draw: measure the level drop</text><text x="280" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Mark the level, then check again at 10 and 20 minutes.</text><text x="280" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Normal: falls steadily, then stops near the bottom.</text><text x="280" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Does not move at all: no brine was drawn.</text><rect class="box" x="30" y="334" width="700" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><rect x="110" y="368" width="50" height="72" rx="10" fill="url(#mrg-b)" stroke="#3a5a72" stroke-width="2"/><rect x="190" y="388" width="50" height="52" fill="#ffffff"/><rect x="190" y="428" width="50" height="12" fill="#dbeafe"/><rect x="190" y="388" width="50" height="52" rx="4" fill="none" stroke="#3a5a72" stroke-width="2"/><path class="ln" d="M215,388 L215,356 L172,356" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M98,356 L52,356 L52,418" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrg-dr)"/><path d="M42,428 L62,428 L57,436 L47,436 z" fill="#78716c"/><rect x="100" y="346" width="70" height="22" rx="5" fill="#0b2f4a"/><circle cx="292" cy="360" r="13" fill="#0b2f4a"/><text x="292" y="365" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="314" y="365" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Rinse: clarity, then taste</text><text x="280" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drain water should run clear.</text><text x="280" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fleck rapid rinse: 5 minutes or until it runs clear.</text><text x="280" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Afterwards a glass from a cold tap should not taste salty.</text><rect class="box" x="30" y="458" width="700" height="114" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><rect x="110" y="492" width="50" height="72" rx="10" fill="url(#mrg-b)" stroke="#3a5a72" stroke-width="2"/><rect x="190" y="512" width="50" height="52" fill="#ffffff"/><rect x="190" y="530" width="50" height="34" fill="#dbeafe"/><rect x="190" y="512" width="50" height="52" rx="4" fill="none" stroke="#3a5a72" stroke-width="2"/><path class="ln" d="M172,480 L215,480 L215,520" fill="none" stroke="#0b2f4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mrg-ink)"/><path class="ln" d="M98,480 L52,480 L52,542" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M42,552 L62,552 L57,560 L47,560 z" fill="#78716c"/><rect x="100" y="470" width="70" height="22" rx="5" fill="#0b2f4a"/><circle cx="292" cy="484" r="13" fill="#0b2f4a"/><text x="292" y="489" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="314" y="489" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Refill: water back into the brine tank</text><text x="280" y="514" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water should visibly flow into the brine tank.</text><text x="280" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The level returns close to where it usually sits.</text><text x="280" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Salt level: compare with your tape mark in two weeks.</text><text x="30" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Clack downflow runs backwash, regenerate, backwash, rinse, fill. Autotrol refills during part of the fast rinse.</text><rect x="30" y="618" width="26" height="6" rx="3" fill="#0b2f4a"/><text x="64" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water flow</text><rect x="170" y="618" width="26" height="6" rx="3" fill="#7c3aed"/><text x="204" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine</text><rect x="290" y="618" width="26" height="6" rx="3" fill="#78716c"/><text x="324" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><path d="M430,621 L456,621" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><text x="464" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">baseline mark</text><rect x="600" y="618" width="26" height="6" rx="3" fill="#cbd5e1"/><text x="634" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">idle</text>
</svg>
