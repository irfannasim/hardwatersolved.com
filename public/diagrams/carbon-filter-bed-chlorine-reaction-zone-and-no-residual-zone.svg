<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="cbz-title cbz-desc">
<title id="cbz-title">Carbon filter bed: chlorine reaction zone and no-residual zone</title>
<desc id="cbz-desc">Cutaway of a whole-house carbon filter before a water softener showing free chlorine used up in the top reaction zone and a lower zone with no disinfectant residual, where still water in an oversized bed can grow bacteria.</desc>
<defs><marker id="cbz-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inside a carbon bed: where the chlorine goes</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Free chlorine is used up near the top. The water below it has no residual left.</text><rect x="110" y="120" width="150" height="330" rx="40" fill="#f8fafc" stroke="#3a5a72" stroke-width="2.5"/><pattern id="cbz-carb" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#475569"/><circle cx="3" cy="3" r="2" fill="#334155"/><circle cx="8" cy="7" r="2" fill="#1e293b"/></pattern><rect x="113" y="170" width="144" height="260" fill="url(#cbz-carb)"/><rect x="113" y="170" width="144" height="62" fill="#dbeafe"/><rect x="113" y="170" width="144" height="62" fill="url(#cbz-carb)" opacity="0.45"/><path class="ln" d="M185,94 L185,154" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cbz-ah)"/><text x="199" y="110" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">chlorinated city water in</text><path class="ln" d="M260,420 L310,420" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cbz-ah)"/><text x="268" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">to the softener,</text><text x="268" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">no chlorine left</text><path class="ln" d="M102,200 L86,200" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#0b2f4a">Reaction</text><text x="80" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#0b2f4a">zone</text><path class="ln" d="M102,330 L86,330" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">No</text><text x="80" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">residual</text><text x="80" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">zone</text><path d="M430,170 L430,430" stroke="#0b2f4a" stroke-width="1.5"/><path d="M430,170 L700,170" stroke="#e2e8f0" stroke-width="1"/><text x="430" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Chlorine left in the water</text><text x="430" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">high at the top, zero below</text><text x="422" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">top</text><text x="422" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">bottom</text><path d="M680,170 L629.2,175 L588.7,180 L556.4,185 L530.7,190 L510.2,195 L493.9,200 L480.9,205 L470.6,210 L462.3,215 L455.8,220 L450.5,225 L446.3,230 L443,235 L440.4,240 L438.3,245 L436.6,250 L435.2,255 L434.2,260 L433.3,265 L432.7,270 L432.1,275 L431.7,280 L431.3,285 L431.1,290 L430.9,295 L430.7,300 L430.5,305 L430.4,310 L430.3,315 L430.3,320 L430.2,325 L430.2,330 L430.1,335 L430.1,340 L430.1,345 L430.1,350 L430.1,355 L430,360 L430,365 L430,370 L430,375 L430,380 L430,385 L430,390 L430,395 L430,400 L430,405 L430,410 L430,415 L430,420 L430,425 L430,430" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="250" width="268" height="180" fill="#fef2f2"/><path d="M436.6,250 L435.2,255 L434.2,260 L433.3,265 L432.7,270 L432.1,275 L431.7,280 L431.3,285 L431.1,290 L430.9,295 L430.7,300 L430.5,305 L430.4,310 L430.3,315 L430.3,320 L430.2,325 L430.2,330 L430.1,335 L430.1,340 L430.1,345 L430.1,350 L430.1,355 L430,360 L430,365 L430,370 L430,375 L430,380 L430,385 L430,390 L430,395 L430,400 L430,405 L430,410 L430,415 L430,420 L430,425 L430,430" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="454" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">No disinfectant here.</text><text x="454" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water that sits still in this</text><text x="454" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">part of the bed can grow</text><text x="454" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">bacteria. A bigger bed and</text><text x="454" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">lower use mean more of it.</text><text x="30" y="496" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Backwash on schedule, run water through after days away, and do not oversize the bed.</text><text x="30" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Schematic: the depth of the reaction zone changes with flow, temperature and media age.</text>
</svg>
