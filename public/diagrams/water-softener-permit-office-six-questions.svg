<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 670" width="760" height="670" role="img" aria-labelledby="wspc-title wspc-desc">
<title id="wspc-title">Water softener permit: six questions to ask the permit office</title>
<desc id="wspc-desc">Six questions that settle whether a water softener permit is required at your address: jurisdiction, new versus replacement, who may pull the permit, what the inspector checks, any electrical permit, and how the record is kept.</desc>
<defs><marker id="wspc-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="670" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">The one phone call: six questions, in this order</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Call the permit or building office for your address. Write down each answer.</text><circle cx="50" cy="119" r="17" fill="#0e7490"/><text x="50" y="125" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><rect class="box" x="80" y="88" width="650" height="62" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="96" y="113" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Is my address under your plumbing jurisdiction?</text><text x="96" y="135" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">If not, ask who issues plumbing permits here: county or state</text><path class="ln" d="M50,138 L50,179" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wspc-a)"/><circle cx="50" cy="201" r="17" fill="#0e7490"/><text x="50" y="207" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><rect class="box" x="80" y="170" width="650" height="62" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="96" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Does installing a softener need a plumbing permit?</text><text x="96" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Ask about a new install and a like-for-like replacement</text><path class="ln" d="M50,220 L50,261" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wspc-a)"/><circle cx="50" cy="283" r="17" fill="#0e7490"/><text x="50" y="289" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><rect class="box" x="80" y="252" width="650" height="62" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="96" y="277" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Can I pull it as the homeowner?</text><text x="96" y="299" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Or must a licensed plumber or water conditioning installer?</text><path class="ln" d="M50,302 L50,343" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wspc-a)"/><circle cx="50" cy="365" r="17" fill="#0e7490"/><text x="50" y="371" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><rect class="box" x="80" y="334" width="650" height="62" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="96" y="359" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">What will the inspector check?</text><text x="96" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Drain, air gap, overflow, backflow, bonding jumper</text><path class="ln" d="M50,384 L50,425" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wspc-a)"/><circle cx="50" cy="447" r="17" fill="#0e7490"/><text x="50" y="453" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><rect class="box" x="80" y="416" width="650" height="62" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="96" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Is an electrical permit needed too?</text><text x="96" y="463" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">For a new outlet, or for the bonding jumper</text><path class="ln" d="M50,466 L50,507" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wspc-a)"/><circle cx="50" cy="529" r="17" fill="#0e7490"/><text x="50" y="535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><rect class="box" x="80" y="498" width="650" height="62" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="96" y="523" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">What is the fee, and how is the record kept?</text><text x="96" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">The record is what a future buyer can look up</text><rect class="box" x="30" y="584" width="700" height="60" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="46" y="608" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Log it: office name, the person you spoke to, the date and each answer.</text><text x="46" y="630" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">If the answer is "no permit needed", that note is your record.</text>
</svg>
