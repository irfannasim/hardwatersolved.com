<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="rk-title rk-desc">
<title id="rk-title">iSpring RCC7AK six-stage reverse osmosis water path</title>
<desc id="rk-desc">Flow through the iSpring RCC7AK: sediment, GAC carbon and CTO carbon block prefilters feed the RO membrane, which sends reject water to drain and treated water to a 3.2 gallon tank, then through a post carbon and an alkaline filter to the RO faucet.</desc>
<defs><marker id="rk-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="rk-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="rk-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="480" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">iSpring RCC7AK: where water goes through the six stages</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Stages from the RCC series manual. The tank sits between the membrane and the last two stages.</text><text x="30" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">Cold</text><text x="30" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">feed</text><path class="ln" d="M66,136 L94,136" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-h)"/><rect class="box" x="100" y="100" width="130" height="72" rx="6" fill="#fff7ed" stroke="#3a5a72" stroke-width="1.5"/><text x="110" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">1  Sediment</text><text x="110" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">polypropylene</text><text x="110" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sand, rust, silt</text><rect class="box" x="262" y="100" width="130" height="72" rx="6" fill="#fff7ed" stroke="#3a5a72" stroke-width="1.5"/><text x="272" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">2  GAC carbon</text><text x="272" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">chlorine, taste,</text><text x="272" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">odor</text><rect class="box" x="424" y="100" width="130" height="72" rx="6" fill="#fff7ed" stroke="#3a5a72" stroke-width="1.5"/><text x="434" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">3  CTO carbon</text><text x="434" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">carbon block</text><text x="434" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">polishing</text><rect class="box" x="586" y="100" width="130" height="72" rx="6" fill="#ecfeff" stroke="#0b2f4a" stroke-width="1.5"/><text x="596" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">4  RO membrane</text><text x="596" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">dissolved solids,</text><text x="596" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">lead, fluoride</text><path class="ln" d="M230,136 L256,136" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-h)"/><path class="ln" d="M392,136 L418,136" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-h)"/><path class="ln" d="M554,136 L580,136" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-h)"/><path class="ln" d="M626,172 L626,208" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-d)"/><rect class="box" x="546" y="214" width="168" height="48" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5"/><text x="558" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#78716c">Reject water to drain</text><text x="558" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#78716c">ratio not published</text><path class="ln" d="M716,136 L738,136 L738,366 L722,366" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-s)"/><rect class="box" x="586" y="330" width="130" height="72" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="596" y="354" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Storage tank</text><text x="596" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">3.2 gal capacity,</text><text x="596" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">pressurized</text><rect class="box" x="424" y="330" width="130" height="72" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="434" y="354" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">5  Post carbon</text><text x="434" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">taste from</text><text x="434" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the tank</text><rect class="box" x="262" y="330" width="130" height="72" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="272" y="354" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">6  Alkaline</text><text x="272" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">adds 30-60 mg/L</text><text x="272" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">of Ca and Mg</text><rect class="box" x="100" y="330" width="130" height="72" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="110" y="354" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">RO faucet</text><text x="110" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">separate tap</text><text x="110" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">on the sink</text><path class="ln" d="M586,366 L560,366" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-s)"/><path class="ln" d="M424,366 L398,366" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-s)"/><path class="ln" d="M262,366 L236,366" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rk-s)"/><path class="ln" d="M30,450 L70,450" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated feed</text><path class="ln" d="M230,450 L270,450" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">RO water</text><path class="ln" d="M400,450 L440,450" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text>
</svg>
