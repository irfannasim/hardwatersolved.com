<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="rws-title rws-desc">
<title id="rws-title">Water softener regeneration water use by stage and salt setting</title>
<desc id="rws-desc">Calculated stacked bars for a 1.5 cubic foot water softener: one regeneration uses about 56 gallons at an economy salt setting, 85 at a standard setting and 105 at a high setting, most of it in backwash and the brine draw and slow rinse stage.</desc>
<defs></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water used in one regeneration, stage by stage</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Calculated for a 1.5 cu ft softener in a 10-inch tank: 2.5 gpm backwash and fast rinse,</text>
<text x="30" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">0.5 gpm assumed injector flow, Clack WS1 downflow cycle times, refill at 3 lb salt per gallon</text>
<text x="30" y="138" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Economy</text>
<text x="30" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">under 7.5 lb/cu ft</text>
<text x="30" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">9 lb salt</text>
<rect x="230.0" y="120" width="61.5" height="44" fill="#78716c" stroke="#ffffff" stroke-width="1"/>
<text x="260.8" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">15</text>
<rect x="291.5" y="120" width="92.2" height="44" fill="#7c3aed" stroke="#ffffff" stroke-width="1"/>
<text x="337.6" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">22.5</text>
<rect x="383.8" y="120" width="30.7" height="44" fill="#78716c" stroke="#ffffff" stroke-width="1"/>
<rect x="414.5" y="120" width="30.7" height="44" fill="#a8a29e" stroke="#ffffff" stroke-width="1"/>
<rect x="445.3" y="120" width="12.3" height="44" fill="#60a5fa" stroke="#ffffff" stroke-width="1"/>
<text x="467.6" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">56 gal</text>
<text x="230" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">1.8 gal per 1,000 grains</text>
<text x="30" y="233" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Standard</text>
<text x="30" y="251" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">7.5 to 12 lb/cu ft</text>
<text x="30" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">13.5 lb salt</text>
<rect x="230.0" y="215" width="82.0" height="44" fill="#78716c" stroke="#ffffff" stroke-width="1"/>
<text x="271.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">20</text>
<rect x="312.0" y="215" width="123.0" height="44" fill="#7c3aed" stroke="#ffffff" stroke-width="1"/>
<text x="373.5" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">30</text>
<rect x="435.0" y="215" width="82.0" height="44" fill="#78716c" stroke="#ffffff" stroke-width="1"/>
<text x="476.0" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">20</text>
<rect x="517.0" y="215" width="41.0" height="44" fill="#a8a29e" stroke="#ffffff" stroke-width="1"/>
<rect x="558.0" y="215" width="18.4" height="44" fill="#60a5fa" stroke="#ffffff" stroke-width="1"/>
<text x="586.5" y="237" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">85 gal</text>
<text x="230" y="279" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">2.2 gal per 1,000 grains</text>
<text x="30" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">High</text>
<text x="30" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">over 12 lb/cu ft</text>
<text x="30" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">22.5 lb salt</text>
<rect x="230.0" y="310" width="82.0" height="44" fill="#78716c" stroke="#ffffff" stroke-width="1"/>
<text x="271.0" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">20</text>
<rect x="312.0" y="310" width="153.8" height="44" fill="#7c3aed" stroke="#ffffff" stroke-width="1"/>
<text x="388.9" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">37.5</text>
<rect x="465.8" y="310" width="102.5" height="44" fill="#78716c" stroke="#ffffff" stroke-width="1"/>
<text x="517.0" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">25</text>
<rect x="568.3" y="310" width="61.5" height="44" fill="#a8a29e" stroke="#ffffff" stroke-width="1"/>
<text x="599.0" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">15</text>
<rect x="629.8" y="310" width="30.7" height="44" fill="#60a5fa" stroke="#ffffff" stroke-width="1"/>
<text x="670.5" y="332" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">105 gal</text>
<text x="230" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">2.3 gal per 1,000 grains</text>
<rect x="30" y="410" width="16" height="16" fill="#78716c"/>
<text x="52" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Backwash (twice)</text>
<rect x="192" y="410" width="16" height="16" fill="#7c3aed"/>
<text x="214" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Brine draw + slow rinse</text>
<rect x="403" y="410" width="16" height="16" fill="#a8a29e"/>
<text x="425" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fast rinse</text>
<rect x="523" y="410" width="16" height="16" fill="#60a5fa"/>
<text x="545" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Brine refill</text>
<text x="30" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">All of it goes to the drain except the refill, which becomes the next brine. Numbers in bars are gallons.</text>
</svg>
