<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 758" width="760" height="758" role="img" aria-labelledby="wssp-title wssp-desc">
<title id="wssp-title">Water softener startup procedure: six commissioning steps in order</title>
<desc id="wssp-desc">Water softener startup procedure shown as one commissioning sequence: slow fill and air purge in backwash, fines flush, leak test under full pressure, a full manual regeneration, then a soft water test, with the reason each step comes before the next.</desc>
<defs><marker id="wssp-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="758" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water softener startup procedure: one sequence</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Each step makes the next one safe. Do not reorder them.</text><text x="92" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Step, valve position and finish line</text><text x="500" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Why it comes before the next step</text><circle cx="52" cy="149" r="20" fill="#0e7490"/><text x="52" y="155" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><rect class="box" x="86" y="112" width="400" height="74" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="100" y="136" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Slow fill</text><text x="100" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Valve held in BACKWASH, inlet barely open</text><text x="100" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Done when: water reaches the drain line</text><rect class="box" x="500" y="112" width="230" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="514" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Air leaves before any</text><text x="514" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">pressure builds</text><path class="ln" d="M52,171 L52,211" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wssp-a)"/><circle cx="52" cy="241" r="20" fill="#0e7490"/><text x="52" y="247" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><rect class="box" x="86" y="204" width="400" height="74" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="100" y="228" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Air purge</text><text x="100" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Still BACKWASH, inlet barely open</text><text x="100" y="267" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Done when: drain flow is steady, no sputter</text><rect class="box" x="500" y="204" width="230" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="514" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A bed full of air cannot be</text><text x="514" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">leak tested</text><path class="ln" d="M52,263 L52,303" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wssp-a)"/><circle cx="52" cy="333" r="20" fill="#0e7490"/><text x="52" y="339" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><rect class="box" x="86" y="296" width="400" height="74" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="100" y="320" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Fines flush</text><text x="100" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">BACKWASH, inlet opened slowly to full</text><text x="100" y="359" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Done when: drain water runs clear</text><rect class="box" x="500" y="296" width="230" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="514" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fines and color go to drain,</text><text x="514" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">not taps</text><path class="ln" d="M52,355 L52,395" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wssp-a)"/><circle cx="52" cy="425" r="20" fill="#0e7490"/><text x="52" y="431" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><rect class="box" x="86" y="388" width="400" height="74" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="100" y="412" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Leak test</text><text x="100" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">SERVICE, outlet open, full line pressure</text><text x="100" y="451" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Done when: every joint dry, then taps purged</text><rect class="box" x="500" y="388" width="230" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="514" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Joints proven while you are</text><text x="514" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">watching</text><path class="ln" d="M52,447 L52,487" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wssp-a)"/><circle cx="52" cy="517" r="20" fill="#0e7490"/><text x="52" y="523" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><rect class="box" x="86" y="480" width="400" height="74" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="100" y="504" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Full manual cycle</text><text x="100" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Salt added, regeneration started by hand</text><text x="100" y="543" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Done when: brine drawn and tank refilled</text><rect class="box" x="500" y="480" width="230" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="514" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Proves brine draw, refill</text><text x="514" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and drain flow</text><path class="ln" d="M52,539 L52,579" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wssp-a)"/><circle cx="52" cy="609" r="20" fill="#15803d"/><text x="52" y="615" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><rect class="box" x="86" y="572" width="400" height="74" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="100" y="596" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#15803d">Verify soft water</text><text x="100" y="616" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Back in SERVICE after the cycle</text><text x="100" y="635" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Done when: cold tap tests soft</text><rect class="box" x="500" y="572" width="230" height="74" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="514" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Only now is the install</text><text x="514" y="622" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">finished</text><rect class="box" x="30" y="670" width="700" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="46" y="694" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Skipping step 1 is the common first-day failure:</text><text x="46" y="715" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">full pressure into an empty tank lifts the resin and can push beads out the drain.</text>
</svg>
