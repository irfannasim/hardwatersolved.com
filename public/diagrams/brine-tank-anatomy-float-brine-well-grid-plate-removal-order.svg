<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 582" width="760" height="582" role="img" aria-labelledby="bta-title bta-desc">
<title id="bta-title">Brine tank anatomy: brine well, safety float and grid plate in removal order</title>
<desc id="bta-desc">Cross-section of a water softener brine tank showing salt, water, sludge, the brine well with its base openings, the safety float on its rod, the grid plate and the brine line, numbered in the safe order to remove them when cleaning: salt, water, float, brine well, grid plate.</desc>
<defs><pattern id="bta-s" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f1f5f9"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#b6c2d1"/></pattern><pattern id="bta-sw" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#dbeafe"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#a5b4c8"/></pattern></defs>
<rect width="760" height="582" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inside a brine tank: take it apart from the top down</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Salt out, then water, then the parts. The three fragile parts are in red.</text><rect x="170" y="250" width="260" height="182" fill="url(#bta-s)"/><rect x="170" y="400" width="260" height="32" fill="url(#bta-sw)"/><rect x="170" y="432" width="260" height="16" fill="#8b7d6b"/><text x="340" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">sludge</text><rect x="170" y="454" width="260" height="26" fill="#dbeafe"/><rect x="226" y="448" width="204" height="6" fill="#3a5a72"/><rect x="236" y="449" width="6" height="4" fill="#dbeafe"/><rect x="252" y="449" width="6" height="4" fill="#dbeafe"/><rect x="268" y="449" width="6" height="4" fill="#dbeafe"/><rect x="284" y="449" width="6" height="4" fill="#dbeafe"/><rect x="300" y="449" width="6" height="4" fill="#dbeafe"/><rect x="316" y="449" width="6" height="4" fill="#dbeafe"/><rect x="332" y="449" width="6" height="4" fill="#dbeafe"/><rect x="348" y="449" width="6" height="4" fill="#dbeafe"/><rect x="364" y="449" width="6" height="4" fill="#dbeafe"/><rect x="380" y="449" width="6" height="4" fill="#dbeafe"/><rect x="396" y="449" width="6" height="4" fill="#dbeafe"/><rect x="412" y="449" width="6" height="4" fill="#dbeafe"/><rect x="190" y="108" width="36" height="372" fill="#eef2f6" stroke="#94a3b8" stroke-width="2"/><rect x="196" y="458" width="24" height="3" fill="#0b2f4a"/><rect x="196" y="465" width="24" height="3" fill="#0b2f4a"/><rect x="196" y="472" width="24" height="3" fill="#0b2f4a"/><path d="M208,112 L208,362" stroke="#3a5a72" stroke-width="2.5"/><rect x="196" y="362" width="24" height="30" rx="5" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><path class="ln" d="M208,108 L208,100 L40,100" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#7c3aed">brine line to the control valve</text><rect x="170" y="130" width="260" height="350" rx="6" fill="none" stroke="#3a5a72" stroke-width="3"/><path class="ln" d="M188,230 L150,230" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">brine well</text><path class="ln" d="M188,377 L150,377" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">safety float</text><path class="ln" d="M188,466 L150,466" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="142" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">base openings:</text><text x="142" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">must be clear</text><circle cx="330" cy="300" r="13" fill="#0b2f4a"/><text x="330" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="390" cy="416" r="13" fill="#0b2f4a"/><text x="390" y="421" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="208" cy="330" r="13" fill="#dc2626"/><text x="208" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="208" cy="200" r="13" fill="#dc2626"/><text x="208" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><circle cx="300" cy="466" r="13" fill="#dc2626"/><text x="300" y="471" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><circle cx="482" cy="149" r="13" fill="#0b2f4a"/><text x="482" y="154" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="504" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Salt</text><text x="504" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Scoop usable salt into a</text><text x="504" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">clean, covered bucket</text><circle cx="482" cy="209" r="13" fill="#0b2f4a"/><text x="482" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="504" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water</text><text x="504" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Wet vac or bail 2–5 gallons.</text><text x="504" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Never tip the tank</text><circle cx="482" cy="269" r="13" fill="#dc2626"/><text x="482" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="504" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Safety float</text><text x="504" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lift by the float body,</text><text x="504" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">not by the rod</text><circle cx="482" cy="329" r="13" fill="#dc2626"/><text x="482" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="504" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Brine well</text><text x="504" y="353" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lift straight up, never twist.</text><text x="504" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Some are clipped at the base</text><circle cx="482" cy="389" r="13" fill="#dc2626"/><text x="482" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="504" y="394" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Grid plate</text><text x="504" y="413" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lift it flat. Warm water,</text><text x="504" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">not a screwdriver</text><text x="470" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Then scrape the sludge, wash,</text><text x="470" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">rinse and hold the well to the light.</text><text x="318" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">grid plate (some models) on the floor</text><text x="318" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tank: thin polyethylene, never stand on it</text><rect x="30" y="550" width="26" height="14" fill="url(#bta-s)" stroke="#94a3b8" stroke-width="1"/><text x="64" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">salt</text><rect x="130" y="550" width="26" height="14" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><text x="164" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water</text><rect x="240" y="550" width="26" height="14" fill="#8b7d6b"/><text x="274" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sludge</text><rect x="350" y="554" width="26" height="6" rx="3" fill="#7c3aed"/><text x="384" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine line</text>
</svg>
