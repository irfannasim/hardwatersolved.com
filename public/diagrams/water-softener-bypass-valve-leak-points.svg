<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" role="img" aria-labelledby="g4bl-title g4bl-desc">
<title id="g4bl-title">Water softener bypass valve leak points</title>
<desc id="g4bl-desc">Diagram of the four places a water softener bypass valve leaks: the plunger stem, the clipped joint to the control valve, the joint to the house pipe adapters, and a crack in the body face.</desc>
<defs></defs>
<rect width="760" height="510" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where a bypass valve leaks</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Dry everything, then find where the first drop appears. That spot names the failed part.</text><rect class="box" x="290" y="100" width="180" height="50" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="380" y="131" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text><rect x="320" y="150" width="20" height="42" rx="0" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><path d="M314,164 L314,178 L346,178 L346,164" fill="none" stroke="#0b2f4a" stroke-width="3"/><rect x="420" y="150" width="20" height="42" rx="0" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><path d="M414,164 L414,178 L446,178 L446,164" fill="none" stroke="#0b2f4a" stroke-width="3"/><rect x="250" y="192" width="260" height="54" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="300" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">BYPASS</text><rect x="510" y="210" width="36" height="16" rx="0" fill="#94a3b8"/><rect x="546" y="202" width="18" height="32" rx="4" fill="#3a5a72"/><rect x="274" y="246" width="32" height="22" rx="0" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><rect x="282" y="268" width="16" height="60" rx="0" fill="#b87333"/><rect x="454" y="246" width="32" height="22" rx="0" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/><rect x="462" y="268" width="16" height="60" rx="0" fill="#b87333"/><text x="290" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">from supply</text><text x="470" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">to house</text><path class="ln" d="M596,218 L568,218" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="610" cy="218" r="12" fill="#dc2626"/><text x="610" y="222.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><path class="ln" d="M206,171 L312,171" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="192" cy="171" r="12" fill="#dc2626"/><text x="192" y="175.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><path class="ln" d="M206,257 L272,257" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="192" cy="257" r="12" fill="#dc2626"/><text x="192" y="261.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><path class="ln" d="M596,150 L420,212" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="610" cy="150" r="12" fill="#dc2626"/><text x="610" y="154.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="630" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">plunger stem</text><text x="630" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">body face</text><text x="176" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">U-clips</text><text x="176" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">adapters</text><circle cx="42" cy="390" r="10" fill="#dc2626"/><text x="42" y="394.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="60" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Plunger stem or rotor handle</text><text x="372" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">stem O-rings worn or dry: replace them</text><circle cx="42" cy="420" r="10" fill="#dc2626"/><text x="42" y="424.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="60" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Joint to the control valve, behind the clips</text><text x="372" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">port O-rings flattened; push the clips fully home</text><circle cx="42" cy="450" r="10" fill="#dc2626"/><text x="42" y="454.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="60" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Joint to the house pipes or adapters</text><text x="372" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">adapter O-ring or nut; support the pipe</text><circle cx="42" cy="480" r="10" fill="#dc2626"/><text x="42" y="484.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="60" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Flat face of the body, away from any joint</text><text x="372" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">a crack: replace the bypass</text>
</svg>
