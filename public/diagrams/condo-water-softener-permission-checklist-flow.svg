<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-labelledby="cp-title cp-desc">
<title id="cp-title">Condo or apartment water softener: four checks before you install</title>
<desc id="cp-desc">Decision chain for a water softener in a condo or apartment: own shutoff valve, then drain, outlet and space, then what the governing documents allow, then a written alteration request. Each no leads to an alternative such as exchange tanks or point-of-use treatment.</desc>
<defs>
<marker id="cp-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker>
</defs>
<rect width="760" height="610" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Four checks before a condo softener</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Work down the left. Any "no" sends you to the alternative on the right.</text>
<rect class="box" x="40" y="90" width="360" height="70" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="56" y="119" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">1. Does your unit have its own shutoff</text>
<text x="56" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">valve that serves only your unit?</text>
<rect class="box" x="40" y="200" width="360" height="70" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="56" y="229" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2. Is there a drain, an outlet and space</text>
<text x="56" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">close to that valve?</text>
<rect class="box" x="40" y="310" width="360" height="70" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="56" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">3. Do the documents allow plumbing</text>
<text x="56" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">alterations with approval?</text>
<rect class="box" x="40" y="420" width="360" height="70" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="56" y="449" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">4. Send a written request: spec sheet,</text>
<text x="56" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">sketch, licensed plumber, leak protection</text>
<rect class="box" x="40" y="530" width="360" height="56" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="56" y="555" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#15803d">Install on your branch, after your valve,</text>
<text x="56" y="575" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#15803d">before the water heater</text>
<line class="ln" x1="220" y1="160" x2="220" y2="192" stroke="#3a5a72" stroke-width="3" marker-end="url(#cp-arr)"/>
<line class="ln" x1="220" y1="270" x2="220" y2="302" stroke="#3a5a72" stroke-width="3" marker-end="url(#cp-arr)"/>
<line class="ln" x1="220" y1="380" x2="220" y2="412" stroke="#3a5a72" stroke-width="3" marker-end="url(#cp-arr)"/>
<line class="ln" x1="220" y1="490" x2="220" y2="522" stroke="#15803d" stroke-width="3" marker-end="url(#cp-arr)"/>
<text x="234" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">yes</text>
<text x="234" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">yes</text>
<text x="234" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">yes</text>
<text x="234" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#15803d">approved</text>
<line class="ln" x1="400" y1="125" x2="450" y2="125" stroke="#dc2626" stroke-width="3" marker-end="url(#cp-arr)"/>
<line class="ln" x1="400" y1="235" x2="450" y2="235" stroke="#dc2626" stroke-width="3" marker-end="url(#cp-arr)"/>
<line class="ln" x1="400" y1="345" x2="450" y2="345" stroke="#dc2626" stroke-width="3" marker-end="url(#cp-arr)"/>
<line class="ln" x1="400" y1="455" x2="450" y2="455" stroke="#dc2626" stroke-width="3" marker-end="url(#cp-arr)"/>
<text x="426" y="113" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#dc2626">no</text>
<text x="426" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#dc2626">no</text>
<text x="426" y="333" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#dc2626">no</text>
<text x="426" y="443" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#dc2626">denied</text>
<rect class="box" x="460" y="90" width="260" height="70" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="474" y="113" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Point-of-use options only, or</text>
<text x="474" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">ask the board about softening</text>
<text x="474" y="149" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">the whole building</text>
<rect class="box" x="460" y="200" width="260" height="70" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="474" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Portable exchange tank (no drain</text>
<text x="474" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">or outlet), or add both first</text>
<rect class="box" x="460" y="310" width="260" height="70" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="474" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Dishwasher softener, drinking</text>
<text x="474" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">water tap, scale management</text>
<rect class="box" x="460" y="420" width="260" height="70" rx="10" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="474" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Ask what would change the</text>
<text x="474" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">answer, or use options 2 to 6</text>
</svg>
