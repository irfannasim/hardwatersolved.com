<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="bcp-title bcp-desc">
<title id="bcp-title">Where water softener discharge goes: chloride through a sewer plant and a septic system</title>
<desc id="bcp-desc">Two paths for water softener discharge. In a community sewer the brine passes screens, settling, biological treatment and disinfection and its chloride reaches the river or reuse unchanged. In a septic system the chloride passes the tank and drainfield toward groundwater.</desc>
<defs><marker id="bcp-w" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="bcp-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="490" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where softener chloride ends up: sewer plant vs septic</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Treatment removes solids, organics and germs. Dissolved chloride moves on with the water.</text><text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Community sewer</text><rect class="box" x="30" y="118" width="92" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="76" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House</text><text x="76" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">drain</text><path class="ln" d="M125,145 L137,145" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="146" y="118" width="92" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="192" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sewer</text><text x="192" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">main</text><path class="ln" d="M241,145 L253,145" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="262" y="118" width="110" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="317" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Screens and</text><text x="317" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">settling</text><text x="317" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">grit, solids</text><path class="ln" d="M375,145 L387,145" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="396" y="118" width="104" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="448" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Biological</text><text x="448" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">treatment</text><text x="448" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">organics</text><path class="ln" d="M503,145 L515,145" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="524" y="118" width="96" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="572" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Clarify and</text><text x="572" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">disinfect</text><text x="572" y="192" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">germs</text><path class="ln" d="M623,145 L635,145" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="644" y="118" width="86" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="687" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">River or</text><text x="687" y="159" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">reuse</text><path class="ln" d="M36,214 L716,214" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-b)"/><text x="380" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">Chloride in = chloride out. Conventional plants are not built to remove it.</text><text x="30" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Septic system</text><rect class="box" x="30" y="304" width="92" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="76" y="327" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House</text><text x="76" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">drain</text><path class="ln" d="M125,331 L137,331" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="146" y="304" width="118" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="205" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Septic tank</text><text x="205" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">settles solids</text><path class="ln" d="M267,331 L279,331" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="288" y="304" width="118" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="347" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Drainfield</text><text x="347" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">soil treats</text><path class="ln" d="M409,331 L421,331" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="430" y="304" width="118" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="489" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Soil below</text><text x="489" y="378" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">bacteria, organics</text><path class="ln" d="M551,331 L563,331" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-w)"/><rect class="box" x="572" y="304" width="158" height="54" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="651" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Groundwater</text><path class="ln" d="M36,400 L716,400" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bcp-b)"/><text x="380" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">Chloride moves down with the effluent toward groundwater.</text><rect x="30" y="462" width="26" height="6" rx="3" fill="#78716c"/><text x="64" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Wastewater flow</text><rect x="210" y="462" width="26" height="6" rx="3" fill="#7c3aed"/><text x="244" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Chloride from regeneration brine</text>
</svg>
