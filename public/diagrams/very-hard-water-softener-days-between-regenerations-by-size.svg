<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="vhd-title vhd-desc">
<title id="vhd-title">Very hard water softener: days between regenerations at 20, 30 and 40 gpg</title>
<desc id="vhd-desc">Illustrative bar chart of days between regenerations for a 48,000-grain single tank, a 64,000-grain and an 80,000-grain softener, and a 96,000-grain twin-tank softener on very hard water at 20, 30 and 40 grains per gallon for a family of four. Only the larger units stay above three days at 40 gpg.</desc>
<defs></defs>
<rect width="760" height="580" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Days between regenerations at very high hardness</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative: family of four, 300 gal/day, 9 lb salt per cu ft (26,000 grains per cu ft),</text>
<text x="30" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">one day of reserve on single tanks, no reserve on the twin</text>
