<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="f57-title f57-desc">
<title id="f57-title">Fleck 5600SXT vs 7000SXT: valve pressure drop against flow rate</title>
<desc id="f57-desc">Pressure drop curves for the Fleck 5600SXT and Fleck 7000SXT control valves alone, from 0 to 30 gpm, drawn from Pentair's rated points. At 15 gpm, about six fixtures, the 5600SXT loses about 8 psi against about 4 psi for the 7000SXT, and its meter reaches the end of its stated range.</desc>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Fleck 5600SXT vs 7000SXT: pressure lost in the valve</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Valve alone, drop = (flow ÷ Cv)², fitted to Pentair’s rated points. Illustrative.</text><line x1="90" y1="470" x2="690" y2="470" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text><line x1="90" y1="413.3333333333333" x2="690" y2="413.3333333333333" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="418.3333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">5</text><line x1="90" y1="356.6666666666667" x2="690" y2="356.6666666666667" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="361.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">10</text><line x1="90" y1="300" x2="690" y2="300" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">15</text><line x1="90" y1="243.33333333333334" x2="690" y2="243.33333333333334" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="248.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">20</text><line x1="90" y1="186.66666666666663" x2="690" y2="186.66666666666663" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="191.66666666666663" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">25</text><line x1="90" y1="130" x2="690" y2="130" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="135" font-famil