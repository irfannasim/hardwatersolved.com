<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 606" width="760" height="606" role="img" aria-labelledby="sbm-title sbm-desc">
<title id="sbm-title">Brine tank salt bridge vs salt mushing: cutaway comparison</title>
<desc id="sbm-desc">Brine tank cutaways comparing a salt bridge, a hard crust over an air void that a probe cracks through, with salt mushing, a sludge floor under normal-looking salt that buries the brine well openings and stops a probe dead.</desc>
<defs><marker id="sbm-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><pattern id="sbm-salt" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern></defs>
<rect width="760" height="606" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Salt bridge vs salt mushing in a brine tank</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same tank, two faults, same result: no brine</text><rect class="box" x="30" y="84" width="340" height="418" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><rect class="box" x="390" y="84" width="340" height="418" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="200" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">SALT BRIDGE</text><text x="560" y="108" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">SALT MUSHING</text><rect x="50" y="120" width="170" height="300" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="3" /><rect x="53" y="170" width="164" height="62" rx="0" fill="url(#sbm-salt)" /><rect x="53" y="232" width="164" height="20" rx="0" fill="#94a3b8" /><path d="M140,232 L146,242 L138,246 L144,252" stroke="#dc2626" stroke-width="2.5" fill="none"/><rect x="53" y="360" width="164" height="57" rx="0" fill="#dbeafe" /><path d="M53,360 L217,360" stroke="#60a5fa" stroke-width="2"/><text x="135" y="312" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">air void</text><rect x="134" y="128" width="10" height="108" rx="3" fill="#a16207" /><text x="230" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">loose salt</text><text x="230" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">hard crust,</text>
<text x="230" y="257" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">wall to wall</text><text x="230" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0e7490">water</text><text x="200" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Probe: resistance, crack, sudden drop</text><text x="200" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Fix: break it in place, ten minutes</text><rect x="410" y="120" width="170" height="300" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="3" /><rect x="413" y="170" width="164" height="204" rx="0" fill="url(#sbm-salt)" /><rect x="413" y="300" width="164" height="74" rx="0" fill="#dbeafe" opacity="0.6"/><rect x="413" y="374" width="164" height="43" rx="0" fill="#8a7a66" /><rect x="420" y="126" width="26" height="290" rx="0" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2" /><rect x="420" y="390" width="4" height="5" rx="0" fill="#3f3a33" /><rect x="442" y="390" width="4" height="5" rx="0" fill="#3f3a33" /><rect x="420" y="404" width="4" height="5" rx="0" fill="#3f3a33" /><rect x="442" y="404" width="4" height="5" rx="0" fill="#3f3a33" /><rect x="422" y="374" width="22" height="41" rx="0" fill="#8a7a66" /><path class="ln" d="M433,370 L433,140" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#sbm-b)"/><rect x="510" y="128" width="10" height="246" rx="3" fill="#a16207" /><rect x="510" y="344" width="10" height="30" rx="3" fill="#57534e" /><text x="590" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">loose salt</text>
<text x="590" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">looks normal</text><text x="590" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">sludge floor</text>
<text x="590" y="401" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">buries brine</text>
<text x="590" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">well openings</text><text x="590" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">probe stops</text>
<text x="590" y="307" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">dead, comes</text>
<text x="590" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">out coated</text><text x="560" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Over 3 in of sludge is a fault (½ in is normal)</text><text x="560" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Fix: empty and wash the tank, an hour</text><rect class="box" x="30" y="518" width="700" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="380" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Both: no brine → resin not recharged → hard water</text><path d="M30,586 L56,586" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 5"/><text x="64" y="591" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sludge drawn up the brine line reaches the injector and air check</text>
</svg>
