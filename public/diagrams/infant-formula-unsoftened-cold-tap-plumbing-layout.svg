<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="ift-title ift-desc">
<title id="ift-title">Which tap to use for baby formula in a house with a water softener</title>
<desc id="ift-desc">Plumbing layout. A tee on the supply before the water softener feeds an unsoftened cold kitchen tap, which is the tap to use for baby formula. The softened cold tap and the hot tap both come after the softener and should not be used for formula.</desc>
<defs>
<marker id="ift-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker>
</defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">The formula tap starts before the softener</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Three kitchen taps in a softened house, and which one to fill the kettle or bottle from</text>
<g fill="none" stroke-width="6">
<path class="ln" d="M30,330 L140,330 L140,140 L192,140" stroke="#c2410c" marker-end="url(#ift-ah)"/>
<path class="ln" d="M140,330 L552,330" stroke="#c2410c" marker-end="url(#ift-ah)"/>
<path class="ln" d="M320,140 L552,140" stroke="#0e7490" marker-end="url(#ift-ah)"/>
<path class="ln" d="M380,140 L380,230 L412,230" stroke="#0e7490" marker-end="url(#ift-ah)"/>
<path class="ln" d="M520,230 L552,230" stroke="#0e7490" marker-end="url(#ift-ah)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="314" font-size="14" font-weight="bold" fill="#c2410c">Supply in</text>
<rect class="box" x="200" y="110" width="120" height="60" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="260" y="146" font-size="15" font-weight="bold" fill="#0b2f4a" text-anchor="middle">Softener</text>
<rect class="box" x="420" y="205" width="100" height="50" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="470" y="228" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="middle">Water</text>
<text x="470" y="246" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="middle">heater</text>
<rect class="box" x="560" y="108" width="170" height="64" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="574" y="134" font-size="14" font-weight="bold" fill="#dc2626">B: softened cold</text>
<text x="574" y="156" font-size="13" fill="#0b2f4a">Not for formula (NHS)</text>
<rect class="box" x="560" y="198" width="170" height="64" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="574" y="224" font-size="14" font-weight="bold" fill="#dc2626">C: hot tap</text>
<text x="574" y="246" font-size="13" fill="#0b2f4a">Cold only (EPA)</text>
<rect class="box" x="560" y="298" width="170" height="64" rx="6" fill="#ecfdf3" stroke="#15803d" stroke-width="2"/>
<text x="574" y="324" font-size="14" font-weight="bold" fill="#15803d">A: unsoftened cold</text>
<text x="574" y="346" font-size="13" fill="#0b2f4a">Use this for formula</text>
<text x="160" y="358" font-size="13" fill="#0b2f4a">Tee upstream of the softener. Cheapest</text>
<text x="160" y="376" font-size="13" fill="#0b2f4a">to add while the softener is installed.</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">
<line x1="30" y1="412" x2="60" y2="412" stroke="#c2410c" stroke-width="6"/>
<text x="70" y="417">Hard, unsoftened</text>
<line x1="220" y1="412" x2="250" y2="412" stroke="#0e7490" stroke-width="6"/>
<text x="260" y="417">Softened, sodium added</text>
<text x="30" y="452">Well water: test for nitrate and bacteria before using any tap for formula.</text>
<text x="30" y="472" fill="#52697a">A softener removes neither. Ask your pediatrician whether to boil the water first.</text>
</g>
</svg>
