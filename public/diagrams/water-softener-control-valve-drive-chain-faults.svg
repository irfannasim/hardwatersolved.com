<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" role="img" aria-labelledby="g6dc-title g6dc-desc">
<title id="g6dc-title">Water softener stuck in regeneration: the control valve drive chain</title>
<desc id="g6dc-desc">Diagram of the water softener control valve drive chain, from power to motor, drive, valve and position sensor, looping back through the control board, with the listen, watch and sensor checks that identify which link has failed when a softener is stuck in regeneration.</desc>
<defs><marker id="g6dc-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="524" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">The drive chain inside a softener control valve</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">A valve stuck in regeneration has broken one of these links. Follow them in order.</text>
<rect class="box" x="30" y="94" width="118" height="72" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="89" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">POWER</text>
<text x="89" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">transformer</text>
<text x="89" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">and outlet</text>
<path class="ln" d="M152,130 L170,130" fill="none" stroke="#0b2f4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g6dc-a)"/>
<rect class="box" x="176" y="94" width="118" height="72" rx="10" fill="#e0f2f1" stroke="#3a5a72" stroke-width="2"/>
<text x="235" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">MOTOR</text>
<text x="235" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">turns the</text>
<text x="235" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">drive</text>
<path class="ln" d="M298,130 L316,130" fill="none" stroke="#0b2f4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g6dc-a)"/>
<rect class="box" x="322" y="94" width="118" height="72" rx="10" fill="#e0f2f1" stroke="#3a5a72" stroke-width="2"/>
<text x="381" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">DRIVE</text>
<text x="381" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">gears, cam</text>
<text x="381" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">or piston</text>
<path class="ln" d="M444,130 L462,130" fill="none" stroke="#0b2f4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g6dc-a)"/>
<rect class="box" x="468" y="94" width="118" height="72" rx="10" fill="#e0f2f1" stroke="#3a5a72" stroke-width="2"/>
<text x="527" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">VALVE</text>
<text x="527" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">moves to the</text>
<text x="527" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">next step</text>
<path class="ln" d="M590,130 L608,130" fill="none" stroke="#0b2f4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g6dc-a)"/>
<rect class="box" x="614" y="94" width="118" height="72" rx="10" fill="#e0f2f1" stroke="#3a5a72" stroke-width="2"/>
<text x="673" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">SENSOR</text>
<text x="673" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">reports the</text>
<text x="673" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">position</text>
<text x="180" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">Check 1</text>
<text x="326" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">Check 2</text>
<text x="618" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">Check 3</text>
<rect class="box" x="200" y="206" width="360" height="52" rx="10" fill="#0b2f4a"/>
<text x="380" y="228" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL BOARD</text>
<text x="380" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dbeafe">asks the motor to move, then waits for the sensor</text>
<path class="ln" d="M705,166 L705,232 L568,232" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g6dc-a)"/>
<path class="ln" d="M196,232 L89,232 L89,174" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g6dc-a)"/>
<rect class="box" x="30" y="282" width="226" height="164" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="44" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Check 1 · Listen to the motor</text>
<text x="44" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Silence or a click</text>
<text x="44" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">no power, or a failed motor</text>
<text x="44" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hum, no movement</text>
<text x="44" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">seized motor or binding piston</text>
<text x="44" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">A whirr that runs and runs</text>
<text x="44" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">stripped gears or a failed sensor</text>
<rect class="box" x="267" y="282" width="226" height="164" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="281" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Check 2 · Watch the drive</text>
<text x="281" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Motor turns, part does not</text>
<text x="281" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">stripped gear: missing teeth</text>
<text x="281" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">or white plastic shavings</text>
<text x="281" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Piston barely moves</text>
<text x="281" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">binding in its seals: iron,</text>
<text x="281" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sand or pipe scale</text>
<rect class="box" x="504" y="282" width="226" height="164" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="518" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Check 3 · Check the sensor</text>
<text x="518" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Stops at the same step</text>
<text x="518" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">every time: switch, optical</text>
<text x="518" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sensor or their wiring</text>
<text x="518" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Step number flashes</text>
<text x="518" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the control asked it to move</text>
<text x="518" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">and never got confirmation</text>
<rect class="box" x="30" y="462" width="700" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="380" y="487" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">If it will not move with its own buttons and motor, it needs a part, not more force.</text>
</svg>
