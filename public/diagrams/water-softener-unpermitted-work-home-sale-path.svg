<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" role="img" aria-labelledby="wsrs-title wsrs-desc">
<title id="wsrs-title">Unpermitted water softener installation and home sale: how it surfaces</title>
<desc id="wsrs-desc">Illustrative timeline of an unpermitted water softener installation surfacing during a home sale: the buyer inspection notes the drain and jumper, no permit is on file, and the seller resolves it by an after-the-fact permit, a credit, or removal.</desc>
<defs><marker id="wsrs-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="474" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">How unpermitted softener work surfaces at resale</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative sequence. Local rules decide which steps apply to your sale.</text><rect class="box" x="30" y="96" width="128" height="96" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="94" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Install</text><text x="94" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">No permit where</text><text x="94" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">one was required</text><path class="ln" d="M160,144 L170,144" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsrs-a)"/><rect class="box" x="173" y="96" width="128" height="96" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="237" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Years of use</text><text x="237" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Softener works;</text><text x="237" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">no one asks</text><path class="ln" d="M303,144 L313,144" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsrs-a)"/><rect class="box" x="316" y="96" width="128" height="96" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="380" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Listing</text><text x="380" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Seller discloses</text><text x="380" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">known work</text><path class="ln" d="M446,144 L456,144" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsrs-a)"/><rect class="box" x="459" y="96" width="128" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="523" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Buyer inspection</text><text x="523" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Inspector flags</text><text x="523" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">the drain setup</text><path class="ln" d="M589,144 L599,144" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsrs-a)"/><rect class="box" x="602" y="96" width="128" height="96" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="666" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Records check</text><text x="666" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">No permit on file</text><text x="666" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">for the work</text><path class="ln" d="M666,194 L666,228 L141,228" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M141,228 L141,244" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsrs-a)"/><path class="ln" d="M380,228 L380,244" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsrs-a)"/><path class="ln" d="M619,228 L619,244" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsrs-a)"/><text x="160" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">The buyer asks the seller to resolve it</text><rect class="box" x="30" y="254" width="222" height="118" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="44" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">Permit after the fact</text><text x="44" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Seller applies, the work</text><text x="44" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">is inspected, faults are</text><text x="44" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">corrected before closing</text><rect class="box" x="269" y="254" width="222" height="118" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="283" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">Credit or price change</text><text x="283" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Buyer takes the work as</text><text x="283" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">is and fixes it later,</text><text x="283" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">often with their own permit</text><rect class="box" x="508" y="254" width="222" height="118" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="522" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">Removal</text><text x="522" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softener taken out and</text><text x="522" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">plumbing restored; rare,</text><text x="522" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">but it happens</text><rect class="box" x="30" y="390" width="700" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="46" y="414" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">All three cost more under a closing deadline than a permit cost at install.</text><text x="46" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A permit record, or a logged "no permit required" answer, closes the question in minutes.</text>
</svg>
