<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 588" width="760" height="588" role="img" aria-labelledby="bst-title bst-desc">
<title id="bst-title">Brine tank salt level states: falling, stalled by a salt bridge, and water rising</title>
<desc id="bst-desc">Three brine tank cross-sections: a normally falling salt level, a stalled level where a hard salt crust bridges over a hollow cavity above the water, and water rising up over the salt, which points to a float, refill valve, drain or brine line fault.</desc>
<defs><pattern id="bst-s" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f1f5f9"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#b6c2d1"/></pattern><pattern id="bst-sw" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#dbeafe"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#a5b4c8"/></pattern><marker id="bst-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="588" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Reading the brine tank level: falling, stalled, rising</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Check monthly. Only a steadily falling level is normal.</text><rect class="box" x="30" y="86" width="220" height="452" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="140" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Falling steadily</text><text x="140" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Normal</text><rect x="75" y="160" width="130" height="230" fill="#ffffff"/><rect x="75" y="214" width="130" height="146" fill="url(#bst-s)"/><rect x="75" y="360" width="130" height="30" fill="url(#bst-sw)"/><path class="ln" d="M178,172 L178,200" fill="none" stroke="#0b2f4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bst-a)"/><text x="128" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">level falls</text><path d="M75,360 L205,360" stroke="#2563eb" stroke-width="2"/><rect x="75" y="160" width="130" height="230" rx="5" fill="none" stroke="#3a5a72" stroke-width="3"/><text x="140" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Drawing brine, regenerating,</text><text x="140" y="441" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">using salt in proportion</text><text x="140" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">to water use.</text><text x="140" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">No action needed.</text><rect class="box" x="270" y="86" width="220" height="452" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Stalled at one height</text><text x="380" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Salt bridge or no brine draw</text><rect x="315" y="160" width="130" height="230" fill="#ffffff"/><rect x="315" y="196" width="130" height="48" fill="url(#bst-s)"/><rect x="315" y="244" width="130" height="22" fill="#475569"/><text x="364" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">hard crust</text><text x="380" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">hollow cavity</text><rect x="315" y="360" width="130" height="30" fill="#dbeafe"/><rect x="416" y="148" width="9" height="98" rx="3" fill="#a16207"/><path d="M315,360 L445,360" stroke="#2563eb" stroke-width="2"/><rect x="315" y="160" width="130" height="230" rx="5" fill="none" stroke="#3a5a72" stroke-width="3"/><text x="380" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Probe with a broom handle:</text><text x="380" y="441" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">resistance, a crack, then</text><text x="380" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">a drop into space = bridge.</text><text x="380" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">No bridge? Check injector,</text><text x="380" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">brine line, valve sequencing.</text><rect class="box" x="510" y="86" width="220" height="452" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="620" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water rising over salt</text><text x="620" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Separate fault family</text><rect x="555" y="160" width="130" height="230" fill="#ffffff"/><rect x="555" y="204" width="130" height="186" fill="#dbeafe"/><rect x="555" y="236" width="130" height="154" fill="url(#bst-sw)"/><text x="620" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">level rising</text><text x="620" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d4ed8">water over salt</text><path d="M555,360 L685,360" stroke="#2563eb" stroke-width="0"/><rect x="555" y="160" width="130" height="230" rx="5" fill="none" stroke="#3a5a72" stroke-width="3"/><text x="620" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Stuck safety float, refill</text><text x="620" y="441" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">valve not closing, blocked</text><text x="620" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">drain, or a brine line that</text><text x="620" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">cannot draw.</text><text x="620" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Adding salt will not help.</text><rect x="30" y="556" width="26" height="14" fill="url(#bst-s)" stroke="#94a3b8" stroke-width="1"/><text x="64" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">salt</text><rect x="140" y="556" width="26" height="14" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><text x="174" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water</text><rect x="260" y="556" width="26" height="14" fill="#475569"/><text x="294" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">fused salt crust</text><rect x="440" y="556" width="26" height="14" rx="3" fill="#a16207"/><text x="474" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">broom handle probe</text>
</svg>
