<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="htds-title htds-desc">
<title id="htds-title">Hard water vs TDS vs alkalinity in four example water samples</title>
<desc id="htds-desc">Grouped bar chart of total dissolved solids, hardness and alkalinity in mg/L for four example waters: a limestone well at 532, 328 and 291; the same well softened at 568, 0 and 291; a sodium bicarbonate well at 683, 28 and 344; and a gypsum well at 803, 539 and 98. The three numbers move independently.</desc>
