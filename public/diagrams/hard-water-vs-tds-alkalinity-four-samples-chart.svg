<rect width="760" height="590" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hard water vs TDS vs alkalinity: four example waters</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Worked from each water’s ion makeup (example compositions, mg/L). The three numbers move independently.</text>
