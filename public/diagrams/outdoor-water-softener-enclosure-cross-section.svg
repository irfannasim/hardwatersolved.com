<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="oec-title oec-desc">
<title id="oec-title">Outdoor water softener installation: insulated, shaded enclosure cross-section</title>
<desc id="oec-desc">Cross-section of an outdoor water softener enclosure on a concrete pad against the house wall, with rigid foam walls, a hinged insulated lid for salt, a shaded vent, a thermostat heater that keeps the inside above 40 degrees, heat-traced supply piping and a low drain exit.</desc>
<defs><pattern id="oec-ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1f5f9"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="4"/></pattern><marker id="oec-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="590" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">One enclosure for both extremes: outdoor softener</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Insulation, shade and a little heat solve freezing and sun together.</text><rect x="30" y="110" width="30" height="360" fill="#cbd5e1"/><text x="30" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">house wall</text><rect x="30" y="470" width="700" height="3" fill="#3a5a72"/><rect x="60" y="458" width="360" height="12" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1"/><rect x="80" y="182" width="320" height="276" fill="url(#oec-ins)" stroke="#0b2f4a" stroke-width="2"/><rect x="94" y="196" width="292" height="262" fill="#ffffff"/><rect x="72" y="168" width="336" height="14" rx="3" fill="url(#oec-ins)" stroke="#0b2f4a" stroke-width="2"/><rect x="388" y="206" width="12" height="30" fill="#ffffff" stroke="#0b2f4a" stroke-width="1.5"/><rect x="130" y="266" width="40" height="182" rx="14" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="124" y="238" width="52" height="28" rx="4" fill="#0b2f4a"/><rect x="214" y="330" width="80" height="118" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="254" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">brine</text><text x="150" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">resin</text><rect x="318" y="418" width="54" height="30" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><path class="ln" d="M104,540 L104,258 L124,258" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M124,246 L60,246" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M176,252 L420,252 L420,462" fill="none" stroke="#78716c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#oec-d)"/><path class="ln" d="M168,266 L168,290 L230,290 L230,330" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M408,172 L446,150" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="452" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hinged insulated lid</text><text x="452" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">salt goes in from the top</text><path class="ln" d="M400,200 L446,196" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="452" y="201" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Rigid foam walls</text><text x="452" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">light-colored outer skin</text><path class="ln" d="M400,226 L446,240" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="452" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Shaded vent</text><text x="452" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">open in summer, closed in winter</text><path class="ln" d="M420,330 L446,304" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="452" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Drain line to an open drain</text><text x="452" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">with an air gap at the end</text><path class="ln" d="M372,430 L446,420" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="452" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">Thermostat heater</text><text x="452" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">keeps the inside above 40°F</text><text x="190" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">valve in shade</text><text x="120" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">supply rises from below the frost line,</text><text x="120" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">insulated and heat-traced where exposed</text><rect x="30" y="560" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard supply</text><rect x="170" y="560" width="26" height="6" rx="3" fill="#0e7490"/><text x="204" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">soft to house</text><rect x="320" y="560" width="26" height="6" rx="3" fill="#78716c"/><text x="354" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">drain</text><rect x="420" y="560" width="26" height="6" rx="3" fill="#7c3aed"/><text x="454" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine line</text>
</svg>
