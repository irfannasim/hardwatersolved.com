<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="tno-title tno-desc">
<title id="tno-title">Water softener tank O-ring and distributor tube at the control valve joint</title>
<desc id="tno-desc">Schematic cross-section of a water softener control valve threaded onto the resin tank neck. The tank O-ring in the valve groove makes the seal, the distributor tube seats into its pilot in the valve with its own O-ring, and the valve comes off counterclockwise, lifted straight up.</desc>
<defs><pattern id="tno-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><marker id="tno-m0e7490" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where the tank O-ring seals</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Schematic cross-section of the valve-to-tank joint. The O-ring seals, not the thread.</text>
<rect x="290" y="262" width="180" height="238" rx="24" fill="url(#tno-beads)" stroke="#3a5a72" stroke-width="2"/>
<rect x="318" y="196" width="20" height="76" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="422" y="196" width="20" height="76" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/>
<rect class="box" x="250" y="96" width="260" height="96" rx="8" fill="#0b2f4a"/>
<text x="380" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text>
<rect x="340" y="192" width="80" height="60" fill="#475569"/>
<path d="M338,200 L343,204 L338,208 L343,212 L338,216 L343,220 L338,224 L343,228 L338,232 L343,236 L338,240 L343,244 L338,248 L343,252 L338,256" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
<path d="M422,200 L417,204 L422,208 L417,212 L422,216 L417,220 L422,224 L417,228 L422,232 L417,236 L422,240 L417,244 L422,248 L417,252 L422,256" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
<circle cx="328" cy="192" r="6" fill="#0b2f4a"/>
<circle cx="432" cy="192" r="6" fill="#0b2f4a"/>
<rect x="373" y="156" width="14" height="334" fill="#94a3b8" stroke="#3a5a72" stroke-width="1"/>
<rect x="366" y="150" width="28" height="30" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="370" cy="170" r="3.5" fill="#f8fafc"/>
<circle cx="390" cy="170" r="3.5" fill="#f8fafc"/>
<text x="210" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">tank O-ring</text>
<text x="210" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">in the valve groove</text>
<path class="ln" d="M216,190 L320,192" fill="none" stroke="#52697a" stroke-width="1.2"/>
<text x="210" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#0b2f4a">tank threads</text>
<path class="ln" d="M216,236 L316,236" fill="none" stroke="#52697a" stroke-width="1.2"/>
<path class="ln" d="M110,380 L110,300" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tno-m0e7490)"/>
<text x="30" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Unscrew counterclockwise,</text>
<text x="30" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">lift straight up, keep it level</text>
<text x="30" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Tipping it disturbs the distributor</text>
<text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">tube and risks resin in the valve.</text>
<text x="540" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">distributor tube O-ring</text>
<text x="540" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">tube seats into its pilot</text>
<path class="ln" d="M534,168 L396,168" fill="none" stroke="#52697a" stroke-width="1.2"/>
<text x="540" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">hand-tight only: no wrench</text>
<text x="540" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">on the valve body</text>
<text x="496" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">distributor tube</text>
<path class="ln" d="M492,296 L390,300" fill="none" stroke="#52697a" stroke-width="1.2"/>
<rect class="box" x="520" y="338" width="210" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="536" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">O-ring cross-section</text>
<circle cx="566" cy="402" r="14" fill="#0b2f4a"/>
<rect x="646" y="392" width="30" height="20" rx="3" fill="#0b2f4a"/>
<text x="566" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">new: round</text>
<text x="661" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">old: flattened</text>
<text x="536" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Silicone grease only</text>
</svg>
