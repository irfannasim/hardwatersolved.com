<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="ox-title ox-desc">
<title id="ox-title">Where well water iron oxidizes before the water softener</title>
<desc id="ox-desc">Diagram of a well water system showing where dissolved iron oxidizes before the softener: chlorine after shock chlorination, a misplaced aerator or air injection, an older pressure tank where air and water share space, and standing water.</desc>
<defs><marker id="ox-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ox-tsoft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><pattern id="ox-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where clear well water meets oxygen</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Iron can leave the well dissolved and still reach the softener as rust particles.</text><path d="M30,200 L730,200" stroke="#a8a29e" stroke-width="2"/><rect x="44" y="150" width="28" height="150" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/><rect x="50" y="133" width="16" height="20" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="50" y="133" width="150" height="16" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="260" y="133" width="250" height="16" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="200" y="108" width="60" height="132" rx="18" fill="#e0f2fe" stroke="#3a5a72" stroke-width="2"/><rect x="202" y="110" width="56" height="48" rx="16" fill="#ffffff"/><text x="230" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">air</text><rect x="504" y="122" width="72" height="30" rx="6" fill="#0b2f4a"/><rect x="514" y="152" width="52" height="140" rx="18" fill="url(#ox-beads)" stroke="#3a5a72" stroke-width="2"/><path class="ln" d="M580,141 L660,141" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ox-soft)"/><text x="670" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">house</text><circle cx="150" cy="141" r="3.5" fill="#b45309"/><circle cx="185" cy="144" r="3.5" fill="#b45309"/><circle cx="226" cy="190" r="3.5" fill="#b45309"/><circle cx="238" cy="214" r="3.5" fill="#b45309"/><circle cx="214" cy="206" r="3.5" fill="#b45309"/><circle cx="300" cy="139" r="3.5" fill="#b45309"/><circle cx="330" cy="144" r="3.5" fill="#b45309"/><circle cx="370" cy="138" r="3.5" fill="#b45309"/><circle cx="410" cy="143" r="3.5" fill="#b45309"/><circle cx="440" cy="139" r="3.5" fill="#b45309"/><circle cx="470" cy="144" r="3.5" fill="#b45309"/><circle cx="490" cy="139" r="3.5" fill="#b45309"/><circle cx="530" cy="180" r="3.5" fill="#b45309"/><circle cx="548" cy="214" r="3.5" fill="#b45309"/><circle cx="528" cy="250" r="3.5" fill="#b45309"/><circle cx="58" cy="104" r="11" fill="#dc2626"/><text x="58" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="122" cy="104" r="11" fill="#dc2626"/><text x="122" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="282" cy="110" r="11" fill="#dc2626"/><text x="282" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="380" cy="104" r="11" fill="#dc2626"/><text x="380" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="30" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Well:</tspan> iron dissolved</text><text x="30" y="347" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">(Fe²⁺), water clear</text><text x="540" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a"><tspan font-weight="bold">Softener:</tspan> receives</text><text x="540" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">ferric particles,</text><text x="540" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">and the resin fouls</text><circle cx="282" cy="318" r="5" fill="#b45309"/><text x="294" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">rust particles (ferric)</text><circle cx="41" cy="401" r="11" fill="#dc2626"/><text x="41" y="406" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="60" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Chlorine left behind after</text><text x="60" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">shock chlorination</text><circle cx="41" cy="451" r="11" fill="#dc2626"/><text x="41" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="60" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Aerator or air-injection stage</text><text x="60" y="475" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">placed in the wrong order</text><circle cx="411" cy="401" r="11" fill="#dc2626"/><text x="411" y="406" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="430" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Older pressure tank where water</text><text x="430" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">and air share the same space</text><circle cx="411" cy="451" r="11" fill="#dc2626"/><text x="411" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="430" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water standing in plumbing long</text><text x="430" y="475" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">enough to pick up oxygen</text>
</svg>
