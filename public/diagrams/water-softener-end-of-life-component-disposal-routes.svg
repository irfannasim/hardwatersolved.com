<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 612" width="760" height="612" role="img" aria-labelledby="wsed-title wsed-desc">
<title id="wsed-title">Water softener disposal routes for each component: valve, resin, tanks and salt</title>
<desc id="wsed-desc">Chart matching each part of an old water softener to its usual disposal route: control valve and transformer to e-waste, brass fittings to scrap metal, rinsed resin to bagged trash unless radium or uranium was present, the fiberglass resin tank to bulky waste and the brine tank to reuse or recycling.</desc>
<defs><marker id="drA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="612" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where each part of an old water softener goes</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Drain everything first. Routes vary by town; these are the usual ones.</text><text x="30" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">COMPONENT</text><text x="372" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">USUAL ROUTE</text><rect class="box" x="30" y="112" width="300" height="52" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Control valve</text><text x="44" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">plastic body, motor, circuit board</text><path class="ln" d="M334,138 L362,138" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#drA)"/><rect class="box" x="372" y="112" width="358" height="52" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="386" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">E-waste drop-off for the electronics;</text><text x="386" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">brass-bodied valves to a scrap yard</text><rect class="box" x="30" y="176" width="300" height="52" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Transformer / power supply</text><text x="44" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">plug-in adapter and cord</text><path class="ln" d="M334,202 L362,202" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#drA)"/><rect class="box" x="372" y="176" width="358" height="52" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="386" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">E-waste drop-off</text><text x="386" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">or a retailer take-back bin</text><rect class="box" x="30" y="240" width="300" height="52" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Bypass valve and fittings</text><text x="44" y="281" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brass, copper, stainless</text><path class="ln" d="M334,266 L362,266" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#drA)"/><rect class="box" x="372" y="240" width="358" height="52" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="386" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Scrap metal yard: small value,</text><text x="386" y="281" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">sorted by metal</text><rect class="box" x="30" y="304" width="300" height="52" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Resin</text><text x="44" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">drained and rinsed of brine</text><path class="ln" d="M334,330 L362,330" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#drA)"/><rect class="box" x="372" y="304" width="358" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="386" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Bagged household trash, unless</text><text x="386" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the water had radium or uranium</text><rect class="box" x="30" y="368" width="300" height="52" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Resin tank</text><text x="44" y="409" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">fiberglass-wrapped plastic</text><path class="ln" d="M334,394 L362,394" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#drA)"/><rect class="box" x="372" y="368" width="358" height="52" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="2"/><text x="386" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Bulky waste or transfer station;</text><text x="386" y="409" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">rarely accepted for recycling</text><rect class="box" x="30" y="432" width="300" height="52" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="454" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine tank</text><text x="44" y="473" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">polyethylene tub and lid</text><path class="ln" d="M334,458 L362,458" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#drA)"/><rect class="box" x="372" y="432" width="358" height="52" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="386" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Reuse for storage, recycle if</text><text x="386" y="473" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">your program takes it, or bulky waste</text><rect class="box" x="30" y="496" width="300" height="52" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Leftover salt and brine</text><text x="44" y="537" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bags, crust, mush</text><path class="ln" d="M334,522 L362,522" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#drA)"/><rect class="box" x="372" y="496" width="358" height="52" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="2"/><text x="386" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Keep dry salt for the next softener;</text><text x="386" y="537" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">brine down a drain, not on soil</text><rect x="30" y="582" width="26" height="12" rx="2" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="64" y="593" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">reuse or recycle</text><rect x="220" y="582" width="26" height="12" rx="2" fill="#ffffff" stroke="#78716c" stroke-width="2.5"/><text x="254" y="593" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">disposal</text><rect x="360" y="582" width="26" height="12" rx="2" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/><text x="394" y="593" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">check local rules first</text>
</svg>
