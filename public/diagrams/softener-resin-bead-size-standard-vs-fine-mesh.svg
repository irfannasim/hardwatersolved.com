<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="rbs-title rbs-desc">
<title id="rbs-title">Softener resin bead size: standard mesh vs fine mesh</title>
<desc id="rbs-desc">Scale of bead diameter from manufacturer data sheets: standard mesh softener resin runs about 300 to 1,200 micrometres (Purolite C100E, ResinTech CG8), fine mesh resin about 210 to 600 micrometres (Purolite C100EFM, ResinTech CG8-F). Distributor slot widths of 0.010 inch (254 micrometres) and 0.014 inch (356 micrometres) are marked.</desc>
<rect width="760" height="450" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">How much smaller is fine mesh resin?</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Bead size ranges from the manufacturers' data sheets, against common distributor slots</text>
<text x="338" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#b45309">0.010 in slot (254 µm)</text>
<text x="388" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#b45309">0.014 in slot (356 µm)</text>
<text x="30" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Purolite C100E</text>
<text x="30" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">standard mesh</text>
<rect x="360.8" y="110" width="332.3" height="26" fill="#e2b865" stroke="#3a5a72" stroke-width="1"/>
<text x="527" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">300 – 1,200 µm</text>
<text x="30" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">ResinTech CG8</text>
<text x="30" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">standard, 16–50 mesh</text>
<rect x="359.7" y="160" width="329.7" height="26" fill="#e2b865" stroke="#3a5a72" stroke-width="1"/>
<text x="527" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">297 – 1,190 µm</text>
<text x="30" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Purolite C100EFM</text>
<text x="30" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">fine mesh</text>
<rect x="327.5" y="226" width="144" height="26" fill="#f6ead2" stroke="#3a5a72" stroke-width="1"/>
<text x="480" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">210 – 600 µm</text>
<text x="30" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">ResinTech CG8-F</text>
<text x="30" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">fine, 30–50 mesh</text>
<rect x="359.7" y="276" width="110" height="26" fill="#f6ead2" stroke="#3a5a72" stroke-width="1"/>
<text x="480" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">297 – 595 µm</text>
<path class="ln" d="M343.8,100 L343.8,318" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
<path class="ln" d="M381.4,100 L381.4,318" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="250" y1="318" x2="730" y2="318" stroke="#3a5a72" stroke-width="1.5"/>
<g stroke="#3a5a72" stroke-width="1.5"><line x1="250" y1="318" x2="250" y2="324"/><line x1="323.8" y1="318" x2="323.8" y2="324"/><line x1="397.7" y1="318" x2="397.7" y2="324"/><line x1="471.5" y1="318" x2="471.5" y2="324"/><line x1="545.4" y1="318" x2="545.4" y2="324"/><line x1="619.2" y1="318" x2="619.2" y2="324"/><line x1="693.1" y1="318" x2="693.1" y2="324"/></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle"><text x="250" y="340">0</text><text x="323.8" y="340">200</text><text x="397.7" y="340">400</text><text x="471.5" y="340">600</text><text x="545.4" y="340">800</text><text x="619.2" y="340">1,000</text><text x="693.1" y="340">1,200</text></g>
<text x="490" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Bead diameter, micrometres (µm)</text>
<text x="30" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">A distributor slot passes any bead narrower than the slot.</text>
<text x="30" y="421" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Fine mesh puts far more of the bed close to that size, so check the basket before re-bedding.</text>
</svg>
