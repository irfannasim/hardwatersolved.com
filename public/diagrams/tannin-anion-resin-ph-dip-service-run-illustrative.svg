<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="tnp-title tnp-desc">
<title id="tnp-title">Tannin removal and pH: illustrative pH of treated water through one service run</title>
<desc id="tnp-desc">Illustrative chart: fresh anion tannin resin removes alkalinity early in each service run, so treated water pH dips about a full point below the raw water on soft, low-alkalinity wells, then recovers as the run continues.</desc>
<defs><marker id="tnp-steel" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="tnp-bad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="tnp-ok" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="tnp-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="tnp-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="tnp-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="tnp-iron" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="tnp-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why tannin units can lower pH early in each run</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative only: a soft, low-alkalinity well. Your numbers will differ.</text>
<path class="ln" d="M110,100 L110,380 L710,380" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M104,380 L110,380" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0b2f4a">5.5</text>
<path class="ln" d="M104,312.5 L110,312.5" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="317.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0b2f4a">6.0</text>
<path class="ln" d="M104,245 L110,245" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0b2f4a">6.5</text>
<path class="ln" d="M104,177.5 L110,177.5" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="182.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0b2f4a">7.0</text>
<path class="ln" d="M104,110 L110,110" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0b2f4a">7.5</text>
<text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#52697a">pH</text>
<text x="410" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">Gallons through the tannin unit since its last regeneration</text>
<text x="110" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">start</text>
<text x="710" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">next regen</text>
<path class="ln" d="M110,204.50000000000003 L710,204.50000000000003" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>
<text x="710" y="192.50000000000003" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#c2410c">Raw well water, pH 6.8</text>
<path class="ln" d="M110.0,204.5 L125.0,288.9 L140.0,332.2 L155.0,315.6 L170.0,301.2 L185.0,288.7 L200.0,277.8 L215.0,268.3 L230.0,260.0 L245.0,252.8 L260.0,246.5 L275.0,241.1 L290.0,236.3 L305.0,232.2 L320.0,228.6 L335.0,225.5 L350.0,222.8 L365.0,220.4 L380.0,218.3 L395.0,216.5 L410.0,215.0 L425.0,213.6 L440.0,212.4 L455.0,211.4 L470.0,210.5 L485.0,209.7 L500.0,209.1 L515.0,208.5 L530.0,208.0 L545.0,207.5 L560.0,207.1 L575.0,206.8 L590.0,206.5 L605.0,206.2 L620.0,206.0 L635.0,205.8 L650.0,205.6 L665.0,205.5 L680.0,205.4 L695.0,205.2 L710.0,205.2" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="250" y="300" width="300" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="264" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Early in the run: about 1 pH unit</text>
<text x="264" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">lower, so the water is more corrosive</text>
<path class="ln" d="M248,332 L144,339.5" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="338" y="255.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Treated water</text>
<text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Pattern described by resin suppliers: a dip of about one unit when alkalinity is under 50 ppm and TDS under 100.</text>
</svg>
