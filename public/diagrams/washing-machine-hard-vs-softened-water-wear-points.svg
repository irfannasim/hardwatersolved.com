<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="wma-title wma-desc">
<title id="wma-title">Softened water washing machine: hard water scale points versus softened water issues</title>
<desc id="wma-desc">Front-loading washing machine cutaway showing where hard water leaves scale and soap curd, in the dispenser, tub, door gasket and heater element, and what changes on softened water: surplus suds from an old dose, and old residue lifting out over the first loads.</desc>
<defs><marker id="wma-h" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="wma-s" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softened water and a washing machine: where it matters</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Front-loader cutaway. Hard water deposits scale; softened water shifts the risk to surplus suds.</text><rect x="250" y="96" width="260" height="400" rx="14" fill="#f8fafc" stroke="#3a5a72" stroke-width="2.5"/><rect x="250" y="96" width="260" height="46" rx="14" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2.5"/><rect x="266" y="108" width="74" height="24" rx="4" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><circle cx="380" cy="300" r="118" fill="#dbeafe" stroke="#3a5a72" stroke-width="2"/><circle cx="380" cy="300" r="92" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5"/><circle cx="380" cy="300" r="70" fill="none" stroke="#475569" stroke-width="9"/><path d="M322,430 L438,430 L438,440 L322,440" fill="none" stroke="#c2410c" stroke-width="4"/><rect x="470" y="150" width="28" height="20" rx="3" fill="#3a5a72"/><circle cx="282" cy="468" r="14" fill="#94a3b8" stroke="#3a5a72" stroke-width="1.5"/><text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#c2410c">On hard water</text><text x="30" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Dispenser drawer:</text>
<text x="30" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">crusty scale and curd</text><path class="ln" d="M196,124 L266,120" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wma-h)"/><text x="30" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Tub and drum walls:</text>
<text x="30" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">scale film, soap curd</text><path class="ln" d="M196,218 L268,262" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wma-h)"/><text x="30" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Door gasket: curd</text>
<text x="30" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">residue holds grime</text><path class="ln" d="M196,314 L312,318" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wma-h)"/><text x="30" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Heater element</text>
<text x="30" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">(models with one):</text>
<text x="30" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">scale insulates it</text><path class="ln" d="M196,408 L322,434" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wma-h)"/><text x="550" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">On softened water</text><text x="552" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Inlet valve screen:</text>
<text x="552" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">no scale; still catches</text>
<text x="552" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">grit from a well</text><path class="ln" d="M546,158 L500,160" fill="none" stroke="#0e7490" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wma-s)"/><text x="552" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Old dose = surplus</text>
<text x="552" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">suds; HE washer adds</text>
<text x="552" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">rinses and time</text><path class="ln" d="M546,258 L494,290" fill="none" stroke="#0e7490" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wma-s)"/><text x="552" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Old curd in fabric</text>
<text x="552" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and machine lifts out</text>
<text x="552" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">over first loads</text><path class="ln" d="M546,368 L452,340" fill="none" stroke="#0e7490" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wma-s)"/><text x="552" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drain pump: lint and</text>
<text x="552" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">coins, not hardness</text><path class="ln" d="M546,458 L298,470" fill="none" stroke="#0e7490" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wma-s)"/><text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Lab test (WQRF/Battelle, 26 gpg well water, 240 cycles in 30 days): washers on hard water had</text><text x="30" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">scale on every wetted surface; washers on softened water were almost free of scale.</text>
</svg>
