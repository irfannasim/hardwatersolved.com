<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 532" width="760" height="532" role="img" aria-labelledby="bpf-title bpf-desc">
<title id="bpf-title">Peak flow after adding a bathroom compared with a water softener service flow rating</title>
<desc id="bpf-desc">Illustrative stacked bar chart of simultaneous fixture flow. Two bathrooms and a kitchen total 9.4 gpm; adding a third shower at 2.5 gpm raises the peak to 11.9 gpm, above an example 10 gpm softener rating, while WaterSense showerheads and bathroom faucet bring it back to 9.7 gpm.</desc>
