<path d="M100,202.9 L560,202.9" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" fill="none"/>
<text x="574" y="180.9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Example softener</text>
<text x="574" y="197.9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">service rating:</text>
