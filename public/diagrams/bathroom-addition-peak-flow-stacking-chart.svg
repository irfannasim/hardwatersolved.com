<text x="90" y="249.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">8</text>
<path d="M100,202.9 L560,202.9" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="90" y="207.9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">10</text>
