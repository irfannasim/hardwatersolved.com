<rect x="125" y="358.2" width="110" height="51.8" fill="#0e7490" stroke="#ffffff" stroke-width="2"/>
<text x="180" y="389.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Shower 2.5</text>
