<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" width="760" height="604" role="img" aria-labelledby="aev-title aev-desc">
<title id="aev-title">Faucet aerator exploded view: reassembly order</title>
<desc id="aev-desc">Faucet aerator exploded view in reassembly order from the spout down: rubber washer and flow restrictor at the top, then the mixer or diffuser disc, then the fine mesh screen nearest the outlet, all held in the housing.</desc>
<defs><marker id="aev-w" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker><marker id="aev-m" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><pattern id="aev-mesh" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f1f5f9"/><path d="M0,0 L6,0 M0,0 L0,6" stroke="#64748b" stroke-width="1"/></pattern></defs>
<rect width="760" height="604" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Faucet aerator: the reassembly order</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Working from the faucet end downward</text><path d="M100,92 L290,92 L290,150 L210,150 L210,122 L100,122 z" fill="#cbd5e1" stroke="#3a5a72" stroke-width="2"/><rect x="210" y="150" width="80" height="14" rx="0" fill="#94a3b8" stroke="#3a5a72" stroke-width="1.5" /><text x="310" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">faucet spout (threads)</text><path class="ln" d="M250,172 L250,470" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/><ellipse cx="250" cy="204" rx="44" ry="11" fill="none" stroke="#1f2937" stroke-width="6"/><ellipse cx="250" cy="226" rx="48" ry="11" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><ellipse cx="250" cy="226" rx="8" ry="3" fill="#475569"/><circle cx="338" cy="215" r="12" fill="#0e7490"/><text x="338" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="360" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">rubber washer + flow restrictor</text><text x="360" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">go in first, at the top</text><ellipse cx="250" cy="292" rx="52" ry="12" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><ellipse cx="220" cy="292" rx="4" ry="2" fill="#475569"/><ellipse cx="235" cy="292" rx="4" ry="2" fill="#475569"/><ellipse cx="250" cy="292" rx="4" ry="2" fill="#475569"/><ellipse cx="265" cy="292" rx="4" ry="2" fill="#475569"/><ellipse cx="280" cy="292" rx="4" ry="2" fill="#475569"/><circle cx="338" cy="292" r="12" fill="#0e7490"/><text x="338" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="360" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">mixer / diffuser disc</text><ellipse cx="250" cy="358" rx="52" ry="12" fill="url(#aev-mesh)" stroke="#3a5a72" stroke-width="2"/><circle cx="338" cy="358" r="12" fill="#0e7490"/><text x="338" y="363" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="360" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">fine mesh screen</text><text x="360" y="373" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">last, nearest the outlet</text><path d="M190,412 L310,412 L310,452 C310,462 190,462 190,452 z" fill="#cbd5e1" stroke="#3a5a72" stroke-width="2"/><ellipse cx="250" cy="412" rx="60" ry="10" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><text x="360" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">housing: holds the stack</text><text x="360" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hand-tight, then a quarter turn at most</text><path class="ln" d="M250,472 L250,506" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aev-w)"/><text x="270" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">straight, quiet, full stream</text><text x="30" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">brush the screen</text>
<text x="30" y="401" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">from the outlet side</text><path class="ln" d="M140,392 L186,370" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aev-m)"/><rect class="box" x="30" y="530" width="700" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="48" y="555" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Screen and diffuser swapped?</text><text x="48" y="575" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The stream splits or sprays sideways. Photograph the stack before you take it apart.</text>
</svg>
