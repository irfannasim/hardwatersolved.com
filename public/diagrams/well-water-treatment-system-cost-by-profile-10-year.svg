<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="wwc-title wwc-desc">
<title id="wwc-title">Well water treatment system cost by water profile: equipment, installation and 10 years of running cost</title>
<desc id="wwc-desc">Illustrative stacked bar chart of well water treatment system cost for four profiles: hard only about $3,250, hard plus iron about $5,150, acidic plus iron about $8,080, and bacteria plus iron plus sulfur about $9,680 over ten years, split into equipment, installation and running cost.</desc>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Well water treatment cost by profile, over 10 years</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative. Equipment from dated store prices; installation at the middle of each range.</text>
<rect x="30" y="84" width="16" height="16" fill="#3a5a72"/><text x="54" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Equipment</text>
<rect x="170" y="84" width="16" height="16" fill="#0b2f4a"/><text x="194" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Installation</text>
<rect x="320" y="84" width="16" height="16" fill="#78716c"/><text x="344" y="97" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Running cost, 10 years</text>
<text x="30" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">1. Hard only</text>
<text x="30" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">sediment + softener</text>
<rect x="250" y="130" width="40.0" height="32" fill="#3a5a72"/>
<rect x="290.0" y="130" width="28.0" height="32" fill="#0b2f4a"/>
<rect x="318.0" y="130" width="62.0" height="32" fill="#78716c"/>
<text x="390.0" y="152" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">$3,250</text>
<text x="250" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Equipment $1,000 · install $700 · running $155 a year</text>
<text x="30" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2. Hard + iron</text>
<text x="30" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">iron filter + softener</text>
<rect x="250" y="226" width="88.0" height="32" fill="#3a5a72"/>
<rect x="338.0" y="226" width="44.0" height="32" fill="#0b2f4a"/>
<rect x="382.0" y="226" width="74.0" height="32" fill="#78716c"/>
<text x="466.0" y="248" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">$5,150</text>
<text x="250" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Equipment $2,200 · install $1,100 · running $185 a year</text>
<text x="30" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">3. Acidic + iron</text>
<text x="30" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">neutralizer + iron filter + softener</text>
<rect x="250" y="322" width="117.2" height="32" fill="#3a5a72"/>
<rect x="367.2" y="322" width="58.0" height="32" fill="#0b2f4a"/>
<rect x="425.2" y="322" width="148.0" height="32" fill="#78716c"/>
<text x="583.2" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">$8,080</text>
<text x="250" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Equipment $2,930 · install $1,450 · running $370 a year</text>
<text x="30" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">4. Bacteria + iron + sulfur</text>
<text x="30" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">iron-sulfur filter + softener + UV</text>
<rect x="250" y="418" width="127.2" height="32" fill="#3a5a72"/>
<rect x="377.2" y="418" width="70.0" height="32" fill="#0b2f4a"/>
<rect x="447.2" y="418" width="190.0" height="32" fill="#78716c"/>
<text x="647.2" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">$9,680</text>
<text x="250" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Equipment $3,180 · install $1,750 · running $475 a year</text>
<text x="30" y="520" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52697a">Running cost covers salt, calcite, UV lamp and power, cartridges and a media reserve. Salt at $0.20 a lb.</text>
<text x="30" y="538" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52697a">Each profile is a starting point; your lab test sets the real bill of equipment.</text>
</svg>