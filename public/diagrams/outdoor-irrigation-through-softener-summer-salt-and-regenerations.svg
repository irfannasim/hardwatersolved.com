<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="oisr-title oisr-desc">
<title id="oisr-title">Outdoor irrigation through a water softener: extra regenerations and salt in one summer</title>
<desc id="oisr-desc">Illustrative worked example: sending lawn irrigation through a water softener raises a 20-week summer from 21 to 37 regenerations and from 168 to 293 lb of salt, and adds about 25 lb of sodium to the lawn.</desc>
<defs></defs>
<rect width="760" height="460" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Watering the lawn through the softener: one summer</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Worked example (calculated, illustrative): 15 gpg, 240 gal/day indoors, 2,000 sq ft lawn</text><text x="30" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">watered 1 inch a week for 20 weeks, 24,000 grains and 8 lb of salt per regeneration</text><text x="30" y="122" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Regenerations in 20 weeks</text><text x="30" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Outdoor taps on hard branch</text><rect x="270" y="137" width="231" height="26" rx="3" fill="#3a5a72"/><text x="509" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">21</text><text x="30" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Outdoor taps through softener</text><rect x="270" y="177" width="231" height="26" rx="3" fill="#3a5a72"/><rect x="501" y="177" width="176" height="26" rx="3" fill="#dc2626"/><text x="685" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">37</text><text x="30" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Salt used in 20 weeks (lb)</text><text x="30" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Outdoor taps on hard branch</text><rect x="270" y="267" width="235.2" height="26" rx="3" fill="#3a5a72"/><text x="513.2" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">168</text><text x="30" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Outdoor taps through softener</text><rect x="270" y="307" width="235.2" height="26" rx="3" fill="#3a5a72"/><rect x="505.2" y="307" width="175" height="26" rx="3" fill="#dc2626"/><text x="688.2" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">293</text><text x="30" y="378" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">The red share goes on the lawn: about 16 extra regenerations, 125 lb of salt</text><text x="30" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">and 780 gallons of regeneration water, plus about 25 lb of sodium added to the soil.</text><rect x="30" y="428" width="26" height="12" rx="2" fill="#3a5a72"/><text x="64" y="439" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">indoor use</text><rect x="190" y="428" width="26" height="12" rx="2" fill="#dc2626"/><text x="224" y="439" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">irrigation passing through the softener</text>
</svg>
