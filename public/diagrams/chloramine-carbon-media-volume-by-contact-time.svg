<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="cmv-title cmv-desc">
<title id="cmv-title">Chloramine water softener pretreatment: carbon media volume by contact time</title>
<desc id="cmv-desc">Illustrative bar chart of the carbon media needed at an 8 gpm peak: 1.6 cubic feet for free chlorine, 3.2 cubic feet of catalytic carbon for chloramine, and 10.7 cubic feet if standard carbon needs a 10-minute contact time for chloramine.</desc>
<defs></defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Carbon needed for chloramine vs free chlorine</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Media volume for an 8 gpm peak: cubic feet = gpm × contact minutes ÷ 7.48</text><path d="M250,102 L250,370" stroke="#0b2f4a" stroke-width="1.5"/><text x="250" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><path d="M330,102 L330,370" stroke="#e2e8f0" stroke-width="1"/><text x="330" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2</text><path d="M410,102 L410,370" stroke="#e2e8f0" stroke-width="1"/><text x="410" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4</text><path d="M490,102 L490,370" stroke="#e2e8f0" stroke-width="1"/><text x="490" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6</text><path d="M570,102 L570,370" stroke="#e2e8f0" stroke-width="1"/><text x="570" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">8</text><path d="M650,102 L650,370" stroke="#e2e8f0" stroke-width="1"/><text x="650" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10</text><text x="470" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">cubic feet of media</text><text x="30" y="136" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Free chlorine,</text><text x="30" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">standard carbon</text><rect x="250" y="118" width="64.2" height="44" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/><text x="326.2" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">1.6 cu ft</text><text x="326.2" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">1.5 min contact</text><text x="30" y="226" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Chloramine,</text><text x="30" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">catalytic carbon</text><rect x="250" y="208" width="128.3" height="44" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/><text x="390.3" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">3.2 cu ft</text><text x="390.3" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">3 min contact</text><text x="30" y="316" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Chloramine,</text><text x="30" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">standard carbon</text><rect x="250" y="298" width="427.8" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="262" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">10.7 cu ft  (10 min contact)</text><text x="30" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Catalytic media is what makes chloramine removal fit in a household-size tank.</text><text x="30" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Contact times: typical free chlorine rating; double for catalytic carbon; WQA’s</text><text x="30" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">‘10 minutes or greater’ for standard carbon. Illustrative: check your media’s own data.</text>
</svg>
