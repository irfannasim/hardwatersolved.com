<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="wmf-title wmf-desc">
<title id="wmf-title">Where to flush after a water main break: a tap ahead of the water softener</title>
<desc id="wmf-desc">Plumbing layout after a water main break: water from the repaired main passes the meter and main shutoff, the water softener sits idle in bypass, and the first dirty water is flushed from a hose bib ahead of the softener until it runs clear.</desc>
<defs><marker id="wmf-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="wmf-w" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Flush the returning water before it reaches the softener</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Softener in bypass; flush from the first tap after the meter until the water runs clear.</text><rect class="box" x="30" y="170" width="110" height="60" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="85" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water main</text><text x="85" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">after repair</text><path class="ln" d="M144,200 L170,200" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmf-h)"/><rect class="box" x="180" y="175" width="80" height="50" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="220" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Meter</text><path class="ln" d="M264,200 L290,200" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmf-h)"/><rect class="box" x="300" y="175" width="92" height="50" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="346" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Main</text><text x="346" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">shutoff</text><path class="ln" d="M396,200 L430,200" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmf-h)"/><rect class="box" x="440" y="170" width="130" height="60" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="505" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Bypass valve</text><text x="505" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#3a5a72">set to BYPASS</text><path class="ln" d="M574,200 L598,200" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmf-h)"/><rect class="box" x="608" y="170" width="122" height="60" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="669" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House taps</text><text x="669" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">hard water</text><rect class="box" x="455" y="72" width="100" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="505" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">Softener</text><text x="505" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">no flow</text><path class="ln" d="M480,132 L480,166" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path class="ln" d="M530,132 L530,166" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path class="ln" d="M414,204 L414,288" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmf-h)"/><rect class="box" x="334" y="296" width="160" height="58" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="2"/><text x="414" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Hose bib ahead</text><text x="414" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">of the softener</text><path class="ln" d="M498,325 L556,325" fill="none" stroke="#78716c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmf-w)"/><rect class="box" x="566" y="296" width="164" height="58" rx="8" fill="#f5f5f4" stroke="#78716c" stroke-width="2"/><text x="648" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Run to the yard</text><text x="648" y="339" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">until it runs clear</text><text x="30" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">The first water back</text><text x="30" y="279" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">carries grit, air and</text><text x="30" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">rust knocked loose</text><text x="30" y="313" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">by the break.</text><rect class="box" x="30" y="384" width="700" height="96" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="408" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Order of flushing</text><text x="46" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">1  Leave the softener in bypass while the house fills and the air is bled out.</text><text x="46" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">2  Run the tap closest to the meter, ideally a hose bib teed in ahead of the softener, until a white cup fills clear.</text><text x="46" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">3  Flush the house taps too. They get hard, unsoftened water until you reconnect.</text><rect x="30" y="502" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Untreated supply water</text><rect x="240" y="502" width="26" height="6" rx="3" fill="#78716c"/><text x="274" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Flush water to waste</text><rect x="430" y="502" width="26" height="6" rx="3" fill="#cbd5e1"/><text x="464" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">No flow (bypassed)</text>
</svg>
