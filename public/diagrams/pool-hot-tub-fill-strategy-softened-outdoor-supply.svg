<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="pfs-title pfs-desc">
<title id="pfs-title">Fill strategy for a pool or hot tub when the outdoor supply is softened</title>
<desc id="pfs-desc">Decision chart. If there is an unsoftened outdoor tap, fill from it. If not, put the softener in bypass for the fill if the bypass valve allows it. If neither is possible, fill softened, then test calcium hardness and raise it with calcium chloride, or bring in delivered water for a large pool. After any fill, test calcium hardness, alkalinity and pH.</desc>
<defs><marker id="pfs-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Filling when the only outdoor water is softened</text>
<g font-family="Arial, Helvetica, sans-serif">
<rect class="box" x="30" y="66" width="380" height="50" rx="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/>
<text x="220" y="96" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="middle">Any unsoftened outdoor tap?</text>
<rect class="box" x="480" y="66" width="250" height="50" rx="6" fill="#ecfdf3" stroke="#15803d" stroke-width="2"/>
<text x="605" y="96" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Fill from it</text>
<rect class="box" x="30" y="162" width="380" height="50" rx="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/>
<text x="220" y="192" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="middle">Can the softener go to bypass for the fill?</text>
<rect class="box" x="480" y="150" width="250" height="74" rx="6" fill="#ecfdf3" stroke="#15803d" stroke-width="2"/>
<text x="605" y="178" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Bypass, fill, then</text>
<text x="605" y="200" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">return it to service</text>
<rect class="box" x="30" y="258" width="380" height="50" rx="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/>
<text x="220" y="288" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="middle">Hot tub or pool?</text>
<rect class="box" x="30" y="352" width="210" height="84" rx="6" fill="#e6f4f7" stroke="#0e7490" stroke-width="2"/>
<text x="135" y="378" font-size="14" font-weight="bold" fill="#0e7490" text-anchor="middle">Hot tub</text>
<text x="135" y="400" font-size="13" fill="#0b2f4a" text-anchor="middle">Fill softened, add about</text>
<text x="135" y="419" font-size="13" fill="#0b2f4a" text-anchor="middle">1 lb calcium chloride</text>
<rect class="box" x="270" y="352" width="210" height="84" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="375" y="378" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">Pool</text>
<text x="375" y="400" font-size="13" fill="#0b2f4a" text-anchor="middle">Tens of pounds of calcium</text>
<text x="375" y="419" font-size="13" fill="#0b2f4a" text-anchor="middle">chloride, or water delivery</text>
<rect class="box" x="510" y="352" width="220" height="84" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="620" y="378" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="middle">Vinyl or acrylic?</text>
<text x="620" y="400" font-size="13" fill="#0b2f4a" text-anchor="middle">No plaster to etch. Follow</text>
<text x="620" y="419" font-size="13" fill="#0b2f4a" text-anchor="middle">the maker's range</text>
<rect class="box" x="30" y="470" width="700" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="380" y="497" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="middle">After every fill: test calcium hardness, alkalinity and pH, then balance</text>
</g>
<g stroke="#3a5a72" stroke-width="2.5" fill="none" marker-end="url(#pfs-ah)">
<line class="ln" x1="410" y1="91" x2="474" y2="91"/>
<line class="ln" x1="220" y1="116" x2="220" y2="156"/>
<line class="ln" x1="410" y1="187" x2="474" y2="187"/>
<line class="ln" x1="220" y1="212" x2="220" y2="252"/>
<line class="ln" x1="135" y1="330" x2="135" y2="346"/>
<line class="ln" x1="375" y1="330" x2="375" y2="346"/>
</g>
<g stroke="#3a5a72" stroke-width="2.5" fill="none">
<line class="ln" x1="220" y1="308" x2="220" y2="330"/>
<line class="ln" x1="135" y1="330" x2="375" y2="330"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">
<text x="428" y="82">Yes</text>
<text x="428" y="178">Yes</text>
<text x="230" y="142">No</text>
<text x="230" y="238">No</text>
</g>
<text x="30" y="544" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Calcium chloride amounts: calculated for a 400 gal tub and a 15,000 gal pool starting near 0 ppm.</text>
</svg>
