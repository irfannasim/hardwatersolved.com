<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="grv-title grv-desc">
<title id="grv-title">Converting a water softener grain rating to resin volume and usable capacity</title>
<desc id="grv-desc">Conversion from box grain rating to resin volume by dividing by about 32,000 grains per cubic foot, then to usable capacity at 6 lb of salt per cubic foot by multiplying by 22,930. 24,000 grains is 0.75 cubic feet and 17,200 grains; 32,000 is 1 cubic foot and 22,930; 48,000 is 1.5 and 34,400; 64,000 is 2 and 45,860; 80,000 is 2.5 and about 57,300.</desc>
<defs><marker id="grv-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">From the grain rating to the resin, then to your capacity</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Compare softeners on resin volume, then work out capacity at the salt dose you will run</text>
<text x="125" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Box rating</text>
<text x="375" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Resin volume</text>
<text x="635" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Usable at 6 lb/cu ft</text>
<text x="250" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">÷ ~32,000</text>
<text x="500" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">× 22,930</text>
<rect class="box" x="40" y="146" width="170" height="36" rx="5" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="125" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">24,000</text>
<path class="ln" d="M214,164 L284,164" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="290" y="146" width="170" height="36" rx="5" fill="#f6ead2" stroke="#3a5a72" stroke-width="1.5"/>
<text x="375" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">0.75 cu ft</text>
<path class="ln" d="M464,164 L534,164" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="540" y="146" width="190" height="36" rx="5" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="635" y="170" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">17,200</text>
<rect class="box" x="40" y="198" width="170" height="36" rx="5" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="125" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">32,000</text>
<path class="ln" d="M214,216 L284,216" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="290" y="198" width="170" height="36" rx="5" fill="#f6ead2" stroke="#3a5a72" stroke-width="1.5"/>
<text x="375" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1 cu ft</text>
<path class="ln" d="M464,216 L534,216" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="540" y="198" width="190" height="36" rx="5" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="635" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">22,930</text>
<rect class="box" x="40" y="250" width="170" height="36" rx="5" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="125" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">48,000</text>
<path class="ln" d="M214,268 L284,268" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="290" y="250" width="170" height="36" rx="5" fill="#f6ead2" stroke="#3a5a72" stroke-width="1.5"/>
<text x="375" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1.5 cu ft</text>
<path class="ln" d="M464,268 L534,268" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="540" y="250" width="190" height="36" rx="5" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="635" y="274" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">34,400</text>
<rect class="box" x="40" y="302" width="170" height="36" rx="5" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="125" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">64,000</text>
<path class="ln" d="M214,320 L284,320" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="290" y="302" width="170" height="36" rx="5" fill="#f6ead2" stroke="#3a5a72" stroke-width="1.5"/>
<text x="375" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2 cu ft</text>
<path class="ln" d="M464,320 L534,320" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="540" y="302" width="190" height="36" rx="5" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="635" y="326" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">45,860</text>
<rect class="box" x="40" y="354" width="170" height="36" rx="5" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<text x="125" y="378" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">80,000</text>
<path class="ln" d="M214,372 L284,372" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="290" y="354" width="170" height="36" rx="5" fill="#f6ead2" stroke="#3a5a72" stroke-width="1.5"/>
<text x="375" y="378" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2.5 cu ft</text>
<path class="ln" d="M464,372 L534,372" stroke="#0b2f4a" stroke-width="3" fill="none" marker-end="url(#grv-a)"/>
<rect class="box" x="540" y="354" width="190" height="36" rx="5" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="635" y="378" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">about 57,300</text>
<text x="30" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">0.75 to 2 cu ft rows from Hellenbrand's table; the 2.5 cu ft row is calculated at the same rate.</text>
<text x="30" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Some brands rate at other salt doses, so confirm the resin volume on the spec sheet.</text>
</svg>
