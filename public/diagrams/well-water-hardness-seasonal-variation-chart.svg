<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="wss-title wss-desc">
<title id="wss-title">Well water hardness seasonal variation over twelve months (illustrative)</title>
<desc id="wss-desc">Illustrative line chart for a shallow bedrock well: hardness falls to 12 gpg in April at peak recharge and rises to an annual maximum of 21 gpg in September, with dissolved iron following the same pattern, which is why a softener is sized on the high end.</desc>
<defs></defs>
<rect width="760" height="420" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Well water hardness across one year (illustrative)</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative profile for a shallow bedrock well, not a measurement from your well.</text><path d="M90,340 L700,340" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">10</text><path d="M90,273.3333333333333 L700,273.3333333333333" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="278.3333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">14</text><path d="M90,206.66666666666666 L700,206.66666666666666" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="211.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">18</text><path d="M90,140 L700,140" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="145" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">22</text><text x="708" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#b45309">0.0</text><text x="708" y="278.3333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#b45309">0.8</text><text x="708" y="211.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#b45309">1.6</text><text x="708" y="144.99999999999997" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#b45309">2.4</text><text x="80" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#c2410c">gpg</text><text x="740" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#b45309">iron ppm</text><path d="M90,156.66666666666666 L700,156.66666666666666" stroke="#0b2f4a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="96" y="148.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Size on the high end of the 12–21 gpg range</text><polyline points="110,223.33333333333331 162,215 214,248.33333333333331 266,273.3333333333333 318,265 370,248.33333333333331 422,231.66666666666666 474,206.66666666666666 526,198.33333333333331 578,215 630,231.66666666666666 682,223.33333333333331" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5"/><polyline points="110,190 162,190 214,256.66666666666663 266,306.6666666666667 318,290 370,256.66666666666663 422,223.33333333333331 474,173.33333333333331 526,156.66666666666666 578,190 630,223.33333333333331 682,206.66666666666666" fill="none" stroke="#c2410c" stroke-width="4" stroke-linejoin="round"/><circle cx="110" cy="190" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><circle cx="162" cy="190" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><circle cx="214" cy="256.66666666666663" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><circle cx="266" cy="306.6666666666667" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><circle cx="318" cy="290" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><circle cx="370" cy="256.66666666666663" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><circle cx="422" cy="223.33333333333331" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><circle cx="474" cy="173.33333333333331" r="4.5" fill="#c2410c" stroke="#ffffff" stroke-width="1.5"/><circle cx="526" cy="156.66666666666666" r="4.5" fill="#c2410c" st