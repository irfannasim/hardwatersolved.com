rif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Dec</text><text x="526" y="142.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">21 gpg: annual maximum</text><text x="280" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">12 gpg: peak recharge, maximum dilution</text><rect x="30" y="392" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hardness (gpg)</text><path d="M220,395 L246,395" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5"/><text x="254" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">dissolved iron (ppm): tracks hardness here</text>
</svg>
