<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="g4st-title g4st-desc">
<title id="g4st-title">Hydrogen sulfide treatment order ahead of a water softener</title>
<desc id="g4st-desc">Treatment order for hydrogen sulfide: well, then an oxidiser, a filter and carbon, all installed ahead of the water softener so the resin never sees sulfide or oxidiser.</desc>
<defs><marker id="g4st-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4st-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="g4st-ao" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="g4st-af" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="460" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Sulfide treatment goes ahead of the softener</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Any oxidiser strong enough to destroy sulfide will destroy resin too.</text><rect class="box" x="30" y="150" width="95" height="50" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="77.5" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">WELL</text><path class="ln" d="M125,175 L147,175" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4st-ah)"/><rect class="box" x="151" y="150" width="95" height="50" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="198.5" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">OXIDISER</text><path class="ln" d="M246,175 L268,175" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4st-ah)"/><rect class="box" x="272" y="150" width="95" height="50" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="319.5" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">FILTER</text><path class="ln" d="M367,175 L389,175" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4st-ah)"/><rect class="box" x="393" y="150" width="95" height="50" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="440.5" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">CARBON</text><path class="ln" d="M488,175 L510,175" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4st-ah)"/><rect class="box" x="514" y="150" width="95" height="50" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="561.5" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><path class="ln" d="M609,175 L631,175" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4st-as)"/><rect class="box" x="635" y="150" width="95" height="50" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="682.5" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">HOUSE</text><path class="ln" d="M151,136 L151,126 L488,126 L488,136" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="319" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">sulfide treatment: always ahead of the softener</text><text x="198" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">chlorine or</text><text x="198" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">another oxidiser</text><text x="440" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">usually needed</text><rect class="box" x="30" y="262" width="700" height="86" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><circle cx="52" cy="286" r="11" fill="#0b2f4a"/><text x="52" y="290.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="72" y="291" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sulfide corrodes and fouls resin. Removing it upstream extends the life of the bed.</text><circle cx="52" cy="322" r="11" fill="#0b2f4a"/><text x="52" y="326.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="72" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">An oxidiser also destroys resin, so a filter, and usually carbon, must sit between</text><text x="72" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the oxidiser and the softener.</text><text x="30" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Wrong order</text><rect class="box" x="30" y="398" width="95" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="77" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">WELL</text><rect class="box" x="160" y="398" width="95" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="207" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">OXIDISER</text><rect class="box" x="290" y="398" width="95" height="40" rx="8" fill="#f1f5f9" stroke="#dc2626" stroke-width="2"/><text x="337" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">SOFTENER</text><path class="ln" d="M125,418 L156,418" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4st-ao)"/><path class="ln" d="M255,418 L286,418" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4st-af)"/><text x="404" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">no filter or carbon between them:</text><text x="404" y="433" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">can ruin a new resin bed in a season</text>
</svg>
