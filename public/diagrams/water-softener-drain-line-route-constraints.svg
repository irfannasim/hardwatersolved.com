<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="drc-title drc-desc">
<title id="drc-title">Water softener drain line requirements along one route: size, length, lift, support and air gap</title>
<desc id="drc-desc">Water softener drain line requirements diagram. The drain line leaves the control valve through the drain line flow control, rises to ceiling height, runs across supported by hangers, drops to a standpipe and ends above the flood rim with an air gap. Five numbered limits apply along the route.</desc>
<defs>
<pattern id="drc-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern>
<marker id="drc-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
<marker id="drc-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="760" height="640" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Five limits along one drain line</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Limits 1 to 4 all spend the same valve pressure. Limit 5 protects the water supply.</text>
<path class="ln" d="M230,84 L660,84" fill="none" stroke="#cbd5e1" stroke-width="3"/>
<text x="664" y="89" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">ceiling</text>
<path class="ln" d="M330,86 L330,116 M500,86 L500,116" fill="none" stroke="#3a5a72" stroke-width="2"/>
<rect x="30" y="440" width="700" height="3" fill="#cbd5e1"/>
<rect x="60" y="220" width="80" height="220" rx="18" fill="url(#drc-beads)" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="36" y="172" width="126" height="46" rx="8" fill="#0b2f4a"/>
<text x="99" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text>
<text x="100" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">softener</text>
<rect x="162" y="182" width="12" height="16" rx="2" fill="#0b2f4a"/>
<path class="ln" d="M174,190 L250,190 L250,120 L600,120 L600,300" fill="none" stroke="#78716c" stroke-width="6" stroke-linejoin="round" marker-end="url(#drc-a)"/>
<text x="266" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">drain line flow control</text>
<path class="ln" d="M262,214 L178,198" fill="none" stroke="#52697a" stroke-width="1.2"/>
<rect x="580" y="340" width="40" height="100" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<rect x="582" y="404" width="36" height="34" fill="#dbeafe"/>
<text x="600" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">standpipe</text>
<text x="570" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">flood rim</text>
<path class="ln" d="M614,312 L648,312 M624,340 L648,340" fill="none" stroke="#52697a" stroke-width="1.2"/>
<path class="ln" d="M640,318 L640,334" fill="none" stroke="#0e7490" stroke-width="2" marker-end="url(#drc-d)" marker-start="url(#drc-d)"/>
<circle cx="205" cy="166" r="13" fill="#0b2f4a"/>
<text x="205" y="171" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="415" cy="100" r="13" fill="#0b2f4a"/>
<text x="415" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="280" cy="160" r="13" fill="#0b2f4a"/>
<text x="280" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="536" cy="100" r="13" fill="#0b2f4a"/>
<text x="536" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="676" cy="326" r="13" fill="#0e7490"/>
<text x="676" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="300" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#78716c">drain line</text>
<text x="300" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">pushed by valve pressure</text>
<rect class="box" x="30" y="484" width="345" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect class="box" x="385" y="484" width="345" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="508" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">1 Size</text>
<text x="104" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">1/2 in ID minimum; 3/4 in above 7 gpm</text>
<text x="46" y="550" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2 Length</text>
<text x="118" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">friction grows with every foot;</text>
<text x="118" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">a wider tube cuts it sharply</text>
<text x="46" y="600" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">3 Lift</text>
<text x="104" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">about 0.43 psi per foot of rise</text>
<text x="401" y="508" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">4 Support</text>
<text x="482" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">no bellies, kinks or tight bends</text>
<text x="401" y="550" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">5 Air gap</text>
<text x="478" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">tube end above the flood rim,</text>
<text x="478" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">2 x diameter, at least 1 in (Fleck)</text>
<text x="401" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Sizes vary by valve: check your manual</text>
</svg>
