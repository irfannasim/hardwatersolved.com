<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="ir-title ir-desc">
<title id="ir-title">Water softener iron capture and release: brown water after regeneration</title>
<desc id="ir-desc">Diagram of how a water softener captures dissolved iron in service and, when the backwash flow is too weak, leaves it loosened in the tank so the first water drawn after regeneration comes out brown.</desc>
<defs><marker id="ir-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ir-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ir-iron" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ir-drain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="ir-thard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ir-tsoft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ir-tiron" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="ir-tdrain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="ir-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brown water after regeneration: where the iron goes</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Iron captured in service must leave during backwash. If it doesn't, the house gets it.</text><text x="30" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">1 · Service</text><rect x="132" y="166" width="16" height="14" fill="#3a5a72"/><rect x="100" y="178" width="80" height="222" rx="22" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><rect x="104" y="214" width="72" height="180" rx="18" fill="url(#ir-beads)"/><rect x="90" y="132" width="100" height="34" rx="6" fill="#0b2f4a"/><text x="140" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text><path class="ln" d="M30,145 L84,145" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-hard)"/><path class="ln" d="M190,145 L244,145" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-soft)"/><text x="250" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#0e7490">to house: soft</text><path class="ln" d="M190,160 L226,160 L226,226" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="214,238 238,238 232,248 220,248" fill="#cbd5e1"/><path class="ln" d="M126,222 L126,372" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-hard)"/><path class="ln" d="M154,222 L154,372" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-hard)"/><circle cx="114" cy="240" r="3.5" fill="#b45309"/><circle cx="140" cy="250" r="3.5" fill="#b45309"/><circle cx="168" cy="236" r="3.5" fill="#b45309"/><circle cx="112" cy="290" r="3.5" fill="#b45309"/><circle cx="140" cy="300" r="3.5" fill="#b45309"/><circle cx="168" cy="286" r="3.5" fill="#b45309"/><circle cx="140" cy="346" r="3.5" fill="#b45309"/><circle cx="114" cy="360" r="3.5" fill="#b45309"/><circle cx="168" cy="356" r="3.5" fill="#b45309"/><text x="30" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fe²⁺ is captured on the</text><text x="30" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">resin with calcium and</text><text x="30" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">magnesium.</text><text x="280" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">2 · Weak backwash</text><rect x="382" y="166" width="16" height="14" fill="#3a5a72"/><rect x="350" y="178" width="80" height="222" rx="22" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><rect x="354" y="214" width="72" height="180" rx="18" fill="url(#ir-beads)"/><rect x="340" y="132" width="100" height="34" rx="6" fill="#0b2f4a"/><text x="390" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text><path class="ln" d="M280,145 L334,145" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-hard)"/><path class="ln" d="M440,145 L494,145" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M440,160 L476,160 L476,226" fill="none" stroke="#78716c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-tdrain)"/><polygon points="464,238 488,238 482,248 470,248" fill="#78716c"/><text x="476" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#78716c">little</text><text x="476" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#78716c">reaches</text><text x="476" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#78716c">drain</text><path class="ln" d="M376,386 L376,226" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-hard)"/><path class="ln" d="M404,386 L404,226" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-hard)"/><circle cx="364" cy="196" r="3.5" fill="#b45309"/><circle cx="390" cy="192" r="3.5" fill="#b45309"/><circle cx="416" cy="200" r="3.5" fill="#b45309"/><circle cx="364" cy="262" r="3.5" fill="#b45309"/><circle cx="390" cy="300" r="3.5" fill="#b45309"/><circle cx="418" cy="330" r="3.5" fill="#b45309"/><circle cx="364" cy="352" r="3.5" fill="#b45309"/><text x="280" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flow too low: the bed</text><text x="280" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">never expands. Iron is</text><text x="280" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">loosened, not removed.</text><text x="530" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">3 · First draw after</text><rect x="632" y="166" width="16" height="14" fill="#3a5a72"/><rect x="600" y="178" width="80" height="222" rx="22" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><rect x="604" y="214" width="72" height="180" rx="18" fill="url(#ir-beads)"/><rect x="590" y="132" width="100" height="34" rx="6" fill="#0b2f4a"/><text x="640" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text><path class="ln" d="M530,145 L584,145" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-hard)"/><path class="ln" d="M690,145 L744,145" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ir-iron)"/><text x="750" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#b45309">to house: BROWN</text><path class="ln" d="M690,160 L726,160 L726,226" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="714,238 738,238 732,248 720,248" fill="#cbd5e1"/><circle cx="614" cy="196" r="3.5" fill="#b45309"/><circle cx="666" cy="198" r="3.5" fill="#b45309"/><circle cx="618" cy="232" r="3.5" fill="#b45309"/><circle cx="664" cy="238" r="3.5" fill="#b45309"/><circle cx="614" cy="300" r="3.5" fill="#b45309"/><circle cx="668" cy="330" r="3.5" fill="#b45309"/><text x="530" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">The first tap opened</text><text x="530" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">draws the loose iron out.</text><text x="530" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">It clears in minutes.</text><rect class="box" x="30" y="496" width="700" height="60" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="46" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan fill="#15803d" font-weight="bold">Fix:</tspan> an adequate backwash lifts the bed and carries the loosened iron to drain.</text><text x="46" y="540" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Inside the bed, some Fe²⁺ also oxidises to ferric rust, which exchange cannot remove.</text><rect x="30" y="579" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="587" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water</text><rect x="150" y="579" width="26" height="6" rx="3" fill="#0e7490"/><text x="184" y="587" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">soft water</text><circle cx="278" cy="582" r="6" fill="#b45309"/><text x="304" y="587" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">iron / brown water</text><rect x="450" y="579" width="26" height="6" rx="3" fill="#78716c"/><text x="484" y="587" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><rect x="560" y="579" width="26" height="6" rx="3" fill="#cbd5e1"/><text x="594" y="587" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">not flowing</text>
</svg>
