<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="g4ss-title g4ss-desc">
<title id="g4ss-title">Sulfur smell after a water softener: source map from well to tap</title>
<desc id="g4ss-desc">Map of where a sulfur smell after a water softener can start: the well or aquifer, the pressure tank, the softener resin bed or the water heater anode, with the pre-softener, cold and hot taps used for the smell test.</desc>
<defs><marker id="g4ss-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="580" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where a rotten-egg smell can start</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Smell a glass from three taps. Which ones smell points to the source.</text><rect class="box" x="30" y="132" width="110" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="85" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">WELL</text><text x="85" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">aquifer</text><rect class="box" x="175" y="132" width="140" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="245" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">PRESSURE TANK</text><rect class="box" x="395" y="132" width="130" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="460" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><text x="460" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">resin bed</text><rect class="box" x="610" y="132" width="120" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="670" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">COLD TAPS</text><rect class="box" x="395" y="300" width="130" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="460" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">WATER HEATER</text><text x="460" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">magnesium anode</text><rect class="box" x="610" y="300" width="120" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="670" y="333" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">HOT TAPS</text><path class="ln" d="M140,160 L175,160" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M315,160 L395,160" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M525,160 L606,160" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4ss-as)"/><path class="ln" d="M560,160 L560,270 L460,270 L460,296" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4ss-as)"/><path class="ln" d="M525,328 L606,328" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4ss-as)"/><path class="ln" d="M355,160 L355,212" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/><path d="M344,218 L366,218 L363,246 L347,246 Z" fill="#dbeafe" stroke="#3a5a72" stroke-width="1.5"/><text x="355" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">pre-softener tap</text><path d="M659,196 L681,196 L678,224 L662,224 Z" fill="#dbeafe" stroke="#3a5a72" stroke-width="1.5"/><path d="M659,364 L681,364 L678,392 L662,392 Z" fill="#dbeafe" stroke="#3a5a72" stroke-width="1.5"/><circle cx="128" cy="116" r="12" fill="#dc2626"/><text x="128" y="120.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="303" cy="116" r="12" fill="#dc2626"/><text x="303" y="120.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="513" cy="116" r="12" fill="#dc2626"/><text x="513" y="120.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="513" cy="286" r="12" fill="#dc2626"/><text x="513" y="290.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><rect class="box" x="30" y="300" width="330" height="96" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Smell test result</text><text x="46" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hot only → water heater (4)</text><text x="46" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Not at pre-softener tap → softener (3)</text><text x="46" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Every tap, pre-softener too → 1 or 2</text><circle cx="42" cy="432" r="10" fill="#dc2626"/><text x="42" y="436.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="60" y="437" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Well / aquifer: dissolved sulfide, about constant; worse in heavy use or when the pump runs</text><circle cx="42" cy="458" r="10" fill="#dc2626"/><text x="42" y="462.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="60" y="463" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pressure tank: rarely drained, dark and low in oxygen, a bacterial habitat</text><circle cx="42" cy="484" r="10" fill="#dc2626"/><text x="42" y="488.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="60" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Resin bed: sulfate-reducing bacteria; worst on the first draw after standing</text><circle cx="42" cy="510" r="10" fill="#dc2626"/><text x="42" y="514.32" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="60" y="515" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water heater: magnesium anode reacting with sulfate and bacteria; hot taps only</text><rect x="30" y="553" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">before the softener</text><rect x="230" y="553" width="26" height="6" rx="3" fill="#0e7490"/><text x="264" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">after the softener</text><rect x="430" y="549" width="26" height="14" rx="3" fill="#dc2626" stroke="#3a5a72" stroke-width="1"/><text x="464" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">possible sulfide source</text>
</svg>
