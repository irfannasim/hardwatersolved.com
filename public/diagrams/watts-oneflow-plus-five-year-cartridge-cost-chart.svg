<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="ofc-title ofc-desc">
<title id="ofc-title">Watts OneFlow Plus five-year cartridge cost for two and four people</title>
<desc id="ofc-desc">Illustrative step chart of cumulative Watts OneFlow Plus replacement cartridge spending over 60 months: about $1,373 for two people and $2,746 for four, because the 50,000-gallon carbon block and the 250,000-gallon OneFlow cartridge run out by gallons before their calendar dates.</desc>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0b2f4a">OneFlow Plus: five years of replacement cartridges</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Cumulative cartridge spend, excluding the system itself. Illustrative.</text>
<path d="M30,96 L60,96" stroke="#0b2f4a" stroke-width="4" fill="none"/><text x="68" y="101" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">4 people, 300 gal/day</text>
<path d="M230,96 L260,96" stroke="#0e7490" stroke-width="4" fill="none"/><text x="268" y="101" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">2 people, 150 gal/day</text>
<circle cx="45" cy="124" r="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2.5"/><text x="68" y="129" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">OneFlow cartridge change; other steps are carbon blocks</text>
<path d="M90,460 L600,460" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="80" y="465" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$0</text>
<path d="M90,360 L600,360" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="80" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$1,000</text>
<path d="M90,260 L600,260" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="80" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$2,000</text>
<path d="M90,160 L600,160" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="80" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$3,000</text>
<path d="M90,160 L90,460" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="90" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Install</text>
<text x="192" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1 yr</text>
<text x="294" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">2 yr</text>
<text x="396" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">3 yr</text>
<text x="498" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">4 yr</text>
<text x="600" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">5 yr</text>
<path class="ln" d="M90,460 L136.6,460 L136.6,440.8 L183.2,440.8 L183.2,421.7 L229.7,421.7 L229.7,402.5 L276.3,402.5 L276.3,383.4 L322.9,383.4 L322.9,364.2 L322.9,364.2 L322.9,322.7 L369.5,322.7 L369.5,303.5 L416,303.5 L416,284.4 L462.6,284.4 L462.6,265.2 L509.2,265.2 L509.2,246.1 L555.8,246.1 L555.8,226.9 L555.8,226.9 L555.8,185.4 L600,185.4" fill="none" stroke="#0b2f4a" stroke-width="4" stroke-linejoin="round"/>
<circle cx="322.9" cy="322.7" r="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2.5"/>
<circle cx="555.8" cy="185.4" r="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2.5"/>
<text x="612" y="190.4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">4 people: $2,746</text>
<path class="ln" d="M90,460 L183.2,460 L183.2,440.8 L276.3,440.8 L276.3,421.7 L369.5,421.7 L369.5,402.5 L396,402.5 L396,361 L462.6,361 L462.6,341.9 L555.8,341.9 L555.8,322.7 L600,322.7" fill="none" stroke="#0e7490" stroke-width="4" stroke-linejoin="round"/>
<circle cx="396" cy="361" r="6" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<text x="612" y="327.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0e7490">2 people: $1,373</text>
<text x="30" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Carbon block: 50,000 gal or yearly. OneFlow cartridge: 250,000 gal or 3 years. Whichever comes first.</text>
<text x="30" y="538" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Prices: carbon block $191.60, OneFlow cartridge $414.99 (Zoro, 2 October 2026).</text>
</svg>
