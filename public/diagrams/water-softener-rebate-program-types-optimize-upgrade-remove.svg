<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" role="img" aria-labelledby="wrt-title wrt-desc">
<title id="wrt-title">Water softener rebate program types: optimize, upgrade and remove</title>
<desc id="wrt-desc">Three kinds of water softener rebate program run by local utilities: paying to optimize an existing softener, paying to replace a timer unit with a demand-initiated one, and paying to remove a salt-based softener, with Minnesota and California examples. No federal energy tax credit applies.</desc>
<defs></defs>
<rect width="760" height="556" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Three kinds of water softener rebate program</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Local water and sewer utilities pay to cut the salt that reaches their wastewater plant.</text>
<rect class="box" x="30" y="88" width="216" height="350" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="138" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0e7490">Optimize</text>
<text x="138" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">reduction-based</text>
<text x="44" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Pays for</text>
<text x="44" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Tuning the softener</text>
<text x="44" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">you already own</text>
<text x="44" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">How it works</text>
<text x="44" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">A contractor resets</text>
<text x="44" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">hardness, salt dose and</text>
<text x="44" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">reserve so the unit</text>
<text x="44" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">uses less salt</text>
<text x="44" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Example</text>
<text x="44" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Marshall and</text>
<text x="44" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Worthington, MN:</text>
<text x="44" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">$50 per tune-up,</text>
<text x="44" y="419" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">paid to contractors</text>
<rect class="box" x="272" y="88" width="216" height="350" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="380" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0e7490">Upgrade</text>
<text x="380" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">technology-based</text>
<text x="286" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Pays for</text>
<text x="286" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Replacing a timer</text>
<text x="286" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">softener</text>
<text x="286" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">How it works</text>
<text x="286" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">New unit usually must</text>
<text x="286" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">be demand-initiated</text>
<text x="286" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">(metered), sometimes</text>
<text x="286" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">efficiency rated</text>
<text x="286" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Example</text>
<text x="286" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Marshall and</text>
<text x="286" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Worthington, MN:</text>
<text x="286" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">$500 to $700 to</text>
<text x="286" y="419" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">replace a timer unit</text>
<rect class="box" x="514" y="88" width="216" height="350" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="622" y="118" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0e7490">Remove</text>
<text x="622" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">removal-based</text>
<text x="528" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Pays for</text>
<text x="528" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Taking a salt-based</text>
<text x="528" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">softener out</text>
<text x="528" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">How it works</text>
<text x="528" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Common where new</text>
<text x="528" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">salt-discharging units</text>
<text x="528" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">are banned or the</text>
<text x="528" y="323" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">plant has salt limits</text>
<text x="528" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Example</text>
<text x="528" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Inland Empire, CA</text>
<text x="528" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">(IEUA): $300 to</text>
<text x="528" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">$2,000, plus up to</text>
<text x="528" y="419" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">$250 plumber labor</text>
<rect class="box" x="30" y="456" width="700" height="72" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="46" y="484" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Not one of the three: a federal energy tax credit</text>
<text x="46" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softeners were never qualifying property under the 25C credit, and 25C ended after 2025.</text>
</svg>
