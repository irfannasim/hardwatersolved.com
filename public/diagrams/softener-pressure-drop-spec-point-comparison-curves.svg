<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="pdc-title pdc-desc">
<title id="pdc-title">Water softener pressure drop: comparing two spec sheet ratings</title>
<desc id="pdc-desc">Chart of water softener pressure drop for two units: A rated 5 psi at 7 gpm and B rated 15 psi at 14 gpm; scaled with the square of flow, A loses 14.7 psi and B 11.0 psi at a 12 gpm peak.</desc>
<defs></defs>
<rect width="760" height="570" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Two spec sheets, one house: loss at your peak</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Each rating scaled with the square of flow. Your peak here is 12 gpm.</text>
<text x="30" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Pressure drop (psi)</text>
<text x="90" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<text x="90" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">5</text>
<text x="90" y="317" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">10</text>
<text x="90" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">15</text>
<text x="90" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">20</text>
<text x="90" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">25</text>
<path class="ln" d="M100,440 L100,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text>
<path class="ln" d="M172,440 L172,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="172" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2</text>
<path class="ln" d="M244,440 L244,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="244" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4</text>
<path class="ln" d="M316,440 L316,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="316" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6</text>
<path class="ln" d="M388,440 L388,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="388" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">8</text>
<path class="ln" d="M460,440 L460,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="460" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10</text>
<path class="ln" d="M532,440 L532,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="532" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">12</text>
<path class="ln" d="M604,440 L604,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="604" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">14</text>
<path class="ln" d="M676,440 L676,446" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">16</text>
<text x="388" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Flow through the softener (gpm)</text>
<path class="ln" d="M100,110 L100,440 L680,440" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M100,440 L109,439.9 L118,439.7 L127,439.3 L136,438.7 L145,438 L154,437.1 L163,436 L172,434.8 L181,433.4 L190,431.8 L199,430.1 L208,428.2 L217,426.2 L226,424 L235,421.6 L244,419.1 L253,416.4 L262,413.6 L271,410.5 L280,407.3 L289,404 L298,400.5 L307,396.8 L316,393 L325,389 L334,384.8 L343,380.5 L352,376 L361,371.3 L370,366.5 L379,361.6 L388,356.4 L397,351.1 L406,345.6 L415,340 L424,334.2 L433,328.2 L442,322.1 L451,315.8 L460,309.4 L469,302.8 L478,296 L487,289.1 L496,282 L505,274.7 L514,267.3 L523,259.7 L532,251.9 L541,244 L550,235.9 L559,227.7 L568,219.3 L577,210.7 L586,202 L595,193.1 L604,184 L613,174.8 L622,165.4 L631,155.8 L640,146.1 L649,136.2 L658,126.2" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M100,440 L109,439.9 L118,439.8 L127,439.4 L136,439 L145,438.5 L154,437.8 L163,437 L172,436.1 L181,435 L190,433.9 L199,432.6 L208,431.2 L217,429.7 L226,428 L235,426.2 L244,424.3 L253,422.3 L262,420.2 L271,417.9 L280,415.5 L289,413 L298,410.4 L307,407.6 L316,404.7 L325,401.7 L334,398.6 L343,395.4 L352,392 L361,388.5 L370,384.9 L379,381.2 L388,377.3 L397,373.3 L406,369.2 L415,365 L424,360.7 L433,356.2 L442,351.6 L451,346.9 L460,342 L469,337.1 L478,332 L487,326.8 L496,321.5 L505,316 L514,310.4 L523,304.8 L532,298.9 L541,293 L550,286.9 L559,280.8 L568,274.4 L577,268 L586,261.5 L595,254.8 L604,248 L613,241.1 L622,234 L631,226.9 L640,219.6 L649,212.2 L658,204.7 L667,197 L676,189.2" fill="none" stroke="#0e7490" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M532,120 L532,434" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<text x="524" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#0b2f4a">Your peak: 12 gpm</text>
<circle cx="352" cy="376" r="7" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
<text x="340" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">A rated: 5 psi at 7 gpm</text>
<circle cx="604" cy="248" r="7" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/>
<text x="616" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">B rated:</text>
<text x="616" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">15 psi at 14 gpm</text>
<circle cx="532" cy="251.8" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<text x="520" y="243.8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#dc2626">A: 14.7 psi</text>
<circle cx="532" cy="299.2" r="7" fill="#0e7490" stroke="#ffffff" stroke-width="2"/>
<text x="544" y="321.2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">B: 11.0 psi</text>
<text x="30" y="526" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Unit A advertised the smaller number, but only because it was measured at a lower flow.</text>
<text x="30" y="546" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Equivalent Cv: A = 3.1, B = 3.6. Higher Cv means less loss at every flow.</text>
</svg>
