<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="g4il-title g4il-desc">
<title id="g4il-title">Water softener iron fouling feedback loop</title>
<desc id="g4il-desc">Feedback loop showing how untested iron fouls a water softener programmed for hardness only: early breakthrough, too-rare regeneration, iron oxidising on the resin and not rinsing off, so capacity falls a little more every cycle.</desc>
<defs><marker id="g4il-ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="g4il-ai" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">How untested iron fouls a softener</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Programmed for hardness only, the softener slips a little further every cycle.</text><rect class="box" x="30" y="100" width="210" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="135" y="123" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#ffffff">Valve programmed</text><text x="135" y="141" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#ffffff">for hardness only</text><rect class="box" x="270" y="132" width="220" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="380" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Breakthrough before the</text><text x="380" y="173" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">scheduled regeneration</text><rect class="box" x="510" y="232" width="220" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="620" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Regenerates too rarely:</text><text x="620" y="273" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">iron sits on resin longer</text><rect class="box" x="430" y="372" width="220" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="540" y="395" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Iron oxidises</text><text x="540" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">in place</text><rect class="box" x="110" y="372" width="220" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="220" y="395" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Oxidised iron won’t come</text><text x="220" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">off in a normal brine rinse</text><rect class="box" x="30" y="232" width="220" height="56" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><text x="140" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Capacity falls</text><text x="140" y="273" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">further</text><path class="ln" d="M240,128 L262,146" fill="none" stroke="#0b2f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4il-ai)"/><path class="ln" d="M490,160 L620,160 L620,224" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4il-ar)"/><path class="ln" d="M620,288 L620,330 L560,330 L560,364" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4il-ar)"/><path class="ln" d="M430,400 L338,400" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4il-ar)"/><path class="ln" d="M200,372 L200,332 L140,332 L140,296" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4il-ar)"/><path class="ln" d="M140,232 L140,196 L300,196 L300,192" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4il-ar)"/><text x="380" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="middle" fill="#b45309">breakthrough</text><text x="380" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="middle" fill="#b45309">gets earlier</text><text x="380" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" font-style="italic" text-anchor="middle" fill="#b45309">each cycle</text><rect class="box" x="30" y="452" width="340" height="58" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="46" y="476" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Undersized softener</text><text x="46" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Runs out early, recovers fully each time</text><rect class="box" x="390" y="452" width="340" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="406" y="476" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Iron-fouled softener</text><text x="406" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Runs out early, recovers a little less each time</text>
</svg>
