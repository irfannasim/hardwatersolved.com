<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" width="760" height="466" role="img" aria-labelledby="g4bp-title g4bp-desc">
<title id="g4bp-title">Water softener bypass valve: service, bypass and internal bleed-through</title>
<desc id="g4bp-desc">Water softener bypass valve diagram: in service water goes through the softener, in bypass raw water goes straight to the house, and worn internal O-rings let hard water bleed through to the outlet so the taps get partly hard water.</desc>
<defs><marker id="g4bp-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4bp-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="g4bp-af" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="466" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Bypass valve: service, bypass and the hidden bleed</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Worn internal O-rings let raw water cross to the outlet with no drip to see.</text><text x="140" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1 · In service</text><rect class="box" x="70" y="116" width="140" height="32" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="140" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><rect x="50" y="166" width="180" height="76" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="136" y="166" width="8" height="76" rx="0" fill="#3a5a72"/><circle cx="140" cy="192" r="5" fill="#111827"/><circle cx="140" cy="224" r="5" fill="#111827"/><rect x="132" y="242" width="16" height="20" rx="0" fill="#94a3b8"/><circle cx="128" cy="244" r="4" fill="#111827"/><circle cx="152" cy="244" r="4" fill="#111827"/><path class="ln" d="M32,208 L90,208 L90,154" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bp-ah)"/><path class="ln" d="M190,152 L190,208 L242,208" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bp-as)"/><text x="380" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2 · In bypass</text><rect class="box" x="310" y="116" width="140" height="32" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="380" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><rect x="290" y="166" width="180" height="76" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="376" y="166" width="8" height="22" rx="0" fill="#3a5a72"/><rect x="376" y="226" width="8" height="16" rx="0" fill="#3a5a72"/><rect x="372" y="242" width="16" height="20" rx="0" fill="#94a3b8"/><circle cx="368" cy="244" r="4" fill="#111827"/><circle cx="392" cy="244" r="4" fill="#111827"/><path class="ln" d="M330,148 L330,166" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M430,148 L430,166" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M272,208 L482,208" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bp-ah)"/><text x="620" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">3 · Worn internal seal</text><rect class="box" x="550" y="116" width="140" height="32" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="620" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><rect x="530" y="166" width="180" height="76" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="616" y="166" width="8" height="76" rx="0" fill="#3a5a72"/><circle cx="620" cy="192" r="5" fill="#111827"/><circle cx="620" cy="224" r="5" fill="#dc2626"/><rect x="612" y="242" width="16" height="20" rx="0" fill="#94a3b8"/><circle cx="608" cy="244" r="4" fill="#111827"/><circle cx="632" cy="244" r="4" fill="#111827"/><path class="ln" d="M512,208 L570,208 L570,154" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bp-ah)"/><path class="ln" d="M670,152 L670,208 L722,208" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bp-as)"/><path class="ln" d="M576,224 L660,224" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4bp-af)"/><text x="140" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">House gets soft water</text><text x="380" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">House gets raw water</text><text x="380" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">softener ports closed</text><text x="620" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Partly hard water</text><text x="620" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">e.g. steady 1–3 gpg, never 0</text><rect class="box" x="30" y="334" width="700" height="80" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><circle cx="50" cy="360" r="6" fill="#111827"/><text x="66" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Internal O-rings separate raw from softened water. Worn: an invisible bleed.</text><circle cx="50" cy="390" r="5" fill="#111827"/><text x="66" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">External O-rings seal the stem and ports. Worn: a drip, a weep or white crust.</text><rect x="30" y="439" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">raw (hard) water</text><rect x="210" y="439" width="26" height="6" rx="3" fill="#0e7490"/><text x="244" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text><rect x="390" y="439" width="26" height="6" rx="3" fill="#dc2626"/><text x="424" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bleed-through</text><rect x="570" y="439" width="26" height="6" rx="3" fill="#cbd5e1"/><text x="604" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">closed</text>
</svg>
