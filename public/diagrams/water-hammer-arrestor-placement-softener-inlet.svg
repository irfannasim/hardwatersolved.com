<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" role="img" aria-labelledby="g4wa-title g4wa-desc">
<title id="g4wa-title">Where to install a water hammer arrestor on a water softener</title>
<desc id="g4wa-desc">Water hammer arrestor placement on a water softener: on the inlet pipe just upstream of the bypass, where the pressure spike forms; not on the outlet, not on the drain line and not at a distant faucet.</desc>
<defs><marker id="g4wa-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4wa-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="g4wa-ad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="g4wa-bd" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="486" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where the water hammer arrestor goes</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">On the inlet, just upstream of the bypass: the spike forms on the supply side of the closing valve.</text><text x="30" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">SUPPLY</text><path class="ln" d="M30,210 L376,210" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4wa-ah)"/><path class="ln" d="M290,207 L290,172" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><rect x="277" y="118" width="26" height="54" rx="6" fill="#f8fafc" stroke="#15803d" stroke-width="2.5"/><rect x="281" y="128" width="18" height="8" rx="2" fill="#3a5a72"/><text x="316" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">✓ Arrestor here</text><text x="316" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">on the inlet, within a couple</text><text x="316" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">of feet of the bypass</text><text x="160" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">spike forms here (pressure ↑)</text><rect class="box" x="380" y="188" width="80" height="44" rx="8" fill="#3a5a72" stroke="#3a5a72" stroke-width="2"/><text x="420" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">BYPASS</text><rect class="box" x="460" y="188" width="140" height="44" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="530" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text><rect x="480" y="232" width="100" height="150" rx="18" fill="url(#g4wa-bd)" stroke="#3a5a72" stroke-width="2"/><path class="ln" d="M600,210 L726,210" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4wa-as)"/><text x="730" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">TO HOUSE</text><text x="730" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">✗ Not on the outlet</text><text x="730" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">(pressure dips here)</text><path class="ln" d="M594,232 L594,352" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4wa-ad)"/><path d="M582,362 L606,362 L600,374 L588,374 Z" fill="#78716c"/><text x="730" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">✗ Not at the drain</text><text x="730" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">open to an air gap</text><rect x="346" y="198" width="8" height="24" rx="2" fill="#1f2937"/><rect x="636" y="198" width="8" height="24" rx="2" fill="#1f2937"/><rect class="box" x="30" y="282" width="400" height="80" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why upstream?</text><text x="46" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Moving water piles up against the closing valve</text><text x="46" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">on its supply side. Downstream, pressure dips.</text><text x="30" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">✗ Not at a faucet across the house either: it never sees the wave.</text><rect x="30" y="445" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">supply water</text><rect x="190" y="445" width="26" height="6" rx="3" fill="#0e7490"/><text x="224" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text><rect x="350" y="445" width="26" height="6" rx="3" fill="#78716c"/><text x="384" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><rect x="510" y="440" width="8" height="18" rx="2" fill="#1f2937"/><text x="526" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">pipe clamp, a foot or so</text><text x="526" y="469" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">either side of the bypass</text>
</svg>
