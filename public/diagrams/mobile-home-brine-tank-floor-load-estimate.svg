<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="fl-title fl-desc">
<title id="fl-title">Mobile home floor load under a full water softener brine tank (illustrative estimate)</title>
<desc id="fl-desc">Illustrative estimate for a water softener in a mobile home: a full 18 by 33 inch brine tank weighs about 300 to 400 pounds on about 1.8 square feet, or 170 to 230 pounds per square foot, against a 40 psf uniform floor live load. Spread on a 4 by 4 foot pad the average falls to about 19 to 25 psf.</desc>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">How much a full brine tank presses on the floor</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative estimate for an 18 x 33 in brine tank. Pounds per square foot (psf).</text>
<rect x="60" y="190" width="90" height="175" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<rect x="64" y="226" width="82" height="136" fill="#e5e7eb"/>
<rect x="64" y="330" width="82" height="32" fill="#dbeafe"/>
<line x1="30" y1="365" x2="360" y2="365" stroke="#52697a" stroke-width="2"/>
<text x="105" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">18 x 33 in tank</text>
<text x="168" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Salt: 250 to 290 lb</text>
<text x="168" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">water, tank and lid on top</text>
<text x="168" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">About 300 to 400 lb</text>
<text x="168" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">on about 1.8 sq ft</text>
<text x="410" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Uniform floor live load (24 CFR 3280.305)</text>
<rect x="401" y="128" width="53" height="24" fill="#52697a"/>
<text x="463" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">40 psf</text>
<text x="410" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Directly under the full brine tank</text>
<rect x="401" y="208" width="224" height="24" fill="#dc2626"/>
<rect x="624" y="208" width="80" height="24" fill="#fca5a5"/>
<text x="410" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">170 to 230 psf</text>
<text x="410" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Same load on a 4 x 4 ft plywood pad</text>
<rect x="401" y="288" width="33" height="24" fill="#15803d"/>
<text x="443" y="305" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">19 to 25 psf average</text>
<line x1="400" y1="100" x2="400" y2="330" stroke="#3a5a72" stroke-width="1.5"/>
<line x1="400" y1="330" x2="730" y2="330" stroke="#3a5a72" stroke-width="1.5"/>
<text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="532" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">100</text>
<text x="664" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">200 psf</text>
<rect class="box" x="30" y="414" width="700" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Estimate: about 26 in of pellet salt at 65 to 75 lb per cu ft. Floors must also carry a 200 lb point load.</text>
<text x="46" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">The pad figure is an average and only holds if the pad spans several joists. Ask the maker if unsure.</text>
</svg>
