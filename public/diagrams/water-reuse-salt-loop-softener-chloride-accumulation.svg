<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="rsl-title rsl-desc">
<title id="rsl-title">Water reuse salt loop: how softener chloride accumulates</title>
<desc id="rsl-desc">In a region that reuses wastewater, supply water gains chloride in homes, mostly from water softeners, passes the treatment plant unchanged, returns through recycled irrigation and aquifer recharge, and becomes the next supply. Desalting by reverse osmosis is the only real exit.</desc>
<defs><marker id="rsl-t" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="rsl-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="rsl-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">The salt loop in a region that reuses its wastewater</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Chloride added in homes passes the plant and comes back around in the next supply</text><rect class="box" x="30" y="100" width="230" height="74" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="145" y="130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water supply</text><text x="145" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">aquifer or river</text><rect class="box" x="500" y="100" width="230" height="74" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="615" y="130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Homes</text><text x="615" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">softeners add the most salt</text><rect class="box" x="500" y="300" width="230" height="74" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="615" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Treatment plant</text><text x="615" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">chloride passes through</text><rect class="box" x="30" y="300" width="230" height="74" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="145" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Recycled water</text><text x="145" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">irrigation and recharge</text><path class="ln" d="M264,137 L490,137" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rsl-t)"/><path class="ln" d="M615,178 L615,290" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rsl-b)"/><path class="ln" d="M496,337 L270,337" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rsl-b)"/><path class="ln" d="M145,296 L145,184" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rsl-b)"/><text x="380" y="228" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#7c3aed">Each pass adds salt</text><text x="380" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Irrigation leaves it in soil and groundwater</text><path class="ln" d="M615,378 L615,420" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#rsl-g)"/><rect class="box" x="460" y="428" width="270" height="70" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="2"/><text x="595" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Desalting (reverse osmosis)</text><text x="595" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">the only real exit, and costly</text><rect x="30" y="440" width="26" height="6" rx="3" fill="#0e7490"/><text x="64" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Supply water</text><rect x="30" y="468" width="26" height="6" rx="3" fill="#7c3aed"/><text x="64" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Water carrying added chloride</text>
</svg>
