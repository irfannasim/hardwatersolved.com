<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 532" width="760" height="532" role="img" aria-labelledby="rml-title rml-desc">
<title id="rml-title">RO membrane life on softened and hard feed water (illustrative)</title>
<desc id="rml-desc">Illustrative chart, not measured data, of reverse osmosis membrane life ranges: about 3 to 5 years on softened feed water, matching one manufacturer’s published range, and shorter illustrative ranges on moderately hard and very hard feed water.</desc>
<defs><marker id="rml-m3a5a72" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="532" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">RO membrane life and feed hardness</text><rect x="30" y="56" width="270" height="28" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="42" y="75" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">ILLUSTRATIVE: not measured data</text><path d="M290,110 L290,330" stroke="#e2e8f0" stroke-width="1"/><text x="290" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><path d="M360,110 L360,330" stroke="#e2e8f0" stroke-width="1"/><text x="360" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1</text><path d="M430,110 L430,330" stroke="#e2e8f0" stroke-width="1"/><text x="430" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2</text><path d="M500,110 L500,330" stroke="#e2e8f0" stroke-width="1"/><text x="500" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3</text><path d="M570,110 L570,330" stroke="#e2e8f0" stroke-width="1"/><text x="570" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4</text><path d="M640,110 L640,330" stroke="#e2e8f0" stroke-width="1"/><text x="640" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5</text><path d="M710,110 L710,330" stroke="#e2e8f0" stroke-width="1"/><text x="710" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6</text><text x="500" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Years between membrane changes</text><text x="30" y="142" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softened feed</text><text x="30" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">under 1 gpg</text><rect x="500" y="130" width="140" height="30" rx="5" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/><text x="30" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Moderately hard</text><text x="30" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">7 to 10 gpg</text><rect x="430" y="200" width="105" height="30" rx="5" fill="#fb923c" stroke="#fb923c" stroke-width="1.5"/><text x="30" y="282" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Very hard</text><text x="30" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">15 gpg and up</text><rect x="360" y="270" width="70" height="30" rx="5" fill="#c2410c" stroke="#c2410c" stroke-width="1.5"/><text x="650" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">APEC: 3 to 5</text><text x="545" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">illustrative</text><text x="440" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">illustrative</text><path class="ln" d="M290,338 L710,338" stroke="#3a5a72" stroke-width="1.5" fill="none"/><rect class="box" x="30" y="404" width="700" height="108" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Published: membranes are rated on softened water (DuPont FilmTec), and about</text><text x="46" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">7 gpg is the usual ceiling (iSpring warranty terms; Express Water guide).</text><text x="46" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Not published: side-by-side life figures for hard and softened feed. The two lower</text><text x="46" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">bars show the direction the sources describe, not a test result.</text>
</svg>
