<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="eip-title eip-desc">
<title id="eip-title">Water softener maintenance schedule: ten external inspection points</title>
<desc id="eip-desc">Map of the ten places to check during a water softener maintenance schedule walk-round: mineral tank base, tank neck and valve threads, bypass valve, inlet and outlet connections, drain line, brine line, brine tank overflow, brine tank walls, the floor around both tanks, and power.</desc>
<defs><pattern id="eip-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><marker id="eip-m78716c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="eip-salt" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern><marker id="eip-m7c3aed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Ten places to look each month</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Red: a bulging or cracked tank, or a leak at the tank-to-valve joint, means stop and call.</text>
<rect x="30" y="480" width="410" height="3" fill="#cbd5e1"/>
<rect x="395" y="476" width="36" height="8" rx="2" fill="#0b2f4a"/>
<rect x="110" y="200" width="100" height="280" rx="22" fill="url(#eip-beads)" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="95" y="150" width="130" height="50" rx="8" fill="#0b2f4a"/>
<text x="160" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text>
<rect x="70" y="158" width="25" height="34" rx="3" fill="#3a5a72"/>
<path class="ln" d="M76,158 L76,100" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/>
<path class="ln" d="M89,158 L89,100" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/>
<path class="ln" d="M210,150 L210,90 L412,90 L412,444" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eip-m78716c)"/>
<rect x="250" y="104" width="22" height="24" rx="3" fill="#ffffff" stroke="#0b2f4a" stroke-width="1.5"/>
<path class="ln" d="M225,162 Q248,152 258,130" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M225,186 L300,186 L300,318" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="262" y="330" width="108" height="150" rx="6" fill="url(#eip-salt)" stroke="#3a5a72" stroke-width="2"/>
<rect x="264" y="440" width="104" height="38" fill="#dbeafe"/>
<rect x="254" y="320" width="124" height="10" rx="3" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/>
<rect x="370" y="346" width="8" height="8" fill="#0b2f4a"/>
<path class="ln" d="M378,350 L398,350 L398,444" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#eip-m7c3aed)"/>
<circle cx="82" cy="462" r="13" fill="#dc2626"/>
<text x="82" y="467" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="242" cy="216" r="13" fill="#dc2626"/>
<text x="242" y="221" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="58" cy="216" r="13" fill="#0b2f4a"/>
<text x="58" y="221" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="112" cy="112" r="13" fill="#0b2f4a"/>
<text x="112" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="342" cy="112" r="13" fill="#0b2f4a"/>
<text x="342" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="320" cy="252" r="13" fill="#0b2f4a"/>
<text x="320" y="257" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<circle cx="346" cy="354" r="13" fill="#0b2f4a"/>
<text x="346" y="359" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<circle cx="290" cy="414" r="13" fill="#0b2f4a"/>
<text x="290" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text>
<circle cx="236" cy="502" r="13" fill="#0b2f4a"/>
<text x="236" y="507" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">9</text>
<circle cx="290" cy="116" r="14" fill="#0b2f4a"/>
<text x="290" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">10</text>
<circle cx="484" cy="99" r="13" fill="#dc2626"/>
<text x="484" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="506" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Mineral tank base</text>
<text x="506" y="122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">damp rings, salt crust, bulges</text>
<circle cx="484" cy="143" r="13" fill="#dc2626"/>
<text x="484" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="506" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Tank neck and valve threads</text>
<text x="506" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">weeping or crust at the joint</text>
<circle cx="484" cy="187" r="13" fill="#0b2f4a"/>
<text x="484" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="506" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Bypass valve</text>
<text x="506" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">drips around the handle or body</text>
<circle cx="484" cy="231" r="13" fill="#0b2f4a"/>
<text x="484" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="506" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inlet and outlet connections</text>
<text x="506" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">corrosion, green staining, drips</text>
<circle cx="484" cy="275" r="13" fill="#0b2f4a"/>
<text x="484" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="506" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Drain line</text>
<text x="506" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">kinks, pulled out, no air gap</text>
<circle cx="484" cy="319" r="13" fill="#0b2f4a"/>
<text x="484" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="506" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine line</text>
<text x="506" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">cracks, loose fittings, air bubbles</text>
<circle cx="484" cy="363" r="13" fill="#0b2f4a"/>
<text x="484" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<text x="506" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine tank overflow</text>
<text x="506" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water in the line or on the floor</text>
<circle cx="484" cy="407" r="13" fill="#0b2f4a"/>
<text x="484" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text>
<text x="506" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine tank walls</text>
<text x="506" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">cracks, especially near the base</text>
<circle cx="484" cy="451" r="13" fill="#0b2f4a"/>
<text x="484" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">9</text>
<text x="506" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Floor around both tanks</text>
<text x="506" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">staining, efflorescence, rust marks</text>
<circle cx="484" cy="495" r="13" fill="#0b2f4a"/>
<text x="484" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">10</text>
<text x="506" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Power</text>
<text x="506" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">transformer in, cord undamaged, display lit</text>
</svg>
