<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="kdtg-title kdtg-desc">
<title id="kdtg-title">Kitchen drinking tap options: hard bypass tap vs softened tap vs softened plus reverse osmosis</title>
<desc id="kdtg-desc">Comparison matrix of three ways to plumb a kitchen drinking tap in a house with a water softener: a hard bypass tap avoids added sodium but delivers hardness and any untreated contaminants, a softened tap adds sodium, and softened water plus reverse osmosis reduces both.</desc>
<defs></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Kitchen drinking tap: what reaches the glass</text><text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Three ways to plumb the drinking tap in a softened house</text><rect class="box" x="280" y="82" width="140" height="40" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="350" y="107" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">Hard bypass tap</text><rect class="box" x="430" y="82" width="140" height="40" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="500" y="107" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Softened tap</text><rect class="box" x="580" y="82" width="140" height="40" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="650" y="107" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softened + RO tap</text><rect x="30" y="140" width="700" height="62" rx="0" fill="#f8fafc"/><text x="40" y="167" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hardness</text><text x="40" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">(calcium, magnesium)</text><text x="350" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">present</text><text x="500" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">removed</text><text x="650" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">removed</text><text x="40" y="229" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Sodium added</text><text x="40" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">by the softener</text><text x="350" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">none</text><text x="500" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">added</text><text x="650" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">mostly removed</text><rect x="30" y="264" width="700" height="62" rx="0" fill="#f8fafc"/><text x="40" y="291" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Lead, nitrate, arsenic</text><text x="40" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">(if in the supply)</text><text x="350" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">present</text><text x="500" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">present</text><text x="650" y="291" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">reduced, if</text><text x="650" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">certified for it</text><text x="40" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Iron, odor, sediment</text><text x="40" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">removed by filters</text><text x="350" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">present if teed</text><text x="350" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">before filters</text><text x="500" y="353" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">removed if filters</text><text x="500" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">are upstream</text><text x="650" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">removed</text><rect x="30" y="388" width="700" height="62" rx="0" fill="#f8fafc"/><text x="40" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Extra hardware</text><text x="350" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">hard line and</text><text x="350" y="433" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">second faucet</text><text x="500" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">none</text><text x="650" y="415" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">RO unit and</text><text x="650" y="433" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">second faucet</text><text x="30" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">A bypass tap solves the sodium problem by giving up everything else the house treats.</text><text x="30" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">RO reduces sodium and many dissolved contaminants. Check its certification for the ones you have.</text>
</svg>
