<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="g22d-title g22d-desc">
<title id="g22d-title">Sodium from drinking softened water against daily sodium limits</title>
<desc id="g22d-desc">Calculated bar chart: drinking 2 litres a day of softened water adds about 236 mg of sodium at 15 gpg and 473 mg at 30 gpg, against the FDA Daily Value of 2,300 mg, average US intake of 3,400 mg, and the 500 mg a day restricted diet behind EPA's 20 mg/L guidance level.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Two litres a day of softened water, in a day's sodium</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Calculated from 7.9 mg/L per gpg; reference amounts from FDA and EPA; milligrams of sodium a day</text>

<text x="30" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Average US intake</text>
<text x="30" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">FDA</text>
<rect x="280" y="96" width="350" height="28" fill="#3a5a72"/>
<text x="638" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">3,400 mg</text>

<text x="30" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Daily Value</text>
<text x="30" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">FDA, less than</text>
<rect x="280" y="148" width="237" height="28" fill="#3a5a72"/>
<text x="525" y="167" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">2,300 mg</text>

<text x="30" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Very restricted diet</text>
<text x="30" y="229" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">basis of EPA 20 mg/L level</text>
<rect x="280" y="200" width="51" height="28" fill="#15803d"/>
<text x="339" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">500 mg</text>

<text x="30" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2 L softened, 15 gpg</text>
<text x="30" y="281" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">salt regeneration</text>
<rect x="280" y="252" width="24" height="28" fill="#7c3aed"/>
<text x="312" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">236 mg</text>

<text x="30" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2 L softened, 30 gpg</text>
<text x="30" y="333" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">salt regeneration</text>
<rect x="280" y="304" width="49" height="28" fill="#7c3aed"/>
<text x="337" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">473 mg</text>

<path class="ln" d="M280,352 L640,352" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M280,352 L280,360 M383,352 L383,360 M486,352 L486,360 M589,352 L589,360" stroke="#0b2f4a" stroke-width="1.5" fill="none"/>
<text x="280" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">0</text>
<text x="383" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">1,000</text>
<text x="486" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">2,000</text>
<text x="589" y="376" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">3,000</text>

<rect class="box" x="30" y="394" width="700" height="60" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="380" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">At 15 gpg: about 10% of the Daily Value, but nearly half of a 500 mg diet.</text>
<text x="380" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Whether it matters depends on the diet, not on the softener.</text>
</svg>
