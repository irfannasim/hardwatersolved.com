<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="ps-title ps-desc">
<title id="ps-title">Water softener control valve piston and seal stack</title>
<desc id="ps-desc">Cutaway diagram of a water softener control valve piston moving through a stack of rubber seals and plastic spacers, with a worn seal shedding black flakes into the treated water and leaking between ports.</desc>
<defs><marker id="ps-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ps-bad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ps-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="ps-tsoft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ps-tbad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="ps-tink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inside the control valve: piston and seal stack</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The piston slides through rubber seals and plastic spacers to select each cycle position.</text><rect x="240" y="128" width="20" height="54" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="400" y="128" width="20" height="54" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="320" y="298" width="20" height="50" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="80" y="180" width="520" height="120" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="240" y="181" width="20" height="26" fill="#ffffff"/><rect x="400" y="181" width="20" height="26" fill="#ffffff"/><rect x="320" y="273" width="20" height="26" fill="#ffffff"/><rect x="100" y="205" width="480" height="70" fill="#ffffff" stroke="#3a5a72" stroke-width="1"/><rect x="135" y="207" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="135" y="259" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="215" y="207" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="215" y="259" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="295" y="207" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="295" y="259" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="375" y="207" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="375" y="259" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="455" y="207" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="455" y="259" width="70" height="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="112" y="224" width="590" height="32" rx="5" fill="#94a3b8" stroke="#3a5a72" stroke-width="1.5"/><rect x="125" y="205" width="10" height="18" rx="2" fill="#111827" stroke="none" stroke-width="2"/><rect x="125" y="257" width="10" height="18" rx="2" fill="#111827"/><rect x="205" y="205" width="10" height="18" rx="2" fill="#111827" stroke="none" stroke-width="2"/><rect x="205" y="257" width="10" height="18" rx="2" fill="#111827"/><rect x="285" y="205" width="10" height="18" rx="2" fill="#111827" stroke="none" stroke-width="2"/><rect x="285" y="257" width="10" height="18" rx="2" fill="#111827"/><rect x="365" y="205" width="10" height="18" rx="2" fill="#111827" stroke="none" stroke-width="2"/><rect x="365" y="257" width="10" height="18" rx="2" fill="#111827"/><rect x="445" y="205" width="10" height="18" rx="2" fill="#111827" stroke="#dc2626" stroke-width="2"/><rect x="445" y="257" width="10" height="18" rx="2" fill="#111827"/><rect x="525" y="205" width="10" height="18" rx="2" fill="#111827" stroke="none" stroke-width="2"/><rect x="525" y="257" width="10" height="18" rx="2" fill="#111827"/><path d="M447,207 L452,213 L448,219" stroke="#ffffff" stroke-width="1.5" fill="none"/><path class="ln" d="M410,200 L410,104" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ps-soft)"/><path d="M399,186 q5,-4 10,-1 l-1,4 q-4,-2 -8,1 z" fill="#111827"/><path d="M411,160 q5,-4 10,-1 l-1,4 q-4,-2 -8,1 z" fill="#111827"/><path d="M398,138 q5,-4 10,-1 l-1,4 q-4,-2 -8,1 z" fill="#111827"/><path d="M412,116 q5,-4 10,-1 l-1,4 q-4,-2 -8,1 z" fill="#111827"/><text x="410" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">treated water to house</text><text x="30" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">rubber seal</text><path class="ln" d="M70,158 L126,203" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">plastic spacer</text><path class="ln" d="M78,322 L166,276" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="652" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">piston</text><path class="ln" d="M612,276 L700,276" fill="none" stroke="#0b2f4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ps-tink)" marker-start="url(#ps-tink)"/><text x="656" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">moves at each</text><text x="656" y="321" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">regeneration</text><text x="470" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">hardened, cracked seal sheds flakes</text><path class="ln" d="M478,332 L456,277" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M428,214 L476,214" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ps-bad)"/><text x="500" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">internal leak-by between ports</text><path class="ln" d="M514,168 L474,206" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="30" y="372" width="700" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="48" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Clues:</tspan> flat, flexible black flakes in bursts after regeneration; unit 8+ years</text><text x="48" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">old, or younger on chlorinated water without carbon. Worn seals also cause</text><text x="48" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">hard water in service, brine to drain and a softener that runs constantly.</text>
</svg>
