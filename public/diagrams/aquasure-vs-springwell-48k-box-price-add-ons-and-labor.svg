<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="avs-title avs-desc">
<title id="avs-title">Aquasure vs SpringWell 48,000-grain softener: box price, add-ons and labor</title>
<desc id="avs-desc">Stacked bar chart of Aquasure vs SpringWell true installed price: the Aquasure Harmony 48k at 630 dollars plus about 110 dollars of add-ons, the SpringWell SS4 at 1,785 dollars plus a 59 dollar bypass and about 130 dollars of add-ons, each with 150 to 1,000 dollars of plumber labor if hired.</desc>
<defs>
<pattern id="avs-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1f5f9"/><path d="M0,0 L0,8" stroke="#94a3b8" stroke-width="2"/></pattern>
</defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">What each 48,000-grain softener costs to get running</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Store prices checked 2 October 2026; add-on and labor figures are illustrative estimates</text>

<text x="30" y="102" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Aquasure Harmony 48k</text>
<rect x="150" y="114" width="113" height="32" fill="#0e7490"/>
<rect x="263" y="114" width="20" height="32" fill="#52697a"/>
<rect x="283" y="114" width="180" height="32" fill="url(#avs-hatch)" stroke="#52697a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="480" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">DIY: about $740 to $845</text>
<text x="480" y="147" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Hired: about $890 to $1,740</text>
<text x="150" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Box $630, bypass included</text>

<text x="30" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">SpringWell SS4 48k</text>
<rect x="150" y="226" width="321" height="32" fill="#0e7490"/>
<rect x="471" y="226" width="11" height="32" fill="#0b2f4a"/>
<rect x="482" y="226" width="23" height="32" fill="#52697a"/>
<rect x="505" y="226" width="180" height="32" fill="url(#avs-hatch)" stroke="#52697a" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="150" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Box $1,785; bypass $59 extra</text>
<text x="150" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">DIY: about $1,975 to $2,090</text>
<text x="400" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Hired: about $2,120 to $2,970</text>

<path class="ln" d="M150,330 L690,330" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M150,330 L150,336 M240,330 L240,336 M330,330 L330,336 M420,330 L420,336 M510,330 L510,336 M600,330 L600,336 M690,330 L690,336" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
