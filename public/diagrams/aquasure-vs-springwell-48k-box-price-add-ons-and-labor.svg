<rect x="46" y="418" width="18" height="14" fill="url(#avs-hatch)" stroke="#52697a" stroke-width="1"/>
<text x="72" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Plumber labor if hired, $150 to $1,000 (Fixr national range); the plumbing costs the same for either box</text>
