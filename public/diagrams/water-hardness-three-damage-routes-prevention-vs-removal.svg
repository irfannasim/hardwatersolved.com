<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" width="760" height="546" role="img" aria-labelledby="hdr-title hdr-desc">
<title id="hdr-title">Scale prevention vs hardness removal: the three routes by which hard water causes damage</title>
<desc id="hdr-desc">Dissolved calcium and magnesium cause trouble through heat (scale on heaters and kettles), soap chemistry (curd, scum and dull laundry) and evaporation (spots and faucet crust). Hardness removal takes the minerals out before all three routes; scale prevention acts only on the heat route.</desc>
<defs><marker id="hdr-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="760" height="546" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Three ways hardness causes trouble, and which goal stops each</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hardness removal closes all three routes. Scale prevention acts only on the heat route.</text><rect class="box" x="30" y="86" width="700" height="48" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="380" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Dissolved calcium and magnesium in the water</text><rect class="box" x="30" y="160" width="700" height="40" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="380" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Hardness removal (softener, or RO at a tap) takes the minerals out here</text><path class="ln" d="M140,137 L140,152" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><path class="ln" d="M140,203 L140,220" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="30" y="228" width="220" height="60" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="140" y="253" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1. Heat</text><text x="140" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">water heaters, kettles</text><path class="ln" d="M140,291 L140,310" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="30" y="318" width="220" height="48" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="140" y="347" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Scale prevention acts here</text><path class="ln" d="M140,369 L140,390" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="30" y="398" width="220" height="84" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="140" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Scale on elements,</text><text x="140" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">tank bottoms and</text><text x="140" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">heat exchangers</text><path class="ln" d="M380,137 L380,152" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><path class="ln" d="M380,203 L380,220" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="270" y="228" width="220" height="60" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="380" y="253" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2. Soap chemistry</text><text x="380" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">at any temperature</text><path class="ln" d="M380,291 L380,310" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="270" y="318" width="220" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="380" y="347" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">Prevention does not act</text><path class="ln" d="M380,369 L380,390" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="270" y="398" width="220" height="84" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="380" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Soap curd, scum ring,</text><text x="380" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">poor lather, dull</text><text x="380" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">laundry, dish film</text><path class="ln" d="M620,137 L620,152" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><path class="ln" d="M620,203 L620,220" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="510" y="228" width="220" height="60" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="620" y="253" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">3. Evaporation</text><text x="620" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">droplets drying</text><path class="ln" d="M620,291 L620,310" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="510" y="318" width="220" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="620" y="347" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">Prevention does not act</text><path class="ln" d="M620,369 L620,390" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdr-h)"/><rect class="box" x="510" y="398" width="220" height="84" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="620" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Spots on glass,</text><text x="620" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">faucet and aerator</text><text x="620" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">crust, shower rims</text><rect x="30" y="512" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hardness still in the water</text><rect x="270" y="506" width="18" height="18" rx="3" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="296" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Where a treatment goal acts</text><rect x="510" y="506" width="18" height="18" rx="3" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="536" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Only removal fixes</text>
</svg>
