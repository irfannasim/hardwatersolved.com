<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456" role="img" aria-labelledby="scf-title scf-desc">
<title id="scf-title">Hard water soap curd on towel fibres: why laundry feels stiff</title>
<desc id="scf-desc">Towel fibres washed in soft water stay upright and absorbent. In hard water, calcium soap curd forms, bonds between the fibres, glues terry loops flat, repels water and traps soil, so laundry feels stiff and turns grey.</desc>
<defs><marker id="scf-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="scf-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="760" height="456" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why hard water leaves towels stiff</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Calcium + magnesium + detergent → insoluble calcium soap curd</text><rect class="box" x="30" y="88" width="340" height="300" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><rect class="box" x="390" y="88" width="340" height="300" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="200" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">SOFT WATER</text><text x="560" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">HARD WATER</text><text x="200" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">detergent lifts soil away</text><text x="560" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">every wash adds a layer</text><rect x="46" y="290" width="308" height="16" rx="4" fill="#cbd5e1" /><rect x="406" y="290" width="308" height="16" rx="4" fill="#cbd5e1" /><path d="M56,290 C54,226 82,226 80,290" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M93,290 C91,226 119,226 117,290" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M130,290 C128,226 156,226 154,290" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M167,290 C165,226 193,226 191,290" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M204,290 C202,226 230,226 228,290" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M241,290 C239,226 267,226 265,290" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M278,290 C276,226 304,226 302,290" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M315,290 C313,226 341,226 339,290" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M130,168 C124,180 120,186 120,192 A10,10 0 0 0 140,192 C140,186 136,180 130,168 z" fill="#60a5fa"/><path class="ln" d="M130,208 L130,236" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scf-s)"/><text x="152" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">water soaks in</text><text x="200" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">loops stand up and separate</text><text x="200" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">soft, absorbent</text><path d="M412,290 C420,270 446,268 454,286" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M454,290 C462,270 488,268 496,286" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M496,290 C504,270 530,268 538,286" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M538,290 C546,270 572,268 580,286" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M580,290 C588,270 614,268 622,286" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M622,290 C630,270 656,268 664,286" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M664,290 C672,270 698,268 706,286" fill="none" stroke="#94a3b8" stroke-width="4"/><path d="M408,284 C470,262 640,262 712,284 L712,290 L408,290 z" fill="#d9c9a3" opacity="0.85"/><ellipse cx="428" cy="282" rx="9" ry="5" fill="#b8a57a"/><ellipse cx="470" cy="282" rx="9" ry="5" fill="#b8a57a"/><ellipse cx="512" cy="282" rx="9" ry="5" fill="#b8a57a"/><ellipse cx="554" cy="282" rx="9" ry="5" fill="#b8a57a"/><ellipse cx="596" cy="282" rx="9" ry="5" fill="#b8a57a"/><ellipse cx="638" cy="282" rx="9" ry="5" fill="#b8a57a"/><ellipse cx="680" cy="282" rx="9" ry="5" fill="#b8a57a"/><circle cx="450" cy="276" r="3" fill="#57534e"/><circle cx="520" cy="272" r="3" fill="#57534e"/><circle cx="606" cy="276" r="3" fill="#57534e"/><circle cx="668" cy="279" r="3" fill="#57534e"/><ellipse cx="560" cy="258" rx="14" ry="9" fill="#60a5fa"/><path class="ln" d="M538,258 L512,258" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scf-h)"/><path class="ln" d="M582,258 L608,258" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scf-h)"/><text x="560" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">coating is water-repellent:</text><text x="560" y="197" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">water is pushed around,</text><text x="560" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">not soaked up</text><text x="560" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">soap curd between and inside fibres</text><text x="560" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">loops glued flat → stiff</text><text x="560" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">soil left behind → greying</text><text x="30" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">Fabric softener adds a waxy film on top: it masks the roughness for a few days</text><text x="30" y="437" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">and blocks water even more.</text>
</svg>
