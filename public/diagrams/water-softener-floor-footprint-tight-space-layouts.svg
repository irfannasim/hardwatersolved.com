<text x="630" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">20 in</text>
<text x="630" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">In a 20 in alcove</text>
<text x="630" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">20 x 34.5 in + 24 in front</text>
<text x="630" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#dc2626">valve reached from above</text>
