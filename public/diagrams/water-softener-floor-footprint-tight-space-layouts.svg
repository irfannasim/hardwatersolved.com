<text x="140" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">30 x 24 in + 24 in front</text>
<text x="140" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">easiest to service</text>
