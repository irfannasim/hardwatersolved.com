<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" role="img" aria-labelledby="fp-title fp-desc">
<title id="fp-title">Water softener floor footprints: side by side, cabinet and alcove layouts</title>
<desc id="fp-desc">Top-down plan of three water softener layouts drawn to one scale: a two-tank softener side by side needing 30 by 24 inches, a cabinet softener needing 14 by 27 inches, and a two-tank softener in line in a 20 inch alcove, each with a 24 inch access zone in front.</desc>
<defs>
<marker id="fp-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#52697a"/></marker>
</defs>
<rect width="760" height="510" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Floor plans: three ways to fit a water softener</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Top-down view, one scale (1 in = 4 px). The wall is at the top of each plan.</text>
<line x1="60" y1="106" x2="220" y2="106" stroke="#0b2f4a" stroke-width="6"/>
<rect x="80" y="110" width="120" height="24" fill="#e2e8f0"/>
