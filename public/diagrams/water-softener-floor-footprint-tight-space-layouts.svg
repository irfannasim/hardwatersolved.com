<text x="140" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Access</text>
<text x="140" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0e7490">24 in</text>
<line class="ln" x1="84" y1="372" x2="196" y2="372" stroke="#52697a" stroke-width="1.5" marker-start="url(#fp-dim)" marker-end="url(#fp-dim)"/>
<text x="140" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">30 in</text>
