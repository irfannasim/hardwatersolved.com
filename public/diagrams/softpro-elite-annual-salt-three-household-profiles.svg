<text x="624.3333333333334" y="542" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3.42 million grains a year</text>
<path d="M96,190 L96,500 L730,500" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="586" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Upflow saves 50 to 330 lb a year over a metered unit at 9 lb/cu ft: about $9 to $58 of salt.</text>
<text x="30" y="608" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Model: 75 gallons per person a day; salt at $7 per 40 lb bag. Upflow efficiency is an assumption,</text>
<text x="30" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">not a SoftPro figure; WC&amp;P reports counter-current 15 to 25% better than co-current at low doses.</text>
