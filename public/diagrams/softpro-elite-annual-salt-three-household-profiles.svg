<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="spsalt-title spsalt-desc">
<title id="spsalt-title">SoftPro Elite review: annual salt use for three household profiles</title>
<desc id="spsalt-desc">Illustrative bar chart for a SoftPro Elite review: yearly salt for a couple at 10 gpg, a family of four at 15 gpg and a family of five at 25 gpg, comparing a timer softener, metered downflow units at 9 and 6 lb per cubic foot, and upflow brining at a low dose, with the salt level a 75 percent saving claim would require.</desc>
<defs></defs>
<rect width="760" height="640" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">SoftPro Elite review: salt a year in three households</text>
<text x="30" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Pounds of salt a year, same hardness load, four ways of regenerating. Illustrative model.</text>
<rect x="30" y="79" width="14" height="14" fill="#78716c" stroke="none" stroke-width="1.5"/>
<text x="52" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Timer unit, 15 lb/cu ft (2,070 grains per lb)</text>
<rect x="390" y="79" width="14" height="14" fill="#94a3b8" stroke="none" stroke-width="1.5"/>
<text x="412" y="91" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Metered downflow, 9 lb/cu ft (2,890 grains per lb)</text>
<rect x="30" y="103" width="14" height="14" fill="#3a5a72" stroke="none" stroke-width="1.5"/>
<text x="52" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Metered downflow, 6 lb/cu ft (3,500 grains per lb)</text>
<rect x="390" y="103" width="14" height="14" fill="#0e7490" stroke="none" stroke-width="1.5"/>
<text x="412" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Upflow at a low dose (about 4,000 grains per lb, assumed)</text>
<path d="M30,147 L62,147" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="70" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">Salt the "up to 75% less" claim implies, measured against the timer unit</text>
<text x="86" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
