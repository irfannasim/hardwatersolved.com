<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="g17of-title g17of-desc">
<title id="g17of-title">Water softener savings ranges compared with the annual cost of ownership</title>
<desc id="g17of-desc">Illustrative ranges of yearly savings from softened water for a family of four on 15 gpg water: detergent $0 to $120, gas water heating $0 to $31, electric water heating $0, appliance life and descaling $0 to $150, together $0 to $300, against a $418 annual cost of ownership.</desc>
<defs><marker id="g17of-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">What softening may save each year, against what it costs</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative ranges for a family of four on 15 gpg water</text>
<path d="M270,100 L270,372" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="270" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$0</text>
<path d="M358,100 L358,372" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="358" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$100</text>
<path d="M446,100 L446,372" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="446" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$200</text>
<path d="M534,100 L534,372" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="534" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$300</text>
<path d="M622,100 L622,372" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="622" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$400</text>
<path d="M710,100 L710,372" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="710" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$500</text>
<text x="258" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Detergent and soap</text>
<rect x="270" y="116" width="105.6" height="20" rx="4" fill="#a5d8e2"/>
<text x="385.6" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">$0–$120  only if you cut the dose</text>
<text x="258" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Gas water heating energy</text>
<rect x="270" y="166" width="27.3" height="20" rx="4" fill="#a5d8e2"/>
<text x="307.3" y="181" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">$0–$31  storage heater, 15 gpg</text>
<text x="258" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Electric water heating energy</text>
<circle cx="270" cy="226" r="6" fill="#0e7490"/>
<text x="286.0" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">$0  no difference measured</text>
<text x="258" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Appliance life and descaling</text>
<rect x="270" y="266" width="132.0" height="20" rx="4" fill="#a5d8e2"/>
<text x="412.0" y="281" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">$0–$150  largest with tankless</text>
<text x="258" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">All offsets together</text>
<rect x="270" y="316" width="264.0" height="20" rx="4" fill="#0e7490"/>
<text x="544.0" y="331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">$0–$300</text>
<path class="ln" d="M637.8,104 L637.8,372" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 5"/>
<text x="637.8" y="88" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">Cost to own: $418 a year</text>
<path class="ln" d="M538.0,356 L633.8,356" fill="none" stroke="#0b2f4a" stroke-width="2" marker-start="url(#g17of-a)" marker-end="url(#g17of-a)"/>
<text x="30" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Even at the top of every range, softening costs about $118 a year more than it saves.</text>
<text x="30" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Ranges start at $0 because each saving depends on your appliances and habits.</text>
</svg>
