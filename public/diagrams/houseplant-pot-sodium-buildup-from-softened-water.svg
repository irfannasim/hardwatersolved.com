<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="hps-title hps-desc">
<title id="hps-title">Why softened water for plants builds up sodium in a pot</title>
<desc id="hps-desc">Cross-section of a houseplant pot watered with softened water. Water leaves as vapour through the leaves and soil surface, but the sodium stays behind and builds up, often showing as a white crust. Only water draining out of the bottom carries some sodium away.</desc>
<defs>
<marker id="hps-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker>
<pattern id="hps-na" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#7c3aed"/><circle cx="11" cy="10" r="1.6" fill="#7c3aed"/></pattern>
</defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Water leaves the pot. The sodium does not.</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Houseplant watered with softened water, repeated over weeks</text>
<polygon points="90,250 290,250 266,420 114,420" fill="#e7d7c1" stroke="#78716c" stroke-width="3"/>
<polygon points="98,266 282,266 268,400 112,400" fill="url(#hps-na)" opacity="0.55"/>
<rect x="96" y="256" width="188" height="9" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
<line x1="190" y1="256" x2="190" y2="160" stroke="#15803d" stroke-width="4"/>
<ellipse cx="160" cy="185" rx="30" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<ellipse cx="222" cy="170" rx="30" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<ellipse cx="190" cy="150" rx="16" ry="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<rect x="178" y="420" width="24" height="6" fill="#ffffff"/>
<g fill="none">
<path class="ln" d="M110,120 L110,238" stroke="#0e7490" stroke-width="6" marker-end="url(#hps-ah)"/>
<path class="ln" d="M262,200 L262,112" stroke="#52697a" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#hps-ah)"/>
<path class="ln" d="M190,428 L190,478" stroke="#78716c" stroke-width="6" marker-end="url(#hps-ah)"/>
<path class="ln" d="M286,262 L318,286" stroke="#52697a" stroke-width="1.5"/>
</g>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="98" font-size="14" font-weight="bold" fill="#0e7490">Softened water in:</text>
<text x="30" y="116" font-size="13" fill="#0b2f4a">water plus sodium</text>
<text x="278" y="132" font-size="14" font-weight="bold" fill="#52697a">Water out as vapour</text>
<text x="278" y="150" font-size="13" fill="#0b2f4a">leaves and soil surface</text>
<text x="324" y="296" font-size="13" font-weight="bold" fill="#7c3aed">White crust</text>
<text x="324" y="313" font-size="13" fill="#0b2f4a">salts left at the top</text>
<text x="210" y="462" font-size="13" fill="#0b2f4a">Drainage carries</text>
<text x="210" y="479" font-size="13" fill="#0b2f4a">some sodium out</text>
</g>
<rect class="box" x="470" y="170" width="260" height="140" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">
<text x="486" y="196" font-size="14" font-weight="bold">Signs of salt building up</text>
<text x="486" y="222">White crust on soil or pot rim</text>
<text x="486" y="246">Brown leaf tips and edges</text>
<text x="486" y="270">Slow growth despite feeding</text>
<text x="486" y="294">Worse in pots with no drainage</text>
</g>
<rect class="box" x="470" y="340" width="260" height="110" rx="6" fill="#e6f4f7" stroke="#0e7490" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">
<text x="486" y="366" font-size="14" font-weight="bold" fill="#0e7490">What fixes it</text>
<text x="486" y="390">Water from an unsoftened tap</text>
<text x="486" y="412">or collected rainwater, and flush</text>
<text x="486" y="434">until water runs from the base</text>
</g>
<text x="30" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Purple dots: sodium held in the potting mix. Diagram is illustrative, not to scale.</text>
</svg>
