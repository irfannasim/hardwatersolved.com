<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" width="760" height="584" role="img" aria-labelledby="ip2s-title ip2s-desc">
<title id="ip2s-title">AFWFilters Iron Pro 2 sizing for three well water profiles</title>
<desc id="ip2s-desc">Stacked bars of compensated hardness for three wells: 14 gpg for two people with 1 ppm iron, 26.2 gpg for four people with 2.5 ppm iron and 0.3 ppm manganese, and 40 gpg for five people with 5 ppm iron. The matching Iron Pro 2 sizes are 32k, 48k and a 64k that only fits on paper.</desc>
<defs><pattern id="ip2s-mn" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fde7c7"/><rect width="2.5" height="6" fill="#b45309"/></pattern></defs>
<rect width="760" height="584" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Iron Pro 2 sizing: compensated hardness for three wells</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Raw hardness + 4 gpg per ppm of iron and manganese. Capacity at 6 lb salt per cu ft.</text><text x="615" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">Model and cycle</text><text x="30" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Profile A: 2 people, 10 gpg, 1.0 ppm iron</text><rect x="30.0" y="136" width="93.3" height="34" fill="#c2410c"/><text x="76.65" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">10 gpg</text><rect x="123.3" y="136" width="37.3" height="34" fill="#b45309"/><rect x="121.8" y="136" width="3" height="34" fill="#ffffff"/><text x="141.96" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="170.62" y="159" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">14 gpg</text><rect class="box" x="500" y="132" width="230" height="76" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="512" y="155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">32k (1.0 cu ft)</text><text x="512" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">10 days of capacity;</text><text x="512" y="193" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">3-day override</text><text x="30" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Profile B: 4 people, 15 gpg, 2.5 ppm iron, 0.3 ppm manganese</text><rect x="30.0" y="254" width="139.9" height="34" fill="#c2410c"/><text x="99.975" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">15 gpg</text><rect x="169.9" y="254" width="93.3" height="34" fill="#b45309"/><rect x="168.4" y="254" width="3" height="34" fill="#ffffff"/><text x="216.6" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">10 gpg</text><rect x="263.3" y="254" width="11.2" height="34" fill="url(#ip2s-mn)" stroke="#b45309" stroke-width="1"/><rect x="261.8" y="254" width="3" height="34" fill="#ffffff"/><text x="284.446" y="277" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">26.2 gpg</text><rect class="box" x="500" y="250" width="230" height="76" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="512" y="273" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">48k (1.5 cu ft)</text><text x="512" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">4.0 days of capacity;</text><text x="512" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">3-day override</text><text x="30" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Profile C: 5 people, 18 gpg, 5 ppm iron, 0.5 ppm manganese</text><rect x="30.0" y="372" width="167.9" height="34" fill="#c2410c"/><text x="113.97" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">18 gpg</text><rect x="197.9" y="372" width="186.6" height="34" fill="#b45309"/><rect x="196.4" y="372" width="3" height="34" fill="#ffffff"/><text x="291.24" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">20 gpg</text><rect x="384.5" y="372" width="18.7" height="34" fill="url(#ip2s-mn)" stroke="#b45309" stroke-width="1"/><rect x="383.0" y="372" width="3" height="34" fill="#ffffff"/><text x="413.2" y="395" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">40 gpg</text><rect class="box" x="500" y="368" width="230" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="512" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">64k fits on paper</text><text x="512" y="411" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">2.8 days; no margin.</text><text x="512" y="429" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Iron filter first</text><path class="ln" d="M30,470 L449.85,470" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M30,470 L30,477" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><path class="ln" d="M123.3,470 L123.3,477" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="123.3" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10</text><path class="ln" d="M216.6,470 L216.6,477" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="216.6" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">20</text><path class="ln" d="M309.9,470 L309.9,477" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="309.9" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">30</text><path class="ln" d="M403.2,470 L403.2,477" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="403.2" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">40</text><text x="239.925" y="516" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">Compensated hardness to program, gpg</text><rect x="30" y="548" width="22" height="13" fill="#c2410c"/><text x="60" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">raw hardness</text><rect x="180" y="548" width="22" height="13" fill="#b45309"/><text x="210" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">iron allowance</text><rect x="340" y="548" width="22" height="13" fill="url(#ip2s-mn)" stroke="#b45309" stroke-width="1"/><text x="370" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">manganese allowance</text>
</svg>
