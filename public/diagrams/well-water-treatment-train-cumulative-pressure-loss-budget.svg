<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="wtb-title wtb-desc">
<title id="wtb-title">Cumulative pressure loss through a well water treatment train</title>
<desc id="wtb-desc">Illustrative pressure line through a well treatment train at 8 gpm, including water softener pressure drop: losses of 30.2 psi take 40 psi at cut-in down to 9.8 psi at an upstairs shower and 60 psi at cut-out down to 29.8 psi.</desc>
<defs></defs>
<rect width="760" height="592" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Pressure through a well treatment train at 8 gpm</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative. 40/60 pressure switch; each stage drop scaled to 8 gpm from its assumed rating.</text>
<text x="30" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Pressure while flowing (psi)</text>
<text x="90" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<path d="M100,397.7 L716,397.7" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="402.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">10</text>
<path d="M100,345.4 L716,345.4" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="350.4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">20</text>
<path d="M100,293.1 L716,293.1" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="298.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">30</text>
<path d="M100,240.8 L716,240.8" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="245.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">40</text>
<path d="M100,188.5 L716,188.5" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="193.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">50</text>
<path d="M100,136.2 L716,136.2" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="141.2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">60</text>
<path class="ln" d="M100,110 L100,450 L716,450" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M100,136.2 L198,136.2 L198,143 L266,143 L266,178 L334,178 L334,203.6 L402,203.6 L402,238.7 L470,238.7 L470,243.4 L538,243.4 L538,260.1 L606,260.1 L606,294.1 L716,294.1" fill="none" stroke="#3a5a72" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M100,240.8 L198,240.8 L198,247.6 L266,247.6 L266,282.6 L334,282.6 L334,308.2 L402,308.2 L402,343.3 L470,343.3 L470,348 L538,348 L538,364.7 L606,364.7 L606,398.7 L716,398.7" fill="none" stroke="#0b2f4a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pressure</text>
<text x="130" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tank</text>
<text x="198" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text>
<text x="198" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">cartridge</text>
<text x="198" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">−1.3</text>
<text x="266" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron</text>
<text x="266" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">filter</text>
<text x="266" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">−6.7</text>
<text x="334" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text>
<text x="334" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">−4.9</text>
<text x="402" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Carbon</text>
<text x="402" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">filter</text>
<text x="402" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">−6.7</text>
<text x="470" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">UV</text>
<text x="470" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">unit</text>
<text x="470" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">−0.9</text>
<text x="538" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Piping,</text>
<text x="538" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">fittings</text>
<text x="538" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">−3.2</text>
<text x="606" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Up 15 ft</text>
<text x="606" y="489" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">to shower</text>
<text x="606" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">−6.5</text>
<text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Drop:</text>
<text x="30" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Stage:</text>
<text x="108" y="126.2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#3a5a72">Cut-out: 60 psi</text>
<text x="108" y="230.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Cut-in: 40 psi</text>
<text x="712" y="316.1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#3a5a72">Shower: 29.8 psi</text>
<text x="712" y="420.7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#dc2626">Shower: 9.8 psi</text>
<text x="30" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Total loss at 8 gpm: 30.2 psi. Fine at cut-out, a trickle every time the tank draws down to cut-in.</text>
<text x="30" y="570" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Assumed ratings are examples, not specific products. Use your own spec sheets and gauge readings.</text>
</svg>
