<rect x="384" y="165" width="14" height="60" fill="#0b2f4a"/>
<rect x="398" y="165" width="14" height="60" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1"/>
<rect x="412" y="165" width="14" height="60" fill="#0b2f4a"/>
<rect x="426" y="165" width="14" height="60" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1"/>
<rect x="440" y="165" width="14" height="60" fill="#0b2f4a"/>
<rect x="230" y="187" width="252" height="16" rx="3" fill="#52697a"/>
<rect x="482" y="181" width="40" height="28" rx="4" fill="#3a5a72"/>
<path class="ln" d="M190,160 L190,128" fill="none" stroke="#52697a" stroke-width="1.5"/>
<circle cx="190" cy="113" r="14" fill="#0b2f4a"/>
<text x="190" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<path class="ln" d="M362,165 L362,128" fill="none" stroke="#52697a" stroke-width="1.5"/>
<circle cx="362" cy="113" r="14" fill="#0b2f4a"/>
<text x="362" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<path class="ln" d="M534,115 L586,115" fill="none" stroke="#52697a" stroke-width="1.5"/>
<circle cx="601" cy="115" r="14" fill="#0b2f4a"/>
<text x="601" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<path class="ln" d="M250,203 L250,280" fill="none" stroke="#52697a" stroke-width="1.5"/>
<circle cx="250" cy="295" r="14" fill="#0b2f4a"/>
<text x="250" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<path class="ln" d="M502,209 L502,280" fill="none" stroke="#52697a" stroke-width="1.5"/>
<circle cx="502" cy="295" r="14" fill="#0b2f4a"/>
<text x="502" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="580" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Valve body</text>
<text x="580" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">(housing)</text>
<text x="30" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">#</text>
<text x="66" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">Part (Clack number)</text>
<text x="300" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">Manual lists it for</text>
<text x="580" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">How it is sold</text>
<rect class="box" x="24" y="360" width="712" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="30" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">1</text>
<text x="66" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Spacer stack, V3005-02</text>
<text x="300" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Hard water, water to drain, E1</text>
<text x="580" y="386" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">single part</text>
<rect class="box" x="24" y="408" width="712" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="30" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2</text>
<text x="66" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Main piston, V3011</text>
<text x="300" y="434" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Water to drain, E3 from fouling drag</text>
<text x="580" y="434" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">rebuild kit</text>
<rect class="box" x="24" y="456" width="712" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="30" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">3</text>
<text x="66" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Regenerant piston, V3174</text>
<text x="300" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Valve will not draw brine</text>
<text x="580" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">in the same kit</text>
<rect class="box" x="24" y="504" width="712" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="30" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">4</text>
<text x="66" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Injector, V3010-1 series</text>
<text x="300" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Plugged: no brine draw, salt unused</text>
<text x="580" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">sized to your tank</text>
<rect class="box" x="24" y="552" width="712" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="30" y="578" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">5</text>
<text x="66" y="578" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Drive cap assembly</text>
<text x="300" y="578" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">No regeneration: broken drive gear</text>
<text x="580" y="578" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#52697a">ask your seller</text>
<text x="30" y="622" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Most faults need only a rebuild. A complete WS1 head is for a cracked body or failed electronics.</text>
</svg>
