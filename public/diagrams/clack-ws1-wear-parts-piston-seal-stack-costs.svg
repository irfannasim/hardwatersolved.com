<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" width="760" height="650" role="img" aria-labelledby="cwp-title cwp-desc">
<title id="cwp-title">Clack WS1 wear parts: spacer stack, main piston, regenerant piston, injector and drive cap, with how each is sold</title>
<desc id="cwp-desc">Simplified cross-section of a Clack WS1 water softener control valve showing the five parts its service manual blames most often, the faults each causes, and how each part is sold.</desc>
<rect width="760" height="650" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Clack WS1: the parts that wear, and how they are sold</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Simplified section, not to scale. Faults from the Clack troubleshooting table.</text>
