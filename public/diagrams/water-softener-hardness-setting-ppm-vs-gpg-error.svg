<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" width="760" height="576" role="img" aria-labelledby="wshu-title wshu-desc">
<title id="wshu-title">Water softener hardness setting: ppm vs grains per gallon entry error</title>
<desc id="wshu-desc">How the units error in a water softener hardness setting changes gallons between regenerations: entering 342 ppm as grains makes the valve regenerate about 17 times too often, while entering 20 grains into a mg/L field lets it run out before regenerating.</desc>
<defs></defs>
<rect width="760" height="576" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">One lab result, three hardness entries</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative: water tests 342 mg/L as CaCO3 = 20 gpg; softener has 24,000 grains usable</text><text x="38" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">What was entered</text><text x="218" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Valve reads it as</text><text x="398" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Gallons between</text><text x="398" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">regenerations</text><text x="568" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">What happens</text><rect class="box" x="30" y="130" width="700" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="46" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">PPM TYPED AS GRAINS</text><text x="46" y="184" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">342</text><text x="46" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">in a gpg field</text><text x="226" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">342 gpg</text><text x="226" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">17.1 times too hard</text><text x="406" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#dc2626">about 70</text><text x="406" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">gallons</text><text x="576" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Regenerates as often</text><text x="576" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">as allowed; salt use</text><text x="576" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">multiplies</text><rect class="box" x="30" y="248" width="700" height="104" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="46" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">CORRECT</text><text x="46" y="302" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">20</text><text x="46" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">in a gpg field</text><text x="226" y="302" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">20 gpg</text><text x="226" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the real hardness</text><text x="406" y="302" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#15803d">1,200</text><text x="406" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">gallons</text><text x="576" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Regenerates when</text><text x="576" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the bed is nearly</text><text x="576" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">used up</text><rect class="box" x="30" y="366" width="700" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="46" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">GRAINS TYPED AS PPM</text><text x="46" y="420" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">20</text><text x="46" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">in a mg/L field</text><text x="226" y="420" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">about 1.2 gpg</text><text x="226" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">17.1 times too soft</text><text x="406" y="420" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#dc2626">about 20,500</text><text x="406" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">gallons</text><text x="576" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Runs out long before</text><text x="576" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">it regenerates; hard</text><text x="576" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">water between cycles</text><rect class="box" x="30" y="486" width="700" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="46" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Gallons between regenerations = usable grains / hardness setting</text><text x="46" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">24,000 / 20 = 1,200.   24,000 / 342 = about 70.   24,000 / 1.17 = about 20,500.</text>
</svg>
