<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="gst-title gst-desc">
<title id="gst-title">Water glass standing test: air, iron, tannins and hardness compared</title>
<desc id="gst-desc">Glass-of-water standing test over 30 minutes: entrained air clears from the bottom up, ferrous iron turns orange and drops sediment, ferric iron is orange at once, tannins stay tea-coloured, and hard water stays clear.</desc>
<defs></defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">The glass test: what standing water reveals</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Fill a clear glass with cold water and watch it</text><text x="270" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">just poured</text><text x="370" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">1–2 minutes</text><text x="470" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">30 minutes</text><text x="30" y="160" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Entrained air</text><path d="M242,118 L298,118 L292,184 L248,184 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M244,128 L296,128 L291,182 L249,182 z" fill="#e5e7eb"/><path d="M342,118 L398,118 L392,184 L348,184 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M344,128 L396,128 L391,182 L349,182 z" fill="#eff6ff"/><path d="M344,128 L396,128 L394,152 L346,152 z" fill="#e5e7eb"/><path d="M442,118 L498,118 L492,184 L448,184 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M444,128 L496,128 L491,182 L449,182 z" fill="#eff6ff"/><text x="530" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">clears from the bottom up</text>
<text x="530" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">harmless</text><text x="530" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Softener: no</text><path d="M30,202 L730,202" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Ferrous iron</text><path d="M242,210 L298,210 L292,276 L248,276 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M244,220 L296,220 L291,274 L249,274 z" fill="#eff6ff"/><path d="M342,210 L398,210 L392,276 L348,276 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M344,220 L396,220 L391,274 L349,274 z" fill="#eff6ff"/><path d="M442,210 L498,210 L492,276 L448,276 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M444,220 L496,220 L491,274 L449,274 z" fill="#f3b27a"/><path d="M448,266 L492,266 L491,274 L449,274 z" fill="#b45309"/><text x="530" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">clear, turns orange,</text>
<text x="530" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">drops sediment</text><text x="530" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">Softener: only low levels</text><path d="M30,294 L730,294" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Ferric iron</text><path d="M242,302 L298,302 L292,368 L248,368 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M244,312 L296,312 L291,366 L249,366 z" fill="#f3b27a"/><path d="M342,302 L398,302 L392,368 L348,368 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M344,312 L396,312 L391,366 L349,366 z" fill="#f3b27a"/><path d="M442,302 L498,302 L492,368 L448,368 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M444,312 L496,312 L491,366 L449,366 z" fill="#f3b27a"/><text x="530" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">orange from the start</text><text x="530" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Softener: no, filter it</text><path d="M30,386 L730,386" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="436" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Tannins</text><path d="M242,394 L298,394 L292,460 L248,460 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M244,404 L296,404 L291,458 L249,458 z" fill="#e9c46a"/><path d="M342,394 L398,394 L392,460 L348,460 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M344,404 L396,404 L391,458 L349,458 z" fill="#e9c46a"/><path d="M442,394 L498,394 L492,460 L448,460 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M444,404 L496,404 L491,458 L449,458 z" fill="#e9c46a"/><text x="530" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">yellow to tea-brown,</text>
<text x="530" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">never clears or settles</text><text x="530" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Softener: no</text><path d="M30,478 L730,478" stroke="#e2e8f0" stroke-width="1"/><text x="30" y="528" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Genuine hardness</text><path d="M242,486 L298,486 L292,552 L248,552 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M244,496 L296,496 L291,550 L249,550 z" fill="#eff6ff"/><path d="M342,486 L398,486 L392,552 L348,552 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M344,496 L396,496 L391,550 L349,550 z" fill="#eff6ff"/><path d="M442,486 L498,486 L492,552 L448,552 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M444,496 L496,496 L491,550 L449,550 z" fill="#eff6ff"/><text x="530" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">stays clear, never</text>
<text x="530" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">changes colour</text><text x="530" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">Softener: yes</text><text x="30" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">Chalky white haze that vinegar will not remove is silica, a separate 10-minute vinegar test.</text>
</svg>
