<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="srdc-title srdc-desc">
<title id="srdc-title">Spent water softener resin disposal decision chain</title>
<desc id="srdc-desc">Decision chain for disposing of old water softener resin: if the supply had radium or uranium, contact the state program first; iron-fouled resin is rinsed, drained and double-bagged; ordinary resin is rinsed of brine, drained and bagged for household trash, and never poured down a drain or spread on soil.</desc>
<defs><marker id="rdA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="rdR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="592" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Spent softener resin: which disposal path?</text><rect class="box" x="40" y="66" width="380" height="44" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="230" y="94" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Resin out of the tank</text><path class="ln" d="M230,110 L230,136" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdA)"/><rect class="box" x="40" y="142" width="380" height="64" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="230" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Did a water test show radium</text><text x="230" y="189" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">or uranium in the supply?</text><path class="ln" d="M420,174 L462,174" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdR)"/><text x="441" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="470" y="130" width="260" height="90" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="484" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Stop. Resin concentrates</text><text x="484" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">radionuclides. Ask your state</text><text x="484" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">radiation or waste program first.</text><path class="ln" d="M230,206 L230,238" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdA)"/><text x="244" y="227" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">no</text><rect class="box" x="40" y="244" width="380" height="64" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="230" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Orange or brown beads,</text><text x="230" y="291" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">iron- or manganese-fouled?</text><path class="ln" d="M420,276 L462,276" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdA)"/><text x="441" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">yes</text><rect class="box" x="470" y="236" width="260" height="90" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="484" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Rinse, drain well, double-bag.</text><text x="484" y="279" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Ask the transfer station if</text><text x="484" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">it wants wet media separately.</text><path class="ln" d="M230,308 L230,340" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdA)"/><text x="244" y="329" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">no</text><rect class="box" x="40" y="346" width="380" height="64" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="230" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Rinse in a bucket until the water</text><text x="230" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">no longer tastes salty, then drain</text><path class="ln" d="M230,410 L230,436" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdA)"/><rect class="box" x="40" y="442" width="380" height="52" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="230" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Double-bag and put out with household trash</text><path class="ln" d="M600,326 L600,468 L426,468" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rdA)" stroke-dasharray="7 6"/><text x="610" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#b45309">then</text><rect class="box" x="40" y="516" width="690" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="385" y="540" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Never: down a sink or toilet, into a septic tank, or spread on soil or gravel.</text><text x="385" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">The beads are plastic. They do not break down and they block traps and pumps.</text>
</svg>
