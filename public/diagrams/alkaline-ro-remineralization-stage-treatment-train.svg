<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Alkaline reverse osmosis system: where the remineralization stage sits</title>
<desc id="art-desc">Treatment train of an alkaline reverse osmosis system: sediment filter, carbon filter, RO membrane that strips most dissolved minerals and sends reject to drain, then a mineral stage that adds a small amount of calcium and magnesium back before the faucet, with an illustrative mineral level under each stage.</desc>
<defs>
<marker id="art-at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="art-ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
</defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0b2f4a">Where the alkaline stage sits, and what it adds back</text>

<rect class="box" x="30" y="70" width="120" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="90" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text>
<text x="90" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">filter</text>
<rect class="box" x="180" y="70" width="120" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="240" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Carbon</text>
<text x="240" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">filter</text>
<rect class="box" x="330" y="70" width="120" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="390" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">RO</text>
<text x="390" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">membrane</text>
<rect class="box" x="480" y="70" width="120" height="60" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="540" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Mineral</text>
<text x="540" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">stage</text>
<rect class="box" x="630" y="70" width="100" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="680" y="106" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Faucet</text>
<path class="ln" d="M150,100 L174,100" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#art-at)"/>
<path class="ln" d="M300,100 L324,100" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#art-at)"/>
<path class="ln" d="M450,100 L474,100" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#art-at)"/>
<path class="ln" d="M600,100 L624,100" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#art-at)"/>
<path class="ln" d="M390,130 L390,170" stroke="#78716c" stroke-width="5" fill="none" marker-end="url(#art-ag)"/>
<text x="402" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#78716c">Reject to drain</text>

<text x="90" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Particles</text>
<text x="240" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Chlorine, taste</text>
<text x="390" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Strips most minerals</text>
<text x="540" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0e7490">Adds some Ca, Mg</text>
<text x="680" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">pH lifted</text>

<text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Dissolved minerals after each stage (illustrative)</text>
<rect x="60" y="300" width="60" height="100" fill="#c2410c"/>
<text x="90" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Tap level</text>
<rect x="210" y="300" width="60" height="100" fill="#c2410c"/>
<text x="240" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Tap level</text>
<rect x="360" y="390" width="60" height="10" fill="#0e7490"/>
<text x="390" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Very low</text>
<rect x="510" y="372" width="60" height="28" fill="#0e7490"/>
<text x="540" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Low</text>
<path class="ln" d="M30,400 L730,400" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="30" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Bar heights show direction only. No maker on this page publishes the mineral dose its stage adds.</text>
</svg>
