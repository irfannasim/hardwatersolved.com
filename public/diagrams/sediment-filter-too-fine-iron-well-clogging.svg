<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-labelledby="sft-title sft-desc">
<title id="sft-title">Sediment filter on an iron well: fine cartridge vs coarse screen</title>
<desc id="sft-desc">On an iron well a fine sediment cartridge catches rust formed in the pressure tank and clogs within days, leaving the iron filter idle. A coarse screen or spin-down passes fine iron to the iron filter, with any fine cartridge placed after it.</desc>
<defs><marker id="sft-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="sft-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="sft-o" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs>
<rect width="760" height="436" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Sediment filter on an iron well: why too fine fails</text><text x="30" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">TOO FINE</text><rect class="box" x="30" y="94" width="157" height="104" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="108.5" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Well</text><text x="108.5" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">dissolved iron,</text>
<text x="108.5" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">little oxygen</text><path class="ln" d="M189,146 L203,146" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sft-h)"/><rect class="box" x="211" y="94" width="157" height="104" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="289.5" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pressure tank</text><text x="289.5" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">some iron oxidizes</text>
<text x="289.5" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">into fine rust</text><path class="ln" d="M370,146 L384,146" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sft-h)"/><rect class="box" x="392" y="94" width="157" height="104" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="470.5" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Fine cartridge</text><text x="470.5" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">browns and clogs</text>
<text x="470.5" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">within days;</text>
<text x="470.5" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">house pressure drops</text><path class="ln" d="M551,146 L565,146" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sft-o)"/><rect class="box" x="573" y="94" width="157" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="651.5" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">Iron filter</text><text x="651.5" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">left with</text>
<text x="651.5" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">nothing to do</text><text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">WHAT WORKS</text><rect class="box" x="30" y="264" width="124" height="118" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="92" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Well +</text><text x="92" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">pressure tank</text><text x="92" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">iron, sand</text>
<text x="92" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">and grit</text><path class="ln" d="M156,323 L166,323" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sft-h)"/><rect class="box" x="174" y="264" width="124" height="118" rx="8" fill="#f8fafc" stroke="#15803d" stroke-width="2"/><text x="236" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Coarse screen</text><text x="236" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">or spin-down</text><text x="236" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">catches sand,</text>
<text x="236" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">passes fine iron</text><path class="ln" d="M300,323 L310,323" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sft-h)"/><rect class="box" x="318" y="264" width="124" height="118" rx="8" fill="#f8fafc" stroke="#15803d" stroke-width="2"/><text x="380" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron filter</text><text x="380" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">traps oxidized</text>
<text x="380" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">iron, backwashes</text>
<text x="380" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">it out</text><path class="ln" d="M444,323 L454,323" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sft-h)"/><rect class="box" x="462" y="264" width="124" height="118" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2" stroke-dasharray="6 4"/><text x="524" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Fine cartridge</text><text x="524" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">(optional)</text><text x="524" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">only after the</text>
<text x="524" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">iron filter</text><path class="ln" d="M588,323 L598,323" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sft-h)"/><rect class="box" x="606" y="264" width="124" height="118" rx="8" fill="#f8fafc" stroke="#0e7490" stroke-width="2"/><text x="668" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text><text x="668" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">removes</text>
<text x="668" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">hardness</text><rect x="30" y="412" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated water</text>
<rect x="230" y="412" width="26" height="6" rx="3" fill="#cbd5e1"/><text x="264" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">little or no flow</text>
</svg>
