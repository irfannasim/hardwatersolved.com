<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="dp-title dp-desc">
<title id="dp-title">Water softener drain pump and basin layout when no drain is nearby</title>
<desc id="dp-desc">Layout for a water softener with no drain nearby: the pressurized drain line and the gravity brine overflow line each discharge through an air gap into a pump basin, and the pump lifts the water to an overhead drain. A condensate pump moves 0.8 to 1.3 gpm, below the 1.3 to 3.2 gpm a softener sends to drain.</desc>
<defs>
<marker id="dp-drain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
<pattern id="dp-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern>
</defs>
<rect width="760" height="580" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Pumping softener discharge to a distant drain</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Both lines drop into the basin through air gaps. The pump does the lifting.</text>
<rect x="640" y="100" width="90" height="24" rx="4" fill="#78716c"/>
<text x="640" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Overhead drain</text>
<text x="640" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">trap and air gap</text>
<rect x="65" y="232" width="50" height="208" rx="18" fill="url(#dp-beads)" stroke="#3a5a72" stroke-width="2"/>
<rect x="60" y="200" width="60" height="32" rx="4" fill="#0b2f4a"/>
<rect x="140" y="300" width="80" height="140" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<rect x="144" y="350" width="72" height="87" fill="#e5e7eb"/>
<rect x="220" y="326" width="10" height="10" fill="#3a5a72"/>
<path class="ln" d="M120,214 L440,214 L440,326" fill="none" stroke="#78716c" stroke-width="5" stroke-linejoin="round" marker-end="url(#dp-drain)"/>
<text x="150" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Drain line, pushed by line pressure</text>
<path class="ln" d="M230,331 L390,331 L390,338" fill="none" stroke="#78716c" stroke-width="4" stroke-dasharray="8 5" stroke-linejoin="round" marker-end="url(#dp-drain)"/>
<text x="240" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">overflow, gravity only</text>
<text x="456" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">air gaps at</text>
<text x="456" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">the basin</text>
<rect x="360" y="350" width="180" height="90" rx="4" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="362" y="400" width="176" height="38" fill="#dbeafe"/>
<rect x="484" y="394" width="36" height="42" rx="4" fill="#0b2f4a"/>
<circle cx="378" cy="386" r="6" fill="#dc2626"/>
<path class="ln" d="M520,410 L590,410 L590,112 L632,112" fill="none" stroke="#78716c" stroke-width="5" stroke-linejoin="round" marker-end="url(#dp-drain)"/>
<text x="602" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">pump lifts</text>
<text x="602" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">to the drain</text>
<line x1="30" y1="440" x2="730" y2="440" stroke="#52697a" stroke-width="2"/>
<text x="90" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text>
<text x="180" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Brine tank</text>
<text x="450" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pump basin</text>
<text x="450" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">several gallons; red dot = alarm</text>
<rect class="box" x="30" y="502" width="700" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="46" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Not a condensate pump.</text>
<text x="46" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">A VCMA-20 moves 0.8 to 1.3 gpm; Water-Right softeners send 1.3 to 3.2 gpm to drain.</text>
</svg>
