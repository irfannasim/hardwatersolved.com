<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="shif-title shif-desc">
<title id="shif-title">Seasonal home water softener: bed stagnation and brine tank salt bridging while idle</title>
<desc id="shif-desc">Two cutaways of a water softener left idle in a seasonal home: in the resin tank, still water and no regeneration let bacteria grow in the bed, causing odor on return; in the brine tank, humid air fuses salt into a bridge over an empty space, so the softener makes weak brine and delivers hard water after restart.</desc>
<defs><pattern id="sfR" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="sfS" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#f8fafc"/><rect x="2" y="2" width="9" height="7" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/></pattern></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Two things go wrong while a softener sits idle</text><text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Seasonal homes and low-use households face the same two failure modes</text><rect class="box" x="30" y="80" width="340" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="200" y="106" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1. Bed stagnation (resin tank)</text><rect x="60" y="130" width="90" height="300" rx="40" fill="#dbeafe" stroke="#3a5a72" stroke-width="3"/><path d="M63,200 L147,200 L147,390 Q147,427 105,427 Q63,427 63,390 Z" fill="url(#sfR)"/><circle cx="80" cy="215" r="4" fill="#15803d"/><circle cx="118" cy="240" r="4" fill="#15803d"/><circle cx="92" cy="290" r="4" fill="#15803d"/><circle cx="128" cy="330" r="4" fill="#15803d"/><circle cx="78" cy="360" r="4" fill="#15803d"/><circle cx="110" cy="395" r="4" fill="#15803d"/><circle cx="134" cy="270" r="4" fill="#15803d"/><path class="ln" d="M150,165 L172,165" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="180" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">still water above</text><text x="180" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the bed, no flow</text><path class="ln" d="M150,245 L172,245" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="180" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">no regeneration: brine</text><text x="180" y="257" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">never reaches the resin</text><path class="ln" d="M150,320 L172,320" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="180" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">bacteria multiply in</text><text x="180" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the bed and biofilm</text><text x="180" y="349" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">builds (green dots)</text><text x="200" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">On return: musty or rotten-egg</text><text x="200" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">smell, off taste in the first draw</text><rect class="box" x="390" y="80" width="340" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="560" y="106" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2. Salt bridging (brine tank)</text><rect x="410" y="150" width="120" height="280" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/><rect x="413" y="170" width="114" height="110" rx="0" fill="url(#sfS)"/><rect x="413" y="280" width="114" height="14" rx="0" fill="#94a3b8"/><rect x="413" y="390" width="114" height="37" rx="0" fill="#dbeafe"/><path class="ln" d="M530,230 L552,230" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="560" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">loose salt sits on</text><text x="560" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">a hard crust</text><path class="ln" d="M530,287 L552,287" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="560" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">humid air and warm</text><text x="560" y="299" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and cool swings fuse</text><text x="560" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the salt into a bridge</text><path class="ln" d="M530,345 L552,345" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="560" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">empty space under</text><text x="560" y="367" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the bridge</text><path class="ln" d="M530,408 L552,408" fill="none" stroke="#52697a" stroke-width="1.3"/><text x="560" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">water never touches</text><text x="560" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the salt: weak brine</text><text x="560" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">On return: tank looks full, but</text><text x="560" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">water turns hard after restart</text>
</svg>
