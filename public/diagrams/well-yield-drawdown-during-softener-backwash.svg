<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="wyd-title wyd-desc">
<title id="wyd-title">Well yield vs pump rate during a water softener backwash</title>
<desc id="wyd-desc">Cross-section of a drilled well showing the static water level, the lower level after ten minutes of softener backwash when the pump outruns the well yield, and the pump intake as the limit. Illustrative figures: 2.5 gpm backwash, 1 gpm yield, 6-inch casing.</desc>
<defs>
<marker id="wyd-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="wyd-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker>
</defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Pump rate is not well yield</text>
<text x="30" y="58" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative: 2.5 gpm backwash, 1 gpm well yield, 6-inch casing, 10-minute backwash</text>
<rect x="30" y="130" width="350" height="430" fill="#f5efe6"/>
<line class="ln" x1="30" y1="130" x2="380" y2="130" stroke="#78716c" stroke-width="2"/>
<rect x="172" y="300" width="56" height="258" fill="#dbeafe"/>
<rect x="173" y="200" width="54" height="100" fill="#ffffff" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="170" y1="108" x2="170" y2="558" stroke="#3a5a72" stroke-width="3"/>
<line x1="230" y1="108" x2="230" y2="558" stroke="#3a5a72" stroke-width="3"/>
<rect x="164" y="104" width="72" height="8" fill="#3a5a72"/>
<line class="ln" x1="150" y1="200" x2="160" y2="200" stroke="#52697a" stroke-width="1.5"/>
<text x="144" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Static water level</text>
<line class="ln" x1="150" y1="300" x2="160" y2="300" stroke="#52697a" stroke-width="1.5"/>
<text x="144" y="298" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">Level after 10 min</text>
<text x="144" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">of backwash</text>
<rect x="186" y="440" width="28" height="56" rx="4" fill="#0b2f4a"/>
<rect x="186" y="498" width="28" height="10" fill="#52697a"/>
<line class="ln" x1="150" y1="503" x2="160" y2="503" stroke="#52697a" stroke-width="1.5"/>
<text x="144" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#dc2626">Pump intake:</text>
<text x="144" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#dc2626">the hard floor</text>
<path class="ln" d="M200,440 L200,98 L362,98" fill="none" stroke="#c2410c" stroke-width="5" stroke-linejoin="round" marker-end="url(#wyd-soft)"/>
<text x="250" y="84" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#c2410c">Pump out: 2.5 gpm</text>
<line class="ln" x1="238" y1="200" x2="238" y2="300" stroke="#52697a" stroke-width="1.5"/>
<line class="ln" x1="234" y1="200" x2="244" y2="200" stroke="#52697a" stroke-width="1.5"/>
<line class="ln" x1="234" y1="300" x2="244" y2="300" stroke="#52697a" stroke-width="1.5"/>
<text x="252" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Drawn from</text>
<text x="252" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">casing: 15 gal</text>
<text x="252" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">≈ 10 ft</text>
<text x="252" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Aquifer refills</text>
<text x="252" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">1 gpm (yield)</text>
<path class="ln" d="M340,412 L244,412" fill="none" stroke="#52697a" stroke-width="5" marker-end="url(#wyd-hard)"/>
<path class="ln" d="M340,446 L244,446" fill="none" stroke="#52697a" stroke-width="5" marker-end="url(#wyd-hard)"/>
<rect class="box" x="400" y="100" width="330" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="416" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Pump rate</text>
<text x="416" y="148" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">What a 30-second bucket test at the</text>
<text x="416" y="167" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">pressure tank measures.</text>
<rect class="box" x="400" y="194" width="330" height="100" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="416" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Well yield</text>
<text x="416" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">The most the well can be pumped</text>
<text x="416" y="261" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">without pulling the water below the</text>
<text x="416" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">pump intake (Penn State Extension).</text>
<rect class="box" x="400" y="308" width="330" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="416" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Casing storage</text>
<text x="416" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">About 1.47 gallons per foot of</text>
<text x="416" y="375" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">standing water in a 6-inch well.</text>
<rect class="box" x="400" y="402" width="330" height="138" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="416" y="428" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">The backwash shortfall</text>
<text x="416" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">(2.5 − 1 gpm) × 10 min = 15 gal</text>
<text x="416" y="469" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">15 gal ÷ 1.47 gal/ft ≈ 10 ft drawdown</text>
<text x="416" y="496" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#15803d">100 ft of water above the pump: fine.</text>
<text x="416" y="518" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">15 ft after a busy evening: fails.</text>
<rect x="30" y="576" width="26" height="6" rx="3" fill="#c2410c"/>
<text x="64" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">pumped to softener</text>
<rect x="230" y="576" width="26" height="6" rx="3" fill="#52697a"/>
<text x="264" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">aquifer recharge</text>
<rect x="396" y="572" width="22" height="14" fill="#dbeafe"/>
<text x="426" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">water in casing</text>
<rect x="548" y="572" width="22" height="14" fill="#ffffff" stroke="#0e7490" stroke-dasharray="4 3"/>
<text x="578" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">drawn down by backwash</text>
</svg>
