<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="phc-title phc-desc">
<title id="phc-title">Softened water in a hot tub or pool: calcium hardness ranges vs a softened fill</title>
<desc id="phc-desc">Two scales of calcium hardness from 0 to 500 ppm. Pools: minimum 150, ideal 200 to 400. Spas and hot tubs: minimum 100, ideal 150 to 250. A fill with fully softened water starts near zero, below both minimums, while an example 15 gpg hard supply starts at about 257 ppm.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Calcium hardness is a target, not a contaminant</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">ppm as CaCO3. Ranges: PHTA guidelines as published by Taylor Technologies.</text>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="110" font-size="15" font-weight="bold" fill="#0b2f4a">Pools</text>
<rect x="100" y="126" width="600" height="28" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="100" y="126" width="180" height="28" fill="#fee2e2"/>
<rect x="340" y="126" width="240" height="28" fill="#0e7490"/>
<text x="500" y="145" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Ideal 200 to 400</text>
<text x="190" y="145" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Below minimum 150</text>
<text x="30" y="210" font-size="15" font-weight="bold" fill="#0b2f4a">Spas and</text>
<text x="30" y="228" font-size="15" font-weight="bold" fill="#0b2f4a">hot tubs</text>
<rect x="100" y="236" width="600" height="28" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="100" y="236" width="120" height="28" fill="#fee2e2"/>
<rect x="280" y="236" width="120" height="28" fill="#0e7490"/>
<text x="340" y="255" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">150 to 250</text>
<text x="160" y="255" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Below 100</text>
<g font-size="12" fill="#52697a" text-anchor="middle">
<text x="100" y="286">0</text><text x="220" y="286">100</text><text x="340" y="286">200</text><text x="460" y="286">300</text><text x="580" y="286">400</text><text x="700" y="286">500</text>
</g>
<rect x="100" y="126" width="6" height="28" fill="#7c3aed"/>
<rect x="100" y="236" width="6" height="28" fill="#7c3aed"/>
<rect x="405" y="126" width="6" height="28" fill="#c2410c"/>
<rect x="405" y="236" width="6" height="28" fill="#c2410c"/>
<path class="ln" d="M103,298 L103,310" stroke="#7c3aed" stroke-width="3"/>
<path class="ln" d="M408,298 L408,310" stroke="#c2410c" stroke-width="3"/>
<text x="100" y="328" font-size="14" font-weight="bold" fill="#7c3aed">Softened fill: near 0</text>
<text x="408" y="328" font-size="14" font-weight="bold" fill="#c2410c" text-anchor="middle">Hard fill, 15 gpg: about 257</text>
</g>
<rect class="box" x="30" y="352" width="700" height="96" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#0b2f4a">
<text x="46" y="378" font-size="14" font-weight="bold">Water below the minimum is aggressive</text>
<text x="46" y="401" font-size="13">It pulls calcium from plaster and grout and corrodes metal heaters and fittings.</text>
<text x="46" y="423" font-size="13">A softened fill has to be brought back up with calcium chloride before it is in balance.</text>
</g>
</svg>
