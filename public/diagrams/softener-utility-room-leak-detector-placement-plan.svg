<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" role="img" aria-labelledby="ldp-title ldp-desc">
<title id="ldp-title">Leak detector placement plan around a water softener and water heater</title>
<desc id="ldp-desc">Plan view of a utility room showing where leak detectors for water softeners go: an automatic shutoff on the main upstream of the softener, and floor sensors beside the softener valve, beside the brine tank, in the water heater pan and under the main shutoff, with no sensor at the floor drain where regeneration water splashes.</desc>
<defs>
<marker id="ldp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="ldp-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="ldp-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
</defs>
<rect width="760" height="550" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Where leak detectors go around a softener</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Plan view of a utility room, seen from above. Illustrative layout.</text>
<rect class="box" x="30" y="90" width="470" height="430" fill="#f8fafc" stroke="#3a5a72" stroke-width="3"/>
<text x="38" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c">Main in</text>
<path class="ln" d="M30,140 L226,140 L226,184" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#ldp-h)"/>
<rect class="box" x="94" y="128" width="40" height="24" rx="4" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="80" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0e7490">Auto shutoff</text>
<circle cx="250" cy="230" r="42" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="250" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Softener</text>
<circle cx="370" cy="230" r="52" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="370" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Brine tank</text>
<path class="ln" d="M292,230 L318,230" fill="none" stroke="#7c3aed" stroke-width="4"/>
<path class="ln" d="M150,230 L38,230" fill="none" stroke="#0e7490" stroke-width="5" marker-end="url(#ldp-a)"/>
<text x="40" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0e7490">Cold to house</text>
<path class="ln" d="M208,230 L150,230 L150,326" fill="none" stroke="#0e7490" stroke-width="5" marker-end="url(#ldp-a)"/>
<circle cx="150" cy="400" r="68" fill="none" stroke="#52697a" stroke-width="1.5" stroke-dasharray="5 4"/>
<circle cx="150" cy="400" r="54" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="150" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Water</text>
<text x="150" y="413" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">heater</text>
<path class="ln" d="M90,400 L50,400 L50,514" fill="none" stroke="#0e7490" stroke-width="5" marker-end="url(#ldp-a)"/>
<text x="62" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0e7490">Hot to house</text>
<path class="ln" d="M268,268 L268,430 L364,430" fill="none" stroke="#78716c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ldp-g)"/>
<path class="ln" d="M380,282 L380,414" fill="none" stroke="#78716c" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ldp-g)"/>
<circle cx="380" cy="430" r="12" fill="#e7e5e4" stroke="#78716c" stroke-width="2"/>
<text x="400" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Floor drain</text>
<text x="400" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">No sensor here</text>
<text x="290" y="344" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#78716c">Drain lines</text>
<circle cx="150" cy="182" r="11" fill="#15803d"/>
<text x="150" y="186" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="222" cy="296" r="11" fill="#15803d"/>
<text x="222" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="450" cy="250" r="11" fill="#15803d"/>
<text x="450" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="200" cy="446" r="11" fill="#15803d"/>
<text x="200" y="450" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<rect class="box" x="520" y="90" width="210" height="196" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="534" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Floor sensors</text>
<text x="534" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">1  Floor below the softener</text>
<text x="552" y="157" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">valve and bypass</text>
<text x="534" y="181" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">2  Beside the brine tank,</text>
<text x="552" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">on the low side</text>
<text x="534" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">3  In the water heater pan</text>
<text x="534" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">4  Under the main shutoff</text>
<text x="552" y="263" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">and meter</text>
<rect class="box" x="520" y="298" width="210" height="110" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="534" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Automatic shutoff</text>
<text x="534" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">On the main, upstream of</text>
<text x="534" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">the softener bypass, so</text>
<text x="534" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">closing it isolates every</text>
<text x="534" y="397" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">fitting after it</text>
<rect class="box" x="520" y="420" width="210" height="100" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="534" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">False alarms</text>
<text x="534" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Keep sensors away from</text>
<text x="534" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">the drain, where nightly</text>
<text x="534" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">regeneration water splashes</text>
</svg>
