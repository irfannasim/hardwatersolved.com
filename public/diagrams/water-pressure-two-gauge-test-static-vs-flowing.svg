<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" width="760" height="630" role="img" aria-labelledby="g4tg-title g4tg-desc">
<title id="g4tg-title">Two-gauge water pressure test: static vs flowing readings</title>
<desc id="g4tg-desc">A pressure gauge on the hose bib is read with everything off, then with the tub running. Clean plumbing drops 5 to 10 psi; a restriction such as scale drops 20 psi or more, even though both read the same static pressure.</desc>
<defs><marker id="g4tg-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="630" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">The two-gauge test: static vs flowing</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Same gauge, same hose bib. Only the flowing reading exposes a restriction.</text><text x="30" y="165" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Supply in</text><path class="ln" d="M112,160 L620,160" fill="none" stroke="#3a5a72" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4tg-as)"/><path class="ln" d="M220,160 L220,132" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="220" cy="118" r="14" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><path class="ln" d="M220,118 L228,110" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hose bib + screw-on gauge</text><text x="246" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the bib nearest where the supply enters</text><text x="730" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Bathtub cold spout</text><text x="730" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">opened fully for Reading 2</text><text x="290" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Reading 1: static</text><text x="290" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">everything off</text><text x="480" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Reading 2: flowing</text><text x="480" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tub running</text><text x="30" y="311" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Clean plumbing</text><circle cx="290" cy="315" r="52" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><path d="M260.3,344.7 A42,42 0 1 1 319.7,344.7" fill="none" stroke="#cbd5e1" stroke-width="6"/><path d="M264.5,340.5 L258.2,346.8" stroke="#3a5a72" stroke-width="1.5"/><path d="M254.4,309.4 L245.6,308" stroke="#3a5a72" stroke-width="1.5"/><path d="M273.7,282.9 L269.6,274.9" stroke="#3a5a72" stroke-width="1.5"/><path d="M306.3,282.9 L310.4,274.9" stroke="#3a5a72" stroke-width="1.5"/><path d="M325.6,309.4 L334.4,308" stroke="#3a5a72" stroke-width="1.5"/><path d="M315.5,340.5 L321.8,346.8" stroke="#3a5a72" stroke-width="1.5"/><text x="275" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><text x="303" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">100</text><path d="M290,315 L298.9,278" stroke="#0b2f4a" stroke-width="3.5" stroke-linecap="round"/><circle cx="290" cy="315" r="5" fill="#0b2f4a"/><circle cx="480" cy="315" r="52" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><path d="M450.3,344.7 A42,42 0 1 1 509.7,344.7" fill="none" stroke="#cbd5e1" stroke-width="6"/><path d="M454.5,340.5 L448.2,346.8" stroke="#3a5a72" stroke-width="1.5"/><path d="M444.4,309.4 L435.6,308" stroke="#3a5a72" stroke-width="1.5"/><path d="M463.7,282.9 L459.6,274.9" stroke="#3a5a72" stroke-width="1.5"/><path d="M496.3,282.9 L500.4,274.9" stroke="#3a5a72" stroke-width="1.5"/><path d="M515.6,309.4 L524.4,308" stroke="#3a5a72" stroke-width="1.5"/><path d="M505.5,340.5 L511.8,346.8" stroke="#3a5a72" stroke-width="1.5"/><text x="465" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><text x="493" y="351" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">100</text><path d="M480,315 L475.5,277.3" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/><circle cx="480" cy="315" r="5" fill="#0b2f4a"/><text x="290" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">55 psi</text><text x="480" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">drops 5–10 psi</text><text x="566" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Normal:</text><text x="566" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">plumbing is fine</text><text x="30" y="466" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Restricted</text><text x="30" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">scale, a part-</text><text x="30" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">closed valve</text><circle cx="290" cy="470" r="52" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><path d="M260.3,499.7 A42,42 0 1 1 319.7,499.7" fill="none" stroke="#cbd5e1" stroke-width="6"/><path d="M264.5,495.5 L258.2,501.8" stroke="#3a5a72" stroke-width="1.5"/><path d="M254.4,464.4 L245.6,463" stroke="#3a5a72" stroke-width="1.5"/><path d="M273.7,437.9 L269.6,429.9" stroke="#3a5a72" stroke-width="1.5"/><path d="M306.3,437.9 L310.4,429.9" stroke="#3a5a72" stroke-width="1.5"/><path d="M325.6,464.4 L334.4,463" stroke="#3a5a72" stroke-width="1.5"/><path d="M315.5,495.5 L321.8,501.8" stroke="#3a5a72" stroke-width="1.5"/><text x="275" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><text x="303" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">100</text><path d="M290,470 L298.9,433" stroke="#0b2f4a" stroke-width="3.5" stroke-linecap="round"/><circle cx="290" cy="470" r="5" fill="#0b2f4a"/><circle cx="480" cy="470" r="52" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><path d="M450.3,499.7 A42,42 0 1 1 509.7,499.7" fill="none" stroke="#cbd5e1" stroke-width="6"/><path d="M454.5,495.5 L448.2,501.8" stroke="#3a5a72" stroke-width="1.5"/><path d="M444.4,464.4 L435.6,463" stroke="#3a5a72" stroke-width="1.5"/><path d="M463.7,437.9 L459.6,429.9" stroke="#3a5a72" stroke-width="1.5"/><path d="M496.3,437.9 L500.4,429.9" stroke="#3a5a72" stroke-width="1.5"/><path d="M515.6,464.4 L524.4,463" stroke="#3a5a72" stroke-width="1.5"/><path d="M505.5,495.5 L511.8,501.8" stroke="#3a5a72" stroke-width="1.5"/><text x="465" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><text x="493" y="506" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">100</text><path d="M480,470 L452.7,443.6" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/><circle cx="480" cy="470" r="5" fill="#0b2f4a"/><text x="290" y="546" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">55 psi</text><text x="480" y="546" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">drops 20+ psi</text><text x="566" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Restriction between</text><text x="566" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">main and house</text><rect class="box" x="30" y="574" width="700" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="380" y="598" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Friction losses only appear when water moves. Needle positions are illustrative.</text>
</svg>
