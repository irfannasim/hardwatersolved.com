<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" width="760" height="548" role="img" aria-labelledby="wmp-title wmp-desc">
<title id="wmp-title">Water main break water softener protocol: bypass, wait, flush, reconnect</title>
<desc id="wmp-desc">Four-step water softener protocol for a water main break or any supply outage: put the softener in bypass, wait for the utility to restore service, flush from a tap ahead of the softener until clear, then reconnect slowly and regenerate, with the pressure surge risk explained.</desc>
<defs><marker id="wmp-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="548" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">One softener protocol for every supply disruption</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Main break, planned outage, storm or wildfire: the softener steps are the same.</text><rect class="box" x="30" y="88" width="150" height="44" rx="8" fill="#3a5a72" stroke="#3a5a72" stroke-width="2"/><text x="105" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">1  Bypass</text><rect class="box" x="30" y="146" width="150" height="150" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="40" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Do</text><text x="40" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Turn the bypass to</text><text x="40" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">BYPASS as soon as</text><text x="40" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">you hear of the</text><text x="40" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">outage, before the</text><text x="40" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">water comes back.</text><text x="40" y="261" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pause any timed</text><text x="40" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">regeneration.</text><rect class="box" x="30" y="310" width="150" height="120" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="40" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">Move on when</text><text x="40" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">No water can pass</text><text x="40" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">through the softener</text><text x="40" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">(check a tap on the</text><text x="40" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">house side runs</text><text x="40" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">hard, not soft).</text><path class="ln" d="M184,110 L202,110" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmp-a)"/><rect class="box" x="210" y="88" width="150" height="44" rx="8" fill="#52697a" stroke="#52697a" stroke-width="2"/><text x="285" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">2  Wait</text><rect class="box" x="210" y="146" width="150" height="150" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="220" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Do</text><text x="220" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Let the utility</text><text x="220" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">refill the main.</text><text x="220" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Keep taps shut</text><text x="220" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">except one cold tap</text><text x="220" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">cracked open low</text><text x="220" y="261" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">in the house to</text><text x="220" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">let air escape.</text><rect class="box" x="210" y="310" width="150" height="120" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="220" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">Move on when</text><text x="220" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The utility says</text><text x="220" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">service is restored</text><text x="220" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and any boil or</text><text x="220" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">do-not-drink notice</text><text x="220" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">has been lifted.</text><path class="ln" d="M364,110 L382,110" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmp-a)"/><rect class="box" x="390" y="88" width="150" height="44" rx="8" fill="#78716c" stroke="#78716c" stroke-width="2"/><text x="465" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">3  Flush</text><rect class="box" x="390" y="146" width="150" height="150" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="400" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Do</text><text x="400" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Run the tap nearest</text><text x="400" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the meter, ideally a</text><text x="400" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">hose bib ahead of</text><text x="400" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the softener. Then</text><text x="400" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">every cold tap, top</text><text x="400" y="261" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">floor down, about</text><text x="400" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">five minutes each.</text><rect class="box" x="390" y="310" width="150" height="120" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="400" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">Move on when</text><text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water fills a white</text><text x="400" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">cup clear, with no</text><text x="400" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">sputtering air and</text><text x="400" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">normal pressure at</text><text x="400" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">every tap.</text><path class="ln" d="M544,110 L562,110" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmp-a)"/><rect class="box" x="570" y="88" width="150" height="44" rx="8" fill="#0e7490" stroke="#0e7490" stroke-width="2"/><text x="645" y="116" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">4  Reconnect</text><rect class="box" x="570" y="146" width="150" height="150" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="580" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Do</text><text x="580" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Open the bypass</text><text x="580" y="201" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">slowly, part way</text><text x="580" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">first, and bleed air</text><text x="580" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">at a nearby tap.</text><text x="580" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Then open fully and</text><text x="580" y="261" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">start a manual</text><text x="580" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">regeneration.</text><rect class="box" x="570" y="310" width="150" height="120" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="580" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">Move on when</text><text x="580" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hardness tests soft</text><text x="580" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">at a tap. Prefilter</text><text x="580" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and brine tank show</text><text x="580" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">no new sediment.</text><rect class="box" x="30" y="448" width="700" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="46" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Pressure surge on restoration</text><text x="46" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Air trapped in the empty main is pushed ahead of the returning water, then the water slams in behind it.</text><text x="46" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">In bypass, that first slug of air, grit and pressure goes past the softener, not through the resin bed.</text>
</svg>
