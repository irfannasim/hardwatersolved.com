<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="mts-title mts-desc">
<title id="mts-title">Metered vs timer water softener: annual salt and regeneration water</title>
<desc id="mts-desc">Illustrative bar charts for one three-person household on 15 gpg water. A timer softener set every 3 days uses 732 lb of salt and 6,100 gallons a year; every 4 days, 546 lb and 4,550 gallons; a metered softener, 426 lb and 3,550 gallons.</desc>
<defs></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">One household, three control settings, one year</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative: 3 people, 15 gpg, 1 cu ft bed at 6 lb salt, 50 gallons per regeneration, 2 weeks away</text>
<text x="30" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Salt per year</text>
<text x="82" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<path d="M90,332.5 L360,332.5" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="82" y="337.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">200</text>
<path d="M90,265 L360,265" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="82" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">400</text>
<path d="M90,197.5 L360,197.5" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="82" y="202.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">600</text>
<path d="M90,130 L360,130" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="82" y="135" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">800</text>
<path d="M90,400 L360,400" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<rect x="112.5" y="152.9" width="60" height="247.1" fill="#78716c"/>
<text x="142.5" y="144.9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">732</text>
<text x="142.5" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Timer,</text>
<text x="142.5" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">every 3 days</text>
<rect x="195" y="215.7" width="60" height="184.3" fill="#a8a29e"/>
<text x="225" y="207.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">546</text>
<text x="225" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Timer,</text>
<text x="225" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">every 4 days</text>
<rect x="277.5" y="256.2" width="60" height="143.8" fill="#0e7490"/>
<text x="307.5" y="248.2" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">426</text>
<text x="307.5" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Metered</text>
<text x="307.5" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">(demand)</text>
<text x="90" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">pounds of salt</text>
<text x="400" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Regeneration water per year</text>
<text x="452" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<path d="M460,322.9 L730,322.9" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="452" y="327.9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">2,000</text>
<path d="M460,245.7 L730,245.7" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="452" y="250.7" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">4,000</text>
<path d="M460,168.6 L730,168.6" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="452" y="173.6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">6,000</text>
<path d="M460,400 L730,400" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<rect x="482.5" y="164.7" width="60" height="235.3" fill="#78716c"/>
<text x="512.5" y="156.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">6,100</text>
<text x="512.5" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Timer,</text>
<text x="512.5" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">every 3 days</text>
<rect x="565" y="224.5" width="60" height="175.5" fill="#a8a29e"/>
<text x="595" y="216.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">4,550</text>
<text x="595" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Timer,</text>
<text x="595" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">every 4 days</text>
<rect x="647.5" y="263.1" width="60" height="136.9" fill="#0e7490"/>
<text x="677.5" y="255.10000000000002" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">3,550</text>
<text x="677.5" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Metered</text>
<text x="677.5" y="438" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">(demand)</text>
<text x="460" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">gallons to drain</text>
<rect class="box" x="30" y="490" width="700" height="52" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="380" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Metered saves 120 to 306 lb of salt and 1,000 to 2,550 gallons a year here,</text>
<text x="380" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">depending on how cautiously the timer was set (122, 91 and 71 regenerations)</text>
</svg>
