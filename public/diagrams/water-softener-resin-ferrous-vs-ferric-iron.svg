<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 552" width="760" height="552" role="img" aria-labelledby="fe-title fe-desc">
<title id="fe-title">Water softener resin: dissolved ferrous iron vs oxidized ferric iron</title>
<desc id="fe-desc">Diagram showing water softener resin exchanging dissolved ferrous iron like calcium and magnesium for sodium, while oxidized ferric iron particles lodge between and coat the resin beads, fouling the bed.</desc>
<defs><marker id="fe-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="fe-iron" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="fe-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="fe-tink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="fe-tiron" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="fe-tmuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="552" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Dissolved iron exchanges. Oxidized iron fouls.</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Same resin, two forms of iron, two very different outcomes.</text><path d="M380,96 L380,410" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Dissolved ferrous iron (Fe²⁺)</text><circle cx="210" cy="250" r="78" fill="#e2b865" stroke="#b7791f" stroke-width="3"/><text x="210" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">resin bead</text><text x="210" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">holds Na⁺</text><text x="40" y="201" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Ca²⁺</text><path class="ln" d="M86,196 L142,196" fill="none" stroke="#0b2f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fe-ink)"/><text x="40" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Mg²⁺</text><path class="ln" d="M86,250 L120,250" fill="none" stroke="#0b2f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fe-ink)"/><text x="40" y="309" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#b45309">Fe²⁺</text><path class="ln" d="M86,304 L142,304" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fe-iron)"/><path class="ln" d="M298,250 L334,250" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fe-muted)"/><text x="342" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#52697a">Na⁺</text><text x="30" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fe²⁺ carries the same double positive</text><text x="30" y="379" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">charge as calcium, so it swaps onto the</text><text x="30" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">resin and comes off at regeneration.</text><text x="410" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">Oxidized ferric iron (particles)</text><circle cx="500" cy="190" r="32" fill="#e2b865" stroke="#b7791f" stroke-width="2"/><circle cx="580" cy="180" r="32" fill="#e2b865" stroke="#b7791f" stroke-width="2"/><circle cx="660" cy="200" r="32" fill="#e2b865" stroke="#b7791f" stroke-width="2"/><circle cx="530" cy="268" r="32" fill="#e2b865" stroke="#b7791f" stroke-width="2"/><circle cx="612" cy="262" r="32" fill="#e2b865" stroke="#b7791f" stroke-width="2"/><circle cx="690" cy="280" r="32" fill="#e2b865" stroke="#b7791f" stroke-width="2"/><circle cx="560" cy="334" r="32" fill="#e2b865" stroke="#b7791f" stroke-width="2"/><circle cx="640" cy="334" r="32" fill="#e2b865" stroke="#b7791f" stroke-width="2"/><path d="M470,180 A32,32 0 0 1 510,160" fill="none" stroke="#b45309" stroke-width="7"/><path d="M582,252 A32,32 0 0 1 622,232" fill="none" stroke="#b45309" stroke-width="7"/><path d="M530,324 A32,32 0 0 1 570,304" fill="none" stroke="#b45309" stroke-width="7"/><path d="M630,190 A32,32 0 0 1 670,170" fill="none" stroke="#b45309" stroke-width="7"/><path d="M532,226 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><path d="M612,222 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><path d="M564,300 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><path d="M646,302 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><path d="M598,356 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><path d="M462,240 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><path d="M692,238 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><path d="M512,150 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><path d="M604,142 q3,-8 9,-6 q8,-3 7,5 q2,7 -7,7 q-8,2 -9,-6 z" fill="#b45309"/><text x="410" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">No ion left to exchange. Particles are</text><text x="410" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">strained out, coat the beads and block</text><text x="410" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">exchange sites. Capacity drops each cycle.</text><rect class="box" x="30" y="470" width="700" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Example:</tspan> 1.5 ppm total iron, under a 2 ppm rating on paper</text><text x="46" y="514" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">1.0 ppm dissolved exchanges normally · 0.5 ppm oxidized is trapped and fouls the bed</text>
</svg>
