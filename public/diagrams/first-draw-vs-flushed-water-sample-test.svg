<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 472" width="760" height="472" role="img" aria-labelledby="g4fd-title g4fd-desc">
<title id="g4fd-title">First-draw vs flushed water sample test for a metallic taste</title>
<desc id="g4fd-desc">Diagram of the first-draw versus flushed test: sample A is water that stood in the house plumbing for six hours or more, sample B is taken after running the cold kitchen tap for three to five minutes, showing whether a metallic taste comes from pipes or the supply.</desc>
<defs><pattern id="g4fd-cu" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#dbeafe"/><circle cx="4" cy="4" r="2" fill="#c2703d"/></pattern></defs>
<rect width="760" height="472" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">First draw vs flushed: where is the metal from?</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Two bottles from the same cold kitchen tap show whether it is your plumbing or the supply.</text><text x="30" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">SUPPLY</text><text x="186" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">YOUR PLUMBING</text><path class="ln" d="M170,110 L170,214" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><rect x="30" y="156" width="150" height="22" rx="0" fill="#dbeafe" stroke="#3a5a72" stroke-width="2"/><rect x="170" y="156" width="430" height="22" fill="url(#g4fd-cu)" stroke="#3a5a72" stroke-width="2"/><rect x="590" y="108" width="22" height="70" rx="0" fill="url(#g4fd-cu)" stroke="#3a5a72" stroke-width="2"/><rect x="590" y="100" width="70" height="16" rx="4" fill="#3a5a72"/><rect x="646" y="116" width="14" height="16" rx="0" fill="#3a5a72"/><text x="386" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">stood 6+ hours: picks up metal from pipes and fittings</text><text x="730" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">cold kitchen tap</text><rect x="630" y="222" width="16" height="10" rx="2" fill="#0b2f4a"/><rect x="622" y="232" width="32" height="56" rx="6" fill="#c2703d" stroke="#3a5a72" stroke-width="2"/><text x="638" y="266" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">A</text><rect x="680" y="222" width="16" height="10" rx="2" fill="#0b2f4a"/><rect x="672" y="232" width="32" height="56" rx="6" fill="#0e7490" stroke="#3a5a72" stroke-width="2"/><text x="688" y="266" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">B</text><circle cx="46" cy="262" r="14" fill="#c2703d"/><text x="46" y="267.04" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">A</text><text x="72" y="258" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Sample A: first draw</text><text x="72" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">After 6+ hours unused, fill at once: no flushing, aerator left on.</text><circle cx="46" cy="322" r="14" fill="#0e7490"/><text x="46" y="327.04" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">B</text><text x="72" y="318" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Sample B: flushed</text><text x="72" y="338" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Run the same tap for 3–5 minutes, then fill.</text><rect class="box" x="30" y="366" width="340" height="58" rx="8" fill="#fdf6f0" stroke="#c2703d" stroke-width="2"/><text x="46" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">A much higher than B</text><text x="46" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">metal is dissolving from your plumbing</text><rect class="box" x="390" y="366" width="340" height="58" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="406" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Both similar and elevated</text><text x="406" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">metal is arriving in the supply</text><text x="30" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Send both to a certified lab for copper, lead, iron, zinc and pH.</text>
</svg>
