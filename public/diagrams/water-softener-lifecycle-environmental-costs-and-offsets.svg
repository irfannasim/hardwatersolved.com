<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="wel-title wel-desc">
<title id="wel-title">Water softener environmental impact across its lifecycle: costs and offsets</title>
<desc id="wel-desc">Illustrative lifecycle for one house: salt production and delivery, 438 lb of salt and 26 to 44 kWh a year, 5,300 gallons and 266 lb of chloride to the drain that pass the treatment plant into rivers or aquifers, and end-of-life waste, set against gas heater energy savings, longer appliance life and detergent savings.</desc>
<defs><marker id="wel-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="wel-t" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="wel-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">A water softener's lifecycle: costs and offsets for one house</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative year: family of four, 15 gpg, efficient metered softener, gas water heater</text><rect class="box" x="30" y="96" width="190" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="125" y="122" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Salt production</text><text x="125" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">mine, pond or vacuum pan</text><path class="ln" d="M125,163 L125,186" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wel-g)"/><rect class="box" x="30" y="196" width="190" height="64" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="125" y="222" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Truck and store</text><text x="125" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">bulk, low-value freight</text><path class="ln" d="M223,228 L275,228" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wel-g)"/><rect class="box" x="285" y="176" width="190" height="104" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2.5"/><text x="380" y="204" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text><text x="380" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">438 lb salt a year</text><text x="380" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">26 to 44 kWh a year</text><path class="ln" d="M478,228 L512,228" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M516,128 L516,292" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M516,128 L532,128" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wel-t)"/><rect class="box" x="540" y="96" width="190" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="635" y="122" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Gas water heater</text><text x="635" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">about 10% less energy*</text><path class="ln" d="M516,208 L532,208" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wel-t)"/><rect class="box" x="540" y="176" width="190" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="635" y="202" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Appliances, fixtures</text><text x="635" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">longer life, less descaling</text><path class="ln" d="M516,288 L532,288" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wel-t)"/><rect class="box" x="540" y="256" width="190" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="635" y="282" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Detergent</text><text x="635" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">less, only if dose is cut</text><path class="ln" d="M380,283 L380,352" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wel-g)"/><rect class="box" x="285" y="360" width="190" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="380" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Drain line</text><text x="380" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">5,300 gal, 266 lb chloride</text><path class="ln" d="M478,395 L532,395" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wel-b)"/><rect class="box" x="540" y="360" width="190" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="635" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sewer plant or septic</text><text x="635" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">chloride passes through</text><path class="ln" d="M635,433 L635,462" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wel-b)"/><rect class="box" x="540" y="470" width="190" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="635" y="496" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">River, lake, aquifer</text><text x="635" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">chloride accumulates</text><path class="ln" d="M300,283 L300,318 L125,318 L125,352" fill="none" stroke="#78716c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#wel-g)"/><rect class="box" x="30" y="360" width="190" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="125" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">End of life, once</text><text x="125" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tanks, resin, valve</text><rect x="30" y="456" width="18" height="18" rx="3" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="56" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Environmental cost</text><rect x="30" y="482" width="18" height="18" rx="3" fill="#fff" stroke="#15803d" stroke-width="2"/><text x="56" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Offset</text><rect x="30" y="514" width="26" height="6" rx="3" fill="#0e7490"/><text x="64" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Softened water to the house</text><rect x="30" y="540" width="26" height="6" rx="3" fill="#7c3aed"/><text x="64" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Chloride from the salt</text><text x="30" y="580" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">* Battelle (industry-funded), gas storage heater at 15 gpg. Electric storage heaters: no energy difference.</text>
</svg>
