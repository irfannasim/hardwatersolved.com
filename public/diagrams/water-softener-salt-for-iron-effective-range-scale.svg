<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" width="760" height="630" role="img" aria-labelledby="sfi-title sfi-desc">
<title id="sfi-title">Best water softener salt for iron: where additive salt helps, by dissolved iron level</title>
<desc id="sfi-desc">Scale of dissolved iron from 0 to over 5 ppm showing where plain salt is enough, where iron-fighting salt with citric acid genuinely helps, where a dosed resin cleaner is needed, and where no salt keeps the resin bed clean.</desc>
<defs><marker id="sfi-steel" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="sfi-bad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sfi-ok" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="sfi-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="sfi-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="sfi-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="sfi-iron" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="sfi-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="630" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where iron-fighting salt helps, by dissolved iron level</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Dissolved (clear-water) iron in ppm, the same as mg/L. Scale is linear.</text>
<rect x="60" y="100" width="50" height="44" rx="0" fill="#dcfce7"/>
<rect x="110" y="100" width="150" height="44" rx="0" fill="#cffafe"/>
<rect x="260" y="100" width="300" height="44" rx="0" fill="#fef3c7"/>
<rect x="560" y="100" width="140" height="44" rx="0" fill="#fee2e2"/>
<rect x="60" y="100" width="640" height="44" rx="0" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M110,100 L110,152" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M260,100 L260,152" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M560,100 L560,152" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M60,144 L60,152" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">0</text>
<text x="110" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">0.5</text>
<text x="260" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2</text>
<text x="560" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">5</text>
<text x="700" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">ppm</text>
<text x="85" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">plain</text>
<text x="185" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">additive helps</text>
<text x="410" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">cleaner, if rated</text>
<text x="630" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">iron filter</text>
<rect class="box" x="30" y="196" width="700" height="70" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
<rect x="31" y="197" width="14" height="68" rx="0" fill="#dcfce7"/>
<text x="60" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">Under 0.5 ppm: plain salt is fine</text>
<text x="60" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">One manufacturer allows its lowest, salt-saving setting only below 0.5 ppm.</text>
<rect class="box" x="30" y="278" width="700" height="70" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<rect x="31" y="279" width="14" height="68" rx="0" fill="#cffafe"/>
<text x="60" y="306" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">0.5 to 2 ppm: iron-fighting salt genuinely helps</text>
<text x="60" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Citric acid in the brine lifts light iron off the beads at every regeneration.</text>
<rect class="box" x="30" y="360" width="700" height="70" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
<rect x="31" y="361" width="14" height="68" rx="0" fill="#fef3c7"/>
<text x="60" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#b45309">2 to 5 ppm: only if your softener is rated this high</text>
<text x="60" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Add a measured resin cleaner dose; the salt additive alone falls behind.</text>
<rect class="box" x="30" y="442" width="700" height="70" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<rect x="31" y="443" width="14" height="68" rx="0" fill="#fee2e2"/>
<text x="60" y="470" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Above 5 ppm: no salt keeps the bed clean</text>
<text x="60" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Past the extension ceiling for a softener as iron treatment. Filter first.</text>
<rect class="box" x="30" y="528" width="700" height="78" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="48" y="556" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">At any level: oxidized iron, iron bacteria, or iron above your unit’s rating</text>
<text x="48" y="582" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">No salt product turns rust particles or slime back into exchangeable iron.</text>
</svg>
