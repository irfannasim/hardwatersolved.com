<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="sp-title sp-desc">
<title id="sp-title">Where to draw well water iron glass test samples</title>
<desc id="sp-desc">Diagram of where to draw iron glass test samples in a well water system, at the pressure tank, after the softener and at the kitchen tap, and what comparing them reveals about where the iron comes from.</desc>
<defs><marker id="sp-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="sp-tink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><pattern id="sp-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where you draw the glass changes the answer</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Compare glasses from different points to find where the iron starts.</text><rect x="50" y="162" width="16" height="32" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="50" y="162" width="100" height="16" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="200" y="162" width="160" height="16" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="420" y="162" width="238" height="16" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="44" y="194" width="28" height="110" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/><rect x="150" y="120" width="50" height="120" rx="16" fill="#e0f2fe" stroke="#3a5a72" stroke-width="2"/><rect x="360" y="152" width="60" height="30" rx="6" fill="#0b2f4a"/><rect x="372" y="182" width="36" height="110" rx="14" fill="url(#sp-beads)" stroke="#3a5a72" stroke-width="2"/><rect x="167" y="240" width="16" height="50" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="472" y="178" width="16" height="112" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="642" y="178" width="16" height="112" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><text x="58" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">well</text><text x="175" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">pressure tank</text><text x="390" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text><path class="ln" d="M600,150 L640,150" fill="none" stroke="#0b2f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sp-ink)"/><text x="592" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">flow</text><path d="M159,300 L191,300 L187,338 L163,338 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><circle cx="143" cy="318" r="11" fill="#0b2f4a"/><text x="143" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><path d="M464,300 L496,300 L492,338 L468,338 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><circle cx="448" cy="318" r="11" fill="#0b2f4a"/><text x="448" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><path d="M634,300 L666,300 L662,338 L638,338 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><circle cx="618" cy="318" r="11" fill="#0b2f4a"/><text x="618" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="175" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">tank drain</text><text x="175" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">or hose bibb</text><text x="480" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">after the</text><text x="480" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">softener</text><text x="650" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">kitchen</text><text x="650" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">tap</text><rect class="box" x="30" y="404" width="700" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="427" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">1 turns orange slowly, but 3 is already tinted at the tap</tspan></text><text x="46" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Iron oxidizes inside your system: air-over-water tank, chlorinator or misplaced aerator.</text><rect class="box" x="30" y="470" width="700" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="493" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Only the first draw of the morning is rusty; a flushed sample starts clear</tspan></text><text x="46" y="513" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Rust from pipes, pressure tank, casing or pump. A plumbing fix, not treatment.</text><rect class="box" x="30" y="536" width="700" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="559" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">2 turns brown only on the morning after a regeneration</tspan></text><text x="46" y="579" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Iron stored in the resin bed is being released.</text>
</svg>
