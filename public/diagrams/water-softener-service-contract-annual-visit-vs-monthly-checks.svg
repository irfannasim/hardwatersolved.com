<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="g17tl-title g17tl-desc">
<title id="g17tl-title">Water softener service contract annual visit compared with monthly owner checks over 16 months</title>
<desc id="g17tl-desc">Timeline showing a salt bridge that forms in June: a monthly owner check finds it in July, while a water softener service contract with one visit a year in April finds it up to ten months later.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">One contract visit a year vs a five-minute monthly check</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Example: a salt bridge forms in June, so no brine is made and the water turns hard</text>
<path d="M200,92 L200,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="200" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Jan</text>
<path d="M232,92 L232,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="232" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Feb</text>
<path d="M264,92 L264,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="264" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Mar</text>
<path d="M296,92 L296,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="296" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Apr</text>
