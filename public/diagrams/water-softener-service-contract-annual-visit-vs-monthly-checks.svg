<path d="M370,96 L370,318" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="378" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Bridge forms</text>
<path class="ln" d="M374,150 L388,150" fill="none" stroke="#15803d" stroke-width="3"/>
<text x="404" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#15803d">Found at the July check: weeks, not months</text>
<path class="ln" d="M374,240 L676,240" fill="none" stroke="#dc2626" stroke-width="3"/>
<text x="378" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Found at the April visit: up to 10 months later</text>
<text x="378" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">unless someone in the house notices first</text>
<circle cx="38" cy="392" r="7" fill="#0e7490"/>
<text x="52" y="397" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Check or visit</text>
<circle cx="200" cy="392" r="7" fill="#cbd5e1"/>
<text x="214" y="397" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">No one looks</text>
<text x="30" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">A contract adds a skilled visit, not attention. Most softener faults show within weeks and</text>
<text x="30" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">are found by whoever looks next, so the monthly check matters more than who does the annual one.</text>
</svg>
