<text x="360" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Jun</text>
<path d="M392,92 L392,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="392" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Jul</text>
<path d="M424,92 L424,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="424" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Aug</text>
<path d="M456,92 L456,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="456" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Sep</text>
