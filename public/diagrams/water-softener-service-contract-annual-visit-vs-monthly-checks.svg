<text x="488" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Oct</text>
<path d="M520,92 L520,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="520" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Nov</text>
<path d="M552,92 L552,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="552" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Dec</text>
<path d="M584,92 L584,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="584" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Jan</text>
<path d="M616,92 L616,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="616" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Feb</text>
<path d="M648,92 L648,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="648" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Mar</text>
<path d="M680,92 L680,332" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="680" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">Apr</text>
<text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Owner, monthly</text>
<text x="30" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">check</text>
<text x="30" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Contract, one</text>
<text x="30" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">visit a year</text>
