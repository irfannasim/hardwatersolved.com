<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" width="760" height="604" role="img" aria-labelledby="wsja-title wsja-desc">
<title id="wsja-title">Water softener bonding jumper: clamps, conductor and slack</title>
<desc id="wsja-desc">Close-up of a water softener bonding jumper on copper pipe: listed ground clamps on bare metal on both sides of the plastic bypass, a copper conductor with slack so the softener can be removed, and common installation faults.</desc>
<defs></defs>
<rect width="760" height="604" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Anatomy of a softener bonding jumper</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Close-up of the loop. Numbers match the list below the drawing.</text><rect class="box" x="30" y="86" width="700" height="200" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path class="ln" d="M60,210 L260,210" fill="none" stroke="#3a5a72" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M500,210 L700,210" fill="none" stroke="#3a5a72" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">copper inlet pipe</text><text x="690" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">copper outlet pipe</text><rect x="260" y="196" width="40" height="28" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="460" y="196" width="40" height="28" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><rect x="300" y="180" width="160" height="60" rx="8" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/><text x="380" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">plastic bypass</text><text x="380" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">plastic adapters and bypass: not a conductor</text><rect x="190" y="196" width="18" height="28" rx="2" fill="#15803d"/><rect x="552" y="196" width="18" height="28" rx="2" fill="#15803d"/><path class="ln" d="M199,196 C199,100 561,100 561,196" fill="none" stroke="#15803d" stroke-width="3"/><circle cx="170" cy="180" r="12" fill="#0b2f4a"/><text x="170" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="380" cy="102" r="12" fill="#0b2f4a"/><text x="380" y="107" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="600" cy="146" r="12" fill="#0b2f4a"/><text x="600" y="151" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="590" cy="180" r="12" fill="#0b2f4a"/><text x="590" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><circle cx="46" cy="311" r="12" fill="#0b2f4a"/><text x="46" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="68" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Listed ground clamp on clean, bare metal pipe, on both sides of the softener</text><circle cx="46" cy="343" r="12" fill="#0b2f4a"/><text x="46" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="68" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Copper conductor sized for the job; A.O. Smith specifies #4 copper</text><circle cx="46" cy="375" r="12" fill="#0b2f4a"/><text x="46" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="68" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Enough slack to take the softener out without disconnecting the jumper</text><circle cx="46" cy="407" r="12" fill="#0b2f4a"/><text x="46" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="68" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Clamps on metal only, never on the plastic bypass, adapters or PEX</text><rect class="box" x="30" y="450" width="700" height="128" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="46" y="476" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Common faults found at inspection</text><text x="46" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">An existing ground clamp removed to make room for the loop</text><text x="46" y="521" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A clamp tightened over paint, corrosion or pipe insulation</text><text x="46" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A jumper pulled tight, then cut when the unit was swapped</text><text x="46" y="559" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The old jumper and clamps left out when a new softener went in</text>
</svg>
