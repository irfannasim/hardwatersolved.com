<rect class="box" x="30" y="488" width="700" height="40" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="380" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Break-even installed price for the Kinetico: about $2,200 vs heavy Fleck, $1,300 vs efficient</text>
