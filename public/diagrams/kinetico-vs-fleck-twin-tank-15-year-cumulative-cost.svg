<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="kfc-title kfc-desc">
<title id="kfc-title">Kinetico vs Fleck twin-tank water softener: 15-year cumulative cost</title>
<desc id="kfc-desc">Illustrative 15-year cumulative cost for a Kinetico water softener review: a Kinetico 2030s installed at $4,000 reaches about $6,685, a Fleck 9100SXT twin-tank on a heavy salt setting about $4,865, and on an efficient setting about $4,005, so the lines never cross.</desc>
<defs></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">15-year cumulative cost (illustrative)</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Family of four, 15 gpg; assumptions as listed in the article.</text>
