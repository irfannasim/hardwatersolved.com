<path d="M100,392.9 L540,392.9" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="90" y="397.9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$500</text>
