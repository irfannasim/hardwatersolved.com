<text x="90" y="350.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$1,000</text>
<path d="M100,298.6 L540,298.6" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="90" y="303.6" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$1,500</text>
<path d="M100,251.4 L540,251.4" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="90" y="256.4" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$2,000</text>
<path d="M100,204.3 L540,204.3" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="90" y="209.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$2,500</text>
<path d="M100,157.1 L540,157.1" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="90" y="162.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$3,000</text>
<path d="M100,110.0 L540,110.0" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="90" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$3,500</text>
<text x="100" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text>
<text x="246.7" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5</text>
<text x="393.3" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10</text>
<text x="540" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">15</text>
<text x="320" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Years after installation</text>
