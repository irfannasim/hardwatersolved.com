<text x="554" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">about $2,975</text>
<path class="ln" d="M100,440 L540,186.8" fill="none" stroke="#0b2f4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
