<text x="540" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">15</text>
<text x="320" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Years after installation</text>
<path class="ln" d="M100,251.4 L540,124.8" fill="none" stroke="#0b2f4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="554" y="124.77928571428572" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Kinetico 2030s</text>
<text x="554" y="142.77928571428572" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">about $6,685</text>
