<text x="90" y="303.57142857142856" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$3,000</text>
<path d="M100,251.4 L540,251.4" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="90" y="256.42857142857144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$4,000</text>
<path d="M100,204.3 L540,204.3" stroke="#e2e8f0" stroke-width="1" fill="none"/>
