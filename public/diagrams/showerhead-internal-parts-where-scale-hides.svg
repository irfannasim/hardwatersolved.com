<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="shs-title shs-desc">
<title id="shs-title">Showerhead internal parts and where hard water scale hides</title>
<desc id="shs-desc">Exploded diagram of a hard water clogged showerhead: scale builds on the inlet filter screen and inside the rigid manifold and flow passages, while flexing silicone nubs crack scale off so the face still looks clear.</desc>
<defs><pattern id="shs-mesh" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f8fafc"/><path d="M0,0 L6,6 M6,0 L0,6" stroke="#94a3b8" stroke-width="1"/></pattern><marker id="shs-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="shs-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inside a showerhead: where hard water scale hides</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Exploded view. Silicone nubs shed scale; the rigid parts behind them do not.</text>
<rect x="30" y="248" width="90" height="24" fill="#94a3b8" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M36,260 L112,260" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shs-h)"/>
<text x="75" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">shower arm</text>
<rect x="130" y="222" width="14" height="76" fill="url(#shs-mesh)" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="130" y="236" width="14" height="48" fill="#a8a29e"/>
<rect x="160" y="228" width="12" height="64" rx="3" fill="#334155"/>
<path d="M190,226 L388,160 L388,360 L190,294 z" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/>
<path d="M196,260 L378,182" stroke="#a8a29e" stroke-width="14" stroke-linecap="round"/>
<path d="M196,260 L378,182" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
<path d="M196,260 L378,221" stroke="#a8a29e" stroke-width="14" stroke-linecap="round"/>
<path d="M196,260 L378,221" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
<path d="M196,260 L378,260" stroke="#a8a29e" stroke-width="14" stroke-linecap="round"/>
<path d="M196,260 L378,260" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
<path d="M196,260 L378,299" stroke="#a8a29e" stroke-width="14" stroke-linecap="round"/>
<path d="M196,260 L378,299" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
<path d="M196,260 L378,338" stroke="#a8a29e" stroke-width="14" stroke-linecap="round"/>
<path d="M196,260 L378,338" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
<rect x="402" y="168" width="14" height="184" rx="3" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="430" y="150" width="16" height="220" rx="3" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="446" y="167" width="12" height="10" rx="4" fill="#475569"/>
<path d="M462,172 L500,172" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="446" y="197" width="12" height="10" rx="4" fill="#475569"/>
<path d="M462,202 L500,202" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="446" y="227" width="12" height="10" rx="4" fill="#475569"/>
<path d="M462,232 L500,232" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="446" y="257" width="12" height="10" rx="4" fill="#475569"/>
<path d="M462,262 L500,262" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="446" y="287" width="12" height="10" rx="4" fill="#475569"/>
<path d="M462,292 L500,292" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="446" y="317" width="12" height="10" rx="4" fill="#475569"/>
<path d="M462,322 L500,322" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="30" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inlet filter screen</text>
<text x="30" y="169" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">often the most blocked</text>
<path class="ln" d="M110,176 L134,230" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shs-t)"/>
<text x="166" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">rubber washer</text>
<path class="ln" d="M166,320 L166,298" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shs-t)"/>
<text x="200" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Manifold and flow passages</text>
<text x="200" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">rigid, so scale keeps building</text>
<path class="ln" d="M290,146 L300,210" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shs-t)"/>
<text x="409" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">selector disc</text>
<text x="409" y="415" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">(multi-function)</text>
<path class="ln" d="M409,380 L409,358" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shs-t)"/>
<text x="440" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Face plate with</text>
<text x="440" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">silicone nubs</text>
<path class="ln" d="M452,132 L452,150" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shs-t)"/>
<rect class="box" x="540" y="180" width="190" height="210" rx="12" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="635" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">One nub, magnified</text>
<rect x="560" y="222" width="14" height="90" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/>
<path d="M574,256 Q606,254 626,236 L634,246 Q612,270 574,278 z" fill="#475569"/>
<path d="M630,230 L642,226 L640,236 z" fill="#a8a29e"/>
<path d="M646,242 L658,240 L652,252 z" fill="#a8a29e"/>
<path d="M636,256 L648,262 L638,266 z" fill="#a8a29e"/>
<path class="ln" d="M600,300 Q640,300 650,270" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shs-t)"/>
<text x="664" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">flex</text>
<text x="556" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flexing cracks the scale</text>
<text x="556" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">off, so the face looks clear</text>
<path class="ln" d="M462,232 L538,250" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<rect class="box" x="30" y="432" width="700" height="50" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="380" y="453" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">The spray pattern can look fine while the flow rate has fallen a lot.</text>
<text x="380" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">On a nub head, the bucket test is the only reliable check.</text>
<rect x="30" y="508" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water</text>
<rect x="176" y="505" width="26" height="12" rx="2" fill="#a8a29e"/><text x="210" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">scale deposit</text>
<rect x="340" y="505" width="26" height="12" fill="url(#shs-mesh)" stroke="#3a5a72" stroke-width="1"/><text x="374" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">mesh screen</text>
</svg>
