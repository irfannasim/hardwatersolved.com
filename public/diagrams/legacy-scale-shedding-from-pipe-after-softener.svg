<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" role="img" aria-labelledby="lss-title lss-desc">
<title id="lss-title">Legacy scale shedding from old pipe after a softener is installed</title>
<desc id="lss-desc">Cross-section of an old scaled pipe: softened water, slightly undersaturated with calcium carbonate, undermines the old deposit so grey-white flakes break off and collect in aerator screens, which is why scale remains after the hardness test reads zero.</desc>
<defs><pattern id="lss-mesh" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f8fafc"/><path d="M0,0 L6,6 M6,0 L0,6" stroke="#94a3b8" stroke-width="1"/></pattern><marker id="lss-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="lss-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="556" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Legacy scale shedding after a softener goes in</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Old deposit inside the pipe comes loose for a few weeks, then stops on its own.</text>
<rect x="30" y="150" width="540" height="14" fill="#94a3b8"/>
<rect x="30" y="276" width="540" height="14" fill="#94a3b8"/>
<rect x="30" y="164" width="540" height="112" fill="#dbeafe"/>
<rect x="30" y="164" width="230" height="16" fill="#a8a29e"/>
<rect x="330" y="164" width="240" height="16" fill="#a8a29e"/>
<rect x="30" y="260" width="540" height="16" fill="#a8a29e"/>
<path d="M262,164 L326,164 L326,168 L300,190 L264,184 z" fill="#a8a29e" stroke="#78716c" stroke-width="1"/>
<path d="M351,209 L368,207 L370,215 L353,217 z" fill="#a8a29e" stroke="#78716c" stroke-width="1" transform="rotate(0 360 212)"/>
<path d="M401,229 L418,227 L420,235 L403,237 z" fill="#a8a29e" stroke="#78716c" stroke-width="1" transform="rotate(30 410 232)"/>
<path d="M446,202 L463,200 L465,208 L448,210 z" fill="#a8a29e" stroke="#78716c" stroke-width="1" transform="rotate(-20 455 205)"/>
<path d="M491,235 L508,233 L510,241 L493,243 z" fill="#a8a29e" stroke="#78716c" stroke-width="1" transform="rotate(15 500 238)"/>
<path class="ln" d="M50,222 L230,222" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lss-s)"/>
<rect x="572" y="164" width="14" height="112" fill="url(#lss-mesh)" stroke="#3a5a72" stroke-width="1.5"/>
<path d="M555,259 L568,258 L569,265 L556,266 z" fill="#a8a29e" stroke="#78716c" stroke-width="1"/>
<path d="M551,247 L564,246 L565,253 L552,254 z" fill="#a8a29e" stroke="#78716c" stroke-width="1"/>
<path d="M557,237 L570,236 L571,243 L558,244 z" fill="#a8a29e" stroke="#78716c" stroke-width="1"/>
<text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Years of hard water deposit</text>
<path class="ln" d="M100,118 L110,164" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lss-t)"/>
<text x="250" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softened water works at the underside</text>
<text x="250" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">slightly undersaturated with calcium carbonate</text>
<path class="ln" d="M296,136 L292,170" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lss-t)"/>
<text x="60" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">softened water</text>
<text x="300" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Sections lose their grip and let go</text>
<text x="300" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">as grey-white grit and flakes</text>
<path class="ln" d="M420,304 L412,242" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lss-t)"/>
<text x="604" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Aerator screen</text>
<text x="604" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">catches it first;</text>
<text x="604" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">also washing machine</text>
<text x="604" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">filter, dishwasher,</text>
<text x="604" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water heater tank</text>
<rect class="box" x="30" y="372" width="340" height="104" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="46" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#14532d">Legacy scale: not a fault</text>
<text x="46" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">grey-white, flat, flaky and brittle</text>
<text x="46" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">gets less over weeks</text>
<path d="M311,417 L328,415 L330,423 L313,425 z" fill="#a8a29e" stroke="#78716c" stroke-width="1"/>
<path d="M331,433 L348,431 L350,439 L333,441 z" fill="#a8a29e" stroke="#78716c" stroke-width="1"/>
<path d="M307,443 L324,441 L326,449 L309,451 z" fill="#a8a29e" stroke="#78716c" stroke-width="1"/>
<rect class="box" x="390" y="372" width="340" height="104" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="406" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Resin beads: a real fault</text>
<text x="406" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">round, amber, coarse-sand size,</text>
<text x="406" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">do not crumble: a broken</text>
<text x="406" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">distributor or screen</text>
<circle cx="680" cy="424" r="6" fill="#e2b865" stroke="#92400e" stroke-width="1"/>
<circle cx="696" cy="432" r="6" fill="#e2b865" stroke="#92400e" stroke-width="1"/>
<circle cx="684" cy="442" r="6" fill="#e2b865" stroke="#92400e" stroke-width="1"/>
<text x="30" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Test the water, not the debris: zero hardness at the softener outlet means the softener is working.</text>
<rect x="30" y="530" width="26" height="6" rx="3" fill="#0e7490"/><text x="64" y="537" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text>
<rect x="190" y="527" width="26" height="12" rx="2" fill="#a8a29e"/><text x="224" y="537" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">legacy calcium carbonate scale</text>
</svg>
