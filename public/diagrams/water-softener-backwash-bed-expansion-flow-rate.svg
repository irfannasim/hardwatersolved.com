<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" width="760" height="604" role="img" aria-labelledby="bw-title bw-desc">
<title id="bw-title">Water softener backwash flow rate and resin bed expansion</title>
<desc id="bw-desc">Diagram comparing water softener backwash flow rates: too little flow leaves the resin bed packed and iron inside it, the correct flow expands the bed and carries iron to the drain, and too much flow washes resin out.</desc>
<defs><marker id="bw-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="bw-drain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="bw-thard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="bw-tdrain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="bw-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="bw-sparse" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f4f9fb"/><circle cx="7" cy="7" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="604" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Backwash only cleans the bed in a narrow flow band</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Too little and the bed stays packed. Too much and resin goes out with the debris.</text><text x="135" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">Too little flow</text><path class="ln" d="M135,150 L135,132 L213,132 L213,196" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bw-drain)"/><polygon points="201,208 225,208 219,218 207,218" fill="#78716c"/><rect x="90" y="150" width="90" height="250" rx="24" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><rect x="94" y="262" width="82" height="132" rx="20" fill="url(#bw-beads)"/><path class="ln" d="M143,388 L143,172" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bw-hard)"/><circle cx="107" cy="280" r="3.5" fill="#b45309"/><circle cx="123" cy="318" r="3.5" fill="#b45309"/><circle cx="161" cy="300" r="3.5" fill="#b45309"/><circle cx="111" cy="360" r="3.5" fill="#b45309"/><circle cx="163" cy="352" r="3.5" fill="#b45309"/><text x="135" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Bed never expands.</text><text x="135" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Water channels through</text><text x="135" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">and iron stays in the bed.</text><text x="380" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803d">Correct flow</text><path class="ln" d="M380,150 L380,132 L458,132 L458,196" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bw-drain)"/><polygon points="446,208 470,208 464,218 452,218" fill="#78716c"/><rect x="335" y="150" width="90" height="250" rx="24" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><rect x="339" y="196" width="82" height="198" rx="20" fill="url(#bw-sparse)"/><path class="ln" d="M362,388 L362,216" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bw-hard)"/><path class="ln" d="M398,388 L398,216" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bw-hard)"/><circle cx="350" cy="172" r="3.5" fill="#b45309"/><circle cx="380" cy="164" r="3.5" fill="#b45309"/><circle cx="410" cy="176" r="3.5" fill="#b45309"/><circle cx="410" cy="140" r="3.5" fill="#b45309"/><circle cx="440" cy="140" r="3.5" fill="#b45309"/><text x="380" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Bed lifts and separates.</text><text x="380" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Iron and sediment are</text><text x="380" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">carried to the drain.</text><text x="625" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">Too much flow</text><path class="ln" d="M625,150 L625,132 L703,132 L703,196" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bw-drain)"/><polygon points="691,208 715,208 709,218 697,218" fill="#78716c"/><rect x="580" y="150" width="90" height="250" rx="24" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><rect x="584" y="158" width="82" height="236" rx="20" fill="url(#bw-sparse)"/><path class="ln" d="M607,388 L607,178" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bw-hard)"/><path class="ln" d="M643,388 L643,178" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bw-hard)"/><circle cx="655" cy="140" r="5" fill="#e2b865" stroke="#92400e" stroke-width="1.2"/><circle cx="683" cy="140" r="5" fill="#e2b865" stroke="#92400e" stroke-width="1.2"/><circle cx="703" cy="166" r="5" fill="#e2b865" stroke="#92400e" stroke-width="1.2"/><circle cx="703" cy="186" r="5" fill="#e2b865" stroke="#92400e" stroke-width="1.2"/><text x="625" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Bed lifts too far.</text><text x="625" y="447" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Resin beads wash out</text><text x="625" y="466" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">of the drain line.</text><rect class="box" x="30" y="496" width="700" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="520" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Measure it:</tspan> time a 5-gallon bucket at the drain line during backwash.</text><text x="46" y="540" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">gpm = 300 ÷ seconds to fill; 100 seconds = 3 gpm. Cold water expands the bed more.</text><rect x="30" y="583" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="591" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">backwash water (up)</text><rect x="220" y="583" width="26" height="6" rx="3" fill="#78716c"/><text x="254" y="591" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><circle cx="348" cy="586" r="6" fill="#b45309"/><text x="374" y="591" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">iron</text><circle cx="438" cy="586" r="6" fill="#e2b865"/><text x="464" y="591" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin beads</text>
</svg>
