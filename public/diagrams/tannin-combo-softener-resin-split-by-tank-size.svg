<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="trs-title trs-desc">
<title id="trs-title">Tannin softener resin split by tank size: tannin resin stays at 0.5 cubic feet</title>
<desc id="trs-desc">Stacked bar chart of AFWFilters combination tannin softeners in 1.0, 1.5 and 2.0 cubic foot sizes. Each holds 0.5 cubic feet of tannin resin; the larger sizes add only softening resin, raising hardness capacity from 16,000 to 32,000 and 48,000 grains and flow from 8 to 10 and 12 gpm.</desc>
<rect width="760" height="450" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Bigger combo tank, same tannin resin</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">AFWFilters Fleck 5600 tannin softeners, resin by type (seller's product pages)</text>

