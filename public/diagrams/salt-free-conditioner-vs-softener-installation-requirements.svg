<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="g7ir-title g7ir-desc">
<title id="g7ir-title">Salt-free conditioner vs salt-based softener: installation requirements</title>
<desc id="g7ir-desc">Side-by-side plumbing layouts: a salt-based softener needs a drain line with an air gap, usually a power outlet, a brine tank and salt, while a salt free water conditioner needs only a bypass, a prefilter where the water carries grit, and water inside its chemistry limits.</desc>
<defs>
<marker id="g7ir-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="g7ir-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="g7ir-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
</defs>
<rect width="760" height="580" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">What each system needs where it is installed</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">The salt-free unit drops the drain, the outlet and the brine tank. That is its real advantage.</text>
<text x="30" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Salt-based softener</text>
<path class="ln" d="M30,200 L140,200" fill="none" stroke="#c2410c" stroke-width="6"/>
<rect x="140" y="186" width="56" height="28" rx="4" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/>
<path class="ln" d="M196,200 L240,200" fill="none" stroke="#c2410c" stroke-width="6"/>
<rect x="236" y="128" width="64" height="22" rx="6" fill="#cbd5e1" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="240" y="150" width="56" height="120" rx="14" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/>
<text x="268" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Resin</text>
<path class="ln" d="M296,200 L428,200" fill="none" stroke="#0e7490" stroke-width="6" marker-end="url(#g7ir-s)"/>
<text x="438" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#0e7490">to house</text>
<rect class="box" x="318" y="222" width="62" height="48" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
<text x="349" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Brine</text>
<path class="ln" d="M318,240 L298,240" fill="none" stroke="#7c3aed" stroke-width="4"/>
<path class="ln" d="M268,272 L268,292 L396,292" fill="none" stroke="#78716c" stroke-width="4" marker-end="url(#g7ir-d)"/>
<text x="410" y="297" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#78716c">drain</text>
<text x="30" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">main</text>
<text x="168" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">bypass</text>
<text x="480" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">REQUIREMENTS</text>
<rect x="480" y="146" width="10" height="10" fill="#3a5a72"/><text x="498" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Drain line with an air gap</text>
<rect x="480" y="170" width="10" height="10" fill="#3a5a72"/><text x="498" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Power outlet, most models</text>
<rect x="480" y="194" width="10" height="10" fill="#3a5a72"/><text x="498" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Floor space for a brine tank</text>
<rect x="480" y="218" width="10" height="10" fill="#3a5a72"/><text x="498" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Salt carried in every month</text>
<rect x="480" y="242" width="10" height="10" fill="#3a5a72"/><text x="498" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Regeneration water to drain</text>
<path d="M30,322 L730,322" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="30" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">TAC salt-free conditioner</text>
<path class="ln" d="M30,440 L140,440" fill="none" stroke="#c2410c" stroke-width="6"/>
<rect x="140" y="426" width="56" height="28" rx="4" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/>
<path class="ln" d="M196,440 L220,440" fill="none" stroke="#c2410c" stroke-width="6"/>
<rect x="220" y="416" width="30" height="48" rx="5" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<path class="ln" d="M250,440 L290,440" fill="none" stroke="#c2410c" stroke-width="6"/>
<rect x="286" y="368" width="64" height="22" rx="6" fill="#cbd5e1" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="290" y="390" width="56" height="120" rx="14" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/>
<text x="318" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">TAC</text>
<path class="ln" d="M346,440 L428,440" fill="none" stroke="#c2410c" stroke-width="6" marker-end="url(#g7ir-h)"/>
<text x="438" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#c2410c">to house</text>
<text x="30" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">main</text>
<text x="168" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">bypass</text>
<text x="235" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">prefilter</text>
<text x="360" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#c2410c">still hard</text>
<text x="480" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">REQUIREMENTS</text>
<rect x="480" y="386" width="10" height="10" fill="#15803d"/><text x="498" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">No drain, no air gap</text>
<rect x="480" y="410" width="10" height="10" fill="#15803d"/><text x="498" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">No outlet, no electricity</text>
<rect x="480" y="434" width="10" height="10" fill="#15803d"/><text x="498" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">No brine tank, no salt</text>
<rect x="480" y="458" width="10" height="10" fill="#3a5a72"/><text x="498" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Bypass, and a prefilter for grit</text>
<rect x="480" y="482" width="10" height="10" fill="#3a5a72"/><text x="498" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Water inside its chemistry limits</text>
<rect x="480" y="506" width="10" height="10" fill="#3a5a72"/><text x="498" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Media replaced on schedule</text>
<rect x="30" y="548" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">hard water</text>
<rect x="160" y="548" width="26" height="6" rx="3" fill="#0e7490"/><text x="194" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">softened</text>
<rect x="280" y="548" width="26" height="6" rx="3" fill="#7c3aed"/><text x="314" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">brine</text>
<rect x="370" y="548" width="26" height="6" rx="3" fill="#78716c"/><text x="404" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">to drain</text>
<rect x="480" y="545" width="10" height="10" fill="#3a5a72"/><text x="498" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">required</text>
<rect x="590" y="545" width="10" height="10" fill="#15803d"/><text x="608" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">not required</text>
</svg>
