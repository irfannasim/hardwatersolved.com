<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" role="img" aria-labelledby="dw-title dw-desc">
<title id="dw-title">Dishwasher built-in softener: where the salt reservoir cap is</title>
<desc id="dw-desc">Top-down diagram of a dishwasher tub floor with the lower rack removed, showing the built-in softener salt reservoir screw cap in one corner, the lower spray arm and the twist-out filter.</desc>
<defs></defs>
<rect width="760" height="550" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Finding a dishwasher's built-in softener</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Lower rack out, looking straight down at the floor of the tub.</text><rect x="200" y="110" width="360" height="310" rx="14" fill="#f8fafc" stroke="#3a5a72" stroke-width="2.5"/><rect class="box" x="190" y="420" width="380" height="30" rx="6" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/><text x="380" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">door (open)</text><rect x="250" y="241" width="260" height="18" rx="9" fill="#cbd5e1" stroke="#3a5a72" stroke-width="1.5" transform="rotate(-14 380 250)"/><circle cx="380" cy="250" r="14" fill="#94a3b8" stroke="#3a5a72" stroke-width="1.5"/><circle cx="380" cy="360" r="28" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><circle cx="380" cy="360" r="14" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><circle cx="250" cy="156" r="24" fill="#93c5fd" stroke="#0b2f4a" stroke-width="2.5"/><path d="M264.0,156.0 L271.0,156.0" stroke="#0b2f4a" stroke-width="2"/><path d="M259.9,165.9 L264.8,170.8" stroke="#0b2f4a" stroke-width="2"/><path d="M250.0,170.0 L250.0,177.0" stroke="#0b2f4a" stroke-width="2"/><path d="M240.1,165.9 L235.2,170.8" stroke="#0b2f4a" stroke-width="2"/><path d="M236.0,156.0 L229.0,156.0" stroke="#0b2f4a" stroke-width="2"/><path d="M240.1,146.1 L235.2,141.2" stroke="#0b2f4a" stroke-width="2"/><path d="M250.0,142.0 L250.0,135.0" stroke="#0b2f4a" stroke-width="2"/><path d="M259.9,146.1 L264.8,141.2" stroke="#0b2f4a" stroke-width="2"/><path class="ln" d="M278,156 L584,156" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="594" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Salt reservoir cap</tspan></text><text x="594" y="161" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">40–50 mm screw cap,</text><text x="594" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">often blue or grey,</text><text x="594" y="199" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">in one corner</text><text x="594" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Feeds the built-in</text><text x="594" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">ion exchange</text><text x="594" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">cartridge</text><text x="180" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#0b2f4a">lower spray arm</text><path class="ln" d="M184,212 L256,272" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#0b2f4a">twist-out filter</text><path class="ln" d="M184,362 L350,360" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="488" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Coarse dishwasher salt only:</tspan> no table salt, no softener pellets.</text><text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Set the machine's hardness value</tspan> on the control panel (gpg or German degrees).</text><text x="30" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Flat, featureless tub floor</tspan> = no built-in softener.</text>
</svg>
