<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="g4cf-title g4cf-desc">
<title id="g4cf-title">Softened water metallic taste: copper pipe with and without scale film</title>
<desc id="g4cf-desc">Diagram of copper pipe carrying hard water, lined with a calcium carbonate film, beside softened water where no new film forms and copper dissolves into the water, the usual cause of a softened water metallic taste on low-pH water.</desc>
<defs><marker id="g4cf-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4cf-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><pattern id="g4cf-sc" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#efe9dc"/><circle cx="3" cy="3" r="1.2" fill="#b8ab8f"/></pattern></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why softened water can taste of copper</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Softening adds no metal. It stops the scale film that partly shielded the water from the pipe.</text><text x="30" y="106" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#c2410c">Hard water</text><rect x="30" y="116" width="490" height="14" rx="0" fill="#94a3b8"/><rect x="30" y="202" width="490" height="14" rx="0" fill="#94a3b8"/><rect x="30" y="130" width="490" height="72" rx="0" fill="#dbeafe"/><rect x="30" y="130" width="490" height="7" fill="url(#g4cf-sc)"/><rect x="30" y="195" width="490" height="7" fill="url(#g4cf-sc)"/><path class="ln" d="M70,166 L480,166" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4cf-ah)"/><text x="540" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">calcium carbonate film</text><text x="540" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">a partial barrier between</text><text x="540" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the water and the metal</text><path class="ln" d="M536,132 L500,134" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="256" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">Softened water</text><rect x="30" y="266" width="490" height="14" rx="0" fill="#94a3b8"/><rect x="30" y="352" width="490" height="14" rx="0" fill="#94a3b8"/><rect x="30" y="280" width="490" height="72" rx="0" fill="#dbeafe"/><rect x="60" y="280" width="60" height="7" fill="url(#g4cf-sc)"/><rect x="300" y="345" width="50" height="7" fill="url(#g4cf-sc)"/><path class="ln" d="M70,316 L480,316" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4cf-as)"/><circle cx="170" cy="294" r="9" fill="#c2703d"/><text x="170" y="298" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cu</text><circle cx="250" cy="296" r="9" fill="#c2703d"/><text x="250" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cu</text><circle cx="400" cy="293" r="9" fill="#c2703d"/><text x="400" y="297" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cu</text><circle cx="210" cy="338" r="9" fill="#c2703d"/><text x="210" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cu</text><circle cx="360" cy="336" r="9" fill="#c2703d"/><text x="360" y="340" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cu</text><circle cx="455" cy="338" r="9" fill="#c2703d"/><text x="455" y="342" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Cu</text><text x="540" y="284" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">no new film forms</text><text x="540" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">old film slowly dissolves;</text><text x="540" y="318" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">copper is picked up, most</text><text x="540" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">of all in standing water</text><rect class="box" x="30" y="390" width="340" height="54" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="46" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">pH near 7.5, decent alkalinity</text><text x="46" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the effect is usually negligible</text><rect class="box" x="390" y="390" width="340" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="406" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Below pH 6.5</text><text x="406" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the effect can be substantial</text><rect x="30" y="466" width="26" height="14" rx="3" fill="#efe9dc" stroke="#3a5a72" stroke-width="1"/><text x="64" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">scale film</text><circle cx="190" cy="473" r="8" fill="#c2703d"/><text x="204" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">dissolved copper</text><text x="730" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">Taste threshold for copper: about 1–2 mg/L</text>
</svg>
