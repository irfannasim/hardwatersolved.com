<text x="140" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1. Indicator added</text>
<text x="140" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">red or pink while calcium</text>
<text x="140" y="373" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">and magnesium are free</text>
<text x="380" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2. EDTA, one drop at a time</text>
<text x="380" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">each drop binds a fixed</text>
<text x="380" y="373" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">amount of hardness</text>
<text x="620" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">3. Endpoint</text>
<text x="620" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">last hardness bound:</text>
<text x="620" y="373" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">sample flips to blue</text>
<rect class="box" x="30" y="408" width="700" height="58" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="380" y="432" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">The drop count is the measurement.</text>
<text x="380" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Hach 5-B: 1 drop = 1 gpg, so 11 drops before the flip means 11 gpg.</text>
<circle cx="38" cy="494" r="5" fill="#c2410c" stroke="#7c2d12" stroke-width="1"/>
<text x="50" y="499" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">free calcium or magnesium</text>
<circle cx="250" cy="494" r="8" fill="#475569" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="3 2"/>
<circle cx="250" cy="494" r="5" fill="#c2410c" stroke="#7c2d12" stroke-width="1"/>
<text x="266" y="499" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bound by EDTA</text>
