<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="edt-title edt-desc">
<title id="edt-title">How an EDTA hardness drop test kit works</title>
<desc id="edt-desc">Three-step diagram of an EDTA drop test kit titration: the indicator turns the sample red while calcium and magnesium are free, each EDTA drop binds a fixed amount of hardness, and the sample flips blue at the endpoint, so the drop count gives water hardness in gpg.</desc>
<defs><marker id="edt-k" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">How a hardness drop test kit counts grains</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">EDTA titration: each drop takes a fixed amount of hardness out of play.</text>
