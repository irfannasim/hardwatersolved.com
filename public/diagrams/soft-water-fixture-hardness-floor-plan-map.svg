<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="fpm-title fpm-desc">
<title id="fpm-title">Floor plan map of hardness test results fixture by fixture</title>
<desc id="fpm-desc">Illustrative floor plan with a hardness result at every fixture: the softener outlet and main house read 0, a circled group in the addition reads hard, and the dashed trace leads back to the tee near the supply entry.</desc>
<defs><marker id="fpm-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Mapping hardness fixture by fixture</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative floor plan: test every tap with the same kit and write the result on the plan</text><rect x="30" y="90" width="230" height="150" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="40" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Kitchen</text><rect x="260" y="90" width="200" height="150" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="270" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Bathroom 1</text><rect x="30" y="240" width="200" height="170" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="40" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Utility</text><rect x="230" y="240" width="230" height="170" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="240" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Living</text><rect x="460" y="90" width="270" height="220" fill="#fff7ed" stroke="#3a5a72" stroke-width="2" stroke-dasharray="8 4"/><text x="470" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Addition</text><circle cx="50" cy="140" r="7" fill="#0e7490"/><text x="64" y="145" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">sink: <tspan font-weight="bold" fill="#0e7490">0</tspan></text><circle cx="50" cy="176" r="7" fill="#0e7490"/><text x="64" y="181" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">dishwasher: <tspan font-weight="bold" fill="#0e7490">0</tspan></text><circle cx="280" cy="140" r="7" fill="#0e7490"/><text x="294" y="145" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">sink: <tspan font-weight="bold" fill="#0e7490">0</tspan></text><circle cx="280" cy="176" r="7" fill="#0e7490"/><text x="294" y="181" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">shower: <tspan font-weight="bold" fill="#0e7490">0</tspan></text><circle cx="50" cy="290" r="7" fill="#0e7490"/><text x="64" y="295" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">washer: <tspan font-weight="bold" fill="#0e7490">0</tspan></text><circle cx="488" cy="170" r="7" fill="#c2410c"/><text x="502" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">bath sink: <tspan font-weight="bold" fill="#c2410c">hard</tspan></text><circle cx="488" cy="208" r="7" fill="#c2410c"/><text x="502" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">shower: <tspan font-weight="bold" fill="#c2410c">hard</tspan></text><ellipse cx="560" cy="190" rx="112" ry="62" fill="none" stroke="#dc2626" stroke-width="2.5"/><rect class="box" x="122" y="356" width="90" height="40" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="167" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">SOFTENER</text><text x="167" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">outlet: 0</text><path class="ln" d="M18,376 L122,376" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="376" r="7" fill="#dc2626" stroke="#fff" stroke-width="2"/><circle cx="330" cy="410" r="7" fill="#c2410c"/><text x="344" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">outdoor bib: <tspan font-weight="bold" fill="#c2410c">hard</tspan></text><text x="344" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">(deliberate)</text><path class="ln" d="M560,252 L560,452 L78,452 L78,390" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fpm-r)"/><text x="582" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">trace the hard</text><text x="582" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">group back toward</text><text x="582" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">the supply entry</text><text x="96" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">tee lives here</text><text x="30" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">The split is upstream of every hard fixture and downstream of nothing soft.</text><circle cx="36" cy="515" r="7" fill="#0e7490"/><text x="50" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">reads 0 (soft)</text><circle cx="206" cy="515" r="7" fill="#c2410c"/><text x="220" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">reads hard</text><circle cx="346" cy="515" r="7" fill="#dc2626"/><text x="360" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">where the branch leaves the main</text>
</svg>
