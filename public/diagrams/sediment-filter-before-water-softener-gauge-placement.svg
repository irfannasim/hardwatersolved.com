<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="g4sg-title g4sg-desc">
<title id="g4sg-title">Sediment filter before a water softener: where the two gauges go</title>
<desc id="g4sg-desc">Diagram of a sediment filter before a water softener with an inlet gauge between the pressure tank or meter and the housing, and an outlet gauge between the housing and the softener inlet. The pressure drop is inlet minus outlet.</desc>
<defs><marker id="g4sg-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4sg-af" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><pattern id="g4sg-pl" width="6" height="10" patternUnits="userSpaceOnUse"><rect width="6" height="10" fill="#f1ede4"/><rect x="0" y="0" width="2" height="10" fill="#d6cdb8"/></pattern></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Two gauges, one each side of the filter</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The difference between them is what the cartridge is costing you.</text><rect class="box" x="30" y="186" width="120" height="48" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="90" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pressure tank</text><text x="90" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">or meter</text><path class="ln" d="M150,210 L285,210" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round"/><path class="ln" d="M395,210 L548,210" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4sg-ah)"/><path class="ln" d="M215,207 L215,166" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="215" cy="150" r="16" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><path d="M215,150 L223,142" stroke="#0b2f4a" stroke-width="2"/><text x="215" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Inlet gauge</text><path class="ln" d="M470,207 L470,166" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="470" cy="150" r="16" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><path d="M470,150 L478,142" stroke="#0b2f4a" stroke-width="2"/><text x="470" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Outlet gauge</text><text x="342" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Drop = inlet − outlet</text><path class="ln" d="M246,160 L438,160" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4sg-af)" marker-start="url(#g4sg-af)"/><rect x="285" y="196" width="110" height="28" rx="5" fill="#3a5a72"/><rect x="302" y="224" width="76" height="100" rx="12" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="318" y="232" width="44" height="84" rx="4" fill="url(#g4sg-pl)"/><text x="340" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment filter housing</text><text x="340" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">20–30 micron cartridge</text><rect class="box" x="560" y="186" width="170" height="48" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="645" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Softener inlet</text><text x="645" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">(control valve)</text><rect class="box" x="30" y="392" width="340" height="58" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Read at one fixed test flow</text><text x="46" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">e.g. one bath tap fully open, every time</text><rect class="box" x="390" y="392" width="340" height="58" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="406" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Match the plumbing</text><text x="406" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">1-inch softener? Big 4.5 × 20 in housing</text><rect x="30" y="475" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated water to the softener</text>
</svg>
