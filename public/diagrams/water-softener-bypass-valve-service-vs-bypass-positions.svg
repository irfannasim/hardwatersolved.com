<title id="g6bp-title">Water softener bypass valve positions: service, bypass and halfway</title>
<desc id="g6bp-desc">Water softener bypass valve diagram: a single-lever bypass in service, bypass and the halfway position that blends hard water in, and a three-valve arrangement where service means inlet and outlet open with the bypass valve closed.</desc>
<defs><marker id="g6bp-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g6bp-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
