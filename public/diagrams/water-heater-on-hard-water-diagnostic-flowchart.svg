<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="hdf-title hdf-desc">
<title id="hdf-title">Diagnostic flowchart for a water heater still getting hard water after a softener</title>
<desc id="hdf-desc">Four checks in order for a house where hot water is hard and cold is soft: test the softener outlet, allow for old tank water, trace the water heater cold inlet to see if it joins the main before the softener, then check recirculation loops and mixing valves.</desc>
<defs><marker id="hdf-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="hdf-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="760" height="570" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hot water hard, cold water soft? Check in this order</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Rule out the softener and old tank water before you pay to re-pipe.</text><rect class="box" x="30" y="92" width="400" height="64" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="119" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">1. Test at the softener outlet or</text><text x="44" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">nearest cold tap. Near 0 gpg?</text><path class="ln" d="M430,124 L496,124" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdf-r)"/><text x="465" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">no</text><rect class="box" x="500" y="92" width="230" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="512" y="119" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softener problem, not the</text><text x="512" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">heater. Fix the softener first.</text><path class="ln" d="M90,156 L90,188" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdf-g)"/><text x="102" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">yes</text><rect class="box" x="30" y="192" width="400" height="64" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="219" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">2. Heater has run on soft water for</text><text x="44" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">two weeks or a flush. Still hard?</text><path class="ln" d="M430,224 L496,224" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdf-r)"/><text x="465" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">no</text><rect class="box" x="500" y="192" width="230" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="512" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Old hard water still in the</text><text x="512" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">tank. Keep using it or flush.</text><path class="ln" d="M90,256 L90,288" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdf-g)"/><text x="102" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">yes</text><rect class="box" x="30" y="292" width="400" height="64" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="319" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">3. Trace the heater cold inlet to the</text><text x="44" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">main. Joins before softener inlet?</text><path class="ln" d="M430,324 L496,324" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdf-r)"/><text x="465" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="500" y="292" width="230" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="512" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Plumbed wrong. Move the heater</text><text x="512" y="339" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">feed to the softened side.</text><path class="ln" d="M90,356 L90,388" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdf-g)"/><text x="102" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">no</text><rect class="box" x="30" y="392" width="400" height="64" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">4. Check recirculation loops and</text><text x="44" y="439" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">mixing valves. Any hard tie-in?</text><path class="ln" d="M430,424 L496,424" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdf-r)"/><text x="465" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="500" y="392" width="230" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="512" y="419" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hard water is entering the hot</text><text x="512" y="439" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">side there. Re-pipe that tie-in.</text><path class="ln" d="M90,456 L90,488" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hdf-g)"/><text x="102" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">no</text><rect class="box" x="30" y="492" width="700" height="48" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="44" y="521" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Retest hot and cold with the same method. Sample hot water after it cools.</text>
</svg>
