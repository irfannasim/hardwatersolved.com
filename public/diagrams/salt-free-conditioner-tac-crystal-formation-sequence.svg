<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="g7tc-title g7tc-desc">
<title id="g7tc-title">How a salt-free water conditioner works: template-assisted crystallization</title>
<desc id="g7tc-desc">Four-step sequence showing how a salt free water conditioner works: dissolved calcium and carbonate ions gather at sites on the TAC media bead, grow into a microcrystal, and the crystal breaks free and stays suspended. Downstream, mineral grows on those loose crystals instead of bonding to a heating element.</desc>
<defs>
<marker id="g7tc-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker>
</defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">How template-assisted crystallization (TAC) works</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Hardness stays in the water. What changes is the form it travels in.</text>
<text x="30" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">WATER FLOWS UP THROUGH A LOOSE, MOVING BED OF TAC BEADS</text>
<path class="ln" d="M530,94 L722,94" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" marker-end="url(#g7tc-a)"/>
<rect class="box" x="30" y="116" width="160" height="200" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<rect class="box" x="210" y="116" width="160" height="200" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<rect class="box" x="390" y="116" width="160" height="200" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<rect class="box" x="570" y="116" width="160" height="200" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<circle cx="52" cy="140" r="13" fill="#0b2f4a"/><text x="52" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="232" cy="140" r="13" fill="#0b2f4a"/><text x="232" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="412" cy="140" r="13" fill="#0b2f4a"/><text x="412" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="592" cy="140" r="13" fill="#0b2f4a"/><text x="592" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<g fill="#e2e8f0" stroke="#3a5a72" stroke-width="2">
<circle cx="110" cy="230" r="46"/><circle cx="290" cy="230" r="46"/><circle cx="470" cy="230" r="46"/><circle cx="650" cy="230" r="46"/>
</g>
<g fill="#0b2f4a">
<circle cx="110" cy="184" r="3"/><circle cx="156" cy="230" r="3"/><circle cx="77" cy="263" r="3"/>
<circle cx="290" cy="184" r="3"/><circle cx="336" cy="230" r="3"/><circle cx="257" cy="263" r="3"/>
<circle cx="650" cy="184" r="3"/><circle cx="696" cy="230" r="3"/><circle cx="617" cy="263" r="3"/>
</g>
<g fill="#c2410c">
<circle cx="50" cy="178" r="5"/><circle cx="170" cy="200" r="5"/><circle cx="58" cy="290" r="5"/><circle cx="160" cy="290" r="5"/>
<circle cx="284" cy="178" r="5"/><circle cx="342" cy="226" r="5"/><circle cx="250" cy="268" r="5"/>
</g>
<g fill="#52697a">
<circle cx="70" cy="200" r="4"/><circle cx="178" cy="262" r="4"/><circle cx="108" cy="298" r="4"/><circle cx="40" cy="232" r="4"/>
<circle cx="297" cy="178" r="4"/><circle cx="343" cy="238" r="4"/><circle cx="260" cy="274" r="4"/>
</g>
<g fill="#fde7d6" stroke="#c2410c" stroke-width="2">
<path d="M470,170 L479,181 L470,192 L461,181 z"/><path d="M522,230 L531,241 L522,252 L513,241 z"/><path d="M432,256 L441,267 L432,278 L423,267 z"/>
<path d="M600,160 L609,171 L600,182 L591,171 z"/><path d="M716,196 L725,207 L716,218 L707,207 z"/><path d="M600,284 L609,295 L600,306 L591,295 z"/>
</g>
<text x="110" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Dissolved calcium and</text>
<text x="110" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">carbonate ions arrive</text>
<text x="290" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Ions gather at sites</text>
<text x="290" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">on the bead surface</text>
<text x="470" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">A microcrystal grows</text>
<text x="470" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">on each template site</text>
<text x="650" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Crystals break free and</text>
<text x="650" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">travel on in the water</text>
<rect class="box" x="30" y="392" width="340" height="170" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="46" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Heater element, untreated water</text>
<rect x="62" y="452" width="276" height="40" rx="12" fill="#fde7d6" stroke="#c2410c" stroke-width="2"/>
<rect x="72" y="464" width="256" height="16" rx="6" fill="#3a5a72"/>
<text x="46" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Calcium carbonate plates onto the hot</text>
<text x="46" y="541" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">element as hard, bonded scale</text>
<rect class="box" x="390" y="392" width="340" height="170" rx="10" fill="#e0f2f1" stroke="#0e7490" stroke-width="1.5"/>
<text x="406" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Heater element, TAC-treated water</text>
<g fill="#fde7d6" stroke="#c2410c" stroke-width="2">
<path d="M450,432 L457,440 L450,448 L443,440 z"/><path d="M530,434 L537,442 L530,450 L523,442 z"/><path d="M610,432 L617,440 L610,448 L603,440 z"/><path d="M680,434 L687,442 L680,450 L673,442 z"/>
</g>
<rect x="429" y="461" width="262" height="22" rx="8" fill="#fde7d6" stroke="#c2410c" stroke-width="1"/>
<rect x="432" y="464" width="256" height="16" rx="6" fill="#3a5a72"/>
<text x="406" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Mineral grows on the loose crystals,</text>
<text x="406" y="541" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">so far less bonds to the element</text>
<circle cx="36" cy="590" r="5" fill="#c2410c"/><text x="48" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">calcium ion</text>
<circle cx="150" cy="590" r="4" fill="#52697a"/><text x="162" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">carbonate ion</text>
<path d="M284,582 L291,590 L284,598 L277,590 z" fill="#fde7d6" stroke="#c2410c" stroke-width="2"/><text x="298" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">microcrystal</text>
<circle cx="410" cy="590" r="7" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><text x="424" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">TAC media bead</text>
<circle cx="560" cy="590" r="3" fill="#0b2f4a"/><text x="570" y="595" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">nucleation site</text>
</svg>
