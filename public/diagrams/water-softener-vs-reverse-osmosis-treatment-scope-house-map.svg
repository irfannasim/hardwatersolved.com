<text x="52" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water</text>
<rect x="150" y="494" width="14" height="14" rx="2" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/>
<text x="172" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened or RO-treated water</text>
