<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="wsro-title wsro-desc">
<title id="wsro-title">Water softener vs reverse osmosis: which outlets each one treats</title>
<desc id="wsro-desc">Two identical house plans. With a water softener at the point of entry, all six outlets get soft water. With only an under-sink reverse osmosis system, five outlets stay hard and only the drinking tap is treated.</desc>
<defs><marker id="wsro-mc2410c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water softener vs reverse osmosis: what each one reaches</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same house, same six outlets. Only the treatment location changes.</text>
<rect class="box" x="30" y="86" width="340" height="390" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water softener at the entry</text>
<rect class="box" x="50" y="134" width="120" height="54" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/>
<text x="110" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Supply</text>
<text x="110" y="175.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#c2410c">hard water</text>
<rect class="box" x="220" y="134" width="130" height="54" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/>
<text x="285" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text>
<text x="285" y="175.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">every gallon</text>
<path class="ln" d="M170,161 L214,161" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsro-mc2410c)"/>
<path class="ln" d="M285,188 L285,212 L200,212 L200,410" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="50" y="232" width="130" height="48" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/>
<text x="115" y="251.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water heater</text>
<text x="115" y="270.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">scale risk</text>
<path class="ln" d="M200,256 L184,256" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="220" y="232" width="130" height="48" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/>
<text x="285" y="251.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Showers, tubs</text>
<text x="285" y="270.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">spots, lather</text>
<path class="ln" d="M200,256 L216,256" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="50" y="296" width="130" height="48" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/>
<text x="115" y="315.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Washing machine</text>
<text x="115" y="334.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">detergent use</text>
