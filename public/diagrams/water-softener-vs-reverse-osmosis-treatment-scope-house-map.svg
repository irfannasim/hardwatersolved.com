<text x="470" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Supply</text>
<text x="470" y="175.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#c2410c">hard water</text>
<rect class="box" x="580" y="134" width="130" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
<text x="645" y="156.5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">No entry unit</text>
<text x="645" y="175.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">nothing treated</text>
<path class="ln" d="M530,161 L574,161" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsro-mc2410c)"/>
<path class="ln" d="M645,188 L645,212 L560,212 L560,410" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="410" y="232" width="130" height="48" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/>
<text x="475" y="251.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water heater</text>
<text x="475" y="270.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">scale risk</text>
<path class="ln" d="M560,256 L544,256" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="580" y="232" width="130" height="48" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/>
<text x="645" y="251.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Showers, tubs</text>
<text x="645" y="270.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">spots, lather</text>
