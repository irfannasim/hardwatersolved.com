<rect class="box" x="220" y="296" width="130" height="48" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/>
<text x="285" y="315.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Dishwasher</text>
<text x="285" y="334.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">film on glass</text>
<path class="ln" d="M200,320 L216,320" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="50" y="360" width="130" height="48" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/>
<text x="115" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Kitchen tap</text>
<text x="115" y="398.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">washing up</text>
<path class="ln" d="M200,384 L184,384" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="box" x="220" y="360" width="130" height="48" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/>
<text x="285" y="379.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Drinking tap</text>
<text x="285" y="398.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">drink, cook</text>
<path class="ln" d="M200,384 L216,384" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="452" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">6 of 6 outlets softened</text>
<rect class="box" x="390" y="86" width="340" height="390" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
