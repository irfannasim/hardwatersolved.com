<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="g3pc-title g3pc-desc">
<title id="g3pc-title">Waterdrop G3P600 annual filter cost at three household usage levels</title>
<desc id="g3pc-desc">Stacked bars of yearly Waterdrop G3P600 filter spending: about $145 at 1.5 and 3 gallons a day, because filters expire on time before gallons, and about $290 at 6 gallons a day, when gallon limits take over. Cost per gallon falls from about 26 cents to about 13 cents.</desc>
<defs></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Waterdrop G3P600 filter cost per year at three usage levels</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Each filter is changed at its months or gallons limit, whichever comes first. Waterdrop store prices.</text><text x="30" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Light use</text><text x="30" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">1.5 gal/day, ~550 gal/yr</text><rect x="220.0" y="112" width="78.0" height="40" fill="#3a5a72"/><text x="258.987" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$60</text><rect x="298.0" y="112" width="39.0" height="40" fill="#52697a"/><rect x="296.5" y="112" width="3" height="40" fill="#ffffff"/><text x="317.4675" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$30</text><rect x="337.0" y="112" width="71.5" height="40" fill="#0e7490"/><rect x="335.5" y="112" width="3" height="40" fill="#ffffff"/><text x="372.711" y="137" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$55</text><text x="420.461" y="130" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">$145 a year</text><text x="420.461" y="149" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">~26¢ per gallon</text><text x="30" y="230" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Family of four</text><text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">3 gal/day, ~1,100 gal/yr</text><rect x="220.0" y="216" width="78.0" height="40" fill="#3a5a72"/><text x="258.987" y="241" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$60</text><rect x="298.0" y="216" width="39.0" height="40" fill="#52697a"/><rect x="296.5" y="216" width="3" height="40" fill="#ffffff"/><text x="317.4675" y="241" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$30</text><rect x="337.0" y="216" width="71.5" height="40" fill="#0e7490"/><rect x="335.5" y="216" width="3" height="40" fill="#ffffff"/><text x="372.711" y="241" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$55</text><text x="420.461" y="234" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">$145 a year</text><text x="420.461" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">~13¢ per gallon</text><text x="30" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Heavy use</text><text x="30" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">6 gal/day, ~2,190 gal/yr</text><rect x="220.0" y="320" width="155.9" height="40" fill="#3a5a72"/><text x="297.974" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$120</text><rect x="375.9" y="320" width="78.0" height="40" fill="#52697a"/><rect x="374.4" y="320" width="3" height="40" fill="#ffffff"/><text x="414.935" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="