<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" width="760" height="572" role="img" aria-labelledby="wsff-title wsff-desc">
<title id="wsff-title">Water softener startup: slow fill vs fast fill of the resin tank</title>
<desc id="wsff-desc">Two water softener mineral tanks during startup in the backwash position. Opening the inlet fast lifts the resin bed and carries beads out the drain; cracking it open lets air leave gently while the bed stays settled.</desc>
<defs><marker id="wsff-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="wsff-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="wsff-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><pattern id="wsff-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="wsff-loose" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#dbeafe"/><circle cx="5" cy="5" r="3" fill="#e2b865"/><circle cx="13" cy="13" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="572" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Startup fill: inlet cracked open vs opened fast</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same tank, same valve in BACKWASH. Only the inlet opening speed differs.</text><rect class="box" x="30" y="86" width="340" height="440" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="200" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">INLET OPENED FAST</text><rect x="105" y="150" width="80" height="40" rx="6" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><rect x="90" y="190" width="110" height="270" rx="28" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><rect x="93" y="200" width="104" height="254" rx="24" fill="url(#wsff-loose)"/><rect x="141" y="190" width="8" height="250" fill="#cbd5e1"/><path class="ln" d="M46,170 L105,170" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsff-h)"/><text x="48" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">inlet full open</text><path class="ln" d="M185,160 L280,160 L280,210" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsff-r)"/><text x="292" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">drain</text><text x="282" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">resin</text><text x="282" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">beads</text><text x="282" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">carried</text><text x="282" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">out with</text><text x="282" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">the air</text><text x="282" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">bed</text><text x="282" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">slammed</text><text x="282" y="406" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">upward</text><text x="50" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Surge through the bottom distributor</text><text x="50" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">lifts the whole bed; beads reach the drain.</text><rect class="box" x="390" y="86" width="340" height="440" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="560" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803d">INLET CRACKED OPEN</text><rect x="465" y="150" width="80" height="40" rx="6" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><rect x="450" y="190" width="110" height="270" rx="28" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><rect x="453" y="260" width="104" height="194" rx="24" fill="url(#wsff-beads)"/><rect x="453" y="220" width="104" height="40" fill="#dbeafe"/><rect x="501" y="190" width="8" height="250" fill="#cbd5e1"/><path class="ln" d="M406,170 L465,170" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsff-h)"/><text x="408" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">inlet barely open</text><path class="ln" d="M545,160 L640,160 L640,210" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsff-d)"/><text x="652" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">drain</text><text x="642" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">air</text><text x="642" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">pushed</text><text x="642" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">out</text><text x="642" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">gently</text><text x="642" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">bed</text><text x="642" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">stays</text><text x="642" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">settled</text><text x="410" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water rises from the bottom; air</text><text x="410" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">leaves first, then a steady flow to drain.</text><rect x="30" y="544" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">incoming water</text><rect x="200" y="544" width="26" height="6" rx="3" fill="#78716c"/><text x="234" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><rect x="330" y="544" width="26" height="6" rx="3" fill="#dc2626"/><text x="364" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin loss</text><rect x="470" y="542" width="14" height="14" fill="url(#wsff-beads)" stroke="#3a5a72" stroke-width="1"/><text x="492" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin bed</text>
</svg>
