<text x="80" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">35</text>
<text x="630" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">14 days</text>
<text x="630" y="347" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">7 days</text>
<text x="630" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">common day</text>
<text x="630" y="333" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">override range</text>
<path d="M90,400 L620,400" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path d="M90,110 L90,400" stroke="#0b2f4a" stroke-width="2" fill="none"/>
