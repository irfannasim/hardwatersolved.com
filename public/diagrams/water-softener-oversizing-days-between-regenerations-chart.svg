<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 524" width="760" height="524" role="img" aria-labelledby="ovd-title ovd-desc">
<title id="ovd-title">Oversized water softener: days between regenerations by grain rating</title>
<desc id="ovd-desc">Illustrative bar chart of days between regenerations for 24,000 to 80,000 grain softeners serving a four-person and a two-person household on 10 gpg water. The larger units exceed the 7 to 14 day range where a day override forces regeneration, showing when an oversized water softener sits idle.</desc>
<defs></defs>
<rect width="760" height="524" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Days between regenerations, by softener size</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative: 10 gpg water, 75 gal per person per day, 6 lb salt per cu ft, one day of reserve</text>
<rect x="90" y="110" width="530" height="174" fill="#fef2f2"/>
<text x="100" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Beyond 14 days: the bed sits idle longer</text>
<text x="100" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">than a typical day override allows</text>
<text x="80" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<path d="M90,342 L620,342" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<text x="80" y="347" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">7</text>
<path d="M90,284 L620,284" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<text x="80" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">14</text>
<path d="M90,226 L620,226" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="80" y="231" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">21</text>
<path d="M90,168 L620,168" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="80" y="173" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">28</text>
