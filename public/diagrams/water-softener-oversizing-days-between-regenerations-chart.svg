<text x="547" y="263.9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0b2f4a">15.7</text>
<text x="587" y="126.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0b2f4a">32.3</text>
<text x="567" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">80,000</text>
<text x="567" y="440" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">(50,000 usable)</text>
<text x="355" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Nominal grain rating (usable grains at 6 lb salt per cu ft)</text>
