<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="g7dv-title g7dv-desc">
<title id="g7dv-title">Electronic descaler vs water softener: which test can verify each one</title>
<desc id="g7dv-desc">An ion-exchange water softener removes calcium and magnesium, so a hardness test verifies it. An electronic or magnetic descaler leaves hardness in the water, so a hardness test reads the same either way; only a scale-deposit test on a heated surface can judge it.</desc>
<defs>
<marker id="g7dv-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="g7dv-steel" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker>
</defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Which test can prove each device works?</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">A hardness test checks a softener. It cannot settle the question for a descaler.</text>
<text x="30" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">DEVICE</text>
<text x="265" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">WHAT IT CHANGES</text>
<text x="510" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">THE TEST AND WHAT IT SHOWS</text>
<rect class="box" x="30" y="112" width="190" height="80" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="44" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Ion-exchange softener</text>
<text x="44" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">salt-regenerated resin</text>
<path class="ln" d="M226,152 L256,152" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" marker-end="url(#g7dv-soft)"/>
<rect class="box" x="265" y="112" width="205" height="80" rx="8" fill="#e0f2f1" stroke="#0e7490" stroke-width="2"/>
<text x="279" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Removes Ca²⁺ and Mg²⁺</text>
<text x="279" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">hardness leaves the water</text>
<path class="ln" d="M476,152 L500,152" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" marker-end="url(#g7dv-soft)"/>
<rect class="box" x="510" y="112" width="220" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="524" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#15803d">Hardness test: valid</text>
<text x="524" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">reads 0–1 gpg if working</text>
<rect class="box" x="30" y="232" width="190" height="80" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="44" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Descaler</text>
<text x="44" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">electronic or magnetic</text>
<path class="ln" d="M226,272 L256,272" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" marker-end="url(#g7dv-steel)"/>
<rect class="box" x="265" y="232" width="205" height="80" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="279" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Hardness stays</text>
<text x="279" y="277" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">claims to change how</text>
<text x="279" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">the crystals form</text>
<path class="ln" d="M476,272 L500,272" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" marker-end="url(#g7dv-steel)"/>
<rect class="box" x="510" y="232" width="220" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
<text x="524" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">Hardness test: no answer</text>
<text x="524" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">same reading either way</text>
<path class="ln" d="M367,318 L367,392 L500,392" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g7dv-steel)"/>
<text x="382" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">test this instead</text>
<rect class="box" x="510" y="352" width="220" height="80" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="524" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#15803d">Scale test: valid</text>
<text x="524" y="397" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">treated vs untreated water,</text>
<text x="524" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">scale weighed on a heater</text>
<text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">DVGW W 512 is the German heated-scale protocol the WateReuse study used to score these devices.</text>
<rect x="30" y="496" width="22" height="14" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="60" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">test can decide</text>
<rect x="200" y="496" width="22" height="14" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
<text x="230" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">test cannot decide</text>
<rect x="390" y="500" width="26" height="6" rx="3" fill="#0e7490"/>
<text x="424" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">hardness removed</text>
<rect x="570" y="500" width="26" height="6" rx="3" fill="#3a5a72"/>
<text x="604" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">hardness stays</text>
</svg>
