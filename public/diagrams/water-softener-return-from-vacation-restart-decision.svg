<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 708" width="760" height="708" role="img" aria-labelledby="wvrr-title wvrr-desc">
<title id="wvrr-title">Water softener restart after vacation: flush, check salt, regenerate or sanitize</title>
<desc id="wvrr-desc">Flowchart for returning from a trip: if the water softener was bypassed, flush and return it to service slowly; check the salt for a bridge and the clock settings; then run a manual regeneration, or sanitize with bleach in the brine well if the absence was two weeks or more on a well or there is a musty smell; test hardness the next day.</desc>
<defs><marker id="vrA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="708" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Back from a trip: restarting the softener</text><rect class="box" x="270" y="62" width="220" height="40" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="380" y="88" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Back home</text><path class="ln" d="M380,102 L380,122" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vrA)"/><rect class="box" x="220" y="128" width="320" height="50" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="380" y="159" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Was the softener in bypass?</text><path class="ln" d="M380,178 L380,196 L170,196 L170,214" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vrA)"/><path class="ln" d="M380,196 L595,196 L595,214" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vrA)"/><text x="180" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">no</text><text x="605" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">yes</text><rect class="box" x="40" y="220" width="260" height="64" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="170" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Check the salt level and</text><text x="170" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">probe for a salt bridge</text><rect class="box" x="460" y="220" width="270" height="82" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="595" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Main on, flush a cold tap,</text><text x="595" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">open the bypass slowly,</text><text x="595" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">purge air; then check salt</text><path class="ln" d="M170,284 L170,312 L380,312 L380,326" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vrA)"/><path class="ln" d="M595,302 L595,312 L380,312" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="190" y="332" width="380" height="50" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="380" y="363" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Check the clock and settings; reset if lost</text><path class="ln" d="M380,382 L380,404" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vrA)"/><rect class="box" x="150" y="410" width="460" height="70" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="380" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Away 2 weeks or more on a well, or any</text><text x="380" y="459" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">musty or rotten-egg smell at the taps?</text><path class="ln" d="M380,480 L380,496 L160,496 L160,514" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vrA)"/><path class="ln" d="M380,496 L600,496 L600,514" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vrA)"/><text x="170" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">no</text><text x="610" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">yes</text><rect class="box" x="30" y="520" width="260" height="56" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="160" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Run one manual</text><text x="160" y="562" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">regeneration</text><rect class="box" x="460" y="520" width="270" height="76" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="595" y="543" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Sanitize: measured bleach</text><text x="595" y="562" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">in the brine well, then</text><text x="595" y="581" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">a full regeneration</text><path class="ln" d="M160,576 L160,612 L380,612 L380,626" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#vrA)"/><path class="ln" d="M600,596 L600,612 L380,612" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="150" y="632" width="460" height="56" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="380" y="655" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Next day: test hardness. After a sanitize,</text><text x="380" y="674" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">flush until chlorine matches normal water.</text>
</svg>
