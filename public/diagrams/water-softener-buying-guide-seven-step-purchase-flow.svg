<rect class="box" x="400" y="332" width="330" height="54" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="416" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">A 10-year cost ceiling,</text>
<text x="416" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">not just a purchase price</text>
<path class="ln" d="M190,386 L190,402" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wbg-a)"/>
<rect class="box" x="30" y="408" width="320" height="54" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<circle cx="56" cy="435" r="14" fill="#0b2f4a"/>
<text x="56" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="82" y="431" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Get quotes</text>
<text x="82" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">two or three, itemised</text>
<path class="ln" d="M350,435 L392,435" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wbg-a)"/>
<rect class="box" x="400" y="408" width="330" height="54" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="416" y="431" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Prices you can compare</text>
<text x="416" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">line by line</text>
<path class="ln" d="M190,462 L190,478" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wbg-a)"/>
<rect class="box" x="30" y="484" width="320" height="54" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<circle cx="56" cy="511" r="14" fill="#0b2f4a"/>
<text x="56" y="516" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="82" y="507" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Check certification</text>
<text x="82" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">NSF/ANSI 44 or WQA listing</text>
<path class="ln" d="M350,511 L392,511" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wbg-a)"/>
<rect class="box" x="400" y="484" width="330" height="54" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="416" y="507" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">A listing you looked up</text>
<text x="416" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">yourself, not a logo</text>
<path class="ln" d="M190,538 L190,554" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wbg-a)"/>
<rect class="box" x="30" y="560" width="320" height="54" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<circle cx="56" cy="587" r="14" fill="#0b2f4a"/>
<text x="56" y="592" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<text x="82" y="583" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Install and start up</text>
<text x="82" y="602" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">code items, hardness setting</text>
<path class="ln" d="M350,587 L392,587" fill="none" stroke="#3a5a72" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wbg-a)"/>
<rect class="box" x="400" y="560" width="330" height="54" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="416" y="583" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">Soft water confirmed</text>
<text x="416" y="602" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">by a test at the tap</text>
