<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" role="img" aria-labelledby="roc-title roc-desc">
<title id="roc-title">Removing water softener chloride from wastewater with reverse osmosis and disposing of the concentrate</title>
<desc id="roc-desc">Treated effluent passes through reverse osmosis, which splits it into low-salt water for reuse and a concentrate holding the same chloride in far less water. The concentrate needs disposal by ocean outfall, deep well injection or evaporation ponds.</desc>
<defs><marker id="roc-t" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="roc-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="510" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Removing chloride at the plant creates a second brine</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Reverse osmosis separates salt from water. It does not destroy it.</text><rect class="box" x="30" y="150" width="180" height="74" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="120" y="182" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Treated effluent</text><text x="120" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">chloride still in it</text><path class="ln" d="M214,187 L276,187" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roc-b)"/><rect class="box" x="286" y="138" width="190" height="98" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2.5"/><text x="381" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Reverse osmosis</text><text x="381" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">membranes, high</text><text x="381" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">electricity use</text><path class="ln" d="M480,170 L535,110" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roc-t)"/><rect class="box" x="545" y="86" width="180" height="64" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="635" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">Low-salt water</text><text x="635" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">for reuse</text><path class="ln" d="M480,204 L535,262" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roc-b)"/><rect class="box" x="545" y="236" width="180" height="76" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="635" y="262" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#7c3aed">Concentrate</text><text x="635" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">same chloride,</text><text x="635" y="301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">far less water</text><path class="ln" d="M635,316 L635,340 L125,340 L125,368" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roc-b)"/><path class="ln" d="M380,340 L380,368" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roc-b)"/><path class="ln" d="M635,340 L635,368" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#roc-b)"/><rect class="box" x="30" y="376" width="190" height="70" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="2"/><text x="125" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Ocean outfall</text><text x="125" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">coastal plants only</text><rect class="box" x="285" y="376" width="190" height="70" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="2"/><text x="380" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Deep well injection</text><text x="380" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">where geology allows</text><rect class="box" x="540" y="376" width="190" height="70" rx="8" fill="#ffffff" stroke="#78716c" stroke-width="2"/><text x="635" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Evaporation ponds</text><text x="635" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">land, then salt to landfill</text><text x="30" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Madison's sewer district put chloride treatment at its plant at more than $400 million.</text>
</svg>
