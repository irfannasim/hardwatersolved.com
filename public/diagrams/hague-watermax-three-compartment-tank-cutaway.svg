<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="hwm-title hwm-desc">
<title id="hwm-title">Hague WaterMax three-compartment media tank cutaway</title>
<desc id="hwm-desc">Simplified cutaway of the Hague WaterMax media tank: one compartment of fine-mesh softening resin with a bacteriostat that every unit carries, two smaller optional compartments for add-on media, what each add-on media targets, and the problems that still need a separate treatment stage.</desc>
<defs>
<pattern id="hwm-resin" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#f6ead2"/><circle cx="6" cy="6" r="3.2" fill="#e2b865"/></pattern>
</defs>
<rect width="760" height="660" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Hague WaterMax: what sits in each compartment</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Simplified cutaway. Volumes from Hague's 60-series owner's manual; current builds may differ.</text>
<rect x="40" y="96" width="250" height="476" rx="40" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="56" y="118" width="218" height="96" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="165" y="144" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Compartment 1</text>
<text x="165" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Optional: empty, or</text>
<text x="165" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">about 1.5 to 2 lb of media</text>
<rect class="box" x="56" y="224" width="218" height="104" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="165" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Compartment 2</text>
<text x="165" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Optional: empty, or</text>
<text x="165" y="292" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">0.3 to 0.6 cu ft of media</text>
<text x="165" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">(or up to 27 lb if dense)</text>
<rect class="box" x="56" y="338" width="218" height="168" fill="url(#hwm-resin)" stroke="#0e7490" stroke-width="2"/>
<rect class="box" x="76" y="370" width="178" height="104" fill="#ffffff" stroke="#0e7490" stroke-width="1"/>
<text x="165" y="394" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Compartment 3</text>
<text x="165" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">1.06 cu ft fine-mesh</text>
<text x="165" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">cation resin</text>
<text x="165" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Fitted in every unit</text>
<rect class="box" x="56" y="514" width="218" height="38" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
<text x="165" y="538" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Bacteriostat at the bottom</text>
<text x="165" y="600" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softening: hardness and</text>
<text x="165" y="620" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">some dissolved iron</text>
<text x="330" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Add-on media for compartments 1 and 2</text>
<text x="330" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">From Hague's WaterMax media guide</text>
<rect class="box" x="330" y="146" width="400" height="250" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="346" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Chlorostat (KDF55)</text>
<text x="530" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">chlorine, heavy metals</text>
<text x="346" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">PC carbon</text>
<text x="530" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">taste, odour, chlorine</text>
<text x="346" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Sulfurstat (KDF85)</text>
<text x="530" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">ferrous iron, H2S</text>
<text x="346" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Birm</text>
<text x="530" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">iron, manganese (pH 6.8+)</text>
<text x="346" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Tannin resin</text>
<text x="530" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">tannins (organics)</text>
<text x="346" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Nitrate select resin</text>
<text x="530" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">nitrate</text>
<text x="346" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Calcite</text>
<text x="530" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">low pH (adds hardness)</text>
<text x="346" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Ultra-fil (garnet)</text>
<text x="530" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">sediment to 20 microns</text>
<text x="346" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Small volumes: a polish, not a full filter bed</text>
<text x="330" y="436" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">Still needs a separate stage</text>
<rect class="box" x="330" y="450" width="400" height="140" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="346" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Iron or manganese above the unit's rating</text>
<text x="346" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">(Hague sells GreensandPlus as a pre-filter)</text>
<text x="346" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Iron bacteria: manual calls for added treatment</text>
<text x="346" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Disinfection of a well (UV or chlorination)</text>
<text x="346" y="576" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Low pH below the chosen model's minimum</text>
<text x="330" y="626" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Hague does not publish the internal flow path; stacking order is simplified.</text>
</svg>
