<text x="606.6666666666666" y="446" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">30 gpg</text>
<rect x="30" y="466" width="16" height="16" rx="0" fill="#cbd5e1" stroke="none" stroke-width="1"/>
<text x="54" y="479" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">8k standard: maker</text>
<rect x="330" y="466" width="16" height="16" rx="0" fill="#64748b" stroke="none" stroke-width="1"/>
<text x="354" y="479" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">8k standard: adjusted</text>
<rect x="30" y="492" width="16" height="16" rx="0" fill="#9fd6df" stroke="none" stroke-width="1"/>
<text x="54" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">16k double: maker</text>
<rect x="330" y="492" width="16" height="16" rx="0" fill="#0e7490" stroke="none" stroke-width="1"/>
<text x="354" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">16k double: adjusted</text>
<text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Adjusted: about 21,000-22,000 grains per cu ft at the 6-6.5 lb per cu ft dose that one or two</text>
<text x="30" y="558" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">26 oz boxes of table salt give these 0.25 and 0.52 cu ft beds.</text>
