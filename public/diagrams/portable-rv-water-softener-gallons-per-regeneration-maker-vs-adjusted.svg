<text x="399.99999999999994" y="446" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">20 gpg</text>
<rect x="522.6666666666666" y="374.0" width="36" height="46.0" rx="0" fill="#cbd5e1" stroke="none" stroke-width="1"/>
<text x="540.6666666666666" y="367.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0b2f4a">267</text>
