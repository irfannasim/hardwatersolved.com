<path d="M90,110 L90,420" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="34" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a" transform="rotate(-90 34 265)">Gallons softened per regeneration</text>
<rect x="109.33333333333333" y="282.2" width="36" height="137.8" rx="0" fill="#cbd5e1" stroke="none" stroke-width="1"/>
<text x="127.33333333333333" y="275.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0b2f4a">800</text>
