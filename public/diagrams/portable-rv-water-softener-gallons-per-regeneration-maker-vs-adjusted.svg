<text x="421.99999999999994" y="275.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0b2f4a">800</text>
<rect x="447.99999999999994" y="324.4" width="36" height="95.6" rx="0" fill="#0e7490" stroke="none" stroke-width="1"/>
