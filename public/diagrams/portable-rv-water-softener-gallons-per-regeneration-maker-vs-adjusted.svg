<text x="80" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">900</text>
<path d="M90,213.33333333333334 L710,213.33333333333334" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="80" y="218.33333333333334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">1,200</text>
<path d="M90,161.66666666666669 L710,161.66666666666669" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="80" y="166.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">1,500</text>
