<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="pgr-title pgr-desc">
<title id="pgr-title">Portable RV water softener gallons per regeneration: maker figures vs salt-dose adjusted estimate</title>
<desc id="pgr-desc">Illustrative bar chart comparing the maker gallons-per-regeneration figures for 8,000 and 16,000 grain portable RV water softeners at 10, 20 and 30 gpg with estimates adjusted for the table-salt dose actually used, which are about a third lower.</desc>
