<circle cx="318" cy="212" r="12" fill="#0b2f4a"/>
<text x="318" y="216.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
