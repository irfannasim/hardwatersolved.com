<circle cx="500" cy="105" r="12" fill="#0b2f4a"/>
<text x="500" y="109.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="522" y="110" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Blue-green stain where</text>
<text x="522" y="129" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">drips dry under spouts</text>
<circle cx="500" cy="165" r="12" fill="#0b2f4a"/>
<text x="500" y="169.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="522" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Green crust at a joint: a</text>
<text x="522" y="189" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">slow weep. Wipe, recheck</text>
<circle cx="500" cy="225" r="12" fill="#0b2f4a"/>
<text x="500" y="229.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="522" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pinhole: underside of</text>
<text x="522" y="249" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">horizontal runs, past</text>
<text x="522" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">elbows and tees</text>
<circle cx="500" cy="304" r="12" fill="#0b2f4a"/>
<text x="500" y="308.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="522" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Ceiling stain below a</text>
<text x="522" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">bathroom: a leak above</text>
<circle cx="500" cy="364" r="12" fill="#0b2f4a"/>
<text x="500" y="368.68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="522" y="369" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Tank gauge falls with</text>
<text x="522" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">every tap off: water is</text>
<text x="522" y="407" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">leaving the system</text>
<text x="30" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Each sign has other causes too. Treat them as reasons to test pH, alkalinity and first-draw copper.</text>
