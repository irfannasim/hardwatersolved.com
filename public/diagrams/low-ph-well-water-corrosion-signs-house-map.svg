<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="lpm-title lpm-desc">
<title id="lpm-title">Signs of acidic low pH well water corrosion in a house: stains, joint crust, pinholes and leak test</title>
<desc id="lpm-desc">House plumbing map for a private well showing where low pH well water damage appears: blue-green stains under fixtures, green crust at solder joints, pinholes on horizontal copper runs past elbows, ceiling stains below bathrooms, and a pressure tank gauge that falls with every tap closed.</desc>
