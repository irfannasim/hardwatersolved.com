<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-labelledby="cpb-title cpb-desc">
<title id="cpb-title">Carbon filter before water softener payback by chlorine residual (illustrative)</title>
<desc id="cpb-desc">Illustrative chart comparing the yearly cost of a carbon filter before a water softener, about $140, with the extra resin cost chlorine causes: carbon pays from about 1.1 mg/L if you would replace the unit and about 1.6 mg/L if you would re-bed.</desc>
<defs></defs>
<rect width="760" height="580" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Carbon before a softener: where it starts to pay</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Extra resin cost caused by chlorine each year, against the yearly cost of carbon (illustrative).</text><path d="M100,430 L700,430" stroke="#0b2f4a" stroke-width="1.5"/><text x="90" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$0</text><path d="M100,378.3 L700,378.3" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="383.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$100</text><path d="M100,326.7 L700,326.7" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="331.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$200</text><path d="M100,275 L700,275" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$300</text><path d="M100,223.3 L700,223.3" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="228.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$400</text><path d="M100,171.7 L700,171.7" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="176.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$500</text><path d="M100,120 L700,120" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">$600</text><text x="100" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0.0</text><text x="220" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0.5</text><text x="340" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1.0</text><text x="460" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1.5</text><text x="580" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2.0</text><text x="700" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2.5</text><text x="400" y="476" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">free chlorine reaching the softener (mg/L)</text><text x="100" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">dollars per year</text><path d="M100,357.7 L700,357.7" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M100,430 L112,427.7 L124,425.4 L136,422.9 L148,420.4 L160,417.8 L172,415.1 L184,412.3 L196,409.4 L208,406.4 L220,403.2 L232,400 L244,396.7 L256,393.2 L268,389.7 L280,386 L292,382.1 L304,378.2 L316,374.1 L328,369.8 L340,365.4 L352,360.9 L364,356.1 L376,351.3 L388,346.2 L400,341 L412,335.6 L424,330 L436,324.1 L448,318.1 L460,311.9 L472,305.5 L484,298.8 L496,291.9 L508,284.8 L520,277.4 L532,269.7 L544,261.8 L556,253.5 L568,245 L580,236.2 L592,227.1 L604,217.7 L616,207.9 L628,197.8 L640,187.4 L652,176.5 L664,165.3 L676,153.7 L688,141.7 L700,129.2" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M100,430 L112,428.8 L124,427.5 L136,426.2 L148,424.9 L160,423.5 L172,422 L184,420.5 L196,419 L208,417.4 L220,415.7 L232,414 L244,412.2 L256,410.4 L268,408.5 L280,406.5 L292,404.5 L304,402.4 L316,400.2 L328,397.9 L340,395.6 L352,393.1 L364,390.6 L376,388 L388,385.3 L400,382.5 L412,379.6 L424,376.6 L436,373.5 L448,370.3 L460,367 L472,363.6 L484,360 L496,356.3 L508,352.5 L520,348.6 L532,344.5 L544,340.3 L556,335.9 L568,331.4 L580,326.7 L592,321.8 L604,316.8 L616,311.6 L628,306.2 L640,300.6 L652,294.8 L664,288.8 L676,282.6 L688,276.2 L700,269.6" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 6"/><circle cx="360.2" cy="357.7" r="7" fill="#15803d" stroke="#fff" stroke-width="2"/><circle cx="491.7" cy="357.7" r="7" fill="#15803d" stroke="#fff" stroke-width="2"/><text x="344.2" y="343.7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#15803d">1.1 mg/L</text><text x="491.7" y="389.7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">1.6 mg/L</text><text x="696" y="381.7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0e7490">Carbon:</text><text x="696" y="399.7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0e7490">about $140 a year</text><text x="488.8" y="140.7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#dc2626">Replace the whole</text><text x="488.8" y="158.7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#dc2626">$1,500 unit</text><text x="595" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">Re-bed for $800</text><text x="119.2" y="281.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Below both points, carbon</text><text x="119.2" y="299.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">costs more than it saves</text><text x="30" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Assumes 12 years of resin life on unchlorinated water, halving for each 1 mg/L of residual.</text><text x="30" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Carbon: about $1,200 installed over 15 years, plus about $250 of media every 4 years.</text><text x="30" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative prices. Put your own quotes into the same arithmetic.</text>
</svg>
