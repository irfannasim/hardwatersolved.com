<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 474" width="760" height="474" role="img" aria-labelledby="aqf-title aqf-desc">
<title id="aqf-title">AquaTru Classic countertop reverse osmosis flow with recirculating tap tank</title>
<desc id="aqf-desc">Flow inside the AquaTru Classic: water from a hand-filled tap tank passes the Pre/Carbon filter, RO membrane and VOC carbon filter into a 0.75 gallon clean tank and push-button dispenser, while reject water returns to the tap tank, where contaminants concentrate until it is emptied.</desc>
<defs><marker id="aqf-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="aqf-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="aqf-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="474" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inside the AquaTru Classic: four stages and a recirculating tank</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">No plumbing: you fill the tap tank, and reject water goes back into it instead of a drain.</text><rect class="box" x="30" y="100" width="150" height="76" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="40" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Tap water tank</text><text x="40" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">you fill it by hand</text><text x="40" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from any tap</text><rect class="box" x="220" y="100" width="150" height="76" rx="6" fill="#fff7ed" stroke="#3a5a72" stroke-width="1.5"/><text x="230" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Stages 1-2</text><text x="230" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Pre/Carbon filter</text><text x="230" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sediment, chlorine</text><rect class="box" x="410" y="100" width="150" height="76" rx="6" fill="#ecfeff" stroke="#0b2f4a" stroke-width="1.5"/><text x="420" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Stage 3</text><text x="420" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">RO membrane</text><text x="420" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">lead, fluoride, TDS</text><rect class="box" x="600" y="100" width="130" height="76" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="610" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Stage 4</text><text x="610" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">VOC carbon</text><text x="610" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">final polish</text><path class="ln" d="M180,138 L214,138" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aqf-h)"/><path class="ln" d="M370,138 L404,138" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aqf-h)"/><path class="ln" d="M560,138 L594,138" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aqf-s)"/><rect class="box" x="600" y="330" width="130" height="76" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="610" y="354" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Clean tank</text><text x="610" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">0.75 gal</text><text x="610" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">ready to pour</text><path class="ln" d="M665,176 L665,324" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aqf-s)"/><rect class="box" x="410" y="330" width="150" height="76" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="420" y="354" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Dispenser</text><text x="420" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">push button,</text><text x="420" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">into a glass</text><path class="ln" d="M600,368 L566,368" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aqf-s)"/><path class="ln" d="M485,176 L485,236 L105,236 L105,182" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aqf-d)"/><text x="130" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#78716c">Reject water returns to the tap tank</text><rect class="box" x="30" y="330" width="340" height="76" rx="6" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5"/><text x="42" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Contaminants concentrate in the tap tank.</text><text x="42" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Empty it regularly, then refill.</text><text x="42" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Rated 75% efficiency: about 1 gal per 3 gal made.</text><path class="ln" d="M30,446 L70,446" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="451" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">tap water</text><path class="ln" d="M190,446 L230,446" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="451" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">purified</text><path class="ln" d="M340,446 L380,446" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="451" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">reject</text>
</svg>
