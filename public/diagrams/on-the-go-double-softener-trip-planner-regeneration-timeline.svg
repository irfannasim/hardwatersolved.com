<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="otp-title otp-desc">
<title id="otp-title">On The Go portable water softener trip planner: regenerations on a 30-day trip</title>
<desc id="otp-desc">Timeline for the On The Go 16,000-grain double portable water softener used by two people at 40 gallons a day: at 10 gpg campsite water it needs one regeneration in 30 days, at 20 gpg two, and at 30 gpg three, each using two boxes of table salt.</desc>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">On The Go double: regenerations on a 30-day trip</text>
<text x="30" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Two people, 40 gal a day, two 26 oz boxes of table salt each time. Illustrative, salt-adjusted.</text>
<text x="30" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">10 gpg campsite</text>
<text x="200" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">every ~28 days (maker's table: 40) · 1 regeneration, 2 boxes</text>
<path class="ln" d="M150,140 L710,140" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<circle cx="672.7" cy="140" r="10" fill="#7c3aed"/>
<text x="672.7" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#7c3aed">Day 28</text>
<text x="30" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">20 gpg campsite</text>
<text x="200" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">every ~14 days (maker's table: 20) · 2 regenerations, 4 boxes</text>
<path class="ln" d="M150,240 L710,240" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<circle cx="411.3" cy="240" r="10" fill="#7c3aed"/>
<circle cx="672.7" cy="240" r="10" fill="#7c3aed"/>
<text x="411.3" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#7c3aed">Day 14</text>
<text x="672.7" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#7c3aed">Day 28</text>
<text x="30" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">30 gpg campsite</text>
<text x="200" y="312" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">every ~9 days (maker's table: 13) · 3 regenerations, 6 boxes</text>
<path class="ln" d="M150,340 L710,340" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
<circle cx="318" cy="340" r="10" fill="#7c3aed"/>
<circle cx="486" cy="340" r="10" fill="#7c3aed"/>
<circle cx="654" cy="340" r="10" fill="#7c3aed"/>
<text x="318" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#7c3aed">Day 9</text>
<text x="486" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#7c3aed">Day 18</text>
<text x="654" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#7c3aed">Day 27</text>
<path class="ln" d="M150,405 L710,405" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M150,405 L150,412 M243.3,405 L243.3,412 M336.7,405 L336.7,412 M430,405 L430,412 M523.3,405 L523.3,412 M616.7,405 L616.7,412 M710,405 L710,412" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<text x="150" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="243.3" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">5</text>
<text x="336.7" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">10</text>
<text x="430" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">15</text>
<text x="523.3" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">20</text>
<text x="616.7" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">25</text>
<text x="710" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">30</text>
<text x="30" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Trip day</text>
<circle cx="40" cy="468" r="8" fill="#7c3aed"/>
<text x="56" y="473" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Regeneration: about 3.25 lb of salt. Trip starts with a freshly regenerated tank.</text>
</svg>
