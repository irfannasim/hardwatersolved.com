<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="cp-title cp-desc">
<title id="cp-title">Whole-house carbon filter placement: before or after the water softener</title>
<desc id="cp-desc">Diagram comparing carbon filter placement: sediment then carbon before the water softener fixes chlorine taste and protects the resin, carbon after the softener only fixes taste, and under-sink carbon or RO treats one tap.</desc>
<defs><marker id="cp-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="cp-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="cp-thard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="cp-tsoft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where the carbon filter goes</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Only carbon ahead of the softener protects the resin as well as fixing the taste.</text><text x="30" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">Best: sediment, then carbon (catalytic if on chloramine), then softener</text><rect class="box" x="30" y="124" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="80" y="152" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Supply</text><path class="ln" d="M134,147 L172,147" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-hard)"/><rect class="box" x="180" y="124" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="230" y="152" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text><path class="ln" d="M284,147 L322,147" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-hard)"/><rect class="box" x="330" y="124" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="380" y="152" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Carbon</text><path class="ln" d="M434,147 L472,147" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-hard)"/><rect class="box" x="480" y="124" width="100" height="46" rx="8" fill="#f6ead2" stroke="#15803d" stroke-width="2.5"/><text x="530" y="152" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text><path class="ln" d="M584,147 L622,147" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-soft)"/><rect class="box" x="630" y="124" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="680" y="152" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">House</text><text x="30" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Taste fixed at every tap. Resin never meets chlorine, so it lives its full life.</text><text x="30" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Carbon after the softener</text><rect class="box" x="30" y="250" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="80" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Supply</text><path class="ln" d="M134,273 L172,273" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-hard)"/><rect class="box" x="180" y="250" width="100" height="46" rx="8" fill="#f6ead2" stroke="#dc2626" stroke-width="2.5"/><text x="230" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text><path class="ln" d="M284,273 L322,273" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-soft)"/><rect class="box" x="330" y="250" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="380" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Carbon</text><path class="ln" d="M434,273 L472,273" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-soft)"/><rect class="box" x="480" y="250" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="530" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">House</text><text x="30" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Taste fixed at every tap, but the resin is oxidised for its whole service life.</text><text x="30" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Under-sink carbon or RO only</text><rect class="box" x="30" y="376" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="80" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Supply</text><path class="ln" d="M134,399 L172,399" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-hard)"/><rect class="box" x="180" y="376" width="100" height="46" rx="8" fill="#f6ead2" stroke="#dc2626" stroke-width="2.5"/><text x="230" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text><path class="ln" d="M284,399 L322,399" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-soft)"/><rect class="box" x="330" y="376" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="380" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">House</text><path class="ln" d="M434,399 L472,399" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-soft)"/><rect class="box" x="480" y="376" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="530" y="396" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Under-sink</text><text x="530" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">carbon / RO</text><path class="ln" d="M584,399 L622,399" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cp-soft)"/><rect class="box" x="630" y="376" width="100" height="46" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="680" y="396" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Kitchen</text><text x="680" y="413" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">tap</text><text x="30" y="448" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fixes drinking water at one tap. Does nothing for the resin.</text><rect x="30" y="477" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated</text><rect x="150" y="477" width="26" height="6" rx="3" fill="#0e7490"/><text x="184" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened</text><rect x="270" y="477" width="26" height="6" rx="3" fill="#15803d"/><text x="304" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin protected</text><rect x="430" y="477" width="26" height="6" rx="3" fill="#dc2626"/><text x="464" y="485" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin exposed to chlorine</text>
</svg>
