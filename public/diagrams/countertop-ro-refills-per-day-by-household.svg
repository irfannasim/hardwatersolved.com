<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="crf-title crf-desc">
<title id="crf-title">Countertop reverse osmosis refills per day by household drinking volume</title>
<desc id="crf-desc">Illustrative bar chart of how many times a day a countertop reverse osmosis system needs filling: the AquaTru Classic with a 0.5 gallon clean-water tank needs 1, 2 or 4 fills a day at 0.5, 1 and 2 gallons of daily use, the APEC ROCT-PLUS, whose 5 liter tap-water tank yields about 1 gallon of treated water per fill at its 3:1 ratio, about 0.5, 1 or 2.</desc>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0b2f4a">How often you refill a countertop RO unit</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Illustrative daily drinking and cooking volumes; tank sizes and ratios from the makers</text>
<rect x="30" y="78" width="14" height="14" fill="#0e7490"/>
<text x="52" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">AquaTru Classic (0.5 gal clean tank)</text>
<rect x="320" y="78" width="14" height="14" fill="#3a5a72"/>
<text x="342" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">APEC ROCT-PLUS (5 L tap tank, about 1 gal treated)</text>

<text x="30" y="132" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">One adult</text>
<text x="30" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">0.5 gal a day</text>
<rect x="250" y="122" width="110" height="24" fill="#0e7490"/>
<text x="368" y="139" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">1 fill a day</text>
<rect x="250" y="154" width="55" height="24" fill="#3a5a72"/>
<text x="313" y="171" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 0.5</text>

<text x="30" y="232" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Couple</text>
<text x="30" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">1 gal a day</text>
<rect x="250" y="222" width="220" height="24" fill="#0e7490"/>
<text x="478" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">2 fills a day</text>
<rect x="250" y="254" width="110" height="24" fill="#3a5a72"/>
<text x="368" y="271" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 1</text>

<text x="30" y="332" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Family of four</text>
<text x="30" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">2 gal a day</text>
<rect x="250" y="322" width="440" height="24" fill="#0e7490"/>
<text x="680" y="339" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#ffffff">4 fills a day</text>
<rect x="250" y="354" width="220" height="24" fill="#3a5a72"/>
<text x="478" y="371" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">about 2</text>

<path class="ln" d="M250,396 L690,396" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="250" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="360" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1</text>
<text x="470" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">2</text>
<text x="580" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">3</text>
<text x="690" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">4</text>
<text x="470" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Fills per day</text>
<rect class="box" x="30" y="450" width="700" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="44" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Fills = daily volume ÷ treated water per fill. ROCT-PLUS: 5 L tap water at 3:1 ≈ 1 gal.</text>
</svg>
