<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 594" width="760" height="594" role="img" aria-labelledby="sdc-title sdc-desc">
<title id="sdc-title">Water softener discharge chloride compared with irrigation and drinking water guidelines</title>
<desc id="sdc-desc">Log-scale bar chart. FAO irrigation guidelines give no restriction below 142 mg/L chloride and severe above 355 mg/L; EPA criteria are 230 mg/L for aquatic life and 250 mg/L for taste. Average softener discharge is about 8,700 mg/L, so reusing it for irrigation would need about 60-fold dilution.</desc>
<defs></defs>
<rect width="760" height="594" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softener discharge chloride vs irrigation and water guidelines</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Chloride in mg/L on a log scale. Discharge figure is a calculated average for one regeneration.</text><line x1="250" y1="92" x2="250" y2="384" stroke="#e2e8f0" stroke-width="1"/><text x="250" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">100</text><line x1="440" y1="92" x2="440" y2="384" stroke="#e2e8f0" stroke-width="1"/><text x="440" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1,000</text><line x1="630" y1="92" x2="630" y2="384" stroke="#e2e8f0" stroke-width="1"/><text x="630" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10,000</text><text x="440" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">mg/L chloride (log scale)</text><text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">FAO irrigation:</text><text x="30" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">no restriction below</text><rect x="250" y="104" width="28.9347854327807" height="26" rx="3" fill="#15803d"/><text x="286.9347854327807" y="123" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">142</text><text x="30" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">EPA aquatic life,</text><text x="30" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">chronic criterion</text><rect x="250" y="162" width="68.72828884334268" height="26" rx="3" fill="#3a5a72"/><text x="326.7282888433427" y="181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#3a5a72">230</text><text x="30" y="232" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">EPA drinking water</text><text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">taste standard</text><rect x="250" y="220" width="75.60860164768712" height="26" rx="3" fill="#3a5a72"/><text x="333.6086016476871" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#3a5a72">250</text><text x="30" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">FAO irrigation:</text><text x="30" y="308" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">severe above</text><rect x="250" y="278" width="104.54338708046788" height="26" rx="3" fill="#dc2626"/><text x="362.5433870804679" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">355</text><text x="30" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softener discharge,</text><text x="30" y="366" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">average of one cycle</text><rect x="250" y="336" width="368.5086579975375" height="26" rx="3" fill="#7c3aed"/><text x="626.5086579975375" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#7c3aed">about 8,700</text><text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Dilution needed to reach FAO's no-restriction chloride level</text><text x="30" y="500" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">One regeneration</text><rect x="190" y="487" width="7" height="20" rx="2" fill="#7c3aed"/><text x="205" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">50 gal of discharge</text><text x="30" y="536" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fresh water to add</text><rect x="190" y="523" width="430" height="20" rx="2" fill="#0e7490"/><text x="628" y="538" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">about 3,000 gal</text><text x="30" y="572" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">About a 60-fold dilution, and the salt still stays in the soil.</text>
</svg>
