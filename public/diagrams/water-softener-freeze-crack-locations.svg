<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="fz-title fz-desc">
<title id="fz-title">Where freeze cracks hide on a frozen water softener</title>
<desc id="fz-desc">Cutaway diagram of a water softener marking where freeze cracks hide: control valve body, bypass valve, tank neck threads, distributor tube, resin tank shell, drain fitting, brine line and brine valve, and the resin itself.</desc>
<defs><marker id="fz-drain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="fz-tdrain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="fz-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where freeze cracks hide on a water softener</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Check each with a flashlight and a dry paper towel, before and during the pressure test.</text><path class="ln" d="M36,156 L90,156" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M36,176 L90,176" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">in / out</text><rect x="90" y="146" width="40" height="40" rx="5" fill="#94a3b8" stroke="#3a5a72" stroke-width="1.5"/><rect x="130" y="136" width="130" height="50" rx="7" fill="#0b2f4a"/><rect x="180" y="186" width="30" height="28" fill="#3a5a72"/><rect x="150" y="214" width="90" height="330" rx="26" fill="url(#fz-beads)" stroke="#3a5a72" stroke-width="2.5"/><rect x="190" y="200" width="10" height="330" fill="#94a3b8"/><rect x="260" y="144" width="14" height="12" fill="#1f2937"/><path class="ln" d="M274,150 L346,150" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fz-drain)"/><text x="350" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">drain</text><path class="ln" d="M260,176 L320,176 L320,380" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="380" width="80" height="164" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="320" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">brine</text><text x="320" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tank</text><circle cx="195" cy="161" r="11" fill="#dc2626"/><text x="195" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="110" cy="166" r="11" fill="#dc2626"/><text x="110" y="171" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="226" cy="200" r="11" fill="#dc2626"/><text x="226" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="195" cy="360" r="11" fill="#dc2626"/><text x="195" y="365" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><circle cx="240" cy="470" r="11" fill="#dc2626"/><text x="240" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><circle cx="300" cy="126" r="11" fill="#dc2626"/><text x="300" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><circle cx="340" cy="300" r="11" fill="#dc2626"/><text x="340" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><circle cx="170" cy="430" r="11" fill="#dc2626"/><text x="170" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text><circle cx="412" cy="115" r="11" fill="#dc2626"/><text x="412" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="432" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Control valve body</text><text x="432" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Under line pressure, or in one regen step</text><circle cx="412" cy="169" r="11" fill="#dc2626"/><text x="412" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="432" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Bypass valve</text><text x="432" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Weeps, or the handle turns but won't seal</text><circle cx="412" cy="223" r="11" fill="#dc2626"/><text x="412" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="432" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Tank neck threads</text><text x="432" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Water tracks down the tank within minutes</text><circle cx="412" cy="277" r="11" fill="#dc2626"/><text x="412" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="432" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Distributor tube</text><text x="432" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Invisible; hard water or resin, days later</text><circle cx="412" cy="331" r="11" fill="#dc2626"/><text x="412" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="432" y="336" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Resin tank shell</text><text x="432" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Bulge, seam split or weep; usually obvious</text><circle cx="412" cy="385" r="11" fill="#dc2626"/><text x="412" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><text x="432" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Drain fitting and flow control</text><text x="432" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Leak or spray at drain elbow in backwash</text><circle cx="412" cy="439" r="11" fill="#dc2626"/><text x="412" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text><text x="432" y="444" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine line and brine valve</text><text x="432" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Cracks show during brine draw or refill</text><circle cx="412" cy="493" r="11" fill="#dc2626"/><text x="412" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text><text x="432" y="498" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Resin</text><text x="432" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Fines, pressure drop; shows weeks later</text><text x="30" y="580" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Brine tank itself: not pressurised, and saturated brine freezes lower. Its brine line and</text><text x="30" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine valve can still hold plain refill water.</text>
</svg>
