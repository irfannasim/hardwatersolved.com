<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="hpo-title hpo-desc">
<title id="hpo-title">Water heater plumbed before versus after the softener</title>
<desc id="hpo-desc">Plumbing diagram comparing a water heater teed off before the softener, which makes hot water hard and cold water soft, with the correct layout where the heater takes its cold feed from the softened side.</desc>
<defs><marker id="hpo-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="hpo-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="570" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water heater before or after the softener?</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Where the heater’s cold feed leaves the main decides whether hot water is ever soft.</text>
<rect class="box" x="30" y="94" width="700" height="200" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="46" y="120" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">Wrong: heater teed off before the softener</text>
<text x="46" y="154" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">main in</text>
<path class="ln" d="M46,166 L326,166" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hpo-h)"/>
<rect class="box" x="330" y="144" width="100" height="44" rx="8" fill="#0b2f4a"/>
<text x="380" y="171" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text>
<path class="ln" d="M434,166 L582,166" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hpo-s)"/>
<path class="ln" d="M200,170 L200,214" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hpo-h)"/>
<rect class="box" x="150" y="218" width="100" height="52" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="200" y="241" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water</text>
<text x="200" y="257" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">heater</text>
<path class="ln" d="M254,244 L582,244" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hpo-h)"/>
<text x="214" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">tee is upstream of</text>
<text x="214" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">the softener inlet</text>
<rect class="box" x="588" y="143" width="128" height="46" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="600" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Cold taps</text>
<text x="600" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">soft</text>
<rect class="box" x="588" y="221" width="128" height="46" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="600" y="241" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hot taps</text>
<text x="600" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">hard for good</text>
<rect class="box" x="30" y="308" width="700" height="200" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
<text x="46" y="334" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#15803d">Correct: heater fed from the softened side</text>
<text x="46" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">main in</text>
<path class="ln" d="M46,380 L226,380" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hpo-h)"/>
<rect class="box" x="230" y="358" width="100" height="44" rx="8" fill="#0b2f4a"/>
<text x="280" y="385" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text>
<path class="ln" d="M334,380 L582,380" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hpo-s)"/>
<path class="ln" d="M470,384 L470,428" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hpo-s)"/>
<rect class="box" x="420" y="432" width="100" height="52" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="470" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water</text>
<text x="470" y="471" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">heater</text>
<path class="ln" d="M524,458 L582,458" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hpo-s)"/>
<text x="484" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">tee after the</text>
<text x="484" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">softener outlet</text>
<rect class="box" x="588" y="357" width="128" height="46" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="600" y="377" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Cold taps</text>
<text x="600" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">soft</text>
<rect class="box" x="588" y="435" width="128" height="46" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="600" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hot taps</text>
<text x="600" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">soft</text>
<text x="46" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Scale protection for the</text>
<text x="46" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">heater is the largest single</text>
<text x="46" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">financial benefit of a softener.</text>
<text x="30" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">To check: follow the cold inlet at the top of the heater back to where it joins the main.</text>
<rect x="30" y="548" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard (untreated)</text>
<rect x="200" y="548" width="26" height="6" rx="3" fill="#0e7490"/><text x="234" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened</text>
</svg>
