<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="bs-title bs-desc">
<title id="bs-title">Black specks in water after a softener: three types compared</title>
<desc id="bs-desc">Illustrated comparison of black specks in water after a softener: manganese oxide is irregular grit that smears, resin fragments are round amber beads that spring back, and rubber seal debris is flat matte flakes that arrive in bursts after regeneration.</desc>
<defs></defs>
<rect width="760" height="480" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Black specks: three sources, three shapes</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Catch a sample on a strainer or coffee filter, then compare. Timing is the strongest clue.</text><text x="140" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Manganese oxide</text><circle cx="140" cy="205" r="72" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="140" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Irregular grit and dust</text><text x="140" y="327" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Crushes to a black smear</text><text x="140" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Stains tissue brown-black</text><rect class="box" x="35" y="372" width="210" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="140" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Timing: continuous,</text><text x="140" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">worse at first draw</text><text x="380" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Resin fragments</text><circle cx="380" cy="205" r="72" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="380" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Round or half-round beads</text><text x="380" y="327" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Amber or dark honey edges</text><text x="380" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Deforms, then springs back</text><rect class="box" x="275" y="372" width="210" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="380" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Timing: continuous,</text><text x="380" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">increasing over months</text><text x="620" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Rubber seal debris</text><circle cx="620" cy="205" r="72" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="620" y="306" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Flat flakes, varied sizes</text><text x="620" y="327" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Opaque, matte, no shine</text><text x="620" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Squashes but stays whole</text><rect class="box" x="515" y="372" width="210" height="52" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="620" y="393" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Timing: bursts after</text><text x="620" y="411" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">each regeneration</text><ellipse cx="112" cy="222" rx="34" ry="14" fill="#3f2a1d" opacity="0.28" transform="rotate(-18 112 222)"/><polygon points="113,178 116.5,173 123,175 121.5,183 115.5,182" fill="#1c1917"/><polygon points="147,190 149.1,187 153,188.2 152.1,193 148.5,192.4" fill="#1c1917"/><polygon points="161,222 163.8,218 169,219.6 167.8,226 163,225.2" fill="#1c1917"/><polygon points="129.5,238 131.25,235.5 134.5,236.5 133.75,240.5 130.75,240" fill="#1c1917"/><polygon points="96.5,196 98.95,192.5 103.5,193.9 102.45,199.5 98.25,198.8" fill="#1c1917"/><polygon points="169.5,172 171.25,169.5 174.5,170.5 173.75,174.5 170.75,174" fill="#1c1917"/><polygon points="138,208 139.4,206 142,206.8 141.4,210 139,209.6" fill="#1c1917"/><polygon points="93.5,240 95.25,237.5 98.5,238.5 97.75,242.5 94.75,242" fill="#1c1917"/><polygon points="147,250 149.1,247 153,248.2 152.1,253 148.5,252.4" fill="#1c1917"/><polygon points="176,200 177.4,198 180,198.8 179.4,202 177,201.6" fill="#1c1917"/><circle cx="352" cy="180" r="9" fill="#e2b865" stroke="#78350f" stroke-width="1.5"/><circle cx="392" cy="172" r="9" fill="#c8913a" stroke="#78350f" stroke-width="1.5"/><circle cx="420" cy="204" r="9" fill="#b7791f" stroke="#78350f" stroke-width="1.5"/><circle cx="360" cy="224" r="9" fill="#8a5a1c" stroke="#78350f" stroke-width="1.5"/><circle cx="398" cy="238" r="9" fill="#c8913a" stroke="#78350f" stroke-width="1.5"/><path d="M340,256 a9,9 0 0 1 18,0 z" fill="#a16207" stroke="#78350f" stroke-width="1.5"/><path d="M404,200 a9,9 0 0 1 18,0 z" fill="#8a5a1c" stroke="#78350f" stroke-width="1.5"/><path d="M370,200 a8,8 0 0 0 16,0 z" fill="#b7791f" stroke="#78350f" stroke-width="1.5"/><path d="M586,176 q14,-8 28,-2 l-3,7 q-12,-4 -24,2 z" fill="#111827"/><path d="M630,196 q18,4 26,16 l-7,3 q-8,-10 -21,-13 z" fill="#111827"/><path d="M590,226 q10,-10 24,-8 l0,7 q-12,-1 -20,7 z" fill="#111827"/><path d="M632,242 q12,6 10,14 l-6,0 q0,-6 -8,-10 z" fill="#111827"/><path d="M604,200 l14,-3 l1,6 l-14,3 z" fill="#111827"/><path d="M656,176 q6,6 4,14 l-5,-1 q1,-6 -3,-10 z" fill="#111827"/><text x="380" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Two hours in white vinegar: manganese fades; resin and rubber are unchanged.</text>
</svg>
