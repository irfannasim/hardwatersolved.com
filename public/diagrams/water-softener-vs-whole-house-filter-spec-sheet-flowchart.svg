<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="wfs-title wfs-desc">
<title id="wfs-title">Water softener vs whole-house filter: spec-sheet identification flowchart</title>
<desc id="wfs-desc">Flowchart for telling a water softener from a whole-house filter by its spec sheet: a brine tank or salt means a softener, capacity in gallons with carbon, KDF or micron media means a filter, and a scale-prevention claim with TAC media and no salt means a salt-free conditioner that leaves hardness in the water.</desc>
<defs><marker id="wfs-m15803d" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="wfs-m52697a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softener or filter? Read the spec sheet, not the name</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Work down the questions. Stop at the first yes.</text><rect class="box" x="30" y="90" width="400" height="76" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">1. Is there a brine tank, or does it use salt</text><text x="46" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">or potassium chloride to regenerate?</text><rect class="box" x="480" y="85" width="250" height="87" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/><text x="494" y="106" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water softener</text><text x="494" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Look for NSF/ANSI 44.</text><text x="494" y="143" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A second carbon tank means</text><text x="494" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">softener plus filter.</text><path class="ln" d="M430,128 L474,128" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wfs-m15803d)"/><text x="452" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Yes</text><path class="ln" d="M230,166 L230,210" fill="none" stroke="#52697a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wfs-m52697a)"/><text x="242" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text><rect class="box" x="30" y="216" width="400" height="76" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">2. Is capacity given in gallons or years, with</text><text x="46" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">carbon, KDF or micron-rated media?</text><rect class="box" x="480" y="211" width="250" height="87" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/><text x="494" y="232" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Whole-house filter</text><text x="494" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Look for NSF/ANSI 42 or 53</text><text x="494" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">with named claims. Hardness</text><text x="494" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">passes straight through.</text><path class="ln" d="M430,254 L474,254" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wfs-m15803d)"/><text x="452" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Yes</text><path class="ln" d="M230,292 L230,336" fill="none" stroke="#52697a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wfs-m52697a)"/><text x="242" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text><rect class="box" x="30" y="342" width="400" height="76" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">3. Does it claim to "prevent scale" with</text><text x="46" y="396" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">TAC or NAC media and no salt?</text><rect class="box" x="480" y="337" width="250" height="87" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="494" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#c2410c">Salt-free conditioner</text><text x="494" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Not a softener. Hardness</text><text x="494" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">stays in the water; test</text><text x="494" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">before and after to see.</text><path class="ln" d="M430,380 L474,380" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wfs-m15803d)"/><text x="452" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Yes</text><path class="ln" d="M230,418 L230,462" fill="none" stroke="#52697a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wfs-m52697a)"/><text x="242" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">No</text><rect class="box" x="30" y="468" width="700" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="46" y="494" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">No to all three: the product is unclear</text><text x="46" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Ask for the manual and the certification listing, and test hardness before and after the unit.</text>
</svg>
