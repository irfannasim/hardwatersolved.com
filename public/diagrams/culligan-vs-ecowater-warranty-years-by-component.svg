<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 622" width="760" height="622" role="img" aria-labelledby="cve-title cve-desc">
<title id="cve-title">Culligan vs EcoWater warranty: years of coverage by part and tier</title>
<desc id="cve-desc">Bar chart comparing warranty length by component. Culligan Aquasential Smart HE: lifetime tank, 10 years valve body and circuit board, 5 years meters and probes. EcoWater Compact and 3700: lifetime tanks, 10 years valve body, 7 years electronics, 5 years other parts. EcoWater 2800 and 1100: lifetime mineral tank and 3 years on other parts. EcoWater 1500: 10-year mineral tank and 1 year on other parts.</desc>
