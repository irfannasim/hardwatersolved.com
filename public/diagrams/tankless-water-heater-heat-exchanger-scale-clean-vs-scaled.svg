<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 542" width="760" height="542" role="img" aria-labelledby="the-title the-desc">
<title id="the-title">Tankless water heater heat exchanger: clean vs scaled passage</title>
<desc id="the-desc">Cross-section of a tankless water heater heat exchanger passage: clean, heat passes straight into the water; scaled, a deposit on the water side insulates the wall, narrows the channel and traps water that flash-boils into noisy steam bubbles.</desc>
<defs><marker id="the-w" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="542" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Scale inside a tankless heat exchanger</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Cross-section of one water passage. Numbers are the five signs, in order.</text><rect class="box" x="30" y="86" width="340" height="300" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="200" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">CLEAN</text><rect x="50" y="132" width="300" height="12" rx="0" fill="#94a3b8" /><rect x="50" y="144" width="300" height="96" rx="0" fill="#dbeafe" /><rect x="50" y="240" width="300" height="14" rx="0" fill="#94a3b8" /><path class="ln" d="M90,192 L320,192" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#the-w)"/><path d="M90,300 C78,284 86,272 90,262 C94,272 102,284 90,300 z" fill="#f97316"/><path d="M160,300 C148,284 156,272 160,262 C164,272 172,284 160,300 z" fill="#f97316"/><path d="M230,300 C218,284 226,272 230,262 C234,272 242,284 230,300 z" fill="#f97316"/><path d="M300,300 C288,284 296,272 300,262 C304,272 312,284 300,300 z" fill="#f97316"/><text x="200" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">burner heat</text><text x="200" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">water passage</text><text x="200" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">full-bore channel</text><text x="200" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">heat passes straight</text><text x="200" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">into the water</text><rect class="box" x="390" y="86" width="340" height="300" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="560" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">SCALED</text><rect x="410" y="132" width="300" height="12" rx="0" fill="#94a3b8" /><rect x="410" y="144" width="300" height="96" rx="0" fill="#dbeafe" /><rect x="410" y="240" width="300" height="14" rx="0" fill="#94a3b8" /><rect x="410" y="144" width="300" height="16" rx="0" fill="#d6d3c4" /><rect x="410" y="208" width="300" height="32" rx="0" fill="#d6d3c4" /><circle cx="460" cy="232" r="5" fill="#ffffff" stroke="#94a3b8"/><circle cx="520" cy="232" r="5" fill="#ffffff" stroke="#94a3b8"/><circle cx="590" cy="232" r="5" fill="#ffffff" stroke="#94a3b8"/><circle cx="650" cy="232" r="5" fill="#ffffff" stroke="#94a3b8"/><path class="ln" d="M450,184 L680,184" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#the-w)"/><path d="M450,300 C438,284 446,272 450,262 C454,272 462,284 450,300 z" fill="#f97316"/><path d="M520,300 C508,284 516,272 520,262 C524,272 532,284 520,300 z" fill="#f97316"/><path d="M590,300 C578,284 586,272 590,262 C594,272 602,284 590,300 z" fill="#f97316"/><path d="M660,300 C648,284 656,272 660,262 C664,272 672,284 660,300 z" fill="#f97316"/><text x="560" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">burner heat</text><circle cx="420" cy="224" r="11" fill="#c2410c"/><text x="420" y="229" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">1</text><circle cx="432" cy="184" r="11" fill="#c2410c"/><text x="432" y="189" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">3</text><circle cx="706" cy="282" r="11" fill="#c2410c"/><text x="706" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">4</text><path class="ln" d="M700,271 L656,238" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Signs 1 and 2: scale on the water side insulates the wall, so time-to-hot grows and low flow swings.</text>
<text x="30" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sign 3: the channel narrows, so hot flow is weaker while cold flow is normal.</text>
<text x="30" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sign 4: water trapped under the scale flash-boils, so the unit pops, crackles or rumbles.</text>
<text x="30" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sign 5, error codes, comes last, when the exchanger is already well coated.</text><rect x="30" y="518" width="26" height="6" rx="3" fill="#d6d3c4"/><text x="64" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">scale</text>
<rect x="180" y="518" width="26" height="6" rx="3" fill="#dbeafe"/><text x="214" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water</text>
<rect x="330" y="518" width="26" height="6" rx="3" fill="#94a3b8"/><text x="364" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">metal wall</text>
</svg>
