<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="g4sl-title g4sl-desc">
<title id="g4sl-title">Why soap won’t lather in hard water: the lime soap reaction</title>
<desc id="g4sl-desc">In soft water, sodium soap stays dissolved and gathers around air to make lather. In hard water, calcium and magnesium ions displace the sodium and form insoluble calcium stearate curd, so soap won’t lather and leaves soap scum.</desc>
<defs><marker id="g4sl-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why soap won’t lather in hard water</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Calcium and magnesium grab the soap’s fatty acid before it can foam.</text><text x="200" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e7490">Soft water</text><rect x="40" y="120" width="320" height="220" rx="14" fill="#dbeafe" opacity="0.7"/><circle cx="200" cy="230" r="42" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/><text x="200" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">air</text><path d="M286.0,233.0 L280.0,227.0 L274.0,233.0 L268.0,227.0 L262.0,233.0 L256.0,227.0 L250.0,233.0" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="294" cy="230" r="7" fill="#0e7490"/><path d="M267.8,283.0 L266.5,274.6 L258.1,275.9 L256.8,267.5 L248.4,268.9 L247.1,260.5 L238.7,261.8" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="276.04759747124507" cy="285.25181371549246" r="7" fill="#0e7490"/><path d="M223.7,312.7 L227.6,305.2 L220.0,301.3 L223.9,293.7 L216.3,289.9 L220.2,282.3 L212.6,278.5" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="229.04759747124507" cy="319.39931253174444" r="7" fill="#0e7490"/><path d="M170.6,310.9 L178.1,307.0 L174.3,299.5 L181.8,295.6 L178.0,288.0 L185.5,284.2 L181.7,276.6" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="170.95240252875496" cy="319.39931253174444" r="7" fill="#0e7490"/><path d="M128.7,278.1 L137.0,279.4 L138.4,271.1 L146.8,272.4 L148.1,264.0 L156.5,265.3 L157.8,257.0" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="123.95240252875494" cy="285.2518137154925" r="7" fill="#0e7490"/><path d="M114.0,227.0 L120.0,233.0 L126.0,227.0 L132.0,233.0 L138.0,227.0 L144.0,233.0 L150.0,227.0" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="106" cy="230" r="7" fill="#0e7490"/><path d="M132.2,177.0 L133.5,185.4 L141.9,184.1 L143.2,192.5 L151.6,191.1 L152.9,199.5 L161.3,198.2" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="123.95240252875494" cy="174.74818628450754" r="7" fill="#0e7490"/><path d="M176.3,147.3 L172.4,154.8 L180.0,158.7 L176.1,166.3 L183.7,170.1 L179.8,177.7 L187.4,181.5" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="170.95240252875493" cy="140.60068746825556" r="7" fill="#0e7490"/><path d="M229.4,149.1 L221.9,153.0 L225.7,160.5 L218.2,164.4 L222.0,172.0 L214.5,175.8 L218.3,183.4" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="229.04759747124504" cy="140.60068746825556" r="7" fill="#0e7490"/><path d="M271.3,181.9 L263.0,180.6 L261.6,188.9 L253.2,187.6 L251.9,196.0 L243.5,194.7 L242.2,203.0" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="276.04759747124507" cy="174.7481862845075" r="7" fill="#0e7490"/><text x="200" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sodium soap stays dissolved</text><text x="200" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">and gathers around air: lather</text><text x="560" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#c2410c">Hard water</text><rect x="400" y="120" width="320" height="220" rx="14" fill="#dbeafe" opacity="0.7"/><path d="M447.4,165.7 L454.3,170.5 L459.2,163.6 L466.1,168.4 L471.0,161.5 L477.9,166.4 L482.8,159.4" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="440" cy="170" r="7" fill="#0e7490"/><path d="M478.4,213.4 L483.3,220.4 L490.2,215.5 L495.1,222.5 L502.0,217.6 L506.9,224.6 L513.9,219.7" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="470" cy="215" r="7" fill="#0e7490"/><circle cx="540" cy="172" r="11" fill="#c2410c"/><text x="540" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Ca</text><path class="ln" d="M526,172 L494,172" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4sl-ah)"/><text x="562" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">Ca²⁺ / Mg²⁺</text><text x="562" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">displace the sodium</text><circle cx="640" cy="222" r="9" fill="#0e7490"/><text x="640" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text><circle cx="680" cy="250" r="9" fill="#0e7490"/><text x="680" y="254" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text><text x="660" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">sodium released</text><path d="M420,332 C430,300 470,296 490,306 C510,288 560,292 575,312 C590,300 612,310 610,332 Z" fill="#a8a29e"/><circle cx="455" cy="315" r="7" fill="#c2410c"/><circle cx="520" cy="305" r="7" fill="#c2410c"/><circle cx="580" cy="318" r="7" fill="#c2410c"/><text x="560" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Calcium stearate: insoluble curd</text><text x="560" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">no foam; settles as grey film (soap scum)</text><path d="M48.0,435.0 L54.0,441.0 L60.0,435.0 L66.0,441.0 L72.0,435.0 L78.0,441.0 L84.0,435.0" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linejoin="round"/><circle cx="40" cy="438" r="7" fill="#0e7490"/><text x="96" y="443" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">soap: fatty acid + sodium</text><circle cx="300" cy="438" r="7" fill="#c2410c"/><text x="314" y="443" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">calcium / magnesium ion</text><rect x="500" y="431" width="26" height="14" rx="3" fill="#a8a29e"/><text x="534" y="443" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">lime soap (soap scum)</text>
</svg>
