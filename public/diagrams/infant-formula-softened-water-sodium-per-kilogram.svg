<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="ifk-title ifk-desc">
<title id="ifk-title">Softened water baby formula: added sodium per kilogram, infant vs adult</title>
<desc id="ifk-desc">Calculated bar chart. An 11 lb baby taking about 0.8 litres of formula a day made with softened water gets about 12.7 mg of added sodium per kilogram of body weight at 10 gpg and 25 mg at 20 gpg. An adult drinking 2 litres gets 2.3 and 4.5 mg per kilogram: about five and a half times less.</desc>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Same tap, very different dose</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Sodium added by the softener, mg per kg of body weight per day. Calculated, illustrative.</text>
<g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="110" font-size="15" font-weight="bold" fill="#0b2f4a">10 gpg hardness removed</text>
<text x="30" y="146" font-size="14" fill="#0b2f4a">Adult, 70 kg</text>
<text x="30" y="164" font-size="13" fill="#52697a">2 L a day: 158 mg</text>
<rect x="220" y="134" width="40" height="26" fill="#0e7490"/>
<text x="268" y="152" font-size="14" font-weight="bold" fill="#0b2f4a">2.3 mg/kg</text>
<text x="30" y="200" font-size="14" fill="#0b2f4a">Baby, 5 kg (11 lb)</text>
<text x="30" y="218" font-size="13" fill="#52697a">0.8 L formula: 63 mg</text>
<rect x="220" y="188" width="220" height="26" fill="#7c3aed"/>
<text x="448" y="206" font-size="14" font-weight="bold" fill="#0b2f4a">12.7 mg/kg</text>
<text x="30" y="266" font-size="15" font-weight="bold" fill="#0b2f4a">20 gpg hardness removed</text>
<text x="30" y="302" font-size="14" fill="#0b2f4a">Adult, 70 kg</text>
<text x="30" y="320" font-size="13" fill="#52697a">2 L a day: 317 mg</text>
<rect x="220" y="290" width="78" height="26" fill="#0e7490"/>
<text x="306" y="308" font-size="14" font-weight="bold" fill="#0b2f4a">4.5 mg/kg</text>
<text x="30" y="356" font-size="14" fill="#0b2f4a">Baby, 5 kg (11 lb)</text>
<text x="30" y="374" font-size="13" fill="#52697a">0.8 L formula: 127 mg</text>
<rect x="220" y="344" width="438" height="26" fill="#7c3aed"/>
<text x="666" y="362" font-size="14" font-weight="bold" fill="#0b2f4a">25 mg/kg</text>
</g>
<path class="ln" d="M220,392 L680,392" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M220,392 L220,400 M395,392 L395,400 M570,392 L570,400" stroke="#0b2f4a" stroke-width="1.5" fill="none"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#52697a" text-anchor="middle">
<text x="220" y="416">0</text>
<text x="395" y="416">10</text>
<text x="570" y="416">20 mg/kg</text>
</g>
<rect class="box" x="30" y="434" width="700" height="70" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="46" y="460" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Adequate Intake for sodium, age 0 to 6 months: 110 mg a day in total (Health Canada, 2019)</text>
<text x="46" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Softened water at 20 gpg adds more than that, on top of the sodium already in the formula.</text>
</svg>
