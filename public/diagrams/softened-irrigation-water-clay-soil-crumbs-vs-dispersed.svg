<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" width="760" height="494" role="img" aria-labelledby="sscd-title sscd-desc">
<title id="sscd-title">Softened irrigation water and clay soil: calcium crumbs vs sodium dispersion</title>
<desc id="sscd-desc">Side-by-side soil cross-section: hard irrigation water keeps clay in calcium-bound crumbs with open pores so water soaks in, while softened water raises the sodium adsorption ratio, disperses the clay plates, forms a crust and makes water pond and run off.</desc>
<defs><marker id="ssA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ssB" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="494" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">What softened irrigation water does to clay soil</text><text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Calcium holds clay in crumbs. Sodium pushes the plates apart and the pores seal.</text><rect class="box" x="30" y="80" width="340" height="345" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="200" y="106" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">Hard irrigation water</text><text x="200" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">calcium and magnesium dominate</text><rect x="50" y="195" width="300" height="140" rx="0" fill="#ede5d8"/><ellipse cx="100" cy="230" rx="36" ry="22" fill="#c9b59a" stroke="#3a5a72" stroke-width="1.2"/><path d="M82,220 l32.4,0" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M82,227 l32.4,3" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M82,234 l32.4,-3" stroke="#0b2f4a" stroke-width="2" fill="none"/><ellipse cx="200" cy="226" rx="36" ry="20" fill="#c9b59a" stroke="#3a5a72" stroke-width="1.2"/><path d="M182,216 l32.4,0" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M182,223 l32.4,3" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M182,230 l32.4,-3" stroke="#0b2f4a" stroke-width="2" fill="none"/><ellipse cx="300" cy="232" rx="34" ry="22" fill="#c9b59a" stroke="#3a5a72" stroke-width="1.2"/><path d="M283,222 l30.6,0" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M283,229 l30.6,3" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M283,236 l30.6,-3" stroke="#0b2f4a" stroke-width="2" fill="none"/><ellipse cx="98" cy="298" rx="34" ry="22" fill="#c9b59a" stroke="#3a5a72" stroke-width="1.2"/><path d="M81,288 l30.6,0" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M81,295 l30.6,3" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M81,302 l30.6,-3" stroke="#0b2f4a" stroke-width="2" fill="none"/><ellipse cx="202" cy="302" rx="36" ry="22" fill="#c9b59a" stroke="#3a5a72" stroke-width="1.2"/><path d="M184,292 l32.4,0" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M184,299 l32.4,3" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M184,306 l32.4,-3" stroke="#0b2f4a" stroke-width="2" fill="none"/><ellipse cx="300" cy="294" rx="34" ry="20" fill="#c9b59a" stroke="#3a5a72" stroke-width="1.2"/><path d="M283,284 l30.6,0" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M283,291 l30.6,3" stroke="#0b2f4a" stroke-width="2" fill="none"/><path d="M283,298 l30.6,-3" stroke="#0b2f4a" stroke-width="2" fill="none"/><path class="ln" d="M150,142 L150,318" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ssA)"/><path class="ln" d="M250,142 L250,318" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ssA)"/><text x="200" y="362" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Crumbs with open pores:</text><text x="200" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">water soaks in</text><text x="200" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">SAR about 0.5 (calculated)</text><rect class="box" x="390" y="80" width="340" height="345" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="560" y="106" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">Softened irrigation water</text><text x="560" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" font-w