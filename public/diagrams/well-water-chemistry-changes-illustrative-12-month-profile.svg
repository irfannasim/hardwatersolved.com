<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 668" width="760" height="668" role="img" aria-labelledby="wcp-title wcp-desc">
<title id="wcp-title">Illustrative 12-month profile of well water chemistry changes against rainfall and water level</title>
<desc id="wcp-desc">Illustrative, not measured: monthly rainfall, depth to water, hardness, iron and pH for one hypothetical private well. Well water chemistry changes with the water table: hardness falls to 13 gpg and pH to 6.6 in spring recharge, then hardness reaches 18 gpg and iron 1.4 ppm in September drawdown.</desc>
