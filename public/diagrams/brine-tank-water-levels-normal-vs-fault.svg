<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="bt-title bt-desc">
<title id="bt-title">Brine tank water levels: normal vs fault</title>
<desc id="bt-desc">Brine tank cross-section showing the normal post-fill water level just above the grid plate, the pre-fill level, fault levels above the salt and at the overflow fitting, the safety float in the brine well, and the overflow tube to a drain.</desc>
<defs><marker id="bt-brine" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="bt-drain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="bt-tbrine" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="bt-tdrain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="bt-salt" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern></defs>
<rect width="760" height="660" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine tank water level: normal vs fault</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Post-fill tank shown. Where the water sits tells you whether anything is wrong.</text><path class="ln" d="M230,128 L230,112 L332,112" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bt-brine)"/><text x="344" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine line to control valve</text><rect x="200" y="150" width="220" height="410" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2.5"/><rect x="202" y="285" width="216" height="240" fill="url(#bt-salt)"/><rect x="202" y="505" width="216" height="53" fill="#bfdbfe" opacity="0.75"/><path d="M202,525 L418,525" stroke="#3a5a72" stroke-width="3"/><path d="M260,525 L260,558 M360,525 L360,558" stroke="#3a5a72" stroke-width="2"/><rect x="215" y="128" width="30" height="430" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><rect x="216" y="505" width="28" height="52" fill="#bfdbfe" opacity="0.75"/><path d="M230,184 L230,492" stroke="#3a5a72" stroke-width="2"/><rect x="221" y="172" width="18" height="14" rx="2" fill="#0b2f4a"/><rect x="220" y="492" width="20" height="22" rx="4" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><rect x="188" y="188" width="14" height="14" fill="#3a5a72"/><path class="ln" d="M188,195 L70,195 L70,560" fill="none" stroke="#78716c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bt-drain)"/><polygon points="54,584 86,584 78,598 62,598" fill="#78716c"/><text x="84" y="578" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">air gap</text><text x="180" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">overflow elbow</text><text x="190" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">float shutoff</text><path class="ln" d="M194,234 L219,184" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">safety float</text><path class="ln" d="M194,468 L218,496" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="532" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">grid plate</text><path class="ln" d="M194,528 L256,526" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">brine well</text><path class="ln" d="M164,356 L213,340" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M202,195 L436,195" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="444" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626"><tspan font-weight="bold">Fault, urgent</tspan></text><text x="444" y="218" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">water at the overflow fitting</text><path class="ln" d="M202,270 L436,270" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="8 5"/><text x="444" y="275" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626"><tspan font-weight="bold">Fault</tspan></text><text x="444" y="293" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">above the salt line, a foot or</text><text x="444" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">more, or rising each week</text><text x="444" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">salt</text><path class="ln" d="M404,396 L436,396" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M202,505 L436,505" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round"/><text x="444" y="454" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#15803d"><tspan font-weight="bold">Post-fill normal</tspan></text><text x="444" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#15803d">a few inches under the salt</text><text x="444" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#15803d">(Fleck: ~1 inch above grid plate)</text><path class="ln" d="M202,548 L436,548" fill="none" stroke="#52697a" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="444" y="553" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a"><tspan font-weight="bold">Pre-fill tank</tspan>: nearly dry between</text><text x="444" y="571" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">cycles; fills ~2 h before regeneration</text><text x="30" y="628" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Overflow tube: falls all the way to a floor drain and ends above it with an air gap.</text><text x="30" y="647" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Measure in the brine well with a flashlight and ruler: salt piled above the water hides the level.</text>
</svg>
