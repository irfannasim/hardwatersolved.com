<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" width="760" height="566" role="img" aria-labelledby="g18rs-title g18rs-desc">
<title id="g18rs-title">Moving a water softener: removal, storage and reinstallation sequence</title>
<desc id="g18rs-desc">Fifteen-step sequence for moving a water softener to a new house: regenerate and disconnect at the old house, keep the resin wet, upright and above freezing in storage, then test, plumb, fill slowly, set the new hardness and regenerate.</desc>
<defs><marker id="g18rsa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="566" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Removing, storing and reinstalling a softener</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The resin must stay wet and above freezing from the day you unplug it to the day you restart.</text>
<rect class="box" x="30" y="92" width="220" height="44" rx="8" fill="#3a5a72" stroke="#3a5a72" stroke-width="1.5"/>
<text x="140" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Old house: remove</text>
<rect class="box" x="30" y="150" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="52" cy="175" r="13" fill="#3a5a72"/>
<text x="52" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="72" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Regenerate day before</text>
<rect class="box" x="30" y="212" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="52" cy="237" r="13" fill="#3a5a72"/>
<text x="52" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="72" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Bypass, shut off, unplug</text>
<rect class="box" x="30" y="274" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="52" cy="299" r="13" fill="#3a5a72"/>
<text x="52" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="72" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Relieve the pressure</text>
<rect class="box" x="30" y="336" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="52" cy="361" r="13" fill="#3a5a72"/>
<text x="52" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="72" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Disconnect, cap ports</text>
<rect class="box" x="30" y="398" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="52" cy="423" r="13" fill="#3a5a72"/>
<text x="52" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="72" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Empty the brine tank</text>
<rect class="box" x="270" y="92" width="220" height="44" rx="8" fill="#52697a" stroke="#52697a" stroke-width="1.5"/>
<text x="380" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">In transit and storage</text>
<rect class="box" x="270" y="150" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="292" cy="175" r="13" fill="#52697a"/>
<text x="292" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="312" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Keep the tank upright</text>
<rect class="box" x="270" y="212" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="292" cy="237" r="13" fill="#52697a"/>
<text x="292" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">7</text>
<text x="312" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Keep the resin wet</text>
<rect class="box" x="270" y="274" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="292" cy="299" r="13" fill="#52697a"/>
<text x="292" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">8</text>
<text x="312" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Store at 36 to 105°F</text>
<rect class="box" x="270" y="336" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="292" cy="361" r="13" fill="#52697a"/>
<text x="292" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">9</text>
<text x="312" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Never let it freeze</text>
<rect class="box" x="270" y="398" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="292" cy="423" r="13" fill="#52697a"/>
<text x="292" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">10</text>
<text x="312" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Protect the valve</text>
<rect class="box" x="510" y="92" width="220" height="44" rx="8" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/>
<text x="620" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">New house: reinstall</text>
<rect class="box" x="510" y="150" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="532" cy="175" r="13" fill="#0e7490"/>
<text x="532" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">11</text>
<text x="552" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Test the new water</text>
<rect class="box" x="510" y="212" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="532" cy="237" r="13" fill="#0e7490"/>
<text x="532" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">12</text>
<text x="552" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Plumb in, with bypass</text>
<rect class="box" x="510" y="274" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="532" cy="299" r="13" fill="#0e7490"/>
<text x="532" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">13</text>
<text x="552" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fill slowly, purge air</text>
<rect class="box" x="510" y="336" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="532" cy="361" r="13" fill="#0e7490"/>
<text x="532" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">14</text>
<text x="552" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Set the new hardness</text>
<rect class="box" x="510" y="398" width="220" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="532" cy="423" r="13" fill="#0e7490"/>
<text x="532" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">15</text>
<text x="552" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Manual regeneration</text>
<rect class="box" x="30" y="474" width="700" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="46" y="502" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Resin that dries out shrinks, and can crack when it re-wets. Resin that freezes</text>
<text x="46" y="526" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">in a wet tank can split the tank. Both turn a free move into a re-bed.</text>
</svg>
