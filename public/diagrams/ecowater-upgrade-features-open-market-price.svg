<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="ewf-title ewf-desc">
<title id="ewf-title">EcoWater water softener cost: what each upgrade feature costs on the open market</title>
<desc id="ewf-desc">Bar chart for EcoWater water softener cost showing the open-market price of each feature a higher EcoWater tier adds: demand metering is standard, Wi-Fi alerts about $130, built-in carbon about $504 and counter-current brining about $672, plus about $499 for automatic leak shutoff, which no EcoWater tier includes.</desc>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">What each EcoWater upgrade costs on its own</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#52697a">Online price of each feature, as a step between two products or bought on its own. Oct 2026.</text>
<path class="ln" d="M340.0,92 L340.0,476" stroke="#3a5a72" stroke-width="2" fill="none"/>
<text x="340.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$0</text>
<path class="ln" d="M385.0,470 L385.0,476" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="385.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$100</text>
<path class="ln" d="M430.0,470 L430.0,476" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="430.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$200</text>
<path class="ln" d="M475.0,470 L475.0,476" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="475.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$300</text>
<path class="ln" d="M520.0,470 L520.0,476" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="520.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$400</text>
<path class="ln" d="M565.0,470 L565.0,476" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="565.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$500</text>
<path class="ln" d="M610.0,470 L610.0,476" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="610.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$600</text>
<path class="ln" d="M655.0,470 L655.0,476" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="655.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$700</text>
<path class="ln" d="M700.0,470 L700.0,476" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="700.0" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$800</text>
<path class="ln" d="M340,470 L700,470" stroke="#3a5a72" stroke-width="2" fill="none"/>
<text x="326" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Demand (metered) control</text>
<text x="326" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">Added at: 1500 Series</text>
<text x="348.0" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">standard</text>
<rect x="340" y="188" width="58.5" height="26" fill="#0e7490"/>
<text x="326" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Wi-Fi alerts</text>
<text x="326" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">Added at: Compact, 3700</text>
<text x="406.5" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">~$130</text>
<rect x="340" y="258" width="226.8" height="26" fill="#0e7490"/>
<text x="326" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Built-in carbon for chlorine</text>
<text x="326" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">Added at: 3700 refiner</text>
<text x="574.8" y="276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">~$504</text>
<rect x="340" y="328" width="302.4" height="26" fill="#0e7490"/>
<text x="326" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Counter-current brining</text>
<text x="326" y="358" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">Added at: 3700 Series</text>
<text x="650.4" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">~$672</text>
<rect x="340" y="398" width="224.6" height="26" fill="#dc2626"/>
<text x="326" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Automatic leak shutoff</text>
<text x="326" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">Not in any EcoWater tier</text>
<text x="572.5" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">~$499</text>
<text x="30" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#52697a">Pairs: AFW 5600SXT metered ($775); GE GXSH35W vs GXSH40V; AFW 48k with and without carbon tank;</text>
<text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#52697a">SoftPro Elite 48k vs AFW 48k 10% resin; Moen Flo shutoff. Illustrative: pairs differ in more than one way.</text>
