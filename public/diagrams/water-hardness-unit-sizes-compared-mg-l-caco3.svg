<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="g4hu-title g4hu-desc">
<title id="g4hu-title">Water hardness units compared in mg/L as calcium carbonate</title>
<desc id="g4hu-desc">Bar comparison of water hardness units in mg/L as calcium carbonate: French degree 10, Clark degree 14.25, grain per gallon 17.12, German degree 17.85 and mmol/L 100.09.</desc>
<defs></defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">How big is each hardness unit?</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">One unit of each, expressed in mg/L as calcium carbonate (CaCO₃).</text><text x="30" y="128" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">French degree (°fH)</text><text x="30" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">10 mg CaCO₃ per litre</text><rect x="250" y="118" width="200" height="22" rx="3" fill="#3a5a72"/><text x="460" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">10</text><text x="30" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Clark degree (°e)</text><text x="30" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">1 grain per imperial gallon</text><rect x="250" y="174" width="285" height="22" rx="3" fill="#3a5a72"/><text x="545" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">14.25</text><text x="30" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Grain per gallon (gpg)</text><text x="30" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">1 grain per US gallon</text><rect x="250" y="230" width="342.40000000000003" height="22" rx="3" fill="#0e7490"/><text x="602.4000000000001" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">17.12</text><text x="30" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">German degree (°dH)</text><text x="30" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">10 mg CaO per litre</text><rect x="250" y="286" width="357" height="22" rx="3" fill="#3a5a72"/><text x="617" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">17.85</text><text x="30" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">mmol/L</text><text x="30" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Ca²⁺ + Mg²⁺</text><rect x="250" y="342" width="400" height="22" rx="3" fill="#3a5a72"/><path d="M520,338 L512,368 M534,338 L526,368" stroke="#ffffff" stroke-width="5"/><text x="660" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">100.09</text><path d="M250,108 L250,384" stroke="#3a5a72" stroke-width="1.5"/><rect class="box" x="30" y="404" width="700" height="84" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">gpg and °dH look alike but are not interchangeable: °dH is based on CaO.</text><text x="46" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A dishwasher set to 18 °dH wants about 320 mg/L, or 18.8 gpg.</text><text x="46" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Clark degrees use the 4.546-litre imperial gallon: 10 Clark degrees = 8.3 US gpg.</text><text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Bar lengths to scale; the mmol/L bar is broken to fit.</text>
</svg>
