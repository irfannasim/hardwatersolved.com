<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 594" width="760" height="594" role="img" aria-labelledby="dca-title dca-desc">
<title id="dca-title">Delivered capacity test: undersized softener vs resin fault</title>
<desc id="dca-desc">Chart of the delivered-capacity test behind the signs a water softener is undersized: house A delivers 25,000 of 26,000 expected grains but regenerates every 2.5 days, while house B delivers only 21,000 of 39,000.</desc>
<defs></defs>
<rect width="760" height="594" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Delivered-capacity test: two houses, same symptom</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Both run out of soft water before regenerating. Grains per cycle, expected vs measured.</text>
<text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Grains per cycle</text>
<text x="90" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<path d="M100,363.3 L700,363.3" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="368.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">10,000</text>
<path d="M100,296.7 L700,296.7" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="301.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">20,000</text>
<path d="M100,230.0 L700,230.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">30,000</text>
<path d="M100,163.3 L700,163.3" stroke="#e2e8f0" stroke-width="1"/>
<text x="90" y="168.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">40,000</text>
<rect class="box" x="148" y="256.7" width="96" height="173.3" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2" stroke-dasharray="6 4"/>
<text x="196" y="280.7" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3a5a72">26,000</text>
<text x="196" y="298.7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">expected</text>
<rect class="box" x="256" y="263.3" width="96" height="166.7" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/>
<text x="304" y="287.3" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">25,000</text>
<text x="304" y="305.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">delivered</text>
<text x="304" y="253.3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e7490">96%</text>
<text x="250" y="454" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House A</text>
<text x="250" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5 people, 20 gpg, 1.0 cu ft</text>
<text x="250" y="500" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">Undersized</text>
<text x="250" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">regenerates every 2.5 days</text>
<rect class="box" x="438" y="170" width="96" height="260" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2" stroke-dasharray="6 4"/>
<text x="486" y="194" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3a5a72">39,000</text>
<text x="486" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">expected</text>
<rect class="box" x="546" y="290" width="96" height="140" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
<text x="594" y="314" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">21,000</text>
<text x="594" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">delivered</text>
<text x="594" y="280" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">54%</text>
<text x="540" y="454" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House B</text>
<text x="540" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4 people, 15 gpg, 1.5 cu ft</text>
<text x="540" y="500" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">Resin or brine fault</text>
<text x="540" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">should last 7.7 days</text>
<path class="ln" d="M100,110 L100,430 L700,430" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Expected = resin volume × about 26,000 grains per cu ft at 9 lb of salt per cu ft.</text>
<text x="30" y="574" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Delivered = gallons until hardness first appears × compensated hardness. Illustrative households.</text>
</svg>
