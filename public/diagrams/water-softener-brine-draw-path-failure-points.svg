<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="bdp-title bdp-desc">
<title id="bdp-title">Water softener not using salt: six failure points on the brine draw path</title>
<desc id="bdp-desc">Diagram of the brine draw path in a water softener that is not using salt: brine leaves the brine tank through the brine well, travels up the brine line to the injector, passes through the resin and out the drain line. Six numbered points show where the draw fails: salt bridge, blocked brine well, air leak, clogged injector, restricted drain and low inlet pressure.</desc>
<defs><marker id="bdp-mc2410c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><pattern id="bdp-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><marker id="bdp-m7c3aed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="bdp-m78716c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="bdp-salt" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where the brine draw fails</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The valve still cycles on schedule, but no brine reaches the resin.</text>
<path class="ln" d="M30,132 L84,132" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bdp-mc2410c)"/>
<text x="30" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">inlet</text>
<rect x="110" y="160" width="120" height="290" rx="24" fill="url(#bdp-beads)" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="90" y="110" width="160" height="50" rx="8" fill="#0b2f4a"/>
<text x="170" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text>
<rect x="250" y="136" width="30" height="22" rx="3" fill="#3a5a72"/>
<text x="265" y="180" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">injector</text>
<path class="ln" d="M170,178 L170,420" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bdp-m7c3aed)"/>
<rect x="192" y="98" width="16" height="12" fill="#3a5a72"/>
<path class="ln" d="M200,98 L200,86 L440,86 L440,440" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bdp-m78716c)"/>
<text x="432" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">to drain</text>
<rect x="300" y="250" width="130" height="200" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="302" y="258" width="126" height="32" fill="url(#bdp-salt)"/>
<rect x="302" y="290" width="126" height="12" fill="#94a3b8"/>
<rect x="302" y="350" width="126" height="98" fill="#dbeafe"/>
<rect x="302" y="432" width="126" height="16" fill="#a8a29e"/>
<rect x="398" y="252" width="20" height="196" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="401" y="330" width="14" height="16" rx="2" fill="#0b2f4a"/>
<text x="316" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">air gap</text>
<path class="ln" d="M408,252 L408,148 L290,148" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bdp-m7c3aed)"/>
<text x="300" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine tank</text>
<circle cx="56" cy="158" r="13" fill="#0b2f4a"/>
<text x="56" y="163" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<circle cx="330" cy="296" r="13" fill="#0b2f4a"/>
<text x="330" y="301" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="350" cy="418" r="13" fill="#0b2f4a"/>
<text x="350" y="423" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="350" cy="130" r="13" fill="#0b2f4a"/>
<text x="350" y="135" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="265" cy="206" r="13" fill="#0b2f4a"/>
<text x="265" y="211" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="458" cy="220" r="13" fill="#0b2f4a"/>
<text x="458" y="225" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<circle cx="504" cy="103" r="13" fill="#0b2f4a"/>
<text x="504" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="526" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Salt bridge</text>
<text x="526" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">a crust with an air gap above the water</text>
<circle cx="504" cy="161" r="13" fill="#0b2f4a"/>
<text x="504" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="526" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Mushing or blocked brine well</text>
<text x="526" y="185" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sludge blocks the openings at its base</text>
<circle cx="504" cy="219" r="13" fill="#0b2f4a"/>
<text x="504" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text>
<text x="526" y="224" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Air leak in the brine line</text>
<text x="526" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">loose nut, cracked tube, missing ferrule</text>
<circle cx="504" cy="277" r="13" fill="#0b2f4a"/>
<text x="504" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text>
<text x="526" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Clogged injector or screen</text>
<text x="526" y="301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sediment, iron or pipe debris</text>
<circle cx="504" cy="335" r="13" fill="#0b2f4a"/>
<text x="504" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text>
<text x="526" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Restricted drain line</text>
<text x="526" y="359" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">kink, blocked flow control, too high</text>
<circle cx="504" cy="393" r="13" fill="#0b2f4a"/>
<text x="504" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text>
<text x="526" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Low inlet pressure</text>
<text x="526" y="417" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">below 20 psi, the Fleck minimum</text>
<text x="30" y="516" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The injector works by suction, so it needs flow to the drain and enough line pressure.</text>
<path class="ln" d="M30,542 L56,542" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="547" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine</text>
<path class="ln" d="M130,542 L156,542" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="164" y="547" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text>
<path class="ln" d="M250,542 L276,542" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="284" y="547" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water in</text>
</svg>
