<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="dbk-title dbk-desc">
<title id="dbk-title">How waste water can be siphoned back into a water softener through a drain with no air gap</title>
<desc id="dbk-desc">Three stage sequence for a water softener drain air gap failure. Stage 1: the drain tube is pushed below the standpipe flood rim. Stage 2: the house drain backs up and waste water covers the tube end. Stage 3: supply pressure drops during regeneration and waste water is drawn back up the tube into the softener.</desc>
<defs><marker id="dbk-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Three ordinary events, one contaminated softener</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">What happens when the drain tube sits below the flood rim instead of above it.</text>
<rect class="box" x="30" y="86" width="226" height="386" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="44" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">1  Gap lost</text>
<text x="44" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">tube pushed below the rim</text>
<rect x="40" y="400" width="206" height="3" fill="#cbd5e1"/>
<rect x="58" y="228" width="44" height="172" rx="10" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="46" y="198" width="68" height="30" rx="5" fill="#0b2f4a"/>
<text x="80" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text>
<rect x="180" y="250" width="40" height="150" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<rect x="182" y="360" width="36" height="38" fill="#d6d3d1"/>
<text x="174" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">rim</text>
<path class="ln" d="M114,212 L150,212 L150,170 L200,170 L200,305" fill="none" stroke="#78716c" stroke-width="5" stroke-linejoin="round"/>
<text x="44" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Still works.</text>
<text x="44" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Nobody notices.</text>
<rect class="box" x="267" y="86" width="226" height="386" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="281" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">2  Drain backs up</text>
<text x="281" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">waste water covers the tube end</text>
<rect x="277" y="400" width="206" height="3" fill="#cbd5e1"/>
<rect x="295" y="228" width="44" height="172" rx="10" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="283" y="198" width="68" height="30" rx="5" fill="#0b2f4a"/>
<text x="317" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text>
<rect x="417" y="250" width="40" height="150" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<rect x="419" y="262" width="36" height="136" fill="#d6d3d1"/>
<text x="411" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">rim</text>
<path class="ln" d="M351,212 L387,212 L387,170 L437,170 L437,305" fill="none" stroke="#78716c" stroke-width="5" stroke-linejoin="round"/>
<text x="281" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">The tube end is</text>
<text x="281" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">now submerged.</text>
<rect class="box" x="504" y="86" width="226" height="386" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="518" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">3  Pressure drops</text>
<text x="518" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">during regeneration: siphon</text>
<rect x="514" y="400" width="206" height="3" fill="#cbd5e1"/>
<rect x="532" y="228" width="44" height="172" rx="10" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="520" y="198" width="68" height="30" rx="5" fill="#0b2f4a"/>
<text x="554" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">VALVE</text>
<rect x="654" y="250" width="40" height="150" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<rect x="656" y="262" width="36" height="136" fill="#d6d3d1"/>
<text x="648" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">rim</text>
<path class="ln" d="M588,212 L624,212 L624,170 L674,170 L674,305" fill="none" stroke="#78716c" stroke-width="5" stroke-linejoin="round"/>
<path class="ln" d="M684,340 L684,276" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#dbk-r)"/>
<path class="ln" d="M664,157 L636,157" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#dbk-r)"/>
<rect x="534" y="230" width="40" height="46" rx="8" fill="#d6d3d1"/>
<text x="518" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#dc2626">Waste water is pulled</text>
<text x="518" y="454" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#dc2626">into the softener.</text>
<rect x="30" y="486" width="16" height="12" fill="#d6d3d1"/>
<text x="54" y="497" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">waste water</text>
<rect class="box" x="30" y="508" width="700" height="40" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="46" y="533" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#15803d">With the tube end 2 in above the rim, stage 2 never reaches it: the worst case is a spill.</text>
</svg>