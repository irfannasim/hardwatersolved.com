<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="ap-title ap-desc">
<title id="ap-title">Purge order for air in water lines after softener service</title>
<desc id="ap-desc">Diagram of the order for purging air from house water lines after water softener service: cold taps from the lowest and nearest to the softener, then outward and upward to the highest and farthest, then the hot taps in the same order.</desc>
<defs><pattern id="ap-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="570" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Purging air after softener service</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Push the air one way: away from the softener, then up and out.</text><polygon points="100,165 290,100 480,165" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><rect x="110" y="165" width="360" height="325" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><rect x="111" y="386" width="358" height="103" fill="#f1f5f9"/><path d="M110,275 L470,275 M110,385 L470,385" stroke="#3a5a72" stroke-width="2"/><path d="M86,385 L110,385 M470,385 L494,385" stroke="#a8a29e" stroke-width="3"/><text x="30" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">UPSTAIRS</text><text x="30" y="325" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">GROUND</text><text x="30" y="341" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">FLOOR</text><text x="30" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">BASEMENT</text><rect x="124" y="420" width="30" height="62" rx="10" fill="url(#ap-beads)" stroke="#3a5a72" stroke-width="1.5"/><rect x="122" y="410" width="34" height="12" rx="3" fill="#0b2f4a"/><rect x="196" y="415" width="36" height="67" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="139" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">softener</text><text x="214" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">water heater</text><path class="ln" d="M139,410 L139,396 L450,396" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M180,396 L180,448 L196,448" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M262,396 L262,186" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M262,290 L450,290" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M262,186 L450,186" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M224,416 L224,404" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt"/><path class="ln" d="M224,404 L450,404" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-dasharray="7 5"/><path class="ln" d="M274,404 L274,194" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5"/><path class="ln" d="M274,298 L450,298" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5"/><path class="ln" d="M274,194 L450,194" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5"/><path class="ln" d="M299,404 L299,462" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5"/><path class="ln" d="M311,396 L311,462" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="281" y="462" width="48" height="24" rx="4" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M354,404 L354,456" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5"/><path class="ln" d="M366,396 L366,456" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="357" y="468" width="6" height="20" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="342" y="456" width="36" height="12" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M439,396 L439,450" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="450" width="14" height="22" rx="2" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="412" y="468" width="26" height="11" rx="5" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="419" y="479" width="12" height="9" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M314,298 L314,351" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5"/><path class="ln" d="M326,290 L326,351" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="317" y="363" width="6" height="20" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="302" y="351" width="36" height="12" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M439,290 L439,345" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="432" y="345" width="14" height="22" rx="2" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="412" y="363" width="26" height="11" rx="5" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="419" y="374" width="12" height="9" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M314,194 L314,241" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5"/><path class="ln" d="M326,186 L326,241" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="317" y="253" width="6" height="20" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><rect x="302" y="241" width="36" height="12" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><path class="ln" d="M404,194 L404,247" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="7 5"/><path class="ln" d="M416,186 L416,247" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="386" y="247" width="48" height="24" rx="4" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><circle cx="305" cy="475" r="11" fill="#0e7490"/><text x="305" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="388" cy="470" r="11" fill="#0e7490"/><text x="388" y="475" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="416" cy="434" r="10" fill="#0e7490"/><text x="416" y="439" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="279" cy="440" r="11" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/><text x="279" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">6</text><circle cx="350" cy="335" r="11" fill="#0e7490"/><text x="350" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><circle cx="452" cy="232" r="11" fill="#0e7490"/><text x="452" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="490" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">COLD LINES FIRST</text><circle cx="502" cy="143" r="11" fill="#0e7490"/><text x="502" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="520" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lowest, nearest cold tap</text><text x="520" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">(laundry tub, utility sink)</text><circle cx="502" cy="191" r="11" fill="#0e7490"/><text x="502" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="520" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Other cold taps, same level,</text><text x="520" y="213" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">moving away from softener</text><circle cx="502" cy="239" r="11" fill="#0e7490"/><text x="502" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="520" y="244" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flush toilets on that level</text><circle cx="502" cy="275" r="11" fill="#0e7490"/><text x="502" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="520" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Up one floor: nearest the</text><text x="520" y="297" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">riser first, then outward</text><circle cx="502" cy="323" r="11" fill="#0e7490"/><text x="502" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="520" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Highest, farthest fixture last</text><text x="490" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">HOT LINES LAST, SAME ORDER</text><circle cx="502" cy="405" r="11" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/><text x="502" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">6</text><text x="520" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lowest, nearest hot tap,</text><text x="520" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">then up and out</text><circle cx="502" cy="453" r="11" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/><text x="502" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">7</text><text x="520" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Run each until smooth and hot</text><text x="490" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Before you start: aerators off,</text><text x="490" y="509" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softener in service, not bypass.</text><path d="M30,546 L56,546" stroke="#0e7490" stroke-width="4"/><text x="64" y="551" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">cold line</text><path d="M160,546 L186,546" stroke="#0e7490" stroke-width="4" stroke-dasharray="7 5"/><text x="194" y="551" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hot line</text><circle cx="290" cy="546" r="8" fill="#0e7490"/><text x="304" y="551" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">cold step</text><circle cx="400" cy="546" r="8" fill="#ffffff" stroke="#0e7490" stroke-width="2.5"/><text x="414" y="551" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hot step</text>
</svg>
