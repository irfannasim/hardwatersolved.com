<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 616" width="760" height="616" role="img" aria-labelledby="wsim-title wsim-desc">
<title id="wsim-title">Water softener installation mistakes matched to the symptoms they cause</title>
<desc id="wsim-desc">Reverse diagnostic matrix for water softener installation mistakes: twelve common errors in rows and the later symptoms in columns, such as still hard water, resin at taps, salty water, a wet floor, bypass leaks, high salt use, brown water, or no sign until failure.</desc>
<defs></defs>
<rect width="760" height="616" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Work backwards: symptom to installation mistake</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Find your symptom column, then read down to the mistakes that cause it.</text><text x="30" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Installation mistake</text><text x="317.5" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Still</text><text x="317.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">hard</text><text x="372.5" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Resin</text><text x="372.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">at taps</text><text x="427.5" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Salty</text><text x="427.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">water</text><text x="482.5" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Wet</text><text x="482.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">floor</text><text x="537.5" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Leak at</text><text x="537.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">bypass</text><text x="592.5" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">High</text><text x="592.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">salt use</text><text x="647.5" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Brown</text><text x="647.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">water</text><text x="702.5" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">No sign</text><text x="702.5" y="121" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">until it</text><text x="702.5" y="138" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">fails</text><rect x="30" y="150" width="700" height="34" fill="#f1f5f9"/><text x="38" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">1</text><text x="64" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Inlet and outlet reversed</text><circle cx="317.5" cy="167" r="8" fill="#0e7490"/><circle cx="372.5" cy="167" r="8" fill="#0e7490"/><text x="38" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">2</text><text x="64" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">No bypass, or bypass half open</text><circle cx="317.5" cy="201" r="8" fill="#0e7490"/><rect x="30" y="218" width="700" height="34" fill="#f1f5f9"/><text x="38" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">3</text><text x="64" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drain pushed into standpipe</text><circle cx="702.5" cy="235" r="8" fill="#dc2626"/><text x="38" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">4</text><text x="64" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drain line too small, long or high</text><circle cx="427.5" cy="269" r="8" fill="#0e7490"/><circle cx="482.5" cy="269" r="8" fill="#0e7490"/><rect x="30" y="286" width="700" height="34" fill="#f1f5f9"/><text x="38" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">5</text><text x="64" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drain line end not secured</text><circle cx="482.5" cy="303" r="8" fill="#0e7490"/><text x="38" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">6</text><text x="64" y="342" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Overflow line missing or uphill</text><circle cx="482.5" cy="337" r="8" fill="#0e7490"/><rect x="30" y="354" width="700" height="34" fill="#f1f5f9"/><text x="38" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">7</text><text x="64" y="376" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Soldering too close to plastic parts</text><circle cx="537.5" cy="371" r="8" fill="#0e7490"/><text x="38" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">8</text><text x="64" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flux, primer or solvent on O-rings</text><circle cx="537.5" cy="405" r="8" fill="#0e7490"/><rect x="30" y="422" width="700" height="34" fill="#f1f5f9"/><text x="38" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">9</text><text x="64" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">No bonding jumper on metal pipe</text><circle cx="702.5" cy="439" r="8" fill="#dc2626"/><text x="38" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">10</text><text x="64" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Outdoor taps on the soft side</text><circle cx="592.5" cy="473" r="8" fill="#0e7490"/><rect x="30" y="490" width="700" height="34" fill="#f1f5f9"/><text x="38" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">11</text><text x="64" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softener ahead of iron or sediment</text><circle cx="317.5" cy="507" r="8" fill="#0e7490"/><circle cx="647.5" cy="507" r="8" fill="#0e7490"/><text x="38" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">12</text><text x="64" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Rushed startup, factory hardness</text><circle cx="317.5" cy="541" r="8" fill="#0e7490"/><circle cx="372.5" cy="541" r="8" fill="#0e7490"/><circle cx="592.5" cy="541" r="8" fill="#0e7490"/><line x1="290" y1="150" x2="290" y2="558" stroke="#cbd5e1" stroke-width="1"/><line x1="345" y1="150" x2="345" y2="558" stroke="#cbd5e1" stroke-width="1"/><line x1="400" y1="150" x2="400" y2="558" stroke="#cbd5e1" stroke-width="1"/><line x1="455" y1="150" x2="455" y2="558" stroke="#cbd5e1" stroke-width="1"/><line x1="510" y1="150" x2="510" y2="558" stroke="#cbd5e1" stroke-width="1"/><line x1="565" y1="150" x2="565" y2="558" stroke="#cbd5e1" stroke-width="1"/><line x1="620" y1="150" x2="620" y2="558" stroke="#cbd5e1" stroke-width="1"/><line x1="675" y1="150" x2="675" y2="558" stroke="#cbd5e1" stroke-width="1"/><line x1="730" y1="150" x2="730" y2="558" stroke="#cbd5e1" stroke-width="1"/><circle cx="42" cy="584" r="7" fill="#dc2626"/><text x="56" y="589" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">No symptom until something else goes wrong: find these by inspecting, not by waiting.</text>
</svg>
