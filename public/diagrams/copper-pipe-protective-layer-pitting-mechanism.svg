<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 432" width="760" height="432" role="img" aria-labelledby="pit-title pit-desc">
<title id="pit-title">Copper pipe pitting: protective layer in balanced vs aggressive water</title>
<desc id="pit-desc">Copper pipe wall cross-section: in balanced water a continuous oxide and carbonate layer gives slow, even corrosion; aggressive acidic water dissolves the layer in patches, and corrosion focuses into a pit that becomes a pinhole leak.</desc>
<defs></defs>
<rect width="760" height="432" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">How aggressive water pits copper pipe</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Cross-section of the pipe wall, water side on top</text><rect class="box" x="30" y="88" width="340" height="290" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><rect x="32" y="100" width="336" height="124" rx="0" fill="#dbeafe" /><text x="200" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">BALANCED WATER</text><text x="200" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">pH and calcium in balance</text><rect x="32" y="224" width="336" height="62" rx="0" fill="#e8b48a" /><text x="120" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">copper pipe wall</text><rect x="32" y="212" width="336" height="12" rx="0" fill="#5b7f95" /><text x="200" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">continuous protective layer:</text><text x="200" y="195" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">copper oxides, carbonates + calcium carbonate</text><text x="200" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Water never touches bare metal</text><text x="200" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">slow, even corrosion</text><rect class="box" x="390" y="88" width="340" height="290" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="392" y="100" width="336" height="124" rx="0" fill="#dbeafe" /><text x="560" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">AGGRESSIVE WATER</text><text x="560" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">acidic, low calcium</text><rect x="392" y="224" width="336" height="62" rx="0" fill="#e8b48a" /><text x="660" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">copper pipe wall</text><rect x="392" y="212" width="118" height="12" rx="0" fill="#5b7f95" /><rect x="546" y="212" width="60" height="12" rx="0" fill="#5b7f95" /><rect x="646" y="212" width="82" height="12" rx="0" fill="#5b7f95" /><path d="M510,212 L546,212 L533,286 L523,286 z" fill="#dbeafe"/><circle cx="528" cy="298" r="4" fill="#60a5fa"/><text x="560" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">layer dissolved in patches:</text><text x="560" y="195" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">bare metal next to protected metal</text><text x="460" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">pit</text><path class="ln" d="M474,257 L514,250" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">potential difference focuses corrosion</text><text x="560" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">pit → pinhole leak</text><text x="380" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Softening removes calcium, one ingredient of the layer: same pH, less protection.</text>
</svg>
