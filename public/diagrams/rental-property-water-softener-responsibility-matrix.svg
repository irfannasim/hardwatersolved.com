<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="rrm-title rrm-desc">
<title id="rrm-title">Water softener in a rental property: responsibility matrix</title>
<desc id="rrm-desc">Matrix of typical responsibilities for a water softener in a rental property: salt, repairs, replacement and move-out, compared for a landlord-supplied softener, a tenant-installed plumbed-in softener and a tenant-owned portable unit.</desc>
<defs></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Who usually handles what depends on who supplied the softener</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Typical defaults only. The lease and your state law decide.</text>
<rect class="box" x="190" y="86" width="180" height="56" rx="6" fill="#f1f5f9" stroke="#0b2f4a" stroke-width="2"/>
<text x="280" y="109" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Landlord</text>
<text x="280" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">supplied it</text>
<rect class="box" x="380" y="86" width="180" height="56" rx="6" fill="#f1f5f9" stroke="#0b2f4a" stroke-width="2"/>
<text x="470" y="109" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Tenant installed it,</text>
<text x="470" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">plumbed in</text>
<rect class="box" x="570" y="86" width="160" height="56" rx="6" fill="#f1f5f9" stroke="#0b2f4a" stroke-width="2"/>
<text x="650" y="109" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Tenant brought a</text>
<text x="650" y="127" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">portable unit</text>
<rect class="box" x="30" y="152" width="150" height="76" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="42" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Salt refills</text>
<rect class="box" x="190" y="152" width="180" height="76" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="280" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Tenant, if the</text>
<text x="280" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">lease says so</text>
<rect class="box" x="380" y="152" width="180" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="470" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Tenant</text>
<rect class="box" x="570" y="152" width="160" height="76" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="650" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Tenant</text>
<rect class="box" x="30" y="236" width="150" height="76" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="42" y="279" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Repairs</text>
<rect class="box" x="190" y="236" width="180" height="76" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="280" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Landlord, as a</text>
<text x="280" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">supplied appliance</text>
<rect class="box" x="380" y="236" width="180" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="470" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Tenant, unless</text>
<text x="470" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">agreed otherwise</text>
<rect class="box" x="570" y="236" width="160" height="76" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="650" y="279" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Tenant</text>
<rect class="box" x="30" y="320" width="150" height="76" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="42" y="363" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Replacement</text>
<rect class="box" x="190" y="320" width="180" height="76" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="280" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Landlord decides</text>
<text x="280" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">and pays</text>
<rect class="box" x="380" y="320" width="180" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="470" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Tenant decides</text>
<text x="470" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">and pays</text>
<rect class="box" x="570" y="320" width="160" height="76" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="650" y="363" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Tenant</text>
<rect class="box" x="30" y="404" width="150" height="76" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="42" y="447" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">At move-out</text>
<rect class="box" x="190" y="404" width="180" height="76" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="280" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Stays with the</text>
<text x="280" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">property</text>
<rect class="box" x="380" y="404" width="180" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="470" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Per written deal;</text>
<text x="470" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">may be a fixture</text>
<rect class="box" x="570" y="404" width="160" height="76" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="650" y="438" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Tenant takes it</text>
<text x="650" y="456" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">away</text>
<text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">The middle column is where disputes start: agree ownership and removal in writing</text>
<text x="30" y="534" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">before a tenant cuts into the plumbing.</text>
</svg>
