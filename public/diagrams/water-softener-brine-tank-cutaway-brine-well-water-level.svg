<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 544" width="760" height="544" role="img" aria-labelledby="btc-title btc-desc">
<title id="btc-title">Water softener brine tank cutaway: brine well, float and hidden water level</title>
<desc id="btc-desc">Water softener brine tank cutaway: a few inches of water sit hidden under a foot or more of salt. A flashlight down the brine well shows the true water level beside the safety float, air check valve and brine line.</desc>
<defs><pattern id="btc-salt" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern></defs>
<rect width="760" height="544" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine tank cutaway: where the water really is</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Post-fill tank between regenerations. Not to scale.</text><rect x="200" y="130" width="270" height="342" rx="10" fill="#ffffff" stroke="#3a5a72" stroke-width="3" /><rect x="203" y="196" width="264" height="272" rx="0" fill="url(#btc-salt)" /><rect x="203" y="400" width="264" height="68" rx="0" fill="#dbeafe" opacity="0.75"/><path d="M203,400 L467,400" stroke="#60a5fa" stroke-width="2"/><path d="M203,442 L420,442 M456,442 L467,442" stroke="#57534e" stroke-width="4" stroke-dasharray="10 5"/><rect x="420" y="122" width="36" height="346" rx="0" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2" /><rect x="416" y="116" width="44" height="10" rx="2" fill="#3a5a72" /><rect x="422" y="400" width="32" height="66" rx="0" fill="#dbeafe" /><path d="M422,400 L454,400" stroke="#60a5fa" stroke-width="2"/><path d="M430,104 L446,104 L454,398 L422,398 z" fill="#fde68a" opacity="0.55"/><rect x="428" y="76" width="20" height="28" rx="3" fill="#0b2f4a" /><path d="M448,126 L448,386" stroke="#94a3b8" stroke-width="2"/><rect x="438" y="386" width="18" height="16" rx="3" fill="#fb923c" /><rect x="425" y="448" width="16" height="16" rx="2" fill="#0b2f4a" /><path class="ln" d="M432,446 L432,160 L560,160" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="560" y="136" width="170" height="50" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="645" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">CONTROL VALVE</text><text x="645" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#fff">brine line flow control</text><text x="482" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#7c3aed">brine line</text><rect x="470" y="296" width="20" height="10" rx="0" fill="#3a5a72" /><text x="470" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">flashlight down the brine well:</text><text x="470" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">shows the true water level</text><path class="ln" d="M494,232 L460,232" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="502" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">brine well (cap lifts off)</text><text x="500" y="305" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">overflow fitting</text><path class="ln" d="M494,394 L458,394" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="502" y="399" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">safety float</text><path class="ln" d="M494,456 L444,456" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="502" y="461" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">air check valve</text><text x="30" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">From the lid you see</text>
<text x="30" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">only the top of the salt</text><path class="ln" d="M120,180 L226,200" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">salt: a foot</text>
<text x="30" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">or more</text><path class="ln" d="M120,294 L196,294" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">water: a few inches</text>
<text x="30" y="407" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">hidden under salt</text><path class="ln" d="M166,394 L196,410" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">grid plate</text>
<text x="30" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">(where fitted)</text><path class="ln" d="M130,446 L196,442" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Fleck 5600SXT start-up: about 1 inch of water above the grid plate.</text><text x="30" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Salt belongs above the water level.</text>
</svg>
