<text x="680" y="398.8" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">$1,387</text>
<text x="680" y="281.3" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">$2,138</text>
