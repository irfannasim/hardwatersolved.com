<text x="190" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">5600SXT</text><text x="190" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1.5 cu ft</text>
<rect x="265" y="347.5" width="70" height="92.5" fill="#3a5a72"/>
<rect x="265" y="291.5" width="70" height="56.1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
