<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="f9c-title f9c-desc">
<title id="f9c-title">Fleck 9100SXT twin tank vs single Fleck 5600SXT: ten-year salt cost</title>
<desc id="f9c-desc">Illustrative bar chart of ten years of salt cost for a Fleck 9100SXT twin-tank softener against single-tank Fleck 5600SXT softeners, for a family of four on 15 gpg water and for six people on 25 gpg water, with salt at $7 per 40 lb bag.</desc>
<rect width="760" height="590" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Fleck 9100SXT vs a single 5600SXT: ten years of salt</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Illustrative: salt only, at $7 per 40 lb bag. Same 6 lb per cu ft salt dose throughout.</text>
<rect x="100" y="88" width="18" height="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Salt over 10 years</text>
<path d="M100,354.3 L720,354.3" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="359.3" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$1,000</text>
<path d="M100,268.6 L720,268.6" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="273.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$2,000</text>
<path d="M100,182.9 L720,182.9" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="187.9" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$3,000</text>
<text x="90" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$0</text>
<rect x="155" y="357.9" width="70" height="82.1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="190" y="347.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">$958</text>
<text x="190" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">5600SXT</text><text x="190" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1.5 cu ft</text>
<rect x="265" y="367.9" width="70" height="72.1" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="300" y="357.9" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">$841</text>
<text x="300" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">9100SXT</text><text x="300" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">2 x 1.5 cu ft</text>
<rect x="425" y="166.2" width="70" height="273.8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="460" y="156.2" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">$3,194</text>
<text x="460" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">5600SXT</text><text x="460" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1.5 cu ft</text>
<rect x="535" y="199.7" width="70" height="240.3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="570" y="189.7" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">$2,804</text>
<text x="570" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">5600SXT</text><text x="570" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">2.0 cu ft</text>
<rect x="645" y="256.7" width="70" height="183.3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="680" y="246.7" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">$2,138</text>
<text x="680" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">9100SXT</text><text x="680" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">2 x 1.5 cu ft</text>
<path class="ln" d="M100,130 L100,440 L720,440" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path d="M380,140 L380,490" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
<text x="245" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">Family of 4, 15 gpg</text>
<text x="570" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">6 people, 25 gpg</text>
<text x="30" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Single tank holds one day of reserve; twin holds about 50 gallons, the regeneration water. Equipment, water, power excluded.</text>
<text x="30" y="568" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">The twin saves about $117 of salt on a typical home, and $666 to $1,056 on a heavy load.</text>
</svg>
