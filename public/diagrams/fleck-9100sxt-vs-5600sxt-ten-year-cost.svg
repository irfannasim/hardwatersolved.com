<text x="460" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">5600SXT</text><text x="460" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1.5 cu ft</text>
