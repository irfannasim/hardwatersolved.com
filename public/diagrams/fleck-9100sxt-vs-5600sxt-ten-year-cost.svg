<text x="300" y="281.5" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">$2,228</text>
<text x="300" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b2f4a">9100SXT</text><text x="300" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">2 x 1.5 cu ft</text>
