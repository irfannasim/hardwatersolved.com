<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="f9c-title f9c-desc">
<title id="f9c-title">Fleck 9100SXT twin tank vs single Fleck 5600SXT: ten-year cost</title>
<desc id="f9c-desc">Illustrative stacked bar chart of ten-year equipment and salt cost for a Fleck 9100SXT twin-tank softener against single-tank Fleck 5600SXT softeners, for a family of four on 15 gpg water and for six people on 25 gpg water.</desc>
<rect width="760" height="590" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Fleck 9100SXT vs a single 5600SXT: ten-year cost</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Illustrative: equipment price plus ten years of salt. Same 6 lb per cu ft salt dose throughout.</text>
<rect x="100" y="88" width="18" height="14" fill="#3a5a72"/><text x="126" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Equipment (AFWFilters price)</text>
<rect x="350" y="88" width="18" height="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="376" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Salt over 10 years at $7 per 40 lb</text>
<path d="M100,373.3 L720,373.3" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="378.3" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$1,000</text>
<path d="M100,306.7 L720,306.7" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="311.7" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$2,000</text>
<path d="M100,240.0 L720,240.0" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="245.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$3,000</text>
<path d="M100,173.3 L720,173.3" stroke="#e2e8f0" stroke-width="1"/><text x="90" y="178.3" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$4,000</text>
<text x="90" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$0</text>
<rect x="155" y="388.3" width="70" height="51.7" fill="#3a5a72"/>
<rect x="155" y="324.5" width="70" height="63.9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
