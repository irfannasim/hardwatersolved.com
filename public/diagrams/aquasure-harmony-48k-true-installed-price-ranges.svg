<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="ahp-title ahp-desc">
<title id="ahp-title">Aquasure Harmony 48,000-grain true installed price, DIY and hired</title>
<desc id="ahp-desc">Range chart of the Aquasure Harmony 48,000-grain water softener's true installed price: about $630 in the box, about $750 to $850 installed DIY, about $900 to $1,750 hired into an existing loop and about $1,300 to $3,150 with a new loop, drain and outlet, against about $950 to $1,050 DIY for a Fleck 5600SXT system.</desc>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Aquasure Harmony 48k: box price vs installed price</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Illustrative ranges. Brand-store box prices checked 1 October 2026; labor range from Fixr; site extras estimated.</text>
<text x="240" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Aquasure 48k, in the box</text>
<text x="240" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">brand store price</text>
<rect x="250" y="102" width="90.6" height="30" fill="#0e7490"/>
<text x="350" y="123" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">about $630</text>
<text x="240" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Installed yourself</text>
<text x="240" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">salt, fittings, air gap</text>
<rect x="250" y="162" width="107.8" height="30" fill="#0e7490"/>
<rect x="357.8" y="162" width="14.4" height="30" fill="#cffafe" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="382" y="183" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">$750 to $850</text>
<text x="240" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Hired, loop in place</text>
<text x="240" y="251" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">labor $150 to $1,000</text>
<rect x="250" y="222" width="129.4" height="30" fill="#3a5a72"/>
<rect x="379.4" y="222" width="122.2" height="30" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="511" y="243" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#3a5a72">$900 to $1,750</text>
<text x="240" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Hired, new loop,</text>
<text x="240" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">drain run and outlet</text>
<rect x="250" y="282" width="186.9" height="30" fill="#3a5a72"/>
<rect class="box" x="436.9" y="282" width="265.9" height="30" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="569" y="302" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#3a5a72">$1,300 to $3,150</text>
<text x="240" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Fleck 5600SXT 48k,</text>
<text x="240" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">installed yourself</text>
<rect x="250" y="352" width="136.6" height="30" fill="#52697a"/>
<rect x="386.6" y="352" width="14.3" height="30" fill="#f1f5f9" stroke="#52697a" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="411" y="373" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#52697a">$950 to $1,050</text>
<path class="ln" d="M250,404 L710,404" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M250,404 L250,410 M393.75,404 L393.75,410 M537.5,404 L537.5,410 M681.25,404 L681.25,410" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<text x="250" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$0</text>
<text x="393.75" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$1,000</text>
<text x="537.5" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$2,000</text>
<text x="681.25" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$3,000</text>
<text x="30" y="462" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">The box is $200 cheaper than the Fleck system, but the plumbing costs the same for both.</text>
<text x="30" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Dashed segment = the range. Solid segment = the minimum you will pay on that route.</text>
</svg>
