<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="ra-title ra-desc">
<title id="ra-title">Dishwasher rinse aid: water sheeting vs beading</title>
<desc id="ra-desc">Diagram of dishwasher rinse aid: without it, water beads on the glass and each droplet dries leaving mineral spots; with it, water drains off as a sheet and the glass dries clear.</desc>
<defs><marker id="ra-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="ra-tsoft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="450" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Rinse aid: why water sheets instead of spotting</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The same hard water on the same glass, drying with and without rinse aid.</text><path d="M380,96 L380,396" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">Without rinse aid</text><text x="30" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">while draining</text><rect x="30" y="200" width="320" height="14" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><path d="M52,200 a18,16 0 0 1 36,0 z" fill="#bfdbfe" stroke="#3a5a72" stroke-width="1.5"/><path d="M112,200 a18,16 0 0 1 36,0 z" fill="#bfdbfe" stroke="#3a5a72" stroke-width="1.5"/><path d="M172,200 a18,16 0 0 1 36,0 z" fill="#bfdbfe" stroke="#3a5a72" stroke-width="1.5"/><path d="M232,200 a18,16 0 0 1 36,0 z" fill="#bfdbfe" stroke="#3a5a72" stroke-width="1.5"/><path d="M292,200 a18,16 0 0 1 36,0 z" fill="#bfdbfe" stroke="#3a5a72" stroke-width="1.5"/><text x="30" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">after drying</text><rect x="30" y="290" width="320" height="14" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><ellipse cx="70" cy="288" rx="16" ry="4" fill="none" stroke="#64748b" stroke-width="3"/><ellipse cx="130" cy="288" rx="16" ry="4" fill="none" stroke="#64748b" stroke-width="3"/><ellipse cx="190" cy="288" rx="16" ry="4" fill="none" stroke="#64748b" stroke-width="3"/><ellipse cx="250" cy="288" rx="16" ry="4" fill="none" stroke="#64748b" stroke-width="3"/><ellipse cx="310" cy="288" rx="16" ry="4" fill="none" stroke="#64748b" stroke-width="3"/><text x="30" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water beads and dries in place.</text><text x="30" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Each droplet leaves its mineral</text><text x="30" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">load: spots and drip marks.</text><text x="410" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#15803d">With rinse aid</text><text x="410" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">while draining</text><rect x="410" y="200" width="320" height="14" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><rect x="410" y="193" width="320" height="7" fill="#bfdbfe"/><path class="ln" d="M610,178 L710,178" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ra-soft)"/><text x="606" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0e7490">drains as a sheet</text><text x="410" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">after drying</text><rect x="410" y="290" width="320" height="14" fill="#e0f2fe" stroke="#3a5a72" stroke-width="1.5"/><text x="410" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lower surface tension: the water</text><text x="410" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">drains off before it can dry.</text><text x="410" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">The glass comes out clear.</text><text x="30" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">The reservoir holds enough for 30 to 60 cycles and gives no warning when it runs empty.</text>
</svg>
