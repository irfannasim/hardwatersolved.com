<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" width="760" height="548" role="img" aria-labelledby="banw-title banw-desc">
<title id="banw-title">Best acid neutralizers for well water: starting pH, media and added hardness</title>
<desc id="banw-desc">Bar chart for an example well with 8 gpg of hardness. For starting pH 6.8, 6.5, 6.2 and 6.0 a calcite acid neutralizer adds about 0.8 to 5.3 gpg; at pH 5.7 a calcite and Corosex blend adds 5.3 to 10.6 gpg; at pH 5.3 or lower soda ash adds no hardness but about 210 mg/L of sodium. A right-hand column shows days between softener regenerations.</desc>
<defs></defs>
<rect width="760" height="548" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Starting pH, the media it needs, and the softener load after it</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Example well: 8 gpg raw hardness, alkalinity 20 mg/L, 300 gallons a day. Ceiling values; illustrative.</text>
<text x="30" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Starting pH</text>
<text x="170" y="98" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Hardness reaching the softener (gpg)</text>
<text x="730" y="90" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#52697a">Days between</text>
<text x="730" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#52697a">regenerations*</text>
<text x="30" y="140" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">pH 6.8</text>
<text x="30" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Calcite</text>
<rect x="170" y="130" width="128" height="24" rx="0" fill="#fde8d7" stroke="#c2410c" stroke-width="1.5"/>
<rect x="298" y="130" width="12.8" height="24" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="318.8" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">8.8 gpg</text>
<text x="730" y="147" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0e7490">13.0</text>
<text x="30" y="196" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">pH 6.5</text>
<text x="30" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Calcite</text>
<rect x="170" y="186" width="128" height="24" rx="0" fill="#fde8d7" stroke="#c2410c" stroke-width="1.5"/>
<rect x="298" y="186" width="27.2" height="24" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="333.2" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">9.7 gpg</text>
<text x="730" y="203" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0e7490">11.8</text>
<text x="30" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">pH 6.2</text>
<text x="30" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Calcite</text>
<rect x="170" y="242" width="128" height="24" rx="0" fill="#fde8d7" stroke="#c2410c" stroke-width="1.5"/>
<rect x="298" y="242" width="54.4" height="24" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="360.4" y="259" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">11.4 gpg</text>
<text x="730" y="259" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0e7490">10.1</text>
<text x="30" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">pH 6.0</text>
<text x="30" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Calcite</text>
<rect x="170" y="298" width="128" height="24" rx="0" fill="#fde8d7" stroke="#c2410c" stroke-width="1.5"/>
<rect x="298" y="298" width="84.8" height="24" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="390.8" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">13.3 gpg</text>
<text x="730" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0e7490">8.6</text>
<text x="30" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">pH 5.7</text>
<text x="30" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Calcite + Corosex</text>
<rect x="170" y="354" width="128" height="24" rx="0" fill="#fde8d7" stroke="#c2410c" stroke-width="1.5"/>
<rect x="298" y="354" width="84.8" height="24" rx="0" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<rect x="382.8" y="354" width="84.8" height="24" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="475.6" y="371" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">13.3 to 18.6 gpg</text>
<text x="730" y="371" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0e7490">6.2</text>
<text x="30" y="420" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">pH 5.3</text>
<text x="30" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Soda ash feed</text>
<rect x="170" y="410" width="128" height="24" rx="0" fill="#fde8d7" stroke="#c2410c" stroke-width="1.5"/>
<text x="306" y="427" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">8.0 gpg; adds about 210 mg/L sodium</text>
<text x="730" y="427" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0e7490">14.3</text>
<rect x="30" y="470" width="16" height="16" rx="3" fill="#fde8d7" stroke="#c2410c" stroke-width="1.5"/>
<text x="52" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hardness in the raw well water</text>
<rect x="270" y="470" width="16" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="292" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Added by the neutralizer</text>
<rect x="476" y="470" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="498" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Range, set by the blend</text>
<text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">*1.5 cu ft softener at 9 lb of salt (34,400 grains). Calcite adds up to 2.27 mg/L of hardness per mg/L of</text>
<text x="30" y="530" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">carbon dioxide neutralized; magnesium oxide up to 1.14; soda ash none. Measure after start-up and reset.</text>
</svg>
