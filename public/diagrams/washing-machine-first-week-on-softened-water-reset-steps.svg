<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="wmt-title wmt-desc">
<title id="wmt-title">Resetting a washing machine and laundry in the first week on softened water</title>
<desc id="wmt-desc">Four-step sequence for a washing machine after a water softener is installed: cut the detergent dose, run an empty cleaning cycle, strip wash towels and sheets once, then wash normally, with what happens if the steps are skipped.</desc>
<defs><marker id="wmt-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="460" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">First week on softened water: reset the washer and the laundry</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Do these in order so old residue leaves once, instead of over dozens of loads.</text><rect class="box" x="30" y="100" width="151" height="170" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.6"/><text x="42" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">1. Cut the dose</text><text x="42" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Half the old amount,</text>
<text x="42" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">or the lowest cap</text>
<text x="42" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">line. Before any</text>
<text x="42" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">other step.</text><path class="ln" d="M183,185 L205,185" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmt-a)"/><rect class="box" x="213" y="100" width="151" height="170" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.6"/><text x="225" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">2. Clean washer</text><text x="225" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Empty tub-clean or</text>
<text x="225" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">hottest cycle, per</text>
<text x="225" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the manual. Wipe</text>
<text x="225" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">drawer and gasket.</text><path class="ln" d="M366,185 L388,185" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmt-a)"/><rect class="box" x="396" y="100" width="151" height="170" rx="10" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.6"/><text x="408" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">3. Strip wash once</text><text x="408" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Towels and sheets</text>
<text x="408" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">only. Long hot soak,</text>
<text x="408" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">no fabric softener.</text>
<text x="408" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water turns grey.</text><path class="ln" d="M549,185 L571,185" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wmt-a)"/><rect class="box" x="579" y="100" width="151" height="170" rx="10" fill="#ecfdf5" stroke="#15803d" stroke-width="1.6"/><text x="591" y="128" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">4. Wash as normal</text><text x="591" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">New dose, cooler</text>
<text x="591" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">water is fine. Extra</text>
<text x="591" y="198" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">rinse off once suds</text>
<text x="591" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">stay normal.</text><rect class="box" x="30" y="300" width="700" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.2"/><text x="46" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#c2410c">If you skip steps 1 to 3</text><text x="46" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Old soap curd and detergent in the fabric meet a full hard-water dose in soft water.</text>
<text x="46" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Expect over-sudsing, extra rinse cycles, dull or coated fabric and stiff towels</text>
<text x="46" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">for several weeks while the residue works its way out one load at a time.</text>
</svg>
