<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="g4ib-title g4ib-desc">
<title id="g4ib-title">Iron water sampling trap: brim-full bottle vs headspace air</title>
<desc id="g4ib-desc">Diagram of the iron sampling trap before sizing a softener: a brim-full, capped bottle keeps ferrous iron dissolved, while headspace air oxidises it into ferric hydroxide particles that stick to the bottle, so the dissolved-iron result reads low.</desc>
<defs></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why an iron sample can read low</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Air in the bottle turns dissolved iron into rust particles before the lab tests it.</text><text x="120" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803d">Right way</text><rect x="104" y="108" width="32" height="16" rx="3" fill="#0b2f4a"/><path d="M106,124 L134,124 L134,146 L164,166 L164,320 Q164,334 150,334 L90,334 Q76,334 76,320 L76,166 L106,146 Z" fill="#dbeafe" stroke="#3a5a72" stroke-width="2"/><text x="186" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Tap near the wellhead,</text><text x="186" y="167" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">ahead of the pressure tank</text><text x="186" y="202" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Filled to the brim,</text><text x="186" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">capped at once</text><path class="ln" d="M182,208 L166,200" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Delivered the same day</text><text x="186" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Iron stays dissolved</text><text x="186" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">(ferrous)</text><path class="ln" d="M182,300 L150,300" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">Accurate dissolved-iron result</text><path class="ln" d="M380,96 L380,376" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="480" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#dc2626">Wrong way</text><rect x="464" y="108" width="32" height="16" rx="3" fill="#0b2f4a"/><path d="M466,124 L494,124 L494,146 L524,166 L524,320 Q524,334 510,334 L450,334 Q436,334 436,320 L436,166 L466,146 Z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M438,230 L522,230 L522,320 Q522,332 510,332 L450,332 Q438,332 438,320 Z" fill="#dbeafe"/><circle cx="450" cy="318" r="3.5" fill="#b45309"/><circle cx="468" cy="324" r="3.5" fill="#b45309"/><circle cx="488" cy="320" r="3.5" fill="#b45309"/><circle cx="506" cy="316" r="3.5" fill="#b45309"/><circle cx="458" cy="300" r="3.5" fill="#b45309"/><circle cx="514" cy="290" r="3.5" fill="#b45309"/><circle cx="442" cy="262" r="3.5" fill="#b45309"/><circle cx="518" cy="250" r="3.5" fill="#b45309"/><circle cx="498" cy="326" r="3.5" fill="#b45309"/><text x="546" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Headspace air</text><text x="546" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">(oxygen)</text><path class="ln" d="M542,184 L506,196" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Sits a day</text><text x="546" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Iron turns to ferric</text><text x="546" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hydroxide particles</text><text x="546" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">They settle and stick</text><text x="546" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to the bottle wall</text><path class="ln" d="M542,318 L524,318" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Dissolved-iron test reads low</text><rect class="box" x="30" y="392" width="700" height="84" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Ask the lab for both numbers from the same sample</text><text x="46" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Filtered sample = dissolved iron.   Unfiltered sample = total iron.</text><text x="46" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">The difference is the iron already oxidised: the part a softener cannot handle.</text><circle cx="36" cy="500" r="5" fill="#b45309"/><text x="48" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">ferric hydroxide (rust) particle</text>
</svg>
