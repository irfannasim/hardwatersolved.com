<text x="30" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Timer or control board</text>
<text x="310" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">$420–$670</text>
