<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="g17rl-title g17rl-desc">
<title id="g17rl-title">Water softener repair cost by part, from injector cleaning to resin replacement</title>
<desc id="g17rl-desc">Illustrative installed water softener repair cost for ten repairs, each with its part price at online retail. Most repairs fall between about $150 and $470. A complete control valve at $580 to $880 and resin replacement at $480 to $930 are the two that approach or pass half the price of a $1,500 new softener.</desc>
<rect width="760" height="590" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Water softener repair cost by part</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Part at online retail, and an illustrative installed range with a service call and labour</text>
<text x="30" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">Repair</text>
<text x="310" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#52697a">Installed</text>
<path d="M330,114 L330,478" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="330" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$0</text>
<path d="M427.5,114 L427.5,478" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="427.5" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$250</text>
<path d="M525,114 L525,478" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="525" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$500</text>
<path d="M622.5,114 L622.5,478" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="622.5" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$750</text>
<path d="M720,114 L720,478" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="720" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$1,000</text>
<text x="30" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Injector and screen clean</text>
<text x="310" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">$150–$200</text>
