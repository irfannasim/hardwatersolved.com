<text x="310" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">$580–$880</text>
<rect x="556.2" y="414" width="117.0" height="20" rx="4" fill="#a5d8e2"/>
<rect x="330" y="419" width="146.3" height="10" rx="2" fill="#0b2f4a"/>
<text x="30" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Resin, 1 to 1.5 cu ft</text>
