<rect x="330" y="455" width="175.5" height="10" rx="2" fill="#0b2f4a"/>
<path class="ln" d="M622.5,114 L622.5,478" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="730" y="100" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#c2410c">$750 = half of a $1,500 new softener</text>
<rect x="30" y="520" width="26" height="10" rx="2" fill="#0b2f4a"/>
<text x="64" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Part price at online retail (upper figure)</text>
<rect x="380" y="516" width="26" height="18" rx="4" fill="#a5d8e2"/>
<text x="414" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Illustrative installed range</text>
<text x="30" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Installed = part + $100–$150 service call + $100 an hour. Illustrative, not a quote.</text>
