<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" width="760" height="576" role="img" aria-labelledby="lst-title lst-desc">
<title id="lst-title">Water softener timeline during lead service line replacement</title>
<desc id="lst-desc">Timeline for a water softener during lead service line replacement: bypass before the work and through the first full flush, back in service afterwards, bypass again for full flushes every two weeks for three months, daily five-minute cold runs and filtered drinking water for six months, monthly aerator cleaning, and lead tests at one and six months.</desc>
<defs><marker id="lst-m3a5a72" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="576" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">A water softener through lead service line replacement</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Timings from New Jersey DEP flushing guidance. Your utility’s instructions come first.</text><text x="30" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water softener</text><text x="30" y="186" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Full flush, every cold tap</text><text x="30" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">5-min cold run after 6 h</text><text x="30" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Filtered water to drink</text><text x="30" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Clean aerators</text><text x="30" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Lead test</text><path d="M260,100 L260,410" stroke="#e2e8f0" stroke-width="1"/><path d="M336,100 L336,410" stroke="#e2e8f0" stroke-width="1"/><path d="M412,100 L412,410" stroke="#e2e8f0" stroke-width="1"/><path d="M488,100 L488,410" stroke="#e2e8f0" stroke-width="1"/><path d="M564,100 L564,410" stroke="#e2e8f0" stroke-width="1"/><path d="M640,100 L640,410" stroke="#e2e8f0" stroke-width="1"/><path d="M716,100 L716,410" stroke="#e2e8f0" stroke-width="1"/><rect x="214" y="114" width="55.120000000000005" height="24" rx="4" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/><rect x="271.12" y="114" width="444.88" height="24" rx="4" fill="#0e7490" stroke="#0e7490" stroke-width="1"/><text x="602" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">In service</text><rect x="292.10392609699767" y="110" width="6" height="32" rx="1" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/><rect x="327.2078521939954" y="110" width="6" height="32" rx="1" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/><rect x="362.31177829099306" y="110" width="6" height="32" rx="1" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/><rect x="397.4157043879908" y="110" width="6" height="32" rx="1" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/><rect x="432.51963048498845" y="110" width="6" height="32" rx="1" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/><rect x="467.6235565819861" y="110" width="6" height="32" rx="1" fill="#94a3b8" stroke="#94a3b8" stroke-width="1"/><rect x="254" y="166" width="12" height="24" rx="2" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><rect x="291.10392609699767" y="166" width="8" height="24" rx="2" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><rect x="326.2078521939954" y="166" width="8" height="24" rx="2" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><rect x="361.31177829099306" y="166" width="8" height="24" rx="2" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><rect x="396.4157043879908" y="166" width="8" height="24" rx="2" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><rect x="431.51963048498845" y="166" width="8" height="24" rx="2" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><rect x="466.6235565819861" y="166" width="8" height="24" rx="2" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><text x="498" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">every 2 weeks to 3 months</text><rect x="260" y="218" width="456" height="24" rx="4" fill="#0369a1" stroke="#0369a1" stroke-width="1"/><text x="488" y="235" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Daily, for 6 months</text><rect x="260" y="270" width="456" height="24" rx="4" fill="#15803d" stroke="#15803d" stroke-width="1"/><text x="488" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Certified lead filter, 6 months</text><circle cx="336" cy="338" r="7" fill="#3a5a72"/><circle cx="412" cy="338" r="7" fill="#3a5a72"/><circle cx="488" cy="338" r="7" fill="#3a5a72"/><circle cx="564" cy="338" r="7" fill="#3a5a72"/><circle cx="640" cy="338" r="7" fill="#3a5a72"/><circle cx="716" cy="338" r="7" fill="#3a5a72"/><text x="268" y="343" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">monthly</text><path d="M336,378 L346,390 L336,402 L326,390 z" fill="#dc2626"/><path d="M716,378 L726,390 L716,402 L706,390 z" fill="#dc2626"/><text x="352" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">1 month</text><text x="700" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">6 months</text><path class="ln" d="M214,418 L716,418" stroke="#3a5a72" stroke-width="1.5" fill="none"/><text x="226" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Before</text><text x="264" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Day 0</text><text x="336" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1 mo</text><text x="412" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2 mo</text><text x="488" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3 mo</text><text x="564" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4 mo</text><text x="640" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5 mo</text><text x="716" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6 mo</text><rect class="box" x="30" y="460" width="700" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="46" y="474" width="18" height="14" rx="2" fill="#94a3b8" stroke="#94a3b8" stroke-width="1.5"/><text x="72" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softener in bypass: from before the work until the first flush is done,</text><text x="72" y="504" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and again during each repeat flush.</text><rect x="46" y="516" width="18" height="14" rx="2" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/><text x="72" y="528" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Back in service after the first flush: open slowly, bleed the air,</text><text x="72" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">run a manual regeneration and fit a new prefilter cartridge.</text>
</svg>
