<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" width="760" height="604" role="img" aria-labelledby="bsz-title bsz-desc">
<title id="bsz-title">Brine tank salt level zones: how much salt belongs in a brine tank</title>
<desc id="bsz-desc">Cross-section of a water softener brine tank showing the working band between the one-third and two-thirds lines, at least 6 inches of clear space below the rim, a 2 to 4 inch water line, 3 to 4 inches of salt above the water; refill when the salt drops to the one-third line.</desc>
<defs><pattern id="bsz-s" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f1f5f9"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#b6c2d1"/></pattern><pattern id="bsz-sw" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#dbeafe"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#a5b4c8"/></pattern></defs>
<rect width="760" height="604" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Brine tank salt level: measure from the water line</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Keep salt between one third and two thirds of tank height, 3–4 in above the water.</text><rect x="200" y="110" width="220" height="137" fill="#fef2f2"/><rect x="200" y="247" width="220" height="136" fill="#ecfdf5"/><rect x="200" y="292" width="220" height="201" fill="url(#bsz-s)"/><rect x="200" y="493" width="220" height="27" fill="url(#bsz-sw)"/><path d="M200,493 L420,493" stroke="#2563eb" stroke-width="2.5"/><rect x="216" y="96" width="20" height="422" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><rect x="200" y="110" width="220" height="410" rx="6" fill="none" stroke="#3a5a72" stroke-width="3"/><text x="322" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">KEEP CLEAR</text><text x="322" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">bridging zone if filled</text><rect class="box" x="260" y="268" width="148" height="22" fill="#ecfdf5"/><text x="334" y="284" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">WORKING BAND</text><rect class="box" x="264" y="344" width="140" height="22" fill="#f8fafc"/><text x="334" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">salt lives here</text><path class="ln" d="M420,110 L440,110" fill="none" stroke="#3a5a72" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="115" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Tank rim</text><path class="ln" d="M434,136 L434,221" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">At least 6 in of clear space</text><text x="450" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">below the rim</text><path class="ln" d="M200,247 L440,247" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="450" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Two-thirds line: ceiling</text><text x="450" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">refill to here, never to the rim</text><path class="ln" d="M200,383 L440,383" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="450" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">One-third line: refill trigger</text><path class="ln" d="M434,462 L434,489" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M428,462 L440,462" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="474" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">3–4 in of salt above water (minimum)</text><path class="ln" d="M420,493 L440,507" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="512" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d4ed8">Water line: 2–4 in deep</text><path class="ln" d="M216,140 L180,140" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="172" y="145" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">brine well</text><path class="ln" d="M200,292 L180,292" fill="none" stroke="#0b2f4a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="172" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="end" fill="#0b2f4a">salt level now</text><text x="310" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Floor, grid plate, brine well base</text><rect x="30" y="572" width="26" height="14" fill="url(#bsz-s)" stroke="#94a3b8" stroke-width="1"/><text x="64" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">salt</text><rect x="140" y="572" width="26" height="14" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/><text x="174" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water</text><rect x="260" y="572" width="26" height="14" fill="#ecfdf5" stroke="#94a3b8" stroke-width="1"/><text x="294" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">working band</text><rect x="420" y="572" width="26" height="14" fill="#fef2f2" stroke="#94a3b8" stroke-width="1"/><text x="454" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">keep clear</text>
</svg>
