<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="swp-title swp-desc">
<title id="swp-title">Decision chart: which salt-free water softener setup for well water, by iron, manganese and sulfur test</title>
<desc id="swp-desc">Decision chart for a salt-free water softener on well water: a well already under the media limits suits the Aquasana Rhino well system; iron up to 7, manganese up to 1 and hydrogen sulfide up to 8 ppm suits the SpringWell combo; iron up to 10, manganese up to 2 and sulfide up to 4 ppm suits an AFWFilters AIS10 ahead of FutureSoft; anything beyond needs a softener or specialist treatment.</desc>
<defs><marker id="swp-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="swp-an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Pick a salt-free well setup from the lab test</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Iron (Fe), manganese (Mn) and hydrogen sulfide (H2S) in ppm, at the well. Limits are the makers' own.</text>

<rect class="box" x="30" y="95" width="330" height="70" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="195" y="126" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Fe under 0.3, Mn under 0.05,</text>
<text x="195" y="144" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">no H2S, under 15 gpg?</text>
<rect class="box" x="440" y="89" width="290" height="82" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="585" y="117" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Aquasana Rhino well</text>
<text x="585" y="135" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">with UV and conditioner;</text>
<text x="585" y="153" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">pH must be under 8.3</text>
<path class="ln" d="M360,130 L436,130" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#swp-ag)"/>
<text x="400" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text>
<path class="ln" d="M195,165 L195,201" stroke="#52697a" stroke-width="4" fill="none" marker-end="url(#swp-an)"/>
<text x="207" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#52697a">No</text>

<rect class="box" x="30" y="205" width="330" height="70" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="195" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Fe up to 7, Mn up to 1</text>
<text x="195" y="254" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">and H2S up to 8?</text>
<rect class="box" x="440" y="199" width="290" height="82" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="585" y="227" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">SpringWell WSSF combo</text>
<text x="585" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Air-injection filter, then</text>
<text x="585" y="263" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">FutureSoft conditioner</text>
<path class="ln" d="M360,240 L436,240" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#swp-ag)"/>
<text x="400" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text>
<path class="ln" d="M195,275 L195,311" stroke="#52697a" stroke-width="4" fill="none" marker-end="url(#swp-an)"/>
<text x="207" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#52697a">No</text>

<rect class="box" x="30" y="315" width="330" height="70" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="195" y="346" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Fe up to 10, Mn up to 2</text>
<text x="195" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">and H2S up to 4?</text>
<rect class="box" x="440" y="309" width="290" height="82" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="585" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">AFWFilters AIS10</text>
<text x="585" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">ahead of a FutureSoft,</text>
<text x="585" y="373" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">built as two separate units</text>
<path class="ln" d="M360,350 L436,350" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#swp-ag)"/>
<text x="400" y="338" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Yes</text>
<path class="ln" d="M195,385 L195,421" stroke="#52697a" stroke-width="4" fill="none" marker-end="url(#swp-an)"/>
<text x="207" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#52697a">No</text>

<rect class="box" x="30" y="425" width="700" height="82" rx="8" fill="#f1f5f9" stroke="#52697a" stroke-width="2"/>
<text x="380" y="455" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">No salt-free route: price a softener with iron treatment instead</text>
<text x="380" y="477" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">Beyond both filters' ratings, the pretreatment is the real project</text>

<text x="30" y="538" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">With any filter in front, retest after it: FutureSoft is rated for 0 ppm iron, manganese and H2S.</text>
</svg>
