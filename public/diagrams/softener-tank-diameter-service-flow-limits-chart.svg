<path class="ln" d="M220,136 L220,384 L674,384" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M446.8,134 L446.8,384" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="440.8" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#c2410c">1 bath: 12.6 gpm</text>
<path class="ln" d="M527.8,134 L527.8,384" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<text x="533.8" y="104" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">2.5 baths: 17.1 gpm</text>
<path class="ln" d="M580,134 L580,384" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5"/>
<text x="574" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#3a5a72">Fleck 5600SXT valve alone, 15 psi drop: 20 gpm</text>
<rect x="30" y="455" width="26" height="14" fill="#0e7490"/>
<text x="64" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Continuous flow guideline: 10 gpm per sq ft of bed</text>
<rect x="30" y="479" width="26" height="14" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/>
<text x="64" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Intermittent peak guideline: 15 gpm per sq ft of bed</text>
<text x="30" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Bed area = diameter in inches squared, divided by 183 (WC&amp;P). Residential units are often rated higher</text>
<text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">than these guidelines at a 15 psi drop, trading contact time and pressure for flow.</text>
</svg>
