<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="wsbj-title wsbj-desc">
<title id="wsbj-title">Water softener grounding and bonding: continuity with and without a jumper</title>
<desc id="wsbj-desc">Water softener grounding bonding diagram: the electrode conductor clamps to the metal water pipe near the entry, a softener with a plastic valve breaks the metal path to the house piping, and a bonding jumper clamped on both sides restores it.</desc>
<defs></defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softener in metal pipe: the bond it breaks</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same house in both panels. The plastic valve and bypass are the only change.</text><rect class="box" x="30" y="86" width="700" height="232" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="46" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">SOFTENER CUT IN, NO JUMPER</text><rect x="96" y="134" width="110" height="44" rx="4" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><text x="151" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">service panel</text><path class="ln" d="M151,178 L151,226" fill="none" stroke="#0b2f4a" stroke-width="2.5"/><text x="162" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">electrode conductor</text><rect x="143" y="225" width="16" height="22" rx="2" fill="#0b2f4a"/><rect x="70" y="186" width="10" height="120" fill="#cbd5e1"/><text x="46" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">wall</text><path class="ln" d="M40,236 L300,236" fill="none" stroke="#3a5a72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="210" width="100" height="52" rx="8" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/><text x="350" y="241" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text><text x="350" y="284" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">plastic valve and bypass</text><path class="ln" d="M400,236 L700,236" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 8"/><path class="ln" d="M520,236 L520,270" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M650,236 L650,270" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">water heater</text><text x="650" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">fixtures</text><text x="92" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">metal pipe from street</text><text x="350" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">no metal path here</text><text x="440" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">house piping no longer bonded</text><rect class="box" x="30" y="336" width="700" height="232" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="46" y="362" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">BONDING JUMPER INSTALLED</text><rect x="96" y="384" width="110" height="44" rx="4" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><text x="151" y="411" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">service panel</text><path class="ln" d="M151,428 L151,476" fill="none" stroke="#0b2f4a" stroke-width="2.5"/><text x="162" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">electrode conductor</text><rect x="143" y="475" width="16" height="22" rx="2" fill="#0b2f4a"/><rect x="70" y="436" width="10" height="120" fill="#cbd5e1"/><text x="46" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">wall</text><path class="ln" d="M40,486 L300,486" fill="none" stroke="#3a5a72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="460" width="100" height="52" rx="8" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/><text x="350" y="491" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text><text x="350" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">plastic valve and bypass</text><path class="ln" d="M400,486 L700,486" fill="none" stroke="#3a5a72" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M520,486 L520,520" fill="none" stroke="#3a5a72" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M650,486 L650,520" fill="none" stroke="#3a5a72" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="544" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">water heater</text><text x="650" y="544" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">fixtures</text><text x="92" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">metal pipe from street</text><path class="ln" d="M282,480 L282,428 L418,428 L418,480" fill="none" stroke="#15803d" stroke-width="3"/><rect x="275" y="475" width="14" height="22" rx="2" fill="#15803d"/><rect x="411" y="475" width="14" height="22" rx="2" fill="#15803d"/><text x="350" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">bonding jumper</text><text x="440" y="468" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">house piping bonded again</text><rect x="30" y="590" width="26" height="8" rx="3" fill="#3a5a72"/><text x="64" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">metal pipe, bonded</text><line x1="230" y1="594" x2="256" y2="594" stroke="#dc2626" stroke-width="8" stroke-dasharray="10 5"/><text x="264" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">metal pipe, bond lost</text><rect x="450" y="584" width="12" height="20" rx="2" fill="#0b2f4a"/><text x="470" y="598" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">ground or bonding clamp</text>
</svg>
