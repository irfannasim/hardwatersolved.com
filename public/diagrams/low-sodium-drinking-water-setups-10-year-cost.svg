<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="lsc-title lsc-desc">
<title id="lsc-title">Water softener for low-sodium diets: 10-year cost of each setup</title>
<desc id="lsc-desc">Illustrative 10-year cost of three low-sodium setups for a softened home: an APEC ROES-50 reverse osmosis unit about $681, a Home Master TMAFC about $1,130, a Waterdrop G3P600 about $1,889, and switching the softener to potassium chloride about $5,350 extra over salt.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">10-year cost of keeping sodium out of drinking water</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Illustrative: softened city water, a household using 480 lb of salt a year</text>
<text x="235" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">APEC ROES-50 (RO)</text>
<text x="235" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$231 + about $45 a year filters</text>
<rect x="250" y="106" width="48" height="28" rx="3" fill="#0e7490"/>
<text x="308" y="125" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">$681</text>
<text x="235" y="188" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Home Master TMAFC (RO)</text>
<text x="235" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$330 + $79.95 a year filters</text>
<rect x="250" y="176" width="79" height="28" rx="3" fill="#0e7490"/>
<text x="339" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">$1,130</text>
<text x="235" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Waterdrop G3P600 (RO)</text>
<text x="235" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$439 + about $145 a year filters</text>
<rect x="250" y="246" width="132" height="28" rx="3" fill="#0e7490"/>
<text x="392" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">$1,889</text>
<text x="235" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Potassium chloride</text>
<text x="235" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">extra over salt, about $535 a year</text>
<rect x="250" y="316" width="375" height="28" rx="3" fill="#7c3aed"/>
<text x="635" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">$5,350</text>
<path class="ln" d="M250,375 L670,375" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<path class="ln" d="M250,375 L250,381" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="250" y="399" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$0</text>
<path class="ln" d="M390,375 L390,381" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="390" y="399" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$2,000</text>
<path class="ln" d="M530,375 L530,381" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="530" y="399" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$4,000</text>
<path class="ln" d="M670,375 L670,381" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="670" y="399" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$6,000</text>
<text x="30" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">RO prices from maker stores, filters at the maker's change intervals. Potassium at $43 per 40 lb bag, 20% more</text>
<text x="30" y="451" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">than salt, against salt at $7. A bypass line is a one-off plumbing quote, so it is not charted.</text>
</svg>
