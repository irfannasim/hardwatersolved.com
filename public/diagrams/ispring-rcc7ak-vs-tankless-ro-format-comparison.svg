<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 532" width="760" height="532" role="img" aria-labelledby="rkc-title rkc-desc">
<title id="rkc-title">iSpring RCC7AK tank RO vs Waterdrop G3P600 tankless RO: wait, waste and 5-year cost</title>
<desc id="rkc-desc">Comparison at 3 gallons a day: the iSpring RCC7AK tank system needs 1 to 3 hours to refill and may send about 27,400 gallons to drain in five years if it runs at a typical 5 to 1 ratio, but costs about $650 over five years. The Waterdrop G3P600 has no wait, sends about 2,740 gallons to drain and costs about $1,020.</desc>
<defs><pattern id="rkc-r" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f5f5f4"/><rect width="3" height="8" fill="#a8a29e"/></pattern></defs>
<rect width="760" height="532" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Tank RO or tankless: pick the format first</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">iSpring RCC7AK (tank) vs Waterdrop G3P600 (tankless), 3 gallons a day, 5 years</text><text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#3a5a72">1. Wait after the tank runs dry</text><text x="30" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">RCC7AK</text><rect x="190.0" y="118" width="126.7" height="26" fill="#52697a"/><rect x="316.7" y="118" width="253.3" height="26" fill="url(#rkc-r)" stroke="#52697a" stroke-width="1"/><text x="580" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">1 to 3 hours</text><text x="30" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">G3P600</text><text x="190" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">No tank: makes water while the faucet runs</text><text x="190" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hatched: refill at the NSF-listed 25.41 gpd rather than the 75 gpd rating</text><text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#3a5a72">2. Water sent to drain over 5 years</text><text x="30" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">RCC7AK</text><rect x="190.0" y="264" width="380.0" height="26" fill="url(#rkc-r)" stroke="#78716c" stroke-width="1"/><text x="580" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#78716c">~27,400 gal?</text><text x="30" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">G3P600</text><rect x="190.0" y="300" width="38.0" height="26" fill="#78716c"/><text x="238.0069406392694" y="318" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#78716c">~2,740 gal at its rated 2:1</text><text x="190" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hatched: iSpring publishes no ratio; EPA typical of 5 gal per gallon assumed</text><text x="30" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#3a5a72">3. Five-year cost: purchase plus replacement filters</text><text x="30" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">RCC7AK</text><rect x="190.0" y="410" width="90.2" height="26" fill="#0b2f4a"/><rect x="280.2" y="410" width="152.7" height="26" fill="#0e7490"/><text x="442.9019607843137" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">~$650</text><text x="30" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">G3P600</text><rect x="190.0" y="446" width="163.5" height="26" fill="#0b2f4a"/><rect x="353.5" y="446" width="216.1" height="26" fill="#0e7490"/><text x="580" y="464" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">~$1,020</text><rect x="190" y="496" width="22" height="13" fill="#0b2f4a"/><text x="220" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">purchase price</text><rect x="350" y="496" width="22" height="13" fill="#0e7490"/><text x="380" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">filters, years 2 to 5</text>
</svg>
