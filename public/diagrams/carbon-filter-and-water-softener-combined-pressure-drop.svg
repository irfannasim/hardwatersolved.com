<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="cpd-title cpd-desc">
<title id="cpd-title">Carbon filter and water softener combined pressure drop worksheet (illustrative)</title>
<desc id="cpd-desc">Illustrative waterfall of pressure drop for a carbon filter and water softener together at 8 gpm: 55 psi at the entry falls to 15 psi at an upstairs shower with a loaded sediment cartridge, or 23 psi with a fresh one, against a 20 psi floor.</desc>
<defs></defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Combined pressure drop: where 55 psi goes</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Worked example at an 8 gpm peak, from the house entry to an upstairs shower (illustrative).</text><path d="M90,440 L730,440" stroke="#0b2f4a" stroke-width="1.5"/><text x="80" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text><path d="M90,385 L730,385" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">10</text><path d="M90,330 L730,330" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">20</text><path d="M90,275 L730,275" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">30</text><path d="M90,220 L730,220" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="225" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">40</text><path d="M90,165 L730,165" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">50</text><path d="M90,110 L730,110" stroke="#e2e8f0" stroke-width="1"/><text x="80" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">60</text><text x="90" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">psi while water is flowing</text><text x="135.7" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Entry</text><text x="135.7" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">flowing</text><text x="227.1" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text><text x="227.1" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">cartridge</text><text x="318.6" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Carbon</text><text x="318.6" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tank</text><text x="410" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text><text x="501.4" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pipes and</text><text x="501.4" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">fittings</text><text x="592.9" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Up 20 ft</text><text x="592.9" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">to shower</text><text x="684.3" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">At the</text><text x="684.3" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">shower</text><rect x="107.7" y="137.5" width="56" height="302.5" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/><text x="135.7" y="129.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">55</text><rect x="199.1" y="137.5" width="56" height="11" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/><rect x="199.1" y="148.5" width="56" height="44" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="227.1" y="210.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">−10</text><text x="227.1" y="228.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">(2 when new)</text><rect x="290.6" y="192.5" width="56" height="52.8" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/><text x="318.6" y="263.3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−9.6</text><rect x="382" y="245.3" width="56" height="36.8" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/><text x="410" y="300.2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−6.7</text><rect x="473.4" y="282.2" width="56" height="27.5" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/><text x="501.4" y="274.2" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−5</text><rect x="564.9" y="309.7" width="56" height="47.9" fill="#e2e8f0" stroke="#3a5a72" stroke-width="1.5"/><text x="592.9" y="375.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−8.7</text><rect x="656.3" y="313.5" width="56" height="126.5" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4"/><rect x="662.3" y="357.5" width="44" height="82.5" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><path d="M167.7,330 L730,330" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><text x="199.1" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Worksheet floor: 20 psi at the worst fixture</text><text x="712.3" y="287.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#15803d">23 psi with a</text><text x="712.3" y="304.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#15803d">fresh cartridge</text><text x="684.3" y="375.5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">15</text><text x="30" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">The same house passes with a fresh sediment cartridge and fails with a loaded one.</text><text x="30" y="536" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Drops scaled to 8 gpm from each unit’s rated drop: sediment 2 psi new, 10 psi loaded;</text><text x="30" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">carbon rated 15 psi at 10 gpm; softener rated 15 psi at 12 gpm; 0.433 psi per foot of rise.</text><text x="30" y="578" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative figures. Use your own gauge readings and spec sheets.</text>
</svg>
