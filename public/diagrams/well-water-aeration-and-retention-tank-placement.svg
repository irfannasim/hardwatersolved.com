<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="wart-title wart-desc">
<title id="wart-title">Well water aeration tank and chlorination retention tank placement in the treatment order</title>
<desc id="wart-desc">Two well water layouts: an open aeration tank vents hydrogen sulfide, radon and carbon dioxide and needs a booster pump before the pressure tank; a chlorine feed pump injects before the pressure tank, then a retention tank gives about 20 minutes of contact before the iron filter, carbon filter and softener.</desc>
<defs><marker id="wart-mc2410c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="wart-m0e7490" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="wart-m0b2f4a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="wart-mdc2626" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="wart-m15803d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="wart-m52697a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="wart-m78716c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><marker id="wart-mb45309" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="wart-m3a5a72" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="36" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Aeration and the retention tank: where each one goes</text>
<text x="30" y="58" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The two stages that sit around the pressure tank, which most sequences leave out</text>
<text x="30" y="96" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Option A: open aeration tank</text>
<rect class="box" x="30" y="150" width="120" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="90" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Well pump</text>
<rect class="box" x="175" y="150" width="120" height="50" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="235" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Aeration tank</text>
<text x="235" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">open, vented</text>
<rect class="box" x="320" y="150" width="120" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="380" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Booster pump</text>
<rect class="box" x="465" y="150" width="120" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="525" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pressure tank</text>
<rect class="box" x="610" y="150" width="120" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="670" y="172" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Rest of the</text>
<text x="670" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">train</text>
<path class="ln" d="M153,175 L166,175" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<path class="ln" d="M298,175 L311,175" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<path class="ln" d="M443,175 L456,175" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<path class="ln" d="M588,175 L601,175" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<path class="ln" d="M235,146 L235,120" fill="none" stroke="#78716c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-m78716c)"/>
<text x="250" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#78716c">vented to air: H₂S, radon, CO₂</text>
<text x="235" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Pressure drops to zero</text>
<text x="235" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">here, so it must come</text>
<text x="235" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">before the pressure tank</text>
<text x="380" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">A second pump</text>
<text x="380" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">repressurizes</text>
<text x="380" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">the house supply</text>
<text x="620" y="226" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Not the same as an</text>
<text x="620" y="243" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">air-injection iron filter,</text>
<text x="620" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">which stays pressurized</text>
<text x="30" y="318" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Option B: chemical feed and retention tank</text>
<rect class="box" x="30" y="420" width="96" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="78" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Well pump</text>
<rect class="box" x="151" y="420" width="96" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="199" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pressure</text>
<text x="199" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">tank</text>
<rect class="box" x="272" y="420" width="96" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="320" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Retention</text>
<text x="320" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">tank</text>
<rect class="box" x="393" y="420" width="96" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="441" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron filter</text>
<rect class="box" x="514" y="420" width="96" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="562" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Carbon</text>
<text x="562" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">filter</text>
<rect class="box" x="635" y="420" width="96" height="50" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="683" y="450" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text>
<path class="ln" d="M129,445 L142,445" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<path class="ln" d="M250,445 L263,445" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<path class="ln" d="M371,445 L384,445" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<path class="ln" d="M492,445 L505,445" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<path class="ln" d="M613,445 L626,445" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wart-mc2410c)"/>
<rect class="box" x="62" y="336" width="130" height="44" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="127" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Feed pump and</text>
<text x="127" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">solution tank</text>
<path class="ln" d="M133,382 L133,436" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#wart-m3a5a72)"/>
<circle cx="133" cy="445" r="5" fill="#0b2f4a"/>
<text x="262" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Injects before the pressure tank;</text>
<text x="262" y="367" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">runs only when the well pump runs</text>
<text x="320" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">about 20 min</text>
<text x="320" y="509" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">of contact</text>
<text x="441" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">catches the</text>
<text x="441" y="509" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">particles</text>
<text x="562" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">removes</text>
<text x="562" y="509" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">leftover chlorine</text>
<text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">A coarse sediment screen (position 5) sits between the pressure tank and retention tank; omitted here for space.</text>
</svg>
