<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="mfp-title mfp-desc">
<title id="mfp-title">Manganese filters for well water: the pH each media needs to remove manganese</title>
<desc id="mfp-desc">Chart of the pH at which each manganese filter media works: a fine-mesh softener above pH 6.7, greensand from 6.8, Birm from 7.5, Katalox Light accepting pH 5.8 upward but recommended at 8.5 for manganese, and chlorine fastest at about 8.5. Filox and the Oceanic air injection filter publish no pH figure. Below about 6.8, pH must be raised first.</desc>
<rect width="760" height="640" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Where each manganese filter works, by pH</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Maker and extension figures for manganese, not iron</text>

<rect x="30" y="84" width="30" height="12" rx="2" fill="#0e7490"/>
<text x="68" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Removes manganese</text>
<rect x="210" y="84" width="30" height="12" rx="2" fill="#bfe3ea"/>
<text x="248" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Accepted, weaker on manganese</text>
<rect x="470" y="84" width="30" height="12" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
<text x="508" y="95" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Raise pH first</text>

<rect x="250" y="116" width="152.75" height="404" fill="#fee2e2"/>
<path d="M367.5,116 L367.5,520" stroke="#ffffff" stroke-width="1" fill="none"/>
<path d="M485,116 L485,520" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<path d="M602.5,116 L602.5,520" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<path d="M720,116 L720,520" stroke="#e2e8f0" stroke-width="1" fill="none"/>

<rect class="box" x="30" y="122" width="200" height="58" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Fine-mesh softener</text>
<text x="44" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Iron Pro 2 64k</text>
<rect x="391" y="132" width="329" height="14" rx="3" fill="#0e7490"/>
<text x="410" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3a5a72">Penn State: above 6.7, dissolved only</text>

<rect class="box" x="30" y="188" width="200" height="58" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="212" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Greensand</text>
<text x="44" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">(media class)</text>
<rect x="402.75" y="198" width="317.25" height="14" rx="3" fill="#0e7490"/>
<text x="410" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3a5a72">NDSU: poor below 6.8</text>

<rect class="box" x="30" y="254" width="200" height="58" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Birm</text>
<text x="44" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">(catalytic media)</text>
<rect x="485" y="264" width="235" height="14" rx="3" fill="#0e7490"/>
<text x="492" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3a5a72">Penn State: at least 7.5</text>

<rect class="box" x="30" y="320" width="200" height="58" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Katalox Light</text>
<text x="44" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">WECO KL-1054, AWS AIO</text>
<rect x="285.25" y="330" width="317.25" height="14" rx="3" fill="#bfe3ea"/>
<rect x="602.5" y="330" width="117.5" height="14" rx="3" fill="#0e7490"/>
<text x="410" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3a5a72">Maker: from 5.8; 8.5 for manganese</text>

<rect class="box" x="30" y="386" width="200" height="58" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="410" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Chlorine + filter</text>
<text x="44" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">(oxidation)</text>
<circle cx="602.5" cy="403" r="8" fill="#0e7490"/>
<text x="410" y="434" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3a5a72">NDSU: fastest at about 8.5</text>

<rect class="box" x="30" y="452" width="200" height="58" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="44" y="476" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Filox 15,</text>
<text x="44" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Oceanic AIO 12x52</text>
<text x="410" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#dc2626">No pH figure on the listings: ask the seller</text>

<path class="ln" d="M250,530 L720,530" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M250,530 L250,536" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M367.5,530 L367.5,536" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M485,530 L485,536" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M602.5,530 L602.5,536" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M720,530 L720,536" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="250" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">5.5</text>
<text x="367.5" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">6.5</text>
<text x="485" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">7.5</text>
<text x="602.5" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">8.5</text>
<text x="720" y="554" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">9.5</text>
<text x="485" y="578" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#52697a">pH of the raw water</text>
<text x="30" y="616" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Below about 6.8, add a neutralizer or chemical feed before any manganese filter.</text>
</svg>
