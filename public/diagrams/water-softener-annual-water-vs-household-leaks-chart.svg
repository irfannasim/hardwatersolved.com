<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="g22w-title g22w-desc">
<title id="g22w-title">How much water a water softener uses per year compared with household leaks</title>
<desc id="g22w-desc">Calculated bar chart for a home on 15 gpg water: a metered softener sends about 2,900 gallons a year to drain and a timer set every 3 days about 6,100, while EPA puts average household leaks at 9,300 gallons, and leaks of 50 gallons a day add up to 18,250.</desc>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Softener water per year, next to what leaks waste</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Calculated: 210 gal/day softened, 15 gpg, 1 cu ft bed at 22,930 grains, 50 gal per regeneration</text>

<text x="30" y="105" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Metered softener</text>
<text x="30" y="122" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">58 regenerations a year</text>
<rect x="260" y="92" width="58" height="30" fill="#0e7490"/>
<text x="326" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">2,900 gal</text>

<text x="30" y="161" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Timer, every 3 days</text>
<text x="30" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">122 regenerations a year</text>
<rect x="260" y="148" width="122" height="30" fill="#c2410c"/>
<text x="390" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">6,100 gal</text>

<text x="30" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">EPA upper figure</text>
<text x="30" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">for regeneration water</text>
<rect x="260" y="204" width="200" height="30" fill="#78716c"/>
<text x="468" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">up to 10,000 gal</text>

<text x="30" y="273" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Average household leaks</text>
<text x="30" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">EPA WaterSense average</text>
<rect x="260" y="260" width="186" height="30" fill="#dc2626"/>
<text x="454" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">9,300 gal</text>

<text x="30" y="329" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Leaks of 50 gal/day</text>
<text x="30" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">EPA: 9% of homes reach this</text>
<rect x="260" y="316" width="365" height="30" fill="#dc2626"/>
<text x="633" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">18,250 gal</text>

<path class="ln" d="M260,370 L660,370" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M260,370 L260,378 M360,370 L360,378 M460,370 L460,378 M560,370 L560,378 M660,370 L660,378" stroke="#0b2f4a" stroke-width="1.5" fill="none"/>
<text x="260" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">0</text>
<text x="360" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">5,000</text>
<text x="460" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">10,000</text>
<text x="560" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">15,000</text>
<text x="660" y="396" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">20,000</text>
<text x="460" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">gallons a year</text>

<rect class="box" x="30" y="432" width="700" height="66" rx="6" fill="#f0f9ff" stroke="#0e7490" stroke-width="2"/>
<text x="380" y="459" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">The whole home uses about 109,500 gallons a year (EPA: 300 a day)</text>
<text x="380" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Metered softener: 2.6% of that. Timer every 3 days: 5.6%. Average leaks: 8.5%.</text>
</svg>
