<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570" role="img" aria-labelledby="cwr-title cwr-desc">
<title id="cwr-title">Cabinet water softener salt refill interval: 80 lb vs 200 lb salt storage</title>
<desc id="cwr-desc">Bar chart of weeks between salt refills for a cabinet water softener holding 80 lb or about 200 lb of salt, for light, typical and heavy households: 27 vs 67 weeks, 9 vs 22 weeks and 4 vs 11 weeks.</desc>
<defs></defs>
<rect width="760" height="570" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Weeks between salt refills: 80 lb vs 200 lb cabinet</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same salt use, different salt storage. Harmony Lite takes 80 lb; EcoPure EP42 holds about 200 lb.</text>
<rect x="30" y="84" width="16" height="16" fill="#3a5a72"/>
<text x="54" y="97" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">80 lb fill (Aquasure Harmony Lite)</text>
<rect x="300" y="84" width="16" height="16" fill="#0e7490"/>
<text x="324" y="97" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">About 200 lb (EcoPure EP42)</text>
<text x="30" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Weeks</text>
<text x="100" y="435" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<path d="M110,386 L720,386" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="100" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">10</text>
<path d="M110,342 L720,342" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="100" y="347" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">20</text>
<path d="M110,298 L720,298" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="100" y="303" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">30</text>
<path d="M110,254 L720,254" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="100" y="259" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">40</text>
<path d="M110,210 L720,210" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="100" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">50</text>
<path d="M110,166 L720,166" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="100" y="171" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">60</text>
<path d="M110,122 L720,122" stroke="#e2e8f0" stroke-width="1" fill="none"/>
<text x="100" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">70</text>
<path class="ln" d="M110,116 L110,430 L720,430" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="155" y="312.5" width="64" height="117.5" fill="#3a5a72"/>
<text x="187" y="304.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#3a5a72">27 wk</text>
<rect x="231" y="136.5" width="64" height="293.5" fill="#0e7490"/>
<text x="263" y="128.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">67 wk</text>
<text x="225" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Light</text>
<text x="225" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2 people, 10 gpg</text>
<text x="225" y="487" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3.0 lb salt a week</text>
<rect x="355" y="390.8" width="64" height="39.2" fill="#3a5a72"/>
<text x="387" y="382.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#3a5a72">9 wk</text>
<rect x="431" y="332.3" width="64" height="97.7" fill="#0e7490"/>
<text x="463" y="324.3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">22 wk</text>
<text x="425" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Typical</text>
<text x="425" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4 people, 15 gpg</text>
<text x="425" y="487" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">9.0 lb salt a week</text>
<rect x="555" y="411.1" width="64" height="18.9" fill="#3a5a72"/>
<text x="587" y="403.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#3a5a72">4 wk</text>
<rect x="631" y="382.9" width="64" height="47.1" fill="#0e7490"/>
<text x="663" y="374.9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">11 wk</text>
<text x="625" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Heavy</text>
<text x="625" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5 people, 25 gpg</text>
<text x="625" y="487" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">18.8 lb salt a week</text>
<text x="30" y="528" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative. Salt use assumes 75 gallons per person a day and about 3,500 grains removed per lb of salt,</text>
<text x="30" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">an efficient setting. Real use usually runs higher, so real intervals are shorter than shown.</text>
</svg>
