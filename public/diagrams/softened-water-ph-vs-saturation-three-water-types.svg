<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="g26ls-title g26ls-desc">
<title id="g26ls-title">Softened water pH vs saturation index for three water types</title>
<desc id="g26ls-desc">For an acidic well, a hard groundwater and a lime-softened city water, pH stays at 6.4, 7.3 and 9.1 after a water softener, while the calculated Langelier saturation index falls from -2.44 to -3.61, -0.14 to -1.97 and +0.72 to -0.85.</desc>
<defs>
<marker id="g26ls-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker>
</defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">pH holds; the saturation index drops</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative: LSI calculated at 15 °C with 3 mg/L calcium hardness left after softening</text>
<circle cx="38" cy="96" r="7" fill="#c2410c"/>
<text x="52" y="101" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Before softener</text>
<circle cx="178" cy="96" r="7" fill="#0e7490"/>
<text x="192" y="101" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">After softener</text>
<text x="360" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a" text-anchor="middle">pH</text>
<text x="620" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a" text-anchor="middle">SATURATION INDEX (LSI)</text>
<text x="30" y="181" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">A. Acidic well</text>
<text x="30" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">pH 6.4, alkalinity 40</text>
<path class="ln" d="M260,185 L460,185" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="280" cy="185" r="8" fill="#0e7490" stroke="#c2410c" stroke-width="3"/>
<text x="280" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a" text-anchor="middle">6.4</text>
<text x="280" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">unchanged</text>
<path class="ln" d="M520,185 L720,185" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<path class="ln" d="M572,185 L550,185" fill="none" stroke="#3a5a72" stroke-width="3" marker-end="url(#g26ls-a)"/>
<circle cx="582" cy="185" r="8" fill="#c2410c"/>
<circle cx="536" cy="185" r="8" fill="#0e7490"/>
<text x="582" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">−2.44</text>
<text x="536" y="211" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0e7490" text-anchor="middle">−3.61</text>
<text x="30" y="271" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">B. Hard groundwater</text>
<text x="30" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">pH 7.3, alkalinity 250</text>
<path class="ln" d="M260,275 L460,275" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="325" cy="275" r="8" fill="#0e7490" stroke="#c2410c" stroke-width="3"/>
<text x="325" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a" text-anchor="middle">7.3</text>
<text x="325" y="301" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">unchanged</text>
<path class="ln" d="M520,275 L720,275" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<path class="ln" d="M664,275 L615,275" fill="none" stroke="#3a5a72" stroke-width="3" marker-end="url(#g26ls-a)"/>
<circle cx="674" cy="275" r="8" fill="#c2410c"/>
<circle cx="601" cy="275" r="8" fill="#0e7490"/>
<text x="674" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">−0.14</text>
<text x="601" y="301" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0e7490" text-anchor="middle">−1.97</text>
<text x="30" y="361" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">C. Lime-softened city</text>
<text x="30" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">pH 9.1, alkalinity 50</text>
<path class="ln" d="M260,365 L460,365" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="415" cy="365" r="8" fill="#0e7490" stroke="#c2410c" stroke-width="3"/>
<text x="415" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a" text-anchor="middle">9.1</text>
<text x="415" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">unchanged</text>
<path class="ln" d="M520,365 L720,365" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<path class="ln" d="M699,365 L660,365" fill="none" stroke="#3a5a72" stroke-width="3" marker-end="url(#g26ls-a)"/>
<circle cx="709" cy="365" r="8" fill="#c2410c"/>
<circle cx="646" cy="365" r="8" fill="#0e7490"/>
<text x="709" y="345" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#c2410c" text-anchor="middle">+0.72</text>
<text x="646" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0e7490" text-anchor="middle">−0.85</text>
<path class="ln" d="M260,414 L460,414" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M520,414 L720,414" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<text x="260" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">6</text>
<text x="310" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">7</text>
<text x="360" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">8</text>
<text x="410" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">9</text>
<text x="460" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">10</text>
<text x="520" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">−4</text>
<text x="560" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">−3</text>
<text x="600" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">−2</text>
<text x="640" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">−1</text>
<text x="680" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">0</text>
<text x="720" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">+1</text>
<text x="620" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">LSI units, 0 = saturated</text>
<text x="360" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">pH units</text>
</svg>
