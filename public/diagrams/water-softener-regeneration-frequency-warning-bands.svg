<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="rfb-title rfb-desc">
<title id="rfb-title">How often should a water softener regenerate: interval bands and what each means</title>
<desc id="rfb-desc">Five bands of water softener regeneration frequency, from daily or more often, which points to a fault or undersizing, through every three to seven days, the usual range, to fifteen days or longer, where a day override should force regular cycles.</desc>
<rect width="760" height="490" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Reading the interval your softener actually runs</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Rule-of-thumb bands. Your worksheet result is the real target; these flag when to look closer.</text>
<rect class="box" x="30" y="88" width="190" height="60" rx="8" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
<text x="125" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Daily or more often</text>
<text x="238" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Suspect a fault first: a leak or running toilet, a meter that</text>
<text x="238" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">over-counts, hardness set too high, or a system too small.</text>
<rect class="box" x="30" y="160" width="190" height="60" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="125" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Every 2 days</text>
<text x="238" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Tight but possible for a large family on very hard water.</text>
<text x="238" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Accept it only if your worksheet gives the same answer.</text>
<rect class="box" x="30" y="232" width="190" height="60" rx="8" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/>
<text x="125" y="267" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Every 3 to 7 days</text>
<text x="238" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">The usual result for a correctly sized softener in a</text>
<text x="238" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">typical household. Nothing to change if the tap tests soft.</text>
<rect class="box" x="30" y="304" width="190" height="60" rx="8" fill="#cffafe" stroke="#0e7490" stroke-width="1.5"/>
<text x="125" y="339" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Every 8 to 14 days</text>
<text x="238" y="330" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Normal for one or two people, or for soft-ish water.</text>
<text x="238" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Make sure a day override is set as a backstop.</text>
<rect class="box" x="30" y="376" width="190" height="60" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="125" y="411" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">15 days or longer</text>
<text x="238" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">The bed sits idle between cycles. Set the day override so</text>
<text x="238" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">it regenerates on schedule even when the meter would not.</text>
<text x="30" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Red = investigate. Teal = expected. Pale teal = fine with a backstop set.</text>
</svg>
