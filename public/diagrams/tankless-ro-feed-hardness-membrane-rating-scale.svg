<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="thf-title thf-desc">
<title id="thf-title">Tankless reverse osmosis membrane ratings and feed water hardness limits</title>
<desc id="thf-desc">Hardness scale showing the 7 grains per gallon feed limit in Waterdrop's tankless reverse osmosis specifications, with softened water well inside it, and a table of rated membrane life and published feed limits for four tankless RO systems.</desc>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0b2f4a">Feed hardness and tankless RO membrane ratings</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Rated membrane life assumes feed water inside the manual's limits</text>
<text x="292" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">7 gpg: limit in Waterdrop's G3P600, G3P800 and X12 specs</text>
<rect class="box" x="60" y="110" width="224" height="40" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="172" y="135" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">Inside the rated feed</text>
<rect class="box" x="284" y="110" width="416" height="40" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="492" y="135" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">Outside it: rated life no longer applies</text>
<path class="ln" d="M284,102 L284,156" stroke="#dc2626" stroke-width="3" fill="none"/>
<text x="60" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="220" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">5</text>
<text x="284" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">7</text>
<text x="380" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">10</text>
<text x="540" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">15</text>
<text x="700" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">20</text>
<text x="380" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Feed water hardness, grains per gallon (gpg)</text>
<text x="60" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0e7490">A working softener delivers about 0 to 1 gpg, well inside every rating.</text>

<rect class="box" x="30" y="238" width="700" height="208" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="46" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">SYSTEM</text>
<text x="230" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">RATED MEMBRANE LIFE</text>
<text x="430" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#52697a">FEED LIMITS IN THE MANUAL</text>
<text x="46" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Waterdrop G3P600</text>
<text x="230" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">24 months or 2,200 gal</text>
<text x="430" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Under 7 gpg, TDS under 750 ppm</text>
<text x="46" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Waterdrop G3P800</text>
<text x="230" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">24 months</text>
<text x="430" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Under 7 gpg, TDS under 750 ppm</text>
<text x="46" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">iSpring RO500</text>
<text x="230" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">24 to 36 months</text>
<text x="430" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">No hardness figure; TDS to 500 ppm</text>
<text x="46" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Waterdrop X12</text>
<text x="230" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">24 months or 2,200 gal</text>
<text x="430" y="420" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Under 7 gpg, TDS under 750 ppm</text>
<text x="30" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">No maker publishes a shorter life for hard feed. Above the limit, the rating simply stops applying.</text>
</svg>
