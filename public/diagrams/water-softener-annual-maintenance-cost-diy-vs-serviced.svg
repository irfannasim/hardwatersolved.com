<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="g22m-title g22m-desc">
<title id="g22m-title">Water softener annual maintenance cost, DIY owner vs serviced owner</title>
<desc id="g22m-desc">Illustrative grouped bar chart for a four-person home on 15 gpg water. Both owners spend 96 dollars on salt. The DIY owner spends 55 dollars on consumables, nothing on labour and 28 dollars in reserves, 179 dollars a year in all. The serviced owner spends 65, 150 and 75 dollars, 386 dollars a year.</desc>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Same softener, same year, two ways to look after it</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Illustrative prices, 4 people, 15 gpg city water, metered 1 cu ft softener, dollars a year</text>

<rect x="440" y="88" width="18" height="12" fill="#0e7490"/>
<text x="464" y="99" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">DIY owner</text>
<rect x="570" y="88" width="18" height="12" fill="#3a5a72"/>
<text x="594" y="99" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Serviced owner</text>

<text x="82" y="404" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" fill="#52697a">$0</text>
<text x="82" y="279" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" fill="#52697a">$100</text>
<text x="82" y="154" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="end" fill="#52697a">$200</text>
<path class="ln" d="M88,150 L94,150 M88,275 L94,275" stroke="#52697a" stroke-width="1.5" fill="none"/>

<rect x="120" y="280" width="44" height="120" fill="#0e7490"/>
<rect x="176" y="280" width="44" height="120" fill="#3a5a72"/>
<text x="142" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$96</text>
<text x="198" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$96</text>

<rect x="280" y="331" width="44" height="69" fill="#0e7490"/>
<rect x="336" y="319" width="44" height="81" fill="#3a5a72"/>
<text x="302" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$55</text>
<text x="358" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$65</text>

<text x="462" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$0</text>
<rect x="496" y="212" width="44" height="188" fill="#3a5a72"/>
<text x="518" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$150</text>

<rect x="600" y="365" width="44" height="35" fill="#0e7490"/>
<rect x="656" y="306" width="44" height="94" fill="#3a5a72"/>
<text x="622" y="357" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$28</text>
<text x="678" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">$75</text>

<path class="ln" d="M90,400 L730,400" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<text x="170" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Salt</text>
<text x="170" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">548 lb, 14 bags</text>
<text x="330" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Consumables</text>
<text x="330" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">strips, filters, cleaner</text>
<text x="490" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Labour</text>
<text x="490" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">annual visit</text>
<text x="650" y="422" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Reserves</text>
<text x="650" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">resin, valve seals</text>

<rect class="box" x="30" y="466" width="340" height="72" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="200" y="494" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">DIY: $179 a year</text>
<text x="200" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">$83 without salt, plus about 2 hours</text>
<rect class="box" x="390" y="466" width="340" height="72" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="560" y="494" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Serviced: $386 a year</text>
<text x="560" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">$290 without salt, 3.5 times the DIY figure</text>
</svg>
