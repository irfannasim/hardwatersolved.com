<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="apw-title apw-desc">
<title id="apw-title">Apartment portable water softener hookup on the washing machine cold feed</title>
<desc id="apw-desc">Diagram of a renter-friendly portable water softener connected with hose threads between the laundry cold valve and the washing machine cold inlet, so laundry fills with soft water while the hot fill stays hard. Regeneration uses table salt and a flush to a tub drain.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><pattern id="rz" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#f6ead2"/><circle cx="4" cy="4" r="2.2" fill="#e2b865"/><circle cx="10" cy="10" r="2.2" fill="#e2b865"/></pattern></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Renter hookup: portable softener on the washer cold feed</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hose-thread connections only. Nothing is cut, glued or drilled.</text>
<rect class="box" x="40" y="100" width="170" height="110" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="125" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Laundry valve box</text>
<text x="80" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">Cold</text>
<text x="170" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">Hot</text>
<circle cx="80" cy="155" r="13" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
<circle cx="170" cy="155" r="13" fill="#ffffff" stroke="#c2410c" stroke-width="3"/>
<path class="ln" d="M183,155 L600,155 L600,226" stroke="#c2410c" stroke-width="5" fill="none" marker-end="url(#ah)"/>
<text x="390" y="143" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#c2410c">Hot fill stays hard</text>
<path class="ln" d="M80,211 L80,330 L246,330" stroke="#c2410c" stroke-width="5" fill="none" marker-end="url(#ah)"/>
<text x="92" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#c2410c">Cold hose</text>
<rect class="box" x="250" y="250" width="90" height="170" rx="22" fill="url(#rz)" stroke="#3a5a72" stroke-width="2"/>
<rect x="256" y="304" width="78" height="74" rx="6" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="295" y="325" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Portable</text>
<text x="295" y="345" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text>
<text x="295" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">9.5 x 22 in</text>
<path class="ln" d="M340,290 L516,290" stroke="#0e7490" stroke-width="5" fill="none" marker-end="url(#as)"/>
<text x="428" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Soft cold fill</text>
<rect class="box" x="520" y="230" width="190" height="200" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<circle cx="615" cy="345" r="50" fill="#e0f2fe" stroke="#3a5a72" stroke-width="2"/>
<text x="615" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Washing machine</text>
<rect class="box" x="40" y="450" width="670" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="375" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Regenerating: unhook it, pour in table salt, flush fresh water through to a tub or outside</text>
<text x="375" y="492" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">The maker quotes two boxes of salt and under 30 minutes for the 16,000-grain double model</text>
<path d="M40,530 L70,530" stroke="#c2410c" stroke-width="5" fill="none"/>
<text x="78" y="535" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hard water</text>
<path d="M180,530 L210,530" stroke="#0e7490" stroke-width="5" fill="none"/>
<text x="218" y="535" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Soft water</text>
</svg>
