<circle cx="630.0" cy="145.0" r="16" fill="#7c3aed"/><text x="630.0" y="149.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
<circle cx="672.4" cy="162.6" r="16" fill="#7c3aed"/><text x="672.4" y="167.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
<circle cx="690.0" cy="205.0" r="16" fill="#7c3aed"/><text x="690.0" y="209.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
