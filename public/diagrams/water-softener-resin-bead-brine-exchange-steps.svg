<circle cx="470.1" cy="153.0" r="16" fill="#7c3aed"/><text x="470.1" y="157.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
<circle cx="470.1" cy="257.0" r="16" fill="#7c3aed"/><text x="470.1" y="261.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
<circle cx="289.9" cy="257.0" r="16" fill="#7c3aed"/><text x="289.9" y="261.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
