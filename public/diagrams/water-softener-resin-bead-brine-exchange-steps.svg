<circle cx="630.0" cy="265.0" r="16" fill="#7c3aed"/><text x="630.0" y="269.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
<circle cx="587.6" cy="247.4" r="16" fill="#7c3aed"/><text x="587.6" y="251.9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
<circle cx="570.0" cy="205.0" r="16" fill="#7c3aed"/><text x="570.0" y="209.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
<circle cx="587.6" cy="162.6" r="16" fill="#7c3aed"/><text x="587.6" y="167.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na</text>
<path class="ln" d="M226,205 L268,205" fill="none" stroke="#3a5a72" stroke-width="5" marker-end="url(#rbx-a)"/>
<text x="247" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7c3aed">brine</text>
<path class="ln" d="M492,205 L534,205" fill="none" stroke="#3a5a72" stroke-width="5" marker-end="url(#rbx-a)"/>
<text x="513" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">rinse</text>
<text x="130" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Exhausted</text>
<text x="130" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Every site holds</text>
<text x="130" y="393" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">calcium or</text>
<text x="130" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">magnesium. Hard</text>
<text x="130" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">water now passes.</text>
<text x="380" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Brine floods the bed</text>
<text x="380" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Sodium in huge excess</text>
<text x="380" y="393" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">pushes the hardness</text>
<text x="380" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">off the sites and</text>
<text x="380" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">into the flowing water.</text>
<text x="630" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Regenerated</text>
<text x="630" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Sites hold sodium</text>
<text x="630" y="393" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">again. Calcium and</text>
<text x="630" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">magnesium left in</text>
<text x="630" y="431" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">the rinse to drain.</text>
</svg>
