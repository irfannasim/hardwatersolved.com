<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="iwi-title iwi-desc">
<title id="iwi-title">Inspect water softener in a new house: 30-minute inspection timeline</title>
<desc id="iwi-desc">Timeline for inspecting an inherited water softener in a new house: five minutes each for age, a visual check, reading the settings and testing hardness, then ten minutes watching a manual regeneration start, with a retest after it ends.</desc>
<defs></defs>
<rect width="760" height="420" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inherited water softener: the 30-minute inspection</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Five blocks of your time. The regeneration then finishes on its own.</text>
<rect class="box" x="62" y="110" width="102.66666666666666" height="50" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="113.33333333333333" y="141" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Age</text>
<text x="113.33333333333333" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Labels, serial,</text>
<text x="113.33333333333333" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">paperwork</text>
<rect class="box" x="168.66666666666666" y="110" width="102.66666666666666" height="50" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="220" y="141" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Look</text>
<text x="220" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Leaks, salt,</text>
<text x="220" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">bypass, drain</text>
<rect class="box" x="275.3333333333333" y="110" width="102.66666666666666" height="50" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="326.66666666666663" y="141" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Settings</text>
<text x="326.66666666666663" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Hardness,</text>
<text x="326.66666666666663" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">capacity, time</text>
<rect class="box" x="382" y="110" width="102.66666666666666" height="50" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="433.3333333333333" y="141" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Test</text>
<text x="433.3333333333333" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Raw and</text>
<text x="433.3333333333333" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">softened taps</text>
<rect class="box" x="488.66666666666663" y="110" width="209.33333333333331" height="50" rx="4" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="593.3333333333333" y="141" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">Regenerate</text>
<text x="593.3333333333333" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Watch backwash, brine</text>
<text x="593.3333333333333" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">draw and refill start</text>
<line class="ln" x1="60" y1="236" x2="700" y2="236" stroke="#3a5a72" stroke-width="1.5"/>
<line class="ln" x1="60" y1="231" x2="60" y2="241" stroke="#3a5a72" stroke-width="1.5"/>
<text x="60" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0 min</text>
<line class="ln" x1="166.66666666666666" y1="231" x2="166.66666666666666" y2="241" stroke="#3a5a72" stroke-width="1.5"/>
<text x="166.66666666666666" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5 min</text>
<line class="ln" x1="273.3333333333333" y1="231" x2="273.3333333333333" y2="241" stroke="#3a5a72" stroke-width="1.5"/>
<text x="273.3333333333333" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10 min</text>
<line class="ln" x1="380" y1="231" x2="380" y2="241" stroke="#3a5a72" stroke-width="1.5"/>
<text x="380" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">15 min</text>
<line class="ln" x1="486.66666666666663" y1="231" x2="486.66666666666663" y2="241" stroke="#3a5a72" stroke-width="1.5"/>
<text x="486.66666666666663" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">20 min</text>
<line class="ln" x1="593.3333333333333" y1="231" x2="593.3333333333333" y2="241" stroke="#3a5a72" stroke-width="1.5"/>
<text x="593.3333333333333" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">25 min</text>
<line class="ln" x1="700" y1="231" x2="700" y2="241" stroke="#3a5a72" stroke-width="1.5"/>
<text x="700" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">30 min</text>
<rect class="box" x="30" y="286" width="340" height="106" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="44" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">After the regeneration ends</text>
<text x="44" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Retest a softened cold tap. Near 0 gpg means</text>
<text x="44" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the resin and valve work. Record salt level</text>
<text x="44" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and date to start your own log.</text>
<rect class="box" x="390" y="286" width="340" height="106" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="404" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Stop and call a technician if</text>
<text x="404" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the tank or valve leaks under pressure,</text>
<text x="404" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the brine tank overflows, or the drain</text>
<text x="404" y="372" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">keeps running after the cycle ends.</text>
</svg>
