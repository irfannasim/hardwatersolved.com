<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img" aria-labelledby="tip-title tip-desc">
<title id="tip-title">Water softener tie-in point: branches upstream stay hard</title>
<desc id="tip-desc">Plumbing schematic: branches that tee off the main before the water softener tie-in, such as outdoor bibs, a kitchen cold tap or an addition wing, stay hard, while the water heater, showers and appliances downstream get soft water.</desc>
<defs></defs>
<rect width="760" height="452" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Only some faucets soft? A branch tees off before the softener</text><path class="ln" d="M30,108 L30,100 L396,100 L396,108" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="213" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">upstream of the tie-in: never softened</text><path class="ln" d="M504,108 L504,100 L730,100 L730,108" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="617" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">downstream: softened</text><text x="30" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">supply enters</text><path class="ln" d="M30,170 L50,170" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="50" y="145" width="92" height="50" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="96" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">shutoff</text><text x="96" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">+ meter</text><path class="ln" d="M142,170 L410,170" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="410" y="145" width="86" height="50" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="453" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">SOFTENER</text><text x="453" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">tie-in point</text><path class="ln" d="M496,170 L700,170 L700,300" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M180,170 L180,240" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">outdoor bibs</text><text x="180" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">deliberate</text><path class="ln" d="M270,170 L270,306" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">kitchen cold tap</text><text x="270" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">often deliberate</text><path class="ln" d="M360,170 L360,240" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">addition wing /</text><text x="360" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">upstairs riser</text><text x="360" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">FAULT</text><path class="ln" d="M530,170 L530,240" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">water heater</text><path class="ln" d="M590,170 L590,306" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">showers</text><path class="ln" d="M648,170 L648,240" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="648" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">dishwasher</text><path class="ln" d="M700,170 L700,300" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="322" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">washer</text><text x="30" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">A softener treats everything downstream of its tie-in and nothing upstream.</text><rect x="30" y="428" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard (untreated)</text>
<rect x="220" y="428" width="26" height="6" rx="3" fill="#0e7490"/><text x="254" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">soft</text>
</svg>
