<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="nwc-title nwc-desc">
<title id="nwc-title">No water after installing a water softener: map of the eight checks</title>
<desc id="nwc-desc">Map of the supply line through a newly installed water softener marking the eight no-water checks: bypass, main shutoff, isolation valves, regeneration display, inlet and outlet direction, check valve and connectors, inlet screen and piston, and frozen pipe.</desc>
<defs><marker id="nwc-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><pattern id="nwc-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="440" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">No water after installing a softener: where each check is</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Badges match the 8 checks in technician order. Bypass (1) first.</text><rect class="box" x="30" y="150" width="170" height="180" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2" stroke-dasharray="6 4"/><text x="115" y="176" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">UPSTREAM</text><circle cx="52" cy="200" r="12" fill="#0b2f4a"/><text x="52" y="205" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="72" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">main shutoff</text><text x="52" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water meter · PRV</text>
<text x="52" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">well system</text><text x="52" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">No water in bypass?</text>
<text x="52" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">Look here.</text><path class="ln" d="M200,236 L222,236" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M250,236 L282,236" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M314,236 L336,236" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M470,236 L490,236" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M518,236 L542,236" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M570,236 L604,236" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M604,236 C612,222 620,250 628,236 C636,222 644,250 652,236" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M652,236 L720,236" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nwc-s)"/><path d="M676,227 L676,245 M667,231 L685,241 M667,241 L685,231" stroke="#60a5fa" stroke-width="2"/><path d="M223,226 L249,246 L249,226 L223,246 z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><path d="M285,226 L311,246 L311,226 L285,246 z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><path d="M491,226 L517,246 L517,226 L491,246 z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><circle cx="556" cy="236" r="14" fill="#fff" stroke="#3a5a72" stroke-width="2"/><path d="M548,236 L562,236 M556,230 L563,236 L556,242" stroke="#0b2f4a" stroke-width="2.5" fill="none"/><rect x="336" y="216" width="134" height="40" rx="6" fill="#0b2f4a" /><text x="403" y="241" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">CONTROL VALVE</text><rect x="364" y="258" width="78" height="100" rx="16" fill="url(#nwc-beads)" stroke="#3a5a72" stroke-width="2"/><circle cx="236" cy="172" r="12" fill="#0b2f4a"/><text x="236" y="177" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="236" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">inlet valve</text><circle cx="298" cy="172" r="12" fill="#0b2f4a"/><text x="298" y="177" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="298" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">bypass</text><circle cx="504" cy="172" r="12" fill="#0b2f4a"/><text x="504" y="177" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="504" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">outlet valve</text><circle cx="682" cy="172" r="12" fill="#0b2f4a"/><text x="682" y="177" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">8</text><text x="682" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">frozen pipe?</text><circle cx="372" cy="116" r="12" fill="#0b2f4a"/><text x="372" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="372" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">display:</text><text x="372" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">mid-regen?</text><path class="ln" d="M372,170 L372,212" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="452" cy="116" r="12" fill="#0b2f4a"/><text x="452" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">5</text><text x="452" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">IN / OUT</text><text x="452" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">marks</text><path class="ln" d="M452,170 L452,212" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232" cy="284" r="12" fill="#0b2f4a"/><text x="232" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">7</text><text x="252" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">inlet screen</text>
<text x="252" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">meter turbine</text>
<text x="252" y="327" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">piston</text><path class="ln" d="M342,282 L350,262" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="546" cy="284" r="12" fill="#0b2f4a"/><text x="546" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">6</text><text x="530" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">check valve:</text>
<text x="530" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">arrow to house</text><circle cx="628" cy="284" r="12" fill="#0b2f4a"/><text x="628" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">6</text><text x="642" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">kinked</text>
<text x="642" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">connector?</text><text x="730" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#0e7490">to house: open the lowest cold tap</text><text x="30" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">Upstream items vary by house.</text><text x="30" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">A check valve is only there if the installer fitted one.</text><rect x="30" y="416" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">before the softener</text>
<rect x="250" y="416" width="26" height="6" rx="3" fill="#0e7490"/><text x="284" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">after the softener</text>
</svg>
