<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="g17ot-title g17ot-desc">
<title id="g17ot-title">Yearly running cost of an old timer water softener compared with a new metered softener including its price</title>
<desc id="g17ot-desc">Illustrative comparison for a family of four on 15 gpg water: an old timer softener costs about $430 a year in salt and regeneration water, while a new metered unit costs about $175 a year to run plus $125 a year for its $1,500 price spread over 12 years, about $300 in total.</desc>
<rect width="760" height="420" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Yearly cost: an old timer softener vs a new metered one</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative, family of four on 15 gpg water, including the new unit’s price</text>
<path d="M200,92 L200,268" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="200" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$0</text>
<path d="M296,92 L296,268" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="296" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$100</text>
<path d="M392,92 L392,268" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="392" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$200</text>
<path d="M488,92 L488,268" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="488" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$300</text>
<path d="M584,92 L584,268" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="584" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$400</text>
<path d="M680,92 L680,268" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="680" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$500</text>
<text x="186" y="131" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0b2f4a">Keep the old</text>
<text x="186" y="151" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0b2f4a">timer unit</text>
<rect x="200.0" y="108" width="307.2" height="52" fill="#7c3aed"/>
<text x="353.6" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$320</text>
<rect x="507.2" y="108" width="105.6" height="52" fill="#78716c"/>
<text x="560.0" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$110</text>
<text x="620.8" y="140" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">$430</text>
<text x="186" y="215" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0b2f4a">Buy a new</text>
<text x="186" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0b2f4a">metered unit</text>
<rect x="200.0" y="192" width="92.2" height="52" fill="#7c3aed"/>
<text x="246.1" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$96</text>
<rect x="292.2" y="192" width="75.8" height="52" fill="#78716c"/>
<text x="330.1" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$79</text>
<rect x="368.0" y="192" width="120.0" height="52" fill="#0b2f4a"/>
<text x="428.0" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$125</text>
<text x="496.0" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">$300</text>
<rect x="30" y="315" width="16" height="12" rx="2" fill="#7c3aed"/>
<text x="52" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Salt</text>
<rect x="130" y="315" width="16" height="12" rx="2" fill="#78716c"/>
<text x="152" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Regeneration water</text>
<rect x="330" y="315" width="16" height="12" rx="2" fill="#0b2f4a"/>
<text x="352" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">New unit, $1,500 over 12 years</text>
<text x="30" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Old unit: 1.5 cu ft, every 3 days at 10 lb per cu ft and 75 gal a regeneration. New unit: 3,000 grains</text>
<text x="30" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">per lb, 4 gal per 1,000 grains. Salt $7 a 40 lb bag; water and sewer $12 per 1,000 gal.</text>
</svg>
