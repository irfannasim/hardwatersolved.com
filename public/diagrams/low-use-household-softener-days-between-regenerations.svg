<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="luhr-title luhr-desc">
<title id="luhr-title">Low-use household water softener: days between regenerations by household size</title>
<desc id="luhr-desc">Illustrative bar chart: a 24,000-grain water softener on 10 gpg water goes 40 days between regenerations for one person, 20 for two, 13 for three and 10 for four, and a 7-day day override keeps the resin bed from sitting idle longer than a week.</desc>
<defs></defs>
<rect width="760" height="450" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Low-use homes: days between regenerations</text><text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Worked example (calculated): 24,000-grain capacity, 10 gpg water, 60 gallons per person per day</text><text x="30" y="129" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">1 person</text><rect x="210" y="110" width="77" height="28" rx="3" fill="#0e7490"/><rect x="287" y="110" width="363" height="28" rx="3" fill="#dc2626"/><text x="658" y="129" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">40 days</text><text x="30" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">2 people</text><rect x="210" y="166" width="77" height="28" rx="3" fill="#0e7490"/><rect x="287" y="166" width="143" height="28" rx="3" fill="#dc2626"/><text x="438" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">20 days</text><text x="30" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">3 people</text><rect x="210" y="222" width="77" height="28" rx="3" fill="#0e7490"/><rect x="287" y="222" width="66" height="28" rx="3" fill="#dc2626"/><text x="361" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">13 days</text><text x="30" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">4 people</text><rect x="210" y="278" width="77" height="28" rx="3" fill="#0e7490"/><rect x="287" y="278" width="33" height="28" rx="3" fill="#dc2626"/><text x="328" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">10 days</text><path class="ln" d="M287,98 L287,326" fill="none" stroke="#0b2f4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="297" y="94" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">day override set to 7 days</text><path class="ln" d="M210,336 L650,336" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><text x="320" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10</text><text x="430" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">20</text><text x="540" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">30</text><text x="650" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">40</text><text x="666" y="356" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">days</text><rect x="30" y="388" width="26" height="12" rx="2" fill="#0e7490"/><text x="64" y="399" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">first 7 days after each regeneration</text><rect x="30" y="414" width="26" height="12" rx="2" fill="#dc2626"/><text x="64" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">days the same resin runs on, low flow, without a day override</text>
</svg>
