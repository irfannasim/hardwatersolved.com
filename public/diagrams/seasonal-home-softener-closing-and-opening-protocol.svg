<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 694" width="760" height="694" role="img" aria-labelledby="shcp-title shcp-desc">
<title id="shcp-title">Seasonal home water softener closing and opening protocol timeline</title>
<desc id="shcp-desc">Timeline of caring for a water softener in a seasonal home: let the salt run low and regenerate before leaving, bypass and winterize on closing day, then on opening day break any salt bridge, flush, return to service, sanitize and regenerate, and test hardness over the first two weeks.</desc>
<defs></defs>
<rect width="760" height="694" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Seasonal home softener: closing and opening protocol</text><path class="ln" d="M60,90 L60,561" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="90" r="11" fill="#3a5a72" stroke="#ffffff" stroke-width="3"/><text x="88" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Last two weeks of the stay</text><text x="104" y="124" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Let the salt level fall. Do not top up before leaving.</text><circle cx="94" cy="119" r="3" fill="#52697a"/><text x="104" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Run a manual regeneration a day or two before you go.</text><circle cx="94" cy="140" r="3" fill="#52697a"/><circle cx="60" cy="192" r="11" fill="#3a5a72" stroke="#ffffff" stroke-width="3"/><text x="88" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Closing day</text><text x="104" y="226" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Put the softener in bypass and shut off the main.</text><circle cx="94" cy="221" r="3" fill="#52697a"/><text x="104" y="247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Unheated property: drain and winterize the unit.</text><circle cx="94" cy="242" r="3" fill="#52697a"/><text x="104" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Leave the brine tank lid on, with the salt low.</text><circle cx="94" cy="263" r="3" fill="#52697a"/><circle cx="60" cy="315" r="11" fill="#cbd5e1" stroke="#ffffff" stroke-width="3"/><text x="88" y="321" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#52697a">While the house is empty</text><text x="104" y="349" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">No flow and no regeneration: the bed stagnates.</text><circle cx="94" cy="344" r="3" fill="#52697a"/><text x="104" y="370" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Humid air works on whatever salt is left.</text><circle cx="94" cy="365" r="3" fill="#52697a"/><circle cx="60" cy="417" r="11" fill="#0e7490" stroke="#ffffff" stroke-width="3"/><text x="88" y="423" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Opening day</text><text x="104" y="451" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Probe the salt for a bridge and break it up.</text><circle cx="94" cy="446" r="3" fill="#52697a"/><text x="104" y="472" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Flush fresh water through a tap near the main.</text><circle cx="94" cy="467" r="3" fill="#52697a"/><text x="104" y="493" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Open the bypass slowly and purge air at a tap.</text><circle cx="94" cy="488" r="3" fill="#52697a"/><text x="104" y="514" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sanitize: measured bleach in the brine well, regenerate.</text><circle cx="94" cy="509" r="3" fill="#52697a"/><circle cx="60" cy="561" r="11" fill="#15803d" stroke="#ffffff" stroke-width="3"/><text x="88" y="567" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">First two weeks back</text><text x="104" y="595" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Run a second regeneration once the first has rinsed out.</text><circle cx="94" cy="590" r="3" fill="#52697a"/><text x="104" y="616" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Test the softened water for hardness.</text><circle cx="94" cy="611" r="3" fill="#52697a"/><text x="104" y="637" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Smell persists on a well? Test for coliform bacteria.</text><circle cx="94" cy="632" r="3" fill="#52697a"/>
</svg>
