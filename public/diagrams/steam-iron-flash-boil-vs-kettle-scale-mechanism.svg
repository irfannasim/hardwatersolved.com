<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 464" width="760" height="464" role="img" aria-labelledby="kvi-title kvi-desc">
<title id="kvi-title">Steam iron flash-boiling vs kettle boiling: why irons spit scale flakes</title>
<desc id="kvi-desc">A kettle boils gently and limescale stays as a crust on the element. A steam iron flash-boils droplets on a chamber far above boiling, and the pressure pulse lifts loose scale out through the soleplate vents as white flakes.</desc>
<defs><marker id="kvi-st" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="464" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Kettle vs steam iron: stored scale vs ejected scale</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Same calcium carbonate, two different ways of boiling</text><rect class="box" x="30" y="88" width="340" height="330" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><rect class="box" x="390" y="88" width="340" height="330" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="200" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">KETTLE: BOILS</text><text x="560" y="116" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">STEAM IRON: FLASH-BOILS</text><path d="M56,150 L184,150 L194,334 L46,334 z" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/><path d="M59,176 L181,176 L191,330 L49,330 z" fill="#dbeafe"/><rect x="58" y="314" width="124" height="12" rx="3" fill="#475569" /><path d="M52,314 L188,314 L188,308 C150,302 90,302 52,308 z" fill="#d6d3c4" stroke="#a8a29e"/><circle cx="80" cy="270" r="4" fill="#fff" stroke="#93c5fd"/><circle cx="110" cy="250" r="3" fill="#fff" stroke="#93c5fd"/><circle cx="140" cy="280" r="4" fill="#fff" stroke="#93c5fd"/><circle cx="160" cy="240" r="3" fill="#fff" stroke="#93c5fd"/><circle cx="96" cy="215" r="3" fill="#fff" stroke="#93c5fd"/><circle cx="150" cy="205" r="3" fill="#fff" stroke="#93c5fd"/><text x="210" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">water heated</text><text x="210" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">to 212°F</text><text x="210" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">gentle bubbles</text><text x="210" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">scale crust on</text><text x="210" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">element and base</text><text x="210" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">stays put</text><text x="200" y="372" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">ACCUMULATES</text><text x="200" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">a crust you descale</text><rect x="420" y="140" width="150" height="44" rx="6" fill="#dbeafe" stroke="#3a5a72" stroke-width="2" /><circle cx="495" cy="196" r="3.5" fill="#60a5fa"/><circle cx="495" cy="208" r="3.5" fill="#60a5fa"/><rect x="420" y="218" width="150" height="52" rx="4" fill="#fff7ed" stroke="#3a5a72" stroke-width="2" /><rect x="422" y="258" width="146" height="10" rx="0" fill="#fca5a5" /><path d="M495,252 L482,232 L496,240 L500,224 L506,242 L520,234 L508,254 z" fill="#e2e8f0" stroke="#94a3b8"/><rect x="410" y="270" width="170" height="12" rx="2" fill="#475569" /><rect x="446" y="270" width="8" height="12" rx="0" fill="#ffffff" /><rect x="491" y="270" width="8" height="12" rx="0" fill="#ffffff" /><rect x="536" y="270" width="8" height="12" rx="0" fill="#ffffff" /><path class="ln" d="M450,288 L450,318" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#kvi-st)"/><path class="ln" d="M495,288 L495,318" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#kvi-st)"/><path class="ln" d="M540,288 L540,318" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#kvi-st)"/><rect x="440" y="300" width="6" height="4" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" /><rect x="458" y="312" width="6" height="4" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" /><rect x="488" y="306" width="6" height="4" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" /><rect x="504" y="298" width="6" height="4" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" /><rect x="534" y="310" width="6" height="4" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" /><rect x="550" y="300" width="6" height="4" rx="0" fill="#ffffff" stroke="#94a3b8" stroke-width="1" /><rect x="410" y="330" width="170" height="10" rx="2" fill="#c7d2fe" /><text x="584" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">water tank</text><text x="584" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">drops metered in</text><text x="584" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">chamber far</text><text x="584" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">above boiling</text><text x="584" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">pressure pulse</text><text x="584" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">lifts loose scale</text><text x="584" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">out through vents</text><text x="584" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">onto the shirt</text><text x="560" y="372" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">EJECTED</text><text x="560" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">white flakes on your clothes</text><text x="30" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">Brown or rust-tinted spitting is a later stage: usually corrosion inside the chamber.</text>
</svg>
