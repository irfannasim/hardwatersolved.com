<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="nto-title nto-desc">
<title id="nto-title">Treatment order for acidic water: acid neutraliser before water softener</title>
<desc id="nto-desc">Treatment order for acidic well water: a calcite neutraliser raises pH and adds hardness, hardness is re-measured, then the water softener removes it. Reversing the order leaves the house water acidic with hardness added back.</desc>
<defs><marker id="nto-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="nto-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="440" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Acidic water: neutraliser first, then softener</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">CORRECT ORDER</text><rect class="box" x="30" y="86" width="110" height="132" rx="8" fill="#f8fafc" stroke="#c2410c" stroke-width="2"/><text x="85" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Well water</text>
<text x="85" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">pH below</text>
<text x="85" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">~6.8</text><rect class="box" x="178" y="86" width="180" height="132" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="268" y="112" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">NEUTRALISER</text><text x="268" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">calcite or calcite-magnesia</text>
<text x="268" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">raises pH</text>
<text x="268" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">adds hardness (1–5 gpg)</text>
<text x="268" y="193" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">backwash; top up media</text><rect class="box" x="476" y="86" width="150" height="132" rx="8" fill="#f8fafc" stroke="#0e7490" stroke-width="2"/><text x="551" y="126" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">SOFTENER</text><text x="551" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">sized on the</text>
<text x="551" y="171" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">post-neutraliser</text>
<text x="551" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">hardness</text><rect class="box" x="662" y="86" width="68" height="132" rx="8" fill="#f8fafc" stroke="#0e7490" stroke-width="2"/><text x="696" y="157" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House</text><path class="ln" d="M142,152 L170,152" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nto-hard)"/><path class="ln" d="M360,122 L468,122" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nto-hard)"/><circle cx="417" cy="156" r="11" fill="#15803d"/><text x="417" y="161" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">✓</text><text x="417" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">re-measure</text>
<text x="417" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">hardness here</text><path class="ln" d="M628,152 L654,152" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nto-soft)"/><text x="30" y="266" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">WRONG ORDER</text><rect class="box" x="30" y="282" width="110" height="70" rx="8" fill="#f8fafc" stroke="#c2410c" stroke-width="2"/><text x="85" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Well water</text><rect class="box" x="178" y="282" width="140" height="70" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/><text x="248" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text><rect class="box" x="356" y="282" width="150" height="70" rx="8" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/><text x="431" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Neutraliser</text><rect class="box" x="544" y="282" width="186" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="637" y="313" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">House: still acidic,</text>
<text x="637" y="331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">hardness added back</text><path class="ln" d="M142,317 L170,317" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nto-hard)"/><path class="ln" d="M320,317 L348,317" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nto-soft)"/><path class="ln" d="M508,317 L536,317" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nto-hard)"/><text x="30" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">The neutraliser runs after the only unit that could remove the hardness it adds.</text><rect x="30" y="416" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water</text>
<rect x="176" y="416" width="26" height="6" rx="3" fill="#0e7490"/><text x="210" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">soft water</text>
</svg>
