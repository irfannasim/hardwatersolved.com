<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="cwp-title cwp-desc">
<title id="cwp-title">City water treatment path: what reaches a water softener</title>
<desc id="cwp-desc">Flow from source water through the treatment plant and mains to a water softener for city water, showing that the plant removes pathogens and sediment and adds a chlorine or chloramine residual while calcium and magnesium hardness pass through to the softener.</desc>
<defs><marker id="cwp-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="cwp-as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">City water: what the plant changes, and what it leaves</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Hardness travels from the source to your softener unless the plant has a softening step.</text><rect class="box" x="30" y="92" width="120" height="72" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="90" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Source water</text><text x="90" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">river, lake, wells</text><rect class="box" x="175" y="92" width="120" height="72" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="235" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Treatment</text><text x="235" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">plant</text><rect class="box" x="320" y="92" width="120" height="72" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="380" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Mains and</text><text x="380" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">storage tanks</text><rect class="box" x="465" y="92" width="120" height="72" rx="6" fill="#f6ead2" stroke="#3a5a72" stroke-width="1.5"/><text x="525" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Your</text><text x="525" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">softener</text><rect class="box" x="610" y="92" width="120" height="72" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="670" y="123" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">House</text><text x="670" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">taps</text><path class="ln" d="M153,128 L170,128" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cwp-ah)"/><path class="ln" d="M298,128 L315,128" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cwp-ah)"/><path class="ln" d="M443,128 L460,128" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cwp-ah)"/><path class="ln" d="M588,128 L605,128" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cwp-as)"/><path class="ln" d="M235,164 L235,196 L140,196 L140,222" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M235,196 L380,196 L380,222" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M525,164 L525,196 L620,196 L620,222" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="30" y="222" width="220" height="176" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">The plant removes</text><text x="46" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Bacteria and viruses</text><text x="46" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sediment and cloudiness</text><text x="46" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Some taste and odor</text><text x="46" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hardness only if the plant</text><text x="46" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">runs a softening step</text><rect class="box" x="270" y="222" width="220" height="176" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="286" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">The plant adds</text><text x="286" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">A disinfectant residual:</text><text x="286" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">chlorine or chloramine</text><text x="286" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">(EPA cap: 4.0 mg/L)</text><text x="286" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">pH or corrosion control</text><rect class="box" x="510" y="222" width="220" height="176" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="526" y="252" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#c2410c">Reaches your softener</text><text x="526" y="280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Calcium and magnesium</text><text x="526" y="304" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">The disinfectant residual</text><text x="526" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">(resin cannot remove it)</text><text x="526" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hardness that shifts with</text><text x="526" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">the utility’s source blend</text><path d="M30,440 L80,440" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hard water (not yet softened)</text><path d="M330,440 L380,440" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="445" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Softened water</text><text x="30" y="478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hardness is not regulated under EPA drinking water rules, so the plant is not required to remove it.</text>
</svg>
