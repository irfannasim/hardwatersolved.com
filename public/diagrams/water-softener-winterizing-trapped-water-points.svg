<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 584" width="760" height="584" role="img" aria-labelledby="wtz-title wtz-desc">
<title id="wtz-title">Winterizing a water softener: trapped water points in the valve</title>
<desc id="wtz-desc">Schematic of a water softener control valve, bypass, drained mineral tank and brine tank marking six places where water stays after a gravity drain: the piston bore, injector passages, drain port and flow control, meter housing, bypass cavities and the brine line.</desc>
<defs><pattern id="wtz-b" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="wtz-s" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f1f5f9"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#b6c2d1"/></pattern></defs>
<rect width="760" height="584" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Winterizing a softener: where water hides after draining</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Tipping a tank empties the tank, not the valve. The numbered pockets stay full.</text><path class="ln" d="M70,146 L170,146" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M70,170 L170,170" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="151" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">in</text><text x="64" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">out</text><text x="30" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">disconnected plumbing</text><rect x="170" y="132" width="70" height="52" rx="6" fill="#3a5a72"/><text x="205" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">bypass</text><path class="ln" d="M240,146 L262,146 M240,170 L262,170" fill="none" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="184" width="80" height="146" rx="16" fill="url(#wtz-b)" stroke="#3a5a72" stroke-width="2"/><rect class="box" x="262" y="116" width="198" height="70" rx="8" fill="#0b2f4a"/><rect x="422" y="102" width="30" height="16" rx="3" fill="#3a5a72"/><rect x="270" y="184" width="34" height="16" rx="3" fill="#3a5a72"/><rect x="290" y="150" width="130" height="16" rx="4" fill="#335b7d"/><text x="360" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text><path class="ln" d="M460,128 L540,128 L540,210" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="492" y="121" width="16" height="14" rx="2" fill="#0b2f4a"/><text x="548" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">drain</text><rect x="580" y="234" width="110" height="96" rx="6" fill="url(#wtz-s)" stroke="#3a5a72" stroke-width="2"/><path class="ln" d="M460,170 L620,170 L620,318" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">brine tank</text><text x="360" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">mineral tank (drained)</text><circle cx="355" cy="158" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="355" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="437" cy="94" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="437" y="99" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="500" cy="104" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="500" y="109" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="287" cy="212" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="287" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><circle cx="205" cy="158" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="205" y="163" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><circle cx="646" cy="282" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="646" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><circle cx="42" cy="387" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="42" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="62" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Piston or rotor bore: water between the seals</text><circle cx="42" cy="417" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="42" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="62" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Injector passages and screen cavity</text><circle cx="42" cy="447" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="42" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="62" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drain port and drain line flow control</text><circle cx="402" cy="387" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="402" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="422" y="392" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Meter or turbine housing (metered valves)</text><circle cx="402" cy="417" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="402" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="422" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Bypass cavities on both sides of the seals</text><circle cx="402" cy="447" r="12" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="402" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">6</text><text x="422" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Brine line: holds a column of water</text><rect class="box" x="30" y="480" width="700" height="62" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="46" y="504" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Get it out:</tspan> remove any drain plugs and the injector cap, then blow low-pressure air</text><text x="46" y="527" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">(well under house pressure) through the inlet, outlet and brine ports. Cycle the bypass.</text><text x="30" y="566" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Valve internals vary by model: this is a schematic, not a cutaway of any one valve.</text>
</svg>
