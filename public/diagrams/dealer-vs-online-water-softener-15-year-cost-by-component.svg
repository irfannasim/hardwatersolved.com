<text x="380" y="416" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">The dealer premium here: about $2,575 over 15 years, about $172 a year</text>
<text x="380" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">It buys testing, sizing, installation, warranty labor and service visits.</text>
<text x="380" y="458" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">A $2,500 quote cuts the gap to about $1,575; a $5,000 quote raises it to about $4,075.</text>
