<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 564" width="760" height="564" role="img" aria-labelledby="wtc-title wtc-desc">
<title id="wtc-title">Water softener tank vs whole-house carbon filter tank</title>
<desc id="wtc-desc">Side-by-side cutaway of a water softener tank filled with resin beads and connected to a brine tank of salt, and a whole-house carbon filter tank filled with granular activated carbon with no brine tank, showing that the two look alike but remove different things.</desc>
<defs><marker id="wtc-m7c3aed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="564" fill="#ffffff"/>
<defs><pattern id="wtc-resin" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f6ead2"/><circle cx="4" cy="4" r="3.2" fill="#e2b865"/><circle cx="11" cy="10" r="3.2" fill="#e2b865"/></pattern><pattern id="wtc-carbon" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#334155"/><path d="M2,3 l4,-1 l2,3 l-3,3 z M9,8 l4,1 l-1,4 l-4,-1 z" fill="#64748b"/></pattern><pattern id="wtc-salt" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#ede9fe"/><rect x="2" y="2" width="4" height="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1"/></pattern></defs><text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Softener tank vs whole-house carbon filter tank</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The same kind of tank and valve. What is inside, and beside it, differs.</text><text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Water softener</text><rect x="75" y="100" width="80" height="26" rx="4" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="1.5"/><rect x="60" y="126" width="110" height="300" rx="34" fill="#dbeafe" stroke="#3a5a72" stroke-width="3"/><rect x="65" y="196" width="100" height="224" rx="30" fill="url(#wtc-resin)"/><path d="M115,126 L115,410" stroke="#94a3b8" stroke-width="4"/><rect x="72" y="290" width="86" height="30" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="115" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Resin</text><rect x="215" y="250" width="110" height="176" rx="8" fill="url(#wtc-salt)" stroke="#7c3aed" stroke-width="2.5"/><rect x="230" y="316" width="80" height="30" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="270" y="337" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7c3aed">Brine tank</text><path class="ln" d="M155,113 L270,113 L270,246" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="92" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Whole-house carbon filter</text><rect x="455" y="100" width="80" height="26" rx="4" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="1.5"/><rect x="440" y="126" width="110" height="300" rx="34" fill="#dbeafe" stroke="#3a5a72" stroke-width="3"/><rect x="445" y="196" width="100" height="224" rx="30" fill="url(#wtc-carbon)"/><path d="M495,126 L495,410" stroke="#94a3b8" stroke-width="4"/><rect x="452" y="290" width="86" height="30" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="495" y="311" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Carbon</text><rect class="box" x="595" y="250" width="110" height="176" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/><text x="650" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">No brine</text><text x="650" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">tank</text><rect class="box" x="30" y="448" width="340" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Removes: calcium and magnesium</text><text x="46" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Leaves: chlorine, sediment, VOCs</text><text x="46" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Capacity: grains between regenerations</text><rect class="box" x="390" y="448" width="340" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="406" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Removes: chlorine, taste, organics</text><text x="406" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Leaves: calcium and magnesium</text><text x="406" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Capacity: gallons or years of service</text>
</svg>
