<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="cst-title cst-desc">
<title id="cst-title">Chloramine water softener risk: utility disinfectant switch timeline (illustrative)</title>
<desc id="cst-desc">Illustrative 18-month timeline in which a utility switches from free chlorine to chloramine in July: carbon sized for free chlorine stops protecting the water softener resin, while the tap stays soft and gives no warning.</desc>
<defs></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">A disinfectant switch the softener never announces</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative 18 months with carbon sized for free chlorine ahead of the softener.</text><text x="205" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">J</text><text x="235" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">F</text><text x="265" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">M</text><text x="295" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">A</text><text x="325" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">M</text><text x="355" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">J</text><text x="385" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">J</text><text x="415" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">A</text><text x="445" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">S</text><text x="475" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">O</text><text x="505" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">N</text><text x="535" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">D</text><text x="565" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">J</text><text x="595" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">F</text><text x="625" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">M</text><text x="655" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">A</text><text x="685" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">M</text><text x="715" y="104" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#52697a">J</text><text x="370" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Year 1</text><text x="640" y="86" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Year 2</text><path d="M550,78 L550,420" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">What the</text><text x="30" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">utility sends</text><text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">What reaches</text><text x="30" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">the resin</text><text x="30" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">What you</text><text x="30" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">notice</text><rect class="box" x="192" y="120" width="176" height="70" rx="4" fill="#f1f5f9" stroke="#3a5a72" stroke-width="1.5"/><text x="280" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Free chlorine</text><text x="280" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">1 mg/L</text><rect class="box" x="372" y="120" width="236" height="70" rx="4" fill="#e0e7ff" stroke="#0b2f4a" stroke-width="1.5"/><text x="490" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Chloramine from July</text><text x="490" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">permanent switch</text><rect class="box" x="612" y="120" width="26" height="70" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><rect class="box" x="642" y="120" width="86" height="70" rx="4" fill="#e0e7ff" stroke="#0b2f4a" stroke-width="1.5"/><text x="685" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Chloramine</text><rect class="box" x="192" y="220" width="176" height="70" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="280" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">Almost none</text><text x="280" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">carbon keeps up</text><rect class="box" x="372" y="220" width="356" height="70" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="550" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">Chloramine breaks through the undersized carbon</text><text x="550" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">resin is exposed every day from here on</text><rect class="box" x="192" y="320" width="536" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="460" y="350" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Soft water, no taste change, no alarm</text><text x="460" y="368" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">capacity loss shows up years later, not this year</text><text x="625" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#c2410c">burn</text><text x="30" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Burn = a temporary switch back to free chlorine, often a few weeks each year.</text><text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Check the disinfectant after every utility notice, and test total chlorine</text><text x="30" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">after the carbon, not just free chlorine.</text><text x="30" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative dates. Your utility’s schedule and residuals will differ.</text>
</svg>
