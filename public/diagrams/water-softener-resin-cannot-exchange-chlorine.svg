<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="cl-title cl-desc">
<title id="cl-title">Why water softener resin cannot remove chlorine</title>
<desc id="cl-desc">Diagram of why a water softener cannot remove chlorine: the resin swaps calcium and magnesium for sodium on fixed negative sites, while neutral hypochlorous acid and chloramine, and negative hypochlorite, pass through to the tap.</desc>
<defs><marker id="cl-ink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="cl-muted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="cl-tink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker><marker id="cl-tmuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><marker id="cl-steel" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why a water softener cannot remove chlorine</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Resin trades charged ions. Chlorine and chloramine have nothing to trade.</text><circle cx="380" cy="228" r="86" fill="#e2b865" stroke="#b7791f" stroke-width="3"/><text x="445" y="261" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−</text><text x="407" y="299" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−</text><text x="353" y="299" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−</text><text x="315" y="261" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−</text><text x="315" y="207" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−</text><text x="353" y="169" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−</text><text x="407" y="169" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−</text><text x="445" y="207" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0b2f4a">−</text><text x="380" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">resin bead</text><text x="380" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">fixed − sites</text><text x="380" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">hold Na⁺</text><text x="60" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Ca²⁺</text><path class="ln" d="M110,190 L291,190" fill="none" stroke="#0b2f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cl-ink)"/><text x="60" y="241" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Mg²⁺</text><path class="ln" d="M110,236 L282,236" fill="none" stroke="#0b2f4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cl-ink)"/><text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Held more strongly than Na⁺:</text><text x="60" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">swapped onto the resin</text><path class="ln" d="M476,200 L560,200" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cl-muted)"/><text x="570" y="205" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#52697a">Na⁺ released</text><text x="30" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Passes straight through:</text><text x="30" y="389" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">HOCl</tspan> (hypochlorous acid): neutral</text><path class="ln" d="M384,384 L660,384" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cl-steel)"/><text x="30" y="423" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Chloramine</tspan>: neutral</text><path class="ln" d="M384,418 L660,418" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cl-steel)"/><text x="30" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">OCl⁻</tspan> (hypochlorite): negative, no anion sites</text><path class="ln" d="M384,452 L660,452" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cl-steel)"/><text x="670" y="423" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#3a5a72">to tap</text><rect class="box" x="30" y="480" width="700" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="380" y="505" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#dc2626">On the way past, chlorine reacts with the resin polymer. That is damage, not removal.</text>
</svg>
