<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="wwc-title wwc-desc">
<title id="wwc-title">Water softener warranties compared: tank term vs electronics term by brand</title>
<desc id="wwc-desc">Bar chart of water softener warranties compared by component for 15 brands: most tanks are covered for 10 years or lifetime, while the electronics or control head is covered for between 1 year and lifetime, with Whirlpool, GE, Rheem, Morton and the EcoWater 1500 at 3 years or less.</desc>
