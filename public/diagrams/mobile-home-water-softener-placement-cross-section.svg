<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="mh-title mh-desc">
<title id="mh-title">Where to put a water softener in a mobile or manufactured home</title>
<desc id="mh-desc">Cross-section of a manufactured home: the supply riser rises inside the skirting with heat tape, the main is rerouted up through the floor to a water softener in the utility closet and back down to the first branch, the softener drains to the washer standpipe, and a softener under the home is marked as a freeze risk.</desc>
<defs>
<marker id="mh-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="mh-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="mh-drain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
<pattern id="mh-beads" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f6ead2"/><circle cx="4" cy="4" r="2.4" fill="#e2b865"/></pattern>
</defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Softener placement in a manufactured home</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Cross-section. The softener must come before the first branch and stay above 33°F.</text>
<rect x="170" y="110" width="530" height="190" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="170" y="296" width="530" height="8" fill="#3a5a72"/>
<line x1="170" y1="304" x2="170" y2="470" stroke="#52697a" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="700" y1="304" x2="700" y2="470" stroke="#52697a" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="200" y="304" width="20" height="14" fill="#0b2f4a"/>
<rect x="640" y="304" width="20" height="14" fill="#0b2f4a"/>
<rect x="202" y="318" width="16" height="152" fill="#cbd5e1"/>
<rect x="642" y="318" width="16" height="152" fill="#cbd5e1"/>
<rect x="30" y="470" width="700" height="24" fill="#f1f5f9"/>
<line x1="30" y1="470" x2="730" y2="470" stroke="#52697a" stroke-width="2"/>
<text x="186" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#15803d">Utility closet: first choice</text>
<rect x="398" y="206" width="30" height="14" rx="3" fill="#0b2f4a"/>
<rect x="402" y="220" width="22" height="76" rx="8" fill="url(#mh-beads)" stroke="#3a5a72" stroke-width="2"/>
<rect x="434" y="246" width="34" height="50" rx="4" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<path class="ln" d="M300,494 L300,340 L360,340 L360,213 L392,213" fill="none" stroke="#c2410c" stroke-width="5" stroke-linejoin="round" marker-end="url(#mh-hard)"/>
<path class="ln" d="M428,213 L490,213 L490,340 L612,340" fill="none" stroke="#0e7490" stroke-width="5" stroke-linejoin="round" marker-end="url(#mh-soft)"/>
<path class="ln" d="M413,206 L413,180 L560,180 L560,226" fill="none" stroke="#78716c" stroke-width="4" stroke-linejoin="round" marker-end="url(#mh-drain)"/>
<rect x="552" y="238" width="16" height="58" fill="#e7e5e4" stroke="#78716c" stroke-width="2"/>
<text x="578" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">washer</text>
<text x="578" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">standpipe</text>
<text x="190" y="206" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">main rerouted up</text>
<text x="190" y="224" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">through the floor</text>
<text x="506" y="364" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">first branch</text>
<path d="M292,470 L292,352 M308,470 L308,352" fill="none" stroke="#52697a" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="318" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">supply riser, heat</text>
<text x="318" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">tape and insulation</text>
<rect class="box" x="470" y="384" width="150" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
<text x="545" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">Under the skirting:</text>
<text x="545" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">freeze risk</text>
<rect class="box" x="40" y="384" width="100" height="86" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2" stroke-dasharray="6 4"/>
<text x="90" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Heated</text>
<text x="90" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">enclosure:</text>
<text x="90" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">last resort</text>
<text x="162" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">skirting</text>
<rect x="30" y="522" width="26" height="6" rx="3" fill="#c2410c"/>
<text x="64" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">untreated supply</text>
<rect x="210" y="522" width="26" height="6" rx="3" fill="#0e7490"/>
<text x="244" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">softened</text>
<rect x="340" y="522" width="26" height="6" rx="3" fill="#78716c"/>
<text x="374" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">softener drain</text>
<rect x="490" y="520" width="26" height="10" fill="#0b2f4a"/>
<text x="524" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">chassis beam and pier</text>
</svg>
