<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="g3pt-title g3pt-desc">
<title id="g3pt-title">Waterdrop G3P600 TDS faucet reading scale</title>
<desc id="g3pt-desc">Scale showing the Waterdrop G3P600 faucet TDS reading as a share of tap water TDS: 5 to 10 percent is normal, 15 to 20 percent means replace the RO filter. Worked values for 150, 300 and 600 ppm tap water.</desc>
<defs><pattern id="g3pt-w" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1f5f9"/><rect width="3" height="8" fill="#cbd5e1"/></pattern></defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Reading the G3P600 faucet: TDS out as a share of TDS in</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Thresholds from the Waterdrop manual. Test your tap water first, then compare.</text><rect x="200" y="118" width="212.0" height="44" fill="#0e7490"/><rect x="412" y="118" width="106.0" height="44" fill="url(#g3pt-w)" stroke="#52697a" stroke-width="1"/><rect x="518" y="118" width="212.0" height="44" fill="#dc2626"/><text x="306" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Normal: 5 to 10%</text><text x="465" y="106" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Watch</text><text x="624" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Replace: 15 to 20%</text><text x="30" y="138" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Share of</text><text x="30" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">feed TDS</text><path class="ln" d="M200,162 L200,170" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0%</text><path class="ln" d="M306,162 L306,170" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="306" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5%</text><path class="ln" d="M412,162 L412,170" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="412" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">10%</text><path class="ln" d="M518,162 L518,170" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="518" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">15%</text><path class="ln" d="M624,162 L624,170" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="624" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">20%</text><path class="ln" d="M730,162 L730,170" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="730" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">25%</text><text x="30" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#52697a">Tap water TDS</text><text x="412" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">At 10%</text><text x="518" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">At 15%</text><text x="624" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#52697a">At 20%</text><path class="ln" d="M30,254 L730,254" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">150 ppm in</text><text x="412" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0e7490">15 ppm</text><text x="518" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0b2f4a">23 ppm</text><text x="624" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#dc2626">30 ppm</text><path class="ln" d="M30,294 L730,294" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">300 ppm in</text><text x="412" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0e7490">30 ppm</text><text x="518" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0b2f4a">45 ppm</text><text x="624" y="320" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#dc2626">60 ppm</text><path class="ln" d="M30,334 L730,334" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">600 ppm in</text><text x="412" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0e7490">60 ppm</text><text x="518" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#0b2f4a">90 ppm</text><text x="624" y="360" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#dc2626">120 ppm</text><rect class="box" x="30" y="410" width="700" height="92" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="436" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Ignore the first 10 to 30 seconds: water standing in the tubing reads high.</text><text x="46" y="460" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">After days unused, run the faucet before judging the number.</text><text x="46" y="484" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Warranty needs feed TDS under 750 ppm and hardness under 7 gpg.</text>
</svg>
