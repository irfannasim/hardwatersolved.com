<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="swh-title swh-desc">
<title id="swh-title">Water softener and water heater: scale per year and gas efficiency, hard versus softened water</title>
<desc id="swh-desc">Bar and line chart from the WQRF Battelle study: gas storage heaters formed 1.16 lb of scale a year on 26 gpg water versus 0.01 lb softened, electric about 2.1 versus 0.03 lb, and gas efficiency fell from 70.4 to 67.4 percent on hard water while staying flat on softened water.</desc>
<defs></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water softener and water heater: what the lab measured</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">WQRF/Battelle accelerated test, 26 gpg well water vs softened water, results in equivalent years.</text><rect class="box" x="30" y="86" width="340" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="46" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Scale formed per year (lb)</text><path d="M80,400 L350,400" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="70" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text><path d="M80,295.8333333333333 L350,295.8333333333333" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="70" y="300.8333333333333" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">1</text><path d="M80,191.66666666666666 L350,191.66666666666666" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="70" y="196.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">2</text><rect x="96" y="279.1666666666667" width="42" height="120.83333333333331" fill="#c2410c"/><text x="117" y="271.1666666666667" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">1.16</text><rect x="146" y="398" width="42" height="2" fill="#0e7490"/><text x="167" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">0.01</text><rect x="236" y="181.24999999999997" width="42" height="218.75000000000003" fill="#c2410c"/><text x="257" y="173.24999999999997" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c2410c">about 2.1</text><rect x="286" y="396.875" width="42" height="3.125" fill="#0e7490"/><text x="307" y="388.875" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">0.03</text><path d="M80,400 L350,400" fill="none" stroke="#3a5a72" stroke-width="1.5"/><text x="142" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Gas storage</text><text x="282" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Electric storage</text><text x="46" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">Electric hard-water figure scaled from 0.4 lb per 5 gpg.</text><rect class="box" x="390" y="86" width="340" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="406" y="114" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Gas storage thermal efficiency</text><path d="M440,400 L710,400" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="430" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">60%</text><path d="M440,323.33333333333337 L710,323.33333333333337" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="430" y="328.33333333333337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">64%</text><path d="M440,246.66666666666669 L710,246.66666666666669" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="430" y="251.66666666666669" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">68%</text><path d="M440,170 L710,170" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="430" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">72%</text><path d="M440,400 L710,400" fill="none" stroke="#3a5a72" stroke-width="1.5"/><path d="M470,200.66666666666657 L670,258.1666666666666" fill="none" stroke="#c2410c" stroke-width="4"/><path d="M470,196.66666666666657 L670,196.66666666666657" fill="none" stroke="#0e7490" stroke-width="4"/><circle cx="470" cy="200.66666666666657" r="5" fill="#0b2f4a"/><circle cx="670" cy="258.1666666666666" r="5" fill="#c2410c"/><text x="476" y="178.66666666666657" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">70.4% at start</text><text x="666" y="282.1666666666666" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#c2410c">67.4% hard</text><text x="666" y="184.66666666666657" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#0e7490">flat on soft</text><text x="470" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Start</text><text x="670" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2 years</text><text x="406" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">Electric units: no measured energy difference.</text><text x="30" y="496" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">Source: WQA recertification article on the WQRF Softened Water Benefits Study; WQRF two-page summary.</text>
</svg>
