<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="hts-title hts-desc">
<title id="hts-title">Hardness returning before regeneration: four timing signatures (illustrative)</title>
<desc id="hts-desc">Four illustrative charts of hard water returning before water softener regeneration: a climb on the same day each cycle, random breakthrough, a sudden permanent jump, and hardness only on the last evening before the cycle.</desc>
<defs></defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">When hardness returns: four timing signatures</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative patterns, not measurements. Log the day hardness appears over two full cycles.</text>
<rect class="box" x="30" y="96" width="340" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="44" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">1. Same day every cycle, climbing</text>
<text x="44" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hardness setting too low, or unit undersized</text>
<path d="M60,160 L60,246 L354,246" fill="none" stroke="#3a5a72" stroke-width="1.2"/>
<path d="M205,160 L205,246" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M350,160 L350,246" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path class="ln" d="M60.0,246.0 L168.8,246.0 L180.7,236.4 L192.7,217.2 L205.0,178.8 L205.0,246.0 L313.8,246.0 L325.7,236.4 L337.7,217.2 L350.0,178.8" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">soft</text>
<text x="350" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">days →</text>
<text x="67.25" y="196.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#0b2f4a">day 4: 1 → 3 → 7 gpg</text>
<rect class="box" x="390" y="96" width="340" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="404" y="120" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">2. Random, no pattern</text>
<text x="404" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">channelling, fouling or low flow</text>
<path d="M420,160 L420,246 L714,246" fill="none" stroke="#3a5a72" stroke-width="1.2"/>
<path d="M516.6666666666666,160 L516.6666666666666,246" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M613.3333333333333,160 L613.3333333333333,246" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M710,160 L710,246" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path class="ln" d="M420.0,246.0 L502.9,246.0 L508.4,190.0 L516.7,182.0 L516.7,246.0 L544.3,246.0 L549.8,190.0 L613.3,182.0 L613.3,246.0 L682.4,246.0 L687.9,190.0 L710.0,182.0" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="404" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">soft</text>
<text x="710" y="272" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">days →</text>
<text x="461.42857142857144" y="236.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">6 good days</text>
<text x="533.2380952380952" y="236.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">2</text>
<text x="647.8571428571429" y="236.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">5</text>
<rect class="box" x="30" y="298" width="340" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="44" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">3. Sudden, then stays hard</text>
<text x="44" y="341" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">missed cycle, salt bridge, clock reset, bypass</text>
<path d="M60,362 L60,448 L354,448" fill="none" stroke="#3a5a72" stroke-width="1.2"/>
<path d="M156.66666666666666,362 L156.66666666666666,448" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M253.33333333333331,362 L253.33333333333331,448" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M350,362 L350,448" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path class="ln" d="M60.0,448.0 L192.9,448.0 L195.3,368.0 L350.0,368.0" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="474" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">soft</text>
<text x="350" y="474" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">days →</text>
<text x="272.6666666666667" y="358.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0b2f4a">stays near raw hardness</text>
<rect class="box" x="390" y="298" width="340" height="186" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="404" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">4. Only the last evening</text>
<text x="404" y="341" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">reserve set too low or to zero</text>
<path d="M420,362 L420,448 L714,448" fill="none" stroke="#3a5a72" stroke-width="1.2"/>
<path d="M565,362 L565,448" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M710,362 L710,448" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/>
<path class="ln" d="M420.0,448.0 L554.1,448.0 L557.8,408.0 L563.2,408.0 L565.0,448.0 L699.1,448.0 L702.8,408.0 L708.2,408.0 L710.0,448.0" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="404" y="474" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#52697a">soft</text>
<text x="710" y="474" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">days →</text>
<text x="550.5" y="390.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#0b2f4a">a few hours hard</text>
<rect x="30" y="506" width="26" height="5" rx="2" fill="#c2410c"/><text x="64" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hardness at the tap</text>
<path d="M230,509 L256,509" stroke="#3a5a72" stroke-width="1.2" stroke-dasharray="4 4"/><text x="264" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">regeneration</text>
</svg>
