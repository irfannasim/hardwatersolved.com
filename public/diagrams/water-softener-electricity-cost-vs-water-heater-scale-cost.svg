<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="g22e-title g22e-desc">
<title id="g22e-title">Water softener electricity usage cost compared with the energy cost of scale in a water heater</title>
<desc id="g22e-desc">Calculated bar chart at 18 cents per kWh: a softener control valve costs about 5 to 8 dollars a year, 15 dollars at its 9.6 VA nameplate ceiling. Scale in a gas storage water heater costs about 9 to 57 dollars a year from 5 to 25 gpg on a 300 dollar heating bill, using Battelle figures; an electric storage heater showed no energy difference.</desc>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">The valve's power bill vs the energy that scale wastes</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Calculated, dollars a year: electricity 18 cents/kWh; gas water heating $300 a year; scale losses from Battelle</text>

<text x="30" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Softener valve, typical</text>
<text x="30" y="129" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">3 to 5 W all year (illustrative)</text>
<rect x="260" y="100" width="53" height="26" fill="#3a5a72"/>
<text x="321" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">$5 to $8</text>

<text x="30" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Softener valve, ceiling</text>
<text x="30" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">9.6 VA transformer rating</text>
<rect x="260" y="146" width="103" height="26" fill="#3a5a72"/>
<text x="371" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">$15</text>

<text x="30" y="204" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Gas heater scale, 5 gpg</text>
<text x="30" y="221" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">3.1% of $300</text>
<rect x="260" y="192" width="62" height="26" fill="#c2410c"/>
<text x="330" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">$9</text>

<text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Gas heater scale, 10 gpg</text>
<text x="30" y="267" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">6.6% of $300</text>
<rect x="260" y="238" width="132" height="26" fill="#c2410c"/>
<text x="400" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">$20</text>

<text x="30" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Gas heater scale, 15 gpg</text>
<text x="30" y="313" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">10.3% of $300</text>
<rect x="260" y="284" width="206" height="26" fill="#c2410c"/>
<text x="474" y="302" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">$31</text>

<text x="30" y="342" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Gas heater scale, 25 gpg</text>
<text x="30" y="359" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">19.0% of $300</text>
<rect x="260" y="330" width="380" height="26" fill="#c2410c"/>
<text x="648" y="348" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">$57</text>

<text x="30" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Electric storage heater</text>
<text x="30" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">any hardness</text>
<text x="268" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0b2f4a">$0: no energy difference measured</text>

<path class="ln" d="M260,426 L660,426" stroke="#0b2f4a" stroke-width="2" fill="none"/>
<path class="ln" d="M260,426 L260,434 M393,426 L393,434 M527,426 L527,434 M660,426 L660,434" stroke="#0b2f4a" stroke-width="1.5" fill="none"/>
<text x="260" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">$0</text>
<text x="393" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">$20</text>
<text x="527" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">$40</text>
<text x="660" y="452" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#52697a">$60</text>
<text x="460" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">dollars a year</text>

<rect class="box" x="30" y="486" width="700" height="56" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="380" y="509" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">On a gas heater, hard water above about 5 gpg costs more than the valve.</text>
<text x="380" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">On an electric storage heater the trade is element life, not energy.</text>
</svg>
