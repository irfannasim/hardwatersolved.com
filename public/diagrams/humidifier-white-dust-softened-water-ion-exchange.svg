<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" role="img" aria-labelledby="hwd-title hwd-desc">
<title id="hwd-title">Humidifier white dust and softened water: why ion exchange does not stop it</title>
<desc id="hwd-desc">Diagram showing why a water softener does not stop humidifier white dust: the resin swaps one calcium ion for two sodium ions, so total dissolved solids stay about the same and an ultrasonic humidifier still turns them into dust, while distilled or RO water leaves almost none.</desc>
<defs><pattern id="hwd-b" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><marker id="hwd-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b2f4a"/></marker></defs>
<rect width="760" height="556" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why a water softener doesn't stop humidifier white dust</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The ultrasonic plate sprays out whatever is dissolved. Softening swaps ions; it removes none.</text><rect class="box" x="30" y="90" width="150" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="105" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Tap water</text><circle cx="78" cy="156" r="18" fill="#c2410c"/><text x="78" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Ca²⁺</text><circle cx="130" cy="156" r="18" fill="#c2410c"/><text x="130" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Mg²⁺</text><circle cx="70" cy="198" r="7" fill="#94a3b8"/><circle cx="104" cy="204" r="7" fill="#94a3b8"/><circle cx="138" cy="196" r="7" fill="#94a3b8"/><text x="105" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">hardness plus other</text><text x="105" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">dissolved solids</text><path class="ln" d="M184,190 L204,190" fill="none" stroke="#0b2f4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwd-a)"/><rect class="box" x="210" y="90" width="150" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="285" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener resin</text><rect x="235" y="130" width="100" height="40" rx="6" fill="url(#hwd-b)" stroke="#3a5a72" stroke-width="1.5"/><text x="285" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">holds Ca²⁺ and Mg²⁺,</text><text x="285" y="221" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">2 Na⁺ out for each</text><text x="285" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Nothing is</text><text x="285" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">removed</text><path class="ln" d="M364,190 L384,190" fill="none" stroke="#0b2f4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwd-a)"/><rect class="box" x="390" y="90" width="150" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="465" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softened water</text><circle cx="414" cy="156" r="15" fill="#0e7490"/><text x="414" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na⁺</text><circle cx="448" cy="156" r="15" fill="#0e7490"/><text x="448" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na⁺</text><circle cx="482" cy="156" r="15" fill="#0e7490"/><text x="482" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na⁺</text><circle cx="516" cy="156" r="15" fill="#0e7490"/><text x="516" y="161" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Na⁺</text><circle cx="438" cy="198" r="7" fill="#94a3b8"/><circle cx="472" cy="204" r="7" fill="#94a3b8"/><circle cx="506" cy="196" r="7" fill="#94a3b8"/><text x="465" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">TDS about the same,</text><text x="465" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">often slightly higher</text><path class="ln" d="M544,190 L564,190" fill="none" stroke="#0b2f4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwd-a)"/><rect class="box" x="570" y="90" width="160" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="650" y="114" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Ultrasonic mist</text><rect x="616" y="184" width="68" height="30" rx="6" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><rect x="632" y="204" width="36" height="5" fill="#3a5a72"/><circle cx="636" cy="170" r="4" fill="#bfdbfe"/><circle cx="650" cy="160" r="4" fill="#bfdbfe"/><circle cx="664" cy="170" r="4" fill="#bfdbfe"/><circle cx="644" cy="148" r="4" fill="#bfdbfe"/><circle cx="658" cy="144" r="4" fill="#bfdbfe"/><circle cx="610" cy="230" r="2.6" fill="#94a3b8"/><circle cx="620" cy="230" r="2.6" fill="#94a3b8"/><circle cx="630" cy="230" r="2.6" fill="#94a3b8"/><circle cx="640" cy="230" r="2.6" fill="#94a3b8"/><circle cx="650" cy="230" r="2.6" fill="#94a3b8"/><circle cx="660" cy="230" r="2.6" fill="#94a3b8"/><circle cx="670" cy="230" r="2.6" fill="#94a3b8"/><circle cx="680" cy="230" r="2.6" fill="#94a3b8"/><circle cx="690" cy="230" r="2.6" fill="#94a3b8"/><text x="650" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">Dust continues:</text><text x="650" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">sodium-based, finer</text><rect class="box" x="30" y="308" width="330" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="195" y="332" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Distilled or RO water</text><circle cx="180" cy="370" r="7" fill="#94a3b8"/><text x="195" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">almost nothing dissolved</text><path class="ln" d="M364,374 L564,374" fill="none" stroke="#0b2f4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hwd-a)"/><rect class="box" x="570" y="308" width="160" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="650" y="332" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Ultrasonic mist</text><rect x="616" y="384" width="68" height="30" rx="6" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/><rect x="632" y="404" width="36" height="5" fill="#3a5a72"/><circle cx="636" cy="370" r="4" fill="#bfdbfe"/><circle cx="650" cy="360" r="4" fill="#bfdbfe"/><circle cx="664" cy="370" r="4" fill="#bfdbfe"/><circle cx="644" cy="348" r="4" fill="#bfdbfe"/><circle cx="658" cy="344" r="4" fill="#bfdbfe"/><text x="650" y="430" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">almost no dust</text><rect class="box" x="30" y="460" width="700" height="78" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="46" y="484" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Yao, Gallagher and Dietrich, Water Research X (2020), 8 hours of running:</text><text x="46" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">soft tap water (42 mg/L hardness, 75 mg/L TDS): about 211 µg/m³ of particles indoors</text><text x="46" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">distilled water: about 25 µg/m³. Median particle 146 nm. TDS is the variable, not hardness.</text>
</svg>
