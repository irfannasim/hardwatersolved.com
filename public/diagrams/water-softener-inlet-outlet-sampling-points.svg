<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" width="760" height="522" role="img" aria-labelledby="wsp-title wsp-desc">
<title id="wsp-title">Water softener inlet and outlet sampling points</title>
<desc id="wsp-desc">Plumbing diagram showing where to test a water softener: an untreated outdoor hose bib for the inlet sample, the nearest cold tap downstream of the softener for the outlet sample, the bypass valve, a tap teed off before the softener, and the kitchen tap at the far end of the system.</desc>
<defs><pattern id="wsp-b" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="wsp-s" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f1f5f9"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#b6c2d1"/></pattern><marker id="wsp-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="760" height="522" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where to sample: inlet and outlet in the same ten minutes</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The pair tells you which half of the system to blame. The kitchen tap alone cannot.</text><path class="ln" d="M30,210 L286,210" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsp-h)"/><path class="ln" d="M394,210 L690,210 L690,150" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M90,210 L90,282" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M160,210 L160,142" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M470,210 L470,282" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M560,198 l8,24 M572,198 l8,24" stroke="#ffffff" stroke-width="5"/><path d="M560,198 l8,24 M572,198 l8,24" stroke="#3a5a72" stroke-width="1.5"/><text x="600" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">long run through the house</text><text x="30" y="196" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">SUPPLY</text><rect x="78" y="282" width="24" height="14" rx="4" fill="#c2410c"/><rect x="94" y="294" width="8" height="12" rx="2" fill="#c2410c"/><rect x="148" y="126" width="24" height="14" rx="4" fill="#c2410c"/><rect x="164" y="138" width="8" height="12" rx="2" fill="#c2410c"/><rect x="458" y="282" width="24" height="14" rx="4" fill="#0e7490"/><rect x="474" y="294" width="8" height="12" rx="2" fill="#0e7490"/><rect x="678" y="134" width="24" height="14" rx="4" fill="#0e7490"/><rect x="694" y="146" width="8" height="12" rx="2" fill="#0e7490"/><text x="182" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Tap teed off before the softener:</text><text x="182" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">reads hard even when all is well</text><text x="730" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">KITCHEN TAP</text><text x="730" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">far end: where most people test</text><rect x="230" y="198" width="30" height="24" rx="4" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="245" y="182" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">bypass: in service?</text><rect class="box" x="290" y="188" width="104" height="44" rx="6" fill="#0b2f4a"/><text x="342" y="215" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><rect x="298" y="234" width="40" height="120" rx="12" fill="url(#wsp-b)" stroke="#3a5a72" stroke-width="2"/><rect x="348" y="290" width="40" height="64" rx="5" fill="url(#wsp-s)" stroke="#3a5a72" stroke-width="2"/><text x="342" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">A blend valve may leave</text><text x="342" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2–3 gpg on purpose</text><rect class="box" x="30" y="310" width="200" height="104" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="44" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#c2410c">INLET SAMPLE</text><text x="44" y="355" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Outdoor hose bib, untreated.</text><text x="44" y="375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Must read hard. If it reads</text><text x="44" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">zero, that line is softened.</text><rect class="box" x="430" y="310" width="300" height="104" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/><text x="444" y="334" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">OUTLET SAMPLE</text><text x="444" y="355" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sample tap on the outlet pipe, or the</text><text x="444" y="375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">nearest cold tap downstream (laundry</text><text x="444" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">or utility sink): a few feet, not fifty</text><rect class="box" x="30" y="434" width="700" height="36" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="380" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a"><tspan font-weight="bold">Same kit</tspan> · <tspan font-weight="bold">same 10 minutes</tspan> · <tspan font-weight="bold">cold water</tspan> · run each tap 30 s first</text><rect x="30" y="494" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard / untreated water</text><rect x="250" y="494" width="26" height="6" rx="3" fill="#0e7490"/><text x="284" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text>
</svg>
