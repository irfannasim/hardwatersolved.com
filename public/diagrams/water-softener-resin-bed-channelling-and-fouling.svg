<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="rbc-title rbc-desc">
<title id="rbc-title">Water softener resin bed channelling and fouling</title>
<desc id="rbc-desc">Cutaway of a water softener resin tank: hard water carves a channel through the bed so that resin exhausts fast while the rest is barely used, with silt on the bed, a backwash crater and a cracked distributor also shown, plus how healthy and fouled resin beads look.</desc>
<defs><pattern id="rbc-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><pattern id="rbc-silt" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#d6d3d1"/><circle cx="2" cy="3" r="1.3" fill="#78716c"/><circle cx="6" cy="6" r="1" fill="#57534e"/></pattern><marker id="rbc-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="rbc-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="rbc-t" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Resin bed channelling and fouling</text>
<text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Why hardness breaks through at random: water stops passing evenly through the resin.</text>
<rect x="300" y="100" width="80" height="22" rx="4" fill="#0b2f4a"/>
<rect x="250" y="122" width="180" height="330" rx="30" fill="#f4f9fb" stroke="#3a5a72" stroke-width="2"/>
<rect x="256" y="178" width="168" height="266" rx="24" fill="url(#rbc-beads)"/>
<path d="M256,164 L424,164 L424,180 L256,180 z" fill="url(#rbc-silt)"/>
<path d="M372,164 Q386,184 402,164 z" fill="#f4f9fb"/>
<path d="M284,168 C300,230 268,280 290,330 C306,372 282,404 296,436" fill="none" stroke="#fdba74" stroke-width="20" stroke-linecap="round"/>
<path class="ln" d="M284,168 C300,230 268,280 290,330 C306,372 282,404 296,436" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rbc-h)"/>
<rect x="335" y="118" width="10" height="312" fill="#94a3b8"/>
<rect x="326" y="424" width="28" height="14" rx="3" fill="#64748b"/>
<path d="M333,292 L347,298 L333,304 L347,310" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<path class="ln" d="M310,300 L330,300" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rbc-f)"/>
<text x="30" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Silt and grit on the bed</text>
<text x="30" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">often an unchanged prefilter</text>
<path class="ln" d="M206,156 L260,170" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rbc-t)"/>
<text x="30" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water carves a channel</text>
<text x="30" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin along the route</text>
<text x="30" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">exhausts fast</text>
<path class="ln" d="M190,262 L270,272" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rbc-t)"/>
<text x="30" y="360" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Compacted or fouled bed</text>
<path class="ln" d="M208,358 L262,380" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rbc-t)"/>
<text x="30" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">makes channelling</text>
<text x="30" y="395" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">more likely, as does</text>
<text x="30" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">chronically low flow</text>
<text x="452" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Crater or crust on the surface</text>
<text x="452" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">backwash is not fluidising the bed</text>
<path class="ln" d="M448,152 L396,170" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rbc-t)"/>
<text x="452" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Rest of the bed</text>
<text x="452" y="248" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">barely used</text>
<path class="ln" d="M448,240 L404,250" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rbc-t)"/>
<text x="452" y="296" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Cracked distributor or riser</text>
<text x="452" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water short-circuits the bed</text>
<path class="ln" d="M448,306 L352,302" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rbc-t)"/>
<rect class="box" x="452" y="348" width="278" height="136" rx="10" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="468" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Take the lid off and look</text>
<circle cx="472" cy="392" r="6" fill="#e2b865" stroke="#92400e" stroke-width="0.8"/>
<circle cx="484" cy="395" r="6" fill="#e2b865" stroke="#92400e" stroke-width="0.8"/>
<circle cx="477" cy="404" r="6" fill="#e2b865" stroke="#92400e" stroke-width="0.8"/>
<text x="500" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">amber, translucent: healthy</text>
<circle cx="472" cy="424" r="6" fill="#b45309" stroke="#92400e" stroke-width="0.8"/>
<circle cx="484" cy="427" r="6" fill="#b45309" stroke="#92400e" stroke-width="0.8"/>
<circle cx="477" cy="436" r="6" fill="#b45309" stroke="#92400e" stroke-width="0.8"/>
<text x="500" y="434" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">rust-brown or clumped: fouled</text>
<circle cx="472" cy="456" r="6" fill="#f3e1b3" stroke="#92400e" stroke-width="0.8"/>
<path d="M468,453 L474,460" stroke="#ffffff" stroke-width="2"/>
<circle cx="484" cy="459" r="6" fill="#f3e1b3" stroke="#92400e" stroke-width="0.8"/>
<path d="M480,456 L486,463" stroke="#ffffff" stroke-width="2"/>
<circle cx="477" cy="468" r="6" fill="#f3e1b3" stroke="#92400e" stroke-width="0.8"/>
<path d="M473,465 L479,472" stroke="#ffffff" stroke-width="2"/>
<text x="500" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">mushy or broken: end of life</text>
<rect x="30" y="506" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water path</text>
<rect x="190" y="503" width="26" height="12" rx="2" fill="#fdba74"/><text x="224" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">exhausted resin</text>
<rect x="350" y="503" width="26" height="12" fill="url(#rbc-beads)"/><text x="384" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">working resin</text>
<rect x="500" y="503" width="26" height="12" fill="url(#rbc-silt)"/><text x="534" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">silt and grit</text>
</svg>
