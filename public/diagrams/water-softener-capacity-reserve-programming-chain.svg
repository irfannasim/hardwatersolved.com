<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="cpc-title cpc-desc">
<title id="cpc-title">How to set water softener capacity and reserve: the valve calculation chain</title>
<desc id="cpc-desc">Worked example: 1.5 cubic feet of resin at 26,000 grains per cubic foot gives a 39,000-grain capacity entry; divided by 15 gpg that is 2,600 gallons, and a 280-gallon reserve decides the night of regeneration. Entering the 48,000 box rating makes the valve count 3,200 gallons.</desc>
<defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">How the valve turns your two entries into a regeneration</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Worked example: 1.5 cu ft of resin, 9 lb salt per cu ft, 15 gpg, four people</text>
<rect class="box" x="30" y="92" width="190" height="68" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="125" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Resin volume</text>
<text x="125" y="137" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">1.5 cu ft</text>
<text x="245" y="128" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#3a5a72">×</text>
<rect class="box" x="270" y="92" width="210" height="68" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="375" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Capacity per cu ft</text>
<text x="375" y="137" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">26,000 grains at 9 lb</text>
<text x="505" y="128" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#3a5a72">=</text>
<rect class="box" x="530" y="92" width="200" height="68" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="630" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">CAPACITY you enter</text>
<text x="630" y="137" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">39,000 grains</text>
<path class="ln" d="M630,160 L630,178 L125,178 L125,196" stroke="#0e7490" stroke-width="3" fill="none" marker-end="url(#ma)"/>
<rect class="box" x="30" y="208" width="190" height="68" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="125" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Divided by hardness</text>
<text x="125" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">÷ 15 gpg</text>
<text x="245" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#3a5a72">=</text>
<rect class="box" x="270" y="208" width="210" height="68" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="375" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Gallons per cycle</text>
<text x="375" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">2,600 gallons</text>
<text x="505" y="244" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#3a5a72">−</text>
<rect class="box" x="530" y="208" width="200" height="68" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="630" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">RESERVE you enter</text>
<text x="630" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">280 gallons</text>
<path class="ln" d="M630,276 L630,312" stroke="#3a5a72" stroke-width="3" fill="none" marker-end="url(#mb)"/>
<rect class="box" x="30" y="324" width="700" height="58" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="380" y="348" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">At the set time each night: fewer than 280 gallons left?</text>
<text x="380" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Yes: regenerate tonight. No: keep counting down.</text>
<rect class="box" x="30" y="402" width="700" height="76" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="46" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">The common error: entering the 48,000 box rating</text>
<text x="46" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The valve then counts 3,200 gallons per cycle, but at 9 lb the resin is spent after 2,600.</text>
<text x="46" y="465" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">At 300 gallons a day, about 400 gallons of hard water reach the house before it regenerates.</text>
</svg>
