<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="dtl-title dtl-desc">
<title id="dtl-title">Tankless water heater delta-T log: low-flow temperature drift from scale</title>
<desc id="dtl-desc">Illustrative delta-T log for a tankless water heater: the monthly low-flow routine, and an outlet temperature that holds near the 120°F setpoint and then drifts 4 to 5°F lower as scale builds, the signal to flush.</desc>
<defs></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Delta-T log: catching scale before the error code</text><rect class="box" x="30" y="80" width="300" height="300" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="106" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Monthly routine, 5 minutes</text><text x="46" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">1</text><text x="64" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Inlet temperature at a cold tap</text><text x="46" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">2</text><text x="64" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Unit fixed at 120°F, always</text><text x="46" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">3</text><text x="64" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hot tap about ⅓ open, run 45 s,</text><text x="64" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">thermometer in a cup</text><text x="46" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">4</text><text x="64" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Time a 1-gallon jug:</text><text x="64" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">gpm = 60 ÷ seconds</text><text x="46" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0b2f4a">5</text><text x="64" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Log date, inlet, outlet, gpm</text><text x="46" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0e7490">delta-T = outlet − inlet</text><text x="46" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Compare the same low flow, and</text>
<text x="46" y="362" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the same month last year.</text><text x="360" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Low-flow outlet temperature (°F)</text><text x="730" y="96" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">ILLUSTRATIVE</text><rect x="420" y="171.66666666666666" width="288" height="31.666666666666657" rx="0" fill="#dcfce7" /><path class="ln" d="M420,171.66666666666666 L708,171.66666666666666" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/><path class="ln" d="M407.2,140 L407.2,330 L720.8,330" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="397.2" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">110</text><text x="397.2" y="271.6666666666667" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">114</text><text x="397.2" y="208.33333333333331" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">118</text><text x="397.2" y="145" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">122</text><text x="420" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">month 1</text><text x="516" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">month 4</text><text x="612" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">month 7</text><text x="708" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">month 10</text><path class="ln" d="M420,179.6 L452,182.8 L484,178.0 L516,184.3 L548,189.1 L580,203.3 L612,216.0 L644,231.8 L676,246.1 L708,250.8" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="420" cy="179.6" r="4.5" fill="#c2410c"/><circle cx="452" cy="182.8" r="4.5" fill="#c2410c"/><circle cx="484" cy="178.0" r="4.5" fill="#c2410c"/><circle cx="516" cy="184.3" r="4.5" fill="#c2410c"/><circle cx="548" cy="189.1" r="4.5" fill="#c2410c"/><circle cx="580" cy="203.3" r="4.5" fill="#c2410c"/><circle cx="612" cy="216.0" r="4.5" fill="#c2410c"/><circle cx="644" cy="231.8" r="4.5" fill="#c2410c"/><circle cx="676" cy="246.1" r="4.5" fill="#dc2626"/><circle cx="708" cy="250.8" r="4.5" fill="#dc2626"/><text x="420" y="161.66666666666666" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">setpoint 120°F</text><text x="599.2" y="192.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">clean band</text><text x="548" y="291.9999999999999" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">4–5°F drop, two months</text>
<text x="548" y="308.9999999999999" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">running → flush</text><rect class="box" x="30" y="400" width="700" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="380" y="431" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">The drift typically shows 6 to 12 months before an error code does.</text>
</svg>
