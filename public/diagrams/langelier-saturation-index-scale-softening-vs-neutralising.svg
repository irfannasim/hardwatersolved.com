<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="lsi-title lsi-desc">
<title id="lsi-title">Langelier Saturation Index scale: raw, softened and neutralised well water</title>
<desc id="lsi-desc">Langelier Saturation Index number line for one acidic well: raw water at −1.16, softened-only water at −2.64 and neutralised-first water at +0.21, inside the balanced band of −0.3 to +0.3.</desc>
<defs><marker id="lsi-bad" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="lsi-ok" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="760" height="450" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Langelier Saturation Index: one well, three outcomes</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Worked example: TDS 200 mg/L, 25 °C, calcium hardness 150 mg/L, alkalinity 120 mg/L</text><rect x="60" y="198" width="432" height="44" rx="0" fill="#fdeee6" /><rect x="492" y="198" width="96" height="44" rx="0" fill="#dcfce7" /><rect x="588" y="198" width="112" height="44" rx="0" fill="#eef2f6" /><path class="ln" d="M60,220 L700,220" fill="none" stroke="#3a5a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,214 L60,226" stroke="#3a5a72" stroke-width="2"/><text x="60" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">−3</text><path d="M220,214 L220,226" stroke="#3a5a72" stroke-width="2"/><text x="220" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">−2</text><path d="M380,214 L380,226" stroke="#3a5a72" stroke-width="2"/><text x="380" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">−1</text><path d="M540,214 L540,226" stroke="#3a5a72" stroke-width="2"/><text x="540" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">0</text><path d="M700,214 L700,226" stroke="#3a5a72" stroke-width="2"/><text x="700" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">+1</text><text x="540" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#15803d">balanced band −0.3 to +0.3</text><text x="117.59999999999998" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softened only</text><text x="117.59999999999998" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">pH 6.5 · pHs 9.14</text><text x="117.59999999999998" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">LSI −2.64</text><path class="ln" d="M117.59999999999998,160 L117.59999999999998,210" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="117.59999999999998" cy="220" r="8" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="354.40000000000003" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Raw well water</text><text x="354.40000000000003" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">pH 6.5 · pHs 7.66</text><text x="354.40000000000003" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">LSI −1.16</text><path class="ln" d="M354.40000000000003,160 L354.40000000000003,210" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="354.40000000000003" cy="220" r="8" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="573.6" y="108" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Neutralised first</text><text x="573.6" y="127" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">pH 7.5 · pHs 7.29</text><text x="573.6" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">LSI +0.21</text><path class="ln" d="M573.6,160 L573.6,210" fill="none" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="573.6" cy="220" r="8" fill="#15803d" stroke="#fff" stroke-width="2"/><path class="ln" d="M344.40000000000003,312 L129.59999999999997,312" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsi-bad)"/><text x="236" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">softening: calcium 150 → ~5 mg/L</text><text x="236" y="353" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">pH unchanged</text><path class="ln" d="M364.40000000000003,312 L561.6,312" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#lsi-ok)"/><text x="464" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">calcite neutraliser first</text><text x="464" y="353" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">pH 6.5 → 7.5, adds hardness</text><text x="60" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c">← Undersaturated: dissolves the protective film</text><text x="700" y="392" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#3a5a72">Oversaturated: deposits scale →</text><text x="30" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" font-style="italic" text-anchor="start" fill="#52697a">LSI describes calcium carbonate saturation, not corrosion. Treat it as a screening tool.</text>
</svg>
