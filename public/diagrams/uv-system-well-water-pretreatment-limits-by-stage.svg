<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="buvw-title buvw-desc">
<title id="buvw-title">Best UV systems for well water: pretreatment stages and limits, UV last</title>
<desc id="buvw-desc">Five whole-house stages in order for a UV system on well water: sediment screen, iron and manganese filter, softener, 5 micron cartridge and the UV chamber last. Under each stage is the limit it must deliver at the UV according to the VIQUA VH410 manual: iron under 0.3 ppm, manganese under 0.05 ppm, hardness under 7 gpg, turbidity under 1 NTU and UV transmittance over 75 percent, plus lamp and sleeve upkeep.</desc>
<defs><marker id="buvw-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">UV last: what each stage ahead of it must deliver</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Limits at the UV chamber from VIQUA’s VH410 owner’s manual. Water flows left to right.</text>
<rect class="box" x="30" y="92" width="120" height="56" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="90" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text>
<text x="90" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">screen, 50 µm</text>
<path class="ln" d="M152,120 L172,120" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buvw-a)"/>
<path class="ln" d="M90,148 L90,196" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<rect class="box" x="30" y="196" width="120" height="78" rx="4" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="90" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Stops sand that</text>
<text x="90" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">would wear valves</text>
<text x="90" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">and pack media</text>
<rect class="box" x="175" y="92" width="120" height="56" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="235" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron and</text>
<text x="235" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">manganese filter</text>
<path class="ln" d="M297,120 L317,120" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buvw-a)"/>
<path class="ln" d="M235,148 L235,196" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<rect class="box" x="175" y="196" width="120" height="78" rx="4" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
<text x="235" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Iron &lt; 0.3 ppm</text>
<text x="235" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Manganese</text>
<text x="235" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">&lt; 0.05 ppm</text>
<rect class="box" x="320" y="92" width="120" height="56" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="380" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text>
<text x="380" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">fine or standard</text>
<path class="ln" d="M442,120 L462,120" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buvw-a)"/>
<path class="ln" d="M380,148 L380,196" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<rect class="box" x="320" y="196" width="120" height="78" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="380" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Hardness &lt; 7 gpg</text>
<text x="380" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">VIQUA: soften</text>
<text x="380" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">water above that</text>
<rect class="box" x="465" y="92" width="120" height="56" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="525" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">5 µm</text>
<text x="525" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">cartridge</text>
<path class="ln" d="M587,120 L607,120" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buvw-a)"/>
<path class="ln" d="M525,148 L525,196" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<rect class="box" x="465" y="196" width="120" height="78" rx="4" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="525" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Turbidity &lt; 1 NTU</text>
<text x="525" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5 µm filter is</text>
<text x="525" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">required by VIQUA</text>
<rect class="box" x="610" y="92" width="120" height="56" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="3"/>
<text x="670" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">UV chamber</text>
<text x="670" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">always last</text>
<path class="ln" d="M670,148 L670,196" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<rect class="box" x="610" y="196" width="120" height="78" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/>
<text x="670" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">UV transmittance</text>
<text x="670" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">&gt; 75%</text>
<text x="670" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">at the lamp</text>
<text x="30" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Tannins must also be under 0.1 ppm. A tannin well needs its own treatment stage ahead of the UV.</text>
<rect class="box" x="30" y="330" width="700" height="140" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="50" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Upkeep at the UV, per the VH410 manual</text>
<text x="50" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">Lamp</text>
<text x="170" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Replace every year; rated about 9,000 hours</text>
<text x="50" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">Quartz sleeve</text>
<text x="170" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Clean when minerals coat it; replace if it will not clean</text>
<text x="50" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">Power cut</text>
<text x="170" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Wait at least 5 minutes after power returns before using water</text>
<text x="50" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">Restart</text>
<text x="170" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Disinfect the plumbing after the UV whenever it has been off</text>
</svg>
