<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="hwf-title hwf-desc">
<title id="hwf-title">Hardness at the hot tap in the days after a water softener is installed (illustrative)</title>
<desc id="hwf-desc">Illustrative chart of hard water flushing out of a 50-gallon water heater after a softener is installed: the hot tap falls from 15 gpg to about 5.5, 2.0 and 0.7 gpg over three days while the cold tap is soft at once.</desc>
<defs></defs>
<rect width="760" height="500" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why the hot tap lags: hardness left in a 50-gallon tank</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Illustrative: 15 gpg water, 50 gal of hot water used per day, tank contents fully mixed.</text><path d="M100,400 L660,400" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="88" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text><path d="M100,330 L660,330" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="88" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">4</text><path d="M100,260 L660,260" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="88" y="265" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">8</text><path d="M100,190 L660,190" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="88" y="195" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">12</text><path d="M100,120 L660,120" fill="none" stroke="#e2e8f0" stroke-width="1"/><text x="88" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">16</text><path d="M100,400 L660,400" fill="none" stroke="#3a5a72" stroke-width="1.5"/><path d="M100,400 L100,120" fill="none" stroke="#3a5a72" stroke-width="1.5"/><text x="100" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Install</text><text x="212" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Day 1</text><text x="324" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Day 2</text><text x="436" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Day 3</text><text x="548" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Day 4</text><text x="660" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Day 5</text><text x="380" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Days of normal use after the softener goes in</text><text x="40" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a" transform="rotate(-90 40 260)">Hardness at hot tap, gpg</text><path d="M100.0,137.5 L111.2,162.5 L122.4,185.1 L133.6,205.5 L144.8,224.0 L156.0,240.8 L167.2,255.9 L178.4,269.6 L189.6,282.1 L200.8,293.3 L212.0,303.4 L223.2,312.6 L234.4,320.9 L245.6,328.5 L256.8,335.3 L268.0,341.4 L279.2,347.0 L290.4,352.0 L301.6,356.6 L312.8,360.7 L324.0,364.5 L335.2,367.9 L346.4,370.9 L357.6,373.7 L368.8,376.2 L380.0,378.5 L391.2,380.5 L402.4,382.4 L413.6,384.0 L424.8,385.6 L436.0,386.9 L447.2,388.2 L458.4,389.3 L469.6,390.3 L480.8,391.2 L492.0,392.1 L503.2,392.8 L514.4,393.5 L525.6,394.1 L536.8,394.7 L548.0,395.2 L559.2,395.6 L570.4,396.1 L581.6,396.4 L592.8,396.8 L604.0,397.1 L615.2,397.4 L626.4,397.6 L637.6,397.8 L648.8,398.0 L660.0,398.2" fill="none" stroke="#c2410c" stroke-width="4"/><path d="M100,397 L660,397" fill="none" stroke="#0e7490" stroke-width="4"/><circle cx="212" cy="303.43164669249643" r="5" fill="#c2410c"/><text x="222" y="291.43164669249643" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">5.5 gpg</text><circle cx="324" cy="364.47448815038916" r="5" fill="#c2410c"/><text x="334" y="352.47448815038916" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">2.0 gpg</text><circle cx="436" cy="386.93089455343573" r="5" fill="#c2410c"/><text x="446" y="374.93089455343573" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#c2410c">0.7 gpg</text><text x="112" y="141.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#c2410c">15 gpg: tank full of hard water</text><rect class="box" x="470" y="110" width="260" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><path d="M486,134 L516,134" fill="none" stroke="#c2410c" stroke-width="4"/><text x="526" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hot tap (tank draining)</text><path d="M486,160 L516,160" fill="none" stroke="#0e7490" stroke-width="4"/><text x="526" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Cold tap (soft at once)</text><text x="30" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Sediment on the tank floor can keep the hot side a little above zero for up to two weeks.</text>
</svg>
