<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 504" width="760" height="504" role="img" aria-labelledby="g4sp-title g4sp-desc">
<title id="g4sp-title">Scale reducing water pressure: pipe cross-section, clean vs scaled</title>
<desc id="g4sp-desc">Cross-section of a clean half-inch pipe beside one narrowed by a calcium carbonate scale layer. Losing a quarter of the cross-section costs considerably more than a quarter of the flow, which is why scale reducing water pressure is really lost flow.</desc>
<defs><marker id="g4sp-am" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker><pattern id="g4sp-sc" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#efe9dc"/><circle cx="2" cy="2" r="1.3" fill="#c9bfa9"/><circle cx="6" cy="6" r="1.3" fill="#c9bfa9"/></pattern></defs>
<rect width="760" height="504" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Inside the pipe: scale takes the bore</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Calcium carbonate builds up on the inner wall and narrows the path the water can take.</text><circle cx="200" cy="235" r="100" fill="#94a3b8" stroke="#3a5a72" stroke-width="2"/><circle cx="200" cy="235" r="86" fill="#dbeafe"/><text x="200" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">full bore</text><text x="36" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">pipe wall</text><path class="ln" d="M102,152 L132,168" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M312,235 L404,235" fill="none" stroke="#52697a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#g4sp-am)"/><text x="358" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">years to decades</text><circle cx="520" cy="235" r="100" fill="#94a3b8" stroke="#3a5a72" stroke-width="2"/><circle cx="520" cy="235" r="86" fill="url(#g4sp-sc)"/><circle cx="520" cy="235" r="75" fill="#dbeafe"/><text x="636" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">scale layer</text><text x="636" y="202" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">(calcium</text><text x="636" y="218" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">carbonate)</text><path class="ln" d="M632,184 L591,196" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="636" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">remaining</text><text x="636" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">bore</text><path class="ln" d="M632,272 L560,252" fill="none" stroke="#52697a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Clean ½-inch pipe</text><text x="200" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">full cross-section</text><text x="520" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Scaled pipe</text><text x="520" y="388" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">about a quarter of the cross-section gone</text><rect class="box" x="30" y="410" width="700" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="380" y="437" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">A quarter of the cross-section lost = considerably more than a quarter of the flow lost</text><text x="30" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hot lines scale several times faster than cold lines carrying the same water.</text>
</svg>
