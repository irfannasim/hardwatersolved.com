<text x="30" y="554" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">A young tank that fails is usually a warranty claim. Thresholds are a rule of thumb: the share of</text>
<text x="30" y="574" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">a new unit’s life the repaired softener can still deliver. Use your own quotes for the percentages.</text>
