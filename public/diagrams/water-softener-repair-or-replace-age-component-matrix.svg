<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="g17rr-title g17rr-desc">
<title id="g17rr-title">Repair or replace water softener decision matrix by age and failed component</title>
<desc id="g17rr-desc">Illustrative decision matrix crossing water softener age with the failed component. Seal, motor and brine tank repairs stay worthwhile into old age, a whole valve or resin change becomes replace after about ten years, and a failed mineral tank means replace at any age.</desc>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Repair or replace a water softener: age against the failed part</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative: repair cost as a share of a $1,500 installed replacement</text>
<text x="30" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#52697a">Failed part</text>
<text x="30" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">(typical repair share)</text>
<text x="288" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Under 5 years</text>
<text x="288" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">repair if under 60%</text>
<text x="414" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">5 to 10 years</text>
<text x="414" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">repair if under 40%</text>
<text x="540" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">10 to 15 years</text>
<text x="540" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">repair if under 25%</text>
<text x="666" y="104" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Over 15 years</text>
<text x="666" y="124" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">repair if under 15%</text>
<text x="30" y="174" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Seals, piston or</text>
<text x="30" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">brine valve (20%)</text>
<rect class="box" x="228" y="153" width="120" height="50" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<text x="288" y="184" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#15803d">Repair</text>
