<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="hbrf-title hbrf-desc">
<title id="hbrf-title">Hose bib retrofit: moving an outdoor faucet from the soft side to a hard branch</title>
<desc id="hbrf-desc">Before and after plumbing schematic for an existing water softener: the hose bib branch that teed off the softened side is capped, and a new tee ahead of the bypass valve feeds the outdoor faucet with hard water through a new shutoff.</desc>
<defs><marker id="rfH" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="rfS" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Moving a hose bib to the hard side of an existing softener</text><rect class="box" x="30" y="60" width="700" height="215" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="88" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Before: the hose bib tees off the soft side</text><text x="50" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from meter</text><path class="ln" d="M50,150 L200,150" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="200" y="122" width="140" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="270" y="147" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><text x="270" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">+ bypass valve</text><path class="ln" d="M340,150 L690,150" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rfS)"/><text x="700" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">to house</text><path class="ln" d="M560,150 L560,205" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="485" y="208" width="150" height="34" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="560" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">hose bib (soft)</text><text x="50" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Every gallon outside</text><text x="50" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">costs salt and capacity</text><rect class="box" x="30" y="295" width="700" height="250" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="323" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">After: new tee upstream of the bypass, old branch capped</text><text x="50" y="367" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from meter</text><path class="ln" d="M50,385 L200,385" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="200" y="357" width="140" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="270" y="382" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><text x="270" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">+ bypass valve</text><path class="ln" d="M340,385 L690,385" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rfS)"/><text x="700" y="367" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">to house</text><path class="ln" d="M130,385 L130,470 L480,470" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rfH)"/><rect class="box" x="485" y="453" width="150" height="34" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="560" y="475" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">hose bib (hard)</text><rect x="226" y="459" width="22" height="22" rx="3" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/><text x="237" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">new shutoff</text><text x="142" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">new tee</text><path class="ln" d="M560,385 L560,412" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M548,418 L572,418" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><text x="580" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">old branch capped</text><text x="50" y="575" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Tee ahead of the bypass valve, so the outdoor line keeps water when the softener is valved off.</text><rect x="30" y="596" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard (unsoftened)</text><rect x="220" y="596" width="26" height="6" rx="3" fill="#0e7490"/><text x="254" y="604" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened</text>
</svg>
