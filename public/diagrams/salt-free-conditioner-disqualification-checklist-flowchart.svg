<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 722" width="760" height="722" role="img" aria-labelledby="sfd-title sfd-desc">
<title id="sfd-title">When not to use a salt-free water conditioner: 9-question disqualification checklist</title>
<desc id="sfd-desc">Flowchart of nine checks in three groups, goals, water chemistry and plumbing. Any yes answer rules a salt-free water conditioner out and points to a softener, pretreatment or different equipment; nine no answers leave salt-free as scale control only.</desc>
<defs><marker id="sfd-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sfd-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="760" height="722" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">When not to use a salt-free conditioner: 9 checks</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Any "yes" rules salt-free out. Only nine "no" answers leave it in.</text><text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">YOUR GOALS</text><rect class="box" x="30" y="120" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">1. Want more lather or to use less soap?</text><path class="ln" d="M410,137 L498,137" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="131" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="30" y="168" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">2. Want spot-free glass, shower doors or car?</text><path class="ln" d="M410,185 L498,185" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="179" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="30" y="216" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">3. Want softer-feeling laundry, skin or hair?</text><path class="ln" d="M410,233 L498,233" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="227" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="30" y="264" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">4. Need a hardness test to read near zero?</text><path class="ln" d="M410,281 L498,281" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="502" y="120" width="228" height="178" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="616" y="197" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">Salt-free is wrong</text><text x="616" y="219" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Buy a salt-based</text><text x="616" y="236" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">softener</text><text x="30" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">YOUR WATER</text><rect class="box" x="30" y="342" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">5. Hardness over 30 gpg?</text><path class="ln" d="M410,359 L498,359" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="353" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="30" y="390" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="412" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">6. Iron over 0.3 ppm or manganese over 0.05?</text><path class="ln" d="M410,407 L498,407" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="401" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="30" y="438" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="460" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">7. Sulfide, oil, or pH outside 6.5 to 8.5?</text><path class="ln" d="M410,455 L498,455" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="449" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="502" y="342" width="228" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="616" y="395" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">Salt-free is wrong</text><text x="616" y="417" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Treat the water first,</text><text x="616" y="434" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">or use a softener</text><text x="30" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">YOUR PLUMBING</text><rect class="box" x="30" y="516" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="538" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">8. Peak flow above the unit's rated flow?</text><path class="ln" d="M410,533 L498,533" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="527" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="30" y="564" width="380" height="34" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="42" y="586" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">9. Feeding a closed-loop boiler?</text><path class="ln" d="M410,581 L498,581" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-r)"/><text x="454" y="575" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">yes</text><rect class="box" x="502" y="516" width="228" height="82" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="616" y="545" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">Salt-free is wrong</text><text x="616" y="567" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Different size or</text><text x="616" y="584" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">different equipment</text><path class="ln" d="M18,120 L18,626" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sfd-g)"/><text x="10" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">no</text><rect class="box" x="30" y="636" width="700" height="56" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="46" y="659" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0e7490">All nine "no": salt-free can fit</text><text x="46" y="679" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">It limits scale inside pipes and heaters. It still leaves the water hard.</text>
</svg>
