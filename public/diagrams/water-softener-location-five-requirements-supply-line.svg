<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 630" width="760" height="630" role="img" aria-labelledby="wti-title wti-desc">
<title id="wti-title">Where to install a water softener: five location requirements on the supply line</title>
<desc id="wti-desc">Plumbing layout showing where to install a water softener: after the main shutoff and the outdoor tap branch, before the water heater and house fixtures, with a drain, a power outlet, a frost-free and shaded spot, and service clearance around the resin and brine tanks.</desc>
<defs><marker id="wti-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="wti-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="630" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where to install a water softener: 5 requirements</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">One spot has to meet all five. Numbers match the key below.</text><text x="30" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">water enters</text><path class="ln" d="M30,180 L48,180" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect class="box" x="48" y="155" width="96" height="50" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="96" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">main shutoff</text><text x="96" y="193" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">+ meter</text><path class="ln" d="M144,180 L340,180" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M205,180 L205,272" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wti-h)"/><text x="205" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">outdoor taps</text><text x="205" y="316" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">branch here</text><text x="205" y="334" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">or never</text><rect x="300" y="100" width="236" height="318" rx="10" fill="none" stroke="#52697a" stroke-width="1.5" stroke-dasharray="6 5"/><text x="418" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">service clearance zone</text><rect x="340" y="162" width="60" height="36" rx="4" fill="#0b2f4a"/><rect x="345" y="198" width="50" height="170" rx="18" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="370" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">resin</text><text x="370" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">tank</text><rect x="418" y="250" width="64" height="118" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="450" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">brine</text><text x="450" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">tank</text><rect x="424" y="118" width="24" height="18" rx="3" fill="#ffffff" stroke="#0b2f4a" stroke-width="1.5"/><rect x="430" y="123" width="3" height="8" fill="#0b2f4a"/><rect x="439" y="123" width="3" height="8" fill="#0b2f4a"/><path class="ln" d="M424,127 L400,127 L385,162" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M392,198 L392,210 L434,210 L434,250" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M400,180 L730,180" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M400,188 L512,188 L512,368" fill="none" stroke="#78716c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="496" y="384" width="32" height="10" rx="2" fill="#78716c"/><path class="ln" d="M600,180 L600,240" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wti-s)"/><rect class="box" x="560" y="248" width="80" height="74" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="600" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">water</text><text x="600" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">heater</text><path class="ln" d="M690,180 L690,240" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wti-s)"/><text x="690" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">house</text><text x="690" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">fixtures</text><circle cx="262" cy="150" r="12" fill="#0b2f4a"/><text x="262" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><circle cx="548" cy="389" r="12" fill="#0b2f4a"/><text x="548" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><circle cx="466" cy="127" r="12" fill="#0b2f4a"/><text x="466" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><circle cx="325" cy="330" r="12" fill="#0b2f4a"/><text x="325" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><circle cx="558" cy="116" r="12" fill="#0b2f4a"/><text x="558" y="121" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><circle cx="42" cy="465" r="12" fill="#0b2f4a"/><text x="42" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text><text x="62" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Supply: after the main shutoff, before the heater and every house branch</text><circle cx="42" cy="491" r="12" fill="#0b2f4a"/><text x="42" y="496" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text><text x="62" y="496" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Drain: floor drain, standpipe or laundry tub, with an air gap</text><circle cx="42" cy="517" r="12" fill="#0b2f4a"/><text x="42" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3</text><text x="62" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Power: an outlet for the control valve (non-electric units excepted)</text><circle cx="42" cy="543" r="12" fill="#0b2f4a"/><text x="42" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4</text><text x="62" y="548" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Temperature: never freezing, never in direct sun</text><circle cx="42" cy="569" r="12" fill="#0b2f4a"/><text x="42" y="574" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5</text><text x="62" y="574" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Clearance: room to lift the salt lid and reach the bypass and shutoffs</text><rect x="30" y="602" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="610" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water</text><rect x="160" y="602" width="26" height="6" rx="3" fill="#0e7490"/><text x="194" y="610" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text><rect x="310" y="602" width="26" height="6" rx="3" fill="#78716c"/><text x="344" y="610" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">regeneration drain</text><rect x="500" y="602" width="26" height="6" rx="3" fill="#7c3aed"/><text x="534" y="610" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">brine line</text>
</svg>
