<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="dd-title dd-desc">
<title id="dd-title">Dishwasher detergent in hard vs softened water: why glasses etch</title>
<desc id="dd-desc">Diagram showing why softened water etches glass in a dishwasher: in hard water part of the detergent dose is used up on calcium and magnesium, while in softened water the full dose reaches the glass and strips metal ions.</desc>
<defs><pattern id="dd-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f1f5f9"/><rect width="3" height="8" fill="#cbd5e1"/></pattern><marker id="dd-steel" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Why softened water etches glass</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The same detergent dose, with and without hardness to use part of it up.</text><path d="M380,96 L380,370" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#c2410c">Hard water</text><text x="30" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Detergent dose</text><rect x="30" y="152" width="190" height="40" fill="url(#dd-hatch)" stroke="#3a5a72" stroke-width="1.5"/><rect x="220" y="152" width="110" height="40" fill="#3a5a72" stroke="#3a5a72" stroke-width="1.5"/><text x="125" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">used up on calcium</text><text x="125" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">and magnesium</text><text x="275" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">reaches glass</text><path class="ln" d="M275,226 L275,266" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dd-steel)"/><path d="M249,280 L301,280 L295,350 L255,350 z" fill="#f0f9ff" stroke="#3a5a72" stroke-width="2"/><text x="30" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Less is left</text><text x="30" y="313" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">to attack</text><text x="30" y="332" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">the glass</text><text x="410" y="110" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">Softened water</text><text x="410" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Same detergent dose</text><rect x="410" y="152" width="300" height="40" fill="#3a5a72" stroke="#3a5a72" stroke-width="1.5"/><text x="560" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">all of it reaches the glass</text><path class="ln" d="M560,226 L560,266" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dd-steel)"/><path d="M534,280 L586,280 L580,350 L540,350 z" fill="#f0f9ff" stroke="#dc2626" stroke-width="3"/><path d="M537,296 l4,6 l-3,6 l4,6 l-3,6 l4,6 l-3,6 M583,296 l-4,6 l3,6 l-4,6 l3,6 l-4,6 l3,6" fill="none" stroke="#dc2626" stroke-width="1.5"/><text x="600" y="294" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">Full strength:</text><text x="600" y="313" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">strips metal</text><text x="600" y="332" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#dc2626">ions (etching)</text><text x="730" y="370" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">bar proportions are illustrative</text><text x="30" y="406" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Etching gets worse with:</text><rect class="box" x="30" y="418" width="220" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="140" y="439" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Dose: the box assumes</text><text x="140" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">moderately hard water</text><rect class="box" x="270" y="418" width="220" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="380" y="439" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Heat: the rate climbs</text><text x="380" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">above roughly 140F</text><rect class="box" x="510" y="418" width="220" height="52" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="620" y="439" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Soil: pre-rinsed, clean</text><text x="620" y="457" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#0b2f4a">loads are worse</text><text x="30" y="500" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#15803d">On softened water, cut the dose to a third or half of the fill mark.</text>
</svg>
