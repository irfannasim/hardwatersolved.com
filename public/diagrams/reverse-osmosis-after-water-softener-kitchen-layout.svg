<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" width="760" height="576" role="img" aria-labelledby="rol-title rol-desc">
<title id="rol-title">Reverse osmosis after a water softener: kitchen layout</title>
<desc id="rol-desc">Diagram of a whole-house water softener feeding softened water to the house and a softened cold line to an under-sink reverse osmosis system with sediment and carbon prefilters, membrane, storage tank, post-filter and RO faucet, with reject water going to drain through an air gap.</desc>
<defs><marker id="rol-mc2410c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="rol-m0e7490" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="rol-m78716c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="576" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Reverse osmosis after a water softener: the layout</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">The softener treats the whole house. The RO unit polishes one tap from a softened cold line.</text><rect class="box" x="30" y="96" width="130" height="64" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="95" y="122" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water supply</text><text x="95" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#c2410c">hard</text><rect class="box" x="200" y="96" width="150" height="64" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/><text x="275" y="122" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Water softener</text><text x="275" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">whole house</text><rect class="box" x="580" y="96" width="150" height="64" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/><text x="655" y="122" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Rest of house</text><text x="655" y="142" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">heater, showers</text><path class="ln" d="M160,128 L195,128" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-mc2410c)"/><path class="ln" d="M350,128 L575,128" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-m0e7490)"/><text x="470" y="114" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0e7490">softened water</text><path class="ln" d="M400,131 L400,204 L85,204 L85,238" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-m0e7490)"/><text x="420" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0e7490">softened cold line to the kitchen sink</text><rect class="box" x="30" y="244" width="110" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="85" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Sediment</text><text x="85" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">particles</text><rect class="box" x="170" y="244" width="110" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="225" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Carbon</text><text x="225" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">chlorine</text><rect class="box" x="310" y="244" width="130" height="60" rx="8" fill="#e0e7ff" stroke="#3a5a72" stroke-width="2"/><text x="375" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Membrane</text><text x="375" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">salts, sodium</text><rect class="box" x="470" y="244" width="110" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="525" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Tank</text><text x="525" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">stores water</text><rect class="box" x="610" y="244" width="120" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="670" y="269" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Post-filter</text><text x="670" y="289" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">taste</text><path class="ln" d="M140,274 L165,274" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-m0e7490)"/><path class="ln" d="M280,274 L305,274" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-m0e7490)"/><path class="ln" d="M440,274 L465,274" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-m0e7490)"/><path class="ln" d="M580,274 L605,274" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-m0e7490)"/><path class="ln" d="M375,304 L375,360" fill="none" stroke="#78716c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-m78716c)"/><rect class="box" x="300" y="366" width="150" height="60" rx="8" fill="#f5f5f4" stroke="#78716c" stroke-width="2"/><text x="375" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Reject to drain</text><text x="375" y="411" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">through an air gap</text><path class="ln" d="M670,304 L670,360" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rol-m0e7490)"/><rect class="box" x="595" y="366" width="150" height="60" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/><text x="670" y="391" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">RO faucet</text><text x="670" y="411" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">drinking, cooking</text><rect class="box" x="30" y="452" width="715" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="46" y="478" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Worked example, 20 gpg supply</text><text x="46" y="502" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#c2410c">Supply: 20 gpg hardness</text><text x="46" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0e7490">After the softener: close to 0 gpg, about 157 mg/L sodium added</text><text x="46" y="546" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">At the RO faucet: about 16 mg/L sodium, at 90% system rejection</text>
</svg>
