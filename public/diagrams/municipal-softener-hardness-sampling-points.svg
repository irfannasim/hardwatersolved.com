<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" role="img" aria-labelledby="g4wm-title g4wm-desc">
<title id="g4wm-title">Hardness sampling points in a municipal house with a softener</title>
<desc id="g4wm-desc">Municipal house with a water softener: sample A at a hose bib split off before the softener gives raw supply hardness; sample C at indoor taps shows whether the softener works, or gives raw water with the softener in bypass.</desc>
<defs><marker id="g4wm-ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="g4wm-as" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker></defs>
<rect width="760" height="444" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Municipal house with a softener: where to sample</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Sample A is your raw supply. Sample C tells you whether the softener works.</text><rect class="box" x="30" y="142" width="110" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="85" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">WATER</text><text x="85" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">MAIN</text><path class="ln" d="M140,170 L376,170" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4wm-ah)"/><path d="M176,158 L176,182 L200,158 L200,182 Z" fill="#3a5a72"/><text x="188" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">shut-off</text><path class="ln" d="M270,173 L270,228" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="270" cy="246" r="15" fill="#c2410c"/><text x="270" y="251.4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">A</text><text x="270" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">hose bib, if split off here</text><text x="270" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">layout 2</text><rect class="box" x="380" y="142" width="130" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="445" y="175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><path class="ln" d="M340,168 L340,110 L550,110 L550,168" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/><path d="M433,98 L433,122 L457,98 L457,122 Z" fill="#3a5a72"/><text x="445" y="88" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">bypass valve</text><path class="ln" d="M510,170 L616,170" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4wm-as)"/><rect class="box" x="620" y="142" width="110" height="56" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="675" y="166" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">INDOOR</text><text x="675" y="183" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">TAPS</text><path class="ln" d="M580,173 L580,228" fill="none" stroke="#0e7490" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="580" cy="246" r="15" fill="#0e7490"/><text x="580" y="251.4" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">C</text><text x="580" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">every indoor tap</text><text x="580" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">layout 3: bypass first for raw water</text><rect class="box" x="30" y="330" width="700" height="62" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Put the softener in bypass to get raw water at (C) taps.</text><text x="46" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Flush 2–3 minutes, then test two draws a minute apart until they agree.</text><rect x="30" y="417" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">raw (hard) water</text><rect x="230" y="417" width="26" height="6" rx="3" fill="#0e7490"/><text x="264" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text><path d="M430,420 L456,420" stroke="#c2410c" stroke-width="3" stroke-dasharray="6 4"/><text x="464" y="424" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bypass route</text>
</svg>
