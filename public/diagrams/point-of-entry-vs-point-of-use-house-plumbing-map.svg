<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img" aria-labelledby="pem-title pem-desc">
<title id="pem-title">Point of entry vs point of use: where each treats water in a house</title>
<desc id="pem-desc">Plumbing map. The water main feeds a hard branch to hose bibs and irrigation first, then a point-of-entry softener. Softened water goes to the water heater and to the showers, sinks, laundry and dishwasher. A kitchen cold branch feeds a point-of-use reverse osmosis unit and a separate drinking faucet.</desc>
<defs>
<marker id="pem-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="pem-as" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
</defs>
<rect width="760" height="530" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Point of entry protects the house. Point of use serves one tap.</text>
<g fill="none" stroke-width="6">
<line class="ln" x1="120" y1="200" x2="314" y2="200" stroke="#c2410c" marker-end="url(#pem-ah)"/>
<line class="ln" x1="200" y1="200" x2="200" y2="140" stroke="#c2410c" marker-end="url(#pem-ah)"/>
<line class="ln" x1="440" y1="200" x2="554" y2="200" stroke="#0e7490" marker-end="url(#pem-as)"/>
<line class="ln" x1="500" y1="200" x2="500" y2="284" stroke="#0e7490" marker-end="url(#pem-as)"/>
<line class="ln" x1="650" y1="225" x2="650" y2="284" stroke="#0e7490" marker-end="url(#pem-as)"/>
<line class="ln" x1="450" y1="340" x2="450" y2="394" stroke="#0e7490" marker-end="url(#pem-as)"/>
<line class="ln" x1="560" y1="425" x2="594" y2="425" stroke="#0e7490" marker-end="url(#pem-as)"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<rect class="box" x="30" y="178" width="90" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="75" y="205" font-size="14" font-weight="bold" fill="#0b2f4a">Main in</text>
<rect class="box" x="110" y="82" width="180" height="52" rx="6" fill="#fdeee6" stroke="#c2410c" stroke-width="2"/>
<text x="200" y="104" font-size="14" font-weight="bold" fill="#0b2f4a">Hose bibs, irrigation</text>
<text x="200" y="123" font-size="13" fill="#c2410c">stay on hard water</text>
<text x="380" y="160" font-size="13" font-weight="bold" fill="#0e7490">POINT OF ENTRY</text>
<rect class="box" x="320" y="172" width="120" height="56" rx="6" fill="#e6f4f7" stroke="#0e7490" stroke-width="2.5"/>
<text x="380" y="198" font-size="14" font-weight="bold" fill="#0b2f4a">Softener</text>
<text x="380" y="216" font-size="13" fill="#52697a">+ other POE</text>
<rect class="box" x="560" y="175" width="160" height="50" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="640" y="205" font-size="14" font-weight="bold" fill="#0b2f4a">Water heater</text>
<rect class="box" x="380" y="290" width="340" height="50" rx="6" fill="#e6f4f7" stroke="#0e7490" stroke-width="1.5"/>
<text x="550" y="312" font-size="14" font-weight="bold" fill="#0b2f4a">Showers, sinks, laundry, dishwasher</text>
<text x="550" y="330" font-size="13" fill="#52697a">hot and cold, all softened</text>
<rect class="box" x="340" y="400" width="220" height="56" rx="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2.5"/>
<text x="450" y="424" font-size="14" font-weight="bold" fill="#0b2f4a">Reverse osmosis</text>
<text x="450" y="443" font-size="13" fill="#52697a">under the kitchen sink</text>
<text x="450" y="476" font-size="13" font-weight="bold" fill="#0b2f4a">POINT OF USE</text>
<rect class="box" x="600" y="400" width="120" height="56" rx="6" fill="#ffffff" stroke="#0b2f4a" stroke-width="2"/>
<text x="660" y="424" font-size="14" font-weight="bold" fill="#0b2f4a">Drinking</text>
<text x="660" y="443" font-size="14" font-weight="bold" fill="#0b2f4a">faucet</text>
</g>
<text x="212" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">branches off first</text>
<text x="438" y="372" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">kitchen cold branch</text>
<text x="30" y="275" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Softener must be</text>
<text x="30" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">upstream of the heater</text>
<rect x="30" y="498" width="22" height="8" fill="#c2410c"/>
<text x="60" y="507" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Hard water</text>
<rect x="160" y="498" width="22" height="8" fill="#0e7490"/>
<text x="190" y="507" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Softened water</text>
</svg>
