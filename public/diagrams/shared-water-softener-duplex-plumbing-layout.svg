<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="mul-title mul-desc">
<title id="mul-title">Shared water softener for a duplex: plumbing layout and open questions</title>
<desc id="mul-desc">Plumbing layout for one water softener serving two dwelling units: supply and meter, outdoor taps teed off before the softener, a metered softener with bypass in an owner-access room, and softened water split to Unit A and Unit B with optional sub-meters. Salt, access and tenant turnover must be agreed.</desc>
<defs><marker id="mul-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="mul-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="mul-d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">One softener, two units: the layout and the three open questions</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Put the softener where the owner can reach it and tenants do not need to.</text>
<rect x="250" y="96" width="250" height="262" rx="6" fill="#f8fafc" stroke="#52697a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="262" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Owner-access utility room</text>
<rect class="box" x="30" y="150" width="120" height="60" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="90" y="175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Supply and</text>
<text x="90" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">house meter</text>
<line class="ln" x1="150" y1="180" x2="272" y2="180" stroke="#c2410c" stroke-width="6" marker-end="url(#mul-h)"/>
<line class="ln" x1="165" y1="180" x2="165" y2="272" stroke="#c2410c" stroke-width="6" marker-end="url(#mul-h)"/>
<rect class="box" x="90" y="280" width="140" height="56" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="160" y="303" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Outdoor taps</text>
<text x="160" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">stay unsoftened</text>
<rect class="box" x="280" y="150" width="190" height="60" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="375" y="175" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Metered softener</text>
<text x="375" y="193" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">with bypass valve</text>
<rect class="box" x="280" y="240" width="88" height="50" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="324" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Brine</text>
<text x="324" y="278" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">tank</text>
<line class="ln" x1="300" y1="210" x2="300" y2="240" stroke="#7c3aed" stroke-width="3"/>
<line class="ln" x1="440" y1="210" x2="440" y2="298" stroke="#78716c" stroke-width="3" marker-end="url(#mul-d)"/>
<rect class="box" x="392" y="304" width="96" height="40" rx="6" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<text x="440" y="329" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Drain</text>
<line class="ln" x1="470" y1="180" x2="540" y2="180" stroke="#0e7490" stroke-width="6"/>
<path class="ln" d="M540 180 L540 130 L592 130" fill="none" stroke="#0e7490" stroke-width="6" marker-end="url(#mul-s)"/>
<path class="ln" d="M540 180 L540 250 L592 250" fill="none" stroke="#0e7490" stroke-width="6" marker-end="url(#mul-s)"/>
<rect class="box" x="600" y="104" width="130" height="52" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="665" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Unit A</text>
<text x="665" y="143" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">sub-meter optional</text>
<rect class="box" x="600" y="224" width="130" height="52" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
<text x="665" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Unit B</text>
<text x="665" y="263" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">sub-meter optional</text>
<line class="ln" x1="40" y1="382" x2="80" y2="382" stroke="#c2410c" stroke-width="6"/>
<text x="90" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hard water</text>
<line class="ln" x1="200" y1="382" x2="240" y2="382" stroke="#0e7490" stroke-width="6"/>
<text x="250" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softened water</text>
<line class="ln" x1="380" y1="382" x2="420" y2="382" stroke="#78716c" stroke-width="3"/>
<text x="430" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Regeneration waste</text>
<line class="ln" x1="590" y1="382" x2="630" y2="382" stroke="#7c3aed" stroke-width="3"/>
<text x="640" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Brine</text>
<rect class="box" x="30" y="412" width="220" height="116" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="44" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Salt</text>
<text x="44" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Who buys it, who</text>
<text x="44" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">fills it, and how the</text>
<text x="44" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">cost is split</text>
<rect class="box" x="270" y="412" width="220" height="116" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="284" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Access</text>
<text x="284" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Who holds the key,</text>
<text x="284" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and how a tenant</text>
<text x="284" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">reports a fault</text>
<rect class="box" x="510" y="412" width="220" height="116" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="524" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Turnover</text>
<text x="524" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">What happens when a</text>
<text x="524" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">unit is empty or its</text>
<text x="524" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">occupancy changes</text>
</svg>
