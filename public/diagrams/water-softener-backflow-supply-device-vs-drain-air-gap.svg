<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="bfa-title bfa-desc">
<title id="bfa-title">Water softener backflow prevention: supply-side device versus drain-side air gap</title>
<desc id="bfa-desc">Plumbing layout of a water softener showing the two separate backflow protections: an optional supply-side device between the meter and the softener that protects the public main, and the drain-side air gap above a standpipe that stops drain water being pulled back into the softener.</desc>
<defs>
<pattern id="bfa-resin" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern>
<marker id="bfa-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="bfa-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="bfa-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
</defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Two backflow protections, two different jobs</text>
<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">They guard against flow in different places. One never stands in for the other.</text>
<path class="ln" d="M36,150 L424,150" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" marker-end="url(#bfa-h)"/>
<text x="36" y="132" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Water main</text>
<rect class="box" x="96" y="170" width="70" height="30" rx="5" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/>
<text x="131" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#0b2f4a">Meter</text>
<path class="ln" d="M131,156 L131,170" fill="none" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="196" y="122" width="120" height="56" rx="8" fill="#ffffff" stroke="#0b2f4a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="256" y="146" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Supply device</text>
<text x="256" y="165" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">if required</text>
<rect x="424" y="128" width="84" height="44" rx="6" fill="#0b2f4a"/>
<text x="466" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Valve</text>
<rect x="436" y="172" width="60" height="200" rx="12" fill="url(#bfa-resin)" stroke="#3a5a72" stroke-width="2"/>
<text x="466" y="394" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Softener</text>
<path class="ln" d="M508,138 L724,138" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" marker-end="url(#bfa-s)"/>
<text x="724" y="122" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#0b2f4a">To the house</text>
<path class="ln" d="M508,162 L596,162 L596,392" fill="none" stroke="#78716c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bfa-d)"/>
<text x="614" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Drain line</text>
<path d="M572,434 L572,520 L620,520 L620,434" fill="#f1f5f9" stroke="#3a5a72" stroke-width="3"/>
<text x="632" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Standpipe</text>
<text x="632" y="523" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">to sewer</text>
<path class="ln" d="M548,402 L560,402" fill="none" stroke="#15803d" stroke-width="2"/>
<path class="ln" d="M548,434 L560,434" fill="none" stroke="#15803d" stroke-width="2"/>
<path class="ln" d="M554,404 L554,432" fill="none" stroke="#15803d" stroke-width="2"/>
<text x="632" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#15803d">Air gap</text>
<text x="632" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">2 x pipe size,</text>
<text x="632" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">at least 1 inch</text>
<rect class="box" x="30" y="236" width="370" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="46" y="262" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Supply side: protects the public main</text>
<text x="46" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Stops water in your house flowing back to the street.</text>
<text x="46" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Set by the water utility or a local code rule.</text>
<text x="46" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Many single-family homes have none.</text>
<path class="ln" d="M256,178 L256,236" fill="none" stroke="#52697a" stroke-width="1.2"/>
<rect class="box" x="30" y="366" width="370" height="104" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="46" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Drain side: protects the softener</text>
<text x="46" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Stops drain or sewer water being pulled back</text>
<text x="46" y="436" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">into the softener and on into the house.</text>
<text x="46" y="456" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Required on every install.</text>
<path class="ln" d="M400,418 L540,418" fill="none" stroke="#52697a" stroke-width="1.2"/>
<rect x="30" y="514" width="26" height="6" rx="3" fill="#c2410c"/>
<text x="64" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">untreated</text>
<rect x="160" y="514" width="26" height="6" rx="3" fill="#0e7490"/>
<text x="194" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">softened</text>
<rect x="290" y="514" width="26" height="6" rx="3" fill="#78716c"/>
<text x="324" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">to drain</text>
</svg>
