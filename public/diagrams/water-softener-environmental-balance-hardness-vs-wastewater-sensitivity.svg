<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 506" width="760" height="506" role="img" aria-labelledby="wbm-title wbm-desc">
<title id="wbm-title">Water softener environmental balance by hardness and wastewater sensitivity</title>
<desc id="wbm-desc">A two-by-two grid. With room for chloride in a large river the softener is reasonable if tuned, and strongest on very hard water. Where the wastewater system is short of room for chloride, the case is weak on moderately hard water and unfavourable on very hard water.</desc>
<defs><marker id="wbm-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="506" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Where a softener's environmental balance tips</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Hardness raises salt use and heater savings together. The receiving water decides the balance.</text><text x="335" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Moderately hard water</text><text x="605" y="104" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Very hard water</text><text x="30" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Plenty of room</text><text x="30" y="192" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">for chloride</text><text x="30" y="212" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">large river,</text><text x="30" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sewer plant</text><text x="30" y="338" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">Short of room</text><text x="30" y="358" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">for chloride</text><text x="30" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">small stream, reuse,</text><text x="30" y="396" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">or septic over a</text><text x="30" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">drinking aquifer</text><rect class="box" x="205" y="120" width="255" height="150" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="221" y="152" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#15803d">Reasonable if tuned</text><text x="221" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Costs modest, benefits</text><text x="221" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">modest. Efficient settings</text><text x="221" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">keep it that way.</text><rect class="box" x="475" y="120" width="255" height="150" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="491" y="152" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#15803d">Strongest benefit</text><text x="491" y="184" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Gas heater savings largest,</text><text x="491" y="206" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">but salt use is high.</text><text x="491" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Efficiency matters most.</text><rect class="box" x="205" y="286" width="255" height="150" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="221" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#c2410c">Weak case</text><text x="221" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Small benefit, real chloride</text><text x="221" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">cost. Salt-free can protect</text><text x="221" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">the heater instead.</text><rect class="box" x="475" y="286" width="255" height="150" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="3"/><text x="491" y="318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">Balance unfavourable</text><text x="491" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Most salt where chloride</text><text x="491" y="372" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">harms most. Exchange tank,</text><text x="491" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">hot-only or salt-free.</text><path class="ln" d="M205,458 L722,458" fill="none" stroke="#3a5a72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wbm-s)"/><text x="463" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">More hardness: more salt and more heater savings</text>
</svg>
