<path class="ln" d="M526,226 L570,226" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M570,226 L626,226" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tvl-m0e7490)"/>
