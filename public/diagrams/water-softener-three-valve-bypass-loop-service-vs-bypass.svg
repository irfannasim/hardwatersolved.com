<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 636" width="760" height="636" role="img" aria-labelledby="tvl-title tvl-desc">
<title id="tvl-title">Water softener bypass valve inside a three-valve loop: service and bypass positions</title>
<desc id="tvl-desc">Two views of a water softener with an integral bypass inside a three-valve loop. In service the inlet and outlet valves are open and the loop valve is closed, so water passes through the softener. In bypass the inlet and outlet valves are closed and the loop valve is open, so the softener is isolated and can be replaced while the house stays on water.</desc>
<defs><marker id="tvl-mc2410c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="tvl-m0e7490" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><pattern id="tvl-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="636" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Integral bypass inside a three-valve loop</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">The most serviceable layout: the whole softener can come out with the house still on water.</text>
<text x="30" y="106" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0e7490">SERVICE</text>
<text x="108" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">inlet and outlet open, loop closed: the house gets soft water</text>
<text x="30" y="231" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">SUPPLY</text>
<text x="650" y="231" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">HOUSE</text>
