<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="ems-title ems-desc">
<title id="ems-title">Espresso machine: where scale forms vs where coffee is extracted</title>
<desc id="ems-desc">Water path through an espresso machine from tank to pump, boiler, group head, coffee puck and cup, with a branch to the steam wand. Scale forms in the heated parts: boiler, heating element, valves and steam wand. Extraction happens only at the coffee puck, where some mineral content helps flavour. That is why the machine wants soft water and the cup wants some hardness.</desc>
<defs><marker id="ems-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">The machine and the cup want different water</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Water path through a typical boiler espresso machine</text>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<rect class="box" x="30" y="112" width="110" height="66" rx="6" fill="#dbeafe" stroke="#3a5a72" stroke-width="2"/>
<text x="85" y="142" font-size="14" font-weight="bold" fill="#0b2f4a">Water</text>
<text x="85" y="160" font-size="14" font-weight="bold" fill="#0b2f4a">tank</text>
<rect class="box" x="180" y="120" width="100" height="50" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="230" y="150" font-size="14" font-weight="bold" fill="#0b2f4a">Pump</text>
<rect class="box" x="320" y="96" width="180" height="120" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="410" y="126" font-size="14" font-weight="bold" fill="#0b2f4a">Boiler</text>
<text x="410" y="146" font-size="13" fill="#dc2626">scale on walls and</text>
<text x="410" y="164" font-size="13" fill="#dc2626">heating element</text>
<path d="M340,196 L355,184 L370,196 L385,184 L400,196 L415,184 L430,196 L445,184 L460,196 L475,184 L480,188" fill="none" stroke="#c2410c" stroke-width="3"/>
<rect class="box" x="540" y="104" width="190" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="635" y="132" font-size="14" font-weight="bold" fill="#0b2f4a">Group head, valves</text>
<text x="635" y="152" font-size="13" fill="#dc2626">scale narrows passages</text>
<rect class="box" x="565" y="214" width="140" height="56" rx="6" fill="#e6f4f7" stroke="#0e7490" stroke-width="2.5"/>
<text x="635" y="238" font-size="14" font-weight="bold" fill="#0e7490">Coffee puck</text>
<text x="635" y="257" font-size="13" fill="#0b2f4a">extraction</text>
<rect class="box" x="585" y="310" width="100" height="44" rx="6" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/>
<text x="635" y="337" font-size="14" font-weight="bold" fill="#0b2f4a">Cup</text>
<rect class="box" x="335" y="262" width="150" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
<text x="410" y="286" font-size="14" font-weight="bold" fill="#0b2f4a">Steam wand</text>
<text x="410" y="305" font-size="13" fill="#dc2626">scale at the tip</text>
</g>
<g stroke="#3a5a72" stroke-width="5" fill="none" marker-end="url(#ems-ah)">
<line class="ln" x1="140" y1="145" x2="174" y2="145"/>
<line class="ln" x1="280" y1="145" x2="314" y2="145"/>
<line class="ln" x1="500" y1="137" x2="534" y2="137"/>
<line class="ln" x1="635" y1="170" x2="635" y2="208"/>
<line class="ln" x1="635" y1="270" x2="635" y2="304"/>
<line class="ln" x1="410" y1="216" x2="410" y2="256"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">
<rect x="30" y="384" width="18" height="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="58" y="396">Heated parts: hardness drops out as scale. Softening protects these.</text>
<rect x="30" y="412" width="18" height="14" fill="#e6f4f7" stroke="#0e7490" stroke-width="2"/>
<text x="58" y="424">Extraction: some calcium and magnesium help flavour. Full softening removes them.</text>
<text x="30" y="454" fill="#52697a">The fix is water in between, not either extreme. Check your machine's manual for its range.</text>
</g>
</svg>
