<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="cws-title cws-desc">
<title id="cws-title">Carbon filter and water softener together: weekly regeneration schedule</title>
<desc id="cws-desc">Illustrative week showing a carbon filter and water softener together: at factory defaults both regenerate at 2:00 a.m. and clash on Thursday; staggered with carbon at 12:30 a.m. and the softener at 2:00 a.m., they never overlap.</desc>
<defs></defs>
<rect width="760" height="640" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Carbon filter and softener: one week of regenerations</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Carbon backwashes every 3 days on a timer. The softener regenerates when its meter says so.</text><text x="30" y="100" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">Factory defaults: both set to 2:00 a.m.</text><text x="30" y="119" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">On Thursday both units regenerate together.</text><text x="172.9" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Mon</text><text x="258.6" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Tue</text><text x="344.3" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Wed</text><text x="430" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Thu</text><text x="515.7" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Fri</text><text x="601.4" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Sat</text><text x="687.1" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Sun</text><path d="M130,152 L730,152" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="157" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">12 a.m.</text><path d="M130,186.5 L730,186.5" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="191.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">1 a.m.</text><path d="M130,221 L730,221" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">2 a.m.</text><path d="M130,255.5 L730,255.5" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="260.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">3 a.m.</text><path d="M130,290 L730,290" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="295" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">4 a.m.</text><path d="M130,152 L130,290" stroke="#e2e8f0" stroke-width="1"/><path d="M215.7,152 L215.7,290" stroke="#e2e8f0" stroke-width="1"/><path d="M301.4,152 L301.4,290" stroke="#e2e8f0" stroke-width="1"/><path d="M387.1,152 L387.1,290" stroke="#e2e8f0" stroke-width="1"/><path d="M472.9,152 L472.9,290" stroke="#e2e8f0" stroke-width="1"/><path d="M558.6,152 L558.6,290" stroke="#e2e8f0" stroke-width="1"/><path d="M644.3,152 L644.3,290" stroke="#e2e8f0" stroke-width="1"/><path d="M730,152 L730,290" stroke="#e2e8f0" stroke-width="1"/><rect x="138" y="221" width="32.9" height="17.3" fill="#3a5a72" rx="3"/><rect x="395.1" y="221" width="32.9" height="17.3" fill="#3a5a72" rx="3"/><rect x="652.3" y="221" width="32.9" height="17.3" fill="#3a5a72" rx="3"/><rect x="260.6" y="221" width="32.9" height="60.4" fill="#e2b865" stroke="#b45309" stroke-width="1" rx="3"/><rect x="432" y="221" width="32.9" height="60.4" fill="#e2b865" stroke="#b45309" stroke-width="1" rx="3"/><rect x="603.4" y="221" width="32.9" height="60.4" fill="#e2b865" stroke="#b45309" stroke-width="1" rx="3"/><rect x="390.1" y="217" width="79.7" height="25.3" fill="none" stroke="#dc2626" stroke-width="3" rx="4"/><text x="30" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#15803d">Staggered: carbon at 12:30 a.m., softener at 2:00 a.m.</text><text x="30" y="359" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Carbon has finished and rinsed an hour before the softener starts.</text><text x="172.9" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Mon</text><text x="258.6" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Tue</text><text x="344.3" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Wed</text><text x="430" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Thu</text><text x="515.7" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Fri</text><text x="601.4" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Sat</text><text x="687.1" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Sun</text><path d="M130,392 L730,392" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="397" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">12 a.m.</text><path d="M130,426.5 L730,426.5" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="431.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">1 a.m.</text><path d="M130,461 L730,461" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="466" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">2 a.m.</text><path d="M130,495.5 L730,495.5" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="500.5" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">3 a.m.</text><path d="M130,530 L730,530" stroke="#e2e8f0" stroke-width="1"/><text x="120" y="535" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="end" fill="#52697a">4 a.m.</text><path d="M130,392 L130,530" stroke="#e2e8f0" stroke-width="1"/><path d="M215.7,392 L215.7,530" stroke="#e2e8f0" stroke-width="1"/><path d="M301.4,392 L301.4,530" stroke="#e2e8f0" stroke-width="1"/><path d="M387.1,392 L387.1,530" stroke="#e2e8f0" stroke-width="1"/><path d="M472.9,392 L472.9,530" stroke="#e2e8f0" stroke-width="1"/><path d="M558.6,392 L558.6,530" stroke="#e2e8f0" stroke-width="1"/><path d="M644.3,392 L644.3,530" stroke="#e2e8f0" stroke-width="1"/><path d="M730,392 L730,530" stroke="#e2e8f0" stroke-width="1"/><rect x="138" y="409.3" width="32.9" height="17.3" fill="#3a5a72" rx="3"/><rect x="395.1" y="409.3" width="32.9" height="17.3" fill="#3a5a72" rx="3"/><rect x="652.3" y="409.3" width="32.9" height="17.3" fill="#3a5a72" rx="3"/><rect x="260.6" y="461" width="32.9" height="60.4" fill="#e2b865" stroke="#b45309" stroke-width="1" rx="3"/><rect x="432" y="461" width="32.9" height="60.4" fill="#e2b865" stroke="#b45309" stroke-width="1" rx="3"/><rect x="603.4" y="461" width="32.9" height="60.4" fill="#e2b865" stroke="#b45309" stroke-width="1" rx="3"/><rect x="30" y="548" width="26" height="14" fill="#3a5a72" rx="3"/><text x="64" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Carbon backwash and rinse (about 30 min)</text><rect x="400" y="548" width="26" height="14" fill="#e2b865" stroke="#b45309" stroke-width="1" rx="3"/><text x="434" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Softener regeneration (about 1 h 45 min)</text><text x="30" y="594" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Overlap means two drain flows at once, untreated water passed to the softener, and</text><text x="30" y="612" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">each backwash competing for supply. Illustrative days and durations: read your manuals.</text>
</svg>
