<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="hbv-title hbv-desc">
<title id="hbv-title">Water softener before or after water heater: which branches may leave the main first</title>
<desc id="hbv-desc">Vertical plumbing diagram of the main line. Outdoor taps, irrigation and an optional kitchen drinking tap may branch off before the water softener, but the water heater cold feed must never branch there; it, the fixtures and any recirculation return belong after the softener.</desc>
<defs><marker id="hbv-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="hbv-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="hbv-x" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="660" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Which lines may leave the main before the softener</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Hard-side branches are a choice. The water heater is never one of them.</text><rect class="box" x="320" y="92" width="120" height="40" rx="8" fill="#f1f5f9" stroke="#3a5a72" stroke-width="2"/><text x="380" y="117" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">main shutoff</text><path class="ln" d="M380,132 L380,372" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M380,170 L308,170" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbv-h)"/><text x="290" y="166" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Outdoor hose taps</text><text x="290" y="184" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#15803d">OK on hard water</text><path class="ln" d="M380,226 L308,226" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbv-h)"/><text x="290" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Lawn irrigation</text><text x="290" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#15803d">OK on hard water</text><path class="ln" d="M380,282 L308,282" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbv-h)"/><text x="290" y="278" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#0b2f4a">Kitchen cold drinking tap</text><text x="290" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">Optional, on its own line</text><path class="ln" d="M380,338 L308,338" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#hbv-x)"/><text x="290" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#dc2626">Water heater cold feed</text><text x="290" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">NEVER here</text><rect class="box" x="320" y="372" width="120" height="48" rx="8" fill="#0b2f4a" stroke="#0b2f4a" stroke-width="2"/><text x="380" y="401" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">SOFTENER</text><path class="ln" d="M380,420 L380,600" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbv-s)"/><path class="ln" d="M380,456 L452,456" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbv-s)"/><text x="470" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Water heater cold inlet</text><text x="470" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0e7490">Always after the softener</text><path class="ln" d="M380,512 L452,512" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbv-s)"/><text x="470" y="508" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Showers, laundry, dishwasher</text><text x="470" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0e7490">After the softener</text><path class="ln" d="M380,568 L452,568" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#hbv-s)"/><text x="470" y="564" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Hot water recirculation return</text><text x="470" y="582" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0e7490">Must stay on the soft side</text><text x="30" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Toilets and a utility</text><text x="30" y="488" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">sink may also go on</text><text x="30" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">the hard side.</text><rect x="30" y="630" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="638" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">hard water</text><rect x="160" y="630" width="26" height="6" rx="3" fill="#0e7490"/><text x="194" y="638" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text><rect x="320" y="630" width="26" height="6" rx="3" fill="#dc2626"/><text x="354" y="638" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">wrong connection</text>
</svg>
