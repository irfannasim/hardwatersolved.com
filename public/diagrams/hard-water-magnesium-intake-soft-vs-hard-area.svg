<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="g26mg-title g26mg-desc">
<title id="g26mg-title">Magnesium from hard water vs soft water compared with daily need</title>
<desc id="g26mg-desc">Bar chart showing that two litres a day of drinking water supply about 2.3 mg of magnesium in soft water areas and 52.1 mg in hard water areas, compared with a recommended intake of 200 to 400 mg a day. Figures from the WHO background document on hardness in drinking water.</desc>
<rect width="760" height="420" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Magnesium from 2 litres of drinking water a day</text>
<text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Estimated intake by area, against the typical recommended daily intake</text>
<path class="ln" d="M260,110 L260,330" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M375,330 L375,337" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M490,330 L490,337" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M605,330 L605,337" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M720,330 L720,337" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M260,330 L720,330" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<text x="260" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">0</text>
<text x="375" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">100</text>
<text x="490" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">200</text>
<text x="605" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">300</text>
<text x="720" y="352" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">400</text>
<text x="490" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a" text-anchor="middle">milligrams of magnesium per day</text>
<text x="244" y="145" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="end">Soft water area</text>
<rect x="260" y="126" width="3" height="30" fill="#0e7490"/>
<text x="276" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">2.3 mg</text>
<text x="244" y="215" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="end">Hard water area</text>
<rect x="260" y="196" width="60" height="30" fill="#c2410c"/>
<text x="332" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#c2410c">52.1 mg</text>
<text x="244" y="285" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="end">Recommended intake</text>
<rect x="490" y="266" width="230" height="30" fill="#dbeafe" stroke="#3a5a72" stroke-width="1.5"/>
<text x="478" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a" text-anchor="end">200 to 400 mg</text>
<text x="30" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Source: WHO, Hardness in Drinking-water (2010). Food supplies most calcium and magnesium.</text>
</svg>
