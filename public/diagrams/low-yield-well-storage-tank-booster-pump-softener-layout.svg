<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-labelledby="lys-title lys-desc">
<title id="lys-title">Low-yield well storage tank layout with booster pump and water softener</title>
<desc id="lys-desc">Layout for a water softener on a low-yield well: the well pump fills a non-pressurized storage tank at the well's own pace, a booster pump and pressure tank feed the softener, and the softener backwashes from stored water at the booster pump's rate.</desc>
<defs>
<marker id="lys-hard" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker>
<marker id="lys-soft" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
<marker id="lys-drain" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker>
<pattern id="lys-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern>
</defs>
<rect width="760" height="610" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Storage-buffered softener on a low-yield well</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">The well refills the tank slowly. The booster pump supplies the backwash.</text>
<line x1="30" y1="200" x2="120" y2="200" stroke="#78716c" stroke-width="2"/>
<rect x="62" y="330" width="26" height="140" fill="#dbeafe"/>
<line x1="60" y1="150" x2="60" y2="470" stroke="#3a5a72" stroke-width="3"/>
<line x1="90" y1="150" x2="90" y2="470" stroke="#3a5a72" stroke-width="3"/>
<rect x="66" y="420" width="18" height="36" rx="3" fill="#0b2f4a"/>
<path class="ln" d="M75,420 L75,128 L200,128 L200,218" fill="none" stroke="#c2410c" stroke-width="5" stroke-linejoin="round" marker-end="url(#lys-hard)"/>
<text x="112" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Well pump: at or below yield</text>
<rect x="150" y="230" width="130" height="170" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="152" y="280" width="126" height="118" fill="#dbeafe"/>
<text x="215" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">float switch</text>
<circle cx="264" cy="282" r="7" fill="#52697a"/>
<path class="ln" d="M280,380 L306,380" fill="none" stroke="#c2410c" stroke-width="5"/>
<circle cx="326" cy="380" r="18" fill="#0b2f4a"/>
<path class="ln" d="M344,380 L380,380" fill="none" stroke="#c2410c" stroke-width="5" marker-end="url(#lys-hard)"/>
<rect x="390" y="300" width="50" height="100" rx="20" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/>
<path class="ln" d="M440,380 L466,380 L466,250 L490,250" fill="none" stroke="#c2410c" stroke-width="5" stroke-linejoin="round" marker-end="url(#lys-hard)"/>
<rect x="500" y="230" width="70" height="30" rx="4" fill="#0b2f4a"/>
<rect x="505" y="262" width="60" height="158" rx="22" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/>
<rect x="509" y="300" width="52" height="114" rx="16" fill="url(#lys-beads)"/>
<path class="ln" d="M570,248 L648,248" fill="none" stroke="#0e7490" stroke-width="5" marker-end="url(#lys-soft)"/>
<text x="578" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0e7490">Soft water to house</text>
<path class="ln" d="M545,230 L545,190 L715,190 L715,382" fill="none" stroke="#78716c" stroke-width="5" stroke-linejoin="round" marker-end="url(#lys-drain)"/>
<text x="560" y="178" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Backwash to drain</text>
<polygon points="703,394 727,394 721,404 709,404" fill="#78716c"/>
<text x="715" y="426" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">drain</text>
<text x="30" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">Low-yield well</text>
<text x="30" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">with low-water cutoff</text>
<text x="215" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Storage tank</text>
<text x="215" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">not pressurized</text>
<text x="326" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Booster</text><text x="326" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">pump</text>
<text x="415" y="424" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Pressure</text>
<text x="415" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">tank</text>
<text x="535" y="446" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Softener</text>
<text x="535" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">after the booster</text>
<rect class="box" x="200" y="492" width="530" height="62" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="216" y="516" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Backwash draws on stored water at the booster pump's rate.</text>
<text x="216" y="538" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Put the softener before the storage tank and nothing is gained.</text>
<rect x="30" y="582" width="26" height="6" rx="3" fill="#c2410c"/>
<text x="64" y="590" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">untreated water</text>
<rect x="200" y="582" width="26" height="6" rx="3" fill="#0e7490"/>
<text x="234" y="590" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">softened water</text>
<rect x="360" y="582" width="26" height="6" rx="3" fill="#78716c"/>
<text x="394" y="590" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">to drain</text>
<circle cx="490" cy="585" r="6" fill="#e2b865"/>
<text x="504" y="590" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">resin</text>
</svg>
