<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="bwsc-title bwsc-desc">
<title id="bwsc-title">Best water softener picks: box rating versus capacity at 6 lb of salt per cubic foot</title>
<desc id="bwsc-desc">Bar chart comparing each best water softener pick by its box grain rating and by its capacity at an efficient 6 lb per cubic foot salt dose, about 21,000 grains per cubic foot of resin.</desc>
<defs><marker id="bwsc-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="bwsc-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="bwsc-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="bwsc-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="bwsc-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="bwsc-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="bwsc-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Box rating vs capacity at an efficient salt dose</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Grains per regeneration at 6 lb of salt per cubic foot (about 21,000 grains per cu ft)</text>
<path d="M250,90 L250,420" stroke="#e2e8f0" stroke-width="1"/>
<text x="250" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0k</text>
<path d="M350,90 L350,420" stroke="#e2e8f0" stroke-width="1"/>
<text x="350" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">20k</text>
<path d="M450,90 L450,420" stroke="#e2e8f0" stroke-width="1"/>
<text x="450" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">40k</text>
<path d="M550,90 L550,420" stroke="#e2e8f0" stroke-width="1"/>
<text x="550" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">60k</text>
<path d="M650,90 L650,420" stroke="#e2e8f0" stroke-width="1"/>
<text x="650" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">80k</text>
<text x="475" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Grains removed between regenerations</text>
<text x="30" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">AFW 48k, 10% resin</text>
<text x="30" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">1.5 cu ft</text>
<rect x="250" y="98" width="240" height="20" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="498" y="113" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#3a5a72">48,000 box</text>
<rect x="250" y="124" width="157.5" height="20" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/>
<text x="415.5" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">31,500</text>
<text x="30" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Aquasure Harmony 48k</text>
