<rect x="250" y="164" width="240" height="20" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="498" y="179" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#3a5a72">48,000 box</text>
<rect x="250" y="190" width="157.5" height="20" fill="#a5d8e3" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="415.5" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">about 31,500 if 1.5 cu ft</text>
<text x="30" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">SoftPro Elite 48k</text>
<text x="30" y="266" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin volume not stated</text>
<rect x="250" y="230" width="240" height="20" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="498" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#3a5a72">48,000 box</text>
<rect x="250" y="256" width="157.5" height="20" fill="#a5d8e3" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="415.5" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">about 31,500 if 1.5 cu ft</text>
<text x="30" y="314" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">AFW Iron Pro 2 64k</text>
<text x="30" y="332" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">2.0 cu ft fine mesh</text>
<rect x="250" y="296" width="320" height="20" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="578" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#3a5a72">64,000 box</text>
<rect x="250" y="322" width="210" height="20" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/>
<text x="468" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">42,000</text>
<text x="30" y="380" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">80k Fleck 2510SXT</text>
<text x="30" y="398" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">2.5 cu ft</text>
<rect x="250" y="362" width="400" height="20" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="658" y="377" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#3a5a72">80,000 box</text>
<rect x="250" y="388" width="262.5" height="20" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/>
<text x="520.5" y="403" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#0e7490">52,500</text>
<path class="ln" d="M250,90 L250,420" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="486" width="26" height="14" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/>
<text x="64" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Box rating (maximum-salt figure)</text>
<rect x="330" y="486" width="26" height="14" fill="#0e7490" stroke="#0e7490" stroke-width="1.5"/>
<text x="364" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">At 6 lb per cu ft</text>
<rect x="500" y="486" width="26" height="14" fill="#a5d8e3" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="534" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Estimated: volume not published</text>
<text x="30" y="526" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Capacity at 6 lb comes from published resin design tables. Real units vary by a few percent.</text>
