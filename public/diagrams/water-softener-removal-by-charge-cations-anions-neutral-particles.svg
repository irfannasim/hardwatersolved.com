<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="wsc-title wsc-desc">
<title id="wsc-title">What a water softener removes, sorted by charge</title>
<desc id="wsc-desc">Diagram sorting contaminants into four groups: positive ions such as calcium, magnesium, barium and radium that a water softener’s resin can exchange for sodium, and negative ions, uncharged molecules and gases, and particles and microbes, which pass through a softener.</desc>
<defs><marker id="wsc-m0e7490" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="wsc-mc2410c" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker></defs>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">What a water softener removes, sorted by charge</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Softener resin only grips positive ions. The other three groups pass through.</text><rect class="box" x="30" y="88" width="154" height="54" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/><text x="107" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e7490">Positive ions</text><text x="107" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0e7490">(cations)</text><text x="38" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Calcium</text><text x="38" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Magnesium</text><text x="38" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Ferrous iron *</text><text x="38" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Manganese *</text><text x="38" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Barium</text><text x="38" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Radium</text><text x="38" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Copper (partly)</text><text x="38" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Lead (not certified)</text><rect class="box" x="212" y="88" width="154" height="54" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="289" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">Negative ions</text><text x="289" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#c2410c">(anions)</text><text x="220" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Nitrate</text><text x="220" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fluoride</text><text x="220" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Arsenate (As V)</text><text x="220" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Chromate (Cr VI)</text><text x="220" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sulfate</text><text x="220" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">PFAS (PFOA, PFOS)</text><rect class="box" x="394" y="88" width="154" height="54" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="471" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">Uncharged</text><text x="471" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#c2410c">molecules and gases</text><text x="402" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Chlorine</text><text x="402" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Chloramine</text><text x="402" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">VOCs, pesticides</text><text x="402" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Radon</text><text x="402" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Hydrogen sulfide</text><text x="402" y="292" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Most silica</text><text x="402" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Arsenite (As III)</text><rect class="box" x="576" y="88" width="154" height="54" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="653" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#c2410c">Particles</text><text x="653" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#c2410c">and microbes</text><text x="584" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sediment, rust flakes</text><text x="584" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Particulate lead</text><text x="584" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Microplastics</text><text x="584" y="244" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Bacteria, viruses</text><text x="584" y="268" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Cysts</text><rect x="30" y="372" width="700" height="50" rx="6" fill="#f6ead2" stroke="#e2b865" stroke-width="2"/><text x="107" y="403" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Resin bed</text><text x="505" y="403" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">Nothing to exchange</text><path class="ln" d="M107,350 L107,366" fill="none" stroke="#0e7490" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsc-m0e7490)"/><path class="ln" d="M232,350 L232,452" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsc-mc2410c)"/><path class="ln" d="M414,350 L414,452" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsc-mc2410c)"/><path class="ln" d="M596,350 L596,452" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wsc-mc2410c)"/><rect class="box" x="30" y="460" width="154" height="72" rx="8" fill="#e6f4f6" stroke="#0e7490" stroke-width="2"/><text x="107" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Held on the resin.</text><text x="107" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Sodium goes to</text><text x="107" y="518" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">the house instead</text><rect class="box" x="212" y="460" width="154" height="72" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="289" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Pass through</text><text x="289" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">unchanged</text><rect class="box" x="394" y="460" width="154" height="72" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="471" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Pass through</text><text x="471" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">unchanged</text><rect class="box" x="576" y="460" width="154" height="72" rx="8" fill="#fdf0e8" stroke="#c2410c" stroke-width="2"/><text x="653" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Pass through</text><text x="653" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">or foul the bed</text><text x="30" y="562" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">* Only within the manufacturer’s rating, and only while still dissolved.</text><text x="30" y="582" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">NSF/ANSI 44 softener claims: hardness, plus elective barium and radium 226/228. Nothing else.</text>
</svg>
