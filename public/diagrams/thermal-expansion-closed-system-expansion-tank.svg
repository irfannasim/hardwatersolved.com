<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" role="img" aria-labelledby="g4wx-title g4wx-desc">
<title id="g4wx-title">Thermal expansion on a closed plumbing system with an expansion tank</title>
<desc id="g4wx-desc">Closed plumbing system diagram: a PRV, check valve or backflow preventer stops heated water flowing back to the main, so a 40-gallon water heater growing about half a gallon raises pressure unless an expansion tank on the cold supply absorbs it.</desc>
<defs><marker id="g4wx-ak" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="g4wx-af" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="760" height="440" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Thermal expansion on a closed system</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">A PRV, check valve or backflow preventer stops heated water pushing back to the main.</text><rect class="box" x="30" y="196" width="110" height="50" rx="8" fill="#3a5a72" stroke="#3a5a72" stroke-width="2"/><text x="85" y="217" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">STREET</text><text x="85" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">MAIN</text><rect class="box" x="170" y="190" width="170" height="62" rx="8" fill="#f8fafc" stroke="#0b2f4a" stroke-width="2"/><text x="255" y="214" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">PRV / check valve /</text><text x="255" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">backflow preventer</text><path class="ln" d="M140,221 L166,221" fill="none" stroke="#3a5a72" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4wx-ak)"/><path class="ln" d="M340,221 L526,221" fill="none" stroke="#3a5a72" stroke-width="6" stroke-linecap="butt" stroke-linejoin="round" marker-end="url(#g4wx-ak)"/><path class="ln" d="M330,282 L170,282" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#g4wx-af)"/><path d="M240,272 L260,292 M260,272 L240,292" stroke="#dc2626" stroke-width="3"/><text x="170" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">expanding water can’t flow back to the main</text><path class="ln" d="M450,218 L450,176" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="butt" stroke-linejoin="round"/><rect x="426" y="104" width="48" height="72" rx="20" fill="#f8fafc" stroke="#15803d" stroke-width="2.5"/><path d="M430,142 L470,142" stroke="#3a5a72" stroke-width="2"/><text x="414" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#15803d">Expansion tank</text><text x="414" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">air pre-charge = the</text><text x="414" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">house static pressure</text><rect class="box" x="530" y="150" width="170" height="190" rx="8" fill="#fff7ed" stroke="#3a5a72" stroke-width="2"/><text x="615" y="216" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">WATER HEATER</text><text x="615" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">40 gallons heated</text><text x="615" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">to about 120°F</text><text x="615" y="282" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">grows ~½ gallon</text><path class="ln" d="M680,150 L680,122" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="butt" stroke-linejoin="round"/><rect x="670" y="108" width="20" height="14" rx="2" fill="#dc2626"/><text x="730" y="94" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#0b2f4a">T&amp;P relief valve drips</text><rect class="box" x="30" y="360" width="700" height="60" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="46" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">The fix is an expansion tank on the cold supply to the water heater,</text><text x="46" y="404" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">downstream of every PRV, check valve or backflow device. Not another arrestor.</text>
</svg>
