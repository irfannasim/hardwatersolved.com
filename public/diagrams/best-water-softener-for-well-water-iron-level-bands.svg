<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="bwww-title bwww-desc">
<title id="bwww-title">Best water softener for well water by dissolved iron level</title>
<desc id="bwww-desc">Scale of dissolved iron in well water from 0 to 8 ppm split into three bands: under 1 ppm and 1 to 3 ppm each map to fine-mesh softener picks, and over 3 ppm sends the well to an iron filter first. Published iron ratings at 2, 5 and 6 ppm are marked.</desc>
<defs><marker id="bwww-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker><marker id="bwww-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="bwww-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="bwww-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="bwww-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="bwww-i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="bwww-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="520" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Which pick for how much iron</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Dissolved (clear-water) iron from a lab test. Rusty water at the tap goes straight to the red band.</text>
<rect class="box" x="30" y="86" width="220" height="92" rx="6" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="140" y="109.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e7490">Under 1 ppm</text>
<text x="140" y="127.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">AFW Iron Pro 48k</text>
<text x="140" y="145.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Aquasure Harmony 48k</text>
<text x="140" y="163.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">fine mesh</text>
<rect class="box" x="270" y="86" width="220" height="92" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="380" y="109.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#b45309">1 to 3 ppm</text>
<text x="380" y="127.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">AFW Iron Pro 2 64k</text>
<text x="380" y="145.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">AFW Iron Pro 2 80k</text>
<text x="380" y="163.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">fine mesh, bigger bed</text>
<rect class="box" x="510" y="86" width="220" height="92" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="620" y="109.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#dc2626">Over 3 ppm</text>
<text x="620" y="127.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">Iron filter first</text>
<text x="620" y="145.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">softener after it,</text>
<text x="620" y="163.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">sized on hardness only</text>
<path class="ln" d="M140,178 L100,226" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M380,178 L220,226" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M620,178 L500,226" fill="none" stroke="#52697a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="228" width="80" height="34" fill="#a5d8e3" stroke="#0e7490" stroke-width="1.5"/>
<rect x="140" y="228" width="160" height="34" fill="#fcd9b6" stroke="#b45309" stroke-width="1.5"/>
<rect x="300" y="228" width="400" height="34" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<path class="ln" d="M300,226 L300,270" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="312" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">This guide’s cut-off: 3 ppm</text>
<path class="ln" d="M60,262 L60,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">0</text>
<path class="ln" d="M140,262 L140,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="140" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">1</text>
<path class="ln" d="M220,262 L220,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="220" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">2</text>
<path class="ln" d="M300,262 L300,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">3</text>
<path class="ln" d="M380,262 L380,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="380" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">4</text>
<path class="ln" d="M460,262 L460,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="460" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">5</text>
<path class="ln" d="M540,262 L540,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="540" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">6</text>
<path class="ln" d="M620,262 L620,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="620" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">7</text>
<path class="ln" d="M700,262 L700,270" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="700" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">8</text>
<text x="380" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#52697a">Dissolved iron, ppm (mg/L)</text>
<path class="ln" d="M220,324 L220,350" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<path d="M214,322 L226,322 L220,330 z" fill="#3a5a72"/>
<path class="ln" d="M460,324 L460,350" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<path d="M454,322 L466,322 L460,330 z" fill="#3a5a72"/>
<path class="ln" d="M540,324 L540,350" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>
<path d="M534,322 L546,322 L540,330 z" fill="#3a5a72"/>
<text x="220" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">2 ppm: one residential</text>
<text x="220" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">softener manual</text>
<text x="454" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0b2f4a">5 mg/L: Penn State,</text>
<text x="454" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#0b2f4a">pH above 6.7</text>
<text x="546" y="370" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">6 ppm: AFW Iron</text>
<text x="546" y="387" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pro seller rating</text>
<text x="30" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Published ceilings answer different questions. A seller’s rating is the best case for that unit;</text>
<text x="30" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">resin cleaners rarely keep up with more than 1 to 2 mg/L. Above 3 ppm, or with any oxidised iron,</text>
<text x="30" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">a dedicated iron filter protects the softener and lets it be sized on hardness alone.</text>
<text x="30" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#b45309">Iron adds load: program about 4 gpg of extra hardness for each ppm (AFW’s instruction).</text>
</svg>
