<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="kpb-title kpb-desc">
<title id="kpb-title">Kinetico water softener cost: largest premium that pays back in 15 years</title>
<desc id="kpb-desc">Illustrative chart for Kinetico water softener cost: against an installed Fleck 9100SXT twin tank run on a heavy salt setting, 15 years of Kinetico 2030s savings repay a premium of only about $3 at 7 gpg, $287 at 15 gpg or $642 at 25 gpg, below the premium of roughly $1,000 on even the lowest owner-reported quote when checked.</desc>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Largest Kinetico premium that pays back in 15 years</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#52697a">Illustrative. Family of four, 300 gal/day. Premium over an installed Fleck 9100SXT twin, heavy salt setting.</text>
<path class="ln" d="M104,440.0 L110,440.0" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="98" y="445.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$0</text>
<path class="ln" d="M104,386.7 L110,386.7" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="98" y="391.7" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$200</text>
<path class="ln" d="M104,333.3 L110,333.3" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="98" y="338.3" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$400</text>
<path class="ln" d="M104,280.0 L110,280.0" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="98" y="285.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$600</text>
<path class="ln" d="M104,226.7 L110,226.7" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="98" y="231.7" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$800</text>
<path class="ln" d="M104,173.3 L110,173.3" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="98" y="178.3" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$1,000</text>
<path class="ln" d="M104,120.0 L110,120.0" stroke="#3a5a72" stroke-width="1.5" fill="none"/>
<text x="98" y="125.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">$1,200</text>
<path class="ln" d="M110,110 L110,440" stroke="#3a5a72" stroke-width="2" fill="none"/>
<path class="ln" d="M110,440 L720,440" stroke="#3a5a72" stroke-width="2" fill="none"/>
<path class="ln" d="M112,173.3 L720,173.3" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<text x="415" y="158" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">Premium on the lowest owner-reported quote: roughly $1,000</text>
<rect x="195" y="438.4" width="90" height="1.6" fill="#0e7490"/>
<text x="240" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">$3</text>
<rect x="370" y="363.5" width="90" height="76.5" fill="#0e7490"/>
<text x="415" y="351" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">$287</text>
<rect x="545" y="268.8" width="90" height="171.2" fill="#0e7490"/>
<text x="590" y="256" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">$642</text>
<text x="240" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">7 gpg</text>
<text x="415" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">15 gpg</text>
<text x="590" y="464" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">25 gpg</text>
<rect x="110" y="492" width="16" height="16" fill="#0e7490"/>
<text x="134" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13.5" text-anchor="start" fill="#0b2f4a">Premium that 15 years of savings repays</text>
<text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#52697a">Savings = salt, water, power and service allowance vs the Fleck: about $0.22, $19 and $43 a year.</text>
</svg>
