<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="kpb-title kpb-desc">
<title id="kpb-title">Kinetico water softener cost: highest quote that pays back in 15 years</title>
<desc id="kpb-desc">Illustrative chart for Kinetico water softener cost: against a Fleck 9100SXT twin tank installed for about $1,890 and run on a heavy salt setting, a Kinetico 2030s repays its premium within 15 years only if quoted at no more than about $1,893 at 7 gpg, $2,177 at 15 gpg or $2,532 at 25 gpg, below the $2,895 to $5,985 owner-reported quotes.</desc>
<rect width="760" height="600" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Highest Kinetico quote that pays back in 15 years</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#52697a">Illustrative. Family of four, 300 gal/day. Baseline: Fleck 9100SXT twin, $1,890 installed, heavy salt setting.</text>
