<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="pbh-title pbh-desc">
<title id="pbh-title">Proportional brining vs fixed salt dosing: salt per year for three household patterns</title>
<desc id="pbh-desc">Illustrative bar chart of salt used per year by the same water softener with a fixed salt dose and with proportional brining: a steady household uses 469 versus 462 pounds, a variable weekday and weekend household 547 versus 484 pounds, and a seasonal home 306 versus 151 pounds.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Salt per year: fixed dose vs proportional brining</text>
<text x="30" y="62" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Same softener, same hardness. Only the household's pattern of use changes.</text>
<text x="30" y="124" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Steady</text>
<text x="30" y="143" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">3 people, 225 gal a day</text>
<rect x="250" y="106" width="312.7" height="24" fill="#52697a"/>
<text x="570.7" y="123" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">469 lb</text>
<rect x="250" y="134" width="308" height="24" fill="#0e7490"/>
<text x="566" y="151" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">462 lb <tspan font-weight="normal" fill="#52697a">(2% less)</tspan></text>
<text x="30" y="214" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Variable</text>
<text x="30" y="233" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">150 gal weekdays, 450 weekends</text>
<rect x="250" y="196" width="364.7" height="24" fill="#52697a"/>
<text x="622.7" y="213" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">547 lb</text>
<rect x="250" y="224" width="322.7" height="24" fill="#0e7490"/>
<text x="580.7" y="241" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">484 lb <tspan font-weight="normal" fill="#52697a">(12% less)</tspan></text>
<text x="30" y="304" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Seasonal</text>
<text x="30" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">17 weeks home, 35 away</text>
<rect x="250" y="286" width="204" height="24" fill="#52697a"/>
<text x="462" y="303" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">306 lb</text>
<rect x="250" y="314" width="100.7" height="24" fill="#0e7490"/>
<text x="358.7" y="331" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0b2f4a">151 lb <tspan font-weight="normal" fill="#52697a">(51% less)</tspan></text>
<line x1="250" y1="96" x2="250" y2="352" stroke="#3a5a72" stroke-width="1.5"/>
<rect x="250" y="370" width="26" height="12" fill="#52697a"/>
<text x="284" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">fixed dose, 9 lb every regeneration</text>
<rect x="520" y="370" width="26" height="12" fill="#0e7490"/>
<text x="554" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">proportional brining</text>
<text x="30" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Illustrative: 15 gpg, 24,000 grains per regeneration, reserve of one day's expected use,</text>
<text x="30" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">14-day calendar regeneration while away. Proportional dose = 9 lb x share of capacity used.</text>
</svg>
