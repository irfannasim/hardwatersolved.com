<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="rdc-title rdc-desc">
<title id="rdc-title">Water softener discharge: what leaves the drain at each regeneration stage</title>
<desc id="rdc-desc">Water softener discharge by stage: backwash carries grit and iron particles, brine draw and slow rinse carry chloride, calcium, magnesium and excess sodium, fast rinse carries the remainder, and brine refill sends nothing to drain. Illustrative totals for one 6 lb regeneration.</desc>
<defs></defs>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">What leaves the drain line at each stage of regeneration</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Order of a typical downflow regeneration. Saltiness is qualitative.</text><rect class="box" x="30" y="88" width="166" height="52" rx="8" fill="#78716c" stroke="#78716c" stroke-width="2"/><text x="113" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">1  Backwash</text><text x="113" y="129" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">reverse flow</text><rect class="box" x="30" y="152" width="166" height="132" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="42" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Grit and sediment</text><text x="42" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the bed caught</text><text x="42" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Captured iron</text><text x="42" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">particles</text><text x="42" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Very little salt</text><rect x="30" y="322" width="40" height="16" rx="4" fill="#7c3aed"/><rect class="box" x="208" y="88" width="166" height="52" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="291" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">2  Brine draw</text><text x="291" y="129" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">+ slow rinse</text><rect class="box" x="208" y="152" width="166" height="132" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="220" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Chloride from the</text><text x="220" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">salt</text><text x="220" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Calcium and</text><text x="220" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">magnesium off</text><text x="220" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the resin</text><text x="220" y="264" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Excess sodium</text><rect x="208" y="322" width="150" height="16" rx="4" fill="#7c3aed"/><rect class="box" x="386" y="88" width="166" height="52" rx="8" fill="#0e7490" stroke="#0e7490" stroke-width="2"/><text x="469" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">3  Fast rinse</text><text x="469" y="129" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#ffffff">downflow</text><rect class="box" x="386" y="152" width="166" height="132" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="398" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Leftover brine</text><text x="398" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">and the last of</text><text x="398" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the hardness</text><text x="398" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Salt falls to</text><text x="398" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">near zero</text><rect x="386" y="322" width="60" height="16" rx="4" fill="#7c3aed"/><rect class="box" x="564" y="88" width="166" height="52" rx="8" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="647" y="110" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">4  Brine refill</text><text x="647" y="129" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">no discharge</text><rect class="box" x="564" y="152" width="166" height="132" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="1.5"/><text x="576" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Fresh water refills</text><text x="576" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the brine tank.</text><text x="576" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Nothing goes to</text><text x="576" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the drain unless</text><text x="576" y="246" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the tank overflows</text><text x="564" y="335" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">none</text><text x="30" y="312" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#52697a">Saltiness of the drain water</text><rect class="box" x="30" y="360" width="700" height="164" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">Illustrative totals for one regeneration</text><text x="46" y="404" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">1 cu ft of resin, 6 lb of salt, 22,930 grains of capacity restored (Hellenbrand table). Calculated, not measured.</text><text x="46" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#7c3aed">Chloride: about 3.6 lb, which is all of the chloride in the salt</text><text x="46" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Calcium and magnesium: about 3.3 lb, expressed as calcium carbonate</text><text x="46" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Sodium: about 0.85 lb in the waste. About 1.5 lb stays on the resin and reaches the drain later via your taps.</text><text x="46" y="496" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Water: 20 to 70 gallons per regeneration for a typical softener (EPA WaterSense)</text>
</svg>
