<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" width="760" height="550" role="img" aria-labelledby="gt-title gt-desc">
<title id="gt-title">Iron glass test at 0, 5, 15 and 30 minutes: ferrous vs ferric</title>
<desc id="gt-desc">Diagram of the well water iron glass test photographed at 0, 5, 15 and 30 minutes beside a reference glass: dissolved ferrous iron starts clear and turns orange, oxidized ferric iron is colored at the tap and settles, and a mix deepens.</desc>
<defs></defs>
<rect width="760" height="550" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0b2f4a">Iron glass test: what each photo shows</text><text x="30" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Observation points to photograph, not pass/fail thresholds. Timing varies by well.</text><text x="230" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">reference</text><text x="230" y="134" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#52697a">bottled water</text><text x="340" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">0 min</text><text x="460" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">5 min</text><text x="580" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">15 min</text><text x="700" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">30 min</text><text x="30" y="196" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Dissolved</tspan></text><text x="30" y="215" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">ferrous iron:</text><text x="30" y="234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">clear, then orange</text><path d="M200,172 L260,172 L253,256 L207,256 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M201.5,184 L258.5,184 L253,255 L207,255 z" fill="#f1f5f9"/><path d="M310,172 L370,172 L363,256 L317,256 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M311.5,184 L368.5,184 L363,255 L317,255 z" fill="#f1f5f9"/><path d="M430,172 L490,172 L483,256 L437,256 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M431.5,184 L488.5,184 L483,255 L437,255 z" fill="#f1f5f9"/><path d="M431.5,184 L488.5,184 L483,255 L437,255 z" fill="#b45309" opacity="0.12"/><path d="M550,172 L610,172 L603,256 L557,256 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M551.5,184 L608.5,184 L603,255 L557,255 z" fill="#f1f5f9"/><path d="M551.5,184 L608.5,184 L603,255 L557,255 z" fill="#b45309" opacity="0.24"/><path d="M670,172 L730,172 L723,256 L677,256 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M671.5,184 L728.5,184 L723,255 L677,255 z" fill="#f1f5f9"/><path d="M671.5,184 L728.5,184 L723,255 L677,255 z" fill="#b45309" opacity="0.06"/><path d="M677,255 L723,255 L722.3,248 L677.7,248 z" fill="#b45309"/><text x="30" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a"><tspan font-weight="bold">Oxidized</tspan></text><text x="30" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">ferric iron:</text><text x="30" y="354" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">colored at the tap</text><path d="M200,292 L260,292 L253,376 L207,376 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M201.5,304 L258.5,304 L253,375 L207,375 z" fill="#f1f5f9"/><path d="M310,292 L370,292 L363,376 L317,376 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M311.5,304 L368.5,304 L363,375 L317,375 z" fill="#f1f5f9"/><path d="M311.5,304 L368.5,304 L363,375 L317,375 z" fill="#b45309" opacity="0.36"/><circle cx="326" cy="314" r="2.5" fill="#b45309"/><circle cx="346" cy="324" r="2.5" fill="#b45309"/><circle cx="356" cy="334" r="2.5" fill="