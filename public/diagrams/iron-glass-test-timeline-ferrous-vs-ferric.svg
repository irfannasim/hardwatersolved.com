ont-weight="normal" text-anchor="start" fill="#0b2f4a">deepens</text><path d="M200,412 L260,412 L253,496 L207,496 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M201.5,424 L258.5,424 L253,495 L207,495 z" fill="#f1f5f9"/><path d="M310,412 L370,412 L363,496 L317,496 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M311.5,424 L368.5,424 L363,495 L317,495 z" fill="#f1f5f9"/><path d="M311.5,424 L368.5,424 L363,495 L317,495 z" fill="#b45309" opacity="0.14"/><path d="M430,412 L490,412 L483,496 L437,496 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M431.5,424 L488.5,424 L483,495 L437,495 z" fill="#f1f5f9"/><path d="M431.5,424 L488.5,424 L483,495 L437,495 z" fill="#b45309" opacity="0.22"/><path d="M550,412 L610,412 L603,496 L557,496 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M551.5,424 L608.5,424 L603,495 L557,495 z" fill="#f1f5f9"/><path d="M551.5,424 L608.5,424 L603,495 L557,495 z" fill="#b45309" opacity="0.3"/><path d="M670,412 L730,412 L723,496 L677,496 z" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><path d="M671.5,424 L728.5,424 L723,495 L677,495 z" fill="#f1f5f9"/><path d="M671.5,424 L728.5,424 L723,495 L677,495 z" fill="#b45309" opacity="0.4"/><path d="M285,104 L285,500" stroke="#e2e8f0" stroke-width="1.5"/><text x="30" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0b2f4a">The glass shows the form of the iron. A lab gives the amount.</text>
