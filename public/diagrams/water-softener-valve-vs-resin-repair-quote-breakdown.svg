<text x="700" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$800</text>
<text x="186" y="132" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="end" fill="#0b2f4a">Control valve</text>
<text x="186" y="151" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">replace the whole head</text>
<rect x="200.0" y="108" width="206.3" height="52" fill="#0b2f4a"/>
<text x="303.1" y="139" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">$330</text>
