<text x="325" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$200</text>
<path d="M450,92 L450,268" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="450" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$400</text>
