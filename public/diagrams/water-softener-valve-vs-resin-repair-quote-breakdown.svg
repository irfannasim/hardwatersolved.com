<text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#52697a">Illustrative mid-range figures; the part is under half of the installed price</text>
<path d="M200,92 L200,268" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<text x="200" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">$0</text>
