<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="g17qb-title g17qb-desc">
<title id="g17qb-title">Breakdown of an illustrative water softener control valve and resin replacement quote</title>
<desc id="g17qb-desc">Illustrative stacked bars splitting a $730 control valve replacement and a $685 resin replacement into part price, fittings or gravel, service call and labour, showing the part is under half of the installed water softener repair cost.</desc>
<rect width="760" height="400" fill="#ffffff"/>
