<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img" aria-labelledby="ecl-title ecl-desc">
<title id="ecl-title">EcoPure EPHS hybrid softener: how long the built-in carbon lasts at each chlorine level</title>
<desc id="ecl-desc">Illustrative chart for an EcoPure water softener review: the EPHS manual rates its non-replaceable carbon at 2,280,000 gallons at 0.5 ppm chlorine down to 570,000 gallons at 2.0 ppm, which for a family using 300 gallons a day is about 21 years at 0.5 ppm, 10 years at 1.0 ppm and 5 years at 2.0 ppm.</desc>
<rect width="760" height="540" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">EPHS carbon "never needs changing", but it runs out</text>
<text x="30" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Years of chlorine taste and odor reduction for a family using 300 gal a day. Illustrative, from the manual's ratings.</text>
<path class="ln" d="M130,120 L130,420 L670,420" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M123,420 L130,420 M123,351.8 L130,351.8 M123,283.6 L130,283.6 M123,215.5 L130,215.5 M123,147.3 L130,147.3" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<text x="116" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">0</text>
<text x="116" y="356.8" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">5</text>
<text x="116" y="288.6" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">10</text>
<text x="116" y="220.5" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">15</text>
<text x="116" y="152.3" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="end" fill="#52697a">20 yrs</text>
<rect x="150" y="136.4" width="70" height="283.6" fill="#0e7490"/>
<rect x="260" y="230.4" width="70" height="189.6" fill="#0e7490"/>
<rect x="370" y="278.2" width="70" height="141.8" fill="#0e7490"/>
<rect x="480" y="325.9" width="70" height="94.1" fill="#c2410c"/>
<rect x="590" y="349.1" width="70" height="70.9" fill="#c2410c"/>
<path class="ln" d="M130,283.6 L670,283.6" fill="none" stroke="#52697a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="185" y="126" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">20.8</text>
<text x="295" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">13.9</text>
<text x="405" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">10.4</text>
<text x="515" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">6.9</text>
<text x="625" y="339" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">5.2</text>
<text x="185" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">0.5 ppm</text>
<text x="295" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">0.75 ppm</text>
<text x="405" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">1.0 ppm</text>
<text x="515" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">1.5 ppm</text>
<text x="625" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#0b2f4a">2.0 ppm</text>
<text x="185" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">2.28M gal</text>
<text x="295" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1.52M gal</text>
<text x="405" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">1.14M gal</text>
<text x="515" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">760k gal</text>
<text x="625" y="460" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">570k gal</text>
<text x="400" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">Chlorine in the supply, with the manual's rated carbon capacity</text>
<path class="ln" d="M30,514 L62,514" fill="none" stroke="#52697a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="70" y="519" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">10 years, the tank warranty. Orange bars: the carbon is spent well before the tanks are.</text>
</svg>
