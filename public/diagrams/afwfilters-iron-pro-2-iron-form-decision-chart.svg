<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 592" width="760" height="592" role="img" aria-labelledby="ip2d-title ip2d-desc">
<title id="ip2d-title">AFWFilters Iron Pro 2 decision chart: which iron it can and cannot remove</title>
<desc id="ip2d-desc">Four checks before buying the AFWFilters Iron Pro 2 softener: a glass test for ferric iron, signs of iron bacteria, pH above 6.7, and dissolved iron under 5 ppm with hardness of 3 to 20 gpg. Failing any check means an iron filter or other treatment comes first.</desc>
<defs><marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs>
<rect width="760" height="592" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">Before you buy an Iron Pro 2: is your iron the kind it removes?</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Work down the chain. Any red exit means the softener alone is the wrong tool.</text><rect class="box" x="30" y="92" width="400" height="66" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#0b2f4a">Glass test: is the water clear at the tap,</text><text x="46" y="140" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#0b2f4a">turning orange only after it stands?</text><path class="ln" d="M430,125 L514,125" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-bad)"/><text x="475" y="113" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">No</text><rect class="box" x="520" y="92" width="210" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="534" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Ferric (oxidized) iron</text><text x="534" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Iron filter first</text><path class="ln" d="M90,158 L90,190" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-ok)"/><text x="106" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Yes</text><rect class="box" x="30" y="196" width="400" height="66" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#0b2f4a">Slime or red-brown gel in the toilet</text><text x="46" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#0b2f4a">tank, or a swampy smell?</text><path class="ln" d="M430,229 L514,229" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-bad)"/><text x="475" y="217" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">Yes</text><rect class="box" x="520" y="196" width="210" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="534" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Iron bacteria</text><text x="534" y="246" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Shock-chlorinate, then filter</text><path class="ln" d="M90,262 L90,294" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-ok)"/><text x="106" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">No</text><rect class="box" x="30" y="300" width="400" height="66" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="338" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#0b2f4a">Is the pH above 6.7?</text><path class="ln" d="M430,333 L514,333" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-bad)"/><text x="475" y="321" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">No</text><rect class="box" x="520" y="300" width="210" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="534" y="328" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Low pH</text><text x="534" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Correct pH or filter first</text><path class="ln" d="M90,366 L90,398" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-ok)"/><text x="106" y="390" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Yes</text><rect class="box" x="30" y="404" width="400" height="66" rx="6" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/><text x="46" y="432" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#0b2f4a">Dissolved iron under 5 ppm and</text><text x="46" y="452" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#0b2f4a">hardness between 3 and 20 gpg?</text><path class="ln" d="M430,437 L514,437" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-bad)"/><text x="475" y="425" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">No</text><rect class="box" x="520" y="404" width="210" height="66" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="534" y="432" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#dc2626">Outside softener guidance</text><text x="534" y="454" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Iron filter ahead of softener</text><path class="ln" d="M90,470 L90,502" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-ok)"/><text x="106" y="494" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Yes</text><rect class="box" x="30" y="508" width="700" height="60" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="46" y="534" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#15803d">Ferrous iron the Iron Pro 2 can exchange</text><text x="46" y="555" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#0b2f4a">Size it on compensated hardness and set a 3-day regeneration override</text>
</svg>
