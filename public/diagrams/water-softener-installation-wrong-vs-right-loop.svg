<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 654" width="760" height="654" role="img" aria-labelledby="wswr-title wswr-desc">
<title id="wswr-title">Water softener installation: wrong vs right loop layout</title>
<desc id="wswr-desc">Two water softener installation layouts. Wrong: supply on the outlet port, outdoor tap after the softener, drain hose pushed into the standpipe and no bonding jumper. Right: supply on the inlet, outdoor tap before the softener, drain air gap and a bonding jumper.</desc>
<defs><marker id="wswr-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="wswr-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="wswr-d" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker></defs>
<rect width="760" height="654" fill="#ffffff"/>
<text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">The same softener loop, installed wrong and right</text><text x="30" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Four of the twelve mistakes can be seen from one spot in the utility room.</text><rect class="box" x="30" y="86" width="700" height="250" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="46" y="112" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#dc2626">WRONG</text><text x="46" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from main</text><path class="ln" d="M46,166 L250,166" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="144" width="110" height="80" rx="8" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/><text x="305" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text><text x="262" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#dc2626">OUT</text><text x="348" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#dc2626">IN</text><path class="ln" d="M360,166 L520,166" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wswr-h)"/><text x="470" y="152" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to house</text><path class="ln" d="M440,166 L440,224" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wswr-h)"/><text x="452" y="216" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">outdoor tap</text><path class="ln" d="M305,224 L305,262 L400,262" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="392" y="286" width="22" height="40" fill="#e7e5e4" stroke="#78716c" stroke-width="2"/><path class="ln" d="M400,262 L403,262 L403,312" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="426" y="280" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">hose pushed into</text><text x="426" y="297" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#dc2626">the standpipe</text><text x="294" y="254" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">drain</text><text x="305" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#dc2626">no bonding jumper</text><rect class="box" x="546" y="126" width="172" height="196" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="556" y="148" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">1. Supply on the OUT port</text><text x="556" y="177" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">2. Outdoor tap on the</text><text x="556" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">softened side</text><text x="556" y="223" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">3. Drain hose sealed into</text><text x="556" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">the standpipe</text><text x="556" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">4. Metal pipe continuity</text><text x="556" y="286" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">broken</text><rect class="box" x="30" y="356" width="700" height="250" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="46" y="382" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#15803d">RIGHT</text><text x="46" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from main</text><path class="ln" d="M46,436 L250,436" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="414" width="110" height="80" rx="8" fill="#f6ead2" stroke="#3a5a72" stroke-width="2"/><text x="305" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener</text><text x="262" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#15803d">IN</text><text x="348" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#15803d">OUT</text><path class="ln" d="M360,436 L520,436" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wswr-s)"/><text x="470" y="422" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to house</text><path class="ln" d="M130,436 L130,494" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wswr-h)"/><text x="142" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">outdoor tap</text><path class="ln" d="M305,494 L305,532 L400,532" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="392" y="556" width="22" height="40" fill="#e7e5e4" stroke="#78716c" stroke-width="2"/><path class="ln" d="M400,532 L403,532" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M403,532 L403,542" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wswr-d)"/><text x="426" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">air gap above</text><text x="426" y="567" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#15803d">the standpipe</text><text x="294" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">drain</text><path class="ln" d="M225,428 L225,394 L385,394 L385,428" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/><text x="305" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">bonding jumper</text><rect class="box" x="546" y="396" width="172" height="196" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="556" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">1. Supply on the IN port</text><text x="556" y="447" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">2. Outdoor tap teed off</text><text x="556" y="464" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">before the softener</text><text x="556" y="493" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">3. Drain ends above the</text><text x="556" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">standpipe: air gap</text><text x="556" y="539" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">4. Jumper bridges the</text><text x="556" y="556" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">metal pipe</text><rect x="30" y="626" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated water</text><rect x="200" y="626" width="26" height="6" rx="3" fill="#0e7490"/><text x="234" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text><rect x="370" y="626" width="26" height="6" rx="3" fill="#78716c"/><text x="404" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">to drain</text><line x1="500" y1="630" x2="526" y2="630" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/><text x="534" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bonding jumper</text>
</svg>
