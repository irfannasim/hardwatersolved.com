<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="760" height="660" role="img" aria-labelledby="dvo-title dvo-desc">
<title id="dvo-title">Water softener drain line versus brine tank overflow hose running to the same floor drain</title>
<desc id="dvo-desc">Diagram of a water softener that is constantly draining, tracing two hoses to one floor drain: the drain line from the control valve head, which means a control valve fault, and the brine tank overflow from a barbed fitting below the brine tank lid, which means the brine tank is overfilling.</desc>
<defs><pattern id="dvo-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern><marker id="dvo-m78716c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#78716c"/></marker><pattern id="dvo-salt" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#f8fafc"/><rect x="2" y="2" width="7" height="6" rx="1.5" fill="#cbd5e1"/></pattern><marker id="dvo-m7c3aed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker></defs>
<rect width="760" height="660" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Which hose is running?</text>
<text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#52697a">Two hoses often end at the same floor drain. Follow the wet one back to its source.</text>
<rect x="30" y="440" width="700" height="3" fill="#cbd5e1"/>
<rect x="70" y="190" width="100" height="250" rx="22" fill="url(#dvo-beads)" stroke="#3a5a72" stroke-width="2"/>
<rect class="box" x="55" y="142" width="130" height="48" rx="8" fill="#0b2f4a"/>
<text x="120" y="171" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">CONTROL VALVE</text>
<text x="120" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">softener</text>
<rect x="141" y="126" width="18" height="16" rx="2" fill="#0b2f4a"/>
<text x="206" y="128" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">drain line flow control</text>
<path class="ln" d="M202,124 L162,132" fill="none" stroke="#52697a" stroke-width="1.2"/>
<path class="ln" d="M150,126 L150,100 L680,100 L680,398" fill="none" stroke="#78716c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dvo-m78716c)"/>
<text x="668" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#78716c">drain line</text>
<rect x="330" y="252" width="140" height="188" rx="6" fill="url(#dvo-salt)" stroke="#3a5a72" stroke-width="2"/>
<rect x="332" y="390" width="136" height="48" fill="#dbeafe"/>
<rect x="322" y="240" width="156" height="12" rx="3" fill="#e2e8f0" stroke="#3a5a72" stroke-width="2"/>
<text x="400" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">BRINE TANK</text>
<rect x="470" y="270" width="12" height="10" rx="2" fill="#0b2f4a"/>
<path class="ln" d="M482,275 L630,275 L630,398" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dvo-m7c3aed)"/>
<text x="490" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#7c3aed">overflow hose</text>
<text x="490" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">barbed fitting</text>
<text x="490" y="337" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">below the lid</text>
<rect x="610" y="436" width="90" height="10" rx="2" fill="#0b2f4a"/>
<text x="655" y="466" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">FLOOR DRAIN</text>
<text x="590" y="428" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">air gap</text>
<path class="ln" d="M594,424 L622,424" fill="none" stroke="#52697a" stroke-width="1.2"/>
<rect class="box" x="30" y="490" width="340" height="118" rx="10" fill="#f5f5f4" stroke="#78716c" stroke-width="2"/>
<text x="46" y="516" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">DRAIN LINE running</text>
<text x="46" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Connects at the control valve head, usually</text>
<text x="46" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">a small elbow on top or at the back.</text>
<text x="46" y="580" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">The control valve is sending water to drain.</text>
<rect class="box" x="390" y="490" width="340" height="118" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="406" y="516" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#0b2f4a">OVERFLOW running</text>
<text x="406" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A barbed fitting on the side of the brine</text>
<text x="406" y="560" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">tank, below the lid. The brine tank is</text>
<text x="406" y="580" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">overfilling: a different fault, different fix.</text>
<text x="30" y="636" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Both running at once: the valve position is the root cause, the overflow is the symptom.</text>
</svg>
