<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 568" width="760" height="568" role="img" aria-labelledby="gts-title gts-desc">
<title id="gts-title">Water softener gauge test: pressure gauges before and after the unit</title>
<desc id="gts-desc">Gauge test setup: gauge A on a hose bib before the water softener loop and gauge B on a tee after it, with a timed bucket at the fixtures. The pressure drop across the softener is A minus B at a known flow.</desc>
<defs><marker id="gts-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><pattern id="gts-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="568" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Gauge test: pressure before and after the softener</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Both gauges sit outside the softener loop, so the bypass is tested too</text><text x="30" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from main</text><text x="30" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">or well tank</text><path class="ln" d="M30,210 L226,210" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M140,206 L140,154" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="140" cy="126" r="28" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/><path d="M140,126 L154,110" stroke="#dc2626" stroke-width="2.5"/><text x="140" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">A</text><text x="140" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#c2410c">GAUGE A · before</text><text x="140" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">hose bib</text><rect x="226" y="150" width="280" height="248" rx="14" fill="none" stroke="#52697a" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="252" y="196" width="36" height="28" rx="4" fill="#fff" stroke="#3a5a72" stroke-width="2" /><path d="M258,202 L282,218 M258,218 L282,202" stroke="#3a5a72" stroke-width="2"/><text x="270" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">bypass valve</text><path class="ln" d="M226,210 L250,210" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M290,210 L320,210" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="320" y="188" width="150" height="44" rx="6" fill="#0b2f4a" /><text x="395" y="215" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">CONTROL VALVE</text><rect x="345" y="232" width="100" height="130" rx="18" fill="url(#gts-beads)" stroke="#3a5a72" stroke-width="2"/><text x="395" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">softener loop</text><path class="ln" d="M470,210 L620,210" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M560,206 L560,154" fill="none" stroke="#3a5a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="560" cy="126" r="28" fill="#ffffff" stroke="#3a5a72" stroke-width="3"/><path d="M560,126 L574,110" stroke="#dc2626" stroke-width="2.5"/><text x="560" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">B</text><text x="560" y="96" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0e7490">GAUGE B · after</text><text x="560" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">tee or test port</text><path class="ln" d="M620,210 L700,210" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gts-s)"/><text x="640" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">fixtures:</text>
<text x="640" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">tub spout,</text>
<text x="640" y="276" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">2nd fixture,</text>
<text x="640" y="294" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">washer fill</text><text x="640" y="328" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">time a 5-gal</text><text x="640" y="346" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">bucket → gpm</text><rect class="box" x="30" y="420" width="700" height="104" rx="8" fill="#f0f9fb" stroke="#0e7490" stroke-width="2"/><text x="50" y="448" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="start" fill="#0b2f4a">Drop across the unit = A − B</text><text x="50" y="474" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Example: static 60 / 60 psi.  At 6 gpm: A 55 psi, B 51 psi → about 4 psi.</text><text x="50" y="498" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">A also falls as flow rises: supply pipe, meter and main valve, not the softener.</text><rect x="30" y="544" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">before the softener</text>
<rect x="250" y="544" width="26" height="6" rx="3" fill="#0e7490"/><text x="284" y="552" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">after the softener</text>
</svg>
