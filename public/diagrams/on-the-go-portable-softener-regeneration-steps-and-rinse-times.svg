<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="ors-title ors-desc">
<title id="ors-title">On The Go portable water softener regeneration steps and rinse times</title>
<desc id="ors-desc">Six regeneration steps for the On The Go double portable water softener from the maker's instructions: shut off and disconnect, drain, add two boxes of table salt, slow rinse for 24 to 30 minutes, full-stream rinse for 6 to 8 minutes, then test for 0 to 3 gpg. The two rinses alone take 30 to 38 minutes.</desc>
<defs><marker id="ors-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52697a"/></marker></defs>
<rect width="760" height="560" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0b2f4a">Regenerating the On The Go double, step by step</text>
<text x="30" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">From the maker's regeneration instructions. Times are the maker's; steps without a time have none published.</text>
<rect class="box" x="30" y="90" width="210" height="104" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">1. Shut off</text>
<text x="46" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Turn the spigot off and</text>
<text x="46" y="161" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">disconnect both hoses</text>
<rect class="box" x="275" y="90" width="210" height="104" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="1.5"/>
<text x="291" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">2. Drain</text>
<text x="291" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Tilt or invert, cap on;</text>
<text x="291" y="161" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">tap the base to settle</text>
<text x="291" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">the resin</text>
<rect class="box" x="520" y="90" width="210" height="104" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="536" y="118" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">3. Add salt</text>
<text x="536" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Remove the top cap, pour</text>
<text x="536" y="161" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">in two full 26 oz boxes</text>
<text x="536" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">of table salt</text>
<path class="ln" d="M240,142 L271,142" fill="none" stroke="#52697a" stroke-width="5" marker-end="url(#ors-a)"/>
<path class="ln" d="M485,142 L516,142" fill="none" stroke="#52697a" stroke-width="5" marker-end="url(#ors-a)"/>
<path class="ln" d="M625,194 L625,214 L135,214 L135,232" fill="none" stroke="#52697a" stroke-width="5" marker-end="url(#ors-a)"/>
<rect class="box" x="30" y="236" width="210" height="104" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="46" y="264" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7c3aed">4. Slow rinse</text>
<text x="46" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Pencil-thin stream that</text>
<text x="46" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">just clears the tank side</text>
<text x="46" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7c3aed">24 to 30 min</text>
<rect class="box" x="275" y="236" width="210" height="104" rx="8" fill="#f8fafc" stroke="#78716c" stroke-width="1.5"/>
<text x="291" y="264" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#78716c">5. Full-stream rinse</text>
<text x="291" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Spigot fully open, to</text>
<text x="291" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">waste, not the RV</text>
<text x="291" y="328" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#78716c">6 to 8 min</text>
<rect class="box" x="520" y="236" width="210" height="104" rx="8" fill="#ecfeff" stroke="#0e7490" stroke-width="1.5"/>
<text x="536" y="264" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0e7490">6. Test, reconnect</text>
<text x="536" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">Strip should read 0 to 3</text>
<text x="536" y="307" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0b2f4a">gpg with no salty taste</text>
<path class="ln" d="M240,288 L271,288" fill="none" stroke="#52697a" stroke-width="5" marker-end="url(#ors-a)"/>
<path class="ln" d="M485,288 L516,288" fill="none" stroke="#52697a" stroke-width="5" marker-end="url(#ors-a)"/>
<text x="30" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0b2f4a">Rinse time alone, double model</text>
<rect x="150" y="410" width="420" height="30" fill="#7c3aed"/>
<rect x="570" y="410" width="112" height="30" fill="#78716c"/>
<text x="360" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Slow rinse 24 to 30 min</text>
<text x="30" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Longest case</text>
<path class="ln" d="M150,462 L710,462" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<path class="ln" d="M150,462 L150,469 M290,462 L290,469 M430,462 L430,469 M570,462 L570,469 M710,462 L710,469" fill="none" stroke="#3a5a72" stroke-width="1.5"/>
<text x="150" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">0</text>
<text x="290" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">10</text>
<text x="430" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">20</text>
<text x="570" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">30</text>
<text x="710" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#52697a">40 min</text>
<text x="30" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0b2f4a">Grey: full-stream rinse 6 to 8 min. Total rinse 30 to 38 min, against the listing's "less than 30 minutes".</text>
<text x="30" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#52697a">Draining, adding salt and testing come on top, so budget about 45 minutes on arrival day.</text>
</svg>
