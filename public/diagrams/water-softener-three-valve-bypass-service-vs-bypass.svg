<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 528" width="760" height="528" role="img" aria-labelledby="tvbsv-title tvbsv-desc">
<title id="tvbsv-title">Water softener three-valve bypass: service vs bypass valve positions</title>
<desc id="tvbsv-desc">Water softener three-valve bypass loop. In service the inlet and outlet valves are open and the middle bypass valve closed; in bypass the inlet and outlet close and the bypass valve opens, sending untreated water around the softener to the house.</desc>
<defs><marker id="tvbsv-h" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="tvbsv-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><pattern id="tvbsv-beads" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f6ead2"/><circle cx="5" cy="5" r="3" fill="#e2b865"/></pattern></defs>
<rect width="760" height="528" fill="#ffffff"/>
<text x="30" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Three-valve bypass loop: service vs bypass</text><text x="30" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Same plumbing in both panels; only the valve positions change</text><rect class="box" x="30" y="86" width="340" height="318" rx="8" fill="#ffffff" stroke="#0e7490" stroke-width="2"/><text x="200" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#0e7490">IN SERVICE</text><text x="46" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from main</text><text x="354" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">to house</text><path class="ln" d="M46,176 L90,176" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M90,176 L184,176" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M216,176 L310,176" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M310,176 L348,176" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tvbsv-s)"/><path d="M187,166 L213,186 L213,166 L187,186 z" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="200" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">bypass valve</text><text x="200" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc2626">CLOSED</text><path class="ln" d="M90,176 L90,242" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M90,270 L90,312 L156,312" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M244,312 L310,312 L310,270" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M310,242 L310,176" fill="none" stroke="#0e7490" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M80,243 L100,269 L80,269 L100,243 z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><path d="M300,243 L320,269 L300,269 L320,243 z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="108" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">inlet</text><text x="108" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">OPEN</text><text x="292" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">outlet</text><text x="292" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#15803d">OPEN</text><rect x="158" y="276" width="84" height="80" rx="16" fill="url(#tvbsv-beads)" stroke="#3a5a72" stroke-width="2"/><text x="200" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">water through softener</text><rect class="box" x="390" y="86" width="340" height="318" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="560" y="114" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#c2410c">IN BYPASS</text><text x="406" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">from main</text><text x="714" y="162" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">to house</text><path class="ln" d="M406,176 L450,176" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M450,176 L544,176" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M576,176 L670,176" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M670,176 L708,176" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tvbsv-h)"/><path d="M547,166 L573,186 L573,166 L547,186 z" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="560" y="210" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#52697a">bypass valve</text><text x="560" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803d">OPEN</text><path class="ln" d="M450,176 L450,242" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M450,270 L450,312 L516,312" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M604,312 L670,312 L670,270" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path class="ln" d="M670,242 L670,176" fill="none" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,243 L460,269 L440,269 L460,243 z" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><path d="M660,243 L680,269 L660,269 L680,243 z" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="468" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">inlet</text><text x="468" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">CLOSED</text><text x="652" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">outlet</text><text x="652" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#dc2626">CLOSED</text><rect x="518" y="276" width="84" height="80" rx="16" fill="url(#tvbsv-beads)" stroke="#3a5a72" stroke-width="2"/><text x="560" y="378" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">softener isolated</text><rect class="box" x="30" y="422" width="700" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="48" y="448" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Single lever, push-pull or two-knob bypass: move it fully until it stops.</text><text x="48" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">A bypass left between positions is behind most no-water calls after installation.</text><rect x="30" y="504" width="26" height="6" rx="3" fill="#c2410c"/><text x="64" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">untreated water</text>
<rect x="220" y="504" width="26" height="6" rx="3" fill="#0e7490"/><text x="254" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">softened water</text>
<rect x="410" y="504" width="26" height="6" rx="3" fill="#cbd5e1"/><text x="444" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">no flow</text>
</svg>
