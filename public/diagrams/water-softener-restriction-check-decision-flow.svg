<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 504" width="760" height="504" role="img" aria-labelledby="wrc-title wrc-desc">
<title id="wrc-title">How to check water softener restrictions for your home: sewer or septic decision flow</title>
<desc id="wrc-desc">Decision flow for checking water softener restrictions: sewer homes ask the sewer or sanitation district about ordinances, septic homes ask the county health department or state onsite program, and each answer leads to compliant options such as exchange service, salt-free treatment or an efficient demand-initiated unit.</desc>
<defs><marker id="wrc-a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a5a72"/></marker></defs>
<rect width="760" height="504" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#0b2f4a">How to check whether a softener is allowed where you live</text><text x="30" y="64" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Start with where the regeneration water will go. That decides who writes the rule.</text><rect class="box" x="200" y="78" width="360" height="44" rx="8" fill="#f8fafc" stroke="#3a5a72" stroke-width="2"/><text x="380" y="106" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Where will the regeneration water go?</text><path class="ln" d="M200,126 L200,146" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrc-a)"/><path class="ln" d="M560,126 L560,146" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrc-a)"/><rect class="box" x="30" y="154" width="340" height="40" rx="8" fill="#78716c" stroke="#78716c" stroke-width="2"/><text x="200" y="179" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Community sewer</text><rect class="box" x="390" y="154" width="340" height="40" rx="8" fill="#78716c" stroke="#78716c" stroke-width="2"/><text x="560" y="179" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Septic system</text><path class="ln" d="M200,198 L200,216" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrc-a)"/><path class="ln" d="M560,198 L560,216" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrc-a)"/><rect class="box" x="30" y="224" width="340" height="60" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="200" y="249" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Ask the sewer or sanitation district:</text><text x="200" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">is there a softener ordinance?</text><rect class="box" x="390" y="224" width="340" height="60" rx="8" fill="#ffffff" stroke="#3a5a72" stroke-width="2"/><text x="560" y="249" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0b2f4a">Ask the county health department or</text><text x="560" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#0b2f4a">state onsite program: backwash allowed?</text><path class="ln" d="M111,288 L111,314" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrc-a)"/><rect class="box" x="30" y="322" width="162" height="136" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/><text x="42" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Restricted</text><text x="42" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Portable exchange</text><text x="42" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">service, a salt-free</text><text x="42" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">conditioner, or the</text><text x="42" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">efficient unit the</text><text x="42" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">rule still allows</text><path class="ln" d="M289,288 L289,314" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrc-a)"/><rect class="box" x="208" y="322" width="162" height="136" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="220" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">No ordinance</text><text x="220" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Still meet state rules.</text><text x="220" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">In California: demand-</text><text x="220" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">initiated, certified at</text><text x="220" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">4,000+ grains per lb.</text><text x="220" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Pull any permit.</text><path class="ln" d="M471,288 L471,314" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrc-a)"/><rect class="box" x="390" y="322" width="162" height="136" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/><text x="402" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#dc2626">Not allowed</text><text x="402" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Exchange service,</text><text x="402" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">salt-free, or a</text><text x="402" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">separately permitted</text><text x="402" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">outlet if one is</text><text x="402" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">approved</text><path class="ln" d="M649,288 L649,314" fill="none" stroke="#3a5a72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wrc-a)"/><rect class="box" x="568" y="322" width="162" height="136" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/><text x="580" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#15803d">Allowed</text><text x="580" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Choose an efficient,</text><text x="580" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">demand-initiated unit.</text><text x="580" y="402" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Aerobic unit? Read</text><text x="580" y="420" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">its manual before</text><text x="580" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">connecting.</text><text x="30" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Get the answer in writing, and ask when the rule was last updated.</text>
</svg>
