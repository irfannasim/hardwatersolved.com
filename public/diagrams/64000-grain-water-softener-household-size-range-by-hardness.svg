<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="g64-title g64-desc">
<title id="g64-title">Household size range for a 64,000 grain water softener by hardness</title>
<desc id="g64-desc">Range chart showing which household sizes suit a 64,000 grain water softener at 10 to 30 gpg: about six people at 10 gpg, four at 15 gpg, three at 20 and 25 gpg and two at 30 gpg, with oversized, override and too-small zones.</desc>
<defs></defs>
<rect width="760" height="620" fill="#ffffff"/>
<text x="30" y="40" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#0b2f4a">Who needs a 64,000 grain water softener?</text>
<text x="30" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Household sizes that suit about 40,000 usable grains (6 lb of salt per cu ft), 75 gallons per person a day</text>
<rect x="30" y="81" width="16" height="14" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
<text x="54" y="93" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Right size: 3 to 8 days between regenerations</text>
<rect x="395" y="81" width="16" height="14" fill="#fef08a" stroke="#a16207" stroke-width="1.5"/>
<text x="419" y="93" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Workable with a 14-day override: 8 to 14 days</text>
<rect x="30" y="103" width="16" height="14" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<text x="54" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Too small: under 3 days, look at 80k or twin tank</text>
<rect x="395" y="103" width="16" height="14" fill="#f1f5f9" stroke="#52697a" stroke-width="1.5"/>
<text x="419" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0b2f4a">Oversized: over 14 days</text>
<text x="100" y="505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">0</text>
<path d="M110,450 L700,450" stroke="#e2e8f0" stroke-width="1"/>
<text x="100" y="455" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">2</text>
<path d="M110,400 L700,400" stroke="#e2e8f0" stroke-width="1"/>
<text x="100" y="405" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">4</text>
<path d="M110,350 L700,350" stroke="#e2e8f0" stroke-width="1"/>
<text x="100" y="355" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#52697a">6</text>
