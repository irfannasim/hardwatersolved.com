<text x="523" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">from 3 people</text>
<rect x="609" y="470.3703703703704" width="64" height="29.62962962962962" fill="#f1f5f9" stroke="none" stroke-width="1.5"/>
