<rect x="609" y="150" width="64" height="238.88888888888886" fill="#fecaca" stroke="none" stroke-width="1.5"/>
<text x="641" y="522" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b2f4a">30 gpg</text>
<text x="641" y="540" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#15803d">from 2 people</text>
<path d="M110,144 L110,500 L700,500" fill="none" stroke="#3a5a72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="572" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Green labels: the smallest household that keeps a 64k at 8 days or less. Below that, 48k is the better size.</text>
<text x="30" y="592" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#52697a">Add about 4 gpg per 1 ppm of dissolved iron before reading the chart.</text>
</svg>
